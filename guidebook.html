0人ほどで手繰り寄せる際に唄います。時に70トン近\nくになる網を1時間ほどで枠網の中に入れてしまいます。枠網は、枠船の下方、海中\nにぶら下げられたかたちの網です。魚群の入った身綱が起船側から枠船側に起こさ\nれて、身網からこの枠網に魚群が落としこまれます。\n起船側で待機していた漁夫は､｢起こせ｣の合図とともに一斉に網を手繰り寄せます。\n木遣り音頭は、網おこしの唄に続いて唄います。枠網の中に、魚群を落とし込む\n際に唄うもので、最も力を込める作業です。木遣り音頭は「キリ声」ともI1平ばれ、\n漁夫の士気を高め、また一定の休みを与えて疲れを少なくさせるll1で、熟練の技が\n必要とされました。\n枠網が満杯になれば、次の替り枠船がつながれます。枠船は自身で海岸近くまで\n航行するか、川lll奇船で曳航されます。\n●鰊を枠船へ（沖揚げ音頭（ソーラン節)）\n・ 鯉蟹雛－－\nソーラン節として広く知られた唄です。この唄\nは汲船に乗り込んだ船頭の他、10名ほどで唄うも\nので、枠網の中に大タモを差し入れてニシンを汲\n船へ汲み上げる際に唄いました。大タモは屈強な\n若者が柄を持って操作し、汲船側の3～4名がヤ\nシャカギという先端がカギ状の棒で引っ張り上げ、\n枠船側からはアンバイ棒で押して補助しました。\n鰊の陸揚げ（余市水産博物館蔵）\n汲船1艘には10～15石ほどが積みこめました。\n作業によって「ソーラン ソーラン」の数が変\n28"}, {"page": 29, "file": 1, "pdf_page": 38, "text": "●鰊\nわります。また､ときには性的な歌詞を即興で唄い、笑いでもって疲れを忘れさせよ\nうともしました。\n●網の手入れ（子はたき音頭）\n網の目をふさぐほど産み付けられた卵を網から落とすため、網を浜辺へ一度引き\n上げ、棒で網をllllいて卵を落とす作業の際に唄われました。\n『北海道の生業2漁業 諸職』山田健･矢島害･丹治輝著 昭和56年\n『北海道漁業史』北海道水産部漁業調査課編 昭和32年\n『北海道水産豫察調査報告』北海道庵内務部水産課 明治25年\n『小樽市史 第1-7巻』小樽市 昭和33年一平成5年\n『北海道開拓記念館研究報告』第39号 平成18年\n『鰊場物語』内田五郎著 昭和53年\n『創立20周年記念誌 かもめのあしあと』忍路鰊場の会 平成6年\n12．小樽の強み ネ\n小樽市内に居を構えた建網漁家は、市内の漁場\nだけでなく石狩湾や増毛、道北の各地方にも漁場\n天\nを所有した人がいました。例えば金子家は羽幌町\nの焼尻島、増毛町、利尻島に、1II本家は礼文島、\n利尻島、苫前町に、田中家は石狩市浜益に、井尻\n謝憧曲厚里陰能詑蒲噛里号藤家≦零\n、。’\nM…\nツク海沿岸の枝幸に、茨木家は増毛町雄冬に、広\n谷家はオホーツク海沿岸の宗谷や枝幸、積丹lll]美国に漁場を持っていました。\nこれら多くの漁家が遠隔地にも漁場を経営できたのは､qﾙ､樽を含む後志地方が他\n三\n地域と比べて長期間の安定した漁獲があったこと、魚肥の高い需要、これにより資\n金や設備を蓄え庵大きく成長できたことなどが理由と言えます。\n遠隔地の漁場渥営はﾘｽｸ分散の側面もあり、漁獲量の豊IX|の波が激しくなって\n良好な漁場が北へ移動すると、遠隔地の漁場も手に入れ、また資金や道具を他へ貸\nし与えて産物を集めるようになりました。\n小樽は産物が集まる場所であり、江戸|侍代からの航路やUl治末期以降の鉄道網な\nど流通網の要所であったこと、漁獲皆無となった道南地方の漁夫の確保が容易だっ\nたことは地理的な好条件といえます。\nクQ\nｰ､ノ"}, {"page": 30, "file": 1, "pdf_page": 39, "text": "●鰊\n口\n13．関連の商人\n■海産商\n粕といえば鰊粕のことを指していた時期、海産物の代表的な集積地だった小樽で\nも鰊粕は重要な移出品でした。\n大正から昭和の初め頃には、豊漁地帯が岩内から留萌までの海岸へと徐々に北へ\n移動しましたが、北海道日本海沿岸のほぼ中央に位置した小樽は地理的に有利な位\n置にあり、本州府県向けの製品移出港として長く中心的役割を担っていました。ま\nた樺太(サハリン)産の製品も小樽へ運ばれていたため、昭和10(1935)年頃までは小\n樽の海産商にとって鰊製品は重要な移出品で､この頃の海産商120～130軒中､魚肥を\n取り扱っていた海産商は30軒以上もありました。\n■漁網・わら工品\n小樽は鰊製品が集まるだけでなく、漁網やわら製品などの漁具を扱う商人も多く\nいました。\n鰊製品の移出先であり、漁夫の出身地でも 日本海側において整備されつつあ\nりましたが、江戸幕府になってから江戸一大坂間\nの南海路東北一大坂間の西海路､東北・蝦夷地一 〆－\n栄徳丸（小樽市総合博物館蔵）\n江戸間の東海路が整備されてきました。南海路に\nは菱垣廻船や榑廻船という船が、西海路には北前\n32"}, {"page": 33, "file": 1, "pdf_page": 42, "text": "船が活躍し、北前船はのちに蝦夷地へも進出して 、\n【コラムD\nいきました。\n｢くつだらねえ－」\n私達は日頃、批判的な意味を\n込めて｢下らない出来事」「下ら\nない奴｣などと表現しています。\nその語源は江戸元禄時代に都の\n江戸に出荷するには品質が悪い\nから「下らない」としたところ\nから派生しています。づまりそ\nれまでの都は京都・大阪でした\nので、「俺たちが中心｣という半\nば中華思想が京阪にあることが\n垣間見られます。\nちなみにJRの列車にも「下\nり」「上り」という表現がありま\nすが､これは東京を中心にして、\n東京から離れる方向を「下り」\nとし、その逆を「上り」として\nいます。ですから北海道の大都\n市は札幌ですが、小樽から札幌\n方面行きは「下り」になります。\n’ ’\n●北前船\n3．北前船の発祥\n蝦夷地と呼ばれた北海道で、北前船が仕入れる\n主な資源は何だったのでしょうか。平和な江戸時\n代になり、人口が増大することにより西日本にお\nける米・綿・藍・菜種などの農産物の生産向上が\n求められました。このための肥料として役立った\nのが北海道で大量にとれる鰊でした。鰊は漁獲さ\nれた浜で鰊粕に加工され、俵詰めして北前船で大\n坂まで運び販売されたのです。\n西海路は18世紀初頭、蝦夷地まで延長され、北\n海道一東北一北陸一山陰一瀬戸内一大坂という航\n路ができました。この北前船による商いを最初に\n担った商人は、近江商人やその船乗りであった北\n陸の人々でした。\nぞくげん\n近江商人は「近江泥棒・伊勢乞食」という俗諺\nがあるほど、商売に負欲あるいは堅実といわれ、\n彼らが船乗りに雇ったのが北陸地方の人々でした。\nこうして北陸の船が日本海から瀬戸内海に入り、\n蝦夷地と大坂を結ぶ廻船として北前船が生まれる\nことになりました。\n’\nｰノ\n〆 1\n●大型和船の種類\n大型和船＝弁財船\n北 前 船 大阪～蝦夷地\n菱垣廻船 大阪～江戸(運賃同盟）\n4．北前船の語源 樽 廻 船 大阪～江戸(四斗酒樽）\n－ノ 一\n「北前」という呼び名は、瀬戸内地方で山陰地方\nのことを「北前」と呼んでおり、江戸初期には越\n中(富山県)や出羽(山形県・秋田県)への出稼ぎ届\nけを「北前行」といい、そのような「北前」地方\nから瀬戸内に来る船だから「北前船」と呼ぶよう\nになったといわれています。\n天保年間(1830～1843)になると多くの商船が集\nまった大坂では、「北国(北陸)の船で北前航路につ\nく船」を北前船と呼び、他の航路の船と区別する\nつQ\nLノ0－ノ"}, {"page": 34, "file": 1, "pdf_page": 43, "text": "ようになりました。\n北前船の発祥である加賀の古老たちは、北前船\nのことを「パイ船」とか「ベンザイ船」とか「ベ\nザイ」などといい、たんに「千石船」ともいいま\nす。越前では「ドウバラカキ」ともいいます。\n●北前船\n5 北前船の商売の特徴\nID\n菱垣廻船や榑廻船が運搬目的であったのに対し、\n北前船は経済''1勺に優れた手法を用い、多くの有力\n船主を輩出しました。\nそれは「運賃積み」ではなく「買い積み」とい\nう方法でした。各地で買い集めた安い品物を有利\nな土地に運んで高く売る、つまり商売をしながら\n航海をする手法です。\n有力船主になるには、どこで何が不足で、どこ\nで何が豊かかという情報をつかみ、商いの成果を\n出さなければなりません。\n’\n6．北前船商法の系譜\n北陸地方の船乗りたちは近江商人に雇われ、彼\nらの商い手法を学びました。「持下り商法｣とか｢の\nこぎり商法｣という手法が、「商売をしながら航海\nする」手法になっていきました。\nしかし船乗りの給料はたいへん少ないうえ遭難\nも多い危険な仕事でした。ただ、積荷の約一割は\n船乗りの個人商売を認めるという、「切出し」「帆\n待ち」と呼ばれた抜け道がありました。北陸の船\n乗りたちはこれを利川することで金銭を蓄え独立\nしていったことがうかがえます。\n｜’\n蕊\n鱗\n7．北前船の寄港地と積荷\n最盛期の北前船は蝦夷地と大坂を往復していま\nした。大坂から蝦夷地に向かうのを「下り」、その\n34"}, {"page": 35, "file": 1, "pdf_page": 44, "text": "逆を「上り」といいました。積荷の内容も上り下\nりではまったく違います。下り荷は、米などの食\n糧・酒・衣類・塩・紙・砂糖などの生活必需品、\n上り荷は、鰊・鰊粕・数の子・昆布・イリコ・ホ\nシアワビなどの海産物でした。\n●北前船\n明治40(1907)年頃の北浜\n8．北前船の利益\n海岸沿いに倉庫が並ぶ\n（越崎コレクション)(小樽市総合博物館蔵）\n1航海における船主の利益は千両といわれ、今\n日の1.5億円に近かったといいます｡これは船1隻\nの利益なので、1人の船主が数隻所有していると\nr推芦⑥『…■ 雄らルー砦\n｜I\n2倍、3倍になっていきます。ただあくまでも成\n功した場合です。遭難や経営不振もあったでしょ\nうから、簡単な商売ではありませんでした。\nぞう\n航海において支払わなければならない費用を｢雑\nよき椿 じきばらい\n用金」といい、給金・税・祝儀等のf直払の口｣、\n一二\n弾\n一一\n釦\n米・味噌・薪等の「力閏まどの口｣、 航海用具の「足\n有幌町船入澗（小樽市総合博物館蔵）\n道具口｣、章・縄・柿渋等の「雑道具口｣、船の修\n理の「作事の口jなどがありました。\n北前船主は商機をとらえて、次から次へと航海\nをしていくので、1カ所に長く留まってはいられ\nません。しかし常に短期間で売りさばくことも難\nくらしき\nしく、蔵を持っている地元の商人に預ける「蔵敷」\nという経費もかかりました。\nそのため北前船主は売りさばきの多い港、たと\nえば小樽に倉庫を建て、人を雇用し、自ら蔵敷業\n務を行っていったのです。\nロ 侭一・恥-吟 睡 訂\n栄え行く小樽港内（小樽市総合博物館蔵）\n'9．北前船の衰亡\nヨ ー‐‐ －‐\nｰ ‐_ー園..'．\n一枚帆の木造船という北前船の構造は、江戸幕\n一二\n府の規制によるものでした。それは幕府が、諸藩\nによる軍事的な船の利用を恐れたためでした。\n慶長14 (1609)年諸大名に対する大船禁止、天保\nさんしよう\n13(1842)年三椿禁止令がそうですが､明治2(1869）\n年には西洋型風帆船や蒸気船の製造．買い入れが\nR －どき一＝‐三一一\n一 一 …\nー 帝 一一一 面 一\n選翰篭曳毒・\n肉\n小樽水天宮より港内を望む\n（小樽市総合博物館蔵）\n35"}, {"page": 36, "file": 1, "pdf_page": 45, "text": "許可され､同21(1888)年には500石以上の日本型船\nは危険なため建造禁止というまったく逆な法律が\n定められていきます。\nそうしたなかでも、北前船は明治後期まで大い\nに活躍しています｡西洋型風帆船が許可されても、\n建造費が高額ゆえ、そう簡単には手が出せなかっ\nたということでしょう。\n小樽港の古写真を見ても、明治後期になっても\n北前船の数が圧倒的に多いことがわかります。\nこのような船舶の近代化とともに、時代は商売\nの背景に大きな影を落としていきました。\n電話をはじめ通信技↑|f示発達し、情報が早く大\n量に行き交うようになってきたため、北前船商人\nの持っていた情報特権のような能力が功を奏しな\nくなってきます。\n鉄道路線の伸長により開拓のペースは上がり、\nこれまで以上に大量の物資運搬が求められ、蒸気\n一 へ\n船の時代になりました。\nさらに肥料として大きな価値を持ち「金肥」と\nいわれた鰊粕の原料となる鰊が､次第に不漁になっ\nてきました。綿花がインドから大量に輸入される\nようになり、明治29(1896)年の綿花輸入税撤廃で\n国産綿は次第に栽培されなくなってきました。つ\nまり鰊のllu料としての需要が激減してきたのです。\nこうして明治末期から、北前船による海運は衰\nえていきました。\n●北前船\n－ － 畠 二一 ＝\n小樽寄港の北前船\n（小樽市総合博物館奥山コレクション蔵）\n一一 夢魁\n1\n小樽港（小樽市総合博物館蔵）\n小樽港（小樽市総合博物館蔵）\n36"}, {"page": 37, "file": 1, "pdf_page": 46, "text": "、 ■■■■\n10．商人と小樽 【コラム】\n｢百年経たわびさび」\n加賀や越前の北前船主の本宅\nの造りは、小樽の倉庫の素朴な\n造りと異なり贄を尽くした内容\nになっています。徹密な宮大工\nの技術、欄間や床の間の優れた\nひのき デザイン、檜や石などの素材、\n掛け軸や屏風の芸術性などみな\n一級品ばかりであつらえられて\nごかしよう\nいます。また八幡や五箇荘など\nの近江商人の本宅も同様です。\nしかし彼らの本拠の自宅に比\nべて、出先の小樽の倉庫の構造\nは木骨を軟石で囲い瓦屋根と土\n間という合理性の極みになって\nいます。建築への考え方の差は\n歴然としていますが、百年経た\n今、誰もが憧れた当時の贄沢よ\nり、わびさびを醸すと同時に、\n小樽にしかない様式美を感じさ\nせてくれています。\n充分なお金を積んでできるこ\nとと、充分な智恵を出してでき\nることの差は、年月が経てば答\nえが見つかるのかも知れません。\n●北前船\nIﾘl治初期には小さな一漁村に過ぎなかった小樽\nに、さまざまな地域から商人が拠点を設けてきま\nした。\nそんきょう\n小樽には「榑僑」といわれる巨万の富を築いた\n商人が数多く活躍し、小樽に残る歴史的遺産の多\nくは彼らが創ってきました。\n彼らの出身地により、小樽にはこんな俗諺があり\nます。\nちならしおうみに たれまきまつまえ ひりようのかか1二 かりとI)えらご\n「地均近江 種蒔松前 肥料加賀 刈取越後」\n「地均近江」とは、江戸中期から後期にかけて近\n江商人が小樽地域に進出､鰊を独占的に扱い、「タ\nカシマ場所・オショロ場所｣を西川家、「オタルナ\nイ場所」を岡田家が仕切り、小樽地域の商業拠点\nを「地均し」してきたという意味です。\n「種蒔松前」とは、小樽に商業拠点の種蒔きをし\nたのが松前商人ということです。近江商人は松前\nを拠点にしており、鰊のとれる地域が南から北へ\n移動したのを追ってきた結果、小樽に移ってきま\nした。したがって、松前商人の元祖も近江商人と\nいえますが、小樽へ来たのは松前生まれの商人も\nいたという意味になります。\n「肥料力ll賀」とは、近江商人に船乗りとして雇わ ノ\nれていた北陸地方の人々が独立して北前船交易を\n盛んに行い、小樽の商業拠点を盤石なものにして\nいったことを意味しています。北陸地方は「加賀\n（石川県南部)」「越前(福井県)」「越中(富山県)」\nかえつのう\n「能登(石川県北部)」で通称「加越能」と呼ばれ、\n近江商人に対して加越能商人という言い方をして\nいます。その中を代表して力II賀商人が肥料を与え\nて小樽の全盛時代を築きました。\n「刈取越後」とは、同じ日本海西海路上にある越\n後(新潟県)商人が北前船交易に便乗しながら、堅\n実な商売を成功させてきたことを、「刈取｣という\n言葉で表現しています。\nつワ\nqノ／"}, {"page": 38, "file": 1, "pdf_page": 47, "text": "こうした小樽の商人の系譜は、北前船の歴史をよく反映していることがうかがえ\nます。\n●北前船\n11．小樽ゆかりの北前船羊 ’\nにしでまこざえもん かかしはした くまち\n●西出孫左衛門（石川県加賀市橋立町）\n西出家11代目孫左衛門は明治23(1890)年に橋立で北前船主だった5代目西谷庄八\n(西出の姉婿)とともに小樽に倉庫を建設、同26(1893)年開業式を挙行しました。現\n在の総合博物館運河館・観光協会・運河プラザなどが入っている小樽を代表する木\nしゃちほこ\n骨石造倉庫です。寄せ棟の瓦屋根に鮠を乗せた和洋折衷のデザインで、煉瓦造の事\n務所を中心として、中庭を開むように倉庫を配置しているのが特徴です。小樽倉庫\nは開業2年後の|司28(1895)年会社設立登記を行いました。これは法人としての北海\n道初の倉庫会社となりました。\n西出はのちに函館に転居、函館でも各種の企業に参mliしました。ちなみに現在の\n夜景で有名な函館II1はかつて西出の所有で1几i出山と呼ばれていました。\nにしやしこうばち\n●西谷庄八（石川県加賀市橋立町）\n橋立の北前船主の5代目西谷庄八は万延元(1860)年生まれ、小樽に進出したのは\n明治22(1889)年です。\n小樽\n－－、\n払曲」\n38"}, {"page": 39, "file": 1, "pdf_page": 48, "text": "さいおんじきんなる\n小樽倉庫の株主は西出孫左衛門・西園寺公成・\nいなづみしげあき ささきしん－凸凸 竜が1容亡で\n稲積重顕・佐々木慎思郎・中西出ハツ・西谷庄八・\nだけだのぷまさ にしでまごしろう\n武田信政・西出孫四郎の8人で、｜ﾘl治38 (1905)年\nやまもときゅうえもん\nにはLLI杢久右衝固が経営権を握りました。\n西谷は小樽倉庫を山本に讓った後も小樽に残り、\n西谷海運株式会社を設立、日露戦争後の海運発展\nに乗じ、「東洋一の回漕店｣といわれるようになり\n一一一\nました。II召和16 (1 のは輸送手段と情報収集でした。\n「A地域では何が不足していて何が豊かなのか、\nそしてB地域ではどうか、売るIIf期はいつか、値\nした◇\n段はどれくらいで売れるか」といった情報を収集、 ← 毎\n壁\n分析し、それらを流通させるための輸送手段を確\n保していきました。\n一■ 一一一 弐一 一邸 一全\n声一 筆〃\n争一 『 、坐 ●商\n人\n昭\n忍路港の鰊漁（小樽市総合博物館蔵）\n3．小樽商人の系譜\n小樽商人の勢いがいかに大きかったかを示す言\nかきょう そんきょう\n葉に、「華僑」ならぬ「榑僑」という表現さえあ\nります。鰊という有望な資源があったことや、石\n炭という資源の積出港であった小樽で商機をうま\nくとらえ、巨万の富を手にした商人が生まれてき\n■ 人鞘町暁刊 〔蛎榔\nました。 し必ロ“…■唯上ら＝ー\n1\nⅡ'’ 11\n■漁場開拓からはじまった近江商人\n小樽には、江戸時代中期から岡田家と西川家と\nいう近江商人が、鰊を資源とした商いをしていま\nした。\n有幌船入澗に係留する北前船\n彼らのこの時代の業務を見ると､知行主(松前藩\n（小樽市総合博物館蔵）\n士)から場所を任され､漁獲に必要な道具をそろえ、\n出稼ぎやアイヌの人たちを雇用して、漁業を行っ\nています。\nつまり場所という権利確保・漁獲(漁業）・力ll工\n(工業）・運搬・販売(商業)といった総合的な商い\nであったことがわかります。\nちなみに近江商人と伊勢商人は、日本の近世に\nおける商人の元祖ともいえるほどです。長い歴史\n一\n一\nを経て今も盛業中の近江商人が築いた主な企業は\n以下のとおりです。\n． －\n澳蓄~悪~F悪玉\nしにかわじんえもん しようのげんぞう\n西川仁右衛門の西川産業、正野玄三の日野薬品工業、\nたけだちょうくえ いいだしんしち 一 一\n武田長兵衛：武田薬品工業、飯田新七の高島屋(百貨店)、\nいと･ﾗ)ちゅうぺえ ひろせすけさぶろう\n伊藤忠兵衛の丸紅・伊藤忠商事、弘世助三郎の日本生命保\nつかもと二ういち 小樽港の出船入船 北前船\n険会社、塚本幸一のワコール\n（小樽市総合博物館蔵）\n47"}, {"page": 48, "file": 1, "pdf_page": 57, "text": "◎岡田家\nお か だ や ざ え も ん\n始祖岡田弥三石衛門は､永禄年間に近江国加茂村に生まれ､6代目まで弥三右衛門を雲名｡文化4(1807）\n年恵比須屋岡田源兵衛がオタルナイ場所請負として進出し、オコイパッチエイ(堺町)、クッタルウシ\n(有幌町付近)、ノブカ(信香)、アットマリ（勝納)、クマウス(熊碓)、アサリ(朝里)、ハリウス(張碓）\n場所を開拓しています。\nお か だ や そ じ\n第11代目岡田八十次(1820～1 907)は岡田家中興の祖で､小樽に大三岡田店を開き小樽郡内全域を掌\nこんたんまち\n握し金曇町、山ノ上町などの開発を進めました。\n(『北海道｢海｣の入国記』伊藤孝博著無明舎出版）\n(http://ikOi99・Web・infoseek.co・jp/nihonhen/oumikikou/oumiinfo.htmlより）\n(読みは『北海道蝦夷語地名解』北海道聯合教育會昭和2年より）\n●商\n人\n◎西川家\nにしかわでんえもん\n始祖西川伝右衛門は、寛永3(1626)年近江国八幡町に生まれ､慶安3(1650)年には松前に渡っていま\nす。天明6(1786)年住吉屋西川伝石衛門(松前藩御用達)がオショロ・タカシマ場所請負人として進出\nし、他にアツタ(厚田）・ウタスツ(歌棄）・イソヤ(磯谷）・ホロベツ(幌別)場所を開拓しています。\n(『北海道｢海｣の入国記』伊藤孝博著無明舎出版）\n(http : //ikoi99.web.infoseek.co.jp/nihonhen/oumikikou/oumiinfo・htmlより）\n(読みは『北海道蝦夷語地名解』北海道聯合教育會昭和2年より）\n１１凸■■■■１\nＩｊ ｒ ｉ\n…\n忍路の鰊漁（小樽市総合博物館蔵）\n48"}, {"page": 49, "file": 1, "pdf_page": 58, "text": "いしばしひこさふ/うう\n◎石橋彦三郎\n彦根生まれ｡明治8(1875)年に北海道へわたり色内町の兄\nの店で呉服問屋を始め、やがて醤油醸造に専念。丸ヨ石橋\n商店は有力な醤油醸造会社となりました。\nのく'ち\n北の誉酒造(酒泉館)の前身、マルヨ野口商店の始祖野口\nきちじろう とうじ\n吉次郎は杜氏として石橋商店で修行をして､暖簾分けで｢マ\nルヨ」の印をもらっています。\n奥沢1丁目には明治後期に建てられた石橋商店醤油工場群\nが残っています。\n(http://ikoi99.web.infoseek.co.jp/nihonhen/oumikikou/oumiinfo.\nhtmlより）\n●商\n人\n凸面け\n鰊加工場風景（小樽市総合博物館蔵）\nnfo. |\n－\n■鰊を追って北上した松前商人\n江戸中期から幕末にかけて、松前藩のあった福\n山地方には場所請負人として鰊の漁場を独占して\nいた近江商人がおり、松前で生まれて近江商人の\n手ほどきを受けた商人もいました。鰊はしだいに\n道南沿岸から道央沿岸へと、回遊コースが北上し\nたために､鰊を追って松前から小樽に拠点を移した\n商人もいました｡彼らを松前商人と呼んでいます。\n彼らの特徴は、漁業からはじまり、海運業や商\n業などへも進出、小樽でも成功をおさめて、財を\n成し、政治やまちづくりに貢献してきたことがあ\n信香町常夜灯（小樽市総合博物館蔵）\nげられます。\nかｵﾑこもとさぶろう\n◎金子元三郎\n金子家は代々松前の漁業家でしたが、明治18(1885)年色\n内町に初代金子元三郎が店を開きました。金子家の養子と\n呂\nなった越後生まれ松前育ちの金子元三郎は2代目です。\nなかえらようみん\n2代目元三郎は明治24(1891)年|こ主筆に中江兆民を招き、\n小樽で最初の新聞「北門新報」を発行します。同33(1900)\n年初代小樽区長になり、同37(1904)年衆議院議員選挙で当\n選､大正3(1914)年には憲政会北海道支部を結成し支部長に\n就任、貴族院議員にもなっています。\n市内緑にある直行寺は金子家が建立した菩提寺でした。\n堺町の旧金子元三郎商店には「北門新報」の印刷所として 旧石橋商店の印\nも使われていた石蔵が残っています。\n'\n49"}, {"page": 50, "file": 1, "pdf_page": 59, "text": "やまだへいぞう やま だ きち べえ ｢qｺﾗﾑD 、、\n◎山田兵蔵・山田吉兵衛\n兵蔵は、文化年代中頃(1810年前後)に来樽、元治2(1865） 「小樽市金満家名簿」\n年オタルナイ村の名主となりますが、小樽が村並になった\n昭和6(1931)年新年号『講談倶\nこの年は小樽の開基とされています｡安政3(1856)年に信香\n楽部』「小樽市金満家名簿｣にお\n町で呉服・瀬戸物・塗物・米・味噌・荒物などを扱う店を\nいたやみやきち\n開き､漁業も営み､和船2隻を所有して交易もしていました。 いて､トップはダントツで板谷宮吉\nふじやまようきち\n明治5(1872)年に没しますが、同3(1870)年に家督を養子吉 が資産5千万円、2位が藤山要吉\n兵衛に讓っています。 で桁が－つ落ちて5百万円､そし\n吉兵衛は松前藩の城下町福山に生まれ、山田兵蔵の養子 ’て3位に石橋彦三郎の4百万円と\nになり、家督を継いだ後、開拓使小樽出張所の金穀御用逹 あります｡当時の小樽市の一般・\nを勤めています。また同21（1888)年には港町で活版所を経 特別会計合わせて399万円ですか\n営しています。 ら､石橋の資産で小樽が1年食え\n明治15(1882)年1月､所有地の相生町から水天宮山の西裾 るという金額です。\nを通って堺町のオコバチ川までの道路造成を､427円全額を\nちなみに平成18年度の小樽市\n負担して行ったことに感謝した地元が､同19(1886)年5月山\nの総予算は1,162億円ですが､個\n田町と命名しました。\n人でそれほどの資産を持ってい\n明治28(1895)年に小樽商業会議所発起人会がスタートし\nる人が今いるでしょうか？まし\nた時の初代会頭に就任し､同35(1902)年には第2代小樽区長\nてその10倍の資産を持った人も\nになっています。\nいたのですから、小樽商人がど\nれほどスゴかつたかはまさに雲\nをつかむような感じです。｜\n~ ノ\n●商\n人\n－\n旧金子元三郎商店\n明治24(1891)年頃の小樽港図（小樽市総合博物館蔵）\n50"}, {"page": 51, "file": 1, "pdf_page": 60, "text": "－\n/ 、\nわたなくひょうしろう 【コラL】\n◎渡辺兵四郎\n渡辺は秋田県能代生まれ｡安政4(1857)年商用で秋田にやっ ｢会議所発起人」\nて来た山田兵蔵に連れられ、15歳で小樽に来ました。兵蔵\n明治28(1895)年\nに代わって明治24(1891)年には小樽郡の総代人も勤めまし\n小樽商業会議所設立発起人\nた。\n板谷 宮吉 林 清一\n独立は32歳と少し遅く、山田家の漁業のほか荒物商を営\n早川 両三 西谷 庄八\nみました。明治13(1880)年山田家総代理人になって、漁網\n堀井音次郎 渡辺兵四郎 の改良を手掛けるなどし、小樽漁業組合頭取・小樽水産組\n田口梅太郎 田中武左衛門\n合長と、水産業界の舵取り役を果たします。同23(1890)年\n第一渡辺精米、同25(1892)年第二渡辺精米を設立、精米業 高橋 直治 田巻 誠司\nをはじめています。商売から政界に転じ、区会議員から始 高野源之助 直江久兵衛\nまり、同35(1902)年道会議員となり、同41(1908)年衆議院 山田吉兵衛 町野清太郎\n議員。同45(1912)年5代目の小樽区長に就任し、長い間もめ 福長作太郎 遠藤又兵衛\nた明治の運河問題を解決しました。 新谷 喜作 塩田 安蔵\n鈴木市次郎の19人\n会頭に山田吉兵衛\n畠'｣会頭に渡辺兵四郎を選任\n「小樽商工会議所ホームページ｣より\n’\n●商\n人\n金子元三郎 山田吉兵衛 渡辺兵四郎 山本久右衛門\n(小樽市総合博物館蔵） (小樽市総合博物館蔵） (『小樽商工会議所百年史』より） （『小樽』より）\n51"}, {"page": 52, "file": 1, "pdf_page": 61, "text": "やまもとき;力うえもん こうぞう\n◎山本久右衛門・厚三\n山本久右衛門は陸奥田名部(胄森県)の出身です。天保12\n（1841)年に16歳で松前に渡り、米や味噌を商う店を開いて\nいます。\n養子の2代目久右衛門は焼尻・天売・利尻・礼文に漁場を\n開き、北前船交易を行い、明治になってから西洋型帆船4隻\nを買い入れ、商売を盛んにしていきました。\n同30(1897)年に雲名した養子の3代目久右衛門が同39(1906）\n年函館・瀬棚、同40(1907)年小樽・樺太、大正3(1914)年小\n樽・新潟・佐渡の航路を開いています。明治38(1905)年に\nは小樽倉庫株式会社の経営権を握りました。\n4代目にあたる厚三は明治14(1881)年長野県飯田の平沢家\nの三男として生まれ、同36(1903)年現一橋大学を出て山本\n家の養子となります。小樽倉庫・北日本汽船・小樽信託・\n帝国養蜂・大正製麻・大北火災・定山渓鉄道・北海道製綿\nなどの発起人や社長に就任しています。また区会議員・市\n会議員を経て､大正9(1920)年金子元三郎の支援で衆議院議\n員に初当選、以後8回も連続当選しています。\nしんじ\n小樽倉庫は厚三の次男信爾が継ぎ、昭和58(1983)年には\n小樽市が|日倉庫の建物を買い取り、右棟に総合博物館運河\n館、左棟に運河プラザ、中央棟に観光協会が入っています。\n小樽倉庫株式会社は今日も発展継承され、運河沿いの倉\n庫の一部はアレフ経営の小樽ビールがテナントとして再利\n用しています。\n●商\n人\n小樽ビール（小樽倉庫所有）\n小樽区公会堂（現小樽市公会堂）\n（小樽市総合博物館蔵）\n山本厚三 藤山要吉\n(『小樽商工会議所百年史』より） (『小樽』より）\n52"}, {"page": 53, "file": 1, "pdf_page": 62, "text": "一‐\n、\nふじやまようきち ＝\n◎藤山要吉\n嘉永4(1851)年秋田久保田町に生まれた要吉は､慶応3(1867） 『北海道加越能人名録』\nた な か ふ ざ え も ん\n年に17歳で松前の廻船問屋田中武左衛門に学び、同じく福\nふじやまじゅうぞう この人名録は大正5(1916)年に\n山から小樽に渡った信香町の廻船問屋藤山菫蔵（山田吉兵\n道内で広告掲載を呼びかけて応\n衛の親類)の養子となり､明治12(1879)年家督を継ぎました。\n募があった人物のみを掲載して\n小樽－北陸、小樽一稚内、小樽一越後の航路を開き、同37\n(1904)年の日露戦争に船を提供して財を築きます。漁業に いるので、応募しない人々も多\nも着目し主に道北に鰊漁場を開拓し、他|こ牧場・林業・鉱 くいたであろうことは充分想像\n業・倉庫業・銀行・不動産などを手がけ、明治44(1911)年 できますが、他市との比較はあ\nの東宮行啓に際しては東宮宿泊所(今の公会堂)を寄贈して る程度信頼できる数字と思われ\nいます。 ます。小樽が257人、函館が123\n市民会館に銅像が建立されています。北海製罐(株)電解 人、札幌が162人、旭川が81人と\n工場の倉庫は|日藤山倉庫です。 なっており、小樽にはダントツ\nで加越能出身者が多くいて、し\nかもそれなりの財を築いたこと\nが見えてきます。\nちなみにこの加越能は加賀・\n能登の石)||県と越中の富山県|こ\n限られています。広い意味での\n加越能にはこれに越前の福井県\nも加わるので、その差はまだつ\nくと思われます。\n（大正5年発行『北海道加越能人名録』より\n小樽市総合博物館蔵）\n●商\n人\n■北前船交易の加越能商人\n江戸ll寺代に財を成した船主の近江商人は、明治\nに入るとスポンサーもしくは株主あるいはオーナー\n的存在になっていきます。船を所有し、安い賃金\nで船乗りを雇い､航海をさせていきます。「板コー\n枚下は地獄」という危険な航海で、船主は金銭的\nリスクを､船乗りは生命的リスクを負っていました。\n船乗りには､力ll賀(石川県南部)･越前(福井県)･\n、\n越中(富山県）・能登(石川県北部)の人々が多くい\nました。これらの船乗りがやがて船頭となり、船\n主となり、新興の地である小樽に進出してきまし\nた。彼らを称して「加越能商人」といいます。\n加越能商人が小樽の歴史を創ってきた大立て者\nといっても過言ではありません。\n一方､人口が増えていく北海道や樺太を市場に、\nご\nj\nl ー －－\n■ ＝ 々や q\n雛浸\n寿原彌平次 寿原猪之吉 寿原菫太郎 寿原英太郎\n(『寿原商事株式会社50年史』より） (『寿原商事株式会社50年史』より） (陦原商事株式会社50年史』より） (『寿原商事株式会社50年史』より）\n53"}, {"page": 54, "file": 1, "pdf_page": 63, "text": "卸業も活発になってきました。小間物（化粧品)、\n／－ 1\n【コラムD\n瀬戸物、食品、衣類、酒類を扱い、財を成す力ll越\n能商人も輩出しています。 ｢加越能資本の銀行」\n十二銀行(本店:富山)明治32(1899）\n◎西出孫左衛門（北前船P38参照） 年小樽支店開業、昭和18（1943）\n年北陸銀行に統合\n◎西谷庄八（北前船P38参照）\n第四十七銀行(本店:富山)明治40\n◎広海二三郎（北前船P39参照） （1907)年小樽支店設置､昭和15\n（1940)年十二銀行に合併(現北海\n◎大家七平（北前船P40参照）\n道紙商事株式会社）\n◎右近権左衛門・中村三之丞（北前船P40参照） 中越銀行(本店:富山)明治45．大\n正1(1912)年小樽支店設置昭和\n18(1943)年北陸銀行に統合(現銀\nの鐘）\n北陸銀行(本店:富山)昭和18(1943）\n年設立\n小樽の金融機関は、年代によ\nり合併等の変遷もありますが、\n開業はのべで平成13(2001 )年ま\nでに50社ほどが登記されていま\nす。その中で本店が東京24社で\n最も多く、札幌が8社、小樽・函\n館・富山が4社となっています。\n東京は中央市場で当然で､札幌・\n小樽・函館は北海道の都市です\nが､富山という地方の資本が4社\nも設置されていることはそれほ\nど縁が深いことを物語っています。\n(｢小樽の銀行小史｣渡辺真吾\n『小樽市総合博物館紀要』(2003年3月)より）\n●商\n人\nすはらやへいじ いのきf， じ.1，．”-ろ．‐\n◎寿原弥平次・猪之吉・重太郎3兄弟\n寿原弥平次は富山県砺波郡福岡出身｡明治14(1881)年5月\nに発生した小樽の大火の情報を秋田で間いて､同年7月には\n小樽の有幌町で瀬戸物店を開業しました。\n猪之吉が、オコバチ川畔の堺町で和洋小間物店を開業し\nたのは明治22(1889)年のことです。\n明治31(1898)年には弥平次が瀬戸物、猪之吉が小間物、\nその弟菫太郎が洋品・缶詰を扱い、3人で経営します。小樽\nで初めて複式簿記を採用したのも菫太郎といわれています~･\nおたる織物(染色アトリエKazu)は元は奥山商店の蔵です\nが、明治34(1901)年寿原小間物店に店や商品ごと讓渡され\nています。\n'\n’ 口\n」\n患一一~~＝~~蕊 届\n礁y瞳\nI\n§)1唇\nｌ。↑劃例Ｍｕ 園唾 封I 1lif\n曲\n旧北洋銀行（現おたる無尽ビル） 旧寿原小間物店倉庫(現おたる織物）｜日中越銀行（現銀の鐘）\n寿原九郎 寿原外吉 野口喜一郎\n(『寿原商事株式会社50年史jより） （『小樽商工会議所百年史』より） (小樽市総合博物館蔵）\n54"}, {"page": 55, "file": 1, "pdf_page": 64, "text": "ﾛ幸\nE風 ÷ 一 蕗 躍 驚 惹\n』Ｆ雪 一窪 一\n一\n『ざ\n“’\n●商\n人\nＴ｜ｈｌや１１ト§ーⅢ隅田ⅢｒⅡ\n字壼三 一\n明治43(1 910)年 色内町の寿原合名会社\n（『寿原商事株式会社50年史』より）\n明治27(1893)年小樽高島両郡実業家明細図(『弄原商事株式会社50年史』より） 遇｡～ 襟\n寸一は ら いのき ち えいたろう くろう\n◎寿原猪之吉・英太郎・九郎 ：電琴\n〆\n大正元(1912)年には寿原合名会社を猪之吉が設立し、息 ■■■0\n子英太郎と経営します。色内町に本店をおき、入船町に支\n〃\n店をおきます。\n鶴\n昭和5(1930)年に英太郎が市議会議員に当選､郷里の大聖\n寺から九郎を養子にします｡英太郎は同7(1932)年に衆議院\n且 垂一\n議員に当選、戦後の同22(1947)年には小樽市長に当選して 旧寿原邸\n(最初は高橋直治邸として建設）\nいます。\n九郎は大正13(1924)年に小樽高商を卒業、同期に小林多\n喜二がいました｡卒業後三井に入社しますが、昭和9（1934）\n年に菫太郎や英太郎が関わった小樽無尽に入り､同23(1948）\n年には北洋銀行の社長に就任します。この建物は現在、市\n民有志が買い取り「おたる無尽ビル」として運営されてい 錘\nます。\n卜４。』 一\n１挙茜四 麓Ll3:．\n瞳\nqq ぐp\nW､§『 製燃ゞ田\n◎寿 すは 原 らそ 外 とき 吉 ら 今 』． 罰 呼当\nFE÷\n和光荘\n外吉は弥平次の縁戚で大正9 (1920)年酒井から入籍しま\nした。寿原商店と寿原農場の社長に、また小樽商工会議所\nの第15代会頭にもなっています。\n外吉が札幌証券取弓|所の2代目理事長になったのは昭和26\n(1951）年。3代目の今井道雄に弓|き継ぐまで14年間も続け、\nほかに北海道硝子卸商業協組理事長から全国板硝子卸商連\n合会の副会長と、本業を支える仕事にも精を出しました。\n(http://www.otaruccl.jp/kiseki/kiseki.htmlより）\n水天宮横東雲町の高台に､石塀に囲まれた|日寿原邸(最初\nは高橋直治邸として建設)があります。\n酒泉館\n0戸0戸"}, {"page": 56, "file": 1, "pdf_page": 65, "text": "のぐちきちじろう きいちろ･）\n◎野口吉次郎・喜一郎\n野口吉次郎は安政3(1856)年石川県河北郡花園村二日市に\n生まれ、7歳から養子先を4回も変わり、28歳に金沢の野口\n家の養子になり､野口吉次郎と名を変えます｡明治19(1886）\n年北海道に渡り、入船町で古着の行商を始め、間もなく石\n橋商店の杜氏となり、同30( 1897)年石橋商店の丸ヨ印をも\nらい、店を構え独立しました｡3年後には札幌北の誉の始祖\nちょうじるう おかだいちまつ じゅうじろう\nで弟の長次郎､旭川北の誉の始祖で同郷の岡田市松と菫次郎\nが手伝いに入ってきます。\n明治34(1901)年酒造を開始、同35(1902)年には奥沢に酒\n造所を建て、同36(1903)年に「北の誉」の商標登録をしま\nした。北の誉酒造は現在「酒泉館」として試飲や日本酒醸\n造のしくみを見学できる施設を設置しています。\n喜一郎は吉次郎が石橋商店で杜氏をしていた明治20(1887）\n年に生まれました。\n潮見台の丘上の和光荘は「北の誉は野口の誉」ともては\nやされた喜一郎の時代、建築家山崎仲が設計しました。喜\n一郎は建築が趣味だったので、彼も意向も建物に反映され\nています。「大正11年(1922)建築､木造4階建一部鉄筋コン\nクリート造､天皇・皇后両陛下が昭和29年(1954)8月にご来\n道の際、小樽での宿所となった由緒ある建物である」とい\nう看板が立っています。\n(http://www.ota｢ucci.jp/kiseki/kiseki.htmlより）\n●商\n人 共成（現小樽オルゴール堂）\n（小樽市総合博物館蔵）\n明治39(1906)年に建設された\n日本郵船株式会社小樽支店\n（小樽市総合博物館蔵）\nいまたきさぷろう\n◎沼田喜三郎\n天保5(1834)年越中西砺波郡津沢生まれ｡明治15(1882)年\n48歳で渡道。まだ米がとれなかった北海道に注目し、精米\n事業を企てました。オコバチ川沿いにいくつか既存の精米\n用の水車がありましたが、積雪期には機能していませんで\nした｡そこで上から水をかけることを思いつき､同24(1891）\n年には共成株式会社を設立しています。\n_乙負麹\n明治26(1893)年には開墾委託株式会社を設立､5ヶ年で石\n〆\n狩平野の3千8百町歩の土地を開墾しています。雨竜郡の沼\n田町は沼田喜三郎の偉業を偲んでつけられています。明治\n30(1897)年には菜種油を製造する小樽製油株式会社を設立\nしています。\n現在の小樽オルゴール堂の建物は大正4(1915)年に共成株\n式会社として建てられていますが、すでに沼田の経営では\nなくなっており､大正8(1919)年には寿原の経営になってい\nます。\nシＦ砂掘削肌\n日本郵船小樽支店前\n（小樽市総合博物館蔵）\n’\nO戸／b→"}, {"page": 57, "file": 1, "pdf_page": 66, "text": "くらはしだいう-け\n◎倉橋大介\n越前武生の人で、奥羽征討時には越前藩の軍事係、明治\n5(1872)年に武生町進脩学校教師、同9(1876)年山形県四等\n警部、同12(1879)年第四十四国立銀行小樽支店設置時に小\n樽に来ています。同16(1883)年には共同運輸小樽支店目|｣支\n配人となり、共同運輸は打倒三菱のために創設された会社\nで、同14(1881）年に設立された越中風帆船会社などが合併\nして設立されました。同18(1885)年国策で共同運輸会社と\n郵便汽船三菱会社が合併して日本郵船会社が設立されたと\nきに､石巻支店長として赴任しています｡そして同27(1894）\n年には小樽電灯舎を設立して電気事業を起こし､同30(1897）\n年には小樽貨物保険株式会社社長となり、その他さまざま\nな事業に関わっています。金子元三郎・板谷宮吉・寺田省\n帰・遠藤又兵衛・藤山要吉らとも親交が深かったこともし\nられています。\n●商\n人 |日板谷邸\n函一画\n11\nW’\n･笹\n塁 一 講雲\n＝傍 F L\nF\n一\n■商魂たくましき越後商人\n有幌の倉庫群（小樽市総合博物館蔵）\n近江商人や加越能商人が自ら命をかけて船で渡っ\nてきたのに対し､小樽に定着した越後(新潟)衆は、\n船で運ばれた積荷をどうさばくかというところか\nら身を起こした人が多いようです。したがって堅\n実で、事務能力に優れていたといわれています。\n酒はもとより歌舞音IIIIをさけて、お札を数える\nことが至福で､数えた札束を金庫室の床に並べて、\nとうとう金庫室からはみ出て階段から転げ落ちた\nという逸話を持つ板谷宮吉、ロンドンの穀物相場\nを牛耳ったという高橋直治、「不在地主｣のモデル |日高橋倉庫（現小樽おもしる撮影館）\nにされた磯野進、能に熱中したあげく自宅に能舞\n台までつくった岡崎謙などが有名です。\n澱\nL\n痔\n』 箪\n一.l浄一 耳 一s\n旧磯野商店倉庫（現海猫屋）\n戸･／辱"}, {"page": 58, "file": 1, "pdf_page": 67, "text": "いたやみやきち\n◎板谷宮吉\n「近江泥棒・伊勢乞食」に対し「越後衆しょっぱいガンー」という俗諺があります。越後衆のケチぶ\nりを表した言葉です。板谷宮吉は安政4(1857)年越後国刈羽郡宮川村生まれ｡14歳で松前にあった同\n郷の金子元三郎の店に丁稚奉公します。明治8(1875)年には金子の紹介状を手に小樽の山の上町の工\n藤海産物店に入りました。同15(1882)年にささやかな荒物屋を独立開業し、鰊・精米・醤油などを扱\nいました。\n明治35(1902)年英国船を買い、新潟諸港と小樽間に貨物の定期航路を開きました。運は日露戦争で\n開かれます。船が徴用され莫大な補償金が舞い込んできました。それをもと|こ、同45(1912)年に板谷\n商船を創立し、阪神・ハワイ航路、大正2(1913)年には大連航路を開始、樺太には銀行を設立してい\nます。\n2代目宮吉は明治18(1885)年生まれ、板谷順助・柴野仁吉郎に育てられます。大正7(1918)年に初代\nがたおれますが、小樽市中学校(現長橋中学校)を土地と共に25万円の寄付をしています。母校の早稲\n田大学にも10万円を寄付しました。\n昭和2(1927)年貴族院議員に当選、同8(1933)年には無給の名誉市長となっています。永山・美瑛・\n雨竜でも大農場を経営しました。戦後はそこ､うデパートの社長などもして、同37(1962)年に亡くなっ\nています。\n●商\n人\n’\nたかはしなおじ\n◎高橋直治\n高橋直治は安政3(1856)年越後国刈羽郡石地村生まれ｡17歳になるまで祖母から3度の勘当を受ける\nほどヤンチャだったようです。\n明治8(1875)年に北海道に渡ります｡山ノ上町の廻船商に奉公に入り、同11(1878)年に独立して｢ジョ\nウヤマキ」の印を掲げ、次第に米穀・海産物の委託販売、味噌醤油の醸造、精米と多角経営に乗り出\nしています。\n同27(1894)年には小樽米穀株式外五品取引所の理事長 同32(1899)年には小樽商業会議所副会頭、\n同33(1900)年小樽海陸産物組合長に就任しています｡同35(1902)年には北海道の小豆を買い占め大儲\nけ、その金を鰊漁場に投資してまた大儲け、大正3(1914)年の第一次大戦にはまた小豆を買い占めて、\n戦地の英国に売って巨万の富を築きました。ここから「小豆将軍」「豆成金」といったあだ名がつけ\nられました。\n明治34（1901）年北海道初の衆議院議員となり、同42 (1909)年・同45(1912)年にも当選 後に貴\n族院議員にもなっています。\n運河沿いにある、おたるおもしる撮影館の建物は|日高橋倉庫です。\n’\n初代 板谷宮吉 2代 板谷宮吉 高橋直治 磯野 進\n(小樽市総合博物館蔵） (小樽市総合博物館蔵） (『小樽商工会議所百年史』より） (『小樽商工会議所百年史』より）\n58"}, {"page": 59, "file": 1, "pdf_page": 68, "text": "いその すす-む\n◎磯野 進\n明治5(1872)年佐渡両津生まれ。東京法学院(|日・中央大\n学)卒業。同30(1897)年に小樽に転居しています。色内町で\n海陸産物商を営み、北陸人造肥料、北海道精米、北海漁業\nなどの会社にも関わりました。大正2(1913)年4月には小樽\n商業会議所の7代会頭に就任しています。\n大正9(1920)年には下富良野に57万9千坪の土地を所有し、\n農場も経営していましたが､昭和2(1927)年小作争議が起き、\n小作人の要求をのむ形で決着しています。これをモデルに\nした小説「不在地主」は、同時期に北海道拓殖銀行小樽支\n店に勤務していた小林多喜二の作品です。\nこの拓銀小樽支店は大正12(1923)年に建てられ、現在は\nホテルヴィブラントオタルとなっています｡また明治39(1906）\n年に建てられた旧磯野商店の蔵は海猫屋になっています。\n麓■園\n６吟』’１１１１“一”麺廻 謬\n・一一一\n一侭一\n●商\n人\n隠陰\n能舞台\nおかさき けん\n◎岡崎 謙\n明治10(1877)年佐渡生まれ。東京英和学校・国民英和学\n校・東京高等商業学校(現･一橋大学)で学び､同32(1899)年\nに米・荒物・雑穀・倉庫業の家業を継いでいます。公職で |日岡崎倉庫（現田中酒造亀甲蔵）\nは区会議員・市会議員を歴任､昭和2(1927)年には市会議長\nになっています。\n加賀藩前田家のおかかえ能楽師であった波吉宮門に能を\n学ぶなど、深く能を愛し、能舞台を自宅に造るほどでした。\n現在能舞台は市に寄贈され、小樽市能楽堂として公会堂の\n一角に移設されています。\n田中酒造亀甲蔵は明治39(1906)年に建てられた|日岡崎倉\n庫です。\n認＝獅\n蕊謹鰯\n?:1挑..￥\n･\"蝋\n|日青山別邸\n－観客 露マデー 幸\n一 一 屍\n旧白烏家番屋（歴史文化研究所蔵）\n59"}, {"page": 60, "file": 1, "pdf_page": 69, "text": "■小樽の大地主\n’\n◎木村円吉\n木村家は天保元(1830)年胄森県東津軽郡一本木村字大泊\n生まれの大工、木村円太郎が始祖です。弘化3(1846)年から\n春になると北海道の増毛で刺網による鰊漁を営み、漁期が\n過ぎると青森に帰っていました。\n5代目円吉は幼名百太郎と称し､福島の漁家花田伝七の三\n男でした。明治25(1892)年22歳の時に木村円太郎の孫娘ミ\nヤと結婚、木村家に入りました。仲人は漁家の金沢友次郎\nでした。\nヤマシメ木村は明治24(1891)年に小樽に本拠を移してい\nます。\n現在の北一硝子三号館は、明治24(1891)年に建てられた\nむしろ\n|日木村倉庫です。廻船問屋として米・味噌・縄・筵・食料\n品などを保管していました。\n明治後期には、漁場の大漁にも恵まれ、儲けた金で小樽\nはもとより道内各地の土地を買い占めていきます。\n大正9(1920)年に道庁が50町歩以上の大地主を調査した時、\n小樽には山田吉兵衛ら6人いたうちの筆頭が木村円吉でした。\n本業の水産業では最終的に22ケ統を所有、道内鰊漁獲高50\n万石の1割、50, 000石を取る最大の親方であり、450人の漁\n夫を使っていました。\n6代目円吉は四男で、小樽にフェリーを誘致したのは、彼\nが小樽商工会議所会頭の時でした。\n一\n』\n●商\n人\n凸一 P蝉亭“■ー~\n茨木家住宅\nに\n1\n北一硝子三号館\n6代 木村円吉\n(『小樽商工会議所百年史』より）\n－、\n●人名の地名・通り名\n西出山（函館山）：西出孫左衛門\n山 田 町：山田吉兵衛\n札幌の山本通り：山本久右衛門\n雨竜郡沼田町：沼田喜三郎\n｜\n留 萌 市 藤 山：藤山 要吉\n能 島 通 り：能島 繁蔵\n円 吉 山:木村円吉l\n／\n60"}, {"page": 61, "file": 1, "pdf の(港湾法第2条第2\n項)」と記されており、北海道では函館港や釧路港\nなど10港あります。\n“\nｒ\n』\n“\n弓\n』 毎\nＦＦ\n■小樽港の港界線\nさて、小樽港というと防波堤の内側をイメージ\n炉\nかやしぱみ堂き ひらいそなさき 現在の小樽港\nするでしょうが､実際は､高島の茅柴岬から平磯岬 （北海道開発局小樽開発建設部）\nに引いた直線(港界線)の内側をいいます｡港界(港\n域)線内水面積はおよそ570万平方メートル、防波\n堤に守られている防波堤内被覆水面積は約331万平\n方メートルです。ちなみに札幌ドームの建築面積\nは5万4千平方メートルで､防波堤の内側の水面は\n札幌ドーム約60個分となります。また防波堤内の\n水深は2.0～20.0mです。\n一“Ｉ\n「\n一\nｊ\n三\n一\n河 畢戸\n●港\n建萄雪’\n一\n－－1－圭1言－\n’\n3．小樽港のはじまり\n小樽港に停泊するフェリー\n■江戸時代 （北海道開発局小樽開発建設部）\n17世紀末から江戸幕府を中心に、治水や新田開\n発などにより、農業の振興が積極的に展開されま\nにしんかす\nした。そのことは肥料となる鰊粕の需要を急増さ\nせ、当時蝦夷地といわれていた北海道は、鰊の生\n産地として人々が集まるようになりました。冬季\n間の季節風が防がれ、また鰊の豊漁が続いた小樽\nは、江戸時代末、オタルナイ場所と呼ばれ場所請\n負制が取られていましたが、鰊漁の出稼ぎ人も増\nえ、元治2(1865)年に、村並となり名主・年寄な\nどの村役人がおかれました。万延2（1861)年、場\n所請負人岡田家が海岸での荷揚げを容易にするた\nめに、現在の港町海岸で埋立を行っています。そ\nの後も海岸を利用しやすくするために埋立が行わ\nれました。\n65"}, {"page": 66, "file": 1, "pdf_page": 75, "text": "■明治初期～中期\n函鹿\n◎札幌の海陸連絡の地点\nさて、明治新政府は、わが国の北方防衛、近代\n化に必要な資源の入手や人口問題の解決などから、\n本格的な北海道開発に取り組むこととし、明治2\n(1869)年に開拓使を設置、同4(1871)年には開拓\n使本庁が札幌に置かれました｡そして小樽は､江戸\n小樽港/有幌方面ヨリ信香町ノ常燈台\n時代末から漁村として人々が集まり村並となって\nヲ望ム/明治5(1872)年\nいたこと､天然の良港であったことから､札幌の海 （北海道大学附属図書館北方資料室所蔵）\n陸連絡の地点として位置づけられました。\n●港\n◎整 備\n幕末から取り組まれていた海岸の埋立は開拓使\n了-儲\nが行い、明治4（1871)年、同8（1875)年には現在\nの堺町、港町で埋立が行われ、さらに、民|||1によ ＝\nる埋立も行われ、海岸沿いの''11並みが姿を現しま\nした。\n季期し\n小樽港では、明治5(1872)年、色内村に石造の 米国帆船ジラルド．シ・トベイ号手宮埠\n頭へ横着之図/明治13(1880)年\n埠頭が着工され、翌年に完成します。同10(1877）\n（北海道大学附属図書館北方資料室所蔵）\n年には手宮埠頭が完成します。埠頭とは、船舶が\n荷役や旅客の乗降のために接岸する場所ですが、\n荷物をしまう上屋や荷役機械、旅客の待合所など\nの陸上施設を含めた広い範囲をいいます。当時築\n畠一 ■ 錘 一重\n造された埠頭は大型の船が直接接岸できるもので ー\n一 三\nはなく、艀などが接岸していました。それでは荷\n揚げや旅客の乗り降りに不便なので、同13(1880）\n年、手宮埠頭に延長240間(約430メートル)の手宮\n桟橋が建設されました。同じ年には手宮一札'幌間\n手宮停車場と鉄道桟橋の景\nの鉄道が開業しています。 （北海道大学附属図書館北方資料室所蔵）\n◎商業港湾都市としてデビュー\n小樽港は明治22(1889)年特別輸出港になります。\n「特別輪出港」とは、米、麦、麦粉、石炭、硫黄\nの5 11,11目に限り、日本船または日本人雇用の外匡｜\n船により輸出ができる港として指定されたもので\nした。小樽港はそれから10年後の同32(1899)年に\n66"}, {"page": 67, "file": 1, "pdf_page": 76, "text": "は外国貿易港(開港)に指定されました。開港とは\n／ 、\n…\n外国貿易のために貿易船が入港できる開かれた港\n「お雇い外国人\nのことで､それ以外の港(不開港といいます)では、\nC、S・メーク」\n貿易船は特別な場合を除き、あらかじめ税関の許\n可がなければ入港することができません。開港と 明治20(1887)年になり、お雇\nい外国人技師のC.S.メークに\nなったことにより、対岸のロシア沿海州や中国は\nよって北海道の港湾調査が行わ\nもとより、世界各国の貿易の窓口となりました。\nれ全道的な港湾計画がまとめら\nれます。メークは小樽港につい\nて石炭桟橋の建設と南町・入船\nふなだまり 町の船溜(小型船舶を係留するた\nふな いりま\nめに囲まれた水面、船入澗とも\nいいます)計画を報告しています◎\n同23(1890)年、南浜町船入澗と\n南町.入船町船入澗の建設が北\n海道庁に出願され、同25(1892）\n年に工事が完成しました。近代\n的な港にはまだまだ遠いのです\nが､札幌への物資が陸揚げされ、\nまた空知の炭鉱からの石炭が運\nび出されるなど、道央圏の海の\n玄関口の役割を担うようになり\nました。\nノ\n'、 ノ\n●港\n〆薯二一\n１１砥\nI\n、\n小樽市街の明治10年代の見取図\n（北海道大学附属図書館北方資料室所蔵）\n4．近代的な｢港｣づくり\n■日本初の本格的外洋防波堤建設\n◎背 景\n近代的な港湾としての小樽港の整備は､明治30(1897）\n年4月の小樽築港第一期工事着工から始まります。\n防波堤がなかった時代、小樽港は天然の良港と\nはいえ、冬季間シベリアから吹きつける季節風と\n波浪は、人々の乗降や荷卸しを阻害し、時として\n停泊する船舶や陸上施設に損傷を与えました。北\n海道の本格的な開発のために、気象の影響を受け\nない近代的な小樽港が求められていました。季節\n風などによる波浪を遮り、港内を静穏にすること\nで航行や停泊の安全をはかり、円滑な荷役を可能\nとし、さらに港の施設を波浪から守る、そのため\nには冬の日本海の荒波に十分耐える頑丈な防波堤\nが先ず第一に求められたのでした。\n67"}, {"page": 68, "file": 1, "pdf_page": 77, "text": "●港\nL\n工事中の北防波堤。\n防波堤の右端で積畳機が動いている姿が写っています｡手前には和船が停泊しており､水深の深い防波堤側に軍艦や汽船\nが停泊しています。 （小樽市総合博物館蔵）\n◎過 程\nきたがきくにみち\n明治25(1892)年、第4代北海道庁長官の北垣国道は「北海道西部において物資の\n集散場に適した土地は小樽以外に無い」と小樽に近代的な港湾建設を訴えた意見書\nを提出。翌年には井上内務大臣の視察があり、同27(1894)年には建設工事の設計に\n必要な地形や地質などの調査が実施されました。そして'可28(1895)年からは、防波\n堤の一部を築いた大掛かりな試験工事が行われました。\n明治29(1896)年、帝|玉|議会は前年までの調査や試験工事の結果を受け、小樽築港\n費218万8千'11余を、全額国費によるものとして議決。国内最大級の本格外洋防波堤\n建設工事が国家プロジェクトとして取り組まれることになりました。小樽築港事業\nが国家プロジェクトとして取り組まれた背景には､18世紀末から急激に緊張の高まっ\nた北洋や北方に対する軍事的な備えを充実させ、人口が急増するR本の食料供給基\n地、人口吸収の地として、北海道がその役割を果たすことへの期待がありました。\n◎商業港湾都市としての発展\n小樽築港工事による北防波堤の完成を待たずして、北方の軍事''1勺緊張は高まり、\n建設途中で日露戦争が勃発しました。そのため建設事業の予算が縮小しましたが、\n11ヶ年の歳月をかけ、明治41(1908)年に延長1,289メートルの北防波堤が完成。小樽\n港は近代港湾の第一歩を歩み出します。\n引き続き第二期工事が始まり、工期13ヶ年、工事費517万円をかけ、大正10 (1921)\n年7月に､南防波堤(延長912メートル)、島防波堤(915メートル)、北防波堤延長(415\nメートル)が完成。総延長4キロメートルの防波堤が船HI'|を守ることで、小樽港は北\n海道の中核港湾として北方交通の要衝となり、港湾都市として一層発展しました。\n68"}, {"page": 69, "file": 1, "pdf_page": 78, "text": "■先端技術を導入した第一期工事\n」＝と.←§\n◎火山灰・斜め積み・百年試験 吐壽室ﾖム\nひろいいさみ\n札||滉農学校教授兼北海道庁技師であった広井勇\nは、小樽港内での測量や波浪観測を行い、明治28 甲 一\n（1895)年からは試験工事として防波堤を建設する\nとともに、防波堤の基礎を支える海底の状態や波\n北防波堤の断面図\n浪の動作、海水中にあるコンクリートブロックの\n幅約14．4メートル(24尺)､高さ約13.8メート\n状態などについて調査を行いました。 ル(23尺)､重量14～23トンの大型コンクリー\nトブロックが､約71度の傾斜をつけて積み上\nそれらの結果をもとに、広井は火山灰を用いた げられている様子が右上の図(小樽築港工事\n報文)からわかります｡｢･ ･七一度三四分の傾\nコンクリートを防波堤工事に採用。さらに，コン 斜をつけた｡この目的は工事中堤端における\n崩壊の脱落を予防することを主とし､…兼て\nクリートブロックを斜めに積み､自重の一部をかけ\n隣塊を兵合(ひょうごう）させ､もって－局部\nの波撃を広く伝えることにある。この築設法\nることで安定させ､また一部分に当たる波の力を広\nは､当時すでにマノラ･マドラス･コロンボ等\nく分散させることで波力に対抗する構造を採用し において実施したことがあるが､我が国では\nこの工事をもって嗜矢とする｡」\nました｡いずれもわが国では初めての試みでした。 （広井勇著:『日本築港史』）\n当時、防波堤にコンクリートを使用したときの\n長期にわたる耐久性などは明らかになっておらず、\n横浜港では埠頭建設で使用したコンクリートに亀\n裂が入るなど、国内でも成功事例がありませんで\nした。そこで、広井勇は大量のコンクリートテス\nきょうしたい\nトピース(供試体)を製作し、コンクリート強度の\n経年変化を長期間にわたり計測する百年耐久性試\n験を始めました。この世界でも類の無かった試験\nは平成15年1月を以て終了、その成果を各国の土\n木技術者が見学に訪れています。\n小樽築港が計画された明治20年代後半は､コンク\nリートの強度や材料の混ぜ方などについては十分\nに解|ﾘ]されていなかったのですが､広井は諸外国の\n港湾工事の成果や自らの実験の成果をもとに､コン\nクリートブロックによる防波堤建設にのぞみました。\n》画■幻４二\n一一\n一\n●港\n1画一…摘唾壷禰聖?~…“率，硫姻ﾛ. eｴ色宮■二■句●\nコンクリートブロックとその運搬に用\nいられた起重機。\n写真は第二期工事ですが､北防波堤工事でも\n同様にしてコンクリートブロックが製造され\nました。\n(土木学会附属図書館戦前土木絵葉書ライブラリ）\n■先端技術を生み出した第二期工事\n◎ケーソン\n最先端の技術を惜しみなく投入することで、日\n本初の本格的外洋防波堤建設に成功した小樽築港\n第一期工事でしたが、第二期工事ではユニークな\n工事方法が開発され、築港工事を成功に導き、港\n69"}, {"page": 70, "file": 1, "pdf_page": 79, "text": "湾技術者の耳目を集めました。\n第二期工事で建設された南防波堤は北防波堤と\n|司じコンクリートブロックの斜め積みで建設され\nました。しかし、工事途中の明治44(1911)年に、\n防波堤の設計が変更され、南防波堤先端部の島防\nかんかい\n波堤と北防波堤の延長部においてケーソン(函塊）\nを用いることとなりました。 第二期工事から小樽港南端の平磯岬から若竹\n海岸にかけての埋め立て地に築港工場は移転\nケーソンとは、主として鉄筋コンクリート造の した｡築港工場のケーソンヤードから､幅､奥\n行12.1メートル､高さ7．5メートル､1,000トン\n箱状あるいは円筒状の構造物です｡地上で製作後 を超える巨大なケーソンが進水する姿(下の\n写真)は､小樽築港工事のハイライトでした。\n水中などに沈下させ防波堤や岸壁として用いるも\nちなみに､日本で初めて防波堤に使われたケー\nので、現在でもよく使われています。第二期工事 ソンは､1910(明治43)年に神戸港で､浮きドッ\nク方式により製作されました。\nではこのケーソンの製作を簡単なものとして経費 (土木学会附属図書館戦前土木絵葉書ライブラリ）\nを少なくする工事方法が考案されました｡それは、\n1,000トンを超える巨大なケーソンを陸上のヤード\nで製作し海中に向け滑り落とす、進水方式という\nものでした。\nfｺよう.・も/\nこの方式は、広井勇の後を継いだ伊藤長右衛門\n第3代小樽築港事務所長が、数々の試験と検討の\n結果、明治45(1912)年に開発したもので、優れた\n工事方法として評{IIIされ、その後各地の築港工事\nで採用されました。\n大正時代には留萌や岩内に|f'lけて、小樽で製造\nされたケーソンが海上運搬され港づくりが行われ\nています。\n●港\nケーソンは中空のため､設置場所まで移動し\nたのちに､土砂や骨材(砂利)などを充填して\n重量を増し､海中の基礎に据え付けられます。\n写真は島防波堤ケーソンの充填作業です。\n（北海道大学附属北方資料室）\n5．小樽築港とエンジニア(技術者）\n■小樽の港づくりと3人のエンジニア（技術者）\n小樽築港では、防波堤の建設に携わった土木技\n術者たちを忘れることはできません。1人は、小\n樽港の生みの親といわれる広井勇。もう1人は小\n樽港の育ての親といわれる伊藤長右衛門。今ll，\n旧日本郵船小樽支店前の運河公園で2人の胸像が\n小樽港を見守っています。そして、寒風吹きすさ\nぷ北の冷たい海に潜り、防波堤の基礎となる石積\nみ工事の監督指揮を行い、若くして命を落とした\n70"}, {"page": 73, "file": 1, "pdf_page": 84, "text": "設することの許可申請がなされています｡その後\n昭和2(1927)年からの北海道第二期拓殖計画の中\nで､小樽港の岸壁・埠頭施設の整備が盛り込まれ、\n北海道初の突堤式の公共埠頭が建設されることと\nなりました。\n昭和7(1932)年､立岩から勝納川に至る約1,310\n絵葉書となった小樽港全図\nメートルの海岸埋立が竣工します。そして、延長\n(土木学会附属図書館戦前土木絵葉書ライブラリ）\n352メートル、水深6 6メートルの堺町岸壁が完成\nしました。続いて、同9（1934)年には延長212メー\n・史よ．ま』\nトル、水深7.4メートルの厩町岸壁が完成します。\n厩町の埋立では岸壁以外の施設が築造されたほか、\n小樽港で待望された船舶修理場などの施設も設備\nされました。堺町、厩町の両岸壁が完成したこと\nで、2～3,000トン級の船舶が直接接岸できるよう\nになり、樺太航路などで利用されました。\n昭和10(1935)年には突堤式の第一号埠頭の建設\nが始まります。1万トン級の船舶と、6,000トン級\nの船舶が係船できるバース（船舶係留場所）が設\nけられました。埠頭の面積はおよそ3万8千平方\nメートル。|幅員127メートル、長さ右310メートル、\n左293メートルで、総工費はおよそ99万円でした。\n同12(1937)年には第二号埠頭が、同15(1940)年に\nは第三号埠頭の建設が始まりましたが、第二次世\n界大戦の影響で同18(1943)年までに工事が打ち切\nられました。\n大正11 (1922)年には、小樽港から運び出される\n石炭は年間百万トンを超えるようになり、手宮駅\n構内の既存施設からでは石炭の積み出しが間にあ\nわなくなってきました。同15(1926)年、鉄道省は\n小樽港の海陸連絡設備の根本方針と具体案を決定\nしました。それは、勝納川、若竹町の埋立を進め、\n貯炭場 貯木場を設置するほか、岸壁を整備する\nと共に､長さ170メートル､|幅18メートル､水深8.5\nメートルの石炭船積み桟橋を建設する計画で､7,000\nトン級の船舶を係留して荷役を行うことで、石炭\nを年間363万トン、木材を28万トン、雑貨4万6千\n画一》》 隼毎■０基Ｒ\n唾\n一向一■一一\n一\n●港\n一 一 一一 、一\n4F白■■卓←｡q\n小樽港\n明治初年の有幌海岸(新屋岬)､現今の小樽港\n(市営埠頭）\n(土木学会附属図書館戦前土木絵葉書ライブラリ）\n／\n」》\n二一－一三字\nn 句 ■ vIb,掛瞬､&Uh卜,凸qAwn雌､町ATllT,6画,\n－壁ユ\n明治44(1911)年に竣工した手宮高架桟橋\n(土木学会附属図書館戦前土木絵葉書ライブラリ）\n73"}, {"page": 75, "file": 1, "pdf_page": 85, "text": "トンを扱うというものでした｡工事は昭和2（1927）\n、\n年より始まり、同11(1936)年に東洋一といわれた\n「ゴ モ」\n近代的な石炭荷役施設が完成しました。\n日雇いの港湾労働者を「ゴモ」\n■港で働いた人々 というのは小樽港がはじまりと\nさて、小樽港ではどのような人たちが働いてい いわれています。カモメのこと\nを北海道では「ゴメ」といいま\nたのでしょうか。港で働く人は、小樽港に出入り\nすが、それがなまった、賃金の\nする船舶の船員だけではありません。船舶への荷\nことなどでごねてゴモゴモいう\n物の積み下ろし、岸壁から倉庫や貨車、トラック\nからゴモといわれるようになっ\nに運び込むという仕事があります｡小樽港は最初、 た、などといくつか説がありま\n運河方式を採用したので船舶一艀－岸壁一倉庫や す。このような独特な言葉を生\nみ出した港の労働ですが、夏の\n鉄道という過程を経ることとなりました。石炭だ\n暑さはもとより、冬の凍てつく\nけではなく農産物、林産品、生活物資や工業製品\n寒さの中で大変な苦労がありま\nの積み下ろしがありました。このためさまざまな\nした。多くの人たちの苦汁が小\n荷姿があり、機械化が進むまでは職人的な熟練し 樽港の荷役を支え、小樽港の発\nた技能を持った労働者が数多く必要でした。 展に関わっていたことを忘れて\nはならないと思います。\n第二次世界大戦前の小樽における港湾労働者の\n‐ノ\nなかし\n職種は、「仲仕：港に停泊している船舶内で積卸し\nふせ んふ\nに従事」「艀船夫：艀によって貨物の運搬に従事」\nりくかた\n「睦方：貨物の揚陸や艀へ積み込みに従事」「倉人\n夫：倉庫への貨物の積み付けや荷造り手直しなど\nに従事」「木材積取人夫：木材の積取に従事」「通\n船船夫：通船によって旅客や船員の輸送に従事」「台\n車積卸人夫：鉄道駅構内で貨車積卸しに従事する」\nじようふ\nに大別されます。また、雇用の形態は「定夫」と\nでめん\n呼ばれる常傭と、「出面」「ゴモ」と呼ばれるF1雇\nいがありました。職種、雇用形態別にそれぞれ独\n特の技能が必要で、身分や生活条件、慣行などが\n異なり、同じ荷役でも雑貨と石炭でも大きく異なっ\nていました。さらに、木材積取人夫は独特な生活\nをしていました。\n●港\n75"}, {"page": 77, "file": 1, "pdf_page": 86, "text": "’ ’ 7．第二次世界大戦後の小樽港\n■戦後復興と小樽港\n昭和20 (1945)年8月15日、わが国は敗戦を迎えます。戦争で荒れ果てた国土を復\n興し、生活を再建するために、食料増産とエネルギー確保が急がれました。海外の\n植民地に向けられていた人々の関心が再び北海道に向けられるようになり、北海道\nの開発が重要な国家的課題となりました。｜司25(1950)年には北海道開発法が制定さ\nれ、北海道の積極的開発が国策として取り組まれることになりました。\nl lf{和26 (1951)年、北海道開発庁は北海道総合開発計画を策定します。|,127 (1952)\n年から10ヶ年にわたる計nliiで、前半5カ年は第一次5カ年計画と呼ばれ､電源開発、\n石炭および食料増産に取り組み、道路、港湾、河川等の整備拡充を行うこととされ\nました。小樽港は内外貿易を行う重要港として位置づけられ、戦争で中断していた\n港の整備が再び始まります。\n戦後復興の中で、小樽港では戦争で中断していた第二、第三埠頭の工事が再開さ\nれ、昭和25(1950)年には|幅126メートル、長さ293メートル、6,000トン級船舶4バー\nスの第二埠頭が完成します。そして、同29(1954)年には第三埠頭が完成します。第\n三埠頭は同34 (1959)年より延長工事が始まり、同42 (1967)年に完成します。\n戦後復興から経済成長をむかえる昭和30年代後半になると建材用途の外国木材輸\n入が増大してきました。同37(1962)年には若竹地区に新たに、防波堤595メートル、\n物揚場275メートル､整備水而6万9千平方メートルの木材取扱施設の整備が行われ\nました。この若竹地区水面貯木場は北海道一といわれる大規模なものでした。\n●港\n■小樽港の新たな整備とフェリーの就航\n小樽港は第二次世界大戦後、樺太を失い、また当時のソ連や中|韮|との貿易も政治\n的な問題もあり貨物取扱量が減少しました｡昭和11(1936)年に411万8千トンの取扱\nい貨物量を記録した小樽港は、同25(1950)年には196万トンと半減します。その後lil\n31(1956)年には同11(1936)年の実績を上回りますが、エネルギーが石炭から石油に\n変わる中で小樽港の取扱貨物の7割以上を占めた石炭取扱量も減少します。さらに、\n山が海岸に迫っていることから背後に工業用地を確保できず､工業開発と一体となっ\nた港湾整備と利用を望むことはできませんでした。小樽港は新たな時代への対応が\n必要となりました。\n昭和40年代に入ると船舶はさらに大型化しました。そして、穀物、セメントなど\nと専用化し、コンテナ輸送も始まりました。そこで、同42(1967)年には大型化する\n外航船に対応して、2万トン級の船舶が接岸できる中央埠頭の工事が始まります。\n幅260メートル､手宮側400メートル､勝納側538メートルの大型埠頭には収容能力3万\nトンの穀物サイロやセメントサイロ､冷凍・冷蔵倉庫などが建設され､|司47(1972)年\n77"}, {"page": 78, "file": 1, "pdf_page": 87, "text": "に完成しました。 『\nさらに､遊休地となった石炭積み出し施設のあっ △\nた若竹、勝納地区に面積48万平方キロメートルの\n巨大埠頭の建設が計画されます。昭和48(1973)年\nから工事が始まり､およそ112igl'1をかけて同56 (19 垂｡、\n81)年に完成します｡3万トン級の船舶が接岸でき\nるバースを持った埠頭は当時東京以北では小樽港\n勝納埠頭での荷役風景\nだけでした｡現在勝納埠頭にはフェリー岸壁やター\n（小樽開発建設部ホームページより）\nミナルが整備され、4万9千トンの収容の力を持\nつ穀物サイロや輸入原木用地、小樽港マリーナが\n設けられています。\n現在小樽港の取扱貨物量の90％をフェリーが占\nめています。昭和45 (1970)年8)lに北海道内では\nまいづる つる\nじめての長距離フェリー航路が、小樽と舞鶴、敦\nが\n賀の|ﾊlに開設されました。フェリー航路にあわせ\nて小樽と札'幌を結ぶ自動車専用国道(札榑道)が同\n46(1971)年に開通します。フェリーによる貨物取\n扱量は年々増力llし、同45 (1970)年には20万トンほ\nどだったものが､同50(1975)年には314万トンにな\nり､20年後の平成3（1991)年には2,000万トンを超\nえました。\n●港\n参者文献\n『小樽築港工事報文前編・後編』\n北海道 明治41年\n『躍進の北海道-港湾漁港･河川.鉱業』\n北海道海運通信社 昭和9年\n『工学博士廣井勇伝』\n故廣井工学博士記念事業会\n『土木建築工事画報』第15巻第10号\n土木建築工事画報社\n『北海道港湾変遷史』中村廉次著\n昭和35年\n『港湾労働』\n北海道立経済総合研究所編\n昭和39年\n『北海道港湾建設史』\n北海道開発局港湾部監修\n昭和53年\n『北海道浪漫鉄道』田辺喜子\n昭和61年\n『小樽港民』\n廣井勇・伊藤長石衛門両先生\n胸像帰還実行委員会編\n平成11年\n『写真集小樽築港100年の歩み』\n小樽開発建設部小樽港湾建設部\n平成9年\n｢小樽市ホームページ小樽港要覧」\nhttp : //www.city.ota｢u.hokkaldo.\njp/minato/mina s・htm\n78"}, {"page": 79, "file": 1, "pdf_page": 88, "text": "一’ 一 兎 ーョ\nヨ\n一 一一『 ー《《《■ ヨ 屯 哩 《 可 一 咽 一\nｄ L h 字\n酉 一 口一 ９Ⅱ 一 色写－守 ７７』 一壷 ｌ 『 ｎ弱 ｗ必ｉ 一戸恥 睡 四 Ⅱ W. U\n鼻\n卜\n● L_\n今｡ 一\n－二三\n＝\n画 仔 d\n一毎 一■\nサ1 ＝\n;I- ･\n､忌毎r\n』－手心＝\n‐司一\nj“一 岳\n一\n一\n嘩も\nﾛ曲\n一口\n４■\n琴」一Ｊ\n‘璽\n一一雪、\n祥必',膝\n1\nー－\nザ\n巴 1\n南 ＝‘画印,－型 _』＝車 唖\n呈一\n1｡ ．､\n砥\nW\n餌\nI ﾛｰ一“ー ‐\n．』\nー一 、\nL申\n一応》 垂\n開印画昭\n蒸気の音が運んだ繁栄\n◆北海道で初めての鉄道､l幌内鉄道は石炭の搬\n出のための鉄道であり、''1手宮線はその貴重\nな遺榊である。\n◆中心とな\nメリカス\nつ々／ た技師、クロフォードをはじめア\nイルで造られた鉄道であり、しづ\nか号はその代表的な世物である。\n◆クロフォードのひらいた朝里一銭函の車馬\n道は札栂間をむすぶ陸k交通路で､|州拓史上\n特筆すべき速さと技術で造られた幹線であっ\nた｡義経トンネルは数少ない遺椛である。\n◆小樽2番目の鉄道は私鉄の北海道鉄道(函館\n－小樽)、これにより小樽の玄関は南小樽か\nら小榔駅周辺にかわっていく。\n噸蝿噸偲ぶ\n令姻睡睡到辱”\n盤 手宅\n蝦 夕\n職\n鋤\n写真提供：北海逆火学附属lXl書鮒北方資料資料室・小樽巾総合博物館・市立小榑図書館\n》辮塗霧一細郷郷臘蝿雫\n齢\n一一\n、規華動呼声‘”\n厚沖、牌\n＃\n子可\n臓\n，津W\n、"}, {"page": 80, "file": 1, "pdf_page": 89, "text": "口\n1.幌内炭の発見\n■「燃える石」の発見\n｜ﾘl治元(1868)年、蝦夷地石狩川支流の山奥で奇\n妙な黒光りする石が見つかります。一説には小樽\nきむら\n本願寺別院の建築用材を伐採に入った石狩の木村\nよしたろう\n吉太郎が発見したといわれますが、開拓使にﾙﾊけ\nまつごろう 石炭が山積みとなっている手宮駅構内\n出たのは島松の猟師松五郎でした。\n(昭和初期）\nもっともこの段階ではこの石の価値は不明のま (小樽市総合博物館蔵）\nはやかわらょうじゅうろう\nまでしたが、明治5（1872)年、札||滉の早川長十郎\nが'|ﾙ&内から持ち帰った石塊を開拓使に届け、はじ\nめてこれが良質の石炭であったことが判|ﾘjします。\n明治政府は日本の近代化を図るためには、エネ\nルギー源として石炭の確保が不可欠と考えていま\nしたが、幕末より採掘が開始されていた泊村の茅\n沼炭鉱と白糠炭鉱は小規模であり、開国の条約に\nより外国船に提供を約束していた石炭の量も満た\nしてはいませんでした。\nえのもとたけあき\n当時、開拓使物産取調掛であった榎本武揚は、\nこの幌内の石炭がきわめて良質であることを理解\nし､開拓使お雇い外国人､ベンジャミン・スミス・\nライマンを派遣します。これが後の近代日本を支\nえた北海道の石炭産業の幕開けであり、また小樽\nの地に鉄道が敷かれる原因となったのです。\n●鉄\n道\n｢日本蝦夷地質要略之図」\n明治9(1876)年\nライマンが作成した北\n海道初の地質図\n（小樽市総合博物館蔵）\n8〃"}, {"page": 81, "file": 1, "pdf_page": 90, "text": "■アメリカ・モデル\n開拓使は北海道開拓にあたって、そのモデルを西部開拓が進行していたアメリカ\nに求めます。\n<ろだきよたか 1りありのり\n明治4(1871)年、黒田清隆(後の開拓長官)や森有礼とアメリカ農務省長官ホーレ\nス・ケプロンがアメリカで会談し、その結果ケプロン自らが開拓顧問となり、北海\n道開拓の設計図を作る事になります。ケプロンはそれを実行するため、各分野の人\n材を招聰します。その中に鉄道を語る上で重要な二人の人物も含まれていました。\n一人は鉄道建設に尽力したクロフォード、そして地質学者ライマンです。\nイギリスの技術を導入し、都市間交通としてつくられた新橋一横浜間、神戸一京\n都間とはことなる､アメリカ式の鉄道システムが北海道に導入される下地はこうやっ\nてつくられていきました。\n’ ●鉄\n道\n2．搬送方法とルートの検討\n■船か鉄道か\nぱいでん\n発見当時、lll晃内の炭田(当時は「煤田」と表現されていました｡)へは石狩川、|幌lii1\n川、幾春別川を小舟でさかのぼり、さらに'幌内川の沢伝いに徒歩でいくしかなく、\nこの山奥からどうやって重たい鉱石を運び出し、本州に廻航するか、炭鉱の採掘と\nともに重要な課題となっていきました。\n明治5（1872)年のライマンの調査報告を受けたケプロンは翌6（1873)年、黒田に\n報告をあげます。そのなかでケフ°ロンは、\n(1)'|暁内ほろかむいらぶと幌向太(石狩川)まで鉄道を敷き､川船で石狩まで運びそこから小樽の港\nまで搬送。\n(2) 1幌内から鉄道で室藺の港まで搬送。\nの2案を提示しますが(1)は経費がかさみ、搬出量も限られ、また「小樽港は結氷の\n’\n石狩川(明治9(1876)年作図）（小樽市総合博物館蔵） 幕末～明治初期の手宮付近絵図（越崎宗一氏模写）\nざへ』づ"}, {"page": 82, "file": 1, "pdf_page": 91, "text": "ため半年使えない｡｣という理由(ケプロンの誤解か？）\nで(2)の室蘭までの鉄道敷設を推奨しています。\nこれに対し開拓使や明治政府では莫大な建設費\nがかかる鉄道敷設には消極的であり、江戸時代よ\nり行われていた石狩川の河川交通を手直しする、（1）\nの説が主流であったといわれています。\nなお、ライマンも室藺までの鉄道敷設がもっと\nも適した案であることを指摘しています。\nその後、河川利用か鉄道敷設かの議論は西南戦\n争が勃発し、財政的にも政治的にもこれを検討す\nる余裕はなくなってしまいます。議論は西南戦争\n後、再び具体化していきます。\n|\n、\nー\n「釜石鉱山鉄道」\n手宮・札幌間が開通した明治13(1880）\n年11月20日より9ヶ月ほど前の2月17日に\n岩手県で運転を開始した鉄道があります。\n岩手県の釜石港から鉄鉱石を採掘してい\nた大橋鉱山までの「官営等石製鉄所専用\n鉱山鉄道」（釜石市側の資料では｢釜石鉱\n山鉄道｣と略されていますので以降は｢釜\n石鉱山鉄道」と記します｡）がそれです。\nつまり新橋一横浜、神戸一京都につづ\nいて日本で3番目に運転を開始した鉄道が\n釜石にあったのです。これまでこの鉄道\n｜こついてはあまり知られていなかったの\nですが、岩手県、釜石などの資料をみて\nいくと地元では「日本で3番目の鉄道」と\nして古くから知られており、トンネルの\n－部などが市の史跡として保存されてい\nます。\nでは、釜石鉱山鉄道とはどんな鉄道で\nあったのでしょうか。鉄道の始まりは明\n治8(1875)年､英国人技師パーセルの派遣\nから始まります。その前年から開始され\nていた鉄鉱石の搬出方法として鉄道が採\n用されたからです。しかし、当初は馬車\n鉄道が想定されていましたが、のちに蒸\n気機関車での運搬に変更されるなど決し\nて順調な作業ではなかったようです。\nこの鉄道は鉱石を製鉄所に運び、製品\nを釜石港|こ運ぶことを目的としており、\n鉱山だけではなく、製鉄所を結ぶ有機的\nなシステムの根幹として機能するはずで\nした。しかし、開通後半年、やっと待望\nの製鉄所が稼動し始めますがわずか3カ月\n後の明治13(1880)年12月に燃料を作って\nいた製炭所が焼失してしまい稼動停止と\nなってしまいます。そのため鉄道も自然\n休業の状態となります。\nおよそ1年間の休業期間中の明治15(1882）\n年1月には旅客の運搬も認められ､満を持\nして3月に再開をします。しかし9月に製\n鉄所の不具合により操業が停止され、そ\nのまま再開されず廃止されるという運命\nをたどります。\nあまり|こ短命であったことや、「専用鉄\n道」という名称のために軽んじられるこ\nとがあった釜石鉱山鉄道ですが、実はそ\nの生い立ちや目的は幌内鉄道と似たもの\nがおおく、ともに「鉄道局」管理外の鉄\n道でした。しかし、鉄道史の中では「鉱\n石運搬」というもっとも緒しょ言げん的てさな目的を\n持った鉄道であり、記憶にとどめておく\nべき存在ではないでしょうか。\n‐〆\n●鉄\n道\n■石炭と鉄道\nそもそも鉄道の生まれたイギリスでは、鉄道は\n石炭などの鉱石を運搬する手段として生まれまし\nた｡重く、また遠隔の地で産出される鉱石をいかに\n運搬するかが産業革命の大事な課題でした｡蒸気機\n関車を実用化したスチーブンソンのロコモーション\n号も石炭運搬の手段として生み出されたものでした。\n｜|滉内以外でもすでにこのような試みがされてい\nました。それは泊村･の茅沼炭鉱でした。茅沼炭鉱\nで幕末から採掘指導にあたっていたイギリス人技\n師ガワーが|ﾘ1治2（1869)年採掘IIから海岸までの\nおよそ2.2kmの間に木製(鉄板張)のレールを敷き、\n4トン積みの貨車を走らせたのです。『'二1本鉄道史」\n(鉄道省：大正7（1918)年)によればこれが日本最\n初の軌道ということになっています。ただ、下り\nは貨車に積まれた石炭の重さで自走させ、のぼり\nは牛に曳かせていたものです｡確かに｢鉄｣の｢道」\nではありますが、「鉄道｣のイメージとはかなり遠\nいトロッコのようなものでした。\n実は|幌内鉄道に続き、明治20(1887)年に開通し\nた北海道2番目の鉄道、釧路鉄道(標茶一跡佐登）\nも硫黄鉱石のための専用線でした。\n道路網が未発達であった明治初期の北海道では\n82"}, {"page": 83, "file": 1, "pdf_page": 92, "text": "「公共交通機関」としての色合いよりも鉱石運搬\n／ 、\n…\nを主とした鉄道がつくられていきました。事実、\n｢駅・時刻表・運賃」\n例えば明治18(1885)年大蔵省から刊行された『開\n拓使事業報告』では幌内鉄道に関する記載が「運 ◎駅\n開通当時の幌内鉄道の姿をとどめるも\n輸」の項目には無く、物産の「鉱物」の項目と土\nのは張碓の義経トンネルと張碓鉄橋のレ\nンガ橋脚のみですが、国指定重要文化財\n木の「道路」の項目に記載されています。\nとなっている「|日手宮鉄道施設」は明治\n期の鉄道の状況を伝えるものです。特に\n扇形車庫である「機関車庫3号」はフラン\n'3．クロフォードの登場 ス積みの優雅な外観を持ち、往時の手宮\n駅構内の様子をしのばせます。\n開通当時、入船陸橋の試運転写真で見\nぱいでん力‘いさい られるように、まだ石置き屋根が普通で\n■｢煤田開採事務掛」\nあったのに対し、手宮駅構内はアメリカ\n長距離の鉄道施設は莫大な費用がかかり、必要 技術のもとにトタン屋根やスレート屋根、\nレンガ造りや、モルタル造りの洋風建築\nな経費と技術力から考えて当時の政府の目には現 物が建ち並んでいました。幌内からの石\n炭輸送が始まるとさまざまな石炭関係の\n実的な提案と映りませんでした｡そこで明治10(1877）\n施設も造られました。\nやま．）ちていうん 手宮-札幌間の開通時には手宮､開運町\n年山内堤雲は『岩内'|滉内両煤田見込耆』を作成し、\n（現南小樽)、銭函、札幌の4駅、札幌-幌\n翌11(1878)年に太政官に上奏します。 内間には江別､幌内太､幌内の3駅でした。\nこのほかに朝里､軽川､白石､幌向には｢フ\nその内容は、 ラッグステーション｣がつくられました。\n開通当時は手宮と開運町以外の駅は簡\n(1)幌内からlll兇向太までは鉄道による輸送。\n単な駅舎以外に周辺に建物もない状態で\nあったと記録されています。蒸気機関車\n(2) I幌向太から石狩川河口まで外輪船による曳航。\nに必要な給水､給炭の施設は手宮､札幌、\n(3)石狩川河口に貯炭場をもうけ小樽に|[l1漕。 幌内にしか設置されず、途中で水がなく\nなり周辺の住民が水を運んだという話も\nというものでした。 のこっています。\nフラッグステーションは乗車の人があっ\n基本的には石狩一小樽の海運を利用する水運方\nた場合旗を揚げ、停車するという簡便な\nもので係員がいる小屋以外の施設はあり\n式でしたが、一部ではあっても鉄道システムを北\nませんでした。\n海道に導入することを求めた画期|'|勺なものでした。 ◎時刻表\n開業当初は時刻表は作成されていませ\nこの案は太政官にほぼ原案通り許可され、いよ ん。明治13(1880)年には朝9:00手宮発、\n12:00札幌着、そして13:00札幌発、16:0\nいよ|幌内炭|||の開発と鉄道・水運建設に向かいは\n0手宮着の－往復のみでした(この年稼動\nじめます。その拠点として開拓使に「煤田開採事 できたのは弁慶1両のみ)。17日間のみの\n運行でした。\n務掛」がおかれ、北海道初めての鉄道建設に向け 幌内まで開通した時の時刻表は未発見\nで、現在確認される最古のものは明治17\nての第一歩が踏み出されました。 （1884)年6月のものです｡1日3往復の運行\nですが、第一列車は運炭のみ、第二列車\nなお､小樽までの鉄道案はこの段階では公的に全\nは貨客混合そして第三列車は札幌手宮間\nく議論された形跡がありません。その原因の一つ のみの運行となっています。第一列車は\n6:30手宮発で幌内|こは10:45着となってい\nに張碓の神居古潭の存在があったと考えられます。 ます｡また明治20年頃までは冬季は札幌\n幌内間は運休となっています。\nここは小樽と札I幌という明治初期の北海道にとっ ◎運賃\n運賃は､上等と並等の2本立てとなって\nて大事な拠点間の交通を阻害している難所でした。\nおり、明治16(1883)年の運賃表では手宮・\n明治9(1876)年にここを視察したホイラー(クラー 幌内間で上等が2円20銭､並等で1円60銭、\n手宮-札幌間では上等80銭､並等60銭で本\nクの後任の教頭)は、鉄道が合理的であるが、たと 州の鉄道と比べても割高なものであった\nようです。\nえ簡単な鉄道であっても高額な費用がかかるため 、\n●鉄\n道\nた｜\n1\n1\nノ ーン\n83"}, {"page": 84, "file": 1, "pdf_page": 93, "text": "現実的ではない、という趣旨の発言をします。また、開拓使がイギリス人ジョン・\nペリーに依頼した札榑間の道路建設費の見積もりは85万円という巨額の見積もりで\nした。この神居古潭の道路開削と短距離の鉄道建設にあたって開拓使が招聰した技\n師がジョセフ・ユリー・クロフオードでした。\nただ、招聰された段附ではll1%内炭田から石炭搬出経路開発の主人公となるべき人\n物が》llに存在しました。オランダから招かれた河川工学の専門家ヨハン･G･ゲン\nトでした。\n■クロフォードとゲント\n煤|||開採掛事務長となったl l_1内と副長となった松本荘一郎はゲントとクロフォー\nドの来日に先立ち、石狩川水運経路をさかのぼり|幌内までの区間を訓査し、また石\nついしかり\n狩、茨戸、対雁（江別)、|幌|Al太で水位の変化、結氷の状況などを記録し始めました。\nケントは石炭運搬のメインの河川整備を担当する「石狩川水利工師」に任命され\nます。\n一方、クロフォードは北海道初めての鉄道システムではあっても短距離の幌内一\n|幌|Al太の区|H1を担当し、また札ll'%周辺の道路整備をおこなう「北海道ノ炭山二連絡\nスル鉄道並ビニ車道建築兼土木顧問」となります。\nこの段階ではクロフォードはゲントの整備する水運に連絡する部分の担当者とし\nて認識されていたと思われます。\nゲントにとって不運だったのは来日した翌明治12(1879)年4月、雪解け水と大雨\nで増水した石狩川が氾濫し各地に大きな被害をもたらしたことです。この水害によ\nり石狩川の水運経路のためには結氷による障害よりも、安定した石炭の積み替え区\n域の造成や増水期の対策が重要であることが判|ﾘ1します。ゲントは石狩川河口の改\n良案などを策定してきますが、最後まで成功することはなく、lll晃内鉄道が開通した\n|司13（1880)年逝去します。\n●鉄\n道\n車馬道を建設中のクロフォード\nカムイコタン付近｡明治12(1879)年\n（北海道大学附属図書館蔵）\n84"}, {"page": 85, "file": 1, "pdf_page": 94, "text": "一方、クロフォードは来日当初は'|滉内から幌向太までの間の鉄道敷設を計画しま\nす。しかし、来日時期が12月であり、すでに山奥の幌内での実測は無理な時期でし\nた。そこで開拓使の指示を受け、とりあえず小樽－札'|滉間の馬車通行可能な道の建\n設に着手します。\n’\n4．小樽鉄道ルートの決定\n■車馬道の建設\n明治初期 小樽一札I幌間のもっとも主要な交通路は、小樽の港から石狩川さらに\nおおともぼり\n茨戸付近までの船(多くの場合、石狩川河口で船を乗り換え)その後徒歩、大友堀な\nどが整備された後は札幌近くまでの船便が主体でした。\n張碓の難所、神居古潭が交通の障害となっていましたが、幕末の頃より徒歩での\n通行が可能な道が次第に整備され､明治5(1872)年には下手稲村から'l152 IM(約3.6m)\nの道路が開通していました。\nしかし、海が荒れると危険な道であることに変わりなく、何より荷馬車の安全な\n通行ができない点が問題となっていました。\nクロフオードは現地視察後、開拓使に札樽間36km総額5万円の工事見積もりを提\n出します。これは以前イギリス人のペリーの見積り額85万円をはるかに下回るもの\nであり、明治12(1879)年開拓使はクロフオードに札樽間道路の建設を命じます。\nクロフォードはこの工事を5ヶ月という驚異的な日程で完成させます。後で触れ\nるようにこの車馬道は翌年には鉄道用地となるため1年足らずの使用期間でしたが、\nえきてい\n北海道で最初の公共交通機関として官設の駅逓馬車が運行されます。この駅逓馬車\nは冬季は雪馬車(馬橇)が使用され、1日30～50台の雪馬車が行き来していたようで\nす。片道の所要時間は3時間程度でした。\n●鉄\n道\n戸\n『 1 守\nh k 低 い碑\n-W\"'\n》一一》鱈瞭、一\n丸\n一\nゆ\n今一\n一\n《\n一\n《\n9\n完成した車馬道｡右に恵比須島\nが見える。明治12(1879)年\n（北海道大学附属図書館蔵）\n〕\n一=､ﾛL唾 豆LI q 2－峰一一\n85"}, {"page": 86, "file": 1, "pdf_page": 95, "text": "■幌内一江別そして幌内一小樽\n車馬道建設直前の|ﾘl治12(1879)年3月、I幌内での鉄道敷設のための調査報告にク\nロフォードは'幌内炭山から江別(江別太：石狩川と千歳川の合流地点)までの鉄道敷\n設案を併記しています。水運併用という点では当初の'|滉内-I幌向太案と同様でした\nが、石狩川の氾濫を考え、より下流で流速の遅い江別太での積みかえ作業を提案し\nた形でした。しかし、ライマンたちの考えた水運併用案は石狩川を制御できない以\n上根本的な欠陥がありました｡クロフォードも早い段階でそれに気がついたようで、\nおそくとも車馬道建設中の同年8月には小樽までの延伸案を検討し始めていたよう\nです。そしてこの年の4月の石狩川の氾濫は水運併用説の限界を示す結果となり、\nちょうどそのころ完成に向かっていたクロフォードの車馬道は、財政的・技術的に\n無理と考えられていた小樽までの鉄道単独運搬を現実的なものとしました。\nそして車馬道が竣工した|司年12月、開拓使は政府に石炭運搬の鉄道を「幌内一小\n樽間」に変更を申し出、その許可を受けます。\nライマンの'幌内炭山調査から7年、やっとその運搬の手法が決定したのです。な\nお、小樽までの延伸の中で、江別太や'幌内太までの運行では石炭以外に貨物は考え\nられないが、小樽まで延伸した場合は「荷物乗客ヨリ生ズベキ利益ハコトゴトク石\n炭ノ運送費ヲ減少スベキ補助トナルベキ」（『開拓使報文』より）という利点が強調さ\nれています。幌内鉄道の本質が鉱山鉄道であったこと、そして小樽延伸で初めて公\n共交通機関としての乗客運搬の議論が出てきたことを示しています。札'幌以東の内\n陸部に和人集落がほとんどなかった明治初期の北海道の現状がここにもあらわれて\nいます。\n●鉄\n道\nｄ ７\nＩＬｈ\nＩＦ\n－\n心\nＢ\n1\n＃一\n席\n‐咽甲呵ｌＪ出\n■ｒＦｑ\nｈ\n可 ｂｒ\nＦ\n《 陛日 Ｌ\n弁慶号の前の技師たち｡正面が\nクロフオード､その左が松本荘\n一郎。明治13(1880)年\n（北海道大学附属図書館蔵）\n86"}, {"page": 87, "file": 1, "pdf_page": 96, "text": "’\n5．建設工事着手\n■米国人技師と日本人技師たち\n鉄道敷設のルート決定をうけ、クロフォードは\n早速､機材の調達にアメリカに戻り、北海道初めて\nまつもとそう'.、らろう\nの鉄道工事は副長であった松本荘一郎によって､若\n竹第三トンネル(現存せず)の開削から始まります。\n｜|滉内鉄道を支えた日本人技師の中に、札||滉農学\n校を卒業した若い技師も一人いました。彼は橋梁\nを担当し､江別にある橋梁の設計施工を行います。\n完成後、初めての列車がこの橋梁を通ったとき、\nあまりの緊張で顔面は蒼白となり、ガタガタ震え\nていたと伝えられています。この若い技師は後に\nアメリカに留学し、帰国後小樽港の北防波堤を築\nひろいいさプム\nき、「小樽港の父」と呼ばれる広井勇でした。\n広井のような、若く優秀な技師たちの貴重な実\n践教育の場ともなった|幌内鉄道の建設ですが、初\n期の現場はクロフォードが自国からつれてきた技\n術者チームが固めていました。この米国人チーム\nが若い日本人技師たちの教材となっていきます。\n機材調達のために帰国中にクロフォードが集め\nた9人(後に2人合流し計11人）の米国人技師は、\nいわばごく普通の鉄道技術者たちで彼らが北海道\nで初めての鉄道建設と運営の中心となりました。\n明治13 (1880)年7月(6月の説もあり）に着任する\nと、現在の双葉高等学校の位置に建設中であった\n建物を仮宿舎として活動を開始しました。\n●鉄\n道\nロ ■\n〃 と 忠 、\n｡ で －\n毒'月齢室\n-..P- -\n若竹トンネル｡奥に熊碓トンネルが見\nえる｡明治13(1880)年頃\n（北海道大学附属図書館蔵）\n■札幌までの開通 ■に＝\n明治13 (1880)年1月に若竹第三トンネルの工事\nから開始された後､工事は水天宮第一トンネル(現\n－』し\n存せず：花園橋付近)、住吉第二トンネル(現存せ\n手宮桟橋に着岸したトベイ号｡明治13\nず：南小樽駅付近)、熊碓第四トンネル(現存：車 (1880)年\n※トベイ号の入港｡当時小樽港は国際港では\n馬道のものを改良)と小樽市内の4ケ所のトンネル なかったため､太政官の特別許可によって直\n接入港する手続きがとられます｡これは小樽\nを次々と開肖llしていきました。また、この区間の\n港最初の外国船入港でもあったのです。\n（北海道大学附属図書館北方資料室蔵）\n最大の工事と見られていた入船川の谷をまたぐ陸\n87"}, {"page": 88, "file": 1, "pdf_page": 97, "text": "橋も「僅カニ九日間ヲ以テ竣工」（『開拓使事業報\n告第二編｣より）するなど順調に工事は進んでいき\nました。\nこの間の9月28日にはクロフオードが買い付け\nた鉄道資材をつんだトベイ号が手宮桟橋に着岸し\nます。\n「義経｣などの機関車は早速手宮桟橋の付け根の\n開通のころの手宮駅構内\n作業場で組み立てが開始され、同時にレールの敷\n明治17(1884)年以前の写真\n設もはじまりました。そして10月24日、手宮から （北海道大学附属図書館蔵）\n熊碓までの敷設が完成し､試運転が行われました。\nlll晃内鉄道の写真としては一番有名な､入船川陸橋を\n渡る弁慶号のシーンが撮影されたのがこの日です。\nちなみに義経号はまだ組み立て中(完成は12月）で\n動くことができる蒸気機関車は｢弁慶｣号のみでした。\n熊碓から銭函までの区間はすでに車馬道として\nクロフォードが建設していたため順調に工事は進\nみます。ちなみにこの区間には現存する北海道最\n古のトンネル通称｢義経トンネル」（当時は張碓第\n五トンネル)と最古のレンガ橋脚｢張碓鉄橋｣が残っ\nています。\n熊碓までの試運転からわずか18日後の11月1111\n手宮・銭函間の「仮運転」が行われます。この段\n階ですでに営業を行っていたと推測され、北海道\n初めての鉄道は実質的にこの日から運行(機関車は\n｢弁慶」のみ)されていたといえます。\n一週間後には軽川(手稲)まで延長し、二日後の\n11月20日、手宮一札幌間、35.9kmが開通し、28 1~l\nに運転式が挙行されます。線路工事はもちろんト\nンネルエ事 橋梁工事などすべての工事着工から\n完成までわずか11ケ月というきわめて速成の工事\nでした。もっともそれに効果があったといわれる\nのは、レールの細さでした。明治5（1872)年、日\n本で最初に鉄道が敷かれた新橋一横浜間で使用さ\nれたレールはイギリス、ダーリントン社製の60ポ\nンド(27216kg)レール(双頭型)でしたが、手宮一\n札 「小樽運河を守る会」の発起人\n会でした。当初、25名。郷土史家の越崎宗一さん\nを会長に正式に会が発足するのは翌年の6月です\nが､思い返せばそれらの方々立ち上がらなければ、\n私たちは今､小樽運河の風景に|+|会うことはなかっ\nたといえます。\nすでに計画が決まっていたばかりではなく、工\n事も始まっていました。そんな厳しい状況に加え\nて、市民の生活から遠い存在になってしまった小\n樽運河を、貴重な歴史的な遺産として残して欲し\nいという運動がどれほど大変だったことか。「小樽\n経済の再生に欠くことのできない幹線道路整備の\n早期実現を」との声の前に、おそらく四面楚歌と\nいっていい状況だったと思います。それが10年に\nもおよぶ1f,'iり強い取り組みとなり、現在に多くの\n遺産を残すことができたのは､なぜだったのでしょ\nうか。\nU\n運河に道路ができると\n出典『小樽運河の保存のための港湾再開発と\n運河再利用計画展パンフレット』\n●運\n河\n側！\n■保存運動の背景\n唯一の光明は時代の風であったかもしれません。\n昭和48(1973)年のオイルショックを契機に、高度\n成長の代償として失ってきたものの大きさを顧み 有幌の石造倉庫群（小樽市総合博物館蔵）\nる機運が高まっていました。日本で歴史的街並み\nを保存する制度ができたのが同50 (1975)年ですか\nら、ちょうど小樽運河の保存運動が始まった直後\nです。それに先立ち、同45 (1970)年には、日本建\n築学会の|ﾘ}治建築調査小委員会による保存したい\n明治建築のリストが公表され、街並みとしては、\nグラバー邸を核とする長l11奇の南III手地区、神戸の\n山本通りの異人館街、そして、小樽運河周辺の歴\n史的街並みが取り上げられていました。文化庁で\nも小樽運河には高い関心を寄せていたわけです。\nI0O"}, {"page": 101, "file": 1, "pdf_page": 110, "text": "同53(1978)年には、札幌を中心に道内の著名な作家・画家・学者など43名により\n「｢小樽運河|川題」を考える会」が結成され、「小樽運河と石造建築群周辺の、歴史\n的・文化的街並の保存と再生を求めるアピール」が発表されました。さらに、｜司じ\n年、東京では「小樽運河を愛する会」が結成されるなど、全国的な取り組みに発展\nし、アピール賛同署名者は全国の著名人およそ120名にまで拡大していきました。\nこれら外からの風は、大きな反響を呼びましたが、それ以上に大きな時代の風は\n小樽のまちの中から起きてきました。小樽運河を残したいという声に冷ややかだっ\nた小樽のまちで起きた新しい風は、二十歳前後の若者たちからでした。\n参考文献：『小樽運河戦争始末』小笠原克著昭和61(1986)年\n参考文献：『小樽運河存の運動・歴史篇 資料篇』「小樽運河問題」を考える会編昭和61（1986)年\n（1） 共同アピール 昭和53年11月I日\n；\n昭和五十一一一（一九七八）年十一月一日\n保存四団体による共同アピール「小樽運河保存の運動」より\n●運\n河 罵\n‘\n･1I時曾郎 呂呵 箆次\n属卑鹿わたりぷ白廼向Ｔ守る の侭しかならないでＬ上今石\nｌ小樽復興の経済学Ｉ\nい掌踵喝阜すみかという力近年も ■＆いか偶鯵炭寸ら年でばなく 華立もした即くみ万で蛇、ロ易画\n新しい町自慢の創造を／\nと心え半うとしてい▲せん。その 里づく申という筏い珂且か今し隼 し炉し『小睡命哩勗問軍ぞ四 韓■せつ吋凸か垂久でいまず。\n運河からのまちづくり\n耐■野咳”そう助礎しぃ固凶轄 の醍壷刃吐邸殴■であることｅ 小樽市ｕこのたび■肉唖立て\nZ(71"}, {"page": 102, "file": 1, "pdf_page": 111, "text": "4． r地域に生きる』とは何か ～若者が担ったポートフェスティバル～\n■｢ポートフェスティバル・イン・オタル」開催\n小樽運河を守る会の2代目会長として、全国的にも小樽運河保存運動のシンボル\nとなった峯山冨美さんは、小樽運河を残す運動に関わる意味を、よく「地域に生き\nるとは何か」という問いとして投げかけていました。ただ単に生きるということで\nはなく、「地域に生きる」ということには、どういう意味があるのか。この問いに、\n自らの体験を持って答えたのは、東京からUターンして小樽に戻ってきた若者たち\nであり、これから小樽に残るか、まちを出るかひとつの岐路に向き合っていた高校\n生たちでした。\n昭和53(1978)年7月8，9日。それは、いつもはll寺間が止まったような静けさに\n沈んだ小樽運河が、一瞬 力｣という新たな\n表現を主張した運動\n運河という「場」がもつ潜\n在力を引き出すためにポート\nフェスティバルのようなイベ\nントを行い、その場に立って\n考え方が変わることを主張実\n践したこと。\n4.町並み保存運動の「教科書」\nとなった運動\n小樽運河というのは町並み\n保存運動のために次々と書き\n下ろされている教科書であっ\nたこと。\n5.日本のモデル事業の政策転換\nのきっかけをつくった運動\n昭和61(1986)年に完成した\n運河散策路等の整備事業は、\nシンボルロードという建設省\nのモデル事業になったこと。\n、\n●運\n河\nﾉ05"}, {"page": 106, "file": 1, "pdf_page": 115, "text": "90Z"}, {"page": 107, "file": 1, "pdf_page": 116, "text": ",M$ 一幹 一 踏 ~二\n呵『 1 1 ~'･\n÷ 里\n■J可\nゴ\nー岸\n廿\n守\n一三\n1\n時\n．\n重~ ィ\n鑓劇鍵\n用囿団旧\n識\n小樽は屋根のない博物館 ‐F凹 一一\n酉\n◆歴史的建造物の建てられた背景\n◆歴史的建造物の建築的特徴\n◆歴史的建造物と関連人物\n「Iﾘl治十四年小樽市街改正図」（市立小樽|xl普館蔵） ‐’\n４\n一癖・》』呪！‐\n牌\n酉\n一一\n』潮』\nＤｌｄ\nマ ー\nー強\n貯偽 寺や 琴\n凸一\n．\n一一\n*\n”\n面呂\n垂一二 ■ Ｒ\nF\n－郡\n一 凧\n漉\n》』二宇\nＬ ｐ\n画ｑⅢ》・可》腫輝一\n１‐＃\n一\n1\n穴 口\n■正改満市樽ﾉ1,車四十巻索\nM\n■大■又竃■ぶ毛\n11 I\n■乳且痔４用\n拳蚤雫\n■車型好手串，肴\n八丁\n在\n丘\n迅\n賂\n心 延催\n竃垂勾■舷■予今台\nＪ Ｌ １ ｒ\n． ９\n敏屋君野毎戴，者\n九\n餌"}, {"page": 108, "file": 1, "pdf_page": 117, "text": "'1\nまちの推移\n江戸末期から明治10年代にかけて小樽で多くの人々が生活していた場所は、勝納\n川の河口付近(現在の信香町)でした。この周辺はりl治3（1870)年の区分によると小\nお こ ばち\n樽郡とよばれ、その北端は於古発川を境に高島郡と接していました。\nこんたん\n明治14(1881)年5 j121日におきた金曇l1l]-の大火で勝納川の北側にあった小樽郡役\n所をはじめ多くの建物が焼失したため、まちの中心を北の入船川に沿った場所に移\n設し、新しい道路と市街地がつくられました。\n1．鉄道開通\n大火の前年の明治13 (1880)年11月28日に開拓使は、｜幌内鉄道の手宮一札|Md間で運\n転式を行いました。線路は手宮を起点として海岸に沿って南北に敷設され、入船に\nはまちの上を通過する木造の陸橋が建設されました｡鉄道の最大の目的は'|滉内(現在\nの三笠市)で採掘した石炭を運搬することでしたが、人や食料、日用品などの物資も\n輸送したことから小樽では流通が活発になり、にわかに商都の賑わいを呈しました。\n船の荷物の揚げ卸しは、現在の運河に架かる浅草橋付近にあった波止場を中心にし\nもつこつせきぞう\nたことから同20(1887)年ころから周辺に大きな木骨石造の倉庫が建ち並び、また、\n色内通には今日の中心市街地の基盤となる商店や旅館などが建てられました。\n2.大 火\n1\n｜ﾘl治期 小樽のまちは何度も大火がありましたが最大の被害をもたらしたのは明\n治37(1904)年5月8日に発生した稲穂町の大火です。火の手は色内、石山を越えて\n手宮まで達し、2,500余戸を焼き尽くしたと伝えられます。その結果、小樽区は市区\n改正(現在の都市計画)をおこない、色内地区を中心とした道路の拡'幅と新設工事を\n実施し、幌内鉄道の線路も西側に移設させています。さらに、この大火を契機に市\n街地の主要建物の構造は木造から木骨石造へ一気に転換しました。木骨石造が用い\nられた理由は防火のためであり、色内・堺町周辺にその商店が軒を連ねました。現\n在見られる木骨石造の商店は大火後に建築されたもので、小樽|,kl有の歴史的な町並\nみを形成しています。\n●建\n築\n3．市街地形成\n宅地の造成は、明治後期から大正期にかけて、川や沢の上流に沿って1l1間に伸展\nしました｡於古発川沿いに開発されたのが富岡に続く緑・最上地区であり明治43(1910）\n年の小樽高等商業学校(現小樽商科大学)の開校も契機になっています。市街地の北\n部では手宮川に沿って梅ケ枝・末広地区が伸び、手宮仲通沿いには豊川・石山・清\n水地区が広がって行きました。\n108"}, {"page": 109, "file": 1, "pdf_page": 118, "text": "4．港と運河\n明治・大正期の港の建設は、港内の波浪を防ぎ、貨物の移動と貯蔵の流れを確立\nし、親水空間を生み出しました。第1の大きな工事は防波堤をコンクリートで建設\nしたことであり、激浪による船舶と海岸付近の家屋の被害を防ぐことに成功しまし\nた。北防波堤の第一期工事は|ﾘl治41(1908)年に竣工し、南防波堤の第2期工事は大\n正10(1921)年に完成しています。第2の大工事は運河の建設です。運河は沖の船舶\nと倉庫の荷役を運搬する艀を考慮した計画であり、工事は港内を埋立てて出島を築\nき、岸辺との間に水路を造る方法で同12(1923)年に完成しました。なお、昭和期に\nなると大きな船I|'|を直接横付けできる埠頭の建設が始まり、昭和14 (1939)年には第\n一埠頭が完成して新たな港湾が形成されることになりました。\n2 明治期の建築\n1．すまい－石置き屋根の住宅と邸宅一\n明治10年代の庶民の住宅は、簡易な木造で建てられていました。建物の外観は、\n入船の鉄道橋脚付近の写真によれば、外壁に横板を張って縦桟を打ち付け、出入口\nふ\nと窓に障子を入れ、勾配の緩い屋根に板を葺いてその上に石を置いていました。｜ﾘ]\n治11(1878)年、アメリカの動物学者モース(Edward Sylvester Morse、大森貝塚の発\n見者)は小樽を訪れ、屋根に石を置いた宿と庶民の様子をスケッチで描いています。\n石置き屋根の建物は、日本海沿岸の松前や江差、函館などでも多く建てられていた\nことが知られています。 ●建\n築\n~\nF －J\n雫 鼬\n::澗謝j』\n劃璽ﾖ澱\nｰ。』\n画｡旧 込､1口・\n言 口軍 ｢ F-→ ｴ･手＝~\n一 一 一 一 一\n＝＝\n一丁 一\n｢4両 一 塞 詞 畢 デ ー 、一一 ＝“F~ー ,, や~寄一風一 堀一\n石置板葺き屋根の民家/入船/明治17(1884)年以前（小樽市総合博物館蔵） 金澤友次郎邸(後､五楽園｡富岡､明治37\n年ころ)は中央に和館､右手に洋館､左に\nサンルームがあり､植物園も併設する大\n融 邸宅でした｡金澤友次郎は福島町(渡島）\nL 剖一 の出身で､鰊漁で資産家になった一人で\nす｡同郷の花田家は留萌で鰊漁を営み、\nI 現在､花田家番屋(留萌市鬼鹿)は国指定\n重要文化財になっています。\n■‐ 壷■■Ｉ vh\n金澤友次郎邸の和館｡竹の床柱と金澤友次郎邸の洋館｡暖炉にはビクトリアン． (写真撮影:安達治\n高い天井が特徴。 タイル(イギリス製)が使われていました。 上段右､下段）\n109"}, {"page": 110, "file": 1, "pdf_page": 119, "text": "｜ﾘ1治初年､祝津では鰊漁の建網漁業者が定住し、\n次第に番屋や倉庫が建ち並び、明治20年代には小\n樽．高島郡で漁獲量がピークに達しました(『小樽\n市史第2．3巻｣)。白烏家番屋は明治10年代の建\n物です。網元のすまいと漁夫の居住部分が－つの\n大屋根でおおわれ、当時の漁家の様子を伝えてい\nます。\n小樽郡役所に転用された外国人寄宿所\n明治後期になると実業家の邸宅が市街地に建て\n（小樽市総合博物館蔵）\nられ、中には広大な敷地に和風の母屋と洋館を併\n置する大邸宅も出現しました。\n2．鉄道の建築一木造洋風建築とれんがの導入一\n開拓使は||I%内(現三笠市)に炭鉱を開鉱し、その\n石炭を輸送するため手宮に明治13(1880)年から鉄\n道施設と桟橋を建設しました。最初の建物である\n事務所、停車場、工場、機関室、列車置場は木造\n手宮機関車庫(明治18(1885)年竣工）\nで西洋風の外側でした。西洋風建築の特徴は、外\n壁を横板張り（下見板張り）にして窓の戸を上下さ\nせる縦長窓(上げ下げ窓)にしている点です。\n鉄道技術を指導するアメリカ人を宿泊させるた\nめ、明治13 (1880)年、住吉(現双葉高校付近)に洋\n風の寄宿所を木造2階建てで建てました｡しかし、\n翌14(1881)年5月に金曇町の大火で類焼した郡役\n所に転用することになり、急いで手宮に合宿所を\nアメリカの工法(｢気球構造｣バルーン･フレーム)で\n新築しました。\n鉄道の建造物にれんがを使う計画は明治16(1883）\n年に始まります。その目的は火災から施設を守る\n●建\n築\n手宮機関車庫の内観(改修前）\n一』\n鋼\nし勾血 り\n入船町陸橋『北海道炭砿鉄道』\n鉄道開設時の手宮の施設/明治13(1880)年/図中A:工場､B:\n板庫､C:吹抜庫､D:石炭庫（北海道大学附属図書館蔵）\n\"0"}, {"page": 111, "file": 1, "pdf_page": 120, "text": "ためでした。れんがは最初東京から輸送していま\nしたが、輸送費が高いため札ll'晃の白石に工場を新\n設し、入船の陸橋と手宮の倉庫、次いで機関車庫\n(明治18(1885)年)をれんがで建設しました｡現在、\n機関車庫はわが国最古のれんが造機関車庫として\n国指定重要文化財になっています。\nこれらを指導したのはアメリカのレンセラー工\n松本荘一郎\n科大学(ニューヨーク州トロイ）に留学し開拓使の\n(レンセラー工科大学蔵）\nまつもとそういちろ湯 ひらいせ↓、Lろう\n技術者になった松本荘一郎と平井晴二郎です。平\n井||青二郎は留学で得た知識と手宮での建築の経験\nを発展させ北海道庁旧本庁舎(明治21(1888)年)を\n設計し、東京駅(大正3（1914)年)の新築では最高\n責任者の帝国鉄道庁総裁として総括しました。い\nずれの建物もれんがを用いた洋風建築として国の\n重要文化財に指定されています。\n平井晴二郎\n3．倉庫と商店の建築一木骨石造の導入\n(レンセラーエ科大学蔵）\n小樽には石造りの倉庫や商店、蔵が多くあり、\n歴史的な町並みの特徴となっています。石壁の構\n造は2種類に大別できます。1つは内部を木で組\nみ外側に石を積んだもの(木骨石造)、2つは石だ\nけで厚く積み重ねたものです。\n平成4(1992)年の小樽市全域の調査では、石造\nり388棟の内、木骨石造が345棟もありました。木\n骨石造が圧倒的に多い理由は、石の産地が近隣に\nあり、木造の技術を使って工期が短縮でき、経費\nが安く、防火構造にできたからです。\n木骨石造の大規模な倉庫は小樽運河沿いに建ち\n並び､広海倉庫(明治22(1889)年)、右近倉庫(|可27\n(1894)年)、小樽倉庫(同23～27 (1890～1894)年)、\n大家倉庫(同24(1891)年)などであります。また、\n11i街地の商店では､金子元三郎商店(明治20 (1887)\n年)、岩永時計店(同29(1896)年)、早川支店('司38\n(1905)年)､名取高三郎商店(|司39 (1906)年)などが\nそでかく\nあり、建物の正面脇に防火のための袖壁(うだつ）\nを建てるものもあります。\n●建\n築\nレンセラー工科大学\n(レンセラーエ科大学蔵）\n＝ ー ､ 堅一 歪＝\n弓P－－ q， －～司 写 i ■、。 ～昂 ■、 ～ 兎\n酉\n騨議\n‘\n右近倉庫(明治27(1894)年竣工)と広海\n倉庫(明治22(1889)年竣工､撮影:安達治）\n〃I"}, {"page": 112, "file": 1, "pdf_page": 121, "text": "かつて全国各地にも木骨石造の建物が建てられて\nいましたが地震などの被害で減少し､現在､小樽が随\n一の棟数を誇り固有の街並みをつくっています。\n4．会社と銀行の建築\n－日本郵船と日本銀行の支店－\n日本郵船と日本銀行の小樽支店は、西洋建築の\n日本郵船(株)小樽支店の竣工写真\n手法を本格的に用いた明治期のわが国を代表する\n明治39(1906)年\n建物です。設計は西欧の建築を初めて工部大学校 (『重要文化財旧日本郵船株式会社小樽支店\n保存修理工事報告書』/昭和62(1987)年）\nぞうか さたちしちじろう\n造家学科で学んだ佐立七次郎(日本郵船小樽支店）\nたつ の きんご\nと辰野金吾(日本銀行小樽支店、工事顧問)です。\n造家学科の第一期卒業生はわずか4人だけであり、 柵《織 繍\nそれたつぞう\n2人のほかには曾禰達蔵(三井銀行小樽支店）と 9\n1\nかたやまとうくま\n片山東熊がいます。片山を除く3人の設計した建\n1\n物が現在も残っているのは小樽と東京のみに限ら\nれていることから、小樽は明治期の本格的な洋風\n建築を肌で感じられる貴重なまちといえます。\n日本郵船の本屋は外壁を石で造り（石造)、2階\nの貴賓室と会議室を華やかなデザインのシャンデ\nきんからかわがみ\nリアや壁紙(金唐皮紙)で装飾しています。\n日本銀行は壁をれんがで造り､玄関ホール(客溜）\nと営業室の境に柱を使わない大空間が見所です。\n柱を取り除いたのは､小屋組に鉄骨(八幡製鉄所で\n製造)を使用したことで旧来の木造よりも軽量になっ\nたためです。\n明治期、日本銀行の主要な建物はれんがや石で\nさいぶ\n建てられていました｡本店が最初に建築され､西部\n(門司)支店、大阪支店、名古屋支店、京都出張所\nそして小樽支店、福島支店へと続きます。明治45\n(1912)年に完成した小樽支店の建築費は37万円を\n要し、本店と大阪支店に次ぐ3番目でした。日露\n戦争が終結し､南樺太へ現金を輸送する拠点となっ\nた時期と重なります。\n小樽支店の設計者は、辰野金吾(顧問)、長野宇\n平治(技師長)、|i'1田信一郎(嘱託)の3人で、長野\nが実質の設計を担当しました。\n1\n聯\n…霧j写\nFL\nF\nj、\n必\n日本郵船(株)小樽支店\n貴賓室のシャンデリア\n●建\n築 ‐‐１町\n謡\n鍵一\n－雷悪\n一，咄\n荊 咽Ⅳ\n言馳\n１\n炉寸１１\n・熱一『\n・\n・』・・ｒ一一\n｛‐一一・へ 鴎一\n阜出\n日本銀行小樽支店の竣工写真\n明治45(1912)年（日本銀行）\n日本銀行小樽支店鉄骨小屋組\n77ク\nLエニダ"}, {"page": 113, "file": 1, "pdf_page": 122, "text": "5．迎賓の建築一小樽区公会堂一\n小樽区公会堂(現・市公会堂)は、明治44(1911）\n年、皇太子行啓の「御旅館」として区民・藤lll要\n吉の寄付によって現在の市民会館の場所に建てら\nれました｡建物の構成は大きく2つの棟からなり、\n平行に並んでいました。1つの棟は玄関のある｢本\n館｣、2つは座敷を連ねた「御殿」の建物です。「本\n館」は謁見に用いられ広間が中央の廊下を挟んで\n左右朴|称に配置され、「御殿｣は宿泊のために一の\n間、この間、三の間が連なり、中でも一の間は床\nの間、違い棚を備え、天井を一段高く上げて格子\nおりあ ごう\nを組み(折上げ格天井)、最上位の部屋としての格\n式を現しています。\nかとうち.むう‐ろ ‐\nト『\n小樽区公会堂(明治44(1911)年竣工)の\n記念写真\n工事を請け負った大虎・加藤忠五郎(小樽､新潟\n県尼瀬出身)は､設計の指導を仰ぐため宮内省を訪\nたくみ き ご\n問し、内匠寮の技師・木子幸三郎に図面を書いて\n小樽区公会堂便殿御一ノ間\nもらい､厳冬の明治44(1911)年1月に工事を始め、\n7月に完成させました。\n小樽市は、昭和35(1960)年、公会堂を花園公園\n内の現在地に移築し、岡崎邸から移設の能舞台と\n組み合せました。これらは、北海道の近代を代表\nする和風建築となっています。\n〃ら\n一\nグ‐\n″！。\n蕊\n再 “１１\n』癖．，\n一一 金安\n●建\n築\nＬ\n’\n〃‘\nト\n6．寺社と教会の建築\nつ こ た ん\n神社の建築は江戸時代に建てられた津古丹稲荷\n可 』\n神社本殿(忍路、嘉永2（1849)年)と恵美須神社本 木子幸三郎 加藤忠五郎\n(『ある工匠家の記録』 （加藤家蔵）\n殿(祝津、文久3（1863)年)があります。ともに鰊 昭和63(1988)年）\n漁で栄えた海岸近くに建ち、大漁と安全を祈願す\nる神社でした。津古丹稲荷神社本殿は小樽に現存\nする最古の建物であり、西川番屋の社殿として国\n道5号付近に建っていましたが道路拡幅のため忍\n路神社境内に移築されました。正面には細かな彫\n刻が施され江戸時代の栄華を伝えています。恵美\n須神社本殿は、正面の柱の間隔が1つで屋根が前\nいつけんしや\n面に延びた社殿の形式(一間社流れ造り）であり、 津古丹稲荷神社本殿(嘉永2(1849)年）\nさやどう\n保護のため外壁を建物(鞘堂)で囲っています。\n\"3"}, {"page": 114, "file": 1, "pdf_page": 123, "text": "寺院建築では、龍徳寺本堂(真栄、明治9（1876）\n年)が現存する中で最も古く、緩やかに四方に広げ\nいりもや\nた屋根は入母屋と呼ばれる伝統的な形式です。天\n上寺本堂(入船、同23 (1890)年)は緑に囲まれた境\n内に建ち、その外観は長野の善光寺を模して建て\nたと伝えられます。大屋根の下にひさし状の屋根\nもこし からはふう\n（裳階)をつけ、玄関に唐破風(中央部がむくり、\n龍徳寺本堂(明治9(1876)年竣工）\n左右両端が反っている)の屋根をのせ堂々としてい\nます。\n小樽聖公会(東雲 明治23(1890)年)は、正面の\n中心軸に切妻の3つの屋根(玄関・母屋・尖塔)が\n並び玄関脇の窓も左右相称に配され、小規模なが\nらシンメトリーな教会の形態を伝えています。軒\nのレース状の装飾はアメリカで流行したカーペン\nター・ゴシックの特徴といえます。\n’\n3．大正期の建築\n小樽聖公会\n1．すまい一事業家の邸宅一 (明治23(1890)年竣工）\n経済が活発化した大正期には事業家の高尚な趣\n味を生かした邸宅が建てられました。\n和光荘(潮見台、大正11(1922)年竣工)は、幾何\n学模様のアール・デコのデザインを基調にした酒\n造会社2代目社長の住宅です。当時、アール．デ\nコはパリを中心に流行の兆しが見られるころでし\nた。傾斜地を上手に使い、正面の階段をのぼると\n左手に応接室があり、奥に昭和天皇が宿泊された\n和室が続き､下階は半地下の食堂になっています。\nまた､別棟の仏殿が渡り廊下でつながっています。\n一方、岡崎邸(入船、大正15(1926)年)は、中庭\nに能舞台が建てられた全国でも希少な住宅でした。\n当主岡崎謙は能舞台を建てるために大工の小杉米\n蔵(小樽、佐渡出身)を伴って各地を調べ、佐渡の\nじんだいすぎ ひのき もちのぶ\n神代杉や九州の檜を調達し、狩野派17代乗信を呼\nび寄せ鏡板の絵を描かせました。能舞台は小樽市\nへ寄贈され、公会堂の庭に移設されています。\n一\n■\n●建\n築\n和光荘\n(大正11(1922)年竣工､撮影:安達治）\nID や 寺 ［,甲 、 ｌ科■■■日引Ｉ ｰ 脚、\n「\n’\n旧岡崎邸能舞台\n(現小樽市能舞台､大正15(1926)年竣工）\n\"4"}, {"page": 115, "file": 1, "pdf_page": 124, "text": "2．銀行の建築 、 －\n大正10年代、金融関連の建物が色内大通と緑山\n手通の交差点に集中して建てられました。三菱銀\n行(大正11(1922)年)､北海道拓殖銀行(同12(1923）\n年)、第一銀行(同13(1924)年)の各支店が完成し、\nその構造はいずれも鉄筋コンクリート造でした。\nちょうど鉄筋コンクリートがわが国の主要建築\n緑山の手通をはさみ左手側に銀行集会\nに採用されはじめた時期であり、小樽の銀行に最\n所(大正14(1925)年竣工､平成17(2005)年取壊)、\n三菱第一、日銀､右側に拓銀､郵便局、\n先端の建築技術が導入されたのです。設計は中央\n北海道銀行が並ぶ｡(撮影:安達治）\nの建築家や設計組織によるもので三菱銀行は清水\n組(現清水建設)、拓殖銀行は大蔵省営繕に属し後\nに国会議事堂の設計で技師長になった矢橋賢吉ら\nであり、第一銀行は中村田辺建築事務所の田辺淳\n吉が担当しました。\n第一銀行の装飾は、曲線を生かすアール・ヌー\nヴォーの影響を受けてドイツ・オーストリアで興っ\n第一銀行小樽支店東立面復原図\nた芸術の革新運動(ゼツェッション)の様式が取り\n(製図:佐藤由美子･北海道職業能力開発大学校）\n入れられました。建築家田辺淳吉は、渡欧して感\n銘を受けた華やかな装飾を小樽で表現したのです。\n残念ながら出入口周りの彫刻や柱の装飾は取り除\nかれましたが内部の柱や梁に曲面や曲線の連続模\n様を見ることができます。\n●建\n築\n3．商店の建築\n大正期、商店の外壁にコンクリートやモルタル\nを塗り、さらにタイルを張る防火建築が出現しま 北海道拓殖銀行小樽支店『建築雑誌』\n大正13(1924)年\nした。明治期の小樽でさかんに用いられた石材に\nかわり、セメントが新たな建築材料として使われ\nるようになったのです。\n木造の建物の外壁に細い鉄筋や金属の網を張付\nけ、コンクリートやモルタルを塗り重ねる工法で\nす。重い石材よりも建築作業が容易であり鉄筋コ\nンクリート造よりも安価に建てられることから、\nしだいに住宅にも普及していきました。モルタル\n塚本商店\nは細かな装飾にも適していることから表情豊かな\n(大正9(1920)年竣工､撮影:志佐公道）\n外観が造られました｡塚本商店(色内､大正9 (1920)\n\"5"}, {"page": 116, "file": 2, "pdf_page": 1, "text": "年)は土蔵造りのように見えますが外壁全体に厚い\nモルタルが塗られています。近藤硝子店(稲穂、大\n鳶鎚\n正初期)は正面に緩やかな3つのアーチを連続させ、\n軽やかさを表現しています。前堀商店(色内、大正\n8(1919)年頃)はモルタル下地にタイルを張った初\n畿\n期の商店建築であり、窓枠にはスチールサッシが 司､Y\n用いられています。 畷\n小樽運河埋め立て前の風景\n（撮影:安達治）\n4．運河と工場建築\n小樽運河の建設には10年の歳月をついやし、大\n正12(1923)年に完成しました。水路は沖に出島を\n築いて造り、全長1 ,324m、111540mありました。運\n河の目的は船荷を運搬するためであり、沖合の大\n型船と岸辺の倉庫を艀で結びました。\nせいかん\nこの運河の建設と同時に北海製罐倉庫(現北海製\n罐)の工場施設が出島に建設されました｡大正10(1921) 北海製罐(株)工場(昭和6(1931)年竣工）\n鉄筋コンクリートによる近代工事建築の外観\n年から昭和10(1935)年にかけて事務所棟をはじめ が運河の水辺に映っています。\n工場・倉庫の主要な建物が鉄筋コンクリート造で\n竣工しました。事務所(昭和10 (1935)年)は横長の\n連続窓が特徴であり、近代建築のモダンな外観を\n表現しています。工場(昭和6（1931)年)の外観は\nはり\n柱と梁で建物の骨格を現し、そこにスチールの窓\n枠を納めた単純明快なデザインになっています。\n第三倉庫(大正12(1923)年)は、外壁にスパイラル\nシュート(渦巻状滑り台)をつけ、製品を一気に艀\nに積み込む工夫をしていました。\n一\n』\n●建\n築\n北海製罐(株)第三倉庫\n(大正12(1923)年竣工）\n小樽運河の北側に建ち並ぶ工場施設は機能をデザインに組み込む近代建築の典型\nであり、今もなお運河の水辺に映えて良好な景観を形成しています。\nO &0 \\ 1P0M\n■■■■■■■\n北海製罐の一連の建物は､観光客で賑わう運河沿いに建つ(建物配置は1992年時）\n皿6"}, {"page": 117, "file": 2, "pdf_page": 2, "text": "'4．昭和の建築\n1．すまい－建築家とデザインの洗練化一\n露\nまちの繁栄にともない大正末から昭和初期にか 饗 一 患剣\nけて建築家や請負人、建て主の設計になる洗練さ\nれた住宅や店舗を兼ねたすまいが建てられました。\nばん\n坂邸(見晴町、昭和2（1927)年、平成19 (2007)年\n坂邸(昭和2(1927)年竣工、\n焼失)､坂牛邸(入船､昭和2（1927)年)と高田邸(富 平成19(2007)年焼失､撮影:安達治）\nたのうえよしや\n岡、大正14(1925)年)の設計者である田上義也は、\n東京の帝国ホテルを設計したライト(Frank Lloyd\nWright)に師事し、ライトの帰国後に来道してモ\nダンなライト風の建築を数多くデザインしました。 二ルP ー鍔~‐\n田上の設計した住宅の外観は変化に富み、軒は深\nしっくい\nく、外壁は横板と漆喰を組み合わせ、窓の桟割り\nは幾何学的に区切っています。\n坂邸は北海道の炭鉱発見者の一人である坂市太\n郎の子息・敏男の別荘として海を望む銭函の高台\nに建てられました。屋根の色が赤、壁が淡いピン\nクだったことから「赤別荘」と呼ばれていました。\n水上歯科医院(住ノ江、昭和8(1933)年)は、玄\n関を正面中央に置きながら左手に円柱と塔屋を構\nえて非対称の美しさを表現しています。一方、岡\n川薬局(若松、昭和5 (1930)年)の正面はドーマ窓\nを屋根の中央に配置し、左右対称の均一さを印象\nづけています。いずれも母屋の後方に住宅が続き\n併用住宅になっています。\nロ ■ ■ 丹．\n■ ー\n坂牛邸(昭和2(1927)年竣工）\n等号長\n．\n=j\n●建\n築\nｌ｜\n畠~園\n水上歯科医院\n(昭和8(1933)年上棟､撮影:安達治）\n2．公共の建築一小樽駅舎と小樽市庁舎一\n昭和初期に小樽の公共建築はコンクリートで建\nてられました。これは地方都市として全国的に早\nい導入といえます。\n小樽駅(稲穂)は東京上野駅以北で最初のコンク\nリート造による近代駅として昭和9(1934)年12月\n25日に竣工しました。吹き抜けの中央のホールは\n前後の高窓から自然光を入れ、ガラスが張られた\n天井からはシャンデリアのように電灯で照らす明\nＦＦＰ\n司５勺 薮Ｆ『ザ\n｜■\n上|~ﾘ\n岡川薬局\n(昭和5(1930)年竣工､撮影:安達治）\n皿7"}, {"page": 118, "file": 2, "pdf_page": 3, "text": "るい室内を設計していました。また、敷地の高低\n差を利用したプラットホームと地下道の設置は、\nﾈ'l'戸や東京で造られた高架式駅舎の設計を応用し\n_=－－坐 一r凸罰\nたものと考えられます。先端の素材と設備を用い 鯨報\nているのも特徴といえます。磁器タイルを外壁に 一 …\n張り、浄化装置を便所に設置し、エレベーターを\n荷の揚げ卸しに備えました。 小樽駅舎\n(昭和9(1934)年12月25日竣工）\n小樽市庁舎(花園、昭和8（1933)年)は、市建築\n課長・成田幸一郎の設計になり、玄関ホール正面\nほうおう\nの階段室には鳳凰と幾何学模様を組み合わせた美\nしいステンドグラスを入れ、重厚な中にも華やか\nさが盛り込まれています。外観は小樽駅舎と共通\nし、正面玄関をはさんで左右を相称にして中央を\n高め、中心性を強調しています。正面6本の柱の\n上(柱頭)には古代ギリシア建築に端を発する渦巻\n/ \". ､\n状の彫刻模様が施されています。当初の設計では\n中庭にテニスコートがあり、それを取り囲むよう 小樽市庁舎\n(昭和8(1933)年竣工､撮影:志佐公道）\nに事務室と倉庫が配置され、余裕のある市庁舎の\nたたずまいが感じられます。\nー判酔 討一 一生 一\n●建\n築\n3．銀行建築一三井銀行と安田銀行支店一\n小樽の経済活動が活発であった昭和初期、三井\n銀行(色内、昭和2（1927)年)と安田銀行(色内、同\n5 (1930)年)の支店が新築しました。\nかこうがん\n三井銀行は外壁に花崗岩を積み、アーチを連続\nさせ、軒を装飾するルネサンスのデザインで統一 三井銀行小樽支店\n(昭和2(1927)年竣工､撮影:安達治）\nしていますが、その構造には鉄骨鉄筋コンクリー\nト造が採用されています。耐震に優れた鉄骨鉄筋\nそねちゆうじょう\nコンクリート構造を曾禰中條建築事務所が設計し\nた理由は、大正12(1923)年に発生した関東大震災\nによって石造やれんが造の建築が甚大な被害をう\nけたためです。その後 鉄骨鉄筋コンクリート構\n造は三井銀行名古屋支店(昭和11(1936)年）・大阪\n支店(同12(1937)年)でも採用され、わが国の高層\n建築における耐震構造の規範にも発展しました。\n安田銀行小樽支店\n安田銀行小樽支店は同行本店営繕課が設計し、 (昭和5(1930)年竣工）\n〃8"}, {"page": 119, "file": 2, "pdf_page": 4, "text": "全国の支店と類似した外観になっています。その\n特徴は、中央に大きな柱を連続させて柱の間に縦\n長の窓を配し、両脇に壁を設ける形態です。平成\nひきや\n13 (2001)年、中央通り拡'隅工事のため曳家で移築\nし、所有者の理解で次代へ引き継がれる鉄筋コン\nクリートの建物になりました。\n龍宮閣とオタモイ海岸/昭和9(1934)年\n4．娯楽の建築一龍宮閻－\n竣工､同27(1952)年焼失\nまちが活発になり、夢のような計画を実行する （小樽市総合博物館蔵）\n人物が現れました。蛇の目寿司の加藤秋太郎は、\nオタモイ海岸の断崖絶壁に龍宮閻を建て、遊園地\nをつくり､娯楽と憩いの場を市民に提供しました。\nかけづく\n龍宮閣は清水寺のように崖地に建つ懸造りにし\nて海へせり出し、絶景を楽しむ料亭でした。現地\nを調査した結果 平地の'隅はわずか4m、水而か\nらの高さは約33mありました。建築工事は昭和8\n龍宮閣外観図\n(1933)年春から始まり同9（1934)年夏に完成しま\n(製図:平松久留美･北海道職業能力開発大学校）\nした。夢を実現した加藤秋太郎の龍宮閣ですが同\n27(1952)年5月9FIに出火し、15mの海風にあお\nられ5時30分に焼失してしまいました。現在、跡\n鵜\n地に基礎が残っています。\n産\nトー\n●建\n築\n鍵‘\n5．建物の再利用一鰊漁家とまちの現況一\n小樽の歴史的建造物は移築や改築によって飲食\n店や硝子・オルゴールの店、ホテル、新聞社、住\n宅などさまざまな用途に転用されています。その\n先駆けとなったのは豪壮な鰊漁家や番屋の建物で\nした。\n余市の猪俣邸(明治33 (1900)年)は銀鱗荘として\n昭和13(1938)年に桜へ移築され、泊の田中家住宅\n(明治30 (1897)年)は「鰊漁場建築」として昭和33\n（1958)年に祝津で再建され'|召和35 (1960)年には北\n海道有形文化財になりました。また、冑山家住宅\n(祝津、大正8（1919)年)は北海道開拓の村へ昭和\n55 (1980)年に移設されました。一方、祝津のlll白\n烏家番屋(明治10年代竣工)と茨木家中川張番屋(|ﾘ1\n一一\n銀鱗荘\n(旧猪俣邸､明治33(1900)年竣工､昭和13(1938)年\n移築）\n一\n青山家住宅\n(大正8(1919)年竣工､昭和55(1980)年北海道開拓の\n村へ移築）\n血9"}, {"page": 120, "file": 2, "pdf_page": 5, "text": "治末期)は取壊しが危倶されましたが、ともに再生\nされ地区の歴史的な景観を形成しています。\n銀鱗荘は、｜|召和9（1934)年に内務省が認可した\n「田園都市」計画の一部として移築されました。\nこの計画全体は野口喜一郎を代表とする東小樽土\n地区画整理組合が朝里(現在の桜)地区一帯を宅地\n分譲するもので、現在利用されている桜IIT本通り\nのロータリーや地形に合わせた周辺道路はこの時\n整備されたのです。\nさて、今日小樽では歴史的建造物を再利用して\nいる事例を数多く見られます。これは、市民の建\n物に対する愛着が大きな基盤となり、小樽市の景\n観条例(｢小樽の歴史と自然をいかしたまちづくり\n条例｣）とあいまって安易に取り壊さず利用しよう\nとする共通の意識が根付いてきた証と思われます。\nわたしたちは、今後とも小樽の歴史的建造物を小\n樽独自の文化や歴史、港湾都市の魅力を現す財産\nとして品格のある利用を心がけたいものです。\n》\n一一トー‐一\n一\n一ｌｌｊ限》 －\n１一\n茨木家中出張番屋（明治末期）\n旧小樽地方貯金局\n(現市立小樽美術館･文学館､昭和27(1952)年竣工）\n／－ 、\n【コラムD\n束小陣土 珀匹 ■整 煙幽令 亘皿予宜 函\n岡頁 晶●■丘七 卑単凸■\n｢イギリスの田園都市と桜町のロータリー」\nイギリスのE.ハワード(Ebeneze｢ Howard)は、自\n然の景観を取り入れて放射状の道路を設けた田園都市\nの構想を明治31(1898)年に発表し、『明日の田園都市\n(Ga｢den Cities of Tomo｢｢0w)｣ (同35(1902)年)と題\nして本を出版しました｡そして､同36(1903)年には会\n社を設立して実際にロンドン郊外のレツチワースに理\n想のまちを建設したのです。\nわが国ではいち早くこの計画に着目し､内務省の有\n志によって『田園都市』(明治40( 1 907)年)が出版されま\nした。\nさて､小樽の桜町本通りを中心とする一帯は、この\nハワードに端を発する田園都市の計画思想にもとづい\nて昭和9(1934)年に設計されたまちなのです｡道路は\n□一夕リーから放射状に5本がのび､本通りを境に丘\n陵の地形の高さに合わせて曲線状に配されています。\n実際に道路から見てもこの計画の全体像はわかりませ\nんが、市街地図で確かめてみると自然の地形を生かし\nた「理想のまち」であることが納得できます。\n●建\n築\n|I\n東小樽土地区画\n(昭和8(1933)年､北田智子蔵）\nノ\nZ20"}, {"page": 121, "file": 2, "pdf_page": 6, "text": "轡■ ｡ ‘心 一手 護 凸幸 郡，’⑪署．‐\"一・-“－ V“‘岬一 f ~~かご‐ -.-‘--~葛 害、論_竿\n6．\n’（ ‐\n■ 一計』 T一IWEF-'' 睡坐 畠一一と I 『索一 郵今 ， d n 1 ． N鴇』, 一\n亀\n二勺\n■\n凸\n． 〃\n■\n9\n､\n掛研弱一rJ姥\n硝\n士\n一\n錘\n咽\nＦｊ■\n二\n》■０．\n曲\nf\n｜，\n擁\n『\n胞\nで\n４■■\n庖\n一\nＪ\n山\n『\n一 一幸 ■ b 出\n郭弓 ” ‐･ヨ、\nあ\n肘\n、"}, {"page": 122, "file": 2, "pdf_page": 7, "text": "1． はじめに\n昭和61(1986)年に小樽運河散策路が完成したの\nを期に、「小樽観光元年」といわれるようになり、\n多くの観光客が運河を目当てに訪れてくるように\nなりました。\n「小樽寿司屋通り」は、寿司を食べに来る大勢の\n小樽観光のメッカとなった堺町通りに\n人で賑わっています。 は硝子.陶器.石.木.麻などローカル素\nオルゴールはミュージアムや製作体験ができる 材の製作体験が整備されています\n施設も整備され、硝子は「小樽か硝子か、硝子か小樽か」ともいわれるように、小\n樽観光をリードし、今日ではミュージアム・製作体験施設など、多くのショップ。が\n軒を連ねています。\n中小企業庁が進めるJAPANブランド(全国で毎年約30地域が指定)の平成17 (2005)年\n度・平成18 (2006)年度に選ばれ、国際的にも評価されつつあります。\nもちろん、小樽観光の楽しみはまだまだたくさんあります。ラーメン・蕎麦・ア\nイスクリーム・菓子などは市民に愛され続け、観光客にも人気があります。\n修学旅行や生涯学習を対象とした教育観光(スタデイツーリズム)にも力点がおか\nれ、歴史・文化に関するさまざまな体験プログラムも生まれてきています。\n’ 2．小樽の寿司\n1．寿司の歴史\n酢を利用する料理に飯寿司があります。醗酵させた酢を使うことで保存性をもた\nせる技術です。これが原型となって寿司が誕生しました。\n●\n寿司には、l對酉g押し寿司、江戸の江戸前寿司の2つの起源があるといわれてい\nオ硝\nル子\nます。キlllし寿司は酢の特徴を生かした料理であるのに対して、江戸前寿司は、同じ\nゴ・\n’寿\n酢めしでも延頁の前浜で.とれた新鮮なネタに特徴があります。\nル司\n小樽で寿司の人気が高いのは、小樽の前浜でとれた新鮮な魚貝類が豊富なことに\nあるといえそうです。\n2．小樽の寿司\n寿司は小樽でも明治時代からありましたが、今のような寿司専門店は少なく、和\n食あり、洋食あり、鰻もだせば、寿司も出すといった料理屋が大半でした。大正初\n期には会津屋・加賀屋・福井屋といった店の広告に、「寿司・御料理」がみられ、寿\n司店には都寿司や江戸シ子という店がありました。家庭では「押し寿司」をつくっ\nていた記録も残っています。\n122"}, {"page": 123, "file": 2, "pdf_page": 8, "text": "寿司は当時も御馳走の一つで、来客や祝い事な\nどがあると、家族総出で食べにいく光景がみられ\nました。\n云\n;|mg\n…‐…\n3．小樽寿司屋通り\nll召和62 (1987)年寿司店有司こよよるる、、鰊をはじめ\nとした「魚供養祭」が始まり、 これを核に「小樽\n小樽寿司屋通り\n寿司屋通り会」が誕生、 今口の ｢小樽寿司屋通り」\nに発展しました｡中心になっているのは五店会(政\n寿司・まちの．日本橋・大和家・しかま)、同62(1987)年当'1寺、寿司屋通りにはこの\n5店舗しかありませんでしたが、現在では約20店舗が営業しています。\n小樽市内全体では100店舗以上の寿司屋が腕を競っています。\n’ 3．小樽のオルゴール\n1．オルゴールの歴史\n1796年スイスのジュネーブの時計職人アントワーヌ・ファーヴルによってシリン\nダー型のオルゴールが誕生しました。\nディスク型のオルゴールは、1886年にドイツでポール・ロッホマンによって完成\nされ、1889年ポール・ロッホマンのシンフォニオン社は、ディスクオルゴールの本\n格的な工場となり、商業的に大きな発展をみました。\nオルゴールは、210年の歴史の中で、各国でさまざまに作られていきます。王侯貴\n族の愛玩用に、ホテルやレストランで、駅の待合室で、そして家庭の中で、赤ちや\nんを育て、たくさんの思い出をつくってきました。\n●\nこうして200年前に音楽の缶詰として生まれたオルゴールは時代に受け入れられ、\nオ硝\nル子\n誕生の100年後全盛時代を迎えることになりました。 ゴ・\n’寿\nル司\n2．日本での歴史\nじめいきん\nオルゴールの語源はオランダ語のオルゲル(0rgel)です。日本では「自鳴琴」とい\nわれていました。嘉永5（1852)年見世物として江戸の深川LI'町で披露され、文久年\n間(1861～1864)には時計師小林伝四郎が日本の曲譜に合わせたオルゴールを製造し\nたという記録があります。\n3．小樽とオルゴール\nオルゴールの音色がレトロな町並みに最も似合うという感じた人々(小樽オルゴー\nル堂．海鳴楼など）が、小樽にオルゴール市場を形成してきました。\n723"}, {"page": 124, "file": 2, "pdf_page": 9, "text": "硝子・寿司と並び称されるまでになったオルゴー\nルは、今でもさらなる進化に向けて歩みを続けて\nいます。\n4．小樽の硝子\n1．硝子の歴史\nシリンダー型オルゴール\n硝子はエジプトやメソポタミアなどの古代文明\n（小樽オルゴール堂）\nに起源をもっています。初期には宝石や貴金属に\n近いものとして支配者階級の愛好品でした。これ\nが採光用(窓)として普及するのは14世紀以降です。\n日本では､天正3（1575)年オランダ人技師によっ\nて、長崎で製造が始められました。明治6（1873）\n年東京府北品川宿(現･東京都品川区北品川)に民営\nの品川興業社硝子製造所が開設され、同9(1876）\n年工部省がこの製造所を買い上げ官営になりまし\nた。\n19世紀末には都市化にともない採光用の板硝子\nが普及し､板硝子と硝子器は分化していきました。\nI\n詔\n四\n－\n1\n．画\nディスク型オルゴール\n（小樽オルゴール堂）\n2．小樽と硝子\n■硝子製造\n明治34(1901)年設立された浅原硝子は､北海道の硝子器製造業の草分けといわれ、\n現在唯一の漁業用浮玉工場として、また「小樽雪あかりの路」の運河にちりばめら\n●\nれた浮玉製造で有名です。 －\nオ硝\nル子 あさはらひさきら\n浅原硝子は、博多で生まれた浅原久吉が博多や大阪で腕を磨き、小樽の富岡町で\nゴ.\n｜寿\n窯を開いたのがはじまりです。\n|ル司\n■硝子販売\n昭和9（1934)年浅原硝子は現在の天ﾈII1に移転します。浅原久吉は製造と販売を分\n離し、久吉亡き後 製造は2代目久吉、販売は弟久重が継承します。この販売会社\nが今の北一冊ili子です。\n昭和40年代小樽のレトロブームの火つけ役となったのは、稲穂町で馬そりにラン\nプをディスプレーしていた北一硝子でした。\n昭和58(1983)年北一硝子は堺町の木村倉庫を譲り受け、北一硝子三号館を開設、\n多くの人々に小樽の硝子の魅力を見せつけ､小樽観光の牽引役を果たしてきました。\n124"}, {"page": 125, "file": 2, "pdf_page": 10, "text": "■スタジオ(工房）・グラス\n硝子を素材としたスタジオ・グラスが立体造形\nのアートとして認められたのは、1960年代のアメ\nリカでした。\nヨーロッパの伝統から発し、アメリカで起きた\nスタジオ・グラス・ムーブメントは世界に波及し、\n昭和47 (1972)年「日本ガラスエ芸協会」が発足し\n小樽オルゴール堂\nます。同49(1974)年本邦初の「日本のガラス展」\nあさは らちよじ\nに出IIIIIIして注目を浴びたのが浅原千代治です。千\n代治は同54(1979)年に小樽に｢グラス・スタジオ・\nイン・オタル」を設立しています。\n参考文献\n｢スイスオルゴール・リュージュ社」\nhttp : //www.musicbox.co.j p/index・htm l\n｢小樽国際ガラスエ芸フエステイバル図録」\n小樽国際ガラスエ芸フエステイバル実行委員会平成2(1990)年 北一硝子三号館店内\n『風の軌跡』土屋良雄\n『浅原千代治ガラスエ芸』日本放送出版協会\nF． F ‐舎凸一 農\n・似\n一＝\n悪い e巳\nI\nオルゴール\n●硝子・寿司\nの\n小樽雪あかりの路に使用される浮き玉\n（\nジャパンブランドの作品\n125"}, {"page": 126, "file": 2, "pdf_page": 11, "text": "iｰ\nIg9\n1\n1\n，1．11\nl\n『\n覇『、\n､ムl"}, {"page": 127, "file": 2, "pdf_page": 12, "text": "ヨーニ 一一一一ユ 叩一 一』 一‐》\n１１■可\n全\n司\n》暑土》一一\nＦ\n『 いす》＆ 一\n■\n一\n一 宇 一 函\n－\nＬ ▲圭 Ｆ 匹寺\n一\n』 》一口 一一 心 一 牌一 ＬＢ函・ 世一一｝ 「■．ｐ\n可\n閏 一 里 心 一 守』 一一 ■ 一手二”一恥\nゞ叩二\n動\n毎審‐罹一》 － 両 一 一■領\n|gi\" --;\n二匙可\n■ ー\nＬ\n毎凸\n陽\n豆一\n謬\n』血\n塑\nじ\nロ詩一L＝ 鼬 開田団四 － a■ 一 ▲己T\n感 、\n多くの画家を輩出した小樽の風土を知る\n司勾\n宙．－．.“\n電 一応か\n◆小樽、壇の立役者たち\n羊蹄画会 雪 ■ 凸T\n二息一・\n~\n衝\n◆小樽派と1l乎ばれた画家\n巳\n二” 三浦鮮治門下の小樽の風景 超函‘鍛一 ‐一・ヨトい制一\n◆小樽で見ておきたい版画\n三一\nぜ■吋\n脾\n１ 「\n１\n巳\nむ》Ｂ\n亨 も\n斎藤清・河野菫\nー\nヒヨ\n金子誠治・一原有徳\n車 一 一一一\nn L\nり\n字\n‘\n＃\n４\nｑ\n一一\nｊ\n＝~字句\nザ』 じ\n単一 夢\n為\n鍾\n１１ 断 I 鑑 悪’ 鶏\n明 1F － W ■11↑\n口口\n一口\nWi\"\n炉1\n宵\n匙\n匙\n弾一\n竺低君 寺\n一二一\n＝,再F － L ‐＝\nF- 一 - 一\n疑 一 一 笈 一＝ 垂一一 畠 Fし 幸 庫a\nエ窪\n‐ｊ\nＦ\n＝ 屋\n白 一》 一山齢》『\nI\n■\nｰ\n一「や\n1一甲I\n『■■■\n写\npQ １１１ F ■ 皇 で 面 ’ 全 ．‐ ■ q 恩 ,1■\n” D q\n－ 三\n上 L J 司丘 1\n》\n勺 二 趣 一 浄 甲『\n画卓\n■罰《\nＦ\nＬ 軍手、蝿幽浄一ゞ"}, {"page": 128, "file": 2, "pdf_page": 13, "text": "1． 小樽美術の夜明け一羊蹄画会\n■小樽美術の夜明け\n小樽は札幌とともに黎明期の北海道美術界で重\n要な美術運動がおこりました。明治期の美術団体\nようていかかい\n「羊蹄画会」は、明治40(1907)年夏休みで帰省し\nていた東京美術学校(現東京芸術大学)在学中の、\nはせがわのぼる 二でらけんきち <と．うさぶろ農 羊蹄画会自由研究所新年会記 後を受けた中村善策の複雑な\n地形を活かした構図の作り方、現場制作の風景な\nどを総称してそのように呼んだようです。\nリ\n中村善策「けむり」昭和12(1937)年/油彩･ｷｬﾝﾊｽ\n明治34～昭和58(1901～1983)年\n’ ’\n4．中村善策と一水会の系譜\n中村善策「海港の秋」\n中村善策は、のびやかな構成と明るい色調で、 昭和34(1959)年/油彩･キャンバス\n北海道の自然をモチーフに多くの秀作を生み出し\nています。大正末に上京したため、昭和3（1928）\n年に結婚して一時小樽に戻った以外は、東京の上\n落合にアトリエを持って活躍していました。題材\nを求め毎年のように帰郷し、地元の後輩たちと交\n流するなかで、その現場主義を伝えています。小\n樽では夏のほぼ1ヶ月、南小樽駅前の魚松旅館に\n滞在し制作していました。写生地は、花園公園、\n小樽運河、張碓、朝里海岸 奥沢水源地、祝津\n塩谷などが主な場所で、熟知した対象を繰り返し\n描いています。数十回も同じ現場を訪れるという\n執勧さは、その風景を巧みに消化するというだけ\nでなく、構図を練り上げ、色彩を輝かせて風景ま\nるごとの生命力をとらえようとしたからです。そ\nの土地の地形や生活習慣をよく知るほど、生きた\n●美\n術\nZ31"}, {"page": 132, "file": 2, "pdf_page": 17, "text": "構図を作りやすいと語っていました。描き出された風景は、現場の忠実な再現に留\nまっていません。中村は徹底的に風景を観察します。そのうえで理想の画面構成を\n得るために、必要なだけ変形し強調し、あるいは省略されていることが、制作現場\nに立ってみて納得させられます。小樽をこよなく愛していた巾村は、生前から小樽\n市に作品を寄贈し、かつては市民会館で公開されていましたが、市立小樽美術館が\n開館した昭和54(1979)年に作品が移管され、さらに没後ご子息からの多くの寄贈が\nあり、美術節の11階に中村善策記念ホールが併設されました。\nいつすいかい\n中村善策の画業は－水会を中心に展開しています。そのため北海道でも中村を尊\n敬する若手画家たちは、この展覧会をめざす者が多くなりました。風景画の題材に\nいし一j刀､つれお\n恵まれた小樽は、小竹義夫、金丸直衛、石塚常男など多くの風景画家を輩出し、彼\nらは中村にあこがれ－水会へ出品を続けました。\nおがわきよし とみさわけん\n現在活躍する在住画家では、小川清、冨澤謙がいます。彼らは中村善策を頂点と\nする風景画家の系譜に属し、その写実の精神を直接継承した最後の画家たちといえ\nます。小川清は、小樽にじっくりと腰を据えて、古びた路地と新しい町並みの共存\nをはかる小樽の新旧を情感豊かに描いています。冨澤謙は、中村の小樽での写生地\nを丹念に追跡調査し、その創作の原点をひもといています。中村の現場主義を小樽\nを題材に受けつぐと同ll寺に、近年は旅にlllて風景のモチーフを選ぶという姿勢で制\n作に取り組んでいます。\n5．小樽創作版画のひとびと\nさいとうきよし\n戦前、小樽には重要な版画家が2人かかわっていました。ひとりは斎藤清、もう\nむなかたしこう\nひとりは棟方志功で、 lll界的に著名な版画界の巨匠です。ともに東北出身で、その\n作品が認められたのは海外の国際展からで、戦後の版画ブームの火付け役となりま\nした。斎藤には洗練されたモダンな感覚があり、棟方には原始的な心象性がありま\nす。その芸術は鮮やかな対照をなしていますが、この2人の若い頃の接点が実は小\n樽にありました。\nなり↑-きI′1上ん\n棟方志功の来榑のきっかけをつくったのは、成田玉泉という図画教師でした。成\n田によって、棟方志功が小樽に招かれ、斎藤清が美術家としてのスタートを切り、\nかわのかおる\n河野薫や金子誠治が木版の道に進むことになったのです。\n成lll玉泉(本名成田正実)は､緑小学校と小樽市中学校で図画教師として指導にあたっ\nており、棟方志功とは|両l郷の友人でした｡昭和4(1929)年小樽駅に到着した棟方を、\n成田と当時彼のもとで絵を習っていた斎藤清が出迎えています。成田は小樽市中学\n校へ棟方を案内しそこで講演会を開催し､学生たちとも語り合い､ともに小樽公園へ\n写生にでかけています。その学生のなかに金子誠治がいました。成|Ⅱは棟方志功の\n力強い多色刷木版を見せ､下絵の描き方､画材の選び方までを熱心に指導しました。\n●美\n術\n132"}, {"page": 133, "file": 2, "pdf_page": 18, "text": "昭和5 (1930)年の道展には｢小樽 棟方志功｣とし\nて出品の記録があり､作品搬入の手伝いをしたのが\n金子誠治でした。 一\n一\n斎藤清は福島県出身ですが、4歳のときに一家 L\nで夕張に移住して、14歳から24歳で上京するまで\nの10年間を小樽で過ごしたため、小樽もゆかりの\n故郷といってよいでしょう。夕張で母を失い、小\n樽の薬局にひとり奉公に出され、薬局からガス会\n社の見習い職工、看板店の修業など、斎藤の生涯\nでもっとも苦労した時代をすごしました。看板の\nみやざきのぷきち\n修業先は、水彩画家として後に知られる宮崎信吉\n(小樽水彩ili'i会創立者)の店､花園町の広告研究社で\nした｡やがて独立して住之江1丁目に｢看板のすず\nらん｣を開店し､室内装飾などもてがけ多角的な経\n営を行ったようです。看板を描いているうちに絵\nの勉強の必要性にも迫られ､知り合いの紹介で､緑\n小学校の教師をしていた成田玉泉に出会い､はじめ\nて石膏デッサンと油絵の手ほどきを受けたのです。\n６ Ｆ\n▲\n“ｊ４．昼皇宮二二一一一一一『再酬\n眠（一心画牟ｌ恥』、．，\n」＆ ｋ■■■\n‐皿》』一、ロコロ、ロ、\n毎\n成田玉泉\n明治35～昭和55(1902～1980)年\n金子誠治「観劇の人々」昭和18(1943)年/木版･紙\n大正3～平成6(1914～1994)年\n’ 6．河野薫と金子誠治\nさらに成田の教え子には、河野薫と金子誠治が\nいます。河野薫は大正5（1916)年小樽に生まれ、\n緑小学校在学中に成田から棟方志功を紹介され､同\n時に小樽にいた斎藤清と知り合います。庁立小樽\n中学校(現小樽潮陵高校)卒業後上京し、図案制作\nや装丁の賊に就きながら、日本版画協会展に出品\nしました｡しかし、戦争のために制作が中断され、\nK a\nL\n敗戦と同時にシベリアに4年間抑留されてしまい 追\nます。シベリアから帰還して一時、潮見台中学校\nの美術教師として勤務しています。\nやがて再度東京に出、斎藤の後押しもあって海\n外で高い評価を受け、膨大な版画作品が求められ\nるようになりました。河野の特徴は人物、特にシ\nベリア抑留のために長期間会うことができなかっ\nた娘をモデルにした独特の「少女像」にもっとも\n斗\n1\nウマ魂 角\n南\nロ 己\n呼\n●美\n術\n－\n河野 薫「蝶BUTTERFLIES」\n大正5～昭和40(1916～1965)年 昭和36(1961)年/木版･紙\nアダ）r）\n1L〕,。"}, {"page": 134, "file": 2, "pdf_page": 19, "text": "個性が出ています。\n金子誠治は北海道草創期の木版画のパイオニアのひとりです｡金子は大正3（1914）\n年砂川生まれで、幼少の頃小樽に移住しています。恩師である成田玉泉が棟方のす\nすめで上京したために、今度は金子自身が成田の後を受けて、緑小学校の教員とし\nて図画工作の指導にあたり、そのかたわら木版の制作にあたります。子供の頃から\n持病をともなっていたこともあり、弱者に対する温かいヒューマンな心がベースに\nあります。それは風刺を込めて社会を批判するという形式をとらず、むしろ日常感\nじられる幸せや美に目を向けた温かい作品となっています。\n’\n7．－原有徳の世界\n小樽市で生涯を過ごし国際的にも高い評価を受\nいちはらありのり\nけた版画家、一原有徳は、少年期に小樽に移住し、\n小樽地方貯金局(建物は現在の市立小樽美術館)に\n勤務しながら、版画制作をはじめました。パレッ\nトに偶発的に残った絵の具を刷り取ることによっ\nて生み出されたモノタイプ(－点刷)を発表し、－\n躍注目を浴びました。その作品は冷たい金属の削\nりくずや、宇宙空間などさまざまなイメージを喚 lu＊，［ ､ロ 虻\n起し、アンフオルメル旋風が起こっていた1960年 ~Y可望4\n蕊鳶蕊\n代の美術界できわめて印象的な存在となりました。\n独特の手法によるモノタイプ版画は美術評論家\nひじかたていいち\n士方定一に認められ、一躍日本を代表する版画家\nの1人に加わりました。登山家としても知られ、\n作品の奥深くにその境地が反映されています。\n参考文献｜\n『北海道美術史』今田敬一著\n北海道立美術館友の会 昭和45年\n『北海道美術の青春期』図録\n市立小樽美術館 平成11年\n『裸童社の頃』須田三代治21ACT\n札幌時計台ギャラリー 昭和51年\n｢小樽版画史．草創期の人々」金子誠治\n『市立小樽美術館報』第9号 平成6年\n●美\n術\n､_~？ 蝋\n－原有徳「ZON(A)」\n明治43(1910)年～平成23(2011 ) nの砂』には、小樽時代を回想して歌った短歌が20\n数首入っています。\nかなしきは小樽の町よ／歌ふことなき人人の／\n烈一鴎\n声の荒さよ 啄木\nN\nR\nぼんぺい ヘ ｢、\n■並木凡平 一\n並木凡平は明治24(1891)年札幌生まれ。大正9 『P」\n可\n(1920)年小樽新聞記者となります。 F\n昭和2（1927)年、雑誌『新短歌時代」を創刊。\n同5 (1930)年より小樽新聞紙上に口語短歌、つま\nり、普段の生活で読み書きするようなやさしい言\n葉で作る短歌の欄をつくり、大勢の投稿作品をの\ni j\nF l\nj\n』\n〆 戸\n●文\n学\n並木凡平（市立小樽文学館蔵）\n136"}, {"page": 137, "file": 2, "pdf_page": 22, "text": "せます。\n凡平は、「生活即短歌｣をモットーに口語短歌の\n普及につとめました。晩年になって突然新聞社を\n追われ、ガラスコップに自分の短歌を刻んで行商\nをするなど苦労しましたが、室蘭の新聞社に招か\nれて、住みなれた小樽を去りました。それから間\nもなく、昭和16 (1941)年小さなケガがもとで、室\n蘭で亡くなりました。\nあの丘に青いペンキの家たてて\n住んでみたいと思ふ秋晴れ 凡平\nころ はち\n■田中五呂八\n田中五呂八は|ﾘ1治28(1895)年釧路生まれ。江戸\n時代以来の川柳を、芸術性の高い文芸に改革しよ\nうと、新興川柳をll昌え、「川柳は詩なり」と宣言し\nひょうげん\nました。大正12(1923)年、川柳誌『氷原』を創刊。\n同14(1925)年には『新興川柳詩集』を刊行しまし\nた。翌15(1926)年、小樽新聞社に入社。理論派で\nもあった五呂八は、昭和3（1928)年『新興川柳論」\nを刊行しています。\n神が書き閉づる最後の一頁 五呂八\nりよくき,ちうぎんしや\n■小樽高商俳句会緑丘吟社\n大正6（1917)年、小樽高等商業学校(小樽高商） 田中五呂八（市立小樽文学館蔵）\nじぞうそん ひ\n1年に在学中だった松原地蔵尊がII平びかけて、比\nら ぼ せつ こ な めいじん\n良暮雪、職員の小納迷人らが参加し、小樽高商俳\n句会緑丘吟社が結成されました。同8（1919)年、\n日本に近代俳句を確立し、俳句雑誌『ホトトギス」\nきよし としお\nを作った高浜虚子の長男、年尾が小樽高商に入学\nし、緑丘吟社に参加。同8（1919)年と翌9 (1920)\n年、年尾の父、高浜虚子の小樽来訪は青年たちを\n感激させました。\n●文\n学\nZ37"}, {"page": 138, "file": 2, "pdf_page": 23, "text": "’ 2．小樽の小説 小林多喜二と伊藤整\nた き じ せい\n高浜年尾の小樽高商時代、小林多喜二、伊藤整\nも、この学校に在学していました。\n明治44(1911)年、日本で5番目の国立高等商業\n学校として開校した小樽高等商業学校は、高浜年\n尾、小林多喜二、伊藤整らが在学した大正10年代、\n当時の自由主義的な風潮のなかで若手の優秀な教\n授をそろえ、清新で盛り上がるような雰囲気に満\nちていたといいます。ここで小林多喜二は社会科\n学に関心を深め、伊藤整は英語の力を高めていき\nました。\nた き じ\n■小林多喜二\n小林多喜二は明治36 (1903)年秋田県生まれ。石\n川啄木が小樽にいた同40 (1907)年末､4歳で家族で\n移住します。小樽でパンエ場を経営し成功してい\nた伯父の援助で学校に通い、小樽高商を卒業後\n北海道拓殖銀行小樽支店に勤めます。このころか\nらマルクス主義を本格的に勉強し、いわゆるプロ\nレタリア文学作品を書き始めます。その第1作目\n「一九二八年三月十五日」は、日本で初めて行わ\nれた普通選挙直後 左翼活動家に行われた弾圧を\n生々しく描いた作品で、小林多喜二の名前を一躍\n小林多喜二（市立小樽文学館蔵）\n有名にしました。その後続けて、「蟹工船」ll召和4\n(1929)年、「不在地主」（|司)などの傑作を発表し、\n外国からも注目される存在になりました。\n昭和5(1930)年上京、当時非合法だった日本共\n産党にも入党し、特別高等警察（特高。おもに反\n体制的政治活動をとりしまった）に追われながら\n創作を続けましたが、同8（1933)年2月20日、警\n視庁特高に逮捕され東京市築地署で拷問を受け、\n29歳の若さで死亡しました。この事件は、当時の\n左翼だけではなく、文化活動全体に大きなショッ\nクを与えました。\n§\n●文\n学\n138"}, {"page": 139, "file": 2, "pdf_page": 24, "text": "せ、、\n■伊藤 整 ■【~W－－､言‘\n伊藤整は明治38 (1905)年松前郡生まれ。まもな 1.f\n_ I\nく小樽近郊の塩谷村に移住｡庁立小樽中学校(現小\n樽潮陵高校)に入学し､自宅から汽車通学を始めま\nす。そのころ中学校の上級生から貸し与えられた\n島崎藤村の詩集を読んだ感激が文学の道に誘い込\nんだ、と、伊藤整自身が述べています。\nなお、伊藤整の先輩にあたる小樽中学校の卒業\n生に､やはり松前出身の岡田三郎(|ﾘ1治23 (1890)年\n生まれ)がいます。岡田三郎は早稲田大学卒業後、 伊藤 整（市立小樽文学館蔵）\n一時フランスに遊び、日本に「コント」（小話)を\n紹介、後に私小説の傾向を深めた作家で、新進作\n家のころ母校から依頼され小樽中学校校歌を作詞\nしました。\n小樽高商卒業後、新設されたばかりの小樽市中\n学校英語教員を務めます。\nこのころ書きためていた詩を整理、力||筆し、詩\nみち\n集『雪|ﾘlりの路』として大正15(1926)年自費出版。\nとおざぶ\n無名の青年のこの詩集は、高村光太郎や小野十三\n節ら著名な詩人から絶賛され､力を得た整は学校\nをやめて上京、本格的に文学作家をめざしていき\nます。\nゆうき\n長い苦心の末、「幽鬼の街」（昭和12 (1937)年)な\nどの小説が認められ、また優れた数々の評論を発\n表していきます。\n英語の実力を生かした翻訳でも多くの業績を残\nおやま\nしましたが、昭和25 (1950)年、小山書店より出版\nされたD.H.ロレンス著『チャタレイ夫人の恋人』\nわいせつ\nの翻訳者として狼藝文書販売罪の容疑で告発され、\nいわゆる「チャタレイ裁判」の被告となります。\n戦後の新憲法下における言論裁判として注目され\nたこの裁判で、伊藤整は法定内で粘り強く闘った\nだけでなく、内外の知識人の支持を集め、また裁\n判の一部始終を記録した「裁判」というドキュメ\nンタリーの傑作を世に送りました。\nなるみ せんきち\nその他の代表作に､小説｢|鳥海仙吉｣、「火の烏｣、\n●文\n学\n139"}, {"page": 140, "file": 2, "pdf_page": 25, "text": "ねんねん\n「年々の花｣。評論「小説の方法｣、また大河小説\n的評論「日本文壇史」などがあります。\n小樽にゆかりのある優れた文学作家は、まだ大\n勢いますし、小樽に関わりのある文学作品も少な\nくありません。それらについては市立小樽文学館\nの展示をご参考になさってください。また小樽市\n内にはたくさんの文学碑があります。つぎにそれ\nらをご案内しながら、碑文の作家の経歴などをご\n紹介します。\n3．小樽のおもな文学碑\n■石川啄木歌碑（小樽公園）\n碑文 こころよく／我にはたらく仕事あれ／それ\nを仕遂げて／死なむと思ふ\n建立年月日 昭和26(1951)年11月3日\n解説 石川啄木(明治19～45(1886～1912)年）\n昭和22(1947)年発足した小榑啄木会が建立。\nいちあく\n碑文は歌集『一握の砂」よりとられた。碑\n身は自然石、碑面は仙台石。文字は害家宇\nせいざん\n野静山氏が書簡等に残された啄木本人の文\n字を参考に書いた。\n■石川啄木歌碑（水天宮）\n碑文 かなしきは／小樽の町よ／歌ふこと／なき\n人人の／声の荒さよ\n建立年月日 昭和55(1980)年10月12日 靭 ･儒型 …‐字___』jL一_ニー述\nおやしお 石川啄木歌碑（小樽公園）\n解説 市内の経済人の集いである小樽親潮会が建\n立。碑歌は『一握の砂」中小樽在住当時を\n回想してよまれた一首。碑面は黒大理石で\nそうせき\n碑身は御影石。碑の文字は書家柴野創石氏\nが啄木の筆跡を模して書いた。\n■石川啄木歌碑(小樽駅前三角市場)し§“\n碑文 子を負ひて／雪の吹き入る停車場に／われ\nまゆ\n見送りし妻の眉かな\n建立年月日 平成17 (2005)年10月23日\n解説 小樽啄木会が中心になって、啄木が小樽で\n●文\n学\n140"}, {"page": 141, "file": 2, "pdf_page": 26, "text": "最初に逗留した姉夫婦の住居、小樽駅長官\n舎跡付近に建立。碑歌は『一握の砂」に収\nめられた、小樽を離れるIIの情景を回想し\nたもの。\nせい\n■伊藤整文学碑\nもりうた たえ\n碑文 私は浪の音を守唄にして眠る／騒がしく絶\nま\n間なく／繰り返して語る灰色の年老いた浪／\nか せいそう\n私は涙も掴れた凄恰なその物語りを／つぎ\nつぎに聞かされてゐて眠ってしまふ／ る台風がまれに沿岸\nに上陸することがありますが、小樽付近ではその\n勢力がかなり弱まって来ることが多いです。しか\n冬の小樽\nし、平成16 (2004)年には大型の台風が後志地方を\n直撃し近隣の農家や建物に大きな被害がでました。\n小樽は冬の大雪を除けば、地震も少なく、全般\n的におだやかな自然環境といえます。\n145"}, {"page": 146, "file": 2, "pdf_page": 32, "text": "●気象と四季\n＜春＞4月～6月\n4月上旬は雪解けで足元が悪い状態ですが、4\n月後半からは春本番を迎え花が一斉に咲きはじめ\nます。本州では花の咲く順番がある程度決まって\n記\nいますが、北海道ではこの時期に梅も桜も同時に\n咲くことは珍しいことではありません｡さらにチュー\nリップやスイセンなど花々も次々に咲きます。本\n州では見られない光景のひとつがこの時期です。\n一少一彦” 口』諦 』 》森 総芦 ” 謝沖 一 一《 雷\n届\n悟\n．《１６や一座 ロョュ申寺\n宰 竜 幸五一 釣\n歌 一 ･頃\n■,\n毛無山展望所\n＜夏＞7月～8月\n6月下旬から7月上旬に小樽では海開きが行わ\nれ､短い海水浴シーズンの到来です｡年間の最高気\n#,ilもこの頃、30℃を超える日があります。海水浴\nはお盆の8月15日位までが一般的です。本州は学\n校の夏休みが8月末までですが､北海道は夏休みが\n短いことと、お盆を過ぎると急に涼しくなったり、\n波が出たりすることで海水浴シーズンが短いのです。\n戸\n伊 塗弓\n一\n○\nｒ。Ｌ』０ザ鋤－１\n寵”\n一\n一一二\n戸垂\n＜秋＞9月～10月\n9月になると朝晩は涼しくなります。しかし近\n蘭島海水浴場\n年は温暖化の現象か暑い日が続く年もあります。\n10月中旬になると紅葉がはじまります。市内では\n朝里峠や毛無峠の紅葉が絶景ですが、小樽公園や\nなえぼ公|束|も見事です。近郊ではニセコや積丹方\n面も美しい紅葉で有名です。\nまた10月下旬には初雪の季節となります。毛無\n山や天狗山の頂上が白くなると、いよいよ冬の到\n来です。\n＜冬＞11月～3月\n例年、11月の下旬から12月上旬には根雪となり\nます。年内は比較的積雪は少なめですが1月、2\njlはドカ雪となり、吹雪の'三lも多くなります。小\n樽は古い建物が多いため、雪の重みから建物を守\nるため、屋根の雪降ろしを行います。天気の良い\n日曜日などは、あちこちで一斉に屋根の雪降ろし\n一君\n一＝岸 鷺\n小樽公園\nZ46"}, {"page": 147, "file": 2, "pdf_page": 33, "text": "●気象と四季\nが行われます。冬の風物詩のひとつです。3月、\n彼岸の頃から雪解けがはじまります。\n’\n2．小樽の風物詩あれこれ 銅\n、I\nはふんかぜ L\n●春く馬糞風＞\n中年以上の人には懐かしい言葉です。今ではも\nうありませんが、春は馬糞風の季節でした。馬車\nが市内を走っていた時代、冬の|Al、路上に積もっ\nていた馬糞が、雪解けの後 乾燥し風に乗って匂\nいとともに運ばれてくるのです。昭和30年代後半\nには死語になりました。その後に出てきたのが車\n粉風です。自動車のスパイクタイヤが全盛の頃\n雪解けの春には町がかすむほど粉塵が舞っていま\nした。しかし、スパイクタイヤが全面禁止になっ\nてからはこのことばも消えました。環境にやさし\nい||寺代となりました。\nｈ－』・ｒ\n■■一■Ｄｒ\nｌ\nＦ\nｌ\n幻\n4\n| h\n吹雪の小樽\n一\n睦露｡\n‐ ず\n李可幹\n高 島\n●夏く高島おばけ＞\n「高島おばけ」とは、弘化3（1846)年に伊勢(現\nまつうらたけしろう 一 ｜、\n三重県松阪市)出身の北方探検家・松浦武|ﾉLI郎が小\n‐1，11_ ---_=･･一\nしんきろう\n樽沖を航行中に見た唇気楼です。松浦武匹|郎がま\nとめた「三航蝦夷日誌』や『西蝦夷日誌』に記述 』 I\nされています。当時の高島では屋気楼を「高島お\nばけ」と呼んでいました。これはめずらしい現象\nである上位雷気楼で、石狩湾の広い範囲で、春か\nら夏にかけて年に10回程度発生することがありま\nす｡4～7月の暖かい日に発生する可能性が高く、\nその中でも大規模な屋気楼は、5月中旬から6月\n中旬にかけて発生する可能性がありますが、予測\nすることは難しい状況です。上位屋気楼の発生は\n時間的には午前よりも午後の方が確率は高く、晴\nれている日で、風があまりなく遠くの山々にかす\nみがかかっていて、海面近いところにより白濁し\n
