はじめ、モノタイプ版画で注目を浴びました。市立小樽美術館3階には記念ホールもある、この版画科は誰でしょうか。", "a": "4"}, {"exam": 10, "no": 70, "sub": "", "q": "石川啄木の有名な歌です。（　）内に該当する語句は、次のどれでしょうか。「かなしきは小樽の町よ／歌ふことなき人々の／声の（　）よ」", "a": "3"}, {"exam": 10, "no": 71, "sub": "", "q": "次の文学碑がある場所で、間違っているのはどれでしょうか。", "a": "3"}, {"exam": 10, "no": 72, "sub": "", "q": "プロレタリア文学として知られている小林多喜二ですが、次の作品の中に他の作家のものがあります。それはどれでしょうか。", "a": "4"}, {"exam": 11, "no": 66, "sub": "", "q": "小樽観光を代表する一つがオルゴールですが、その語源はオランダ語のオルゲルです。オルゴールが日本に入ってきた当時、オルゴールにあてた漢字は次のどれでしょうか。", "a": "3"}, {"exam": 11, "no": 67, "sub": "", "q": "札幌、函館、旭川などの北海道各地で行われていた美術グループをまとめる原動力となり、やがて北海道全域にわたる公募展「道展」設立のきっかけとなった小樽の公募展を開催したのは次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 68, "sub": "", "q": "中村善策が毎年のように小樽に帰省し宿泊した場所で、野外写生に出かける足がかりとした所はどこでしょう。", "a": "3"}, {"exam": 11, "no": 69, "sub": "", "q": "一原有徳は少年期に小樽に移住し、小樽地方貯金局に勤務しながら版画制作をはじめました。その手法は、パレットに偶発的に残った絵の具を刷り取るというもので、一躍注目を浴びました。その手法は何というでしょうか。", "a": "モノタイプ"}, {"exam": 11, "no": 70, "sub": "", "q": "石川啄木の有名な歌です。この歌が納められた歌集名を書きなさい。「かなしきは小樽の町よ／歌ふことなき人々の／声の荒さよ」", "a": "一握の砂"}, {"exam": 11, "no": 71, "sub": "", "q": "伊藤整の「私は浪の音を守唄にして眠る／騒がしく絶間なく／繰り返して語る灰色の年老いた浪・・・・・」この詩が刻まれている文学碑は何という丘にありますか。", "a": "ゴロダの丘"}, {"exam": 11, "no": 72, "sub": "", "q": "小林多喜二の碑文です。この文学碑がある場所はどこでしょうか。「冬が近くなると　ぼくはそのなつかしい　国のことを考えて　深い感動に捉えられ・・」", "a": "3"}, {"exam": 11, "no": 73, "sub": "", "q": "水天宮境内に建てられた詩碑の中に、造形は一原有徳、書は中野北溟で製作されたものがあります。誰の碑か次の中から選びなさい。", "a": "2"}, {"exam": 12, "no": 62, "sub": "", "q": "明治34(1901)年に設立された浅原硝子は道内の硝子器製造業界の草分けですが、製造していた製品で有名だったものは何でしょうか。", "a": "漁業用浮玉"}, {"exam": 12, "no": 63, "sub": "", "q": "明治期、小樽では重要な美術運動がおこりました。長谷川昇、小寺健吉、工藤三郎の3人によって設立されたのは次のどれでしょうか。", "a": "3"}, {"exam": 12, "no": 64, "sub": "", "q": "小樽を代表する画家で「現場主義」で知られています。夏のほぼ1ヵ月、南小樽駅前の魚松旅館に宿泊しながら制作していました。「海港の秋」「けむり」などの作品がある、この画家の名前は何というでしょうか。", "a": "中村善策"}, {"exam": 12, "no": 65, "sub": "", "q": "版画家、一原有徳が偶然修得した技法で、一躍日本を代表する版画家の一人になりました。その作風を特徴づける独特の技法とは次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 66, "sub": "", "q": "石川啄木は明治40(1907)年、創立したばかりの小樽日報社に記者として入社しましたが、間もなく会社の方針に合わず退社することになりました。小樽に滞在した期間は次のどれでしょうか。", "a": "4"}, {"exam": 12, "no": 68, "sub": "", "q": "小林多喜二の名前を一躍有名にした、第1作目の文学作品は次のどれでしょうか。", "a": "1"}, {"exam": 12, "no": 69, "sub": "", "q": "伊藤整は小樽高商へ進学しました。卒業後の職業は次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 78, "sub": "", "q": "伊藤整文学賞は平成26(2014)年、第25回をもって幕を閉じました。これまで受賞者には斎藤吉郎作「カモメ呼ぶ少女」の受賞者用ブロンズ像が贈られてきましたが、この基になった像は現在、小樽運河のどこにあるでしょうか。設置されている場所を書きなさい。", "a": "北浜橋"}, {"exam": 13, "no": 62, "sub": "", "q": "小樽にはかつてオタモイ海岸の断崖絶壁に、当時の蛇の目寿司の加藤秋太郎が絶景を楽しむ料亭を建てました。昭和9年に完成し、その後昭和27年に焼失したこの建物は次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 63, "sub": "", "q": "現在、小樽在住で活躍している画家の小川清、冨澤謙は、ある風景画家の系譜に属し、その写実の精神性を継承しています。その尊敬する画家とは次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 64, "sub": "", "q": "戦前、小樽には重要な版画家が2人かかわっていました。ともに東北出身で、ひとりは世界的な版画界の巨匠で棟方志功、もうひとりとは誰でしょうか。", "a": "斎藤清"}, {"exam": 13, "no": 65, "sub": "", "q": "次の文章に当てはまる小樽の版画家は誰でしょうか。「北海道草創期の木版画のパイオニアのひとりで、大正3年、砂川で生まれ幼少期に小樽に移住しました。恩師は成田玉泉で、後に緑小学校の教員となりました。」", "a": "4"}, {"exam": 13, "no": 67, "sub": "", "q": "ある作家の碑文です。この文学碑がある場所はどこでしょうか。「こころよく／我にはたらく仕事あれ／それを仕遂げて／死なむと思ふ」", "a": "2"}, {"exam": 13, "no": 68, "sub": "", "q": "次の小説の中で伊藤整の作品ではないのは次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 69, "sub": "", "q": "写真の文学碑は一原有徳の造形と中野北瞑の書で造られています。碑文の作家と設置場所の正しい組み合わせは次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 31, "sub": "", "q": "小豆将軍というあだ名がつけられるほど穀物相場で巨万の富を築いた高橋直治ですが、今もその当時の倉庫が残っており、観光施設として再生利用されています。現在の施設名は次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 63, "sub": "", "q": "明治34年に設立され道内の硝子器製造業界の草分けとして、漁業用浮球を製造していました。この小樽の製造工場名は何というでしょうか。", "a": "浅原硝子"}, {"exam": 14, "no": 64, "sub": "", "q": "次の4枚の絵画の内、中村善策の作品は何番でしょうか。", "a": "4"}, {"exam": 14, "no": 65, "sub": "", "q": "小樽で生涯を過ごし国際的にも高い評価を受けている版画家です。モノタイプ版画で注目を浴びました。この版画家は誰でしょうか。", "a": "1"}, {"exam": 14, "no": 66, "sub": "", "q": "石川啄木は明治40年に創立したばかりの小樽日報社に入社し、記者として活躍します。しかし事務長とけんかして、すぐに辞めて小樽を離れました。この時の小樽在住期間は次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 67, "sub": "", "q": "石川啄木の「かなしきは小樽の町よ／歌ふことなき人々の／声の荒さよ」という碑文が刻まれた文学碑がある場所は次のどれでしょうか。", "a": "1"}, {"exam": 14, "no": 68, "sub": "", "q": "伊藤整は小樽高商（現小樽商科大学）へ進学しました。卒業後は教員となりましたが、次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 69, "sub": "", "q": "文学碑には様々な形があります。本郷新の設計で本の見開きをかたどった大きな文学碑といえば、次のだれでしょうか。", "a": "1"}, {"exam": 14, "no": 74, "sub": "", "q": "平成28年、小樽市内で開館110周年を迎えた小樽市の施設があります。それは次のどれでしょうか。（建物の年数ではありません）", "a": "3"}, {"exam": 15, "no": 62, "sub": "", "q": "かつてオタモイ海岸の断崖絶壁に蛇の目寿司の加藤秋太郎は絶景を楽しむ料亭を建てました。昭和9年に完成し、その後昭和27年に焼失したこの建物の名称は次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 63, "sub": "", "q": "現在の小樽ガラスを有名にしたのは北一硝子です。その火付け役となったのは昭和58年、堺町通りの倉庫を譲り受け北一硝子3号館の開設といえます。この倉庫の創建時の名称は何というでしょうか。", "a": "木村倉庫"}, {"exam": 15, "no": 64, "sub": "", "q": "小樽を代表する画家、中村善策が毎年のように夏に小樽に帰省した際、宿泊した所は次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 65, "sub": "", "q": "国際的に高い評価を受けた一原有徳は少年期に小樽に移住し、小樽地方貯金局に勤務しながら版画制作をはじめました。その手法は、パレットに偶発的に残った絵の具を刷り取るというものです。この手法は何というでしょうか。", "a": "モノタイプ"}, {"exam": 15, "no": 66, "sub": "", "q": "石川啄木は明治40年、創立したばかりの小樽日報社に入社し、記者として活躍します。この小樽日報社は現在の静屋通りのどのあたりにあったでしょうか。", "a": "本間内科付近"}, {"exam": 15, "no": 67, "sub": "", "q": "石川啄木が小樽日報社に入社したとき、同僚に、童謡「赤い靴」や流行歌「船頭小唄」で知られる人物がいました。この人物とは誰でしょうか。", "a": "野口雨情"}, {"exam": 15, "no": 68, "sub": "", "q": "小林多喜二、伊藤整が大正10年代の入学した学校名（現在は小樽商科大学）はつぎのどれでしょうか。", "a": "3"}, {"exam": 16, "no": 63, "sub": "", "q": "小樽観光を代表する一つがオルゴールですが、日本に入ってきた当時、オルゴールにあてた漢字は次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 64, "sub": "", "q": "小樽を代表する画家・版画家とその作品名の組合せで間違っているのは次のどれでしょうか。", "a": "1"}, {"exam": 16, "no": 65, "sub": "", "q": "市立小樽美術館には小樽ゆかりの作家2名の記念ホールがあります。その2名とは次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 66, "sub": "", "q": "石川啄木の有名な歌です。（　）内に該当する語句は、次のどれでしょうか。「かなしきは小樽の町よ／歌ふことなき人人の／（　）」", "a": "3"}, {"exam": 16, "no": 67, "sub": "", "q": "石川啄木の歌碑は小樽市内に3ヵ所あります。水天宮、小樽公園ともう1ヶ所はどこでしょうか。", "a": "小樽駅横三角市場前"}, {"exam": 16, "no": 68, "sub": "", "q": "小林多喜二が北海道拓殖銀行小樽支店に勤めたあたりからプロレタリア文学作品を書き始めました。その第一作目は次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 63, "sub": "", "q": "日本での硝子製造の始まりはオランダ人技師により天正3(1575)年に製造されました。日本のどこが最初といわれているでしょうか。", "a": "2"}, {"exam": 17, "no": 65, "sub": "", "q": "小樽市民センターマリンホールの緞帳は、ある画家の「黎明」が描かれています。その画家とは次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 66, "sub": "", "q": "次の文学碑がある場所で、間違っているのはどれでしょうか。", "a": "4"}, {"exam": 17, "no": 67, "sub": "", "q": "石川啄木の歌碑は小樽市内に3ヵ所あります。その歌碑に刻まれている碑文はすべて同じ歌集に収められているものです。その歌集名を書きなさい。", "a": "一握の砂"}, {"exam": 17, "no": 69, "sub": "", "q": "次の文に該当する作家名を書きなさい。令和元(2019)年11月15日は、小樽出身の文学者の没後50年に当たります。明治38(1905)年1月16日に松前郡で生まれ、小樽で学校を卒業後、中学校英語教員を務めた小樽出身の文学者とは誰でしょうか。", "a": "伊藤整"}, {"exam": 18, "no": 65, "sub": "", "q": "2020年は、小樽ゆかりの版画家の生誕110年・没後10年の節目となる年でした。その作品は市立小樽美術館に常設展示されています。その版画家とは次の誰でしょうか。", "a": "3"}, {"exam": 18, "no": 67, "sub": "", "q": "石川啄木は明治40年、創立したばかりの新聞社に入社し記者として活躍します。その新聞社は現在の静屋通りの本間内科付近にありました。その新聞社名を書きなさい。", "a": "小樽日報社"}, {"exam": 18, "no": 68, "sub": "", "q": "ある作家の文学碑です。誰の文学碑でしょうか。この作家の同窓生等が発起人となり建設期成会が組織され、募られた資金で建立されました。碑容は本郷新の設計で左には青年労働者の像をはめ込み、右上部にはこの作家の肖像レリーフがあります。", "a": "1"}, {"exam": 18, "no": 69, "sub": "", "q": "伊藤整は大正15年に詩集を自費出版します。この詩集は髙村光太郎や小野十三郎ら著名な詩人から絶賛され、教員を辞め本格的な文学作家をめざすきっかけとなりました。この詩集名を書きなさい。", "a": "雪明りの路"}, {"exam": 18, "no": 88, "sub": "A", "q": "小樽市内にある有形文化財に指定された建物の説明です。文章の（　）内に該当する語句を書きなさい。「（　A　）は中央のホールが吹き抜けになっていて、前後の高窓から自然光を取り入れています。ガラスが張られた天井からはシャンデリアのように電灯で照らす明るい構内となっています。また、前後の窓には小樽らしさを演出する（　B　）がディスプレイされています。」", "a": "JR小樽駅舎"}, {"exam": 18, "no": 88, "sub": "B", "q": "小樽市内にある有形文化財に指定された建物の説明です。文章の（　）内に該当する語句を書きなさい。「（　A　）は中央のホールが吹き抜けになっていて、前後の高窓から自然光を取り入れています。ガラスが張られた天井からはシャンデリアのように電灯で照らす明るい構内となっています。また、前後の窓には小樽らしさを演出する（　B　）がディスプレイされています。」", "a": "ランプ"}, {"exam": 19, "no": 65, "sub": "", "q": "市立小樽美術館には小樽ゆかりの作家2名の記念ホールがあります。ひとりは中村善策ですが、もうひとりは誰でしょうか。", "a": "一原有徳"}, {"exam": 19, "no": 66, "sub": "", "q": "次の文学碑がある場所で、間違っているのはどれでしょうか。", "a": "2"}, {"exam": 19, "no": 67, "sub": "", "q": "石川啄木は明治40（1907）年、創立したばかりの小樽日報社に記者として入社しましたが、間もなく会社の方針に合わず4ヶ月足らずで退社することになりました。しかし、その後出された詩集には小樽時代を回想して歌った短歌が20数首入っています。その歌集の名は何というでしょうか。", "a": "一握の砂"}, {"exam": 19, "no": 68, "sub": "", "q": "伊藤整は小樽中学校卒業後、小樽高商へ進学。その後、小樽高商を卒業した伊藤整が就いた職業は次のどれでしょうか。", "a": "2"}, {"exam": 20, "no": 27, "sub": "", "q": "商人とその商人に関連する語句の組合せで正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 20, "no": 32, "sub": "", "q": "高橋直治に関連することで、次の4つのうち違うものはどれでしょうか。", "a": "4"}, {"exam": 20, "no": 63, "sub": "", "q": "かつてオタモイ海岸の断崖絶壁には絶景を楽しむ龍宮閣という料亭がありましたが、残念ながら昭和27(1952)年に焼失しました。この建物は花園で寿司店を経営していた加藤秋太郎が娯楽と憩いの場として一帯を開発したなかの一つでした。この花園の寿司店の名称は次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 64, "sub": "", "q": "小樽の画家、小川清、冨澤謙は、ある風景画家の系譜に属し、その写実の精神を直接継承した画家といえます。その尊敬した画家とは次の誰でしょうか。", "a": "3"}, {"exam": 20, "no": 65, "sub": "", "q": "次の文章に当てはまる小樽ゆかりの版画家は次のどれでしょうか。「恩師は成田玉泉で、北海道草創期の木版画のパイオニアのひとりです。大正3(1914)年、砂川で生まれ幼少期に小樽に移住し、後に緑小学校の教員となりました。」", "a": "4"}, {"exam": 20, "no": 67, "sub": "", "q": "小林多喜二は小樽高商卒業後、銀行に勤めることになります。その銀行だった建物は次のどれでしょうか。（建物名は現在名です）", "a": "4"}, {"exam": 20, "no": 68, "sub": "", "q": "小樽ゆかりの作家、伊藤整は優れた作品を世に送り出しました。伊藤整の作品ではないのは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 69, "sub": "", "q": "写真の文学碑は本郷新の設計で造られています。この碑文の作家と設置場所の正しい組み合わせは次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 64, "sub": "", "q": "道内の硝子器製造業界の草分けとして明治30年代に設立され、ランプ、投薬瓶、漁業用浮玉などを製造しました。現在も天神町で硝子製品を製造しています。小樽雪あかりの路でも使用されているガラスの浮き球で有名なこのガラス工房名は何というでしょうか。", "a": "浅原硝子"}, {"exam": 21, "no": 65, "sub": "", "q": "次の写真は小樽公園内にあるモニュメントです。小樽中央ライオンズクラブの25周年を記念して昭和59(1984)年に建てられたもので、小樽を代表する版画家の一人がデザインしました。その版画家名を書きなさい。", "a": "一原有徳"}, {"exam": 21, "no": 66, "sub": "", "q": "現場主義の画家として活躍した中村善策は、題材をもとめ、毎年のように小樽に帰郷していました。この時、小樽市内の旅館を滞在場所としていました。その宿泊した所は次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 68, "sub": "", "q": "小林多喜二の名前を一躍有名にした、第1作目の文学作品は次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 84, "sub": "", "q": "次の文章は通称、小樽の3大祭りのひとつと呼ばれる神社の説明です。この神社名は次のどれでしょうか。「現在の社殿は大正8(1919)年の建築。本殿、中殿、拝殿が連結する形式の権現造りで、屋根は銅板葺きです。境内には石川啄木歌碑、河邨文一郎詩碑、経度天測標と旧樺太日露国境中間標石などがあります。」", "a": "3"}, {"exam": 21, "no": 87, "sub": "", "q": "かつて伊藤整文学賞の受賞者には斎藤吉郎作「カモメ呼ぶ少女」のブロンズ像が贈られてきましたが、この像は現在、小樽運河のどこにあるでしょうか。次の中から選びなさい。", "a": "1"}, {"exam": 22, "no": 53, "sub": "", "q": "明治10年代の小樽の庶民の一般的な住宅の特徴について正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 22, "no": 64, "sub": "", "q": "小樽はオルゴールの町としても人気ですが、中でもオルゴール堂本館前の蒸気時計にはいつもたくさんの観光客が汽笛の鳴るのを待っています。この蒸気時計が時を告げるのは何分に1回でしょうか。次の中から選びなさい。", "a": "2"}, {"exam": 22, "no": 65, "sub": "", "q": "小樽市で生涯を過ごした国際的にも評価の高い版画家、一原有徳の作品は市立小樽美術館以外でも小樽市内の公共施設のロビーで作品を見ることができます。作品名は「OLD TOWN」。この公共施設とは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 66, "sub": "", "q": "小樽市民センターマリンホールには、小樽ゆかりの画家の「黎明」という作品が高さ7m、幅14mの緞帳になっています。その画家とは誰でしょうか。", "a": "国松登"}, {"exam": 22, "no": 67, "sub": "", "q": "石川啄木の歌集『一握の砂』の有名な歌です。（　）内に該当する語句は、次のどれでしょうか。「かなしきは小樽の（　）／歌ふことなき人人の／声の荒さよ」", "a": "1"}, {"exam": 22, "no": 68, "sub": "", "q": "令和6（2024）年8月〜10月まで市立小樽文学館・小樽市総合博物館本館・運河館3館による共同企画で、伊藤整による手書きの地図「小樽市街中央部図」とストーリーマップをもとに、小説に登場する場所を写真等で紹介する企画展が開催されました。この伊藤整の小説名は何というでしょうか。", "a": "幽鬼の街"}, {"exam": 22, "no": 69, "sub": "", "q": "水天宮境内にある河邨文一郎の文学碑は鉄板、鉄柱を組み合わせた独特のデザインです。この文学碑制作デザインを担当したのは下記の誰でしょうか。", "a": "3"}, {"exam": 23, "no": 47, "sub": "", "q": "現在のJR小樽駅のホームやコンコース、通路には北一硝子さんが寄贈したランプが設置されています。その数は何個でしょうか。（文化庁：日本遺産ポータルサイトより）", "a": "333個"}, {"exam": 23, "no": 59, "sub": "", "q": "次の3つは色内銀行街にある建物です。関連した語句の組み合わせで、番号内のA・B・Cすべて正しいものは何番でしょうか。（建物名は建築時）A)三菱銀行小樽支店 B)北海道拓殖銀行小樽支店 C)第一銀行小樽支店", "a": "1"}, {"exam": 23, "no": 64, "sub": "", "q": "小樽観光で人気の一つがオルゴールですが、その語源はオランダ語のオルゲルです。オルゴールが日本に入ってきた当時、オルゴールにあてた漢字は次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 65, "sub": "", "q": "木版画のパイオニアであった金子誠治は、小樽に移住後小樽市内の小学校の教員となります。その当時の小学校名は何というでしょうか。", "a": "緑小学校"}, {"exam": 23, "no": 66, "sub": "", "q": "市立小樽美術館には2つの記念ホールがあります。一つは日本を代表する版画家の一原有徳記念ホール。もう一つは日本を代表する風景画家の記念ホールです。この画家名を書きなさい。", "a": "中村善策"}, {"exam": 23, "no": 68, "sub": "", "q": "伊藤整は小樽中学校卒業後、小樽高商へ進学。その後、小樽市中学校の教員となります。担当した教科は次のどれでしょうか。", "a": "1"}, {"exam": 23, "no": 69, "sub": "", "q": "石川啄木の文学碑は小樽市内に3か所あります。一つは小樽公園内、2つ目は水天宮境内、3つ目はどこでしょうか。次の中から選びなさい。", "a": "3"}], "運河とまちづくり": [{"exam": 1, "no": 36, "sub": "", "q": "小樽港の整備が進む中で小樽運河が完成したのはいつでしょうか。", "a": "3"}, {"exam": 1, "no": 47, "sub": "", "q": "幹線道路建設で石造倉庫の町並みが取り壊されたのが、小樽運河保存運動が立ち上がるきっかけとなったと言われますが、その石造倉庫群はどこにあったのでしょう。", "a": "2"}, {"exam": 1, "no": 48, "sub": "", "q": "昭和48(1973)年12月に、このまま道路建設が進み運河が埋め立てられれば「小樽が小樽でなくなってしまう！」という思いから、保存運動の発起人会が発足します。その会の名称は次のどれですか。", "a": "1"}, {"exam": 1, "no": 49, "sub": "", "q": "小樽運河保存運動の二代目会長となられた峯山冨美さんは、小樽運河を残す運動に関わる意味を、ある言葉で問いかけられていました。その言葉は次のどれですか。", "a": "3"}, {"exam": 1, "no": 50, "sub": "", "q": "昭和53(1978)年7月に、小樽の若者を中心に運河とその周辺の石造倉庫を舞台にした市民手づくりの祭りが行われ、小樽運河に市民の大きな関心を集めるきっかけとなりました。このお祭りの名前は次のどれですか。", "a": "1"}, {"exam": 1, "no": 51, "sub": "", "q": "昭和57(1982)年9月に、小樽の経済界の一部も含めた幅広い層の市民が集まり、運河埋め立ての見直しを求める10万人の署名を集める活動が生まれました。その会の名称は次のどれですか。", "a": "2"}, {"exam": 1, "no": 66, "sub": "", "q": "小樽の土産物の代表の一つになっているオルゴールは、なぜ小樽に根付いたのでしょうか。", "a": "2"}, {"exam": 2, "no": 47, "sub": "", "q": "運河を埋め立てて幹線道路をつくる計画が決まったのはいつのことでしょうか。", "a": "3"}, {"exam": 2, "no": 48, "sub": "", "q": "幹線道路建設で石造倉庫の街並みが取り壊されたのが、小樽運河保存運動が立ち上がるきっかけとなったと言われますが、その石造倉庫群はどこにあったのでしょうか。", "a": "2"}, {"exam": 3, "no": 36, "sub": "", "q": "埋め立て地を造成してつくられた小樽運河の岸壁には百トン積みのはしけが同時に40隻係留できたといいます。完成当時の小樽運河の長さと幅の組み合わせで正しいものはどれですか。", "a": "3"}, {"exam": 3, "no": 47, "sub": "", "q": "高速道路から市内に延びる幹線道路建設で有幌地区の一角の建物が取り壊され、小樽運河保存運動が立ち上がるきっかけとなりました。その取り壊された建物とは何ですか。", "a": "石造倉庫・木骨石造倉庫・有幌倉庫"}, {"exam": 3, "no": 48, "sub": "", "q": "小樽運河保存運動の二代目会長となられた峯山冨美さんは、小樽運河を残す運動に関わる意味を、ある言葉で問いかけられていました。その言葉は次のどれですか。", "a": "3"}, {"exam": 3, "no": 49, "sub": "", "q": "運河埋め立ての見直しを求める10万人の署名を集める活動は、結果的に次の内、どのような成果をあげましたか。", "a": "3"}, {"exam": 3, "no": 50, "sub": "", "q": "小樽運河保存運動の特徴として間違っているのはどれですか。", "a": "3"}, {"exam": 3, "no": 51, "sub": "", "q": "運河を通じて小樽のまちを見つめ直す機会を得た多くの人々のエネルギーは、その後のまちづくりに脈々と生き続けていると言えます。そのひとつとして近年、全国的にも話題となっている小樽の冬のイベントとは何ですか。", "a": "雪あかりの路"}, {"exam": 4, "no": 47, "sub": "", "q": "昭和48(1973)年12月に、このまま道路建設が進み運河が埋め立てられれば「小樽が小樽でなくなってしまう！」という思いから、保存運動の発起人会が発足します。その会の名称を何といいますか。", "a": "小樽運河を守る会"}, {"exam": 4, "no": 48, "sub": "", "q": "上記の設問（問47）のきっかけとなった、運河を埋め立てて幹線道路をつくる計画が決まったのはいつのことでしょう。", "a": "3"}, {"exam": 4, "no": 49, "sub": "", "q": "東京大学の西村先生が小樽で行われた講演で、「小樽運河保存運動の5つの特徴」として指摘されたものに含まれていないものは次のどれでしょうか。", "a": "4"}, {"exam": 4, "no": 82, "sub": "", "q": "小樽の歴史と風土に調和した都市景観をつくり出している建築物や活動などを表彰する「小樽市都市景観賞」で昭和63年、第1回受賞は、北一硝子三号館、㈱丸市後藤商店、小樽運河散策路、おたる潮まつりともう一つは何でしょうか。", "a": "1"}, {"exam": 5, "no": 47, "sub": "", "q": "幹線道路建設で石造倉庫の街並みが取り壊されたのが、小樽運河保存運動が立ち上がるきっかけとなったと言われますが、その石造倉庫群はどこにあったのでしょう。地区名（町名）で答えなさい。", "a": "有幌"}, {"exam": 5, "no": 48, "sub": "", "q": "昭和48（1973）年12月に、このまま道路建設が進み運河が埋め立てられれば「小樽が小樽でなくなってしまう！」という思いから、保存運動の発起人会が発足します。その会の名称は次のどれでしょうか。", "a": "3"}, {"exam": 6, "no": 48, "sub": "", "q": "道路整備計画で運河を埋立てて幹線道路にすることが決まった年は次のどれでしょうか。", "a": "3"}, {"exam": 6, "no": 49, "sub": "", "q": "昭和48(1973)年12月に、このまま道路建設が進み運河が埋め立てられれば「小樽が小樽でなくなってしまう！」という思いから、保存運動の発起人会が発足します。その会の名称は何といいますか。", "a": "小樽運河を守る会"}, {"exam": 6, "no": 51, "sub": "", "q": "昭和57（1982）年9月に、小樽の経済界の一部も含めた幅広い層の市民が集まり、運河埋め立ての見直しを求める10万人の署名を集める活動が生まれました。その会の名称は次のどれですか。", "a": "2"}, {"exam": 7, "no": 50, "sub": "", "q": "小樽運河保存運動の二代目会長となられた峯山冨美さんは、小樽運河を残す運動に関わる意味を、ある言葉で問いかけられていました。その言葉は次のどれでしょうか。", "a": "3"}, {"exam": 7, "no": 51, "sub": "", "q": "東京大学の西村先生が小樽で行われた講演で、「小樽運河保存運動の5つの特徴」として指摘されたものに含まれていないものは次のどれでしょうか。（「手宮線プラン」小樽まちづくり協議会発行：平成10年3月1日発行より）", "a": "4"}, {"exam": 7, "no": 61, "sub": "", "q": "大正期から昭和にかけて北海製罐倉庫（現北海製罐）の工場施設が建設されました。その特長で間違っているのはどれでしょうか。", "a": "2"}, {"exam": 7, "no": 73, "sub": "", "q": "小林多喜二が小樽高商卒業後勤めたところは、現在何という名称で営業しているでしょうか。", "a": "4"}, {"exam": 8, "no": 48, "sub": "", "q": "昭和47年、札幌からの幹線道路建設で石造倉庫の街並みが取り壊されたのが、小樽運河保存運動が立ち上がるきっかけとなったと言われますが、その石造倉庫群はどこにあったのでしょう。", "a": "2"}, {"exam": 8, "no": 50, "sub": "", "q": "小樽運河保存運動の二代目会長で、よく「地域に生きるとは何か」という問いを投げかけられていたのは誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "峯山冨美"}, {"exam": 8, "no": 51, "sub": "", "q": "運河を通じて小樽の町を見つめ直す機会を得た多くの人々のエネルギーは、その後のまちづくり運動に脈々と生き続けていると言えます。その一つとして平成16年度の国土交通省大臣表彰「手づくり郷土賞」を受賞したのは次のどれでしょうか。", "a": "1"}, {"exam": 8, "no": 84, "sub": "", "q": "平成22年11月に第3回目となる「しゃこ」のお祭りが運河公園（色内3）で行われました。この祭りの正式名称は次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 48, "sub": "", "q": "運河本来の役割を終え、荒れた姿となっていた頃、道路整備計画で運河を埋め立てて幹線道路にすることが決まりました。決まった年は次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 49, "sub": "", "q": "問48の幹線道路建設のため、有幌地区にあったたくさんのものが取り壊されたことが、小樽運河保存運動が立ち上がるきっかけとなったと言われます。何が取り壊されたのでしょうか。", "a": "石造倉庫"}, {"exam": 9, "no": 50, "sub": "", "q": "東京大学の西村先生が小樽で行われた講演で、「小樽運河保存運動の5つの特徴」として指摘されたものに含まれていないものは次のどれでしょうか。", "a": "4"}, {"exam": 9, "no": 51, "sub": "", "q": "運河保存運動の影響で、最終的に道路計画は一部見直され、小樽運河は幅が半分になりましたが水路沿いに散策路が整備され現在の姿になりました。当初の運河の面影を感じられる分がまだ一部あります。それは次のどれでしょうか。", "a": "1"}, {"exam": 10, "no": 49, "sub": "", "q": "札幌からの高速道路が完成し、その延長としての幹線道路建設で石造倉庫の街並みが取り壊されました。これが、小樽運河保存運動のきっかけとなったといわれています。その石造倉庫群とはどこにあったのでしょう。地区名（町名）で答えなさい。", "a": "有幌"}, {"exam": 10, "no": 50, "sub": "", "q": "昭和48(1973)年12月に、このまま道路建設が進み運河が埋め立てられれば「小樽が小樽でなくなってしまう！」という思いから、保存運動の発起人会が発足します。後に全国に知られるまちづくり運動となった、その会の名称は次のどれでしょうか。", "a": "3"}, {"exam": 10, "no": 51, "sub": "", "q": "小樽運河保存運動の二代目会長として、全国的にも保存運動のシンボルとなった（故）峯山冨美さんは、小樽運河を残す運動に関わる意味を、ある言葉で問いかけられていました。その言葉は次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 49, "sub": "", "q": "小樽運河を埋め立てて幹線道路をつくる計画が決まったのは次のどれでしょう。", "a": "3"}, {"exam": 11, "no": 50, "sub": "", "q": "札幌からの小樽までの高速道路完成後、小樽市内に延びる幹線道路建設で有幌地区にあった約30棟の建物が取り壊されました。このことが小樽運河保存運動のきっかけとなりました。この取り壊されたたくさんの建物とは何だったでしょうか。", "a": "石造倉庫"}, {"exam": 11, "no": 52, "sub": "", "q": "東京大学の西村教授が小樽で行われた講演で、「小樽運河保存運動の5つの特徴」として指摘されたものに含まれていないものは次のどれでしょうか。（「手宮線プラン」小樽まちづくり協議会発行：平成10年3月1日発行より）", "a": "4"}, {"exam": 11, "no": 65, "sub": "", "q": "明治34年に設立され、道内の硝子器製造業界の草分けといわれ、漁業用浮玉工場として、また雪あかりの路の運河に浮かべた特性浮玉を製造したのは何という会社でしょうか。", "a": "浅原硝子"}, {"exam": 12, "no": 46, "sub": "", "q": "昭和48(1973)年12月に、このまま道路建設が進み運河が埋め立てられれば「小樽が小樽でなくなってしまう！」という思いから、保存運動の発起人会が発足します。その会の名称を何といいますか。", "a": "小樽運河を守る会"}, {"exam": 12, "no": 47, "sub": "", "q": "次の文の（　）に当てはまる語句を書きなさい。昭和45(1970)年、日本建築学会の明治建築調査小委員会による保存したい明治建築のリストが公表され、街並みとして、小樽運河周辺と神戸の山本通りの異人館街、もうひとつは（　）の南山手地区が取り上げられました。", "a": "長崎"}, {"exam": 12, "no": 48, "sub": "", "q": "運河埋め立ての見直しを求める10万人の署名を集める活動をしましたが、これは次のどの団体が行ったのでしょうか。", "a": "3"}, {"exam": 13, "no": 46, "sub": "", "q": "昭和40年頃には小樽港の設備は埠頭中心になり、小樽運河の役割はほとんど終わりました。そのため、道路整備計画で運河を埋立て幹線道路にすることが決まりました。この年は次のどれでしょうか。", "a": "1"}, {"exam": 13, "no": 47, "sub": "", "q": "昭和47年、札樽自動車道の延長幹線道路建設で石造倉庫の街並みが取り壊されたのが、小樽運河保存運動が立ち上がるきっかけとなったと言われますが、その石造倉庫群とはどこにあったのでしょう。地区名（町名）で答えなさい。", "a": "有幌"}, {"exam": 13, "no": 48, "sub": "", "q": "小樽運河埋め立ての見直しを求める市民運動が続けられたことで、今日の小樽観光の基盤ができたといっても過言ではありません。この小樽の歴史を大きく変えた市民運動の活動期間は次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 72, "sub": "", "q": "現在、小樽運河を横断する橋は4つあります。南側（札幌側）から北側（手宮方面）への順番で4つすべてが正しいのはどれでしょうか。", "a": "4"}, {"exam": 14, "no": 37, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。小樽港の埋立地の造成と運河の建設は小樽区営第一期修築工事として、約10年かかりました。こうして小樽運河は（　）年に完成します。（西暦でも可）", "a": "大正12年（1923）"}, {"exam": 14, "no": 47, "sub": "", "q": "小樽運河保存運動の二代目会長となった峯山冨美さんは、小樽運河を残す運動に関わる意味を、常に投げかけていました。その言葉とは次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 48, "sub": "", "q": "小樽運河保存運動では、いろいろなキャッチフレーズが生み出されました。次のうち実際には使われていないものはどれでしょうか。", "a": "1"}, {"exam": 14, "no": 49, "sub": "", "q": "運河埋め立ての見直しを求めるため、10万人を目標とする署名活動が行われました。その結果は次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 46, "sub": "", "q": "小樽運河保存運動が立ち上がるきっかけとなったのは、昭和47年、札樽自動車道の延長幹線道路建設で当時、有幌にあった多くのものが取り壊されたことでした。その壊されたものとは何だったでしょうか。", "a": "石造倉庫"}, {"exam": 15, "no": 47, "sub": "", "q": "昭和45(1970)年に日本建築学会の明治建築調査小委員会が公表した保存したい明治建築のリストに、町並みとして取り上げられたのは、小樽運河周辺の歴史的町並みと、神戸の山本通りの異人館街の他、あと1カ所は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 48, "sub": "", "q": "小樽運河保存運動が盛り上がる中、小樽の経済界の一部も含めた幅広い層の市民が集まり、運河埋め立ての見直しを求める10万人の署名を集める活動が生まれました。その会の名称は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 49, "sub": "", "q": "かつて東京大学の西村教授が小樽で行われた講演で、「小樽運河保存運動の5つの特徴」として指摘されたものに含まれていないものは次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 78, "sub": "", "q": "冬の小樽観光を底上げするため、長期間のイベントを開催しています。一例としては、「青の運河」として小樽運河が幻想的なイルミネーションで夜間に演出されます。今年度は2017年11月11日から2018年2月18日まで行われました。このイベント名は何というでしょうか。", "a": "小樽ゆき物語"}, {"exam": 16, "no": 47, "sub": "", "q": "昭和47年、札幌からの幹線道路建設で小樽にあった石造倉庫の街並みが取り壊されたのが、小樽運河保存運動が立ち上がるきっかけとなったといわれますが、その石造倉庫群はどこにあったのでしょう。", "a": "3"}, {"exam": 16, "no": 48, "sub": "", "q": "日本で歴史的町並みを保存する制度（伝統的建造物群保存地区）ができたのはいつでしょう。それは運河保存運動が始まった直後です。", "a": "3"}, {"exam": 16, "no": 49, "sub": "", "q": "小樽運河を守る会の二代目会長で、よく「地域に生きるとは何か」という問いを投げかけられていたのは誰でしょうか。（姓のみ不可）", "a": "峯山冨美"}, {"exam": 17, "no": 48, "sub": "", "q": "運河が完成した50年後、小樽運河は本来の役割を終え荒れた姿となり、道路整備計画で運河を埋め立てて幹線道路にすることが決まりました。道路計画が決まった年は次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 49, "sub": "", "q": "昭和48(1973)年12月に、このまま道路建設が進み運河が埋め立てられれば「小樽が小樽でなくなってしまう！」という思いから、保存運動の発起人会が発足します。後に全国に知られるまちづくり運動となった、その会の名称は何というでしょうか。", "a": "小樽運河を守る会"}, {"exam": 17, "no": 50, "sub": "", "q": "運河保存運動の影響で、最終的に道路計画は一部見直され、小樽運河は幅が半分になり水路沿いに散策路が整備され現在の姿になりました。しかし、当初の運河の面影を感じられる水路がまだ一部あります。それは次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 81, "sub": "A", "q": "（　）内に該当する数字を書きなさい。冬のロングランイベントとして、2020年2月16日まで「小樽ゆき物語」が開催されました。運河プラザ内ではワイングラスタワーが設置され、写真スポットとして観光客に人気でした。実際に積み上げられたワイングラスの数は（　A　）個、また小樽運河には青色ＬＥＤが（　B　）個施されました。", "a": "2，000"}, {"exam": 17, "no": 81, "sub": "B", "q": "（　）内に該当する数字を書きなさい。冬のロングランイベントとして、2020年2月16日まで「小樽ゆき物語」が開催されました。運河プラザ内ではワイングラスタワーが設置され、写真スポットとして観光客に人気でした。実際に積み上げられたワイングラスの数は（　A　）個、また小樽運河には青色ＬＥＤが（　B　）個施されました。", "a": "10，000"}, {"exam": 18, "no": 48, "sub": "", "q": "小樽運河保存運動が立ち上がるきっかけとなったのは、札樽自動車道の延長幹線道路建設で当時、有幌にあった多くの石造倉庫が取り壊されたことでした。その壊された年はいつでしょうか。", "a": "昭和47年又は 1972年"}, {"exam": 18, "no": 49, "sub": "", "q": "昭和45(1970)年に日本建築学会の明治建築調査小委員会による保存したい明治建築のリストが公表され、町並みとして3ヵ所が取り上げられました。次の中で違うのはどれでしょうか。", "a": "1"}, {"exam": 18, "no": 50, "sub": "", "q": "次の文章は現在の小樽運河に架かる橋の説明です。橋の名称を書きなさい。「小樽運河に架かる橋の中では一番高さがあり、北運河に係留している遊漁船も航行できます。橋にはなぜか馬の蹄鉄が埋め込まれており、観光客の目をひきます。」", "a": "北浜橋"}, {"exam": 19, "no": 49, "sub": "", "q": "昭和47（1972）年、札幌からの幹線道路建設で小樽にあった約30棟の石造倉庫の街並みが取り壊されたのが、小樽運河保存運動が立ち上がるきっかけとなったといわれています。その石造倉庫群はどこにあったのでしょう。", "a": "4"}, {"exam": 19, "no": 51, "sub": "", "q": "小樽運河保存運動が盛り上がる中、小樽の経済界の一部も含めた幅広い層の市民が集まり、運河埋め立ての見直しを求める「小樽運河百人委員会」という署名を集める活動が生まれました。この会が2ヶ月間の署名活動で集めた署名数は次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 38, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。小樽港の埋立地の造成と運河の建設は小樽区営第一期修築工事として、約10年かかりました。こうして小樽運河は（　）年に完成し、令和5（2023）年は完成後100年を迎えます。（西暦でも可）", "a": "大正12年（1923）"}, {"exam": 20, "no": 48, "sub": "", "q": "小樽運河保存運動が立ち上がる以前、港の整備の中心は埠頭に移り、運河の役割はほとんど終わっていました。そのため道路整備計画で運河を埋め立てて幹線道路とすることが決められました。その年とは次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 49, "sub": "", "q": "運河埋め立ての見直しを求めるため10万人の署名を目標に活動し、9万7千人の署名を集めました。これは次のどの団体が行ったのでしょうか。", "a": "4"}, {"exam": 20, "no": 50, "sub": "", "q": "小樽運河保存運動では、保存と再生をアピールするため、いろいろなキャッチフレーズが生み出されました。次のうち実際には使われていないものはどれでしょうか。", "a": "1"}, {"exam": 20, "no": 51, "sub": "", "q": "小樽運河保存運動の5つの特徴を当時、東京大学工学院系都市工学科の西村教授が発言しています。次のうち違うものはどれでしょうか。", "a": "4"}, {"exam": 20, "no": 78, "sub": "", "q": "第25回小樽雪あかりの路が令和5年2月に開催され新たな会場が増えました。次のなかで新たな会場とはどれでしょうか。", "a": "3"}, {"exam": 20, "no": 83, "sub": "", "q": "冬のロングランイベントとして、2022年11月1日から2023年2月19日まで「小樽ゆき物語」が開催されました。運河プラザ内ではワイングラスタワーが新たに円錐形にリニューアルされ設置されました。この積み上げられたワイングラスの数は何個だったでしょうか。", "a": "2,000個"}, {"exam": 21, "no": 38, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。いわゆる小樽運河は令和5(2023)年、工事完成後100年を迎えました。工事は4区に分けて進められましたが、第一区工事が着工されたのは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 48, "sub": "", "q": "昭和47(1972)年、札樽自動車道の延長幹線道路建設で石造倉庫がたくさんあった地区で石造倉庫の解体がはじまりました。これが小樽運河保存運動の立ち上がるきっかけになったと言われています。その石造倉庫群とはどこにあったのでしょう。地区名（町名）で答えなさい。", "a": "有幌"}, {"exam": 21, "no": 49, "sub": "", "q": "昭和48(1973)年、道路建設による運河埋め立てを危惧し、一部の市民が立ち上がりました。それが「小樽運河を守る会」の発起人会でした。この会が正式に発足したのは次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 50, "sub": "", "q": "「小樽運河を守る会」の活動は著名人を中心に札幌や東京などにも広がり、活動をする会が結成されていきました。その流れは小樽の20歳前後の若者たちにも広がり、昭和53（1978）年7月、かつてないイベントが運河周辺で開催されました。このイベント名は次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 51, "sub": "", "q": "令和5(2023)年は小樽運河完成後100年の年で、様々な活動をしていくための実行委員会が結成されました。その名称は次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 49, "sub": "", "q": "小樽運河の保存運動が始まったころ、各地で支援する会が発足しました。次のなかで実際にあった会の名称はどれでしょうか。", "a": "1"}, {"exam": 22, "no": 50, "sub": "", "q": "小樽運河散策路の青銅の柵をデザインしたのは小樽在住の彫刻家、鈴木吾郎氏です。この柵は何をモチーフにしてデザインされているのでしょうか。", "a": "シラカンバ"}, {"exam": 22, "no": 51, "sub": "", "q": "運河保存運動が続くなか、当時の若者たちは運河周辺と石造倉庫を舞台にした市民手づくりの祭り「ポートフェスティバル・イン・オタル」を昭和53（1978）年を企画、開催し、多くの市民を運河周辺に呼び込みました。このイベントは何回まで続いたでしょうか。", "a": "4"}, {"exam": 22, "no": 76, "sub": "", "q": "令和6（2024）年11月1日〜令和7（2025）年1月31日まで小樽運河では近年恒例の「青の運河」が開催されました。青色ＬＥＤのイルミネーションによる幻想的な風景が好評ですが、このＬＥＤの数を下記の中から選びなさい。", "a": "2"}, {"exam": 23, "no": 48, "sub": "", "q": "小樽運河保存運動が立ち上がるきっかけとなったのは、札樽自動車道の延長幹線道路建設で当時、有幌にあった石造倉庫群が次々に取り壊されたことでした。この工事が行われた年はいつでしょうか。", "a": "昭和47年または 1972年"}, {"exam": 23, "no": 49, "sub": "", "q": "昭和51(1976)年、道路建設による運河埋め立てを危惧し、「小樽運河を守る会」の発起人会が正式に発足しました。この時、初代会長になったのは次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 50, "sub": "", "q": "次の文章は現在の小樽運河に架かる橋の説明です。橋の名称を書きなさい。「小樽運河に架かる橋の中では他の橋より高さがあり遊漁船も航行できます。橋のたもとには小樽出身の彫刻家、斎藤吉郎さんの作品「カモメ呼ぶ少女」像があります。」", "a": "北浜橋"}, {"exam": 23, "no": 51, "sub": "", "q": "運河埋め立ての着工直前、保存派による署名活動が行われました。その結果は次のどれでしょうか。", "a": "3"}, {"exam": 23, "no": 62, "sub": "", "q": "次の建物のなかで建築構造が一つだけ違うものがあります。それはどれでしょうか。（建物名は現在名）", "a": "1"}, {"exam": 23, "no": 73, "sub": "", "q": "令和7(2025)年7月18日、『その街に集うすべての人にご満足いただける、その街のスタイルホテル』を基本コンセプトに小樽運河の近くにホテルがオープンしました。地上6階建て、客室は全159室で、最上階には石狩湾を一望できる展望露天風呂やBARも備わっています。このホテル名を書きなさい。", "a": "小樽グランベルホテル"}], "生活文化": [{"exam": 1, "no": 61, "sub": "", "q": "和光荘（潮見台、大正11年）は、酒造会社の社長の住宅として建てられました。そのデザインの基調は、当時、パリを中心にヨーロッパで流行の兆しが見られた幾何学模様を取り入れています。そのデザインは、何と呼ばれるでしょうか。", "a": "4"}, {"exam": 1, "no": 64, "sub": "", "q": "小樽の職人がつくってはいないのは次のどれですか。", "a": "3"}, {"exam": 1, "no": 85, "sub": "", "q": "市内には清酒メーカーが次の4社あります。A．北の誉酒造　B．曲イ田中酒造　C．雪の花酒造　D．山二わたなべ　それぞれの酒造メーカーとその銘柄の組み合わせで、正しいものはどれでしょうか。", "a": "3"}, {"exam": 1, "no": 94, "sub": "", "q": "小樽特有の浜言葉や方言、文化などを好印象を持って受け入れられるためには、たとえばどのような対応が必要でしょうか。", "a": "2"}, {"exam": 2, "no": 51, "sub": "", "q": "運河をつうじて小樽のまちを見つめ直す機会を得た多くの人々のエネルギーは、その後のまちづくりに脈々と生き続けていると言えます。そのひとつとして平成16年度の国土交通省大臣表彰「手づくり郷土賞」を受賞したのは次のどれですか。", "a": "1"}, {"exam": 2, "no": 85, "sub": "", "q": "前問の賞を受賞していないイベントは次のどれでしょうか。", "a": "4"}, {"exam": 2, "no": 87, "sub": "", "q": "市内には酒造会社が4社あります。それぞれの酒造会社とその銘柄の組み合わせで正しいものはどれですか。A．北の誉酒造　B．曲イ田中酒造　C．雪の花酒造　D．山二わたなべ", "a": "4"}, {"exam": 2, "no": 88, "sub": "", "q": "潮見台にあるモダンな豪邸「和光荘」に関連する酒造会社は次のどれですか。", "a": "4"}, {"exam": 2, "no": 90, "sub": "", "q": "小樽は昔から餅店や菓子店が多い町といわれています。明治18年創業という小樽で最も古い公園通りの菓子店といえば次のどれですか。（現在は営業しておりません）", "a": "3"}, {"exam": 3, "no": 60, "sub": "", "q": "和光荘（潮見台、大正11年）は、酒造会社の社長の住宅として建てられました。そのデザインの基調は、当時、パリを中心にヨーロッパで流行の兆しが見られた幾何学模様を取り入れています。それは何と呼ばれるデザインですか。", "a": "4"}, {"exam": 3, "no": 82, "sub": "", "q": "小樽市が平成11年より製造しているボトルドウォーター「小樽の水」は何を記念して製造が開始されましたか。", "a": "3"}, {"exam": 3, "no": 89, "sub": "", "q": "市内には酒造会社が4社あります。それぞれの酒造会社とその銘柄の組み合わせで正しいものはどれですか。A）北の誉酒造　B）曲イ田中酒造　C）雪の花酒造　D）山二わたなべ", "a": "4"}, {"exam": 3, "no": 95, "sub": "", "q": "小樽特有の浜言葉や方言、文化などは誰にでも好印象を持って受け入れられるとは限りません。どのような対応が必要だと思いますか。", "a": "2"}, {"exam": 4, "no": 85, "sub": "", "q": "小樽の教育は明治6年、小樽群教育所開設で始まりました。この場所は現在の小学校名でいうと、どこの小学校でしょうか。", "a": "2"}, {"exam": 4, "no": 87, "sub": "", "q": "小樽市内酒造会社4社の創業年の古い順に左から並べています。正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 27, "sub": "", "q": "石橋彦三郎にゆかりのある酒造会社はどれでしょうか。", "a": "2"}, {"exam": 5, "no": 84, "sub": "", "q": "次の菓子店で小樽での創業の古い順（左から）として正しいのはどれでしょうか。", "a": "2"}, {"exam": 5, "no": 89, "sub": "A", "q": "下記文章の各空欄を、それぞれ同じ符号の項目4つのうちから適切なものを選び、なさい。小樽は土地特有の浜言葉や（　A　）は、文化の違う人々には、時として不愉快に映ることもよくあるようですが、そこに（　B　）と気さくな（　C　）があれば、旅は印象深く魅力的に彩られることでしょう。心のこもった（　B　）と、ちょっとした（　C　）は、最小にして最大の（　D　）です。", "a": "3"}, {"exam": 5, "no": 89, "sub": "B", "q": "下記文章の各空欄を、それぞれ同じ符号の項目4つのうちから適切なものを選び、なさい。小樽は土地特有の浜言葉や（　A　）は、文化の違う人々には、時として不愉快に映ることもよくあるようですが、そこに（　B　）と気さくな（　C　）があれば、旅は印象深く魅力的に彩られることでしょう。心のこもった（　B　）と、ちょっとした（　C　）は、最小にして最大の（　D　）です。", "a": "1"}, {"exam": 5, "no": 89, "sub": "C", "q": "下記文章の各空欄を、それぞれ同じ符号の項目4つのうちから適切なものを選び、なさい。小樽は土地特有の浜言葉や（　A　）は、文化の違う人々には、時として不愉快に映ることもよくあるようですが、そこに（　B　）と気さくな（　C　）があれば、旅は印象深く魅力的に彩られることでしょう。心のこもった（　B　）と、ちょっとした（　C　）は、最小にして最大の（　D　）です。", "a": "4"}, {"exam": 5, "no": 89, "sub": "D", "q": "下記文章の各空欄を、それぞれ同じ符号の項目4つのうちから適切なものを選び、なさい。小樽は土地特有の浜言葉や（　A　）は、文化の違う人々には、時として不愉快に映ることもよくあるようですが、そこに（　B　）と気さくな（　C　）があれば、旅は印象深く魅力的に彩られることでしょう。心のこもった（　B　）と、ちょっとした（　C　）は、最小にして最大の（　D　）です。", "a": "4"}, {"exam": 6, "no": 86, "sub": "", "q": "小樽の神社での祭りで通称3大祭りといえば、次のどれでしょうか。", "a": "4"}, {"exam": 7, "no": 65, "sub": "", "q": "第9回「ハイ・サービス日本300選」（サービス産業生産協議会）で、小樽から初めてサービス先進事例として選定されたこの団体は、子どもたちの社会人・職業人としての自立を促す『キャリア教育事業』や『キッズベンチャー事業』、職人業界活性化ノウハウの他地域への伝授など、人材育成や業界活性化に向けた取組みを行っています。この団体名は何というでしょうか。", "a": "NPO法人北海道職人義塾大学校"}, {"exam": 7, "no": 87, "sub": "", "q": "次の小樽市内の酒造会社で、創業年が一番古い会社はどれでしょうか。", "a": "3"}, {"exam": 9, "no": 86, "sub": "", "q": "小樽の教育は明治6年、開運町に小樽群教育所開設で始まりました。ここは平成24年3月末で閉校になる小学校です。どこの小学校でしょうか。", "a": "2"}, {"exam": 9, "no": 92, "sub": "", "q": "観光客には、いきなり小樽特有の浜言葉や方言での話しかけは、誰もが好印象を持って受け入れられるとは限りません。どのような対応が必要だと思いますか。", "a": "2"}, {"exam": 10, "no": 65, "sub": "", "q": "この団体は、市内外の小中学校生に職人の技術を伝える体験学習を積極的に行ったり、かつては職業人としての自立を促す『キャリア教育事業』など、人材育成や業界活性化に向けた取組みを行っています。この団体名は何というでしょうか。", "a": "1"}, {"exam": 11, "no": 61, "sub": "", "q": "和光荘（潮見台、大正11年）は、酒造会社の社長の住宅として建てられました。そのデザインの基調は、当時、パリを中心にヨーロッパで流行の兆しが見られた幾何学模様を取り入れています。そのデザインとは、次のどれでしょうか。", "a": "4"}, {"exam": 11, "no": 86, "sub": "", "q": "小樽市内には明治時代に開業した菓子店があります。次の内、明治37年に小樽で開業した菓子店はどれでしょうか。", "a": "3"}, {"exam": 12, "no": 83, "sub": "", "q": "現在、小樽市内の清酒酒造会社は3社あります。その3社の主要銘柄ではないものは次のどれでしょうか。", "a": "3"}, {"exam": 12, "no": 89, "sub": "C", "q": "（　）内に一番適切とおもわれる語句を選びなさい。観光ガイドの能力において必要なことの一つは（　A　）です。お客様に何をどう伝えるかも大事ですが（　B　）かがもっと大事なことといえます。（　A　）を鍛えるには、言葉を伝えるだけではなくちょっとした（　C　）を意識することで、お客様との楽しい時間を共有できるということを体験してみるとよいでしょう。", "a": "2"}, {"exam": 13, "no": 86, "sub": "", "q": "冬の小樽を彩る「小樽雪あかりの路」は毎年2月に開催されています。このイベントは毎年たくさんのボランティアにより支えられています。開催期間中、参加するボランティアの延べ人数は次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 92, "sub": "A", "q": "（　）内に該当する語句を選びなさい。小樽や後志沿岸部のまちでは浜言葉やその地方独特の方言や話し方があります。その土地のガイドが、よかれと思い、いきなりこのような話し方をすると観光客には時として不愉快に感じることもあります。そうならないためには、まずは（　A　）と気さくな（　B　）から始めることで、お客様とコミュニケーションがとれるようになります。心のこもった（　A　）と、ちょっとした（　B　）は、最小にして最大の（　C　）です。", "a": "1"}, {"exam": 13, "no": 92, "sub": "B", "q": "（　）内に該当する語句を選びなさい。小樽や後志沿岸部のまちでは浜言葉やその地方独特の方言や話し方があります。その土地のガイドが、よかれと思い、いきなりこのような話し方をすると観光客には時として不愉快に感じることもあります。そうならないためには、まずは（　A　）と気さくな（　B　）から始めることで、お客様とコミュニケーションがとれるようになります。心のこもった（　A　）と、ちょっとした（　B　）は、最小にして最大の（　C　）です。", "a": "4"}, {"exam": 14, "no": 83, "sub": "", "q": "小樽の教育は明治6年、開運町に小樽群教育所開設で始まりました。この場所には現在も「小樽教育発祥之地」という記念碑が設置されています。その場所とは次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 83, "sub": "", "q": "現在の小樽市内の菓子店で開業が最も古いのは、次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 86, "sub": "", "q": "小樽雪あかりの路は今回で第20回目を迎え、小樽観光の大きな柱となりました。期間中の催しとして第11回目から「おたる案内人」が全面的に協力しているのは次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 92, "sub": "A", "q": "下記文章の各空欄を、それぞれ同じ符号の項目4つのうちから適切なものを選びなさい。小樽は土地特有の浜言葉や（　A　）な態度は、文化の違う人々には、時として不愉快に映ることもよくあるようですが、そこに笑顔と（　B　）があれば、旅は印象深く魅力的に彩られることでしょう。心のこもった笑顔とちょっとした（　B　）は、最小にして最大の（　C　）です。", "a": "3"}, {"exam": 15, "no": 92, "sub": "B", "q": "下記文章の各空欄を、それぞれ同じ符号の項目4つのうちから適切なものを選びなさい。小樽は土地特有の浜言葉や（　A　）な態度は、文化の違う人々には、時として不愉快に映ることもよくあるようですが、そこに笑顔と（　B　）があれば、旅は印象深く魅力的に彩られることでしょう。心のこもった笑顔とちょっとした（　B　）は、最小にして最大の（　C　）です。", "a": "1"}, {"exam": 16, "no": 69, "sub": "", "q": "次の文に該当する作家名を書きなさい。「私は浪の音を守唄にして眠る・・・ではじまる碑文は昭和45年にこの小樽を代表する作家の旧友たちの発起で、海を見下ろす丘に建立された。この場所は小樽雪あかりの路会場にもなっている。」", "a": "伊藤整"}, {"exam": 16, "no": 83, "sub": "", "q": "小樽は神社の例大祭が多いまちです。通称3大祭りと呼ばれる神社は次のどれでしょうか。", "a": "3"}, {"exam": 16, "no": 85, "sub": "", "q": "小樽の冬の観光の柱となった「小樽雪あかりの路」は2018年度国土交通省のグランプリを受賞しました。その賞の名称は次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 86, "sub": "", "q": "小樽には明治期から創業している菓子店があります。そのなかで旧名「水晶あめ玉」として販売されていた飴は現在、何という名称で販売されているでしょうか。", "a": "3"}, {"exam": 17, "no": 83, "sub": "", "q": "冬の一大イベント「小樽雪あかりの路」は今回で第22回目を迎えました。これまでたくさんのボランティアの活動でイベントが運営されています。そのなかで外国人ボランティアの通称、「OKOVO」と呼ばれる団体はどこの国のボランティアチームでしょうか。", "a": "2"}, {"exam": 17, "no": 84, "sub": "", "q": "現在、小樽市内唯一の清酒酒造会は田中酒造です。この田中酒造の主要銘柄は次のどれでしょうか。", "a": "3"}, {"exam": 18, "no": 77, "sub": "", "q": "次のイベントの中で、これまで小樽市都市景観賞を受賞していないのはどれでしょうか。", "a": "3"}, {"exam": 18, "no": 81, "sub": "", "q": "第23回小樽雪あかりの路は、新型コロナウイルス感染症の影響を受け、残念ながら中止となりました。今年のポスターはコロナ禍のなか、雪あかりの原点に帰るという思いも込め、ポスターのキャッチコピーは一般公募した中から採用されていました。キャッチコピーの空白部分に当てはまる共通の漢字一文字を書きなさい。「今年も（　）る」「きっと特別な（　）になる」", "a": "灯"}, {"exam": 18, "no": 85, "sub": "", "q": "小樽の神社のお祭りで通称3大祭りと呼ばれる神社は次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 86, "sub": "", "q": "小樽の教育は明治6（1873）年、開運町に小樽群教育所開設で始まりました。この場所には現在も「小樽教育発祥之地」という記念碑が設置されています。その場所とは次のどれでしょうか。", "a": "2"}, {"exam": 19, "no": 62, "sub": "", "q": "和光荘（潮見台、大正11（1922）年）は、酒造会社の2代目社長の住宅として建てられました。そのデザインの基調は、当時、パリを中心にヨーロッパで流行の兆しが見られた幾何学模様を取り入れています。そのデザインとは、次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 82, "sub": "", "q": "おたる潮まつりは、「港まつり」「競争花火大会」「北海道工業品共進会」「見本市」などを統合したまつりが前身となり、その後おたる潮まつりとなりました。この前身となったまつりの名称は次のどれでしょうか。", "a": "1"}, {"exam": 20, "no": 86, "sub": "", "q": "小樽には歴史ある菓子店があります。嘉永4(1851)年に越後で創業し、小樽では明治37(1904)年に創業しました。この菓子店名を書きなさい。", "a": "花月堂"}, {"exam": 21, "no": 74, "sub": "", "q": "第26回小樽雪あかりの路の運営にあたり、外国人ボランティアの団体が活躍しました。外国人ボランティア団体として参加した国は次のどれでしょうか。", "a": "2 (3も正解とする）"}, {"exam": 21, "no": 83, "sub": "", "q": "小樽の歴史ある菓子店のなかで、明治44(1911)年創業、「水晶あめ玉」でお馴染みのお店の名称は何というでしょうか。", "a": "澤の露本舗"}, {"exam": 22, "no": 90, "sub": "", "q": "小樽市指定有形文化財の一つに「稲垣益穂日誌」があります。明治29（1896）年から亡くなる直前の昭和10（1935）年までが記録されています。稲垣益穂は小樽市内の小学校の校長先生でしたが、どこの小学校だったでしょうか。（学校名は現在名）", "a": "4"}, {"exam": 23, "no": 86, "sub": "", "q": "小樽の教育は明治6(1873)年、開運町に小樽教育所開設で始まりました。この場所には以前は「小樽教育発祥之地」という石碑がありましたが、現在は題字部分だけを再利用した新記念碑が設置されています。その場所は次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 92, "sub": "", "q": "観光ガイドとして、お客様をご案内するとき、相手を尊重する心のあり方として一番気を付けたいのは次のどれでしょうか。", "a": "1"}], "景観とまちなみ": [{"exam": 1, "no": 83, "sub": "", "q": "小樽市では魅力あるまちづくりをするために市内をいくつかの地区に分け、それぞれの地区を代表する景観を選び出しました。その名称は何といいますか。", "a": "1"}, {"exam": 2, "no": 83, "sub": "", "q": "小樽市では魅力あるまちづくりをするために市内をいくつかの地区に分け、それぞれの地区を代表する景観を選び出しました。その名称は何といいますか。", "a": "小樽八区八景"}, {"exam": 2, "no": 84, "sub": "", "q": "小樽の歴史と風土に調和した都市景観をつくり出している建築物や活動などを表彰することにより、都市環境の向上と市民のまちづくりへの理解を深めることを目的とした賞の名称は何ですか。", "a": "3"}, {"exam": 3, "no": 84, "sub": "", "q": "小樽の歴史と風土に調和した都市景観をつくり出している建築物や活動などを表することにより、都市環境の向上と市民のまちづくりへの理解を深めることを目的とした賞の名称は何ですか。", "a": "3"}, {"exam": 4, "no": 81, "sub": "", "q": "「小樽八区八景」の、ある地区についての説明です。どこの地区でしょうか。「北海道海水浴場発祥の地として夏場に道内有数の賑わいを見せる海水浴場があります。また埋蔵文化財が発掘され、古代の歴史を感じさせる地区でもあります。」", "a": "4"}, {"exam": 5, "no": 80, "sub": "", "q": "小樽の歴史と風土に調和した都市景観をつくり出している建築物や活動などを表彰することにより、都市環境の向上と市民のまちづくりへの理解を深めることを目的とした賞の名称は何ですか。", "a": "3"}, {"exam": 6, "no": 82, "sub": "", "q": "小樽八区八景の「中央地区」のおもな景観のうち、中央地区とは関係のないものは次のどれでしょうか。", "a": "3"}, {"exam": 6, "no": 83, "sub": "", "q": "次の写真は、第1回小樽市都市景観賞を受賞した堺町通りに面した建物の内部です。トロッコ・レールが残っているのが大きな特長です。この建物の創建時の名称は何といいますか。", "a": "木村倉庫"}, {"exam": 7, "no": 83, "sub": "", "q": "第18回（平成21年度）小樽市都市景観賞が決定しました。受賞したイベントで正しいのはどれでしょうか。", "a": "3"}, {"exam": 8, "no": 85, "sub": "", "q": "小樽の歴史と風土に調和した都市景観をつくり出している建築物や活動などを表彰する「小樽市都市景観賞」のイベント部門で、受賞していないイベントは次のどれでしょうか。", "a": "4"}, {"exam": 9, "no": 83, "sub": "", "q": "第19回小樽市都市景観賞では、同賞に準じる奨励賞も3件選出されました。そのなかには平成22年3月に建て替えられた公共建築で、外観は小樽の歴史的素材である軟石の色合いに合わせたタイルと、近代的な金属素材を組み合わせたことによる新たな景観が評価されました。この建物名は何というでしょうか。", "a": "小樽地方合同庁舎"}, {"exam": 9, "no": 84, "sub": "", "q": "小樽八区八景の「銭函地区」のおもな景観のうち、銭函地区と関係のないものは次のどれでしょうか。", "a": "3"}, {"exam": 10, "no": 84, "sub": "", "q": "平成23年の第19回小樽市都市景観賞を受賞した歴史的建造物は小樽ゴールドストーン、坂牛邸、奨励賞の岡川薬局ともう一つは次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 84, "sub": "", "q": "第20回小樽市都市景観賞が平成25年11月に発表されました。都市景観賞を受賞したなかで、小樽フラワーマスター連絡協議会と連携し環境整備に取り組んだのは次のどれでしょうか。", "a": "2"}, {"exam": 13, "no": 79, "sub": "", "q": "小樽市では平成25年度より、観光庁「官民協働した魅力ある観光地の再建・強化事業」に採択された、「小樽・札幌周遊型ロリカワ観光ツーリズム事業」として、札幌市や民間事業者と協議会を組織し、従来の歴史や文化、まちなみ、産業などの観光資源（歴史・文化、景観、食など）に、ロリィタファッションやカワイイ文化を切り口とした新たな魅力を付加することで、旅行者の多様なニーズに対応したニューツーリズムの構築を進めています。このイベント名は次のどれでしょうか。", "a": "1"}, {"exam": 13, "no": 81, "sub": "", "q": "「小樽八区八景」のある地区の八景の一つに「ハマナス咲く10キロメートルの砂浜」があります。該当する地区は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 82, "sub": "", "q": "小樽市は平成27年11月、第21回小樽市都市景観賞2件を選定しました。一件は「旧岡崎家能舞台を生かす会の活動」ともう一つは富岡町の建築物で昭和25年製造の鐘を3つ設置してシンボルとしているのが特徴です。この建物名は何というでしょうか。", "a": "日本基督教団小樽教会または小樽教会"}, {"exam": 14, "no": 81, "sub": "", "q": "次の建造物のなかで小樽市都市景観賞を受賞しているのはどれでしょうか。", "a": "4"}, {"exam": 15, "no": 76, "sub": "", "q": "平成29年に第22回小樽市都市景観賞が発表されました。都市景観賞には2件選出され、1件はニトリ小樽芸術村、もう1件は何という建物でしょうか。", "a": "旧岡川薬局"}, {"exam": 15, "no": 77, "sub": "", "q": "小樽市内の通りを説明した文章です。この通りの名称は次のどれでしょうか。近年、この通りの電線は地中化され港を望む景観が観光客からも好評です。また、この景観は小樽市都市景観賞も受賞しています。", "a": "4"}, {"exam": 15, "no": 87, "sub": "", "q": "小樽市内の神社、寺と関わりのある事柄の組合せで間違っているのは、次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 76, "sub": "", "q": "第23回小樽市都市景観賞が令和元(2019)年に2件発表されました。団体からは「小樽・朝里まちづくりの会」が受賞しました。もう一つの受賞物件は工作物からです。それは何でしょうか。", "a": "旧手宮線の散策路整備"}, {"exam": 17, "no": 77, "sub": "", "q": "次の建築物の中で、これまで小樽市都市景観賞を受賞していないのはどれでしょうか。", "a": "2"}, {"exam": 19, "no": 72, "sub": "", "q": "令和3（2021）年11月に第24回小樽市都市景観賞が発表されました。都市景観賞には2件選定されました。UNWIND HOTEL & BAR小樽（アンワインド　ホテル＆バー小樽）ともう1件は何でしょうか。", "a": "小樽運河クルーズ"}, {"exam": 19, "no": 79, "sub": "", "q": "小樽市は魅力あるまちづくりをすすめるために市内を8つの地区に分け、その地区を代表する景観を8つ選び出した「小樽八区八景」を選定しています。次の4つのなかで、八区の地区名となっていないのはどれでしょうか。", "a": "1"}, {"exam": 20, "no": 80, "sub": "", "q": "昭和63(1988)年に設けられた小樽市都市景観賞ですが、次のなかで都市景観賞を受賞していないのはどれでしょうか。", "a": "4"}, {"exam": 20, "no": 85, "sub": "", "q": "小樽市内の神社、寺と関わりのある事柄の組合せで間違っているのは、次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 72, "sub": "", "q": "第25回小樽市都市景観賞が令和5(2023)年11月に2件発表されました。1件は「住吉神社参道等の整備」、もう1件は何でしょうか。", "a": "OMO5小樽by 星野リゾート"}, {"exam": 21, "no": 81, "sub": "", "q": "小樽市は魅力あるまちづくりをすすめるために市内を8つの地区に分け、その地区を代表する景観を8つ選び出した「小樽八区八景」を選定しています。ある地区の8景のひとつに「海からの街なみと山なみ」があります。この地区は次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 54, "sub": "", "q": "小樽市内の明治期の建物です。該当する建物名（建築時名）を書きなさい。旧小樽倉庫の裏側に位置し、レンガ造りの建物。佐渡の本店で醸造した味噌などを収納していました。屋根は防火を考慮して瓦を使用し小屋組は木造でキングポストトラスという洋風の構造を用いています。平成3年に小樽市都市景観賞を受賞しています。", "a": "磯野支店倉庫"}, {"exam": 22, "no": 80, "sub": "", "q": "小樽市内の通りを説明した文章です。この通りの名称は次のどれでしょうか。この通りは平成の拡幅工事の際、電線は地中化され港を望む景観が観光客からも好評です。また、この景観は小樽市都市景観賞も受賞しています。", "a": "1"}, {"exam": 23, "no": 82, "sub": "", "q": "第26回小樽市都市景観賞が令和7(2025)年11月に発表され小樽市都市景観賞3件・小樽市都市景観奨励賞1件が決定しました。次の中で第26回の受賞物件ではないのはどれでしょうか。", "a": "4"}], "行政・市域・国際交流": [{"exam": 1, "no": 86, "sub": "", "q": "小樽市では現在2都市と姉妹都市の提携をしています。一つはニュージーランドのダニーデン市ですがもう一つはどこの都市でしょうか 2, "sub": "", "q": "問1の小樽の開基で「名主」となった人物は次のうちだれでしょうか。", "a": "2"}, {"exam": 5, "no": 3, "sub": "", "q": "明治2年、開拓使が設置され、「蝦夷地」から「北海道」に改称されました。また、ある制度が廃止され、漁場開拓の門戸が解放されました。この廃止された制度とは何でしょうか。", "a": "場所請負制"}, {"exam": 5, "no": 5, "sub": "", "q": "明治4年、黒田清隆はアメリカへ渡り、ある人物と開拓使顧問に迎える契約をしました。この人物は次々にアメリカから優秀な人材を呼び寄せ、北海道開拓に貢献しました。この人物はだれでしょうか。", "a": "ホーレス・ケプロン"}, {"exam": 6, "no": 3, "sub": "", "q": "明治2年、開拓使が設置されると、漁場開拓の門戸が解放され、これを機に多くの商人や漁業家が北海道に乗り込んできました。海官所も設置されたこの年、それまで「村並」だった小樽は何という呼び名となったでしょうか。", "a": "小樽郡または郡"}, {"exam": 7, "no": 2, "sub": "", "q": "現在の小樽の開基は松前で生まれた山田兵蔵が小樽に住み着き、村の名主となった年とされています。その年とは次のどれでしょうか。", "a": "2"}, {"exam": 7, "no": 3, "sub": "", "q": "明治2年は、大きな出来事があった年です。明治2年とは関係のない出来事は次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 3, "sub": "", "q": "開拓使が設置された年に「穂足内村並」が「小樽郡」となりました。その年は次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 5, "sub": "", "q": "開拓使の活動が本格的になったのは、ある人物が明治7年に開拓長官に就いてからといえます。小樽でも活躍したお雇い外国人らの知恵と技術を借りて北海道開拓に力を発揮した、この開拓長官とは誰でしょうか。", "a": "黒田清隆"}, {"exam": 9, "no": 1, "sub": "", "q": "現在の小樽の開基は松前で生まれた山田兵蔵が穂足内村の名主になった年とされています。それは次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 3, "sub": "", "q": "開拓使が設置された年に「小樽郡」となりました。また、その年には場所請負制が廃止されました。その年とは次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 4, "sub": "", "q": "開拓使は小樽郡に9町4村を、高島郡に4村を設置しますが、その小樽郡と高島郡の境界線は次のどれでしょうか。", "a": "4"}, {"exam": 10, "no": 1, "sub": "", "q": "現在の小樽の開基は元治2（1865）年とされていますが、それはどのように呼ばれるようになった時でしょうか。", "a": "2"}, {"exam": 10, "no": 3, "sub": "", "q": "問1の小樽の開基で「名主」となった人物は次のうちだれでしょうか。", "a": "3"}, {"exam": 11, "no": 3, "sub": "", "q": "開拓使が「小樽郡」を設置した年は何年ですか。海官所が設置された年と同じです。", "a": "2"}, {"exam": 11, "no": 5, "sub": "", "q": "明治4年、黒田清隆はアメリカへ渡り、農務省長官だったある人物と会い、開拓使顧問に迎える契約をしました。彼は次々にアメリカから優秀な技術者を呼び寄せ、北海道開拓に貢献しました。この農務省長官だった人物とは誰でしょうか。", "a": "ホーレス・ケプロン"}, {"exam": 12, "no": 1, "sub": "", "q": "小樽が「村並」から「郡」になったこの年、同時に蝦夷地は「北海道」と改称されました。この年とは次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 4, "sub": "", "q": "開拓使が雇った北海道開拓で活躍したお雇い外国人の出身地で、最も多かった国は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 3, "sub": "", "q": "蝦夷地が北海道と改称された年、同時に小樽は村並から小樽郡となりました。この年は次のどれでしょうか。", "a": "2"}, {"exam": 13, "no": 51, "sub": "", "q": "問50の建設をおもに指導した開拓使技術者は2名でした。その2名の人物名を書きなさい。（姓のみ不可）", "a": "平井晴二郎松本荘一郎"}, {"exam": 14, "no": 4, "sub": "", "q": "小樽の開基は元治2（1865）年です。このとき村並となり、定住者が徐々に増えていきましたが、そのおもな理由は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 3, "sub": "", "q": "小樽の変遷として、「場所」から「村並」になり「郡」へと変わっていきました。「郡」となった年は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 6, "sub": "", "q": "明治から昭和初期にかけて繁栄を続けた小樽ですが、第二次大戦を挟んで、まちは斜陽化していきました。その原因で間違いはどれでしょうか。", "a": "4"}, {"exam": 16, "no": 2, "sub": "", "q": "場所とよばれた時代から、定住者が増え小樽は「村並」となりました。この村並となったのは次のどれでしょうか。", "a": "3"}, {"exam": 17, "no": 2, "sub": "", "q": "元治2(1865)年、小樽は場所とよばれた時代から「村並」となりました。この時、穂足内村の名主となったのは誰でしょうか。（姓のみ不可）", "a": "山田兵蔵"}, {"exam": 17, "no": 3, "sub": "", "q": "蝦夷地が「北海道」と改称された明治2(1869)年、この年の出来事で違うのは次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 2, "sub": "", "q": "小樽の変遷として成り立ちの順番が正しいのは次のどれでしょうか。（左から古い順）", "a": "2"}, {"exam": 19, "no": 1, "sub": "", "q": "小樽は「場所」とよばれた時代から定住者が増え「村並」となりました。小樽の開基はある人物が穂足内村の名主となった元治2（1865）年とされています。その人物とは次のどれでしょうか。", "a": "1"}, {"exam": 20, "no": 4, "sub": "", "q": "北海道の開拓は開拓使の設置により進められました。明治7（1874）年に開拓長官となった黒田清隆は北海道開拓を大きく進めることになります。その政策の一つがお雇い外国人による様々な技術の導入です。その開拓使顧問として契約したのはだれでしょうか。", "a": "ケプロン"}, {"exam": 20, "no": 81, "sub": "", "q": "明治5(1872)年、開拓使は「土地払下規則」という法律を発令し北海道の土地を買って開墾したり町をつくったりすることを積極的に進めようとしました。この時、未開だった今の小樽の稲穂、富岡地区一帯20万坪を購入し地主となった人物が二人います。一人は榎本武揚ですが、もう一人は後に北海道開拓長官となった人物です。それは誰でしょうか。", "a": "北垣国道"}, {"exam": 21, "no": 2, "sub": "", "q": "小樽の開基は元治2(1865)年とされています。この年、小樽は「村並」となりました。この時の名主となったのは誰でしょうか。（姓のみ不可）", "a": "山田兵蔵"}, {"exam": 21, "no": 3, "sub": "", "q": "明治2(1869)年は北海道や小樽に大きな出来事があった年です。次のなかで間違っているのはどれでしょうか。", "a": "3"}, {"exam": 22, "no": 1, "sub": "", "q": "小樽の開基は山田兵蔵が穂足内村の名主となった年とされています。その年は何年でしょうか。", "a": "元治2年・1865年"}, {"exam": 22, "no": 2, "sub": "A", "q": "次の文章は明治時代に入った北海道に関する内容です。（　）内に該当する語句を書きなさい。明治2（1869）年7月8日、（　A　）が設置され、同年8月に小樽は村並から（　B　）となります。", "a": "開拓使"}, {"exam": 22, "no": 2, "sub": "B", "q": "次の文章は明治時代に入った北海道に関する内容です。（　）内に該当する語句を書きなさい。明治2（1869）年7月8日、（　A　）が設置され、同年8月に小樽は村並から（　B　）となります。", "a": "郡・小樽郡"}, {"exam": 23, "no": 1, "sub": "", "q": "小樽のまちの変遷として「場所」、「村並」から「郡」へと変わっていきます。小樽が「郡」となったのは何年でしょうか。", "a": "明治2年または1869年"}]}};</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byPage = {};
DATA.pages.forEach(p => { if (p.page) (byPage[p.page] = byPage[p.page] || []).push(p); });

/* 誌面ページ番号 → PDFのどのファイルの何ページか。
   ガイドブックは2分割してあるので、開くファイルも切り替える。 */
function pdfLink(page) {
  const p = (byPage[page] || [])[0];
  if (!p) return null;
  return `guidebook/guidebook_${String(p.file).padStart(2,'0')}.pdf#page=${p.pdf_page}`;
}
function pageText(page) {
  return (byPage[page] || []).map(p => p.text).join('\n');
}

let view = 'toc';
function setView(v) {
  view = v;
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.v === v));
  render();
}

function render() {
  const m = $('#main');
  if (view === 'toc') m.innerHTML = renderToc();
  else if (view === 'cat') m.innerHTML = renderCat();
  else if (view === 'town') m.innerHTML = renderTown();
  else if (view === 'era') m.innerHTML = renderEra();
  bind();
  window.scrollTo(0, 0);
}

/* ---------- 索引1: 目次 ---------- */
function renderToc() {
  let out = `<p class="hint">誌面の目次です。節を選ぶと、その範囲の本文と関連する過去問を表示します。</p>`;
  let part = null;
  DATA.toc.forEach((s, i) => {
    if (s.部 !== part) { part = s.部; out += `<div class="part">${esc(part)}</div><div class="rowlist">`; }
    const next = DATA.toc.slice(i+1).find(x => x.page);
    const range = s.page ? (next ? `p${s.page}〜${next.page-1}` : `p${s.page}〜`) : '—';
    out += `<button class="row" data-open="sec:${i}">
      <span class="pg">${s.page ? 'p'+s.page : '—'}</span>
      <span><b>${esc(s.節)}</b>${s.項.length ? `<span class="sub"> ／ ${esc(s.項.join('・'))}</span>` : ''}</span>
    </button>`;
    const after = DATA.toc[i+1];
    if (!after || after.部 !== part) out += `</div>`;
  });
  return out;
}

/* ---------- 索引2: 分野 ---------- */
function renderCat() {
  const cats = DATA.tags.カテゴリ.slice().sort((a,b) =>
    (DATA.exam_by_cat[b.名]||[]).length - (DATA.exam_by_cat[a.名]||[]).length);
  const max = Math.max(...cats.map(c => (DATA.exam_by_cat[c.名]||[]).length), 1);
  let out = `<p class="hint">検定の出題分野に沿って分けたものです。過去問での出題数が多い順に並べています。</p><div class="grid">`;
  cats.forEach(c => {
    const pages = DATA.cat_pages[c.名] || [];
    const qs = (DATA.exam_by_cat[c.名] || []).length;
    out += `<button class="item" data-open="cat:${encodeURIComponent(c.名)}">
      <b>${esc(c.名)}</b>
      <span>${esc(c.説明)}</span>
      <span>本文 ${pages.length}ページ ／ 過去問 ${qs}問</span>
      <span class="bar" style="width:${Math.max(6, qs/max*100)}%"></span>
    </button>`;
  });
  return out + `</div>`;
}

/* ---------- 索引3: 町名 ---------- */
function renderTown() {
  const towns = DATA.tags.町名.filter(t => (DATA.town_pages[t]||[]).length);
  const none = DATA.tags.町名.filter(t => !(DATA.town_pages[t]||[]).length);
  let out = `<p class="hint">誌面p177の58町名が、ガイドブックのどこで語られているかを引けます。掲載ページの多い順です。</p><div class="grid">`;
  towns.sort((a,b) => DATA.town_pages[b].length - DATA.town_pages[a].length);
  towns.forEach(t => {
    const pages = DATA.town_pages[t];
    out += `<button class="item" data-open="town:${encodeURIComponent(t)}">
      <b>${esc(t)}</b><span>${pages.length}ページ（p${pages[0]}〜）</span>
    </button>`;
  });
  out += `</div>`;
  if (none.length) out += `<p class="note">本文中に記述が見つからなかった町名：${esc(none.join('、'))}</p>`;
  return out;
}

/* ---------- 索引4: 年代 ---------- */
function renderEra() {
  let out = `<p class="hint">本文の元号年の記述を拾い、時代ごとにページを並べています。同じページが複数の時代に出ることがあります。</p><div class="rowlist">`;
  DATA.periods.forEach(p => {
    const pages = DATA.period_pages[p.名] || [];
    out += `<button class="row" data-open="era:${encodeURIComponent(p.名)}">
      <span class="pg">${pages.length}p</span>
      <span><b>${esc(p.名)}</b><span class="sub"> ／ ${esc(p.説明)}</span></span>
    </button>`;
  });
  return out + `</div>`;
}

/* ---------- 詳細 ---------- */
function open_(key) {
  const [kind, rest] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':')+1)];
  if (kind === 'sec') return detailSection(Number(rest));
  if (kind === 'cat') return detailCat(decodeURIComponent(rest));
  if (kind === 'town') return detailTown(decodeURIComponent(rest));
  if (kind === 'era') return detailEra(decodeURIComponent(rest));
}

function shell(title, meta, body) {
  $('#main').innerHTML = `<div class="detail">
    <button class="back" id="back">← 索引にもどる</button>
    <h2>${esc(title)}</h2><div class="meta">${meta}</div>${body}</div>`;
  $('#back').onclick = render;
  window.scrollTo(0, 0);
}

function pageBlocks(pages, words) {
  if (!pages.length) return `<p class="empty">該当するページがありません。</p>`;
  return pages.map(pg => {
    let t = esc(pageText(pg));
    (words || []).forEach(w => {
      if (!w) return;
      t = t.split(esc(w)).join(`<mark>${esc(w)}</mark>`);
    });
    const link = pdfLink(pg);
    return `<div class="page"><h3>誌面 p${pg}
      ${link ? `<a href="${link}" target="_blank" rel="noopener">PDFのこのページを開く →</a>` : ''}</h3>
      <pre>${t}</pre></div>`;
  }).join('');
}

function examBlocks(list, limit) {
  if (!list || !list.length) return '';
  /* 先頭から取ると第1回ばかりになるので、全回から等間隔で拾う。 */
  const n = Math.min(limit || 20, list.length);
  const step = list.length / n;
  const shown = Array.from({length: n}, (_, i) => list[Math.floor(i * step)]);
  let out = `<div class="part">この分野の過去問（${list.length}問中 ${n}問を全回から抜粋）</div>`;
  out += shown.map(q => `<div class="exam">
    <span class="k">第${q.exam}回 問${q.no}${esc(q.sub||'')}</span>
    ${esc(q.q)}<br><span class="ans">正解: ${esc(q.a)}</span></div>`).join('');
  return out;
}

function detailSection(i) {
  const s = DATA.toc[i];
  const next = DATA.toc.slice(i+1).find(x => x.page);
  const from = s.page, to = next ? next.page - 1 : 999;
  const pages = Object.keys(byPage).map(Number)
    .filter(p => from !== null && p >= from && p <= to).sort((a,b)=>a-b);
  const meta = `${esc(s.部)} ／ ${s.page ? `誌面 p${s.page}〜${pages.length ? pages[pages.length-1] : s.page}` : 'ページ番号なし'}
    ${s.項.length ? `<br>${esc(s.項.join(' ・ '))}` : ''}`;
  shell(s.節, meta, pageBlocks(pages, s.項));
}

function detailCat(name) {
  const cat = DATA.tags.カテゴリ.find(c => c.名 === name);
  const pages = DATA.cat_pages[name] || [];
  const qs = DATA.exam_by_cat[name] || [];
  const meta = `${esc(cat.説明)}<br>該当する章：${esc(cat.章.join('・'))}
    ／ 本文 ${pages.length}ページ ／ 過去問 ${qs.length}問`;
  shell(name, meta, examBlocks(qs) + `<div class="part">ガイドブック本文</div>`
    + pageBlocks(pages, cat.語));
}

function detailTown(name) {
  const pages = DATA.town_pages[name] || [];
  const words = DATA.town_words[name] || [name];
  const other = words.filter(w => w !== name);
  shell(name, `ガイドブック本文 ${pages.length}ページに記述があります`
    + (other.length ? `（あわせて探した語：${esc(other.join('、'))}）` : ''),
    pageBlocks(pages, words));
}

function detailEra(name) {
  const p = DATA.periods.find(x => x.名 === name);
  const pages = DATA.period_pages[name] || [];
  shell(name, `${esc(p.説明)} ／ 本文 ${pages.length}ページ`, pageBlocks(pages, []));
}

function bind() {
  document.querySelectorAll('[data-open]').forEach(b =>
    b.onclick = () => open_(b.dataset.open));
}
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => setView(b.dataset.v));
render();
</script>
</body></html>
