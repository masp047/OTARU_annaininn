上げら\nれています。\n坂の登り口には、国道5号との交差点を中心と\nして対角線上に三角市場と中央市場があります。\nこの2つの市場は小樽駅に近接しているという地\nの利を生かし、戦後の商品流通の拠点として活躍\nしました。ブリキの容器に鮮魚類をあふれるほど\n詰め込んだ「ガンガン部隊」も、この市場で商品\nを仕入れ各地へ出発しました。当時の流通の担い\n手「ガンガン部隊｣。今はもう、遠い幻の世界のこ\nととなってしまったのでしょうか。\n’’一一画一雁、‐‐，‐’１\n・一』Ｐ 一一\n’\n』毒\n●地形と街区\n船見坂より港を望む\nＬ、\nジ\n船見坂\n一胸闘澗砕．\n船見坂と三角市場\n710／－一1．7"}, {"page": 152, "file": 2, "pdf_page": 38, "text": "＜地獄坂＞\n国道5号の産業会館前交差点から山手へ浅草寺、\n商業高校前を経て､小樽商科大学に至る約1.5kmの\n坂道を地獄坂といいます。明治45(1912)年2月23\n日の「小樽新聞」には、この通りが地獄坂という\n名で登場しています。この地獄坂の名の由来は、\n小樽商大の草創期の歴史と切り離すことができま\nせん。\n小樽商大の始まりである小樽高等商業学校が開\n校したのは明治44(1911)年。まちを挙げての学校\n誘致の成果でした。12,000坪の敷地は地主たちが\n寄付し、建設費37万円のうち20万円は小樽区債に\nより賄われました。小樽区の年間予算が30万円で\nしたから、この金額がいかに巨額だったかがわか\nわたなくりゅうせい\nります。渡辺龍聖が初代校長として着任したのは\n''1年2月。当時は緑第一大通りから上には家がな\nく、「荒涼たる無人境の観｣があったと彼は記して\nいます。地獄坂の深い雪をこいで上り、たどりつ\nいた渡辺校長が見たのは、校舎に黒板、いすや机\nすらないありさま。今後の苦難が思いやられまし\nた。開校当初は教授、学生の住む家もなく、教授\nじきぎようじ\n陣は直行寺で合宿し、学生は雨天体操場を仮寄宿\n舎として生活し始めました。全国から集まった一\n期生72人は、冬は深い雪の中を泳ぐように、そし\nて夏は暑さに汗をかきながら、坂を上って通学し\nました。こうして学生を苦しめた坂は、開校当初\nから地獄坂とll平ばれるようになったといいます。\n雪解けになると受験生は滑って転んでは縁起が\n悪いと必死で登ったとのことです。その頃の学生\nたちは、この地獄坂の恨みつらみをデカンショ節\nときわ\nで「行くか常磐へ帰るか寄宿ヨホホ、ここが思案\nの地獄坂」と歌っていました。常磐とは坂の登り\n口にあった飲み屋のことです。\n●地形と街区\n一\n！\n地獄坂\n- －\n言 一一一\n－－－－\n地獄坂より市内中心部\n蝉 ＝\n小樽商科大学正門\n152"}, {"page": 153, "file": 2, "pdf_page": 39, "text": "＜外人坂＞\n水天宮から海側の堺町へ降りる急な坂が外人坂\nです。大正6(1917)年から昭和24(1949)年まで、\n木材貿易商を営むドイツ・ハンブルグ出身のカー\nル・コップ氏が坂の途中に住んでいたことに由来\nして名づけられました。道幅が狭く、石垣が続い\nており、清閑な雰|並|気が漂っています。水天宮の\n方へ登りつめていくと､上の方は123段の石段になっ\nています。\nドイツ・ハンブルグ市に本社のあるゲルトネル\n商会も明治42 (1909)年に小樽に支店を開設し、イ\nンチ材の輸出をしていました。コップさんが大正\n2（1913)年にゲルトネル商会に来たとき、彼はま\nだ18歳の青年だったそうです。コップさんは大正\n11(1922)年に結婚し、小樽で一男一女をもうけま\nした。小樽生まれのグンター君とエルガさんは、\n近所の道路で自転車に乗り、冬は坂でスキーをす\nる姿が見られたそうです。お嬢さんのエルガさん\nは親しくしていた近所の奥さんから「菊」という\n日本名をつけてもらったほどかわいがられていま\nした。港を見下ろすコップ家からはたくさんの外\n航船でにぎわう小樽港が見えたことでしょう。\n●地形と街区\n外人坂\n外人坂からの眺望\nKリ リ\n＜職人坂＞\nペ NF朝I1\n妙見川から水天宮通りを横切り、入船方面に向 11I\nかう坂を職人坂といいます。昔は、塗り師、張り\n師、彫り師、表具師、指物師、金具師、建具、家\n具屋、古着屋古道具屋などの仕事場が軒を並べ、\n付近がこれらの仕事と縁のある料亭などがある市\n街だったことから、年中人が集まり、にぎわって\nいました。\n往時のにぎわいは薄れましたが、現在も坂の通\nりに並ぶ建物から昔の面影をしのぶことができま\nす。\n！\n〆\n職人坂\n153"}, {"page": 154, "file": 2, "pdf_page": 40, "text": "＜浄応寺の坂＞\nL\n石山町の日乃出湯から、この坂を仰ぎ見ると、\nまるで覆いかぶさってくる様な急坂で、道路わき\nの表示には、勾配20％とあります。自動車が通行\nできる市街地の坂では－、二の急勾配です。\n坂を上っていくと、右手に立派な石垣があり、\nその上には名の由来の浄応寺があります。山門か\nら境内に入ると、正面に優雅な曲線の屋根の本堂\nがあります。これは初代の本堂が明治42 (1909)年\nの大火で焼失した後、大正11(1922)年に建てられ\nました。\n山門のかたわらには、石組みの碑がひっそりと\nあります。実はこの碑文には、驚くべき大事故の\n顛末が記されているのです。大正13(1924）年12月\n27 1=1、昼下がりの手宮駅構内で突然、大音響とと\nもに爆発が発生。その振動は札l幌の地震計にも記\n録され、爆発音は利尻島にまで届きました。\nこの爆発は、|幌内炭鉱で使用する600余箱、約10\nトン半の火薬類を貨車に積み替える作業中に起き\nた事故でした。この爆発による死者は64人、行方\n不|ﾘl者は30人もの多数に上りました。急きょ、浄\n応寺の境内には、むしろが敷かれ、遺体を安置し\nて検死作業が行われました。浄応寺の建物にも爆\n風により大きな被害が出ましたが、判別も難しい\n遺体が境内に並ぶ悲惨なありさまを目の当たりに\nしまあきら\nした住職 島 彰氏は深く心を痛めました。事故\nの1周年に、住職が関係者とともに犠牲者の慰霊\nと事故の戒めにと建てたのがこの慰霊碑です。\n●地形と街区\n、\n琴\n｜\n両陰哩\n浄応寺の坂\n＝膏 b‘\n－､ミ\n､忍、\n醐強牌 、i\n|’\n、\n坂の上から手宮方面を望む\n静屋通り\n●小樽の代表的な通り\nく静屋通り＞\nJR小樽駅前の国道5号を海側に1本下った通\nりで、長崎屋の裏通り。かつてはキャバレー「現\n代」が営業しており、独特のいい味を出していま\nした。「静屋｣の名はこの一帯の大地主だった北垣\n浅草通り\nせいおく\n国道の号の「静屋」に由来していますが、“せいお\nZ54"}, {"page": 155, "file": 2, "pdf_page": 41, "text": "〈通り”とは呼ばず“しずや通り”と呼ばれてい\nます。\n通りには蔵を利用した喫茶店や蕎麦店もあり、\n風情のある通りです。\n●地形と街区\nやながわ\nく梁川通り＞\n小樽駅前の中央通りを海側へ下り、右手に都通\nりのアーケード街をみて左折すると梁川通りで、\n梁川通り\n都通りと中央通りを挟んで続く通りです。\n〆 、\n通り名はかつて、この稲穂町一帯を所有してい 【コラム】\nえのもとたけあき りょうせん\nた榎本武揚の号の「梁川」に由来しています。日\n「榎本武揚と小樽\n常生活に必要な様々な商店が軒を並べています。\n～時代の創造者」\n榎本武揚は幕末は徳川幕府の\n＜浅草通り（日銀通り）＞\n海軍畠|｣総裁となり、維新後は開\n国道5号沿いの産業会館を海側に折れ、運河の 拓使の役人を皮切りに様々な大\n浅草橋へ下る通りがあります。小樽の2つのアー 臣を歴任した政治家で、小樽に\nも大きな足跡を残しています。\nケード街を分ける通りでもあり、金融資料館（||｜\n明治5年に開拓使は｢土地払下\n日銀小樽支店）が堂々たる構えで鎮座しており、\n規則」という法律を発令し、北\n日銀通りとも呼ばれています。\n海道の土地を買って開墾したり\n色内交差点からの眺めは堂々たるもので、往時 街をつくったりすることを積極\nの面影が色濃く残っています。 的に進めようとします。榎本は\n友人の北垣国道（後の北海道開\n拓長官）と一緒に、今の小樽の\n＜都通り＞\n稲穂と富岡地区一帯（東西は手\n小樽駅前の中央通りと浅草通りとを結ぶ中心部\n宮線から旭山奥、南北はオコバ\nのアーケードの通りで、街でも最も賑わいがある\nチ川から色内川）20万坪を購入\n商店街の一つです。アーケードの両側にはさまざ しました。そのときのこの一帯\nまな店舗が個性ある飾り付けで軒を並べ､アーケー は未開の荒野でした。\n時代が大きく変わるとき、多\nドの下では季節や祭りに合わせた催物も多く開か\nくの人々は従来通りの延長でし\nれています。通りの途中に設けられた榎本武場の\nか考えることができませんが、\n案内板や方言の垂れ幕がとてもユニークです。\n日本史上、彗星の如く登場し、\n新たな時代の社会像を明確|こ提\n案してきた人物がいます。鎌倉\n＜中央通り＞\n時代を築いた源頼朝、幕末では\nJR小樽駅前から真直ぐ海へ向かって延び、小\n勝海舟や坂本龍馬がそうだとす\n樽運河へ行くもっともわかりやすい通りです。緩\n'撰篭鱒:薊j壁\nい勾配で下っており、電線が地中化されたことで\n港と石狩湾がすっきりと望めるようになりました。 .、\n土了と／ー)／･ー"}, {"page": 156, "file": 2, "pdf_page": 42, "text": "かつての拡帆工事の際は、色内大通りの歴史|'l勺建\n造物(旧日刊北海経済新聞社など)を､建物ごと後\n方に移動して保存しました。\nＬ Ｊ\n個旧届旧一ｉ 影\n’ ●地形と街区\nWU■\nG や\n画\n鮒\n園\nー\n都通り\n…､■\n『おたるの自然』\n小樽市教育委員会 平成11年\n『わたしたちの小樽』\n小樽市教育委員会 平成16年\n｢おたる坂まち散歩」\nhttp://www.city･0taru.hokkaldo.jp,\n｢小樽市」\nhttp : //www・Clty・otaru・| 9.jp/\n｢小樽の通り」\nhttp://www!webota｢u'jp/P｢o109ue/3veneue/p89607!itm\n中央通り\n156"}, {"page": 157, "file": 2, "pdf_page": 43, "text": "●植\n物\n市の花 ツツジ\n1． 市の花\n小樽市の花は昭和43(1968)年5月28日に制定さ\nれたツツジです。制定の経緯は、北海道新聞社小\n樽支社と共催で､昭和43年北海道100年を記念して\n6月1日、2日開催の「第4回おたるつつじまつ\nり」の一環行事として「小樽の花、小樽の木」を\n市民から公募しました。選考は市と北海道新聞社\n小樽支社、学識経験者等の関係者によって行われ\nました。一般市民からの応募でツツジは一番多い\n応募数で、小樽公園にはすでに多くのツツジが植\n樹され、小樽の新名所として親しまれているとい 公会堂とツツジ\nうことで選考委員の賛成が多かったようです。\n現在、小樽公園内には20種類、約7,000本のツツ\nジが植えられ、4月下旬から6月にかけて、市民\nの目を楽しませてくれます。\n■\n2．市の木\n小樽市の木はシラカンバです。制定の経緯はツ\nツジと同様、市民からの公募により昭和43(1968）\n年5月28日に制定されました。シラカンバは小樽\n近郊に数多く見られ、市内各公陸|内にも植樹され\nており、生長力が強く育てやすく、北海道的な美 市の木 シラカンバ\nしさを感じさせるというのが選定理由でした。\n昭和39 (1964)年にロータリークラブが創立30周\n157"}, {"page": 158, "file": 2, "pdf_page": 44, "text": "年を記念して、緑化事業に取り組みたいと小樽市\n／/ 、\nに申し入れました。市はこれを受けて小樽公園の\n南斜面、順誠塔の裏側に植樹してもらうことにし\nました。かつてこの場所はトドマツを植樹しまし シラカンバは温帯から亜寒帯\nたが、乾燥地のため育ちませんでした。このため 地方に多く見られるカバノキ科\nの植物で、落葉樹の一種です。\nシラカンバなら土地を選ばないだろうと､1,500本\n樹皮が白いことからこの名がつ\nのシラカンバの苗を緑小学校の高学年の児童も参\nけられたようです。現在目にす\n加し植樹しました。これが順洲に育ったこともあ\nる植物関連の本のほとんどは、\nり、シラカンバが見直されたのも選定理由のひと 白樺のことを「シラカバ」では\nつでした。 なく「シラカンバ」と呼ぶのが\n標準的になっています。なぜこ\nれだけこだわって「カンパ」と\n呼ぶのでしょうか。\nシラカンバとは樹皮の白い｢カ\nンパ」です。それでは「カンパ」\nとは何かというと、アイヌ語で\nサクラの木の皮のことを「力リ\nンパ」(ka｢impa)と言い､この力\nリンパが「か|こは」となり「カ\nバ」に転じましたが、古来アイ\nヌの人々はサクラと力バノキ属\nの樹皮を同類として扱ったと考\nえられます。\n●植\n物\n3．街路樹\n小樽市内各路線の街路樹には高木の広葉樹、針\n葉樹、低木の広葉樹、針葉樹があります。\nその種類は高木で約30種以上、低木で約20種以\n上です。現在、一番多い樹種は高木広葉樹のナナ\nカマドで、千秋通りや臨港道路の街路樹はナナカ\nマドで彩られています。市内ではプラタナスもよ\nく目にしますが、管理の わたり、市民が参加しました。 ､“1，，函,脳鋤\"_ m \"1,\n堺町地区\n小樽を代表する景観は運河周辺に集約されがち\nですが、各地区の八景を見ると小樽がいかに魅力\n的なまちであるかが実感できます。それぞれの地\n区で景観の特性が違うことが分かります。地域の\n｛|占|性や魅力を知ることが、まちに愛着や誇りを持\nつことにつながるのです。\n▲？ 瀦 聡 一》一一． 要翫忌 堪患零》 声 口ｒ\n野\n“津凸箪→竿、Ｊケや α蕊雲一、\n●景\n観\n■各地区の特徴\nく中央地区＞\n|日手宮線\n港から山に向かって放射状に街が広がる景色は、\n古代ローマなどの野外劇場をイメージさせます。\n坂道や丘から市街地を見渡すことが出来るため、\n[|々のくらしの中で、まち全体の四季の移るいや\n表情を知ることが出来ます。運河周辺では歴史的\n建造物が保全され、新旧調和のとれた町並みづく\nりが進められています。\n祝津地区\nZ刀"}, {"page": 172, "file": 2, "pdf_page": 58, "text": "＜桜・朝里地区＞\n早くから土地区画整理事業により、良好な住宅地として発展し、近年は望洋パー\nクタウンの大規模開発などにより、朝里川を挟む丘陵沿いに住宅地が広がっていま\nす。海水浴場、朝里川温泉、スキー場、オタルナイ湖などにより、レクリエーショ\nンやリゾート地のための整備がすすみ、また、国道5号沿いには郊外型物販店が増\nえています。\n＜張碓地区＞\n断崖の海岸線と､三方を山に囲まれた沢沿いに街が形成されています｡市の烏のア\nオバトが恵比須島に飛来することでも知られ､美しい自然景観が特徴です｡上空を横\n断する張碓大橋がランドマーク（目印)となっています｡断崖ごしに海岸線や海を見渡\nせることなどから､住宅地の中にホテルなどのリゾート施設が建築されています。\n＜銭函地区＞\n札幌市に近接し、平坦地に富み、工業・住宅地として開発が進んでいます。JR線\nより山側及び桂岡方面は斜面に市街地が広がり、そこからは石狩湾新港までの約10\nkmにわたる砂浜の海岸線が見渡せます。また、北海道薬科大学や公営住宅などが町\n並みの中でランドマークとなっています。\n＜祝津・高島地区＞\n古くから漁業で開け、小樽の主要な水産基地として栄えてきました。変化に富ん\nひよりやま\nだ海岸線沿いには鰊番屋などの歴史的建造物も点在し、高島岬や日和山灯台がラン\nドマークとなっています｡水族館や祝津マリーナがあり､観光・海洋レクリエーショ\nンゾーンとなっています。また、丘陵には大規模な住宅団地が開発されています。\n●景\n観\n＜オタモイ･赤岩地区＞\n赤岩・オタモイ海岸は国定公園に指定されており、奇岩や絶壁など勇壮な海岸線\nをフェリーや遊覧船から見ることができます。オタモイから祝津までの自然探勝路\nからは積丹方面も望めます。また、四季折々の表情を身近に見ることが出来る赤岩\n山の南斜面には住宅地が広がり、高台からは遠く札幌方向も見渡せます。\n＜桃内・塩谷地区＞\n丸山のふもとの山あいを抜ける農道沿いには、畑や果樹園が連なり、自然が豊か\nな田園風景が広がっています。また、フルーツ街道からは緑に囲まれたゴロダの丘\nと、砂鉄の黒い砂浜で知られる塩谷の湾を見渡せます。国道5号沿いには工場など\nがあり、両側の斜面には住宅が建ち並んでいます。\nIZ2"}, {"page": 173, "file": 2, "pdf_page": 59, "text": "＜藺島・忍路地区＞\n岬の緑と入り江の水面の色を刻々と変化させる夕日が美しい忍路湾と、夏場に道\n内有数の賑わいを見せる藺島海水浴場で知られています。農道沿いには田園的な自\n然景観が広がり、また、忍路環状列石などの史跡があり、多くの埋蔵文化財が発掘\nされ、古代の歴史を感じさせる地区でもあります。\n●小樽運河と歴史的まちなみ ●張碓トンネルからの小樽港\n●栗林と桜の手宮公園 ●銀鱗荘と平磯岬\n●海からの街なみと山なみ ●桜ロータリーと熊碓神社\n●坂の街の船見坂 ●望洋台から望む朝里のまちと海\n即央地区 ●小樽公園の春夏秋冬 桜・朝里地区 ●朝里川温泉郷とスキー場\n●旭屏望台からのまちと港 ●オタルナイ湖とループ橋\n●奥沢水源地緑映 ●紅葉の朝里峠\n●天狗山スキー場からの増毛連山 ●毛無山からの雄大な眺望\n●張碓カムイコタンの断崖 ●薬科大から望む石狩湾\n●春香山スキー場からの眺望 ●十万坪線の桂並木\n●アオバト飛来の恵比須島 ●開拓時をしのぶ銭函駅と豊足神社\n●義経トンネルと煉瓦の橋 ●赤別荘と御膳水\n張碓地区 ●緑につつまれた張碓のまち 銭函地区 ●銭函前浜の漁\n●景勝園眼下の海 ●ハマナス咲く10キロメートルの砂浜\n●張碓川とアーチ橋 ●銭函天狗の遠望\n●八眺山からの眺望 ●広大な工業地と石狩湾新港\n●江差追分碑からの海・崖 灯台 ●積丹へ続くオタモイ海岸\n●下赤岩山からの日本海 ●海から望む奇岩断崖\n●赤い岩の断崖 ●龍照寺から望む青い海\n祝津・高島地区 ● ● 祝 に 津 し 漁 ん 港 番 と 屋 マ の リ ま ー ち ナ なみ オタモイ･赤岩地区 ● ● 山 オ 中 タ 海 モ 岸 イの唐門\n●豊井浜から望む高島岬 ●小樽海岸自然探勝路\n●弁天島と高島漁港 ●赤岩山からの眺望\n●越後踊りと高島神社 ●赤岩のロッククライミング\n●丸山からの360度眺望 ●夕日が映える忍路湾\n●フルーツ街道からのポンマイ岬 ●竜ヶ崎と力ブト岩\n●文庫歌から望む岬のつらなり ●緑と古木に囲まれた忍路神社\n●伊藤整文学碑とゴロダの丘 ●忍路から望む桃岩・塩谷海岸\n●黒い砂浜から望む積丹半島 ●忍路のストーンサークル群\n●塩谷漁港から望む丸山 ●蘭島海水浴場\n●海から望む窓岩 ●蘭島海岸から望むフゴッペ岬\n●桃岩と桃内海岸 ●フルーツ街道ぞいの田園風景\n●景\n観 桃内・塩谷地区 蘭島・忍路地区\n■参考資料『小樽八区八景ガイドマツヌ』小樽市建設部まちづくり推進室まちづくり推進課\n’\n'2．小樽市都市景観賞\nこの賞は、小樽の歴史と風土に調和した都市景観をつくり出している建築物や活\n動などを表彰することにより、都市環境の向上と市民のまちづくりへの理解を深め\nてもらうことを目的として、昭和63(1988)年度に設けられました。\n建築家、都市計画家、画家などの学識経験者や市民の代表者からなる「小樽の歴\n史と自然を生かしたまちづくり景観審議会」の中で、現地審査やスライド審査を実\n施し、議論を重ね、かつ慎重に選考が行われています。\n小樽市の都市景観行政への取り組みの開始は、小樽運河の半分を埋立てが行われ\nた昭和58(1983)年のことで、「小樽市歴史的建造物及び景観地区保全条例｣が制定さ\nZだ"}, {"page": 174, "file": 2, "pdf_page": 60, "text": "れました。平成19 (2007)年度までの受賞者は表の通りです。\n（平成20年度以降は小樽市のホームページ参照）\n建築物 同 左 工作物\n回 年度 受 賞 物 件 名 (歴建） (新設） 広場 イベント 個人団体\n小樽運河工藝館 ○\n北一硝子三号館\n(株)丸市 後藤商店 1\n○’○\nS63\n小樽運河散策路 ○\nおたる潮まつり ○\n田中酒造店 ○\n北海道船員保険健康福祉センター(マリンヒルホテル小樽） ○\nポートフェスティバル・イン・オタル\n北海製罐(株)小樽工場・倉庫\n出抜小路と臨港線を結ぶ石畳空間\nオタル・サマーフェスティバル\n札幌日産モーター(株)小樽支店\n小樽開発ビルA棟\n海猫屋\n夢二亭\n商家茶屋 さかい家\n駒木邸\n小樽港マリーナ\n小樽開発ビル(クリスタルコート)アトリウム\n小樽郵便局プレハブ仮庁舎と仮囲いの歴建イラスト\nカジュアルレストラン 楽\n岩永時計店\n２ H元\n○\n（）\nH2 ○ ３\n○\n○’○\n4 H3\n○’○’○\nＱ’’○\n○ 岡凸具 H4\n○\n○’○’’○\n6 H5 北海道中央バス第2ピル屋上広告物撤去 ○\n銀鱗荘\nふれあいの泉 ○\n小樽郵便局 ○’○｜梱一○’○\n小樽米穀(株)社屋\n7 H6 小樽オルゴール堂の一連の施設 ※（○）\n角磯ハブタイ屋本店と庭園\nユーラシア404\n立正佼成会小樽教会 ○’○一○一’’○’○’’’\n○一○\n小樽ビールとびっくりドンキー小樽運河店\n8 H7\n舎こんどう\nオタルナイ湖周辺とループ橋\n郷土料理 群来陣\nペテルブルグ美術館\n砂留トンネルの壁面レリーフ\nホテルノルド小樽\nオーベルジュ・セ・ラ・セゾン\n|日青山別邸\n田中酒造(株)見学製造場 亀甲蔵\n’１\n‐’\n●景\n観\n○’’’’’○\n9 H8\n○’○’’一○’○’’○一○’○’’○’’○一一一一○\n10 H9\nハローワーク小樽公共職業安定所\n北の誉酒造(株)酒泉館\nオーセントホテル小樽\nパネカチョの花のカフェテラス\n11 H10\n塔のある小樽洋菓子舗ルタオ\n北海道立地下\nJR小樽駅 ○\nマイカル小樽\n12 H11\n運河公園 ○\nメルヘン交差点まちづくり景観協議会の一連の活動 ○\n小樽雪あかりの路\n小樽警察署\n日藤メモリアルガーデン\n(株)日 とりに鮭漁を業とす\nるアイヌの人たちの集落がありましたが、鮭漁の不漁が続いたため、鰊漁の中心が\nクッタルウシ（イタドリの多い所：現在の堺町郵便局付近）に移ったためオタルナ\nイのアイヌをクッタルウシに移住させたのでクッタルウシをオタルナイと呼ぶよう\nになりました。\nこの時以来､近隣の石狩､高島､祝津場所などと区別するためオコバチ川(妙見川）\nからオタルナイ川(銭函)までの4里32丁を総称して「オタルナイ場所」としました。\n明治2（1869)年、蝦夷を北海道と改称し、オタルナイを小樽に改めたのは松浦武\n四郎の発案だと伝えられています。\n177"}, {"page": 178, "file": 2, "pdf_page": 65, "text": "＜高 島＞\n原名はタカシュマ。タカは烏の膳シュマはアイヌ語の岩で、タカに似た岩があっ\nかやしば\nたためと伝えられています｡｢茅柴岬そばの二つ岩付近に沖合いから見てタカに似た\n岩があった。明治20(1887)年頃、この付近に漁舎を建てるため岩を壊してしまった\nが、岩の一部で元の形を刻み、岬の祠にまつった｣という説もあるようです。\n●市\n域\n＜銭 函＞\n町名の由来には3つの説がありますが定かではありません。\n①豊漁説\n明治初期、鰊の豊漁で漁場の収入は莫大でした。どこの漁場へいっても銭の函\nが積まれていたから。\n②運上金免除説\n漁場収入が莫大であったにも関わらず、場所制度の税金にあたる運上金が免除\nされていました。そのため､あちこちの漁師の家には銭の函が積まれていたから。\n③海岸の潮流説\n海岸に潮流の関係で石炭が流れつき、付近の住民はこれを拾い冬を過ごした。\nまた難破船やいろいろなものが流れつき、ドル函のような海岸なので銭函となった。\n＜山田町＞\n江戸時代末期に和人が勝納川両岸に定住するようになり、やがて明治になると街\nは次第に広がりを見せてきました。まず入船川尻さらにオコバチ川(妙見川)周辺に\n集まってきましたが、入船川とオコバチ川との間の道は水天宮の丘の下の波打ち際\nの道路しかなく、海が荒れると通ることができませんでした。\nやまだきちべえ\nそこでこの間をいつでも安全に通れる道路を地主の山田吉兵衛が自費で作ること\nを計画しました。そして明治15(1882)年からほぼ1年かけて完成させました。明治\n19(1886)年この道路の両側を「山田町」と命名されました。その後山田吉兵衛は小\n樽区長になりました。小樽経済の基礎や都市基盤を整備した功労者としても有名です。\n＜花園町＞\n小樽市街の繁栄が北に移り始めた明治17(1884)年、花園町が誕生しました。当時\nの区域は天狗山山麓までの広範囲なものでした。町名の由来ははっきりとしていま\nせんが、「京都・花園の妙心寺が浮世通りに説教所を構えていたところから花園町の\n町名になった」という説があります。\n町名ではありませんが、市内には京都文化を匂わせる地名があります。北山、東\n山、嵐山・・・・都へのあこがれでしょうか。\nZ沼"}, {"page": 179, "file": 2, "pdf_page": 66, "text": "＜勝納町＞\n信香11I].とともに明治3 (1870)年、開拓使より命\n名された小樽最古の町名です。大正4(1915)年の\n町名改正でも区域町名とも存続した町です(昭和\n42(1967)年には再編された)｡原名はアイヌ語のアッ\nチナイ(水源の豊かな沢)を和人がなまってカッチ\nナイ、カツナイとなったと伝えられています。\n●市\n域\n二二穿一\n山田町\nこのように小樽の町名にはいろいろな歴史や言\nい伝えがあり、興味はつきません。今自分が立っ\nている場所は当時、どんなところだったのでしょ\nうか。町名や地名からはいろいろな話題を発見で\nきます。\n銭函海岸\n一\n勝納\n,参考資料｜\n『小樽町名の由来』 河村礼三\n昭和57年\n｢小樽の町名」『北海道新間』\n昭和53年8月1日～\n昭和54年3月31日連載\n河村礼三著\n『角川日本地図大辞典』\n北海道上下巻 編纂委員会編\n角川書店 昭和62年\n179"}, {"page": 180, "file": 2, "pdf_page": 67, "text": "。\n●国際交流\n己\nー\nナホトカ市\n文化や経済などの交流を通じて相互理解と友好\n親善を深めるため、小樽市では現在3都市と姉妹\n都市の提携をしています。\n'1．ナホトカ市(昭和41(1966)年9月､姉妹都市提携）\nナホトカ市\n小樽市とナホトカ市は、日本海を隔て相対する\n貿易港を持つ間柄であることから、対岸貿易の振\n興を図るとともに両市の経済的・文化的交流を通\nじて日ソ両国間の友好親善に貢献するため、当時\nあだちよ ごろう\nの安達与五郎市長がソ連を訪lhlの途中にナホトカ\n市を訪れた際 姉妹都市の調印を行いました。\n人口約17万5千人のナホトカ市は、小樽市から\nナホトカでの交流\n696kmの距離にあります｡日本海に面した港湾都市\nで、極東における漁業や海運の中心地として発展\nしてきた都市です。効率的な貨物輸送を行う目的\nで､1970年代前半にナホトカ港の束に新港(ボストー\nチヌイ)が建設され､1990年にはナホトカを含む地\n\"\n域が自由経済特区として指定されました。1967年 財凌\nから1993年まで日本領事館も開設されていました。\n妬\nI\n2.ダニーデン市(昭和55(1980)年7月25日姉妹都市提携）\n小樽市は昭和41(1966)年5月にラム・マト ンの\n輪入港の指定を受けて以来、ニュージーラン ドと\nダニーデン市\n深い関わりがありました。そのため、人口、 町並\nZ8(ノ"}, {"page": 181, "file": 2, "pdf_page": 68, "text": "み､歴史性など小樽にふさわしいニュージーランド\nの都市と姉妹都市提携を結び、相互の友好親善を\n深め、両市関係の発展に寄与したいと考えていた\nおり、駐日ニュージーランド大使館からダニーデ\nン市の紹介を受け､昭和55(1980)年7月､スケッグ\nス市長来榑時に姉妹都市の調印を行いました。\nダニーデン市は小樽のはるか彼方10, 320km､ニュー\nジーランド南島の南東岸オタゴ湾の最深部に位置\nしています。オークランド、ウェリントン、クラ\nイストチャーチ、ハミルトンに次ぐニュージーラ\nンドで5番目の人口(約11万人)を有し、ビクトリ\nア様式の建造物が多いことで知られています。19\n世紀の中頃にスコットランドからの移民によって\n建設されたことから、今でも「南海のエジンバラ」\nと称される都市です｡また､ダニーデン市にはニュー\nジーランド最古の大学であるオタゴ大学があり、\n伝統ある学園都市としても有名です。オクタゴン\nと呼ばれる八角形の広場を中心に整然とした町並\nみが特徴で、起伏の多い地形、港や歴史などが小\n樽とよく似ています｡1998年に開基150周年を迎え\nました。\nロロロ印一コニロロ宮口詞‐Ｊｆ凸\n』\n１\n。\n二\n１\n蝋陶賎\nＬ口褥１\n△\n胸\n〕△一・軒\n叩も‐、伽Ｉ\n・曲．\n型■\nハ声\nゞ守。小\n：\n■一《\nｌｌ１ＩｏＯｌ可Ｌ０\n卜\n1\n卜\n可，､』調\nⅡ &、雨息“！‘\nW''\n噺\nｆｉ・ｍｍＭ\n１１\n●国際交流 毎 司 舸貯画Ｉ\n虫、\nダニーデン市\n’ 36 ソウル特月！U市江西(カンソ)区\n(平成22(201 0|)年7月22日 姉妹都市提携）\n小樽市とソウル特別市江西区とは1988年ころに、\n小樽の自動車学校が日本の指定自動車教習所制度\nなどを教えたことがきっかけとなり、次第に市民、 ソウル特別市 江西(カンソ)区\n民間交流が広がりを見せ、両都市において民間交\n皇Eﾄ早人|智玉目豆弄日普曽舛\n流協会が設立されました。平成18 (2006)年に両協\n小樽市青少年交流団歓迎式\n会の友好交流協定が結ばれ、平成21 (2009)年に、\n､ !\"竺7(’1魚 具矧皇哩一一一鯉\n小樽市において友好都市の調印が行なわれました。\nその後、友好団体やスポーツ分野でのさらなる交\n流の深まりを踏まえ、平成22 (2010)年7月22日小\n樽市において姉妹都市の調印が行なわれました。\n韓国の首都ソウルにある25の自治区のうち、江\n侭》Ｆ謬心“Ｉ\nＩ\n勺〃ｗ男\nI8Z"}, {"page": 182, "file": 2, "pdf_page": 69, "text": "西区は南西部に位置し、人口は約58万人。区内に\nは、金浦(キムポ)'韮'際空港があり、交通網が発達\nしていることから、匡|内外の物流拠点ともなって\nいるほか、朝鮮時代の遺跡、寺院や建物など多く\nの文化遺産を有する歴史あるまちです。\n●国際交流\n4．外国人入込客数\n平成24(2012)年度 北海道経済部観光局の観光\n客入込客数データによると、小樽市での外国人宿\n泊客数は年間で45,491人｡|王|別の多い順では香港、\n韓国 台湾、中国、シンガポールとなっています。\nちなみに、後志全体では年間で191,593人。国別で\nは香港、台湾、オーストラリア、韓国、シンガポー\nルの順となってい 、近代以降に商\n店街、百貨店、スーパー、モールなどのさまざま\nな形態が登場し、それぞれの特徴をもって営業し\nています。\n■市 場\n入船市場\n◎南樽市場（南小樽市場協同組合）\nIIW和21 (1946)年、樺太からの引揚者らが勝納川\n沿いに長屋の店を開いたのがはじまりです。鮮\n魚店9店、青果店4店、精肉店2店、海産物・食\n料品雑貨・惣菜・ベーカリー・寿司・金物など\nの店が揃っています。\n◎新南樽市場（丸市新南榑市場協同組合）\nマイカルの築港地区進出にともない､平成11(1999）\n年9月にオープンした小樽で最も新しい市場で\n185"}, {"page": 186, "file": 2, "pdf_page": 74, "text": "●市場と商店街\nす。鮮魚・青果・薬・惣菜・漬物 食堂・ばん i藥饗\nじゆうなど25店が営業しています。 広い駐車場\nが完備されています。\n◎入船市場（入船市場組合）\n大正時代に、繊維問屋が軒を並べる地区にでき\nた市場です。鮮魚店が充実しています。\n一や一\n妙見市場\n◎妙見市場（妙見市場商業協同組合）\nお こ ばち\n戦後、樺太や満州からの引揚者が於古発川の川\nくりに露店を開いたのがはじまりです｡その後\n川の上に丸太を渡して建物が建てられたりし、\n昭和37(1962)年の洪水で流されたものの､小樽市\n営市場として再建され､現在の姿になっています。\n三角市場\n◎三角市場（小樽駅前市場協同組合）\n昭和30 (1955)年頃、手宮の朝市や漁場から仕入\nれた行商の人たち(ガンガン部隊)が集まって、\n次第に商店化をしてきました｡海産物が中心で、\n観光客にも人気があります。\n中央市場(小樽中央市場協同組合）\n◎中央市場（小樽中央市場協同組合）\n昭和21(1946)年、外地からの引揚者が、現在地\nでバラックの仮店舗による営業をおこなったの\nがはじまりです。同31(1956)年にコンクリーi、\n3階建てになって､市民からは下駄履き'|丁場とし\nて親しまれています。\n中央卸市場(小樽中央卸商業協同組合）\n◎中央卸市場（小樽中央卸商業協同組合）\n樺太からの引揚者が店を開き、昭和22(1947)年\nに42店舗からはじまりました。小樽駅に近かっ\nたことから、行商(ガンガン部隊)はここから仕\n入れてきました。同32(1957)年に現在のコンク\nリート4階建てになっています。\n手宮市場\nZ86"}, {"page": 187, "file": 2, "pdf_page": 75, "text": "●市場と商店街\n◎手宮市場（小樽丸共手宮市場商業協同組合）\n大正6（1917)年に開設された小樽でも古い市場\nです。中には大正時代から営業している老舗の\n鮮魚店もあります。建物は平成6（1994)年に改\n築されました。\nりんゆう\n◎鱗友朝市（小樽鱗友商業協同組合）\nーご重言ﾐﾐこ=皇\n早朝3時から営業している小樽唯一の朝｢|jです。\n近くの公設卸売市場で競り落とされたばかりの\n商品がいち早く並びます。平成16 (2004)年に現\n在の鉄筋造平屋の建物になっています。\n一一\n！\n■商店街\n鱗友朝市\n◎都通り（小樽都通り商店街振興組合）\n通称「電気館通り」として賑わい、同10 (1921)\nとうでんかい\n年には「稲電会」として発足し、昭和6（1931）\n年から「都通り」と呼ばれるようになりました。\n｜司41(1966)年にアーケードが整備されました。\n＃\nI\n由り 」\n◎サンモール\n都通り\n（小樽サンモールー番街商店街振興組合）\n昭和17(1942)年に｢稲穂銀座商店街｣として組合\nが発足し、平成2 (1990)年にアーケードが整備\nされ、「サンモールー番街｣と呼ばれるようになっ\nています。丸井今井・大国屋・ニューギンザと\nいった小樽三大百貨店に|丼|まれていましたが、\n最後の丸井が同17(2005)年に撤退しています。\nサンモール\n◎花銀（小樽花園銀座商店街振興組合）\n昭和42(1967)年に組合が結成されました。小樽\nの新倉屋､かま栄などの有名店の本店が並び｢本\n店通り」という異名もあります。夜の歓楽街と\nも接し、昼夜の賑わいはとぎれません。\n花 銀\n187"}, {"page": 188, "file": 2, "pdf_page": 76, "text": "●市場と商店街\n‐や7よ刀ﾕわ\n◎梁川通り（小樽都通り梁川商店街振興組合）\n大正7（1918)年に「梁川親睦会」として発足し\nえのもとたけあき\nました。この地区は当時、榎本武揚が所有して\nりょうせん\nおり、その号「梁川」から命名されました。縦\n通りには中央市場があり、商店街と市場とが共\n存する特徴があり、小樽では最もレトロ感覚豊\nかな通りです。\n梁川通り\n◎公園通り（小樽公園通り商店街振興組合）\n大正13(1924)年に「花園本町会」として発足し、\n昭和23(1948)年に「花園本通り商店街」として\n再生し、同39(1964)年に法人化しました。文字\n通り小樽公園と中心市街地を結び、老舗も軒を\n連ねています。\n◎花園中央（小樽花園中央商店街振興組合） 公園通り\n大正時代に「花園中央会」として発足し、昭和\n49(1974)年に「花園中央商店街振興組合」とし\n寵\nて法人化されました。明治44(1911)年創業の陶 n曲\n』\n器店、大正9（192())年創業の生花店や履物店、 耐珊榊“\nE\n聯\n昭和初期から続く文具店などの老舗も集まって ■\n。 21 寺\nいます。\n.I\n-･一己公\n菱\n'1\nほくもん\n◎北門（小樽花園北門商店街振興組合）\n花園中央\n戦前は「北門町会」と称していましたが、昭和\n23(1948)年に「北門通り商店街」と再編成し、\n平成7（1995)年に「小樽花園北門商店街振興組 \\\n樋\n合」として法人化されました。官庁（小樽市役\nながくらしんばち\n所）や歓楽街と接し、新撰組の永倉新八ゆかり\nの立札もあります。\n■\n１０\n壬\n繁り\n◎入船銀座（小樽入船銀座商店街振興組合）\n昭和のはじめに親睦団体「大交会」として発足 北門\nし､昭和24(1949)年に｢入船商店会｣､|司29(1954）\n年に「入船銀座街｣、|1149 (1974)年に「小樽入船\n銀座商店街振興組合｣として法人化されました。\n188"}, {"page": 189, "file": 2, "pdf_page": 77, "text": "●市場と商店街\n老舗の蒲鉾店や天ぷら店や質屋に畳店などがあ\n畑\nります。 『ｉ\n;鞆\"雲\nジアー\n湧一具 二二三一二‐\n◎稲穂大通り（稲穂大通り商店会）\n明治から大正には色内が繁華街でしたが、昭和 1181Ⅱ\nに入ってから稲穂・花園が中心 ｢|丁街地になって\nきた||寺に､この通りも賑やかになってきました。\n北洋銀行、北海道銀行、札'l'晃銀行、北陸銀行、 稲穂大通り\n北海信金という金融機関が密集しています。\n◎稲穂本通り（稲穂本通り会商店会）\n昭和30年代までは容器・海産物・藁・印刷など\nの加工業が立地していましたが、名店街が誕生\nしてからは、物販というより、美容、理容、不\n動産、飲食、ホール、クリーニングなど近隣市\n民の生活サービス業が集まるようになりました。\n◎花銀3丁目（花園銀座3丁目会商店会）\n甑￥\n明治末期に「親栄会」として組織されたことが\n第一ビル\nはじまりです。昭和中期には映画館が密集して\nいました｡現在は飲食店が中心になっています。\n◎花園大通り（花園大通り商店会）\n昭和10 (1935)年頃に商店会として発足しました。\n病院やサービス業などがあります。 戯古角\n◎第一ビル（駅前第一ビル商店会）\n昭和40～50 (1965～75)年にかけて再開発された\n3つのビルのうちの1つです。小樽駅に最も近\nい商店会です。\n画討\n長崎屋とサンポート\n◎サンポート（サンポート事業協同組合）\n駅前再開発を期に長崎屋出店とともに集約され\nた組織で､平成13 (2001)年に法人化されました。\n189"}, {"page": 190, "file": 2, "pdf_page": 78, "text": "●市場と商店街\n小樽商工会議所1次｡2次産業振興プロジェクト ’\n平成23年1月から、小樽商工会議所は人II減少に歯止めをかけるとともに地域経\n済活性化のため1次．2次産業 観光、港湾、商業の4つのプロジェクトを立ち上\nげました。このうち1次．2次産業振興プロジェクトでは付力|l価値の高い食品や力|｜\n工品の開発を目指し、農業と水産業の2分野で商品開発を行い生産者と力||工業者、\n販売者を一体化させた新たな取り組みとして注目されています。\n小樽をイメージする一つのブランドを複数の企業で育てる仕組みはこれまで市内にな\nかった試みです。小樽観光のおみやげとしても、今後の広がりに期待されています。\n■小樽美人\n農業分野の第1弾として未利川果実飲料開発事\n業委員会の女性メンバーが中心となり、商品企画\nからパッケージデザインまで手掛けました。余市\n|||]産、仁木町産の梅100%の梅酒にヒアルロン酸、\nコラーゲン、ビタミンC、アロニア果汁を添加し\nた梅酒「小樽美人」が開発され発売されました。\nその後､小樽美人ブランドとして､余市IIII産プルー\nン酒、仁木IIII産ブルーベリー酒、余市・仁木産ア\nロニア酒、余市産桃酒も発売されています。\nｊ〃″且■ＨＩＩｆｌ００Ｉ\n〉\n■■■句\n勧醗…農Ⅸ\n謹\n働俳俺唾 ▼■鼻？\n臼\n甘『■\n、．\n小樽美人\n■にしん小樽漬\n職\n水産分野では、小樽の歴史と関わりのある鰊の\n加工品を開発することになりました。函館の松前\n漬のような地域ブランドに育つことを願い、「にし\nん小樽漬」とネーミングされました。\n開発に向けてはルールづくりが行われました。\nＯ Ｔ\nＮＡ ＳＲ ＨＵ\nＺ\nＮＵ\nＫ Ｅ\n開発に向けてはルールづくりが行われました。 にしん小樽漬\nコンセプトは水産加工業者だけでなく飲食店でも作れるようにすることです\nそのルールは①北海道産の鰊を使うこと。②数の子、昆布を使うこと。③鰊商品\nを強調するため鰊を販売容量の40%以上入れ､醤油ベースであること。④他の具材、\n味付けは各社独自の製法とする。これらの基準に従った製品には統一のロゴマーク\nが貼られています。現在、市内の水産力||工業者や飲食店が製品として、またお店の\nメニューとして展開しています。\nこのような開発プロジェクトは経済の活性化のみならず、小樽ブランドとして観\n光にも大きく貢献していくことが期待されています。\n190"}, {"page": 191, "file": 2, "pdf_page": 80, "text": "●祭りとイベント\n■祭りとイベント\n小樽には、20を超す、たくさんの神社があります。それぞれの神社は、創建以来、\n祭りなどを通じて常に地域社会と関わり、今口に至っています。\n北海道の神社は、主に海岸部の漁業や交易の守護としてまつられたお宮と、開拓\nとその後の農業林業の守護としてまつられたお宮に大別されます。小樽の神社も忍\n路場所請負人 西川伝右衛門が漁業の守護として創建した忍路神社や移民の守護と\nして榎本武場が創建した龍宮神社などがあります。\n各神社には例祭日があり、地域に根ざした祭りが毎年行なわれています。5月か\nら7月にかけて各神社の祭りが集中し、小樽はお嗽子がいつも聞こえる季節を迎え\nます。また小樽には潮まつりに代表される観光祭りをはじめ、季節や地域ごとにた\nくさんのイベントが毎年行われます。\n■小樽市内のおもなお祭り日程\n祭 典 名 開催場所 お問い合わせ\n招 魂 祭 花園5丁目(小樽公園） 0134-22-1704\n不 動 院 奥沢3丁目17-10 01 34-22-7839\n潮 見 ケ 岡 神 社 若竹町1-10 0134-22-8230\n張 碓 稲 荷 神 社 舂香町291 01 34-22-7984(天満宮）\n小 樽 稲 荷 神 社 末広町38-1 0134-22-2591\n水 天 宮 相生町3-1 01 34-22-3495\n藺 島 神 社 藺島1丁目3-26 0134-26-1383(塩谷神社）\n龍 宮 神 社 稲穂3丁目22-11 0134-22-4268\n惠 美 須 神 社 祝津3丁目161 0134-34-3480\n豊 足 神 社 銭函2丁目9-10 0134-62-2847\n熊 碓 神 社 桜5丁目26-10 0134-22-7984(天満宮）\n忍 路 神 社 忍路1丁目416 0134-64-2837(町内会長）\n高 島 稲 荷 神 社 高島3丁目14-1 0134-22-4318\n塩 谷 神 社 塩谷2丁目20-20 01 34-26-1 383\n住 吉 神 社 住ノ江2丁目5-1 01 34-23-0785\n天 満 宮 天神1丁目9-21 0134-22-7984\n朝 里 神 社 新光2丁目13-5 0134-22-7984(天満宮）\n日\n７ 月\n５\n５\n６\n６\n６\n６\n６\n６\n６\n６\n７\n７\n７\n７\n８\n８\n月\n月\n月\n月\n月\n月\n月\n月\n月\n月\n月\n月\n月\n月\n１\n月\n月\n０\n程\n月\n191"}, {"page": 192, "file": 2, "pdf_page": 81, "text": "●祭りとイベント\n小樽の夏・冬を彩る2大イベント\nおたる潮まつり\n■おたる潮まつり誕生の経緯\n昭和33(1958)年の北海道博覧会成功を機に、それまで実施されてきた「港まつり」\n（昭和25(1950)年から)、「競争花火大会｣(昭和28(1953)年から)、「北海道工業品共\n進会｣(昭和25 (1950年から)、「見本市」などを統合し「みなと小樽商工観光まつり」\nとして昭和34(1959)年よりIIW和41 (1966)年まで8 1''|開催されます。これが前身とな\nります。しかし「小樽の特徴が生かされていない」などの意見もあり、一般市民9\n人をメンバーとする企画小委員会を設けられ、構想を練り、今'二Iの「潮まつり」を\n提案する運びとなりました。そして昭和42（1967）年に第1回「おたる潮まつり」\nが第3埠頭で開催されました。\n会場は第2回からは小樽公園に移されましたが、昭和56(1981)年の第15回からは\n第3埠頭に戻り現在に至っています。\n毎年、市民及び札'幌'|丁など近隣市町村、さらに観光客などがたくさん訪れ、小樽\nの夏を代表するイベントとして定着しています。\n■タイトル「潮」について\n海に育ち、海に生きる小樽市民の燃えるような意気と気概を「潮」のしぶきのイ\nメージで表現したもので、動的な流れ、いわば躍進する郷士の明日のために考えつ\nいた名称です。\n■イベント概要\n・開催時期：7月後半の3日間開催。\n恵一\n一､ﾛ\n側\n噛エ 鞠嘩 一 一\n迫\n■ ｒ『 一■ 角型ＢＴ\n翻\n幣瀞旬鴎 輔‐岬 山恥Ｉ冊Ｄ野舎勾\nゴヶ巳\n蝉１懸．望守．\nリ\n可Ｌ 働働\n１１２２ 甲二匹 Ｌ\n』I 可\n詩\n矧一＝つゃ ､\n(劇\n醗\n~『\n192"}, {"page": 193, "file": 2, "pdf_page": 82, "text": "●祭りとイベント\n初日に「潮ふれこみ｣、2日目に「潮ねりこみ｣、\n一\n鰯\n最終日に漁船や屋形船による小樽港内パレード\nの「潮わたり」が行われます。また、大花火大\n会が行われます。\nこの祭りのメインイベントとも言えるのが「潮\nねりこみ」です。\n小樽市内外の企業や団体などでチームを結成し、\n市街地を「おたる潮音頭」「潮おどり唄」を踊り\nながら練り歩きます。中には「とびいりDE踊り\n隊」と呼ばれる申し込みなしでも参力llできる企\n画もあります。コースは花園グリーンロードか\nらメイン会場の第3埠頭まで。\nおたる潮音頭：作 詞／米谷 祐司\n作編lll1/春川 一夫\n歌 ／三波 春夫・\nテイチク男声コーラス\n潮おどり唄：作 詞／萩原 貢\n作編曲／川越 守\n歌 ／美幌 健\n参考資料 おたる潮まつり公式ホームページ\nhttp : //otaru.ushiomatsu｢ i・net/\n小樽雪あかりの路\n■イベント概要\n平平成成1111((11999999))年年22月月にに市民市有民志有に志よにりよ始りま始っまたった「小樽雪あかりの路」は、キャン\nドルの灯火が古い街並みを優しく照らす幻想的なイベントです。運河会場、旧手宮\n線会場をメイン会場に開催され、毎年多くの来場者を迎えます。夕暮れ時から辺り\nが真っ暗になる時間まで、その日の空の色や天候により、毎日違った表情を楽しめ\nます。運河の水面で瞬く古い漁具をモチーフにした浮き玉キャンドル、旧手宮線会\n場の柔らかな光がともるスノーキャンドル、オブジェなど、多くがボランティアの\n手作業によるものです。朝里川温泉会場や天狗山会場などの、あかりの路会場も人\n気があり、ろうそくの温かなあかりが来場者をもてなします。\n■「小樽雪あかりの路」の名前の由来\nこのイベントの名称は、小樽出身の作家、伊藤整(明治38(1905)年～昭和44(1969）\n年)の詩集『雪明りの路』の中の「雪夜」が由来となっています。\nあ〉 雪のあらしだ。\n193"}, {"page": 194, "file": 2, "pdf_page": 83, "text": "●祭りとイベント\n家々はその中に盲目になり 身を伏せて 埋もれてゐる。\nこの恐ろしい夜でも そっと窓の雪を叩いて外を覗いてごらん。\nあの吹雪が 木々に吃って 狂って 一しきり去った後を\n気づかれない様に覗いてごらん。\n雪明りだよ。\n案外に明るくて もう道なんか無くなってゐるが しづかな青い雪|ﾘ1りだよ。\n■イベントの原動力はボランティアスタッフ\nこのイベントは延べ2,000人を超えるボランティア・スタッフが支えているといっ\nても過言ではありません。厳しい寒さの中、イベント期間''1は毎日、一つひとつの\nキャンドルを設置し、火を灯し、消えるたびにまた一つひとつ手で灯していくので\nす。町内会、各種団体をはじめ、韓国・中国などの海外からのボランティアの地道\nな作業により「あったかさ」を演出しているのです。\n■おもな受賞歴\n・第10回ふるさとイベント大賞で、道内初の「総務大臣表彰」受賞（平成18年度）\n．第2回JTB交流文化賞「最優秀賞」受賞（平成19年1月）\n・平成16年度国土交通省主催「手づくり郷土賞」（地域活動部門）受賞\n･ 2003年(平成15年)度(社)||本青年会議所褒賞アワード最優秀賞受賞\n･ 2010年(平成22年)度国土交通省「地域づくり表彰」特別賞「日本政策投資銀行賞」\n受賞\n参考資料 小樽雪あかりの路公式ホームページ\nhttp://otaru.yukiakarinomichi.0｢9\n坐\n一Ｊ 卒一 や１Ｊ■■ｒ・日■ 室■睡雌\n■畢\n寺了 ８\n１\n画一■■\n４\n鑑■\n■ 一訳岬い価 鰹 ●\n■\nｌ\n函 錘 IM･!- E\n9\n息 ゞ戸\n.,P噌鐸毛坐\nj 【通’ j 【通’\n↑\n● G I\n．’｡？\n11\n、函｡､ 0\n● Q\n●\n194"}, {"page": 195, "file": 2, "pdf_page": 84, "text": "司\n司\nし\nニレロニ,,.肴、\nF▲\n●冬の暮らし\n唾\n,\nシ\n可且\n』 』\nd\nに．\nP L ■\n畷\nＩ紳一砂 軍Ｌ－ 鯉ｊ４Ｍ←酌\n▲垂\n‐巾山Ｉ‐１１１１\n癖 屋膳1\n’唾 蕊\n農\n》\n1\n→、、 Ⅵ『\n』一\n●\nb\n▲\n「\nイ\n八 角\n冬に雪のある暮らしは、私たちには当たり前ですが、 本州から来られる人には見\n慣れないもの、奇妙に見えるものがたくさんあります。 北海道独特の冬の暮らしに\n登場するものをおさらいしておきましょう。\n●北海道の住宅\n冬の寒さを防ぐため、近年の北海道の住宅は高断熱・高気密となっています。\nまた、効率の高いll愛房方式や換気技術により、快適な住宅となっており、冬の寒\nさを防ぐだけでなく、夏の暑さにも対処できる住宅となっています。\n屋根：トタン葺きの屋根が主流で、瓦屋根の家は、ほとんどありません。\n雪が落ちない平らな屋根もあります。\n窓 ：寒さを防ぐために、窓が二重になっています。硝子がペア硝子になってい\nるものもあります。\n煙突：最近のストーブは吸排気口が壁から出ており、強制排気をしています。煙\n突のある家は少なくなりました。\n玄関：硝子で囲った玄関フードが多く付いています。\n雨戸：北海道では雨戸のある家は、ほとんどありません。\n●灯油タンク\n灯油ストーブを使う家庭では家の外に大型の灯油タンクが設置されています。\n容量は200リットル以上のものが多く、北海道での灯油の消費量は、全国的にも非\n常に多いといわれています。\n●ママさんダンプ\nママさんが運転するダンプカーを連想する人が多いのですが、北海道での雪か\nきの道具のひとつです。大型の雪かきショベルのことで、別名スノーダンプとも\n呼ばれています。雪をたくさん載せて押しながら運びます。\n雪の多い小樽では雪かきは冬の大仕事です。普通のスコップなどでは、追いつ\nかないので、ママさんダンプが活躍します。\nﾉ95"}, {"page": 196, "file": 2, "pdf_page": 85, "text": "●室内温度\n北海道の冬の室内温度は本州の人にとって、必要以上に高い温度に感じている\nはずです。\n暖房を強くし、半袖でビールを飲む人もいるくらいです。寒さが厳しい分、屋\n内は暖房温度を高くしているのです。こたつのように部分的な暖房ではなく、室\n内全体を暖房するのが北海道の特徴です。\n●水道凍結注意放送\n冬、翌朝の気温がかなり下がると予想されるとき、夜間、テレビのCM時間帯\nに水道凍結注意や天気予報でも凍結注意がでるのは北海道独特の放送です。\n●冬 靴\n北海道では夏靴と冬靴を履き分けるのは当たり前です。これは凍結した路面で\nは冬用の滑らない靴でなければ歩けないからです。最近の靴底素材は凍結路面な\nどで滑るのを防ぐように加工されています。\nまた、車のワイパーも冬用があります。これは普通のワイパーより幅が広く、\n低温にも耐えられるゴム質で、雪を掻き分けることができるものです。北海道の\n冬にはこのワイパーは欠かせません。\n●砂 箱\n急勾配の道路端には砂袋が入った箱が設置されています。坂道で車がスリップ\nした際 道路に砂を撒いて発進できるようにするものです。\n●屋根の雪止め\n小樽では古い民家も多く残っていますが、その屋根には丸太や角材が組まれて\nいます。積もった雪が滑り落ちないようにするための「雪止め」です。トタン屋\n根の葺き方によっては金属製の雪止めもありますが、木材の雪止めは昔ながらの\n光景です。運河沿いの倉庫の屋根にも見られます。\n●小樽の冬の魚 八角\n昔は大衆魚でしたが、今では高級魚になってしまいました。小樽周辺では昔か\nらよく獲れていたのですが、一般に出回るようになったのは50年程前からで、か\nつては北海道では割とポピュラーな魚でした。\n八角は硬い皮を剥ぐと、とても艶やかでプリッとした白身が現れます。小樽の\n料理屋さんではこの獲れ立ての八角を姿造りにして出してくれる所もあります。\nちょっとグロテスクなこの魚の姿に観光客のみなさんはきっとビックリすること\nと思いますが、刺身を一度口にしてみるとコリッとした淡白で繊細な味に満足す\nるでしょう。刺身でよし、焼いてよし、「小樽の味」です。\n●冬の暮らし\nZ96"}, {"page": 197, "file": 2, "pdf_page": 86, "text": "、\n【コラムD\n｢竹輪の由来」\nヨ\nー\nニュロ\n昔は、大名、旗本しか食べら\n』 ､一一コ≦－－ I れないほど高級品だった蒲鉾も、\n江戸時代中期以降には、武士、\n商人、町人へと順次広まってい\n÷ 十 l ＋一 さまLノ／星o\n幕末になると下級武士は貧し\nくなり、旅先などでは蒲鉾が食\nべられなくなりました。\n一方、商人は金持ちになり、\n贄沢な食事をするまでになって\nいました。そんな商人たちを見\nて、「下級人の分際で､武士の魂\nである鉾を食べるとは、何ごと\nぞ」と嫌がらせを言う武士がい\nたのだそうです。\nそこで、庶民は、武士に気兼\nねして、蒲鉾と呼ばれていた竹\n輪の切り口が竹の様であるとこ\nろから、竹輪と書き、武士には\n解からない隠語として竹輪と名\nづけたようです。\n､\n里\nF･\n戸 二』、 ■ 坐 一\n●小樽の食文化 司\n司\n戸ざ\n二 Ｐ\n鐸需撚邦\n哩冒一《\n二一一｛\n４斑\nｈ\n酷毎\n戸\nかまぼこ\n小樽の代表的な食文化を伝えるとき、蒲鉾と菓\n子(餅類)があげられますが、これには歴史的背景\nがあります。\n●蒲 鉾\n「蒲鉾」が書物に登場したのは、室町時代中期\n頃からです。そのころの書物に「かまぼこは蒲の\n穂に、似せたる也」（｢宗吾大双紙｣）と書かれてあ\nるところから､岸辺に育つ蒲の穂に似ているので、\n｢蒲鉾｣と言う名がおこったのだといわれています。\n小樽のかまぼこ製造は明治24,25(1891,92)年\nI蝋 ．‐‐－ ー - ノ\n~ 一一／\nごろからはじまったと伝えられています。新潟県\nかれいわ\n人の曲岩という人が蒲鉾工場を設けて、新潟県人\nを招いて製造したのがはじまりといわれています。\n昭和33(1958)年、小樽には約920 (全業種)の工場がありましたが、このうち207が\n水産加工場でした。しかも水産加工生産量の約40%は蒲鉾で、他の加工品は魚体に\n簡単に手を加えたにすぎないもので、蒲鉾が工業製品といえるものでした。\n小樽で蒲鉾生産が盛んになったのは、前浜で漁獲される豊富な原料に恵まれたこ\nとと、恐らく過去の鰊力ll工で培われた高い加工技術によるものと思われます。||召和\n30 (1955)年から35 (1960)年が蒲鉾の街としてのピークでした。かつては40軒以上あ\nりましたが、小樽の人口減少衰退と期を一にして、蒲鉾業者も減少していき、現在\nでは10数軒となりました。しかし小樽の蒲鉾は、現在でもその加工技術と味は評価\nが高く蒲鉾の街としての誇りを感じさせてくれます。\n197"}, {"page": 198, "file": 2, "pdf_page": 87, "text": "●菓 子\n小樽の菓子業の発祥は『小樽経済産業史』（昭和\n24(1959)年)に｢|Ul治初年開|湯亭の上り坂三本木の\nそばに、餅屋開業されたるが菓子店の元祖とする\nという。即ち千秋庵、布袋屋布袋辰二郎である」\nと記されています。\n小樽は北海道開拓の道央の玄関口として本州各\n地から生活文化が入ってきました。経路が北前船\nの西l'lり航路であったことから、京阪・北陸・越\n'|」・越後などのn本海側の文化が主流となりまし\nた。当初は餅菓子が中心でした。港が栄えていた\n頃は荷揚げ作業には、おにぎりよりも保存が利く\n餅が船員に重宝されたようです。小樽に餅店や菓\n子店が多いのはこのような事情からと推測されま\nす。また、小樽は北海道雑穀の集散地という経済\n的、地理的好条件もあり、良質の北海道産原材料\nが豊富に得られたこと、日本海側から菓子職人が\n移住し、京阪地帯の菓子生産の伝統が小樽に定着\nしたことも菓子業が盛んになった要因のひとつで\nす。\n小樽の菓子が高い評価を受けたのは、職人の伝\n統的技術水準が高かったことと、これらの地理的\n条件によるものだといわれています。戦前の小樽\nは製菓生産高は全道最大で、製,l111は道内各地に出\n荷されていました。また、小樽で育った多くの菓\n子職人も全道各地に散っていきました。\n「花月堂」は嘉永4(1851)年に越後で創業、小樽\nでの開業は明治37 (1904)年。水晶あめ玉「澤の露」\nは明治44 (1911)年創業の澤崎衛生堂から生まれま\nした。\n小樽を代表する蒲鉾と菓子は調べていくと、エ\nピソードがたくさんありそうです。\n●小樽の食文化\n’\n、\n1\n㈱新倉屋\n1\nI:誹礎\n9 －\n－\n|｢ 一一\n｜\n－\n働警隠旋\n■\n‘”!”\n’｜圏兆'’一\nIF ｡il- ll･\nW|\n花月堂\niT輯\ni\n澤の露\n|参考資料｜\n『小樽市史 第5巻』\n小樽市 昭和56年\n『小樽市史 第10巻』社会経済編\n小樽市 平成12年\n｢橋本商会の背景」\nhttp : //www・su｢imi.c0．｣p\n｢かまぼこの歴史」\nhttp : //kamaboko.0｢.j p\n｢ちくわ風雲録」\nhttp : //yamasa・chikuwa.co.jp\n198"}, {"page": 199, "file": 2, "pdf_page": 88, "text": "仙 泗 F可\nぐ\n一 画 や － 一m\n~\n１４４』\n田中伝右衛門\nI iⅢ ■■ F一且 田中酒造店 〃，\nID\n●地\n酒\n勺丘bl 『 4\n」■ｂ\n'1 小樽の酒造史\n●\n■北海道\n北海道では明治初期には､ほとんど米がとれず、\nその米を原料にしてつくる清酒は本州からの移入\nに頼っていました。北海道最初の清酒造りは、慶 本間酒造部 Ⅷ 日本清酒\nし\n応2（1866）年に高島運上屋において、醸造され\nていた記録がありますが、米はもちろん、麹や雌\n造設備などすべてを移入しなければならず、品質\nは悪い上に量も少なく、本州産とは比べるべくも\nありませんでした。\nその後、各地で品質向上の努力がはらわれ、道\n産米も研究されていきます。 昭和5 (1930)年の全国酒類醤油品評会において、\n道内出品79点のうち49点が入賞し、受賞率は全国\n一にまでなりました。それは上質な水と貯蔵環境\nという天恵に加えて、道産の酒造米研究や杜氏の\n技術lhI上に向けた努力の成果といえます。\n心禰\n澗\n正\n一杏自いい団\n戸 一\n戸 ●\nL\n一\n笹丁ｑｊ甸\n● 烏や閏 伺▲矼４ ４吋Ｆ ｂ４① 内叩岳 且４・ 町昌上 騨０乳凸ウ ■、ク １Ｔ軸 Ｖ咽卜 ４。、\n】日本澗酒株式曾祉\n一一 一\n・ 毛・〆 和〆負 堅・廷 ．・‘ ・・ 需鹿配り\n日本清酒\n玉\n本間酒造部\nヒーニー写一一理＝一\ni酒清るたれさ化代時I\n遮の\n《医いお桝\n１\n１\n！\n管\n里”\nII\n■小 樽\n明治に入ってからは、小樽・岩内・古平・島牧\nなどで清酒の醸造が始まっていますが、これは北\n前船寄港地としての原材料調達の地の利によりま\nす。ただし零糸|||な｛li'il人商店であり、交通手段も未\n整備なため販路も限られていました。\n開拓が進むにつれ、商業によって本州産の酒を\nけ■むらα■ひ■■■ 寺■■舎口●ｐ ０。０●■ロｇ〆■ｇ。』■■』■\ni9\nj\nI\n／元衰貧画風\ni憶式鑓清爪日＝\n－ ~ 北の誉 日_本清一酒一一一一召\n『後志飲食物語』より\n199"}, {"page": 200, "file": 2, "pdf_page": 89, "text": "仕入れ全道に販売していく商人が台頭してきます。\n大家支店､板谷合名会社､宅合名会社などは､堺・\n雌・伏見・越後の酒の特約店となって独占販売し\nていきます。\n明治21(1888)年には小樽高島両郡酒造組合が創\n立されるほど増え、同27(1894)年には27カ所を数\nえるようになります。｜司36(1903)年には醸造戸数\n22戸、同38(1905)年の確造石高は23,209石で全道\n一、明治後期には小樽は北海道の主要酒造地の位\n置づけになりますが、大正7（1918)年には旭川・\n札|幌に抜かれ3位になってきます｡ただこの段|階で\nも、道産酒は全消費量の65％で、残りは移入でし\nた。販路は、道北各地や樺太にも及んでいます。\n大正4(1915)年の第2回北海道酒造組合連合会\nきちじろう\nの品評会では､小樽区の野口吉次郎の｢北の誉一号」\nが出品数341点の最高の優等賞を受賞しています。\n▲ ・石\n川．福井からも来道するようになりました。移住者は漁業を行うため海岸線沿いに\n定住していきました。このことから海岸部方言はおもに東北地方出身者によって形\n成され、北海道方言の基盤になりました。\n一方、内陸部の開発が本格化したのは明治2 (1869)年、開拓使が置かれてからで\nす。開拓使の拓殖計miにより、本州各県から移住民が大挙して来道しました。これ\nは北辺の防備と本州の生活困窮者救済、開墾が目的でした。海岸部は数百年の間に\n徐々に開拓されましたが、内陸はわずか数十年の間に急速に開拓されました。また\n移住者の多くは農民や士族であったことや出身地が全国におよんでいたこともあり、\n海岸部とは異なることばが使われていました。同郷人の多い所では出身地のことば\nが使われていましたが、入植者が増え出身地が混じったところではことばが通じな\nかったため、意思の疎通ができることばを求め合い共通語化され、残ったことばが\n内陸部方言となりました。出身地の方言を捨て去る言語生活の積み重ねで、内陸の\n方言は形成されていきました。\n●方\n言\n●小樽の方言\nこのように海岸部方言と内陸部方言では歴史的背景に違いがあります。海岸部方\n言は道南を中心に、’二|本海側・太平洋側・オホーツク海側の海岸部で使われている\n204"}, {"page": 205, "file": 2, "pdf_page": 94, "text": "方言です。さらに分類すると松前郡一帯の「松前方言」と松前を除く渡島、檜I11,\n後志地方の「道南方言｣、道南以外の「道東、道北、オホーツク沿岸方言」に分ける\nことができます。小樽は「道南方言」に属していますが、その色彩は薄まりつつあ\nる地域といえます。\n●発音のおもな特徴\n．「し」「す」「ち」と「つ」「じ」「ず」の区別がつきにくい。\n＜例＞ すす（寿司、獅子） つつ（土、父、乳） つず（知事、地|叉|）\n．「い」と「え」が温'司している。\n＜例＞ えだ（板、枝） えぎ（息、駅）\n．「\"、」と「せ」が混同している。\n＜例＞ へなか（背中） かせる、かへる（食わせる）\n●ことばの特徴\n．「ベ」で二つの意味を表す。\n＜例＞ 行くべ（行こう、行くだろう）\n．「ない」にあたるところは「ね」になる。\n＜例＞ 見ね（見ない） 知られ（知らない）\n・助詞「に」「\"、」「を」が「さ」になる。\n＜例＞ 船さ乗る（船に乗る） 店さ寄る（店に寄る）\n●方\n言\n●小樽でよく耳にするおもな方言\n．いやいや（やいや）\nあいづちに使います。「まあまあ」などあいまいな感じ。\n●いずい\n・ぃずい\n痛痒ぃこと。我慢できないほどではないが痛痒い状態。\n・おがる\nおもに植物が成長したときに使うが､こどもが成長したときにも使うことがある。\nおばんでした\nこんばんは。なぜか過去形です。\nがおる\n疲れ果てて死にそうになる。疲れるの最上級。\nがさい（がっさ）\n物の状態がわるいこと。ダサイに似ている。\nかつぱがす\nひっくり返す。 ●はかいく\n205"}, {"page": 206, "file": 2, "pdf_page": 95, "text": "きかない\n勝気なこと。気丈。\nしやっこい\n冷たい。\nちよす\n触る、いじる、ちょっかいを出す、からかう。\nっっぺ\nせん\n栓。「つっぺかう」（栓をしてふさぐ）\n●ゆるくない\nはかい<\nはかどる、作業が進む。\nまかす\n撒き散らすこと。\nまぶい '1ﾉ《4八 シゾー\nノ\n美しい、かっこいい。\nゆるくない\nつらい、難しい、大変。\n〈\n言〆E=\n’。１１Ｒｕ●Ⅱ０． 一〃ｉｕ\nID\nI\n一 ・毛毛二二ごr三三 ‐\n●まか\n坪二一\n－ す\n●方\n●方言は文化遺産\n北海道の方言、特に後志以南の海岸部方言はい\nわゆる「浜ことば」といわれ、|+|舎の人の使う「悪\nいことば」だと思っている人が多いのですが、こ\nれは間違った考えです。ことばには地理的分布が\nあり、分布範'11皇|の広いことばが通用範|#|も広く共\n通語となりました。方言は、その範|＃|が狭く地域\nに残っていきましたが、その方言は自分が作った\nことばではなく、親やまたその親から伝承された\n地域の貴重な文化遺産です。方言には|||緒ある古\n語が使われていたり、標準語では表せない感情や\n状態、深みを表現できる魅力あることばです。方\n言の語源を探ると、もっと街の魅力を発見するこ\nとができるかもしれません。\n｜｜｜｜目\n参考資料｜\n『北海道のことば 北の生活文庫\n第8巻』\n北の生活文庫企画編集会議編\ ありませんか？ ものやサービスではない、\nホスピタリティ溢れる心の交流があったとき、その思い出・その土地は、とても心\n地よく懐かしく大切な心の宝物にもなるでしょう。\n観光産業に直接従事していないとしても、私たちは一人一人が市民として、小樽\nという観光を形づくる代表選手です。自分の家にお招きするように、小樽に生きる\nすべての人が小樽市民として､小樽を訪れてくださる人々に｢ようこそ！いらっしゃ\nいませ！」「楽しい旅を！」の心からの対応があれば、それは極上の旅となり、2度\n3度と足を運んでいただける魅力ある観光地となるのです。\n■笑顔と声がけは最小にして最大のおもてなし\nさら\n小樽はll｣に抱かれ海を抱き、|'|然の幸は小樽観光の大きな魅力に\nもなっています。そういった環境で、少々荒っぽい言葉も飛び交\nいます。土地特有の浜言葉やぶっきらぼうな態度は、文化の違う\n人々には時として不愉快に映ることもあります。方言はその土地\nのユニークな魅力でもあります。そこに笑顔と気さくな声がけが\nあれば、旅は印象深く魅力'''9に彩られることでしょう。難しいこ\nとはいりません。どこでもどんなときも誰にでも、心のこもった\n笑顔と、ちょっとした声がけは最小にして最大のおもてなしです。\n2．基礎知識。\n■基礎知識確認\nガイドには、各ジャンルの基礎知識が必要です。歴史的物語、歴史''19遺産の内容、\n文化・レジャー施設・食に関する情報（食材知識、施設、飲食店）など、‐|-分な基\n礎知搬を持ちましょう。また情州は|｜々刻々変化するので、関係機関やテレビ・ラ\nジオ・インターネット・情報誌などで更新することを心がけましょう。\n216"}, {"page": 217, "file": 2, "pdf_page": 108, "text": "●おも忘易一繕一弐\n■マニュアル作成\n調べた情報は、各ジャンルごと整理してマニュアル化しておきます。観光協会や\nボランティア団体などのガイドブックを基本に、自分なりの情報や提案を盛り込ん\nだオリジナリティあるものをつくりましょう。形は自分なりでよいですが、情報に\nは時間経過によって変化や増幅がありますから、バインダー形式などが便利です。\n経験が増えていくつかのコース傾lhjがはっきりしたり基本ガイドによってコースが\nある場合は、コース別にマニュアルを用意しましょう。\n’\n3．ガイドを実践する前に\n■実地研修\n実際のガイドでは、初対面の旅行者の方々に直接さまざ\nまなアプローチをすることになります。そのときになって\nから流れや組み立てをしていたのでは、時間がかかるばか\nりか楽しい旅行を演出するには無理があります。スムーズ\nで充実したガイドをするためには、シミュレーションが不\n可欠です。説明も、実際に誰かに聞き役になってもらうと\nいう疑似体験をすることにより、よりよい案内ができるよ\nうになるでしょう。このときには、移動や説明などに実際\nにかかる時間を把握したり、案内するものがよく見えるガ\nイド位置、トイレや飲食の場所や時間の設定など、細かなチェックをしてください。\nまた、旅の思い出となる写真撮影のポイントなども重要で、とても喜ばれる提案に\nなります｡これら事前シミュレーションにより気持ちにも余裕が生まれるため､充実\nしたガイドができるようになるでしょう。\n■オリジナリティ\n人はそれぞれに素I青らしい個性を備えています。もちろんあなたもです。ガイド\nのための基本的なマニュアルができたら､ぜひ自分なりの感性を添えてみましょう。\n例えば、料理が得意なら食材に対しての調理アドバイスを、歌が得意なら小樽ゆか\nりの歌の披露など、人物像に詳しければ、その皿味深い話などを。また、自分の周\nりの多方面の人々に聞く情報も､視点や考え方が広がり、よいエッセンスとなるでしょ\nう。ただし、あくまでもお客様の反応を見ながら、決して知識のひけらかしや自慢\nの押し付けなどにならないように気をつけましょう｡少しの量で本来のものをピリッ\nと引き立てるスパイスのようなさじ加減を心がけましよう。思い出に残るような楽\nしいガイドをすることは､小樽観光にとって大変大きな貢献となるでしょう。\n217"}, {"page": 218, "file": 2, "pdf_page": 109, "text": "●おもてなしの捲一え\n4．実 践\n[ガイドを依頼された時］\n■情報収集（1）\n地元サイドの情報収集をします。情報は絶えず変化しています。基本情報に力llえ、\n変化していることがないか、それらに付随するタイムリーなトピックス情報はない\nかなど常に広く収集します｡関係機関情報や社会情勢など､関連事項に日々敏感でい\nることも大切です｡基本的なマニュアルにそれらの情報を見やすく付け加えたものを\n用意しましょう。\n■情報収集（2）\nお迎えするお客様の情報を把握します。スケジュール・人数\n年齢層・旅行の目的・要望など情報が多いほど、求めているも\nのに対して的確なガイドを実践することができ、お客様の満\n足感が高まります。あらかじめこちらの知りたい情報を依\n頼先などにお願いしておくのもよいでしょう。これらも\n基本マニュアルに付け力||えておきましょう。\n■プレゼンテーション\nお客様のニーズを把握できたら、まず希望に沿える基本のガイドスケジュールを\n作ります。それにあわせて自分なりのオリジナルな提案などがあれば、どこで提供\nできるかなど組み立てましょう。その人の個性が出た提案があれば、話題性もあり、\n新客の掘り起こしに一役買うことにもなるでしょう。ただし、押し売りはいけませ\nん。あくまでも引き立つような演出にとどめます。\n[実 践］\n■服装・身だしなみ\n服装は、あまりに装飾性の強いものや華美なものは避けましょう。しかし、知ら\nない土地の中でのお客様の誘導をするので、すべてが地味なものよりは目立つよう\nに明るい色合いで動きやすい物のほうがよいでしょう｡制服や規定のTシャツ・ジャ\nンパーなどがあれば、必ず着用しましょう。\n｜|艮から入る情報は、大きな影響力を持ちます。きちんとした清潔感のある身だし\nなみで、親しみやすく好感をもっていただけるように留意しましょう。\n218"}, {"page": 219, "file": 2, "pdf_page": 110, "text": "●おも妄品一捲一表\n■携帯品・提供品\n持ち物は事前に必ずチェックしましょう。ガイドブックやパンフレット、マニュ\nアルや地|X|など、必要な携帯品や提供品のチェックリストを川意し、それに従って\n事前チェックをすればミスも防げるでしょう。携帯電話は緊急時対応の場合などで\nも必需品です。ご案内する場所においては、靴ずれやちょっとした切り傷などに対\n応する絆創膏や、虫除けや虫刺され薬なども用意しておくとよいでしょう。また、\nガイド中は､両手を自由に使える状態が基本です｡荷物を手に持たず､リュックやウエ\nストポーチなどで両手を空けておきましょう。\n■待ち合わせ\n◎待ち合わせ場所\n駅、ターミナル、観光案内所、ホテルなど、わかりやすい場所に\nします。公共的で、観光客の誰もがわかる場所や地図に明記され\nている場所がよいでしょう。初めて訪れる場所ですから、地元の\n慣れた認識とは異なることを肝に銘じて、初めての方でもよくわか\nるように、行き違いのないよう細かく指示することが必要です。で\nきれば事前に、言葉だけではなく詳糸lllな地図を渡せると理想的です\n◎時間厳守\n慣れない土地での移動なので、時間より早く来るお客様も多数い\nらっしやいます。お客様の信頼と安心感を得るためにも、約束の時\n間間よよりり最最低低ででもも2200分分程程はは先先にに出出向向いいてていいるるよよううににししまますす。。理理想想的的にには30分前には到\n着し、気持ちを落ち着かせて挨拶や組み立てのおさらいや、周りの状況確認などが\nできることが望ましいでしょう。\n◎目立つように\n初対面のお客様がほとんどです。一目でガイドとわかるように、制服や腕章・タ\nスキ・旗・名札など、眼に留まる格好をしましょう。\n■挨拶・言葉遣い\n第一印象はとても大切です。大きな声で、元気よく「ようこそ！いらっしゃいま\nした！」の言葉に心からの気持ちを込めて、笑顔でご挨拶します。このときには、\nお－人お一人にきちんと||艮を合わせるアイコンタクトを忘れないようにしましょう。\nあまり堅苦しい言葉遣いで親近感がうまれず楽しめないのでは、せっかくの旅行も\n台無しです。お客様を尊重し、リラックスして楽しい会話を心がけましょう。方言\nもその土地の魅力です。意味が通じないのは困りますが、説明しつつ織り交ぜると\nとても魅力的なガイドができるのではないでしょうか。ただし、あくまでもお客様\nですから、途中は状況に合わせてフレンドリーな会話でも、お迎えする時とお見送\n219"}, {"page": 220, "file": 2, "pdf_page": 111, "text": "●おも妄しの一桧一え\nりの時には、立場をはっきりさせた丁寧な言葉使いをしましょう。\n■引率・誘導\n常にお客様の興味やペース・体調などに留意\nしながら歩きます。説|ﾘ1や指示の声が、全体に\n聞こえているかも時々チェックしましょう。また、\n人数が多い場合、全体を一人で把握することはなか\nなか容易なことではありません。最初に、グループ\n化をしてお互いで状況を管理しあう方法なども有効\nです。ご案内のときに、一方的な説明だけではなくお互いのコミュニケーションが\nとれる会話などを心がけると、一体感や共有感が増し、思い出深い観光になること\nでしょう。常に人数確認もします。あらかじめ想定した案内時間に準じ、時間内に\nスケジュール通りの行動ができるよう配慮しましょう。\n■観光施設使用時の留意点\n施設側へは、事前に連絡を入れておくのが一番よいでしょう。施設利川の際は、\n訪問先に必ず挨拶をします。\n施設によって、撮影禁止や歩行順序、飲食の規制など注意事項がある場合も多く\nあります。事前に確認したうえ、必ずお客様にお知らせします。\nガイドが入館できない場合もあります。その場合は、お客様にその旨を説|ﾘ'し、\n施設利用後の待ち合わせ場所と時間を確認し、待機します。待機中といえども、お\n客様をお見送りするまではガイドとしての仕事です。「IIIII位を保つ適切な態度で過ご\nしましょう。また、施設内の不備などに気づいた場合は、ガイド終了後の報告事項\nなどで自分の所属組織に報告し対応してもらいます。個人で施設に直接指摘するこ\nとは避けましょう。\n■休憩時の留意点\n基本的には､お客様とは別に休憩することが望ましいでしょう。自分自身のリラッ\nクスの時間や､行程の見直しや予習などの||寺間は､その後のガイドにも役立つでしょ\nう。別に休憩する場合は、次のガイド開始時|IHと待ち合わせ場所を決めて別行動を\nとります。開始時間には遅れないよう、お迎えのとき同様、少なくとも5分ほどは\n早めに待機します。\nお客様と一緒に休憩をとる場合は、あくまでも仕事の延長となりますから、立場\nをわきまえた過ごし方をしましょう。お客様からのもてなしは原則'''9には遠慮しま\nす。しかし、相互の感情的WB盧もあるので、常識的な範囲であれば感謝の気持ちを\nもって応じることもよいでしょう。忘れ物が発生しやすいのも休憩時の特徴です。\n22(ノ"}, {"page": 221, "file": 2, "pdf_page": 112, "text": "●おも蟇品一鑑一え\nお客様の忘れ物がないかもチェックします。\n全国的・国際的に禁煙が広まっている中、｜喫煙しない方々も多くなっています。\n原則禁煙を励行しましょう。\n■緊急時の対応\n万一、緊急事態が発生した場合は、適切な\n機関に迅速に連絡を取り対処します。このた\nめにも携帯電話は必需品ですし、関係各所\n（警察署・交番・救急病院・市役所観光課・\n各団体など）の住所や電話番号は必ずリスト\nアップし、携行しましょう。現場での対処が\n必要な場合も、決して素人判断で自己処理せ\nず、必ず関係機関に連絡を取った上で指示を\n仰ぎ行動しましょう。\n■終了時の対応と留意点\nお見送りの際には、今回小樽観光をしていただいたお礼、無事終了できたお礼を\n心を込めてお伝えします｡お客様と感想を話し合うことも大きく共有感を増します。\n感想を聞くことはガイドとしての評価にもなるので、素直に受け止め、自分の成長\nや喜びとしましょう。お客様からの要望や不満などは、アンケート用紙を配るなど\nすると伝えていただけるでしょう。これらにより、さまざまなデータを蓄積するこ\nとができ、次回のガイドや小榑観光に反映させることができます。アンケート用紙\nは事前に用意しましょう。今回ご案内できなかったたくさんの見所もさりげなくご\n説明し、リピートにつなげましょう。謝礼や心づけは、丁寧に辞退します。忘れ物\nがないか確認し、帰路の無事を願ってお見送りします。\n[終了後］\n■報告書・記録作成\n終了後、記憶が新しいうちに報告害を作成します。記録を残しておくことで、情\n報の把握にもなりますし、よりよい業務に反映させることができます。それは、小\n樽観光の質を上げるためにも有効な情報となります。必要事項のほか、お客様との\n会話や、糸|||々した出来事も記入しておきましょう。自分自身の客観的な反省も書き\nとめ大いに今後の参考にしましょう。\n各施設や交通機関、観光ポイントなどに事前情報と相違や変化があった場合など\nも、書き換えておきましょう。\n221"}, {"page": 222, "file": 2, "pdf_page": 113, "text": "●おも暮しの捲一エ\n■お礼状など\n所属機関の考え方もありますが、差し支えなければお礼の手紙\nを出すことなどは、旅の思い出を更に印象深いものにしてくれるも\nのです。人と人の心の交流こそが観光の真髄だからです。それは\nガイドにとっても感動的な宝物となるでしょう。リピートを促す\n最大のアブ°ローチともいえます。\n5．身障者の方々や特別なニーズへの対応と情報把握\n昨今バリアフリーが標準化されてきているようにいわれますが、当事者の方々に\nとってはまだまだ十分ではありません。トイレの場所や、車椅子乗り入れ可能な施\n設､交通機関､透析対応病院など、さまざまな関係各所の情報を把握しておきましょ\nう。どのようなニーズがあるのか､実際に当事者の方々や介護施設､福祉施設の方々\nに尋ねてみるのもよいでしょう。得られた情報は、一覧や地|X|にしたりして、見や\n川しやすくまとめておきましょう。バリアフリー対応になってい\nとも、「人の力」でバリアをなくすことができます。\n添者に対応の仕方を確認してから対処しましょう）\n＊小樽の街は坂道が多く、しかもバリアフリー対応の施設が少な\nいのが現状です。皆の人力でバリアを取り除きましょう！\n6．「3おたる案内人』に』必要なコミュニケーション能力\nごクレームを発生さ冒せないために～\n～\nお迎えする側と訪ねる側との一期一会の交流は、その人生を彩る価値あることに\nなってほしいものです。それが、つかの間の時間であっても、楽しく、または癒さ\nれ、英気を養われるものとなるのが理想であり望まれることではないでしょうか。\n「おたる案内人」としてさまざまな知識を有し、それを提供するだけなら、パンフ\nレットなど活字での情報提供、あるいは、レコーダーや機械でのアナウンスで事足\nりるでしょう。しかし、このアプローチは一方通行です。知識や情報はその地へ赴\nかなくても、今やインターネットではクリック－つで、書店に行けば大量の情報満\n載旅行ガイドブックで、テレビのスイッチを入れれば多彩な番組で得られます。\n時間と費用をかけて現地へ赴かなければ手に入れることができないもの､それが、\nその瞬間瞬間での双方の関わり、つまりコミュニケーションにより創られる体験な\nのです。\n222"}, {"page": 223, "file": 2, "pdf_page": 114, "text": "●雪妄し忠豐\n「知識」ではなく「体験」です。人は自身の「体験」でしか、ほんとうに理解する\nことはできないともいわれます。二度と同じことは起こることのない、その瞬間の\nコミュニケーションで創られる最高の感動を提供するのが「おもてなし｣、「おたる\n案内人」なのです。\nではコミュニケーションとはいったいどのようなものでしょうか。\nコミュニケーションには、大きく分けて、「自身との内的コミュニケーション」と\n「他者との外的コミュニケーション」がありますが、ここでは「外的コミュニケー\nション」を扱うこととします。\n「おたる案内人」が実践することは、「知識の受け渡し」ではなく、観光にいらし\nた方々とのコミュニケーションです。大切なことは「どう伝えたか」ではなく「ど\nう伝わったのか」です。\n私たちは、常に自分の周りの存在とコミュニケーションを取りながら生きていま\nす。しかし、言葉(知識ともおきかえられる)のみでコミュニケーションを行ってい\nるわけではありません。\n例えば､会話そのものをしなくても、相手の状況や心情をくみ取りながら対応し、\n次の行動を選択しています。態度やしぐさ・表情も大きな認知要素となります。\n心理学者などの実験によれば、初対面の時、相手の印象を決める要素として言葉\nそのものから受ける影響は非常に少なく、代わりに声の大きさやトーン・速さ、態\n度やしぐさ・表情などが90％以上を占めるなどのデータがあります｡自分を振り返っ\nてみても、なるほど、納得のいくことが思い当たるのではないでしょうか。\n■ここで、観光地で多く聞かれるクレームを、少しご紹介しましょう。\n●お客様からは、「ガイドさんの話が一方的でつまらなかった｡」「次の目的地まで何\n分かかるかわからず不安だった｡」「その場所でゆっくりしたかったのにせかされ\nて落ち着かなかった｡」「質問しても怪訊な顔をされて十分に答えてもらえなかっ\nた｡」「違うところに行きたかったのに薦められて断れなかった｡」等々。\n●ガイドさんからは、「あれもしたいこれもしたいと言われたが､時間がなくて困っ\nた｡」「こちらが熱心に話しているのに、お客様が聞いてくれない｡」「まったく時\n間を気にしないお客様で、時間のことを言うと嫌な顔をされた｡」「せっかく食事\nの穴場を紹介したのに行かなかった｡」「安く買える店を紹介したのに買わなかっ\nた｡」等々。\nこれらのコミュニケーションを円滑かつ有効にするには、やはりそれなりの対応\n力を要します。同じ内容でも、使う言葉によって伝わり方も変化します。表現の豊\nかさ、ネガティブではなくポジティブな言い回しや問いかけの仕方、相手の言葉の\n受け取り方、自分の主張や提言の柔らかな伝え方、感情の伝え方などです。\n223"}, {"page": 224, "file": 2, "pdf_page": 115, "text": "●おもてなしの心構一三\n私たちがものごとを認識するということは、それぞれの生活環境や育ち方・価値\n観など多様な影響を受けています。地域が違えば、常識の捉え方も考え方も違いま\nす。人それぞれに、明確に言葉では表せないものがあるのです。このように、自分\nが伝えたつもりでも、そのとおりに相手が受け取っていない場合があります。これ\nが、「どう伝えたか」ではなく「どう伝わったのか」が大切という所以です。\nコミュニケーションは双方向の発信と受信といいましたが、伝え方が発信だとす\nれば受信は聴き方となります。「聞く」のではなく「聴く」のです。相手の欲求や真\n意を的確に受け取れなければ、独りよがりな対応や望まれない間違った対応をして\nしまい、前出のようなクレームとなってしまうことにもなります。せっかくよかれ\nと思ってしていることが、クレームとなってしまうことがあります。これらのこと\nを念頭に置き、十分に配盧することが重要です。\nコミュニケーション能力は、まさに実践でしか身につけることも上達することも\nできません。上手にできるようになるまでには、失敗もあるかもしれませんが、大\nいに学びながら実践を積んでいく他はありません。\nまずは第一歩の笑顔と挨拶を大切にし、ぜひ自分なりの努力と工夫を実践してく\nださい。\n224"}, {"page": 226, "file": 2, "pdf_page": 118, "text": "●資\n料\n｜’ ’ ■文化財\n●国指定史跡 手宮洞窟(Temiya Cave) の洋風石造建築を代表する建物のひとつです｡純\n■所在地：小樽市手宮1丁目3番4号 石造2階建てで内部は漆喰壁に北海道産木材のワニ\n■指定年月日：大正10(1921 )年3月3日 ス塗装で､落ち着いた重厚なデザインに統一され\n■管理者：小樽市教育委員会 生涯学習課 ています。\nTEL､32-411 1 (内線531 ) 当時この建物前面には、専用の船入澗、輸出入\n手宮洞窟は慶応2(1866)年に小田原の石工長兵衛 倉庫があり建物の裏側には鉄道が走るという営業\nが建築用石材捜しの際に偶然洞窟に入り彫刻を発 のための好施設が完備しておりました｡この建物\n見したといわれています。 は昭和29(1954)年まで支店に使われていましたが、\nこの岩壁彫刻を最初に学界に発表したのは英国 昭和30(1955)年に市が譲り受け、その後、昭和44\n人地震学者ジョン・ミルンで､明治12(1879)年夏、 (1969)年に国の重要文化財に指定され､昭和59(1984）\n現地を訪れて彫刻を模写し、翌13(1880)年『アジ 年から3年間､全面的な修理復元工事を行い､当時\nア協会誌』にその全貌を紹介しました。 の雰囲気を再現しました。\nこの彫刻は､古代岩壁彫刻として研究されてい\nます｡平成元(1989)年に行われた発掘調査ではそ ●道指定史跡\nの出土遺物から､洞窟壁画は約1,600年前に刻まれ 地嶺山環状列石(Zichinyama Stone Circle)\nたものであることが判明しています｡この遺跡は ■所在地：小樽市忍路2丁目\n考古・人類学上､古代人の精神文化を知る上で第 ■指定年月日：昭和25(1950)年8月28日\n1級の遺跡といえます。 ■管理者：小樽市教育委員会 生涯学習課\nTEL.32-4111 (内線531 )\n●国指定史跡 忍路環状列石の西､約1kmのところにある地鎮山\n忍路環状列石(Oshoro Stone Circle) (標高50m)の山頂に位置しています｡その形は楕円\n■所在地：小樽市忍路2丁目 形で､12個の大石が10m×8mの規模に配置されてい\n■指定年月日：昭和36(1961)年3月10日 ます｡昭和24(1949)年に行われた発掘調査では中\n■管理者：小樽市教育委員会 生涯学習課 央よりやや南寄りに円形に小さな円石を集めた部\nTEL､32-4111(内線531 ) 分がみられ､その地下から2m×2mほど．深さ1m方\n忍路環状列石は三笠山山麓の緩斜面を平坦にカッ 形の墓穴が発見されています｡底には川原石とみ\nトし、その面に、大きな立石とその周囲に小石を られる円石が敷かれていました｡この遺跡も "sub": "", "q": "明治から昭和の初期にかけて北海道には全国が欲しがる代表的な2つの資源がありました。それは次の組み合わせのうちどれですか。", "a": "4"}, {"exam": 1, "no": 3, "sub": "", "q": "明治初期に政府は「殖産興業」「富国強兵」という政策を打ち出し、小樽に鉄道を敷くために膨大なお金を投下しますが、その目的の第一はどれですか。", "a": "2"}, {"exam": 1, "no": 4, "sub": "", "q": "鰊がお金のような価値を持ったのは何故ですか。", "a": "4"}, {"exam": 1, "no": 8, "sub": "", "q": "小樽を含む積丹半島地域の鰊の漁期を以下から選んでください。", "a": "3"}, {"exam": 1, "no": 11, "sub": "", "q": "小樽の鰊漁獲高が最高だった年を以下から選んでください。", "a": "3"}, {"exam": 1, "no": 12, "sub": "", "q": "旧近江家番屋の写真を以下の1〜4から選んでください。", "a": "4"}, {"exam": 1, "no": 13, "sub": "", "q": "小樽の鰊漁家が遠隔地にも漁場を経営できた理由の正しい組み合わせを以下から選んでください。", "a": "4"}, {"exam": 1, "no": 14, "sub": "", "q": "祝津の鰊御殿がかつてあった場所と所有者の組み合わせを以下から選んでください。", "a": "1"}, {"exam": 1, "no": 17, "sub": "", "q": "沖揚げ音頭をうたう際の独唱の別称を以下から選んでください。", "a": "3"}, {"exam": 1, "no": 24, "sub": "", "q": "祝津鰊親方の御三家といわれているのは、どれですか。", "a": "2"}, {"exam": 1, "no": 87, "sub": "", "q": "小樽には国指定重要文化財の歴史的建造物がありますが、次のうち該当する建物はどれですか。", "a": "3"}, {"exam": 2, "no": 7, "sub": "", "q": "明治から昭和初期にかけて小樽の黄金時代は形成されましたが、第二次大戦を挟んで、この黄金時代を支えていた全ての要素を失ってしまいました。その原因で間違いはどれですか。", "a": "4"}, {"exam": 2, "no": 8, "sub": "", "q": "鰊漁期中に白子で海が白くなるという現象がありますが、このことを何といいますか。", "a": "群来（くき）"}, {"exam": 2, "no": 10, "sub": "", "q": "漁獲高を表す「石」をキログラムで換算すると約何キログラムとなりますか。（生鰊の場合）", "a": "750㎏"}, {"exam": 2, "no": 11, "sub": "", "q": "小樽の鰊漁獲高が最高だった年を以下から選んでください。", "a": "3"}, {"exam": 2, "no": 12, "sub": "", "q": "江戸時代後半から肥料の主体となった搾粕（〆粕）でしたが、その後あらわれたライバル肥料を以下から選んでください。", "a": "1"}, {"exam": 2, "no": 13, "sub": "", "q": "明治20年代、小樽と高島産のものが良質な製品といわれた鰊製品は何でしょうか。", "a": "身欠鰊（みがきにしん）"}, {"exam": 2, "no": 17, "sub": "", "q": "沖揚げ音頭をうたう際の独唱の別称を何といいますか。", "a": "ハオイ"}, {"exam": 2, "no": 61, "sub": "", "q": "鰊の漁家や番屋の建物は、後志管内の海岸沿いに数多く建てられました。現在、小樽市内に各地からも移築した建物が用途をかえて使われています。さて、明治30年に現在の泊村に建てられましたが、昭和33年に祝津へ移築され、昭和35年には北海道有形文化財になった建物はどれでしょうか。", "a": "2"}, {"exam": 2, "no": 89, "sub": "", "q": "小樽には国指定重要文化財があります。一つは旧日本郵船(株)小樽支店ですが、もう一つは次のうちどれですか。", "a": "3"}, {"exam": 3, "no": 5, "sub": "", "q": "鰊漁期中に白子で海が白くなる「くき」という現象がありますが、どのような文字で表しますか。次から選びなさい。", "a": "3"}, {"exam": 3, "no": 6, "sub": "", "q": "鰊漁の小樽での最高漁獲高は大正14年に記録されます。この年の漁獲高は次のどれですか。", "a": "2"}, {"exam": 3, "no": 7, "sub": "", "q": "高島や祝津地区の鰊漁は江戸時代から盛んでしたが、代表する3代漁家といえば青山家、茨木家ともうひとつの漁家は何家ですか。", "a": "白鳥家"}, {"exam": 3, "no": 8, "sub": "", "q": "小樽の鰊漁家が遠隔地にも漁場を経営できた理由の正しい組み合わせを以下から選んでください。", "a": "4"}, {"exam": 3, "no": 9, "sub": "", "q": "高島岬中腹に建つ「鰊御殿」は漁家の田中家住宅を昭和33年に移築したものです。この建物が元々あった所は何という村ですか。", "a": "泊村"}, {"exam": 3, "no": 12, "sub": "", "q": "明治21(1888)年の小樽では鰊漁の漁夫を雇っていましたが、そのおおよその人数は次から選びなさい。", "a": "2"}, {"exam": 3, "no": 13, "sub": "", "q": "沖揚げ音頭をうたう際の斉唱の別称を以下から選んでください。", "a": "4"}, {"exam": 3, "no": 14, "sub": "", "q": "鰊は食用以外に肥料にも加工されました。搾粕（〆粕）が流通する前に肥料として使われた魚体の部位の組み合わせを以下から選んでください。", "a": "4"}, {"exam": 3, "no": 15, "sub": "", "q": "鰊の加工品で「1本取り」「2本取り」と呼ばれたものは何といいますか。", "a": "身欠き鰊・身欠き"}, {"exam": 3, "no": 26, "sub": "", "q": "江戸時代中期から二人の近江商人が鰊を資源とした商いをしていました。オタルナイ場所の岡田弥三右衛門ともう一人オショロ、タカシマ場所を請け負っていたのは誰ですか。", "a": "西川伝右衛門"}, {"exam": 3, "no": 90, "sub": "", "q": "次の歴史的建造物のうち、市指定有形文化財はどれですか。", "a": "3"}, {"exam": 4, "no": 2, "sub": "", "q": "鰊は単なる食用のみならず肥料として高い価値を持っていました。その「高さ」から、鰊は何と称される商品だったでしょうか。", "a": "金肥"}, {"exam": 4, "no": 8, "sub": "", "q": "小樽から積丹半島沿岸各地で鰊漁が最も盛んに行われていた時代は次のどれでしょうか。", "a": "4"}, {"exam": 4, "no": 9, "sub": "", "q": "鰊漁の小樽での最高漁獲高は約7万5,000石ですが、その年は何年でしょうか。", "a": "3"}, {"exam": 4, "no": 10, "sub": "", "q": "祝津地区の鰊漁、3大漁家のうち山形県出身の漁家は青山家ともう一つは何家でしょうか。", "a": "4"}, {"exam": 4, "no": 13, "sub": "", "q": "高島岬中腹に建つ「鰊御殿」は漁家の田中家住宅を昭和33年に移築したものです。この移築はある会社の記念事業のひとつとして行われました。その会社名は何といいますか。", "a": "北海道炭礦汽船㈱"}, {"exam": 4, "no": 14, "sub": "", "q": "建網に関する次の文章の空欄に入る数字を選びなさい。「建網は明治21(1888)年には全道で2,700統を越え、後志地方が（　　）統と圧倒的に多かった。」", "a": "3"}, {"exam": 4, "no": 15, "sub": "", "q": "鰊漁の写真です。この作業の際、うたわれる沖揚げ音頭を何と言うでしょうか。", "a": "子はたき音頭"}, {"exam": 4, "no": 16, "sub": "", "q": "鰊漁は事前の準備がすべて終え、鰊が来るのを待つだけになると大宴会が行われます。この宴会を何といいますか。", "a": "網下ろし"}, {"exam": 4, "no": 17, "sub": "", "q": "江戸時代後半から肥料の主体となった鰊の搾粕（〆粕）でしたが、その後あらわれたライバル肥料は「大豆粕」ともう一つは何でしょうか。", "a": "化学肥料"}, {"exam": 4, "no": 26, "sub": "", "q": "江戸時代中期から二人の商人が鰊を資源とした商いをしていました。オタルナイ場所の岡田弥三右衛門ともう一人オショロ、タカシマ場所を請け負っていた西川伝右衛門でした。この二人の出身地域はどこでしょうか。", "a": "4"}, {"exam": 4, "no": 62, "sub": "", "q": "小樽の歴史的建造物は移築や改築によってさまざまな用途に転用されています。その先駆けとなった建物は次のどれでしょうか。", "a": "4"}, {"exam": 4, "no": 88, "sub": "", "q": "次のうち、指定有形文化財ではないものはどれでしょうか。", "a": "4"}, {"exam": 4, "no": 89, "sub": "", "q": "小樽には神社がたくさんありますが、その創建に関わった人物で榎本武揚は龍宮神社、では場所請負人の西川伝右衛門が創建した神社といえば次のどれでしょうか。", "a": "2"}, {"exam": 5, "no": 8, "sub": "", "q": "次の文章の①〜④の（　）内に間違いが一つあります。その番号と正解を書きなさい。明治から大正にかけて、小樽を含む積丹半島沿岸地域の鰊漁の漁期は①（3〜5月）でした。この時期、海はたびたび②（群来）がおきます。これは大群で押し寄せた鰊の放出する③（卵子）によって海が④（白濁）する現象でした。", "a": "番号③白子または精子"}, {"exam": 5, "no": 9, "sub": "", "q": "鰊の漁獲高は「石」という単位で表していましたが、生鰊換算で1石は約何kgでしょうか。", "a": "4"}, {"exam": 5, "no": 10, "sub": "", "q": "小樽の鰊漁獲高の最高は、大正14年に記録します。その漁獲高は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 11, "sub": "", "q": "次の文章の（　）内には祝津の3大漁家名の一つが当てはまります。その漁家名は何というでしょうか。（　）家は天保7年に山形県遊佐町に生まれた（　）留吉が、江戸時代から祝津に出稼ぎし、明治になって同地に居を構えたものです。（　）家は規模を拡大し、明治20年代には祝津、高島地区の総建網数102統のうち、（　）家所有のものが16統を数えた。", "a": "青山"}, {"exam": 5, "no": 12, "sub": "", "q": "小樽、後志の鰊漁家が遠隔地にも漁場を経営できた理由の正しい組み合わせを以下から選んでください。", "a": "4"}, {"exam": 5, "no": 13, "sub": "", "q": "鰊番屋の特長として間違っているのはどれでしょうか。", "a": "3"}, {"exam": 5, "no": 16, "sub": "", "q": "沖揚げ音頭はひとりが唄い、それに続いて他の皆が唄います。独唱を「ハオイ」、斉唱を何というでしょうか。", "a": "シタゴエ"}, {"exam": 5, "no": 17, "sub": "", "q": "沖揚げ音頭のなかで、次の作業をするときに唄う「うた」は何というでしょうか。「枠船の下の海中に吊られた枠網の中に、魚群を落とし込む際に唄うもので、網起こしの作業の最後に最も力を込める作業です。」", "a": "木遣り音頭"}, {"exam": 5, "no": 18, "sub": "", "q": "明治20年代、小樽と高島産のものが良質な製品といわれた鰊製品はどれでしょうか。", "a": "1"}, {"exam": 5, "no": 24, "sub": "", "q": "明治末期から北前船は衰亡していきました。その理由として正しくないのは次のどれでしょうか。", "a": "4"}, {"exam": 5, "no": 28, "sub": "", "q": "鰊を追って小樽に拠点を移した商人を称して「松前商人」と呼びます。次の商人で「松前商人」ではない人物はどれでしょうか。", "a": "4"}, {"exam": 5, "no": 72, "sub": "", "q": "「夏休みになると／おれたちは道ばたの／ざっぱ木を拾い拾い赤岩ポントマルへ／毛コのはえた兄分は褌／おれたちはふりちん／・・・」この碑文は祝津の鰊御殿そばにあります。次のだれの文学碑でしょうか。", "a": "1"}, {"exam": 6, "no": 1, "sub": "", "q": "幕末の小樽は恵比須屋岡田家と住吉屋西川家の両家それぞれが漁場を開拓していました。この両家のことを何というでしょうか。", "a": "3"}, {"exam": 6, "no": 2, "sub": "", "q": "問1の人たちがアイヌの人々との取引きの拠点として、また経営のためにそれぞれの領域ごとに作ったのが「運上屋」です。現在、小樽にはオタルナイ場所「運上屋」の碑があります。それはどこにあるでしょうか。", "a": "2"}, {"exam": 6, "no": 8, "sub": "", "q": "次の文章の（　）内に当てはまる語句は何でしょうか。幕末から明治にかけて鰊の漁獲量は大型網の導入などにより大きく伸びていきました。人々が鰊を求めた理由は西日本で鰊を原料とする（　）の需要が高まったことにあります。", "a": "肥料"}, {"exam": 6, "no": 9, "sub": "", "q": "鰊漁で、ひとつの建網（1ヶ統）にたずさわる漁夫の人数は次のどれでしょうか。", "a": "2"}, {"exam": 6, "no": 11, "sub": "A", "q": "次の文章は番屋を説明しています。（　）内に当てはまる語句を記入しなさい。番屋とは親方家族の住居であるとともに、鰊漁期中に（　A　）らが寝泊りした建物です。親方家族の住居部分と、（　A　）らの生活空間が建物のほぼ中央で（　B　）によって分けられています。", "a": "漁夫"}, {"exam": 6, "no": 11, "sub": "B", "q": "次の文章は番屋を説明しています。（　）内に当てはまる語句を記入しなさい。番屋とは親方家族の住居であるとともに、鰊漁期中に（　A　）らが寝泊りした建物です。親方家族の住居部分と、（　A　）らの生活空間が建物のほぼ中央で（　B　）によって分けられています。", "a": "土間"}, {"exam": 6, "no": 12, "sub": "", "q": "祝津にある鰊御殿（田中家住宅）は、ある会社の創立70周年記念事業のひとつとして泊村から移築されました。その会社名は次のどれでしょうか。", "a": "2"}, {"exam": 6, "no": 15, "sub": "", "q": "鰊漁の雇い漁夫に関する次の文章のカッコに入る数字を記入しなさい。明治20年代に雇われた漁夫数は北海道全体で9万人を超え、そのうち約（　）万人は他府県でした。", "a": "6"}, {"exam": 6, "no": 16, "sub": "", "q": "沖揚げ音頭のなかの「木遣り音頭」の説明です。（　）内に当てはまる語句を選びなさい。「木遣り音頭は（　）とも呼ばれ、漁夫の士気を高め、また一定の休みを与えて疲れを少なくさせる唄で、熟練の技が必要とされました。」", "a": "2"}, {"exam": 6, "no": 17, "sub": "", "q": "次の文中の（　）内に当てはまる語句を選びなさい。鰊は明治以降も肥料が主たる製品でしたが、漁獲量が不安定になりだし、化学肥料や中国東北部からの（　）など代替製品が登場し、魚肥の優位はおびやかされました。", "a": "1"}, {"exam": 6, "no": 88, "sub": "", "q": "次の文化財で、市指定有形文化財はどれでしょうか。", "a": "3"}, {"exam": 7, "no": 1, "sub": "", "q": "明治から大正時代にかけて、北海道の鰊漁は特別の需要があり盛んになりました。その需要とは何でしょうか。", "a": "3"}, {"exam": 7, "no": 7, "sub": "", "q": "明治から昭和初期にかけて繁栄を続けた小樽ですが、第二次大戦を挟んで、斜陽化していきました。その原因で間違いはどれでしょうか。", "a": "2"}, {"exam": 7, "no": 8, "sub": "", "q": "鰊漁期中に見られた「群来（くき）」という現象は次のどれでしょうか。", "a": "2"}, {"exam": 7, "no": 9, "sub": "A", "q": "次の文章は、小樽の鰊漁獲高についての傾向を表しています。（　）内に該当する語句を選びなさい。明治20年代は（　A　）、明治30年代は（　B　）、大正時代は再び（　A　）となりましたが、昭和に入り豊凶の波が激しくなりました。", "a" ", "a": "4"}, {"exam": 9, "no": 11, "sub": "", "q": "次の文は番屋の特長を説明しています。空欄に当てはまる言葉を書きなさい。「番屋は、親方家族の住居部分と、漁夫らの生活空間が建物のほぼ中央で（　）によって分けられている。」", "a": "土間"}, {"exam": 9, "no": 13, "sub": "", "q": "場所請負制時代の小樽は3つの場所に分かれていました。各場所と請け負った商人の組み合わせで正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 15, "sub": "", "q": "次の文の空欄に当てはまるのはどれでしょうか。明治21年、小樽の鰊漁では多数の漁夫が雇われました。その中で市外からの漁夫の大半は（　）、秋田からの人々でした。", "a": "3"}, {"exam": 9, "no": 16, "sub": "", "q": "鰊漁の建網に関する次の文章のカッコに入る数字は次のどれでしょうか。「建網は明治21年には全道で2,700統を越え、後志地方が（　）統と圧倒的に多かった。」", "a": "3"}, {"exam": 9, "no": 17, "sub": "", "q": "沖揚げ音頭の説明として正しいのは次のどれでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 9, "no": 88, "sub": "", "q": "次のうち、市指定有形文化財はどれでしょうか。", "a": "1"}, {"exam": 10, "no": 2, "sub": "", "q": "問1の時代、小樽に定住者が増えていった主な理由は次のどれでしょうか。", "a": "2"}, {"exam": 10, "no": 8, "sub": "", "q": "鰊漁期中に海が白くなる「くき」という現象がありますが、それはどのような現象でしょうか。正しいもの次から選びなさい。", "a": "3"}, {"exam": 10, "no": 9, "sub": "", "q": "鰊の漁獲高は「石」という単位で表していましたが、生鰊換算で1石は約何kgでしょうか。", "a": "4"}, {"exam": 10, "no": 10, "sub": "", "q": "次の文章の（　）内には祝津の3大漁家名の一つが当てはまります。その漁家名は何というでしょうか。（　）家は山形県遊佐町出身で、江戸時代に（　）輿八郎が鱈釣り漁夫として雇われて祝津に出稼ぎに来ていました。（　）家は資金を蓄えた後、鰊漁に進出し、明治10年以降には4統の建網を持ちました。", "a": "茨木"}, {"exam": 10, "no": 11, "sub": "", "q": "鰊番屋の特長で正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 10, "no": 12, "sub": "A", "q": "次の文の空欄に当てはまる言葉を書きなさい。小樽市祝津の丘にある「鰊御殿」は昭和33年、（　A　）村の大漁家、（　B　）家の住宅を移築したものです。", "a": "泊"}, {"exam": 10, "no": 12, "sub": "B", "q": "次の文の空欄に当てはまる言葉を書きなさい。小樽市祝津の丘にある「鰊御殿」は昭和33年、（　A　）村の大漁家、（　B　）家の住宅を移築したものです。", "a": "田中"}, {"exam": 10, "no": 13, "sub": "", "q": "「全道無比の鰊漁場」といわれた中場所は、次のどの地域を指していったものでしょうか。", "a": "2"}, {"exam": 10, "no": 15, "sub": "", "q": "明治21年、小樽の鰊漁では多数の漁夫が雇われました。その中で市外からの漁夫の大半は青森、秋田からの人々でした。その数は次のどれでしょうか。", "a": "4"}, {"exam": 10, "no": 16, "sub": "A", "q": "（　）内に該当する語句を書きなさい。海上で鰊を捕獲して陸揚げするまでを（　A　）といいます。また建網を数える場合や、その組織を指す場合には（　B　）を用いました。", "a": "沖揚げ"}, {"exam": 10, "no": 16, "sub": "B", "q": "（　）内に該当する語句を書きなさい。海上で鰊を捕獲して陸揚げするまでを（　A　）といいます。また建網を数える場合や、その組織を指す場合には（　B　）を用いました。", "a": "統"}, {"exam": 10, "no": 17, "sub": "", "q": "沖揚げ音頭はひとりが唄い、それに続いて他の皆が唄います。斉唱を「シタゴエ」といいます。それでは独唱は何というでしょうか。", "a": "3"}, {"exam": 10, "no": 18, "sub": "", "q": "江戸時代後半から肥料の主体となった搾粕（〆粕）でしたが、その後あらわれたライバル肥料を以下から選んでください。", "a": "1"}, {"exam": 10, "no": 82, "sub": "", "q": "2012年11月、かつて小樽の名物で全国的にも知られていた「キャバレー現代」が移築のため解体されました。この建物は鰊漁全盛期の祝津の3大漁家の一つの別邸として建てられたものです。その漁家名を書きなさい。", "a": "白鳥家"}, {"exam": 10, "no": 87, "sub": "", "q": "次の歴史的建造物のうち、道指定有形文化財はどれでしょうか。", "a": "4"}, {"exam": 11, "no": 8, "sub": "", "q": "鰊漁期中に白子で海が白くなる「くき」という現象がありますが、それはどのような文字で表しますか。正しいもの次から選びなさい。", "a": "3"}, {"exam": 11, "no": 9, "sub": "", "q": "小樽の鰊漁獲高の最高は大正14年でした。その時の漁獲高は次のどれでしょうか。", "a": "4"}, {"exam": 11, "no": 10, "sub": "A", "q": "次の文章の（　）内には祝津の3大漁家名が当てはまります。その漁家名は何というでしょうか。（　A　）家は山形県遊佐町出身で、江戸時代から祝津に出稼ぎし、明治になって祝津に居を構え、明治20年代には16統の建網を持つようになりました。同じく（　B　）家も山形県遊佐町出身で（　B　）与八郎が鱈釣り漁夫として雇われて祝津に出稼ぎに来ていました。", "a": "青山"}, {"exam": 11, "no": 10, "sub": "B", "q": "次の文章の（　）内には祝津の3大漁家名が当てはまります。その漁家名は何というでしょうか。（　A　）家は山形県遊佐町出身で、江戸時代から祝津に出稼ぎし、明治になって祝津に居を構え、明治20年代には16統の建網を持つようになりました。同じく（　B　）家も山形県遊佐町出身で（　B　）与八郎が鱈釣り漁夫として雇われて祝津に出稼ぎに来ていました。", "a": "茨木"}, {"exam": 11, "no": 11, "sub": "", "q": "鰊漁での小樽の強みとして、小樽の鰊漁家が遠隔地にも漁場を経営できた理由で、最も適切なのは次のどれでしょうか。", "a": "4"}, {"exam": 11, "no": 13, "sub": "A", "q": "番屋の語源の文章です。（　）内の該当する語句を選びなさい。江戸時代、（　A　）が拠点とした運上家から派遣された（　B　）が、漁を行なったり漁民を監視した小屋「番家」が語源です。", "a": "2"}, {"exam": 11, "no": 13, "sub": "B", "q": "番屋の語源の文章です。（　）内の該当する語句を選びなさい。江戸時代、（　A　）が拠点とした運上家から派遣された（　B　）が、漁を行なったり漁民を監視した小屋「番家」が語源です。", "a": "2"}, {"exam": 11, "no": 14, "sub": "", "q": "江戸時代の鰊漁場で、オタルナイ場所とタカシマ場所との境界は次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 15, "sub": "", "q": "鰊漁の雇い漁夫に関する次の文章のカッコに入る地名を記入しなさい。明治20年代に雇われた漁夫数は北海道全体で9万人を超え、そのうち約6万人は他府県でした。そのおもな出身地は南部、津軽、（　）、庄内地方出身の人々でした。", "a": "秋田"}, {"exam": 11, "no": 16, "sub": "", "q": "鰊漁での沖揚げとはどのような作業のことでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 11, "no": 17, "sub": "", "q": "沖揚げ音頭の中の「木遣り音頭」とは次のどの作業の際に唄ったものでしょうか。", "a": "4"}, {"exam": 11, "no": 18, "sub": "", "q": "江戸時代後半から肥料の主体となったのは鰊の搾粕（〆粕）でしたが、その作り方で正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 28, "sub": "", "q": "次の文の空欄に当てはまる言葉を書きなさい。江戸時代中期から小樽では二組の近江商人が鰊を資源とした商いをしていました。岡田家ともう一つは（　）家です。", "a": "西川"}, {"exam": 11, "no": 88, "sub": "", "q": "次の小樽市内の文化財で、国指定、道指定、市指定の順番（左から）で並んでいるのはどれでしょうか。", "a": "2"}, {"exam": 12, "no": 2, "sub": "", "q": "次の文の空欄に当てはまる語句を書きなさい。明治2(1869)年、場所請負制の廃止により誰もが（　）開拓をできるようになり、鰊の価値がますます高まってきた時期でもあり、多くの商人や漁業家が北海道に乗り込んできました。", "a": "漁場"}, {"exam": 12, "no": 7, "sub": "", "q": "次の文章の①〜④の（　）内に間違いが一つあります。間違っている番号と正解を書きなさい。明治から大正にかけて、小樽を含む積丹半島沿岸地域の鰊漁の漁期は①（11〜1月）でした。この時期、海はたびたび②（群来）がおきます。これは大群で押し寄せた鰊の放出する③（白子）によって海が④（白濁）する現象でした。", "a": "番号 1 正解3～5月"}, {"exam": 12, "no": 8, "sub": "", "q": "北海道は幕末にかけて鰊の漁獲量が大きく伸び、西日本での需要が高まりました。最も需要があったのは次のどれでしょうか。", "a": "4"}, {"exam": 12, "no": 9, "sub": "A", "q": "次の文章の（　）内に当てはまる語句を記入しなさい。江戸時代の鰊漁では、北海道日本海側南部の熊石から寿都町歌棄までを（　A　）、そこから神威岬、石狩市厚田までを（　B　）と呼んでいました。", "a": "近場所"}, {"exam": 12, "no": 9, "sub": "B", "q": "次の文章の（　）内に当てはまる語句を記入しなさい。江戸時代の鰊漁では、北海道日本海側南部の熊石から寿都町歌棄までを（　A　）、そこから神威岬、石狩市厚田までを（　B　）と呼んでいました。", "a": "中場所"}, {"exam": 12, "no": 11, "sub": "", "q": "次の文章の（　）内に当てはまる語句を記入しなさい。幕末のオタルナイ場所を請負っていた商人は、近江商人の（　）家で、拠点となる運上屋はクッタルウシにありました。", "a": "岡田"}, {"exam": 12, "no": 12, "sub": "A", "q": "番屋を説明した文章です。（　）内に該当する語句を選びなさい。番屋とは親方家族の（　A　）部分と、漁夫らの生活空間が建物のほぼ中央で（　B　）によって分けられた建物です。", "a": "2"}, {"exam": 12, "no": 12, "sub": "B", "q": "番屋を説明した文章です。（　）内に該当する語句を選びなさい。番屋とは親方家族の（　A　）部分と、漁夫らの生活空間が建物のほぼ中央で（　B　）によって分けられた建物です。", "a": "2"}, {"exam": 12, "no": 14, "sub": "", "q": "祝津にある鰊御殿（旧田中家母屋）は北海道炭礦汽船㈱の創立70周年記念事業のひとつとして移築されたものです。どこから移築されたものでしょうか。市町村名を書きなさい。", "a": "泊村"}, {"exam": 12, "no": 15, "sub": "A", "q": "次の文章は、小樽の鰊漁獲高について表しています。（　）内に該当する語句を選びなさい。小樽の漁獲高について、明治以降の大まかな傾向でいえば、明治（　A　）年代は好調、明治（　B　）年代は若干低調、大正時代は再び好調となりましたが、豊凶の波が激しくなりました。", "a": "2"}, {"exam": 12, "no": 15, "sub": "B", "q": "次の文章は、小樽の鰊漁獲高について表しています。（　）内に該当する語句を選びなさい。小樽の漁獲高について、明治以降の大まかな傾向でいえば、明治（　A　）年代は好調、明治（　B　）年代は若干低調、大正時代は再び好調となりましたが、豊凶の波が激しくなりました。", "a": "3"}, {"exam": 12, "no": 16, "sub": "", "q": "沖揚げ音頭の説明として間違っているのは次のどれでしょうか。次の中から選びなさい。", "a": "4"}, {"exam": 12, "no": 25, "sub": "", "q": "次の文の空欄に当てはまる言葉を書きなさい。江戸時代中期の小樽でオショロ・タカシマ場所請負人だった近江商人は（　）家です。", "a": "西川"}, {"exam": 13, "no": 2, "sub": "", "q": "近江商人の恵比須屋岡田家がオタルナイ場所請負人となり漁場を開拓し、場所を管理する運上屋という拠点を設けました。この運上屋のあった場所は、おおよそ現在のどこにあったでしょうか。", "a": "2"}, {"exam": 13, "no": 7, "sub": "", "q": "明治から昭和初期にかけて繁栄を続けた小樽ですが、昭和20年代〜30年代、まちは斜陽化していきました。その原因で間違いはどれでしょうか。", "a": "4"}, {"exam": 13, "no": 8, "sub": "", "q": "次の文章の（　）内に当てはまる語句を記入しなさい。江戸時代中頃には北海道の産物として鰊製品が注目され、北前船の日本海航路が整備され、近江商人らによる（　）の導入などによって、幕末にかけて漁獲量は大きく伸びました。", "a": "大型網・角網・行成網など"}, {"exam": 13, "no": 9, "sub": "", "q": "鰊漁の小樽での最高漁獲高は7万5,000石ですが、その年は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 10, "sub": "", "q": "祝津地区の鰊漁、3大漁家のうち茨木家と同じ出身県の漁家は次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 11, "sub": "", "q": "祝津にある鰊御殿（田中家住宅）は、ある会社の創立70周年記念事業のひとつとして泊村から移築されました。その会社名は次のどれでしょうか。", "a": "2"}, {"exam": 13, "no": 12, "sub": "A", "q": "番屋の語源の文章です。（　）内の該当する語句を選びなさい。江戸時代、場所請負人が拠点とした（　A　）から派遣された（　B　）が、漁を行なったり漁民を監視した小屋「番家」が語源です。", "a": "1又は3"}, {"exam": 13, "no": 12, "sub": "B", "q": "番屋の語源の文章です。（　）内の該当する語句を選びなさい。江戸時代、場所請負人が拠点とした（　A　）から派遣された（　B　）が、漁を行なったり漁民を監視した小屋「番家」が語源です。", "a": "4"}, {"exam": 13, "no": 13, "sub": "A", "q": "次の文章の（　）内に当てはまる語句を記入しなさい。江戸時代、鰊漁場として蝦夷地の日本海沿岸で他に比べるもののない好漁場と呼ばれた（　A　）の範囲は歌棄から（　B　）までのことをいいました。", "a": "中場所"}, {"exam": 13, "no": 13, "sub": "B", "q": "次の文章の（　）内に当てはまる語句を記入しなさい。江戸時代、鰊漁場として蝦夷地の日本海沿岸で他に比べるもののない好漁場と呼ばれた（　A　）の範囲は歌棄から（　B　）までのことをいいました。", "a": "厚田"}, {"exam": 13, "no": 15, "sub": "", "q": "建網に関する次の文章の空欄に入る語句を書きなさい。「鰊漁の建網は明治21（1888）年には全道で2,700統を越え、後志地方が1,452統と圧倒的に多かった。忍路の（　）家は各地に40統余を持って全道でもトップクラスの漁家だった」", "a": "西川"}, {"exam": 13, "no": 16, "sub": "", "q": "沖揚げ音頭のなかの「木遣り音頭」の説明です。（　）内に当てはまる語句を選びなさい。「木遣り音頭は（　）とも呼ばれ、漁夫の士気を高め、また一定の休みを与えて疲れを少なくさせる唄で、熟練の技が必要とされました。」", "a": "1"}, {"exam": 13, "no": 17, "sub": "", "q": "次の文章の（　）内に当てはまるのは次のどれでしょうか。鰊は明治以降も肥料が主たる製品でしたが、漁獲量が不安定になりだし、化学肥料や中国東北部からの（　）など代替製品が登場し、魚肥の優位はおびやかされました。", "a": "2"}, {"exam": 13, "no": 18, "sub": "", "q": "小樽の鰊漁家が遠隔地にも漁場を経営できた理由で正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 13, "no": 24, "sub": "", "q": "北前船が段々と衰退していった理由として間違っているのは次のどれでしょうか。", "a": "1"}, {"exam": 13, "no": 85, "sub": "", "q": "平成23年から小樽商工会議所では地域経済活性化のため1・2次産業プロジェクトを立ち上げ、水産分野では函館の松前漬けのような地域ブランドに育つことを願い、鰊の加工品を開発しました。水産加工会社が一定の製法ルール、共通のネーミングを使ったこの商品名は次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 2, "sub": "", "q": "「運上屋」の説明として正しいのは、次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 3, "sub": "", "q": "鰊で作られた肥料は「金肥」とよばれていました。その説明で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 8, "sub": "", "q": "江戸時代後期から明治、大正にかけて「全道無比の鰊漁場」といわれたのは次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 9, "sub": "", "q": "鰊番屋の説明で正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 10, "sub": "", "q": "次の文章の（　）内には祝津の3大漁家名の一つが当てはまります。その漁家名は何というでしょうか。山形県遊佐町出身で、江戸時代から祝津に出稼ぎし、明治になって祝津に居を構えました。（　）家は明治20年代には祝津、高島地区の総建網数102統のうち（　）家所有は16統を数えるほどになりました。", "a": "青山家"}, {"exam": 14, "no": 12, "sub": "A", "q": "（　）内に該当する語句を選びなさい。鰊漁の建網は明治21年には全道で2,700統を超え、後志地方が（　A　）と圧倒的に多く、中でも忍路の西川家は各地に（　B　）を持って全道でもトップクラスの漁家でした。", "a": "1"}, {"exam": 14, "no": 12, "sub": "B", "q": "（　）内に該当する語句を選びなさい。鰊漁の建網は明治21年には全道で2,700統を超え、後志地方が（　A　）と圧倒的に多く、中でも忍路の西川家は各地に（　B　）を持って全道でもトップクラスの漁家でした。", "a": "3"}, {"exam": 14, "no": 13, "sub": "A", "q": "（　）の中に該当する数字を書きなさい。統計資料によると北海道全体の鰊漁獲高で最高値は明治（　A　）年の約129万石、小樽での鰊漁獲高の最高値は大正（　B　）年の約7万5千石でした。", "a": "30"}, {"exam": 14, "no": 13, "sub": "B", "q": "（　）の中に該当する数字を書きなさい。統計資料によると北海道全体の鰊漁獲高で最高値は明治（　A　）年の約129万石、小樽での鰊漁獲高の最高値は大正（　B　）年の約7万5千石でした。", "a": "14"}, {"exam": 14, "no": 14, "sub": "", "q": "鰊魚肥の需要は明治以降も続きましたが、漁獲量が不安定な時代を迎えると、鰊魚肥の優位性がおびやかされることになりました。その理由は次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 15, "sub": "", "q": "明治以降の鰊漁には、本州から多くの出稼ぎがやってきました。明治21年、小樽では約6千人の雇い漁夫がいましたが、そのなかで小樽以外から来た漁夫で多かった地域は次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 16, "sub": "", "q": "沖揚げ音頭のなかの通称「ソーラン節」は鰊漁のどの場面で唄うのでしょうか。次のなかで当てはまるのはどれでしょうか。", "a": "3"}, {"exam": 14, "no": 17, "sub": "", "q": "小樽の鰊漁は鰊製品が集まるだけでなく、漁網やわら製品、漁具を扱う商人も多くいました。次の商人のなかでこれらを扱っていたのはどれでしょうか。", "a": "2"}, {"exam": 14, "no": 62, "sub": "", "q": "小樽祝津には鰊漁場建築が残っています。そのなかで、平成22年に修復され、夏期には公開されている番屋があります。その名称を書きなさい。", "a": "茨木家中出張番屋"}, {"exam": 15, "no": 7, "sub": "", "q": "明治から大正時代の北海道日本海沿岸における鰊漁の漁期は次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 8, "sub": "", "q": "江戸時代中頃から幕末にかけての鰊漁は大型網の導入により漁獲量は大きく伸びました。この網を導入したのは次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 11, "sub": "", "q": "祝津には鰊漁の遺構として有名な番屋が3棟現存しています。近江家番屋、白鳥家番屋、もう一つは、夏期にたなげ会が中心となって一般公開している復元された番屋です。その名称は何というでしょうか。", "a": "茨木家中出張番屋"}, {"exam": 15, "no": 12, "sub": "A", "q": "（　）内の該当する語句を選びなさい。番屋の語源は、江戸時代、（　A　）が拠点とした運上屋から派遣された（　B　）が、漁を行なったり漁民を監視した小屋「番家」です。", "a": "3"}, {"exam": 15, "no": 12, "sub": "B", "q": "（　）内の該当する語句を選びなさい。番屋の語源は、江戸時代、（　A　）が拠点とした運上屋から派遣された（　B　）が、漁を行なったり漁民を監視した小屋「番家」です。", "a": "1"}, {"exam": 15, "no": 13, "sub": "", "q": "鰊漁の親方と出身地の組合せで間違っているのは次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 14, "sub": "", "q": "鰊漁の建網の数や組織を数える際はどのような呼び方をするでしょうか。次の中から選びなさい。", "a": "4"}, {"exam": 15, "no": 15, "sub": "", "q": "次の文中の（　）に当てはまる数字を記入しなさい。鰊の漁獲高は「石」で表していました。1石とは、乾燥した製品150kgを作るのに必要な生鰊、約（　）kgです。", "a": "750"}, {"exam": 15, "no": 16, "sub": "A", "q": "次の文章は、小樽の鰊漁獲高について表しています。（　）内に該当する語句を選びなさい。小樽の漁獲高について、明治以降の大まかな傾向でいえば、明治（　A　）代は好調、明治（　B　）代は若干低調、大正時代は再び好調となりましたが、豊凶の波が激しくなりました。", "a": "2"}, {"exam": 15, "no": 16, "sub": "B", "q": "次の文章は、小樽の鰊漁獲高について表しています。（　）内に該当する語句を選びなさい。小樽の漁獲高について、明治以降の大まかな傾向でいえば、明治（　A　）代は好調、明治（　B　）代は若干低調、大正時代は再び好調となりましたが、豊凶の波が激しくなりました。", "a": "3"}, {"exam": 15, "no": 17, "sub": "", "q": "次の文の空欄に当てはまるのはどれでしょうか。明治21年、小樽の鰊漁では多数の漁夫が雇われ、その多くは青森、秋田出身の人たちでした。その数はおよそ次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 85, "sub": "", "q": "小樽商工会議所では地域経済活性化のため1・2次産業プロジェクトを立ち上げ、水産分野としては小樽の歴史と関わりのある鰊の加工品を開発、販売されています。複数の水産加工業者が同じルールのもと、にしん小樽漬という同じブランド名で製品化していますが、このルールで違うものは次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 89, "sub": "", "q": "次の文化財で、道指定有形文化財はどれでしょうか。", "a": "1"}, {"exam": 16, "no": 7, "sub": "", "q": "鰊漁期中に海が白くなる「くき」という現象がありますが、それはどのような現象でしょうか。正しいもの次から選びなさい。", "a": "3"}, {"exam": 16, "no": 8, "sub": "", "q": "明治3年から昭和29年までの鰊漁獲量の統計で、北海道全体で129万石を記録した年は次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 10, "sub": "", "q": "（　）内に該当する語句を書きなさい。番屋とは親方家族の住居部分と漁夫らの生活空間が建物のほぼ中央で（　）によって分けられたもの。", "a": "土間またはニワ"}, {"exam": 16, "no": 11, "sub": "A", "q": "次の文章は祝津の3大漁家青山家の説明です。（　）内に該当する語句を書きなさい。青山家は山形県（　A　）町に生まれた青山留吉が江戸時代から祝津に出稼ぎし明治になって同地に居を構えた。明治20年代には祝津、高島地区の総建網数102統のうち青山家所有のものが（　B　）を数えるまでになった。", "a": "遊佐"}, {"exam": 16, "no": 11, "sub": "B", "q": "次の文章は祝津の3大漁家青山家の説明です。（　）内に該当する語句を書きなさい。青山家は山形県（　A　）町に生まれた青山留吉が江戸時代から祝津に出稼ぎし明治になって同地に居を構えた。明治20年代には祝津、高島地区の総建網数102統のうち青山家所有のものが（　B　）を数えるまでになった。", "a": "16"}, {"exam": 16, "no": 13, "sub": "", "q": "鰊漁の雇い漁夫に関する次の文章のカッコに入る地域名を記入しなさい。明治20年代に雇われた漁夫数は北海道全体で9万人を超え、そのうち約6万人は他府県でした。そのおもな出身地は南部、（　）、秋田、庄内地方出身の人々でした。", "a": "津軽"}, {"exam": 16, "no": 14, "sub": "", "q": "鰊漁での沖揚げ音頭の「沖揚げ」とはどのような作業のことでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 16, "no": 15, "sub": "", "q": "通称ソーラン節とは次のどの作業の際に唄ったものでしょうか。", "a": "3"}, {"exam": 16, "no": 16, "sub": "", "q": "鰊漁での小樽の強みとして、小樽の鰊漁家が遠隔地にも漁場を経営できた理由で、最も適切なのは次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 17, "sub": "", "q": "江戸時代後半から鰊は肥料として支えられてきましたが、魚肥としての需要は次第に衰退していきました。その理由と関係ないのは次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 61, "sub": "", "q": "平磯岬の銀鱗荘が移築された経緯として正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 89, "sub": "", "q": "次の小樽市内の文化財で、国指定、道指定、市指定の順番（左から）で並んでいるのはどれでしょうか。", "a": "2"}, {"exam": 16, "no": 90, "sub": "", "q": "次の無形文化財のなかで、市指定無形文化財ではないのはどれでしょうか。", "a": "4"}, {"exam": 17, "no": 1, "sub": "", "q": "江戸時代後期のオタルナイ場所では請負商人が場所を管理するため、運上屋という拠点を設けました。オタルナイ場所の運上屋があった所は、現在のどこでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 17, "no": 8, "sub": "", "q": "（　）内2ヶ所に共通する語句を書きなさい。北海道における鰊漁は江戸時代に入ると（　）、松前地方で行われていました。その後この地域が不漁になると鰊を追って蝦夷地へと向かい、（　）は西蝦夷地への出漁拠点となりました。", "a": "江差"}, {"exam": 17, "no": 9, "sub": "", "q": "江戸時代の鰊漁において松前藩は幕府から許された商場または場所とよばれるところを設置していました。この商場または場所とは何をしたところでしょうか。", "a": "3"}, {"exam": 17, "no": 10, "sub": "", "q": "祝津には鰊漁の遺構として番屋が3棟現存しています。その中で中出張番屋と呼ばれ夏に一般公開している番屋の漁家名を書きなさい。", "a": "茨木家"}, {"exam": 17, "no": 11, "sub": "", "q": "鰊番屋の説明で正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 13, "sub": "A", "q": "（　）内に該当する語句を選びなさい。鰊漁の建網は明治21(1888)年には全道で2,700統を超え、（　A　）地方が1452統と圧倒的に多く、中でも（　B　）家は各地に40統余を持って全道でもトップクラスの漁家でした。", "a": "3"}, {"exam": 17, "no": 13, "sub": "B", "q": "（　）内に該当する語句を選びなさい。鰊漁の建網は明治21(1888)年には全道で2,700統を超え、（　A　）地方が1452統と圧倒的に多く、中でも（　B　）家は各地に40統余を持って全道でもトップクラスの漁家でした。", "a": "2"}, {"exam": 17, "no": 14, "sub": "", "q": "鰊漁の小樽での最高漁獲高は大正14(1925)年に記録します。その漁獲高は次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 15, "sub": "", "q": "次の文の（　）内に当てはまるのはどれでしょうか。明治20年代、北海道全体で約9万人の漁夫が雇われ、そのうち（　）人が道外から雇われました。その多くは南部、津軽、秋田、庄内地方出身の人たちでした。", "a": "4"}, {"exam": 17, "no": 16, "sub": "", "q": "沖揚げ音頭の説明として正しいは次のどれでしょうか。次の中から選びなさい。", "a": "4"}, {"exam": 17, "no": 17, "sub": "", "q": "江戸時代後半から鰊は肥料の搾粕（〆粕）として流通しました。その作り方で正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 89, "sub": "", "q": "平成22(2010)年9月に国の登録有形文化財に登録された建物で、鰊漁の親方の別荘として建てられました。小樽市内にあるこの建物名は何というでしょうか。", "a": "旧青山別邸"}, {"exam": 18, "no": 6, "sub": "", "q": "北海道開拓において、お雇い外国人たちは今日につながる数々の技術指導や提案をしてくれました。次の中で、お雇い外国人の技術と関連のないものはどれでしょうか。", "a": "3"}, {"exam": 18, "no": 8, "sub": "", "q": "明治から大正時代の北海道日本海沿岸における鰊漁の漁期は次のどれでしょうか。", "a": "2"}, {"exam": 18, "no": 9, "sub": "", "q": "江戸時代中頃から幕末にかけての鰊漁は近江商人により、漁獲量は大きく伸びました。近江商人がしたことは次のどれでしょうか。", "a": "1"}, {"exam": 18, "no": 10, "sub": "", "q": "祝津パノラマ展望台には北海道を代表する民謡の碑があります。その民謡とは次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 14, "sub": "", "q": "次の文章の空欄に入る語句を書きなさい。「鰊漁の建網は明治21（1888）年には全道で2,700統を越え、後志地方が1,452統と圧倒的に多かった。忍路の西川家は各地に（　）統余を持って全道でもトップクラスの漁家だった」", "a": "40"}, {"exam": 18, "no": 15, "sub": "", "q": "次の文章は、小樽の鰊漁獲高について表しています。（　）内に該当するものを選びなさい。「小樽の漁獲高について、明治以降の大まかな傾向でいえば、明治20年代は好調、明治30年代は若干低調、大正時代は再び好調となりましたが、小樽での鰊漁獲高の最高は大正14年の約（　）石でした。」", "a": "3"}, {"exam": 18, "no": 16, "sub": "", "q": "次の文章は鰊漁の作業で唄われる沖揚げの「うた」の一つです。該当するものを選びなさい。「この唄は汲船に乗り込んだ船頭の他、10名ほどで唄うもので、枠網の中に大タモを差し入れて鰊を汲船へ汲み上げる際に唄いました」", "a": "2"}, {"exam": 18, "no": 17, "sub": "", "q": "鰊の肥料としての需要は明治以降も続きましたが、漁獲量が不安定な時代を迎えると、鰊魚肥の優位性がおびやかされることになりました。その理由で間違っているのは次のどれでしょうか。", "a": "3"}, {"exam": 18, "no": 87, "sub": "", "q": "次の文章に当てはまる後志管内の町村名を書きなさい。「後志管内沿岸には小樽同様、かつて鰊漁で栄えたまちがあります。そのなかの一つのまちは国道229号沿いにあり、自然では弁慶の刀掛岩、施設には荒井記念美術館などがあります。また、おもな特産品の一つとして身欠き鰊製品があります。」", "a": "岩内町"}, {"exam": 19, "no": 8, "sub": "", "q": "次の文章の（　）内に該当する語句を書きなさい。江戸時代中頃には北海道の産物として鰊製品が注目され、北前船の日本海航路が整備されると（　）らによる大型網の導入によって、幕末にかけて漁獲量は大きく伸びました。", "a": "近江商人"}, {"exam": 19, "no": 9, "sub": "", "q": "問8の時代、人々が鰊を求めたのは本州、とくに西日本でした。その大きな理由は次のどれでしょうか。", "a": "1"}, {"exam": 19, "no": 11, "sub": "", "q": "次の文章は番屋の語源です。（　）内に当てはまる語句を書きなさい。「場所請負人が拠点とした運上屋から派遣された番人が、漁を行なったり（　）を監視した小屋を「番屋」という」", "a": "漁民"}, {"exam": 19, "no": 14, "sub": "", "q": "鰊漁の小樽での最高漁獲高は約7万5,000石です。この漁獲高を記録したのは次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 15, "sub": "", "q": "食用の生鰊の呼び方として正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 19, "no": 16, "sub": "", "q": "鰊漁が始まる前、事前の準備がすべて終わると、豊漁を願い、恒例の大宴会が行なわれました。この宴会のことを何というでしょうか。", "a": "網下し"}, {"exam": 19, "no": 17, "sub": "", "q": "小樽の鰊漁家が遠隔地にも漁場を経営できた理由で正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 19, "no": 19, "sub": "", "q": "江戸期と異なり明治以後、小樽に寄港した北前船の利益のもとになったのは次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 26, "sub": "", "q": "北前船が段々と衰退していった理由として間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 19, "no": 64, "sub": "", "q": "今ではすっかり有名となりました於古発川沿いの「小樽寿司屋通り」ですが、昭和62（1987）年、有志による活動により「小樽寿司屋通り会」が誕生し、その後、現在の「小樽寿司屋通り」に発展しました。そのきっかけとなった供養祭は次のどれでしょうか。", "a": "2"}, {"exam": 19, "no": 88, "sub": "", "q": "現在、小樽市内の清酒酒造会社は1社ですが、その1社の主要銘柄は次のどれでしょうか。", "a": "1"}, {"exam": 19, "no": 89, "sub": "", "q": "次の小樽市内の文化財で、国指定、道指定、市指定の順番（左から）で正しいのはどれでしょうか。", "a": "2"}, {"exam": 20, "no": 7, "sub": "", "q": "昭和20年代〜30年代にかけて小樽は徐々に斜陽化し衰退していきました。そのおもな要因で間違いは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 8, "sub": "", "q": "鰊漁期中に雌が産卵したところに雄が白子を放出し、海が白くなるという現象がありますが、それを何というでしょうか。", "a": "群来"}, {"exam": 20, "no": 11, "sub": "", "q": "鰊漁期中に漁夫らが寝泊まりしたのが番屋ですが、祝津には鰊漁の遺構として有名な番屋が現存しています。その中で毎年一般公開されている番屋があります。それは次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 12, "sub": "", "q": "鰊漁の親方と出身地の組合せで正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 20, "no": 13, "sub": "", "q": "高島岬に建つ鰊御殿（旧田中家）は昭和33（1958）年、小樽にあった会社の創立70周年記念事業の一つとして移築したものです。その会社名を書きなさい。", "a": "北海道炭礦汽船㈱"}, {"exam": 20, "no": 14, "sub": "", "q": "次の文中の（　）に当てはまる数字を記入しなさい。鰊の漁獲高は「石」で表していました。1石とは、乾燥した製品40貫（150kg）を作るのに必要な生鰊、約（　）kgのことです。", "a": "750"}, {"exam": 20, "no": 15, "sub": "A", "q": "次の文章は、小樽の鰊漁獲高について表しています。（　）内に該当する語句を選びなさい。小樽の漁獲高について、明治以降の大まかな傾向でいえば、明治20年代は（　A　）、明治30年代は（　B　）、大正時代は再び好調となりましたが、豊凶の波が激しくなりました。", "a": "1"}, {"exam": 20, "no": 15, "sub": "B", "q": "次の文章は、小樽の鰊漁獲高について表しています。（　）内に該当する語句を選びなさい。小樽の漁獲高について、明治以降の大まかな傾向でいえば、明治20年代は（　A　）、明治30年代は（　B　）、大正時代は再び好調となりましたが、豊凶の波が激しくなりました。", "a": "4"}, {"exam": 20, "no": 16, "sub": "", "q": "明治21(1888)年、小樽の鰊漁では東北地方からの漁夫が雇われ、その多くは青森、秋田出身の人たちでした。その数はおよそ次のどれでしょうか。", "a": "2"}, {"exam": 20, "no": 17, "sub": "", "q": "沖揚げ音頭のなかで、通称ソーラン節といわれているのは次のどの作業の際に唄ったものでしょうか。", "a": "4"}, {"exam": 20, "no": 88, "sub": "", "q": "次の文章に当てはまる後志管内の町村名を書きなさい。「漁業と水産加工が盛んな町で、かつては鰊漁で栄えました。近年は「風」の町として風力発電の風車が海岸に建ち並んでいます。町のキャラクター「風太」をよく見かける町です。」", "a": "寿都町"}, {"exam": 20, "no": 89, "sub": "", "q": "次の小樽市内の文化財で、組み合わせが正しいのはどれでしょうか。", "a": "3"}, {"exam": 21, "no": 8, "sub": "", "q": "江戸時代中頃から幕末にかけての鰊漁は北前船の日本海航路による本州への供給増や大型網の導入により漁獲量は大きく伸びました。この大型網を導入したのは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 9, "sub": "", "q": "北海道の鰊漁を代表する民謡の碑が祝津パノラマ展望台にあります。この民謡名は何というでしょうか。", "a": "江差追分"}, {"exam": 21, "no": 10, "sub": "", "q": "江戸時代の鰊漁において松前藩は幕府から許された商場または場所とよばれるところを設置していました。この商場または場所とは何をしたところでしょうか。", "a": "3"}, {"exam": 21, "no": 11, "sub": "", "q": "祝津には鰊漁の遺構として番屋が現存しています。茨城家中出張番屋、白鳥家番屋、もう一つは、鰊御殿（旧田中家）へ向かう坂の登り口にある番屋です。その名称は何というでしょうか。", "a": "近江家番屋"}, {"exam": 21, "no": 12, "sub": "", "q": "明治時代の初め、小樽の桃内産軟石は鰊漁に関わるものにも使われました。番屋建築の基礎にも使われましたが、建築以外にも使われました。それは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 13, "sub": "", "q": "鰊漁の建網の数や組織を数える際はどのような呼び方をするでしょうか。漢字一文字を書きなさい", "a": "統"}, {"exam": 21, "no": 14, "sub": "", "q": "文中の（　）に当てはまる語句を記入しなさい。写真は祝津の鰊漁家（　）家の番屋です。現在は北海道開拓の村に移築されています。", "a": "青山"}, {"exam": 21, "no": 15, "sub": "", "q": "鰊番屋の説明で正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 16, "sub": "", "q": "鰊漁では漁獲高を「石」で表していました。この単位の説明で正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 17, "sub": "", "q": "沖揚げ音頭の説明として間違っているのは次のどれでしょうか。次の中から選びなさい。", "a": "4"}, {"exam": 21, "no": 88, "sub": "", "q": "次の文章に当てはまる後志管内の町村名を書きなさい。「後志管内で一番人口の少ない自治体です。かつては鰊漁で栄えた漁村で、今もその名残りである袋澗も国道沿いに残っています。また、窓岩や西の河原など景勝豊かな海岸が続きます。」", "a": "神恵内村"}, {"exam": 21, "no": 91, "sub": "", "q": "次の無形文化財のなかで国指定重要無形民俗文化財に指定されているのはどれでしょうか。", "a": "4"}, {"exam": 22, "no": 8, "sub": "", "q": "江戸時代、北海道日本海側の鰊漁で「全道無比の鰊漁場」と云われたのは、次のどれでしょうか。", "a": "3"}, {"exam": 22, "no": 9, "sub": "", "q": "鰊漁の場所を説明している文です。どこの場所のことでしょうか。幕末には近江商人の恵比須屋岡田家が請け負っていた場所で、拠点としていた運上屋はクッタルウシにありました。", "a": "オタルナイ場所"}, {"exam": 22, "no": 10, "sub": "", "q": "祝津には鰊漁の遺構として番屋が現存しています。夏の期間、一般公開している「中出張番屋」は何という漁家の番屋でしょうか。漁家名を書きなさい。", "a": "茨木家"}, {"exam": 22, "no": 12, "sub": "", "q": "明治3（1870）年から昭和29（1954）年までの鰊漁獲量の統計で、北海道全体で最大漁獲量を記録したのは明治30（1897）年です。その漁獲量は次のどれでしょうか。（千以下、切捨て）", "a": "3"}, {"exam": 22, "no": 13, "sub": "", "q": "明治21（1888）年、鰊漁の建網数は全道で約2,700統ありました。そのなかでも全道トップクラスの40統余を所有していた漁家は次のどれでしょうか。", "a": "2"}, {"exam": 22, "no": 14, "sub": "", "q": "次の写真は祝津にある鰊漁家の番屋です。漁家名を書きなさい。", "a": "白鳥家"}, {"exam": 22, "no": 15, "sub": "", "q": "次の鰊漁場の用語と（　）内の用語の意味の組み合わせで間違っているのはどれでしょうか。", "a": "4"}, {"exam": 22, "no": 16, "sub": "", "q": "明治21（1888）年、小樽の鰊漁では約6,000人の漁夫が雇われました。おもな出身県は次のどれでしょうか。", "a": "1"}, {"exam": 22, "no": 17, "sub": "", "q": "鰊漁の沖揚げ音頭は作業ごとに唄があります。次の作業の唄は何というでしょうか。網おこしの唄に続いて唄います。枠網の中に魚群を落とし込む、最も力を込める作業の時の唄です。", "a": "木遣り音頭"}, {"exam": 22, "no": 24, "sub": "", "q": "北前船が段々と衰退していった理由として間違っているのは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 74, "sub": "", "q": "令和7（2025）年2月4日、小樽市は地域型日本遺産に認定されました。そのストーリーは「北海道の『心臓』と呼ばれたまち・小樽〜「●の力」で創られ蘇った北の商都」です。●に当てはまる語句は次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 82, "sub": "", "q": "小樽商工会議所では農業、水産業の2分野で付加価値の高い商品開発を行い、生産者と加工業者、販売者を一体化させた取組みを行っています。小樽をイメージする一つのブランドを複数の企業で育てる仕組みで、現在2つのブランドが登場しています。一つは「にしん小樽漬」、もう一つのブランド名は何というでしょうか。", "a": "小樽美人"}, {"exam": 22, "no": 91, "sub": "", "q": "次の小樽市内の文化財で、国指定、道指定、市指定の順番（左から右へ）で並んでいるのはどれでしょうか。", "a": "3"}, {"exam": 23, "no": 2, "sub": "", "q": "小樽が「村並」になった時代、定住者が増えていったおもな理由は次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 7, "sub": "", "q": "鰊漁期中に雌が産卵したところに雄が白子を放出し、海が白くなるという現象がありますが、その現象を表した正しい漢字は次のどれでしょうか。", "a": "4"}, {"exam": 23, "no": 8, "sub": "", "q": "江戸時代、江差、松前で行われていた鰊漁はそれらの地域が不漁になると、鰊を追った人々は享保年間には近場所まで、その後中場所まで出漁が許可されました。この鰊を追った人々のことを何というでしょうか。次の中から選びなさい。", "a": "4"}, {"exam": 23, "no": 9, "sub": "", "q": "鰊漁の場所の範囲を説明している文です。正しいのはどれでしょうか。", "a": "2"}, {"exam": 23, "no": 10, "sub": "", "q": "明治20年代、祝津、高島地区の総建網数102統のうち、16統を所有する漁家がいました。この漁家名を書きなさい。", "a": "青山家"}, {"exam": 23, "no": 11, "sub": "", "q": "祝津に現在も残っている鰊漁で有名な親方の住居です。この漁家名は何というでしょうか。", "a": "茨木家"}, {"exam": 23, "no": 12, "sub": "", "q": "余市町から昭和13(1938)年に小樽の平磯岬に移築された、猪伺安之丞が明治後期に建てた鰊漁家建築は令和5(2023)年2月、文化財に登録されました。その指定・区分は次のどれでしょうか。", "a": "4"}, {"exam": 23, "no": 13, "sub": "", "q": "小樽（忍路除く）の鰊漁獲量の最高値は大正14(1925)年です。この年の漁獲量は次のどれでしょうか。", "a": "3"}, {"exam": 23, "no": 14, "sub": "", "q": "鰊漁の雇い漁夫に関する次の文章のカッコに入る地域名を記入しなさい。明治20年代に雇われた漁夫数は北海道全体で9万人を超え、そのうち約6万人は他府県でした。そのおもな出身地は南部、津軽、（ ）、庄内地方出身の人々でした。", "a": "秋田"}, {"exam": 23, "no": 15, "sub": "", "q": "食用の生鰊の呼び方として正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 23, "no": 16, "sub": "", "q": "鰊漁における「沖揚げ」とはどのようなことをいうのでしょうか。次の中から選びなさい。", "a": "4"}, {"exam": 23, "no": 17, "sub": "", "q": "江戸時代後半から続いた鰊漁は肥料として大きな商売となっていましたが、段々と肥料としての需要は次第に衰退していきました。その理由と関係ないのは次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 18, "sub": "", "q": "鰊漁では作業のときに唄われる「うた」があります。次の作業で唄われる音頭名を書きなさい。「綱の目をふさぐほど産み付けられた卵を綱から落とすときに浜辺で唄いました。」", "a": "子はたき音頭"}], "北前船と海運": [{"exam": 1, "no": 5, "sub": "", "q": "江戸後期から明治後期くらいまで小樽に来た商人は上り荷（大阪へ運ぶ荷物）に〆粕・昆布・イリコ・ホシアワビなどを積んで船で運びましたが、その船のことを何と呼びますか。", "a": "3"}, {"exam": 1, "no": 26, "sub": "", "q": "北前船主が建てた倉庫で現在の運河沿いにないのは次のうちどれですか。", "a": "2"}, {"exam": 1, "no": 27, "sub": "", "q": "北前船ビジネスを小樽で開花させたのは次のうち、どの商人ですか。", "a": "3"}, {"exam": 1, "no": 28, "sub": "", "q": "石川県加賀市瀬越町では、町に多くの寄付をしてきた二人の北前船主を「両家様」と呼び尊敬してきましたが、二人とも小樽に倉庫を建てています。それは大家七平ともう一人は誰ですか。", "a": "4"}, {"exam": 1, "no": 30, "sub": "", "q": "北前船主は独自の「印（しるし）」を掲げていましたが、中でもユニークな「一膳箸（いちぜんばし）」と呼ばれる印はどの商人でしたか。", "a": "2"}, {"exam": 1, "no": 31, "sub": "", "q": "北前船ビジネスが下降線をたどり始めると、北前船主たちは別のビジネスに切り替えていきました。最も多く転換したビジネスはどれですか。", "a": "4"}, {"exam": 1, "no": 33, "sub": "", "q": "北前船商法の特長は次のどれですか。", "a": "4"}, {"exam": 2, "no": 18, "sub": "", "q": "小樽観光の特徴である歴史的環境のいしずえとなったのは「北前船」の活躍でした。この船を何と読みますか。", "a": "きたまえぶね"}, {"exam": 2, "no": 19, "sub": "", "q": "北前船は弁財船の一種で、大阪〜蝦夷間で交易した西海路でしたが、大阪〜江戸間で交易した南海路で活躍した弁財船には樽廻船と何でしたか。", "a": "3"}, {"exam": 2, "no": 20, "sub": "", "q": "北前船は近江商法を学んで、単なる「運賃積み」ではなく、寄港地で仕入れ・販売を行うユニークな商法を開発しましたが、この商法を何といいますか。", "a": "買い積み"}, {"exam": 2, "no": 21, "sub": "", "q": "北前船の上り荷は、当時の北海道の資源でしたが、次の内上り荷として違うのはどれですか。", "a": "4"}, {"exam": 2, "no": 22, "sub": "", "q": "小樽に倉庫を建てた最初のビジネスは北前船で、積荷を短期間に売り尽くせない場合もあるので、保管を目的に倉庫を建てました。この業務をなんといいましたか。", "a": "1"}, {"exam": 2, "no": 24, "sub": "", "q": "現在の運河プラザや小樽市総合博物館運河館が入居している旧小樽倉庫を建てた北前船主は誰ですか。", "a": "3"}, {"exam": 3, "no": 17, "sub": "", "q": "北前船の航路として正しいのは次のどれですか。", "a": "4"}, {"exam": 3, "no": 18, "sub": "", "q": "北前船主が蝦夷地で仕入れた主な産品は何ですか。", "a": "3"}, {"exam": 3, "no": 19, "sub": "", "q": "北前船の積荷で、下り荷として違うのは次のどれですか。", "a": "4"}, {"exam": 3, "no": 20, "sub": "", "q": "北前船主は積荷を短期間に売り尽くせない場合もあるので、小樽に倉庫を建て荷を保管しました。この業務をなんといいましたか。", "a": "1"}, {"exam": 3, "no": 24, "sub": "", "q": "石造倉庫は北前船主が建てたことがはじまりといわれています。次の写真で「大家倉庫」はどれですか。", "a": "2"}, {"exam": 3, "no": 25, "sub": "", "q": "北前船ビジネスでは、前もって積荷を宣伝するために今日のような大阪でいう「ちらし」を寄港予定地にばらまきました。この媒体の別名で江戸ではなんといっていましたか。", "a": "1"}, {"exam": 4, "no": 18, "sub": "", "q": "江戸中期から明治後期くらいまで小樽に来た商人は上り荷（大阪へ運ぶ荷物）に〆粕・昆布・イリコ・ホシアワビなどを積んで船で運びながら商いをしましたが、その船のことを何と呼んだでしょうか。", "a": "3"}, {"exam": 4, "no": 20, "sub": "", "q": "北前船は菱垣廻船や樽廻船のように「運賃積み」ではなく、各地で買い集めたものを高く売れる土地へ運んで売るという手法で航海しました。このことを何といいますか。", "a": "買い積み"}, {"exam": 4, "no": 21, "sub": "", "q": "北陸地方の北前船の船乗り達には「切出し」や「帆待ち」と呼ばれたビジネスがあり、得たお金を蓄えていきました。その意味は次のどれでしょうか。", "a": "2"}, {"exam": 4, "no": 24, "sub": "", "q": "現在の堺町通りにある「おたる瑠璃工房」は加賀出身の北前船主の商店事務所でした。この北前船主の名前は何といいますか。", "a": "広海二三郎"}, {"exam": 5, "no": 20, "sub": "", "q": "北前船は菱垣廻船や樽廻船のように運搬目的だけではなく、経済的に優れた手法用い、その結果多くの有力船主を排出しました。その手法とは次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 21, "sub": "", "q": "次の文中の「　」に当てはまる語句を記入しなさい。北陸地方の北前船の船頭には、「積荷の約1割を自由に売買でき、自分の収入にできる」抜け道が用意されていました。これを「　」と呼ばれました。", "a": "帆待ち、または切出し"}, {"exam": 5, "no": 23, "sub": "", "q": "北前船主達は、積荷を常に短期間に売り尽くせない場合もあるので、荷物保管を目的に倉庫を建てました。この業務をなんといいましたか。", "a": "1"}, {"exam": 5, "no": 25, "sub": "", "q": "次の北前船主と出身地の組み合わせで正しくないのはどれでしょうか。", "a": "3"}, {"exam": 5, "no": 26, "sub": "", "q": "次の文章はある北前船主を説明しています。その人物名を書きなさい。明治29年、逓信省の命でシベリア諸港との航路を開きました。そして北前船衰亡後は、日本火災海上保険株式会社を創設し取締役に就任し、大阪瓦斯の取締役にもなりました。現在、運河沿いにこの商人の大きな倉庫が残っていて、ヤマシチの印が目につきます。", "a": "大家七平"}, {"exam": 6, "no": 18, "sub": "", "q": "北前船の航路として正しいのは次のどれですか。", "a": "2"}, {"exam": 6, "no": 19, "sub": "", "q": "北前船は菱垣廻船や樽廻船のように運搬目的だけではなく、経済的に優れた手法を用い、その結果多くの有力船主を輩出しました。次の文中の（　）内に当てはまる語句を記入しなさい。「運賃積み」ではなく（　）という方法で各地の安い物を仕入れ、有利な土地に運び高く売りながら航海した。", "a": "「買い積み」"}, {"exam": 6, "no": 20, "sub": "", "q": "次の文中の（　）内に当てはまる語句を記入しなさい。北陸地方の北前船の船乗り達は危険が多く、給料は少なかったのですが、「積荷の約（　）を自由に売買でき、自分の収入にできる」抜け道が用意され、これを貯えて独立していきました。これは「帆待ち、または切出し」と呼ばれました。", "a": "1割"}, {"exam": 6, "no": 21, "sub": "", "q": "慶長14年諸大名に対する大船禁止、天保13年三檣禁止令が出されます。これは北前船に対する何を一番危惧したものだったのでしょうか。", "a": "3"}, {"exam": 6, "no": 22, "sub": "", "q": "北前船は、航海において支払わなければならない費用がありました。「直払いの口」「かまどの口」「足道具口」「雑道具口」「作事の口」などを総称して何と呼ばれたでしょうか。", "a": "雑用金（ぞうよきん）"}, {"exam": 6, "no": 23, "sub": "", "q": "小樽には「小樽商人」の出身地による俗諺「肥料加賀」の説明で（　）内に該当する語句はどれでしょうか。「肥料加賀」とは主に（　）に船乗りとして雇われていた北陸地方の人々が独立して北前船交易を盛んに行い、小樽の商業拠点を磐石なものにしていったことを意味します。", "a": "1"}, {"exam": 6, "no": 24, "sub": "", "q": "次の北前船主は誰でしょうか。加賀橋立で代々北前船を営む5代目で、小樽には明治22年に進出します。小樽倉庫の株主の一人で、後に「東洋一の回漕店」といわれるようになりました。さらに日本火災海上保険株式会社を創設し取締役に就任しています。", "a": "西谷庄八"}, {"exam": 6, "no": 25, "sub": "", "q": "北前船主が建てた倉庫で創建から100年を経ていない倉庫は次のどれでしょうか。（平成21年時点）", "a": "4"}, {"exam": 6, "no": 26, "sub": "", "q": "小樽運河北浜にある北前船主の旧右近倉庫の壁には「印」がついています。ユニークな読み方の印です。何と読むのでしょうか。", "a": "一膳箸（いちぜんばし）"}, {"exam": 7, "no": 18, "sub": "", "q": "江戸時代の北前船の航路として正しいのは次のどれですか。", "a": "2"}, {"exam": 7, "no": 19, "sub": "", "q": "北前船主が北海道で仕入れ、本州まで運んだ主なものは何だったでしょうか。", "a": "4"}, {"exam": 7, "no": 20, "sub": "", "q": "北前船の特長として正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 7, "no": 21, "sub": "", "q": "北前船主は、積荷を短期間に売り尽くせない場合もあるので、荷物の保管を目的に倉庫を建てました。この業務をなんといいましたか。", "a": "蔵敷業務"}, {"exam": 7, "no": 24, "sub": "", "q": "次の北前船主は誰でしょうか。加賀橋立出身で北前船主、西谷庄八とともに小樽倉庫を建設します。夜景で有名な函館山はかつてこの人物が所有していたともいわれております。姓・名両方を書きなさい。（姓のみ不可）", "a": "西出孫左衛門"}, {"exam": 7, "no": 25, "sub": "", "q": "北前船主、大家七平が建てた倉庫は今も運河沿いに残っております。越屋根の妻面に大きな印が掲げられていますが、その印の読みは何というでしょうか。", "a": "ヤマシチ"}, {"exam": 7, "no": 26, "sub": "", "q": "小樽運河北浜にある北前船主等の倉庫が3棟並んで残っています。運河に近い方から増田倉庫、広海倉庫です。最も総合博物館寄りの倉庫を建てた北前船主は次のどれでしょうか。", "a": "3"}, {"exam": 8, "no": 19, "sub": "", "q": "北前船主が北海道で仕入れた資源の内容です。（　）内に当てはまる語句を書きなさい。「人口が増大することにより西日本における米・綿・藍・菜種などの生産を促進させるために（　）が求められ、それに該当したのが北海道でふんだんにとれる鰊でした。」", "a": "魚肥"}, {"exam": 8, "no": 20, "sub": "", "q": "北前船の商売の手法を説明した文です。これを何といったでしょうか。「各地で買い集めた安い品物を有利な土地に運んで高く売るというもので、商売しながら航海する手法です。」", "a": "買い積み"}, {"exam": 8, "no": 21, "sub": "", "q": "次の文中の（　）内に当てはまる語句を書きなさい。「北陸地方の北前船の船乗り達は危険が多く、給料は少なかったのですが、「積荷の約1割を自由に売買でき、自分の収入にできる」抜け道が用意され、これを貯えて独立していきました。これは「切出しまたは（　）」と呼ばれました。」", "a": "帆待ち"}, {"exam": 8, "no": 22, "sub": "", "q": "北前船主達は、積荷を常に短期間に売り尽くせない場合もあるので、荷物保管を目的に倉庫を建てました。この業務を何といいましたか。", "a": "4"}, {"exam": 8, "no": 24, "sub": "", "q": "次の北前船主の名前と出身地の組み合わせで正しいのはどれでしょうか。", "a": "1"}, {"exam": 8, "no": 25, "sub": "", "q": "北前船主で住吉神社の大鳥居を寄進したのは、広海二三郎ともう一人は誰でしょうか。姓・名両方を書きなさい。", "a": "大家七平"}, {"exam": 8, "no": 26, "sub": "", "q": "明治27年、北前船主によって小樽倉庫が建てられ、屋根の上に鯱が掲げられました。その鯱にはどのような意味があるといわれているでしょうか。", "a": "2"}, {"exam": 9, "no": 18, "sub": "", "q": "北前船の説明として正しいのは、次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 19, "sub": "", "q": "北前船の商売の特長として正しいのは、次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 20, "sub": "", "q": "北前船の積荷で、上り荷のほとんどが蝦夷地の海産物でした。数の子、昆布、イリコ、ホシアワビの他に重要な産品がありました。それは何でしょうか。", "a": "鰊又は〆粕"}, {"exam": 9, "no": 21, "sub": "", "q": "次の写真は北前船主に関連する建物です。北前船主名を姓・名両方を書きなさい。（姓のみ不可）※北運河の北側に位置する建物です。", "a": "右近権左衛門"}, {"exam": 9, "no": 22, "sub": "", "q": "北前船主で、小樽市内の神社に大鳥居を寄進した人たちがいます。それはどこの神社でしょうか。", "a": "住吉神社"}, {"exam": 9, "no": 23, "sub": "", "q": "次の写真の建物に関連する北前船主で「東洋一の回漕店」といわれたのは誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "西谷庄八"}, {"exam": 9, "no": 24, "sub": "", "q": "問22で大鳥居を寄進した北前船主たちの出身地は次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 25, "sub": "", "q": "北前船がもたらした文化で、写真のように建物や船の帆、店の暖簾などに付けられた意匠のことを何というでしょうか。", "a": "印（しるし）"}, {"exam": 9, "no": 26, "sub": "", "q": "北前船ビジネスは約半年で様々な港につけて仕入れ販売を積み重ねていきましたが、いずれも短期決戦のため前もって今日のチラシの前身、「引札」を配布していました。その付加価値として、どんな工夫をしていたでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 10, "no": 19, "sub": "", "q": "北前船の航路として正しいのは次のどれですか。", "a": "4"}, {"exam": 10, "no": 20, "sub": "", "q": "北前船は近江商法を学んで、単なる「運賃積み」ではなく、寄港地で仕入れ・販売を行う商法でしたが、この商法をなんといいますか。", "a": "買い積み商法"}, {"exam": 10, "no": 21, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。北陸地方の北前船の船頭には、「（　）の約1割を自由に売買でき、自分の収入にできる」抜け道が用意されていました。これを「帆待ち、または切出し」と呼ばれました。", "a": "積荷"}, {"exam": 10, "no": 22, "sub": "", "q": "次の写真は堺町通りにある「おたる瑠璃工房」という店です。この建物に関係ある北前船主名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "広海二三郎"}, {"exam": 10, "no": 23, "sub": "", "q": "次の文と関係のある北前船主名（姓・名両方）を書きなさい。（姓のみ不可）明治後半、北前船衰亡以後、他の北前船主らと日本火災海上保険株式会社を創設し取締役に就任した。小樽運河北浜には、3棟連続した倉庫がありますが、一番総合博物館寄りに、一膳箸という印がついた大きな木骨石造倉庫があります。", "a": "右近権左衛門"}, {"exam": 10, "no": 24, "sub": "", "q": "次の北前船主と出身地の組み合わせで正しくないのはどれでしょうか。", "a": "2"}, {"exam": 10, "no": 25, "sub": "", "q": "北前船主達は、積荷を常に短期間に売り尽くせない場合もあるので、荷物保管を目的に倉庫を建て、人も雇用しました。この業務をなんといいましたか。", "a": "3"}, {"exam": 10, "no": 26, "sub": "", "q": "北前船主が建てた小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の屋根には鯱が上がっています。当時、寄港する船のランドマークともなっていたといわれてますが、もう一つ重要な意味がありました。それは次のどれでしょうか。", "a": "4"}, {"exam": 11, "no": 19, "sub": "", "q": "北前船の特徴として正しいのは次のどれですか。", "a": "2"}, {"exam
