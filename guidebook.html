<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<title>おたる案内人 公式ガイドブック</title>
<style>
:root { color-scheme: light dark; --bg:#f6f5f2; --fg:#1d1d1a; --panel:#fff;
  --line:#e2e1da; --muted:#6d6d64; --accent:#8a6d3b; --chip:#f1ece0; --hi:#ffe9a8; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#131316; --fg:#e9e9e4; --panel:#1c1c20; --line:#31313a;
    --muted:#98988f; --accent:#d8c79a; --chip:#33301f; --hi:#5b4d1f; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
button { font:inherit; cursor:pointer; border:1px solid var(--line);
  background:var(--panel); color:var(--fg); border-radius:.45rem; padding:.3rem .7rem; }
button:hover { border-color:var(--accent); }
button:disabled { opacity:.35; cursor:default; }
button.on { background:var(--accent); border-color:var(--accent); color:var(--panel); }

/* 上のバー */
#top { height:3.1rem; display:flex; align-items:center; gap:.5rem; padding:0 .8rem;
  background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:30; }
#top .title { font-weight:600; font-size:.92rem; margin-right:auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#top .title small { color:var(--muted); font-weight:400; font-size:.78rem; }
#where { font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums;
  white-space:nowrap; }
#jump { width:4.4rem; font:inherit; font-size:.85rem; padding:.25rem .4rem;
  border:1px solid var(--line); border-radius:.4rem; background:var(--bg); color:var(--fg);
  text-align:center; }

/* 読む場所 */
#reader { position:absolute; inset:3.1rem 0 0 0; }
#stage { position:absolute; inset:0; overflow:hidden; display:flex;
  align-items:center; justify-content:center; gap:.6rem; padding:.8rem .8rem 3.2rem; }
#stage img { max-width:100%; max-height:100%; object-fit:contain; display:block;
  border-radius:3px; box-shadow:0 2px 14px rgba(0,0,0,.14); background:#fff; }
#stage.two img { max-width:calc(50% - .3rem); }
/* 左右をクリック（タップ）でめくる */
.tap { position:absolute; top:0; bottom:3rem; width:22%; border:0; background:transparent;
  padding:0; border-radius:0; z-index:5; }
.tap:hover { background:linear-gradient(var(--dir), rgba(128,128,128,.10), transparent); }
.tap.prev { left:0; --dir:to right; }
.tap.next { right:0; --dir:to left; }
.tap span { position:absolute; top:50%; transform:translateY(-50%);
  font-size:1.7rem; color:var(--muted); opacity:0; transition:opacity .15s; }
.tap:hover span { opacity:.75; }
.tap.prev span { left:.7rem; } .tap.next span { right:.7rem; }

/* 下のバー */
#bottom { position:absolute; left:0; right:0; bottom:0; height:2.8rem;
  display:flex; align-items:center; gap:.6rem; padding:0 .8rem;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  border-top:1px solid var(--line); backdrop-filter:blur(6px); z-index:10; }
#slider { flex:1; accent-color:var(--accent); }

/* 目次・検索の引き出し */
#panel { width:21rem; max-width:84vw; background:var(--panel);
  border-right:1px solid var(--line); overflow-y:auto; padding:.8rem;
  position:absolute; inset:0 auto 0 0; transform:translateX(-101%);
  transition:transform .18s ease; z-index:25; }
#panel.open { transform:none; box-shadow:0 0 26px rgba(0,0,0,.16); }
#scrim { position:absolute; inset:0; background:rgba(0,0,0,.28); z-index:24;
  opacity:0; pointer-events:none; transition:opacity .18s; }
#scrim.on { opacity:1; pointer-events:auto; }
#panel .tabs { display:flex; gap:.3rem; margin-bottom:.7rem; }
.part { margin:1rem 0 .35rem; font-size:.72rem; font-weight:700; color:var(--accent);
  letter-spacing:.09em; }
.part:first-of-type { margin-top:0; }
.sec { display:flex; gap:.55rem; align-items:baseline; width:100%; text-align:left;
  border:0; background:transparent; padding:.42rem .5rem; border-radius:.4rem; }
.sec:hover { background:var(--chip); }
.sec.here { background:var(--chip); box-shadow:inset 2px 0 0 var(--accent); }
.sec .pg { color:var(--muted); font-size:.76rem; flex:0 0 3.1rem;
  font-variant-numeric:tabular-nums; }
.sec b { font-weight:600; }
.sec .kou { display:block; font-size:.74rem; color:var(--muted); line-height:1.55; }
#q { width:100%; font:inherit; font-size:.9rem; padding:.45rem .6rem; margin-bottom:.6rem;
  border:1px solid var(--line); border-radius:.4rem; background:var(--bg); color:var(--fg); }
.hit { display:block; width:100%; text-align:left; border:0; background:transparent;
  padding:.45rem .5rem; border-radius:.4rem; font-size:.82rem; line-height:1.6; }
.hit:hover { background:var(--chip); }
.hit .pg { color:var(--accent); font-weight:700; font-size:.76rem; }
.hit mark { background:var(--hi); color:inherit; }
.hit .near { font-size:.7rem; color:var(--muted); border:1px solid var(--line);
  border-radius:.25rem; padding:0 .25rem; }
.msg { color:var(--muted); font-size:.83rem; padding:.6rem .2rem; }
@media (max-width:44rem) { #top .title small { display:none; } #jump { display:none; } }
@media (max-width:30rem) { #top .title { font-size:.82rem; } }
</style></head><body>

<script>const DATA = {"pages": [{"seq": 1, "page": null, "img": "guidebook_pages/p001.webp", "t": "おたる案内人小樽観光大学校認定ENの基キントノック歴史・自然・行政・経済生活・周辺・おもてなし"}, {"seq": 2, "page": null, "img": "guidebook_pages/p002.webp", "t": "ごああいさつ今日の小樽は先人達のご苦労の上にできあがり、明日の小樽は、今生きている私たちが、汗をかきながら築いていく責務を担っています。現在の小樽は数十年前たは想像もしていなかった「観光都市」となり、さまざまな産業と共に「観光産業」が加わってきたことは、今小樽に生きる私たちに、大きな幸福をもたらしてくれています。また「観光」は経済ばかりでなく、「文化」にも大きな要因が含まれていますので、私たちにとって「生き甲斐」にもゃつながる大変重要な産業だと考えております。小樽が「観光元年」と調った昭和61(1986)年以来・、まだ多くの年月を経ていませんが、それだけに今しっかりと小樽観光百年の大計を共に築いていかなければ、せっかくの恩恵を無駄にしかねないと思います。いずれの時代やも歴史は「人」が築いてきました。したがって小樽観光の本質と内容と深さをしっかりと認識した人材を育て、世界中から迎え入れられるような「観光都市」にしていくことが、今の小樽にとって、最や重要なことだと考えています。このような考えから、平成15(2003)年6月6日に組織された「小様市地域経済活性化会議・人づくりワーキンググループ」において、議論・構想化された「小樽観光大学校構想」を受け、平成18(2006)年5月16日に「小樽観光大学校理事会」が産学官の連携によって設置され、\"和観光振興の人材育成」を目的とした機関『小樽観光大学校』が誕生しました。本校においては、この「検定試験公式テキストブック」を教材として講座を開講し、「おたる案内人」としての認定試験を実施いたします。テキストはもちろん一般書店等においても販売していますので、小樽に興味のある方々にも有意義な書物になると思います。私たち市民一人一人が「小樽学」を学び、「小樽博士」を目指し、観光振興と同時に地域文化の認識を持ち、世界に通用する国際人となることを切に望んでいます。平成26年4月小樽観光大学校"}, {"seq": 3, "page": null, "img": "guidebook_pages/p003.webp", "t": "小樽観光と歴天となぜ小樽鈴光に歴更なの?<ン画小樽稚光の特徴小樽は北海道の一員ですから、雄大で四季それぞれの自然と山海の幸が豊かにあります。また三方が山に囲まれ一方は海に開かれているために坂道が多く起伏に富んでいます。しかしこういった自然や食べ物や地形だけで、小樽は観光都市となっているのでしょうか。それは北海道全域が同じような条件を備えているからです。答えは「NO」です。つまり歴史的環境が豊富に残っているということが、小簡観光の重要な存在意義となっています。画特徴を生かそう観光客が小樽の魅力を目のあたりにして、「立派だね」「きれいだね」「格好いいね」と喜んでいただけることは、小樽に住む私達にとって、まるで自分をほめてもらったように嬉しいものです。さて、ことここからゃもう一歩進んで、「実はこの建物はね・・・」「実はこの港はね・・・」「実はこの通りはね・・・」といった深い事柄を知ることができたらどうらでしょう。教えてもらった人たちは「へえーなるほどね」と感じてくれるはずです。例えば、観光客が記念写真を撮るにしても、あとから写真を見てそのときに教えてもらった話を思い出し、その写真を誰かに説明するときゃ、「実はね・・・」と今度は自分が案内人にさえなってしまうほど忘れられない記憶になってきます。小樽観光の特徴である歴史背景を伝えることは、観光客の方々に対して、「外づら」だけではなく、「心豊かな」観光を味わっていただくことにつながっていくのです。"}, {"seq": 4, "page": null, "img": "guidebook_pages/p004.webp", "t": "そしてもっと大事なことがあります。「交流」です。案内人の私たちと観光和客との間に生まれる信頼です。観光客は「面白いこと」を教えてもらったことにた対して、深い心で小樽を見ることができるため、そこから逆に私達の知らない小樽を教えられたり、新たな智恵が生まれたりするようになります。なぜなら、小樽に住p私たちより、外から来た人の方が、小樽の良さに気づくからです。私たちと観光客の関係が「案内と観光」から「人と人」という信頼になり、それに比例して、その熱は小樽観光の発展につながっていきます。小樽の観光資源を囲んで私たちと観光客が友となり、コミュニケーションが生まれることは、新たな観光と新たなまちづくりと、そして新たな歴史をこの街に刻む出発点になるでしょうら。映像で感じる観光、本で想像する観光、バーチャルで楽しむ観光、車窓で眺める観光から脱して、ふれあう観光への一歩を踏み出してみてくださ還歴史を楽しみ歴史を創ろう・小樽観光において歴史的背景を伝えることが、大変有意義なことであるほかに、小樽観光には歴史的な説明が欠かせない理由があります。小樽には幕末から昭和初期にかけて語り尽くせないほど多くの物語を生んできました。つまりこの時代の小樽は「歴史を創ってきた」のです。事実、今日観光客の皆さんが感じる異国情緒やレトロ感覚の要因となっている町並みは、大方がこの時代につくられています。現在の小樽観光は「歴史を楽しんで」いるといってもいいでしょうらう。歴史を楽しむことから今を感じと、そして未来に夢を持てたら、今度はあなた自身が歴史を創る主人公になっていくととでしょうら。こことで学ぶ一つーつが、未来志向のあなたの味方になってくれることでしょうら。"}, {"seq": 5, "page": null, "img": "guidebook_pages/p005.webp", "t": "沙にうおたる衝内人案内人一ごあいさつ画小樽御光と歴史一歴史編・概要ドー1はじめに近世から近代近代1ノ近代エ明治から大正大正から昭和初期ノ統制経済観光都市ヘどおわりに還歴史編・部門別はじめに歴史江戸時代の小樽番屋小樽の親方ノ触御殿漁法漁獲産品漁夫プ沖揚げと「うた」ノ小樽の強み関連の商人久北前船PPPCPPPPFPFFPEPPPPEFPPPEFEEEP3]北前船の意義/北前船誕生の背景北前船の発祥ノ北前船の語源北前船の商売の特徴ノ北前船商法の系譜北前船の寄港地と積荷プ北前船の利益北前船の衰亡商人と小樽小樽ゆかりの北前船主小樽の北前船文化検定試験公式テキストブック目次集落の誕生と商人の着眼小樽商人の業務小樽商人の系譜プ小樽商人文化時代の交流拠点はじめにノ小樽港の現在の姿小樽港のはじまりノノ近代的な「港」づくり小樽築港とエンジニア(技術者)近代小樽港の発展第二次世界大戦後の小樽港幌内炭の発見プ搬送方法とルートの検討クロフォードの登場小樽鉄道ルートの決定建設工事着手開通から全通プ全通以後信運OOGLEEEEEEKPPPPPPPPPPPPPPPPPCSE95まちづくり観光明治の小樽運河論争昭和の小樽運河の保存運動「地域に生きる」とは何か9万/千人の市民の声まちづくりの燈は消えず@建築ーーーーーーーーー107まちの推移明治期の建築大正期の建築品和の建築"}, {"seq": 6, "page": null, "img": "guidebook_pages/p006.webp", "t": "@寿司・オルゴール・硝子はじめにノ小樽の寿司小樽のオルゴールノ小樽の硝子@美術小樽美術の夜明け一羊路画会三浦鮮治・兼平英示冗弟の活躍裸童社の画家たち中村善策と一水会の系譜小樽創作版画のひとびと河野薫と金子誠治一原有徳の世界人@文学小樽の詩歌小樽の小説小樽のおもな文学碑画自然編@気象と四季気候の特徴小樽の風物詩あれこれ人@地形と街区nn位置・面積ノ地形の特徴小樽の川小樽の坂市の花/市の木ノ街路樹保存樹木・保存樹林@動物市の鳥ノ小樽の動物小樽近海で獲れる水産物@温泉朝里川温泉人@水小樽の水はどこから?小樽の水は美味しいの?伏流水の産業利用伏流水の原理小樽の工業@景観小樽八区八景ノ小樽市都市景観党画行政編@国際交流ナホトカ市ゾダニーデン市ソウル特別市江西区外国人入込客数小樽市の人口"}, {"seq": 7, "page": null, "img": "guidebook_pages/p007.webp", "t": "市場と商店街小樽市商工会議所1次・2次産業振興プロジェクト画生活文化編@祭りとイベント…imiminmrenrnnnn191小樽市内のおもなお祭り日程小樽の夏・冬を彩る2大イベント@冬の暮らしononrnrnrnrrrr195食小樽の食文化にに\"[…i_eieoiooのの197蒲鮮菓子久地酒PPPPPPPFEPPFPPPPFPETPFFPFPPPPPPPPPPEFEFお199小樽の酒造史小樽の酒人@教育EEすすすすすすすすすすすすすすすすすすとですとととにとここ202介方言FFPたすすすずすすでとすそすすをすすをををととととにし204北海道の方言画周辺編念札幌方面昌和207人後志方面PPPPPPFPPPPTPPCPPCPPLCLLELELCKEL210還おもてなしの心構えーー215マナーオリエンテーションノ基礎知識ガイドを実践する前に実践身障者の方々や特別なニーズへの対応と情報把握「おたる案内人」に必要なコミュニケーション能力小樽の歴史概要図文化財小樽の老舗観光情報観光案内所外国人の相談窓口一協力者e執筆者一覧ーー291凡例:画大項目久中項目"}, {"seq": 8, "page": null, "img": "guidebook_pages/p008.webp", "t": ""}, {"seq": 9, "page": 1, "img": "guidebook_pages/p009.webp", "t": "", "page_guess": true}, {"seq": 10, "page": 2, "img": "guidebook_pages/p010.webp", "t": "英久1.はじめに日本の近代は、西洋からさまざまな技術・制度を導入していく時代です。西欧諸国では産業革命を背景とした帝国主義が台頭し、国家単位での影響が大きくなっていきます。北海道や小樽の近代史にゃも、世界もしくは日本の社会情勢が大きく影響を与えています。本州各地から移住してきた和人の第一の目的は衣食住でした。彼らは北海道各地に散らばり、原生林を切り開き開拓を進めていきます。その玄関自のひとつとなったのが小樽でした。このような北海道ととりまく時代背景をもとに、小樽の近代史を概説していきます。2.近世から近代この時代は、小樽はもとより北海道が否応なく日本史に組み入れられていきます。それは日本という国が、由夷地(北海道)にある人触という資源を求めたからです。本州では農産物の収穫を増やすため、鯖を料.にしていましたが、鯖が次第に不漁になってきました。そこで人鯛に替わり、北海道で盛んに漁獲され出した角を肥料として使うことにしました。久は単なる食用だけでなく、肥料としての需要が大きな価値を持ち、K人金肥」と称されるほどの人気商品になっていきます。人錬に対する肥料としての涯要は、大正後期、中国東北部からの大豆の、輸入や化学肥料などに押されるまでの長い間、北海道の大きな位置を保ち続けていきます。明治維新前、日本は黒船に象徴される西洋文明におびえていました。西洋に対抗できる国家をつくりあげるためには、なにより近代化が必要です。明治政府は西洋の近代技術を全力で取り入れようとしましたが、取り入れる対象は多いのに、外貨鯨漁風景(小樽市総合博物館蔵)久凡(市合博物館工)"}, {"seq": 11, "page": 3, "img": "guidebook_pages/p011.webp", "t": "があまりにゃ不足していました。外貨を獲得するためには外国に売るこことのできる商品が必要です。(9この綿花裁培には人粗が取料として大時に便われます。このように鯨は、「食用」ではなく「肥料」として、大変重要な資源になっていきました。画場所の成立日本更における時代区分では、慶長8(1603年の徳川家康の征夷大将軍叙任か慶応3(1867)年の大政奉還までの264年間を江戸時代としています。北海道では松前落が支配していた道南地域の一部が、日本更と同様の時代区分に組み入れられていますが、その他の地域は「昌夷地」と呼ばれ、北海道地域史では「近世アイヌ期」という時代区分となっています。和人の居住地とアイス民族の居住地で、時代区分の名称がちがうわけです。天明6(1786)年、仁吉屋西川家がオショロ・タカシマ場所馬負必となり、文化4807)年、恵比疾情岡田家がオタルナイ場所請負選として漁場を開拓しています(『西明地分聞』『西骨地日記J。場所の請負は特定の商人にしか認められなかったので、帳夷地には限られた商人しか入り込めなかったのです。請負商人は場所の管理をするため、、運上尾(家)という拠点を設けていました。この時代、鯨をはじめとした、鮭・アワビ・ナマコ・昆布などの海産資源のおかげで、場所を中心とした、集落が成立したといえます。オタルナイ場所の運上屋の位置は、現在の堺町郵便局にあたり、碑が建てられています。男村並となる(元治2(865年))小樽の開差は、松前で生まれの山田長蔵が、穂足内村の名主となった元治2(1865)年と3オタルナイ運上屋跡碑錬粗をつくるところ(小樽市総合博物館蔵)於古発川に架かる高島橋この川より札幌寄りがオタルナイ、余市寄りがタカシマ"}, {"seq": 12, "page": 4, "img": "guidebook_pages/p012.webp", "t": "1月から4月の角の漁期に出稼ぎに来て定住した東北地方の人々や、近江や松前から移って来た人々によって、集落が形成されていきました。といってもまだ小さな一漁村に過ぎませんでした。錬などの資源のおかげで、定住者が増えたことで、小機は村並となったといえます。画小樽郡の設置(明治2(1869)年)明治2(1869)年成辰戦争が終わり、藩主が土地(版)と人民(籍)を返上する版籍奉還が実施されます。同年7月8日開拓使が設置され、8.月15日内夷地は北海道と改称、同時に小樽郡が設置されました。9月28日には場所請負制が廃止されました。閉鎖的な場所請負制の廃止により、誰もが漁場開拓をできるようになり、儲の価値がますます仙まってきた時期でもあり、多くの商人や漁業家が北海交に乗り込んできました。HH開拓使は、明治3(1870)年手宮に海家所を設(同年海関所と改称)、明治5(1872)年には色内の海岸に石造の坦頭を着工、さらに手宮港を小樽港に改称するなど、着々と港の整備を進めていきま江戸時代二百数十年の平和は、喜永6(1853)年の黒船来航によって一変しました。背景には18世紀中頃にヨーロッパで起きた産業革命があり、その象徴が愚船でした。日本は西洋先進国に対する遅れを取り戻すために、近代技術の習得を急速に進めていきます。近代化には機械を動かすエネルギーか必要です。当時国内でまかなえるエネルギーは石炭だけでした。江戸時代来から道東の白棟や泊村の茅沼では石炭採掘が行われていましたが、明治時代になってからの調査で炭層が新たに発見された幌内は内陸だっコラム小樽の変遷「但所)のときは、単なる沖場で、錬の漁期である春に限り出稼ぎ人口が増えていましたが、それ以外は単なる一光村でしかありませんでした。村並ヵのときに和人が定間じしますが、出稼ぎの人々が定着したり、商いの関連で定間してきました(郡)のときに義和人設置につづき場所請負制が廃止され、鯨漁の自由化がはかられたために、漁業を中心とした人口増加がみられ、さらに天然の良港によって北前船寄港地として物流・人流の核になりはじめたことから商いや開拓による人口増加になっていきます。ときは、小樽が商業港湾都市を目指す契機となり、開港場(国際貿易港)の指定を受けたことから、ますます商いが盛んになり、明治2(1869)年からの30年間で人口が約24倍にも膨れあがり、既に都市の規模になっ((めときは、人口も10万人を越え、小樽の商業港滴都市は名実ともに成立したといえます。こうして小樽は昭和の第二次大戦色が強くなるまで、まさに北の商都として一世を風塵してにYeSl77(5"}, {"seq": 13, "page": 5, "img": "guidebook_pages/p013.webp", "t": "小樽最古の市街見取り図(小樽市総合博物館蔵)たので、積出港までの輸送手段が問題となりまし0TB)和上和和計とを目的に、手宮が表設されましたそれは半宮の慈が、mes条件を備えていた「天然の良港」だったからです。手宮の港は早くから着目され、北前船交易の基地にもなっていたことからもうかがえます。こうして国が求める石炭の積出港として、また交易の港として小樽港が時代の脚光を浴びていく員有2におりほ還石炭の積出港となる(明治13(1880)年て)財内鉄道の敷設や幌内炭鉱の開発は、婚産興業という国家の目的に沿ったものだったので、政府は相当な力を入れていきました。開拓使の明治11て14年度の定額経費280万円に加えて、明治政府は幌内・岩内炭鉱起業費180万円を投入しました。天然の良港であった小樽は、開拓の本拠地である札幌に近いという地の利もあり、鉄道敷設の起北前船・西洋帆船・蒸気船が行き交う港で水泳(小樽市総合博物館蔵)"}, {"seq": 14, "page": 6, "img": "guidebook_pages/p014.webp", "t": "ドミ)画開拓の玄関口となる(明治20(1887)年こ)近江商人につづいて、北陸や越後出身の人などが小樽に進出してきました。酒・食糧品・衣類・塩・紙・砂糖・竹・鉄・米・縄などを降ろし、錠や海産物を積みました。北前船主はだいたい半年を一航海としていたために、いつまでも同じ港に腰を落ち着けてはいられません。そこで小樽のような北海道全体の中継基地にあたる港に、荷を保_管する倉庫を建設していきました。小樽に降ろされた荷は全道各地に売りさばかれ、全道各地からの産物を積やことにより、小樽港は物流の一大基地(になっていきました。こうして小樽は北海道有数の寄港地となり、北海道全域に流通させる商品の倉庫の役割を担っていきました。明治政府は近代化を進める一方、国内情勢は混波としていました。成辰戦争や奥羽戦争に敗退した幕臣や藩士をはじめ、土族解体により多くの武士が路頭に迷っていた時代です。こうした状況のもと、新天地北海道への移住が促進されていきま江戸時代以来のロシアの南下への償威も消えておらず、明治政府は市田兵に農業開拓と軍事(国防)といら役割を課して、移住を推進していきました。北海道開拓の中心となっていたのが明治2(1869)年に設置された開拓使です。同7(1874)年開拓長官となった黒田清隆の時代ににさまざまな政策が実何SMま|胃/6黒田は、お雇い外国人の毎恵と技術を借りて開拓を進めていこうとします。お雇い外国人の指導的立場にあったホーレス・ケプロンは、『開拓使顧間ホラシ・ケプロン報文』において、「測量、土地出船入船で賑わう小様港(小樽市総合博物館蔵)宮ご札幌間開通記念の写真(北海道大学附属図書館蔵)入船町大通りの高架を走る機関車(小樽市総合博物館蔵)"}, {"seq": 15, "page": 7, "img": "guidebook_pages/p015.webp", "t": "の企画および処分法、車道開通、内地との輸送、水路改良、鉱山、漁業、官園、工場、農事試験場、海外果樹の輸入、外資および外人労働者の導入、学校制度、家屋改良、食生活改善」といった多面的な提案をしています。開拓使が缶詰、ビール、ブドウ酒、製粉、製網、機械などの官営工場をつくったことから、のちのサッポロビールが誕生し、幌内炭鉱を開発、鉄道を敷設したことから手宮線が誕生し、札幌農学校を設立したことから今日の北海道大学が誕生しました。ジャガイモやリンゴやトウモロコシなどもお雇い外国人らの指導によって尊培されてきましりにに田先端技術をもたらしたお雇い外国人(明治4(1871)年て)明治政府は明治5(1872)年時点で214人、なかでも工部省では明治3(1870)年から18(1885)年の15年間で総計580人のお雇い外国人を雇い、最も多かったのは明治7(1874)年の鉄道関係で290人にもなります。出身地はイギリス・フランス・ドイツ・オランダ・アメリカでしたが、北海道開拓ではアメリカ東部のニューイングランド地方出身者が多数をしめています。同じ寒准地であったことが模範になったといわれています。@⑥〇ホーレス・ケプロン明治3(1870)年に開拓次官、同7(1874)年に開拓長官となる黒田清隆は、外国人を雇うことと外国の機械を購入することを目的として、明治41871)年アメリカへ渡ります。黒国はそこで、アメリカ連邦政府の農務省長官だったホーレス・ケプロンと会い、開拓使顧問に迎える契約を結びました。ケプロンはアメリカからつぎつぎに優秀な人材を呼び寄せ、農業・工業・鉱業・医学など、北海道開拓のさまざまな分野に貢献しました。ホーレス・ケプロンペペウックコ7ニン(フン0ジンショギンUEグロフキード(小樽市総合博物館蔵)"}, {"seq": 16, "page": 8, "img": "guidebook_pages/p016.webp", "t": "道路の建設や鉄道の敷設も、彼らのカカなくしてはできなかったでしょう。お選ぼい外国人の数は、12年間の北海道だなけで78人にのぼります。彼らが北海道へもやたらした知識と技術は、当時、世界最先端のもやのであり、彼らの活躍なくして今日の北海道はありえなかったといってや過言ではありません。(シッンコ226スミスーライマンベンジャミン・スミス・ライマンは、北海道の地質と鉱山の調査に当たり、幌内で炭層を発見するなど大きな業績を上げました。幌内炭鉱の開発や石炭の輸送にも関わり、その間、多くの技術者を育てています。彼らはその後、幾春別や夕張で炭層を発見しました。日本初の総合的な地質図である「日本昌夷地質要略之図」ゃも、ライマンらの手によるやものです。(⑥2i2sUssク生ウナード明治15(1882)年、幌内炭鉱と手宮を結ぶ幌内鉄道全線90キロが開通しました。北海道で最初の鉄道でした。この幌内鉄道建設において技師長となって指導したのが、ンク0コクロンホードでした。クロフォードは若かったものの、アメリカの鉄道で技師として働いていた経験豊かな技術者でした。幌内鉄道の果した役割は、石炭の輸送にとどまるものではなく、鉄道沿線である札幌とその周辺の開発を促進し、商業都市小樽の発展をもたらしました。\"|「計と上に伯ジゴトIHMIe1|」"}, {"seq": 17, "page": null, "img": "guidebook_pages/p017.webp", "t": "■商業と金融の－大拠点へ（明治17(1884)年～）になっていた小樽港は、石炭の積出港という位置づけも一一一ー、加わり、開拓の玄関口という位置を確保していきます。開拓の拠点となっていった小樽には、さまざまな地域から一旗あげようとする人々が集まり、商業で巨万の富を築く商人も現れるようになります。そうした彼らへ資金を提供したのが、銀行をはじめとする金融機関でした。こうして小樽は人材と国費と民間資金を吸い寄せる商業と金融の一大拠点に発展していきました。三菱銀行小樽支店（現小樽運河ターミナル）（小樽市総合博物館蔵）、IiO＃､全■組合の成立（明治30(1897)年～）明治の後半からは、企業や団体がさまざまな組出P一'一織(組合)を結成し､社会的立場を強めていきます。日本銀行小樽支店（現金融資料館）企業単体では成し得ない社会的な地位向上を目指（小樽市総合博物館蔵）すためです。特に経済団体として現在の小樽商工会議所の前身である小樽商業会議所が明治30(1897）年に開所式を挙行したのを筆頭に、銀行・産業・宗教・医療・スポーツ関係、そして各青年部などが結成されています。5．明治から大正第一銀行小樽支店日本は明治27(1894)年の円清戦争から大正3(1914）（現トップジェントファッションコァ）年の第一次世界大戦まで、30年間で10年おきに3（小樽市総合博物館蔵）度にわたって戦争をし、結果的に日本に有利な形で終わりました。勤匿虫に起きたさまざまな需要にに、、小小樽樽のの商商人人！も有利なビジネスをしています。いたやみやきちふじやまようきち迩全亘宣や藤山要吉らは所有していた船を戦争に供出(提供)することにより、莫大な補償金を手たかはしなおじに入れ､f随座急_と呼ばれました｡高橋直治は戦場になった西欧諸匡|で不足する穀物を買い占め、尾中越銀行小樽支店（現銀の鐘）座主J少呈過皇などといわれるようになりました。（小樽市総合博物館蔵）"}, {"seq": 18, "page": null, "img": "guidebook_pages/p018.webp", "t": "還私財による公共事業2代目板谷宮吉は小樽市中学校(現長杖中学)、此太吉は店、衣山要吉は束宮谷所(現小人市公会堂)、本維円吉らは小樽直商の敷地(現小樽商科大学)など、公的な寄附をしています。戦争需要は結果的に、小樽商人に財力をつけ、その商人が私財で行った公共事業で小樽に貢献したといえるでしょう。6.大正から昭和初期北海道全域そして樺太南部も含めた商圏に、開拓物資や生活物資を送り込む商業港湾都市に発展した小樽には、本州から続々と人々が移り住みました。大正9(1920)年の第1回国勢調査では、小樽区だけでも10万人を優に超え、さらに高島・塩谷・朝里を含めると12万4千人以上の都市に発展|W20中抽有/(G画小売・サービス業の進出(大正時代て)明治時代の小樽は卸業が基盤をつくり、人日10万人以上の都市に成長していく大正・昭和初期の時代になると、さまざまな第三次産業が進出してMVきまllラ/で00Meyh、教育や宗教や医療施設も整備され、デパートの少しての人滞開褒しています花柳界では500人以上の芸者が如を負い、そして大正11(1922)年8月1日小樽は市制施行、「北の都」として最も華やかな時代を迎えていきます。画観光のはじまり(大正後期昭和初期)「北の都」として名を馳せた小樽には、多くの和観光客も訪れました。そのなかでもひときわ異彩を放ったのがオタモイの龍宮開でした。龍宮開は、花園町で料理店蛇の目を経営する加北海道拓殖銀行小樽支店(現ホテルヴィブラントオタル)(小樽市総合博物館蔵)北海道銀行本店(現小樽バイン)(小樽市総合博物館蔵)小樽商業会議所水道局の場所(明治40(1907)年/現存せず)(小樽市総合博物館蔵)小樽倶楽部(現存せず)(小樽市総合博物館蔵)"}, {"seq": 19, "page": null, "img": "guidebook_pages/p019.webp", "t": "藤秋太郎が、まさに京都清水の舞台さながらに、オタモイの絶記弁天岩に建設したものです。また北海道初の外国人専用ホテルともいわれる越中屋ホテルが昭和6(1931)年に誕生しています。天地場産業の成立(明治後期昭和初期)小樽の民間で製造された本格的な最初の製品は醤油・酒・新聞です。現在に引き継がれている小樽の地場産業としては、人触漁以来の水産加工業は欠かすことができません。明治28(1895)年国産2番目の蒸気機関車が北海道炭確鉄道手宮工場で製造されています。その経験や釜製造の技術から小樽の金属加工業が始まっています。港の整備とともに人造船会社が生まれ、製向やさムや製粉も北海道を代表する産業となり、小樽を支えてきています。7。統制経済(昭和10年代て戦後)昭和12(1937)年の日中戦争から、日本は戦時体制下に入っていきます。それから昭和20(1945)年終戦までの8年間に、小樽の経済基盤であった企業は合同や廃業を余儀なくされていきます。終戦後には進駐軍により、行政・財政・経済の改革が進められるとともに、昭和30年代以降、北海道経済の中心は小樽から札幌に移っていきました。その原因には移らざるを得ない社会環境の変化がありました。小樽は、「肥料と外貨への策要」「エネルギーと港湾基地への筑要」「開拓需要」「戦時下物不足の需要」のように全国的な大きな和需要に支えられて、その供給基地として繁栄してきました。必然的に都市化して人口が増え、その人口を支えるさまざまな産業も発達を続けます。しかし社会の変化にともない、小樽は斜陽化し@歴代寄附高橋合名の有幌倉庫(明治未)(小樽市総合博物館蔵)山田吉兵衛山田町(明治19年)板谷宮吉小樽市中学校(大正14年)藤山要吉公会堂(明治44年)木村円吉商大土地岡崎謙能舞台(昭和Z29年)土肥太吉市役所店舎(昭和8年)小樽高等商業学校(現小樽商科大学)(小樽市総合博物館蔵)『まっ能舞台(小樽市総合博物館蔵"}, {"seq": 20, "page": null, "img": "guidebook_pages/p020.webp", "t": "てしまいました。残った人口を支える「生活需要」に応えてきましたが、そこには拡大的要素がなく、人口も減少し続けています。画鯨の商品価値の減退と不漁小樽近海の鯨の漁獲は大正後期から不安定になり、昭和30(1955)年を最後に姿を消しました。肥料としての価値も化学肥料の登場や中国東北部からの大豆粗の輸入によって低下し、押・粗のシェアは昭和6(1931)年には40%%にまで落ち込みました。軒敗戦による樺太の喪失第二次大戦敗戦の結果、日赴戦争以来40年間領土としてきた南樺太はソビエト(現ロシア)の領土となり、小樽商人の商圏が大きく削られてしまいました。画統制機関の札幌設置GHQによる経済統制により、統制機関は札幌に設置されました。小樽が得意としていた雑穀取引は、統制により自由に価格がつけられなくなり、かつてのような買い占め・座占価格が不可能になりました。軒内地商社の札幌進出戦後の財閥解体により民主化された市場に各種商社が進出し、札幌には多くの商社が支店を設置しました。全国に商品を流通させる商社と連携するため、商業機能は札幌に移っていきました。還石炭から石油への転換昭和30年代から石油が石炭に替わって、エネルギーの代表格になってきました。このため全国の炭鉱が閉山し、小樽の石炭積出港といった位置づけもいちじるしく介馬leのゆきまじした。画海路から陸路への転換物流の輸送手段として陸路を走る自動車が普及し、物流全体に占める海上輸送の割合が減少するにつれて、小樽港への船の出入もや大きく減っていきました。トラックと港の関係は深まり、合理的なコンテナ輸送が主流を占め、コンテナ俗役システムや後背地の広い港に荷物は集中し、北海道では石狩湾新港や苫小牧港がクローズアップされていきました。り必"}, {"seq": 21, "page": null, "img": "guidebook_pages/p021.webp", "t": "8.観光都市へ(昭和後期て平成)小樽の衰退を一言で表すなら、「小樽は戦後、高度経済成長に乗り遅れた」と言われてきました。昭和30年代からの高度成長期、全国的に街並みが大きく変わっていくなかで、小樽の歴史的な街並みは壊されずに、かつての面影が残されていました。この歴史的環境を観光資源として活用するきっかけとなったのは、昭和40年代後期から50年代にかけて展開された「小樽運河論争」でした。運河を埋め立てるといら道道小樽臨港線の建設計画に市民が異議をとなえた運動です。十数年間にわたって、小樽を二分する政治的な問題にまで発展するなかで、何度も何度もマスコミはこの論争を全国に報道してきました。今日でいう地方分権の先駆けともいえるこの運動は、全国的な注目を集めていきました。札幌や東京にも保存をとなえる組織が誕生し、いわば「視察観光」とでもいうように、多くの人々が小樽を訪れるようになります。一方、全国の観光スタイルゃ変化し、近隣の市町村に稚光客が流れていく時期とも重なり、運河と歴史的街並みを見るため、多くの和観光客が押し寄せてきました。観光は小樽の基幹産業といわれるまでになりました。9.おわりに江戸時代未期から現代まで、小樽の歴史を概稚してみました。小樽は錬と石炭を本州へ移出する積出港でもるとともに、本州からの開拓物資を受け入れる基地であったことから、港湾整備と都市基盤整備が進められました。増加する人口を対象に各種の製造業や小売・サービス業ゃ発達し、北海道の代表的な港湾都市となりました。戦後は触・石炭ともに主要移出品でなくなったことから、北海道経済を担ってきた小樽の地位も低下する一方となりました。ところが、人小樽運河保存運動をきっかけに、斜陽といわれ、高度経済成長の波に乗れなかったことが、結果として歴史的な街並みを残し、これを活かした観光産業が始まり、今に至っています。『北海道の歴史』山川出版社昭和51年(http://ikoi99.web.infoseek.CO.jp/nihonhen/OUmIKIKOU/OUmiinfo.htmlより)『日本の歴史をよみなおす』網野善彦著筑摩書房平成1年『小樽歴史年表』特定非営利活動法人歴史文化研究所平成18年『小樽市史第4巻』株式会社国書刊行会昭和56年「北海道デジタル図鑑」平成18年9月http://Www.hokkaidO-jin.jp/zukan/story/02/14.html『後志鯨街道』後志鯨街道普及実行委員会平成17年茜全"}, {"seq": 22, "page": null, "img": "guidebook_pages/p022.webp", "t": ""}, {"seq": 23, "page": null, "img": "guidebook_pages/p023.webp", "t": ""}, {"seq": 24, "page": null, "img": "guidebook_pages/p024.webp", "t": "触と小樽@小措の歴史のみなもとは錬だったなぜ?鯨だったのか便汐の貴重な遺構親方と番屋@小様の強み鯨光がもたらした産業価錬漁に|うた|は必要だった沖揚げ音頭"}, {"seq": 25, "page": 16, "img": "guidebook_pages/p025.webp", "t": "1.はじめに'明治から大正にかけて、北海道の日本海沿岸各地は江戸時代から続いていた人触漁が最も盛んに行われていた時代でした。漁期中の3と5月は、雇いの漁夫や手伝いの人々で集落は一に人か導えました。浜も錬の運搬や加工を担った出面(日層い)の人たちやや物売りで祭りのような賑やかさでかつて聞かれた「群来」という言葉は、大群で押し寄せた鯨の放出する白子によって海が白濁する現象をいいます。この和群来によって海ははるか沖まで白くなり、海面はお湯が者立つように見えるほどで、まさに浜は魚と人で沸き返りました。撲漁の活況は過去のものになりましたが、小樽市内の祝津、高島、忍路地区に今でも残る番屋などの建築物や、保存伝承されているソーラン人節などで、在りし日の角場を感じることが出来ます。角はアイヌ民族によって古くから捕獲されてきました。江戸時代よりも前、道南地方や本州からきた和人がいつ頃から昌夷地で人触漁を行っていたのかは、さだかではありません。江戸時代に入ってからの人災漁はおもに松前、江差地方で行われていましたが、それらの地域が不漁になると、人々は人触を追って里夷地へと向かいました。江差は西帳夷地への追人漁民らの出漁の拠点となりました。江戸時代中頃には、北海道の産物として銀製品が注目され、北前船の日本海航路が整備され、近江商人らによる大型網の導入などによって、幕未にかけて漁獲量は大きく伸びました。人々が角を求めたのは本州、とくに西日本で、錬を原料とする肥料の需要が高まっていたことがありました。鯨御殿・旧田中家住宅(北海道指定有形文化財)(写真:歴史文化研究所蔵)奈市地方最後の群来(昭和29(1954)年)(余市水産博物館蔵)沖揚げ(大正時代)(全市水産博物館大"}, {"seq": 26, "page": 17, "img": "guidebook_pages/p026.webp", "t": "タカシマ場所山中高島岬川垂ジオタルナイ場所天狗山図現在の小樽市域における江戸時代の各場所星江戸時代、北海道日本海側南部'のの謹互空旦逓幽融壼まで蓮簿\"こから控威岬、互益市厚因圭壁鉦二呼んでいました。鰊を追った人々（追鰊）は享保年間(1716～1736)には近場所まで、その後の寛政5（1793)年には中場所までの出漁が許されました。蝦夷地の沿岸を北上するかたちで鰊漁場が開発され、また、安政2（1855)年、それまで禁止されていた神威ⅢIII以北への婦女通行が可能となったことも追い風となり、｢i本海沿岸各地、なかでも積丹半島とその周辺の小樽､余市､石狩の各地は急速に和人が増えました。小樽を含む中場所は、明治以降も豊漁が続いた－|QコラムDので「全道無比の鰊漁場」とされました。また漁「江差追分」獲物の加工に必要な平坦地も適度にあり、鰊漁が特に盛んな地帯でした。江差追分の「忍路高島及びもないがせめて歌棄磯谷まで」の一節は、追鰊のため旅立つ男性について行こうと思っても、神威岬以北へ向けて沖を航行する船が女人禁制だったため、その手前の歌棄、磯谷までしかついて行けないという女性のせつない気持ちを唄ったものといわれています。これとは別に、江戸時代に忍路、高島、歌棄、磯谷の4場所を請負っていた場所請負人住吉う『，や屋を羨んだ松前の商人升屋が、せめて歌棄と磯谷だけは手に入れたいと願った「せめて歌棄磯谷だけ」が本来の歌詞だったものが、後年改作されたという説もあります。3．江戸時代の小樽江戸時代の小樽は､東からオタルナイ場所､タカシマ場所､オショロ場所と3つの場所に分かれて、各場所を請負った商人が場所を経営していました。●オタルナイ場所おこばちオタルナイ場所は札'l滉市星置付近から於古発川(下流は妙見川)まで､タカシマ場所(18世紀末までやまなかはシクヅシ場所)は於古発川からオタモイ東側のI｣|中まで､オショロ場所は山中からフゴッペ岬(余市町栄町)までが、それぞれの範囲でした。幕末のオタルナイ場所は、近江商人の惠比須屋"}, {"seq": 27, "page": 18, "img": "guidebook_pages/p027.webp", "t": "岡田家が請負い、拠点とした運上屋はクッタルウシ(有|幌町付近)にあり、また、クマウス、アサリ、「江戸時代の鰊漁」ハリウス、ゼニバコに番家(後述)をおいて、自らの漁や追鰊漁民の監視を行っていました。このころ鰊を追って蝦夷地へ立ち入ることは松前藩から許可を受けな場所内には250軒ほどの追鰊漁民の小屋がありました。ければ出来ないことでした。こ幕末のオタルナイ場所は、30人以上もの漁夫をれは、江戸時代が始まった頃か使って漁業をする者がいて、安政6（1859)年の記ら松前藩に無断でアイヌ民族と商売してはならないという決ま録では、幾重にも鰊が山と積まれるほどの大漁場りがあったからでした。領地かで、住宅や長屋もどんどんと出来つつあることがらの米を藩財政の基礎と出来な報告されています。元治2(1865)年には「村並(藩かった松前藩が、幕府から許されていたアイヌ民族との交易や、政下の村と同じ扱い)」となり、オタルナイ場所は、漁業で得た蝦夷地の産物を換金穂足内村と呼ばれました。慶応3（1867)年の人口したものが藩財政のひとつの柱は550軒、2,308人(永住324軒、1,412人)で、このとなっていました。この交易権が地域ごとに藩士頃は10年間で家数と人口がほぼ倍増する勢いで、に分け与えられ、藩士は蝦夷地急速に集落が拡大しました。へおもむいて交易を行いました。交易や漁業は、その後、年限を●タカシマ場所決めた上でお金を納めた商人が請負って行うようになりました。幕末のタカシマ場所は、近江商人の住吉屋西川あきい‘交易をしていたところを「商家がオショロ場所とあわせて明治まで請負ってい場ir｣または｢場所｣、藩士の禄J,<(給tうぎエ･』ました。文化4(1807)年には越冬する漁民が既に料）を「知行｣、藩士に交易を行なう権利を与えた制度を「商場200人を超え､安政年間(1854～1859)にはタカシマ知行制」といいます。また商人に建坪187坪の運上屋1棟、番屋2軒、蔵20棟などが納めたお金を「運上金｣、商人が見られます。場所の中心地である運上屋はシクが交易などを請負った仕組みを「場所請負制｣､請負った商人はヅシにありましたが、後にタカシマに移されまし「場所請負人」といいます。た。この頃のタカシマは西蝦夷地第一の港と称さ場所を請負った商人は、アイれていました。ヌ民族との交易や自らの漁業を行なうと同時に、出稼漁民の監視をして漁獲物の約2割を彼ら｜●オショロ場所から徴集していました。幕末のオショロ場所は、タカシマ場所とともに、ノ住吉屋西川家が明治まで請負っていました。安政年間(1854～1859)にはオショロに建坪149坪の運上屋1棟、番屋4軒、蔵13棟などが見られます。'■『北海道水産豫察調査報告』北海道庵内務部水産課明治25年『北海道漁業志稿』北水協会編昭和52年『小樽市史第1-7巻』小樽市昭和33年一平成5年『高島町史』昭和16年［『角川日本地名大辞典1北海道上巻』漁夫（余市水産博物館蔵）「角ﾉll日本地名大辞典｣編纂委員会編昭和垂6哩2笙」"}, {"seq": 28, "page": 19, "img": "guidebook_pages/p028.webp", "t": "日本海タカシマ場所一＞衣出石←ヨイチ図忍路郡内の漁場概要（幕末～近代初頭）4．番屋番屋とは親方家族の住居であるとともに、3～5月の約2ケ月の鰊漁期中に漁夫らが寝泊りした建物です。親方家族の住居部分と、漁夫らの生活b空間が建物のほぼ中央で土間によって分けられたもので、小樽市内では祝津高島などに石造倉庫かつての桃岩（市立小樽図書館蔵）とともに残されています｡この番屋を拠点として、みがきにしん沖にしかけた建網で鰊をとり、生鰊販売、身欠鰊などの食用製品加工と、各種の肥料製造を行っていました。ばしょうけおいにん番屋の語源は、江戸時代、場所請負人が として使われました。）||崎船は梁約2.5mで帆走が出日に何度か手返しして干し上げます｡乾燥が終わっ来るものもあり、枠船の曳航なた粕は、一か所にまとめて積み上げて、むしろでどに使われました。覆って湿気を均等にさせてから俵装して販売されノ"}, {"seq": 35, "page": 26, "img": "guidebook_pages/p035.webp", "t": "身欠鯨製造時に除去されるえら(笹目)、背骨(胴魚)も肥料となりました。10.漁夫江戸時代、人・場の漁夫は母村と漁場とを行き来名と漁夫(全市水産博物館蔵していましたが、幕末にかけて徐々に定住するよ2になりました。明治以降、漁家は東北や北陸から漁夫を募集し、明治20年代に雇われた漁夫数は北海道全体で9万人を超え、そのうち6万人は他府県、おもに南部、津軽、秋田、庄内地方出身で、農民や、漁家ではなかった人ん々でした。彼らは「若い衆」「欠殺しの神様」「ヤン衆」などさまざまな呼ばれ方をされました。前年末頃に雇用の契約を結んだ漁夫は、あらかじめ決められた給料の約9割の前金を受け取って正月を迎える準備どにあてました。雇用契約は後に、総漁獲高の定率で給料を決める歩合制が多くなりました。漁が始まる1ヶ月ほど前の2月になると、わずかな夜具や郷里からの土産をたずさえて鉄道や船により、各自の漁場に到着しました。事前の準備をすべて終えて欠が来るのを待つだ図角網漁の概要と使われた船替わり要般忍路鯨場の会(小欄市指定無形民俗化肝)"}, {"seq": 36, "page": 27, "img": "guidebook_pages/p036.webp", "t": "けになると、「綱下ろし」の大和会が行われました。親方や招かれた神主が漁場内に祭らちられたお社に参捧した後に、訓辞が述べられ、船頭など漁場の役職、漁夫氏名や就業のきまりごとが発表されます。それらを記した番付板(定板)は番屋内の見やすい場所に漁期を通して掲示されました。飲めや歌えの大愛会が始まり、お酒が進むと木遣り音音頭や、お国自慢の民詳が唄われ、最後は胴上げで豊漁をモッコから魚箱へ碑いました。明治21(1888)年の小樽では約6千人の雇い漁夫がいましたが、市外からの漁夫の大半は青森、秋田からの人々でした。『続北海道漁業史』北海道水産部編昭和44年『北海道水産陀察調査報告』北海道護内務部水産課明治25年『小樽市史第1-7巻』小樽市昭和33年一平成5年海上で鯨を捕獲して陸揚げするまでを沖揚げといいます。ここでは建網漁の手順とその作業で唄われる「うた」を紹介します。漁夫らちが力をあわせて建網漁の一連の作業をスムーズに行うために、「うた」が必要で、大きな衣を動かしたり、船を消いだり、大兆の網を起こす請縛緒時など、どれやもが皆で力をあわせなければ出来なDENaいものでした。大型の船や網を使うようになったいつの頃からか、作業にあわせた「うた」が出来で人由骨の他事は「うた」で始まり、!うた」で終わるやものだ」とまでいわれました。沖揚げ音頭はひとりが唄い、それに続いて他の皆が唄います。独唱を「ハオイ」、斉唱を「シタゴEN2XVYまの現在では、代表的な4つまたは5つの唄を総称した沖揚げ音頭が、各地で保存継承されており、小樽では忍路地区の「忍路鯨場の会」によって保(奈市水産博物館蔵)"}, {"seq": 37, "page": 28, "img": "guidebook_pages/p037.webp", "t": "存さきれています。同会では沖揚げ音頭だけではなく、漁が始まる前の網下ろしの宴会や、地区のお祭りの際、お神興を押・漁で使う漁船である保津船に載せて皆で清いで海上を渡る行事などを行っています。これら一連の鍵場の行事は小樽市の無形文化財に指定されています。人@沖との往復(船清ぎの唄)沖へ向かう船に乗り込んだ15ー20人ほどの漁夫らが、沖の建網への往復時に権を溝ぎながら唄うものです。沖の建綱までの距離は、例えば小樽市高島であれば、およそ300mほどでした。枠船に船頭以下数名が、起船には漁夫17て18名が乗込んで、仮眠や食事を取りながら待機します。やがてニシンが乗網すると、船頭は身網の中に張ったさわり糸に魚災があたるのを感じながら、網口を閉じる頃合を判断します。@網おこし(網おこしの唄ノ木遣り音頭)ニシンの入った身網を15て20人ほどで手繰り寄せる際に唄います。時に70トン近くになる網を1時間ほどで枠網の中に入れてしまいます。枠網は、枠船の下方、海中にぶら下げられたかたちの網です。魚群の入った身網が起船側から枠船側に起こされて、身網からこの枠網に魚群が落としこまれます。起船側で待機していた漁夫は、「起こせ」の合図とともに一斉に網を手繰り寄せます。木條り音頭は、網おこしの唄に続いて唄います。枠網の中に、魚群を落とし込む際に唄うもので、最や力を込める作業です。木遣り音頭は「キリ声」とゃも呼ばれ、漁夫の士気を高め、また一定の休みを与えて疲れを少なくさせる唄で、熟練の技が必要とされました。梓網が満杯になれば、次の替り枠船がつながれます。枠船は自身で海岸近くまで航行するか、川崎船で曳航されます。人@練を枠船へ(沖揚げ音頭(ソーラン節))ソーラン和館として広く知られた唄です。との唄は波船に乗り込んだ船頭の他、10名ほどで唄うゃので、枠網の中に大タモを差し入れてニシンを没船へ波み上げる際に唄いました。大タモは屈強な若者が柄を持って操作し、波船側の3て4名がヤシャカギという先端がカギ状の棒で引っ張り上げ、梓船側からはアンバイ棒で押して補助しました。流船1前には10て15石ほどが積みこめました。作業によって「ソーランソーラン」の数が変鯨の陸揚げ(余市水産博物館蔵)"}, {"seq": 38, "page": 29, "img": "guidebook_pages/p038.webp", "t": "わります。また､ときには性的な歌詞を即興で唄い、笑いでもって疲れを忘れさせようともしました。●網の手入れ（子はたき音頭）網の目をふさぐほど産み付けられた卵を網から落とすため、網を浜辺へ一度引き上げ、棒で網をllllいて卵を落とす作業の際に唄われました。『北海道の生業2漁業諸職』山田健･矢島害･丹治輝著昭和56年『北海道漁業史』北海道水産部漁業調査課編昭和32年『北海道水産豫察調査報告』北海道庵内務部水産課明治25年『小樽市史第1-7巻』小樽市昭和33年一平成5年『北海道開拓記念館研究報告』第39号平成18年『鰊場物語』内田五郎著昭和53年『創立20周年記念誌かもめのあしあと』忍路鰊場の会平成6年12．小樽の強みネ小樽市内に居を構えた建網漁家は、市内の漁場だけでなく石狩湾や増毛、道北の各地方にも漁場を所有した人がいました。例えば金子家は羽幌町の焼尻島、増毛町、利尻島に、1II本家は礼文島、利尻島、苫前町に、田中家は石狩市浜益に、井尻謝憧曲厚里陰能詑蒲噛里号藤家≦零ツク海沿岸の枝幸に、茨木家は増毛町雄冬に、広谷家はオホーツク海沿岸の宗谷や枝幸、積丹lll]美国に漁場を持っていました。これら多くの漁家が遠隔地にも漁場を経営できたのは､qﾙ､樽を含む後志地方が他地域と比べて長期間の安定した漁獲があったこと、魚肥の高い需要、これにより資金や設備を蓄え庵大きく成長できたことなどが理由と言えます。遠隔地の漁場渥営はﾘｽｸ分散の側面もあり、漁獲量の豊IX|の波が激しくなって良好な漁場が北へ移動すると、遠隔地の漁場も手に入れ、また資金や道具を他へ貸し与えて産物を集めるようになりました。小樽は産物が集まる場所であり、江戸|侍代からの航路やUl治末期以降の鉄道網など流通網の要所であったこと、漁獲皆無となった道南地方の漁夫の確保が容易だったことは地理的な好条件といえます。"}, {"seq": 39, "page": 30, "img": "guidebook_pages/p039.webp", "t": "13.関連の商人海産商和といえば人糧のことを指していた時期、海産物の代表的な集積地だった小樽でも人触粗は重要な移出品でした。大正から昭和の初め頃には、豊漁地帯が岩内から留萌までの海岸へと徐々に北へ移動しましたが、北海道日本海沿岸のほぼ中央に位置した小樽は地理的に有利な位置にあり、本州府県向けの製品移出港として長く中心的役割を担っていました。また樺太(サハリン)産の製品も小樽へ運ばれていたため、昭和10(1935)年頃までは小樽の海産商ことって健製品は重要な移出品で、この頃の海産商120て130軒中、魚肥を取り扱っていた海産商は30軒以上もありました。画漁網・わら工品小樽は角・製品が集まるだけでなく、漁網やわら製品などの漁具を扱う商人も多く角・製品の移出先であり、漁夫の出身地でもあった東北や北陸から物資が小樽に運ばれ、帰路は小樽で積み込んだ水産物を自国へ運びました。漁網では、新潟産の麻網を新潟出身の小樽商人、板谷商店や新谷商店が扱っていました。麻網よりゃ扱いやすい木綿網を地元で製造する試みがなされたこともありましたが、多くの商人が移入品を扱い、その傾向は化学繊維の網が主力となった時代でも同様でした。わら工品では、なしろ、かます、縄、わらじが主力製品で、石川、福井、新潟などの各県から移入して商売を行っていたのは、先往がそれらの県出身である板谷宮、松川吾太郎などでした。『小樽市史第一-七巻』小樽市昭和33年一平成5年ノ『北海道廊統計書』北海道庁(各年度分)『北海道水産丈察調査報告』北海道原内務部水産課明治25年泊般具商「村人家(68)と海産物商「東表」(お)『後較業図より"}, {"seq": 40, "page": 31, "img": "guidebook_pages/p040.webp", "t": "北前船と小樽観光$小樺観光の貴重な資源である石造訪庫例小樽観光の大きな枠組みである港文化小樽観光素材の創造者である小樽商人小樽観光の意匠的特徴であるしるし"}, {"seq": 41, "page": 32, "img": "guidebook_pages/p041.webp", "t": "1ニュ)1.北前船の意義“北海道は明治2(1869)年8月15日夷地から北海道と改称されました。北海道が近代技術をもって開拓されていくスタートでした。開拓には大量の物資が必要です。当時、航空機はもとより自動車もなく、唯一の大量輸送手段は航中でした。船が着岸するには充分な水深と、風や濾を防ぐこと(00ん/辰悦丸模型(潤市総合博物館蔵)この条件にあい、開拓の拠点であった札幌とも定政12(1800)年に高田屋嘉平がエトロ近かったのが「天然の良港」といわれた小樽港でに滞った時の1300石積の船した。小簡の港が交差点となって本州から開拓物資が入荷され、人粗や海産物が出荷されていきましが江戸中期から明治の末期にかけて活躍した一枚山の船を北前船といいます。多くの北前船が小樽の港に出入りして、開拓物資の移入と海産物などの移出を行い、この商いで貯えられたお金で倉庫や建物や街並みがつくられてきました。北海道とくに小樽にとって、北前船は開拓初期には大きな頁献をしました。2.北前船誕生の背景北前船は、日本海沿岸航路が発展して、北は戦夷地(北海道)、西は瀬戸内(山口県・広島県・岡山県・愛媛県・香川県)・近畿(大阪府・兵庫県・和歌山県)を結びました。その活躍は江戸中期から明冶中期にかけて、とくに目覚ましいものがありま国内の沿岸航路は中世(鎌倉戦国時代)からすでに瀬戸内海や日本海側たおいて整備されつつありましたが、江戸幕府になってから江戸一大坂間の南海路、東北一大坂間の西海路、東北・帳夷地一江戸間の東海路が整備されてきました。南海路には交垣句船や樽如船という船が、西海路には北前栄福丸(小樽市総合博物館蔵)米徳(析市総合情和合"}, {"seq": 42, "page": 33, "img": "guidebook_pages/p042.webp", "t": "船が活躍し、北前船はのちに蝦夷地へも進出して、【コラムDいきました。｢くつだらねえ－」私達は日頃、批判的な意味を込めて｢下らない出来事」「下らない奴｣などと表現しています。その語源は江戸元禄時代に都の江戸に出荷するには品質が悪いから「下らない」としたところから派生しています。づまりそれまでの都は京都・大阪でしたので、「俺たちが中心｣という半ば中華思想が京阪にあることが垣間見られます。ちなみにJRの列車にも「下り」「上り」という表現がありますが､これは東京を中心にして、東京から離れる方向を「下り」とし、その逆を「上り」としています。ですから北海道の大都市は札幌ですが、小樽から札幌方面行きは「下り」になります。●北前船3．北前船の発祥蝦夷地と呼ばれた北海道で、北前船が仕入れる主な資源は何だったのでしょうか。平和な江戸時代になり、人口が増大することにより西日本における米・綿・藍・菜種などの農産物の生産向上が求められました。このための肥料として役立ったのが北海道で大量にとれる鰊でした。鰊は漁獲された浜で鰊粕に加工され、俵詰めして北前船で大坂まで運び販売されたのです。西海路は18世紀初頭、蝦夷地まで延長され、北海道一東北一北陸一山陰一瀬戸内一大坂という航路ができました。この北前船による商いを最初に担った商人は、近江商人やその船乗りであった北陸の人々でした。ぞくげん近江商人は「近江泥棒・伊勢乞食」という俗諺があるほど、商売に負欲あるいは堅実といわれ、彼らが船乗りに雇ったのが北陸地方の人々でした。こうして北陸の船が日本海から瀬戸内海に入り、蝦夷地と大坂を結ぶ廻船として北前船が生まれることになりました。●大型和船の種類大型和船＝弁財船北前船大阪～蝦夷地菱垣廻船大阪～江戸(運賃同盟）4．北前船の語源樽廻船大阪～江戸(四斗酒樽）－ノ一「北前」という呼び名は、瀬戸内地方で山陰地方のことを「北前」と呼んでおり、江戸初期には越中(富山県)や出羽(山形県・秋田県)への出稼ぎ届けを「北前行」といい、そのような「北前」地方から瀬戸内に来る船だから「北前船」と呼ぶようになったといわれています。天保年間(1830～1843)になると多くの商船が集まった大坂では、「北国(北陸)の船で北前航路につく船」を北前船と呼び、他の航路の船と区別するLノ0－ノ"}, {"seq": 43, "page": 34, "img": "guidebook_pages/p043.webp", "t": "ようになりました。北前船の発祥である加賀の古老たちは、北前船のことを「パイ船」とか「ベンザイ船」とか「ベザイ」などといい、たんに「千石船」ともいいます。越前では「ドウバラカキ」ともいいます。●北前船5北前船の商売の特徴菱垣廻船や榑廻船が運搬目的であったのに対し、北前船は経済''1勺に優れた手法を用い、多くの有力船主を輩出しました。それは「運賃積み」ではなく「買い積み」という方法でした。各地で買い集めた安い品物を有利な土地に運んで高く売る、つまり商売をしながら航海をする手法です。有力船主になるには、どこで何が不足で、どこで何が豊かかという情報をつかみ、商いの成果を出さなければなりません。6．北前船商法の系譜北陸地方の船乗りたちは近江商人に雇われ、彼らの商い手法を学びました。「持下り商法｣とか｢のこぎり商法｣という手法が、「商売をしながら航海する」手法になっていきました。しかし船乗りの給料はたいへん少ないうえ遭難も多い危険な仕事でした。ただ、積荷の約一割は船乗りの個人商売を認めるという、「切出し」「帆待ち」と呼ばれた抜け道がありました。北陸の船乗りたちはこれを利川することで金銭を蓄え独立していったことがうかがえます。7．北前船の寄港地と積荷最盛期の北前船は蝦夷地と大坂を往復していました。大坂から蝦夷地に向かうのを「下り」、その"}, {"seq": 44, "page": 35, "img": "guidebook_pages/p044.webp", "t": "送を「上り」といいました。積荷の内容も上り下りではまったく違います。下り荷は、米などの食糧・酒・衣類・塩・紙・砂糖などの生活必需品、上り荷は、角・触粗・数の子・昆布・イリコ・ホシアワビなどの海産物でした。8.北前船の利益1航海における船主の利益は千両といわれ、今日の1.5億円に近かったといいます。これは船1隻の利益なので、1人の船主が数隻所有していると2倍、3僅になっていきます。ただあくまでゃ成功した場合です。遭難や経営不振もあったでしょうから、簡単な商売ではありませんでした。お_航海たおいて支払わなければならない避用を!区用金」といい、給金・税・祝儀等のて直払の日米・味噌・新等のかまとどの中)、AOLo6EN糧・縄・柿渋等の「雑道具口」、船の修っざF基北前船主は商機をとらえて、次から次へと航海をしていくので、1カ所に長く留まってはいられません。しかし常に短期間で売りさばくことも難しく、蔵を持っている地元の商人に預ける「蔵敷という経費もかかりました。そのため北前船主は売りさばきの多い港、たとえば小樽に倉庫を建て、人を雇用し、自ら蔵敷業務を行っていったのです。89.北前船の衰亡一枚帆の木造船という北前船の構造は、江戸幕府の規制によるものでした。それは幕府が、諸藩による軍事的な船の利用を芝れたためでした。慶長14(1609)年諸大名に対する大船禁政、天保13(1842)年三三橋禁止令がそうですが、明治21869)年には西洋型風帆船や蒸気船の製造・買い入れが明治40(1907)年頃の北浜海岸沿いに倉庫が並ぶ(越崎コレクション)(小樽市総合博物館蔵)有幌町船入潤(小樽市総合博物館蔵)江木PR栄え行く小村港内(小樽市総合博物館蔵)小樽水天宮より港内を望む(小樽市総合博物館蔵)うら"}, {"seq": 45, "page": 36, "img": "guidebook_pages/p045.webp", "t": "許可され､同21(1888)年には500石以上の日本型船は危険なため建造禁止というまったく逆な法律が定められていきます。そうしたなかでも、北前船は明治後期まで大いに活躍しています｡西洋型風帆船が許可されても、建造費が高額ゆえ、そう簡単には手が出せなかったということでしょう。小樽港の古写真を見ても、明治後期になっても北前船の数が圧倒的に多いことがわかります。このような船舶の近代化とともに、時代は商売の背景に大きな影を落としていきました。電話をはじめ通信技↑|f示発達し、情報が早く大量に行き交うようになってきたため、北前船商人の持っていた情報特権のような能力が功を奏しなくなってきます。鉄道路線の伸長により開拓のペースは上がり、これまで以上に大量の物資運搬が求められ、蒸気一へ船の時代になりました。さらに肥料として大きな価値を持ち「金肥」といわれた鰊粕の原料となる鰊が､次第に不漁になってきました。綿花がインドから大量に輸入されるようになり、明治29(1896)年の綿花輸入税撤廃で国産綿は次第に栽培されなくなってきました。つまり鰊のllu料としての需要が激減してきたのです。こうして明治末期から、北前船による海運は衰えていきました。●北前船－－畠二一＝小樽寄港の北前船（小樽市総合博物館奥山コレクション蔵）一一夢魁小樽港（小樽市総合博物館蔵）小樽港（小樽市総合博物館蔵）"}, {"seq": 46, "page": 37, "img": "guidebook_pages/p046.webp", "t": "10．商人と小樽【コラム】｢百年経たわびさび」加賀や越前の北前船主の本宅の造りは、小樽の倉庫の素朴な造りと異なり贄を尽くした内容になっています。徹密な宮大工の技術、欄間や床の間の優れたひのきデザイン、檜や石などの素材、掛け軸や屏風の芸術性などみな一級品ばかりであつらえられてごかしよういます。また八幡や五箇荘などの近江商人の本宅も同様です。しかし彼らの本拠の自宅に比べて、出先の小樽の倉庫の構造は木骨を軟石で囲い瓦屋根と土間という合理性の極みになっています。建築への考え方の差は歴然としていますが、百年経た今、誰もが憧れた当時の贄沢より、わびさびを醸すと同時に、小樽にしかない様式美を感じさせてくれています。充分なお金を積んでできることと、充分な智恵を出してできることの差は、年月が経てば答えが見つかるのかも知れません。●北前船Iﾘl治初期には小さな一漁村に過ぎなかった小樽に、さまざまな地域から商人が拠点を設けてきました。そんきょう小樽には「榑僑」といわれる巨万の富を築いた商人が数多く活躍し、小樽に残る歴史的遺産の多くは彼らが創ってきました。彼らの出身地により、小樽にはこんな俗諺があります。ちならしおうみにたれまきまつまえひりようのかか1二かりとI)えらご「地均近江種蒔松前肥料加賀刈取越後」「地均近江」とは、江戸中期から後期にかけて近江商人が小樽地域に進出､鰊を独占的に扱い、「タカシマ場所・オショロ場所｣を西川家、「オタルナイ場所」を岡田家が仕切り、小樽地域の商業拠点を「地均し」してきたという意味です。「種蒔松前」とは、小樽に商業拠点の種蒔きをしたのが松前商人ということです。近江商人は松前を拠点にしており、鰊のとれる地域が南から北へ移動したのを追ってきた結果、小樽に移ってきました。したがって、松前商人の元祖も近江商人といえますが、小樽へ来たのは松前生まれの商人もいたという意味になります。「肥料力ll賀」とは、近江商人に船乗りとして雇わノれていた北陸地方の人々が独立して北前船交易を盛んに行い、小樽の商業拠点を盤石なものにしていったことを意味しています。北陸地方は「加賀（石川県南部)」「越前(福井県)」「越中(富山県)」かえつのう「能登(石川県北部)」で通称「加越能」と呼ばれ、近江商人に対して加越能商人という言い方をしています。その中を代表して力II賀商人が肥料を与えて小樽の全盛時代を築きました。「刈取越後」とは、同じ日本海西海路上にある越後(新潟県)商人が北前船交易に便乗しながら、堅実な商売を成功させてきたことを、「刈取｣という言葉で表現しています。つワ"}, {"seq": 47, "page": 38, "img": "guidebook_pages/p047.webp", "t": "こうした小樽の商人の系譜は、北前船の歴史をよく反映していることがうかがえます。●北前船11．小樽ゆかりの北前船羊’にしでまこざえもんかかしはしたくまち●西出孫左衛門（石川県加賀市橋立町）西出家11代目孫左衛門は明治23(1890)年に橋立で北前船主だった5代目西谷庄八(西出の姉婿)とともに小樽に倉庫を建設、同26(1893)年開業式を挙行しました。現在の総合博物館運河館・観光協会・運河プラザなどが入っている小樽を代表する木しゃちほこ骨石造倉庫です。寄せ棟の瓦屋根に鮠を乗せた和洋折衷のデザインで、煉瓦造の事務所を中心として、中庭を開むように倉庫を配置しているのが特徴です。小樽倉庫は開業2年後の|司28(1895)年会社設立登記を行いました。これは法人としての北海道初の倉庫会社となりました。西出はのちに函館に転居、函館でも各種の企業に参mliしました。ちなみに現在の夜景で有名な函館II1はかつて西出の所有で1几i出山と呼ばれていました。にしやしこうばち●西谷庄八（石川県加賀市橋立町）橋立の北前船主の5代目西谷庄八は万延元(1860)年生まれ、小樽に進出したのは明治22(1889)年です。小樽払曲」"}, {"seq": 48, "page": 39, "img": "guidebook_pages/p048.webp", "t": "さいおんじきんなる小樽倉庫の株主は西出孫左衛門・西園寺公成・いなづみしげあきささきしん－凸凸竜が1容亡で稲積重顕・佐々木慎思郎・中西出ハツ・西谷庄八・だけだのぷまさに
