らはじまります。現在最も偉容を放つ、小樽倉庫・大家倉庫・右近倉庫・広海倉庫などは、100年経た今日もしっかり原形を留め、運河沿いにたたずんでいます。一般的な倉庫や蔵などと比べ、鱗や越屋根やアーチといったデザインには、「これからは俺たち(加越能商人)の時代だ」という気概がうかがえます。中庭を設けた小樽倉庫には、荷さばきを機能的に行うための工夫が見られます。同じ木骨石造という建築様式の小型の蔵も数多く残り、小樽の街並みの重要なアクセントになっ印の由来は、戦国時代の「馬印」といわれています。敵味方を区別する目印だったのでしょう。火消し職人や宮大工などの職人社会にも広まり、半纏や道具に印をつけることも行われました。さらに商業が広域に展開されていく江戸時代には、船の帆印や店の暖全などに掲げられ、商人社会にもおおいに普及していきました。紀伊国屋・越後屋というのは「屋号」といわれ、印がマークであるのに対して屋号は、社名・店名・プランドということになるでしょ5。家七平(小構市総合博物館蔵旧大家倉庫(兵庫コレクション)(小樺市総合博物館蔵)る枚を人旧右近倉庫(兵庫コレクション)(小樽市総合博物館蔵)旧中村倉庫(一部焼失)に所生え)"}, {"seq": 51, "page": 42, "img": "guidebook_pages/p051.webp", "t": "大正から昭和初期に発行された小樽電話番号簿には、それぞれの印が掲載されており、印でひけるものまであるほど、小樽では印が広い範囲に普及しており、今日も使用されている会社が数多くあります。●北前船ひきふだ◎引札引札の発祥は江戸時代宝永年間(1704～1710年)、小樽倉庫の鱸（小樽市総合博物館蔵）(鮠は室町時代から火伏せの意味で城郭に用い商業が盛んになってきたころに登場した一枚ものられた飾り)｢世界大百科事典｣平凡社より※火伏せと同時にはねる尾から元気の誇示ともの商業印刷物といわれ､今日のチラシの前身です。受け取れ､寄港船にとっては充分なランドマーク嘉永6（1853)年の『守貞漫稿」には、江戸ではになったと思われます。引札、京坂ではちらしという呼び名のちがいが記され､今日、引札ではなく、ちらしという名が残っているのは、やはり商業の巾心は京坂であった名残といえるかもしれません。その目的は販売促進で、年始あいさつや開店・改築などの祝いごとを多くの人々に知らせることも兼ねていました。内容にも工夫が力llえられ、江戸末期には浮世絵の影響を受けた多色ﾙilllりの絵が入り､絵画的芸術性の高いものも配布されました。ひらがげんまた「口上｣(宣伝文句)は、江戸時代には平賀源小樽倉庫の鰔ないさんとうきょうでんきよくていばきんしきていさんぱおおたしよくさんじん（兵庫コレクション)(小樽市総合博物館蔵）内･III東京伝･lll1亭馬琴・式亭三馬・太田蜀ll1人、かながきるぷんおざきごうようもりおうがい明治になって仮名垣魯文・尾II1f紅葉・森鴎外などの文豪も手がけました。付加価値として、暦や生活情報を提供するなどの進化を遂げてきました。罰病このような機能を発揮した引札は、北前船交易肝心固毎､においてもおおいに利用されています。〆？亀ﾚハふなえま◎船絵馬I船絵馬は海上安全を祈願するために奉納されました｡北前船に関係した地域の神社には必ずといっていいほど船絵馬が奉納されています。大坂にはたくさんの絵馬屋があり、絵馬師という職人も存在していました。明治・大正にかけて福井県には437枚､石川県には385枚、新潟県には483枚が確認されています。い、、封、－ず房引札（小樽市総合博物館蔵）"}, {"seq": 52, "page": 43, "img": "guidebook_pages/p052.webp", "t": "これほど多くの船絵馬が残されているということは、北前船による商売が大きな危険がともなっ2IO2生きのG@般筆箱重要書類や金銭を収納する船重入は、単に頑丈なだけではなく、海に投げ込んでも水が入らないようにつくられ、そのうえ中身の盗難を防ぐため、二重・三重のパズルのような構造が工夫されています。また人金具の文様形式なども細かな意匠が施され、豊かな芸術性も感じられます。れサう1にだ|杉省電重介才江本本前内小樽電話番号簿(小樽市総合博物館蔵)船絵馬(小欄市総合博物館蔵)船律箇(小樽市総合博物館蔵)『北前船の時代』和野際信著教育社歴史新書明和54年『北前船和野隆信著柏書房明和39年/昭和40年『加賀の文化創刊履野際信著加各市教育委員人平成5年『北前船』加藤貞仁著無明樹出版平成14年『小樽市の歴史的建造物』小樽市教育委員会平成6年『小樽市指定歴史的建造物一覧』小樽市建築都市部環境デザイン課平成12年『世界大百科事典』平凡社昭和47年プイ?"}, {"seq": 53, "page": 44, "img": "guidebook_pages/p053.webp", "t": ""}, {"seq": 54, "page": 45, "img": "guidebook_pages/p054.webp", "t": ""}, {"seq": 55, "page": 46, "img": "guidebook_pages/p055.webp", "t": "1.集落の誕生と商人の閉眼明治2(1869)年に開拓使が設置されましたが、まずは、開拓民がどうやって生活をしていくかという方が重要でした。なぜなら北海道の広い大地一面が原生林に近い状態で、しかやゃ1年の半分は雪に埋もれる上厳しい大自然が横たわっていたからです。北海道には本州で大変人気の資源がありました。北海道西海岸に押し寄せてきていた人魚です。角をしぼってつくる人魚粗は「金肥」といわれるほどの価値を持ってい本州では増加する人口を支え、外貨を獲得するために、より多くの農産物を生産する必要がありました。角柏を肥料として使うことで、豊かな実りが期待できました。この有効な肥料としての触に着目した商人が、小樽近辺に拠点を設け、北前船で関西地方に大量に売りさばいていきました。こうして北海道西海岸は明治になってから、鯨のおかげで集落がつくられていき記しだ2.小樽商人の業務一般的な産業分類では、農業や漁業・鉱業を第一次産業、工業を第二次産業、商業やサービス業を第三次産業として区別しています。小樽商人の商業は、示端消費者に販売する小売業ではなく、卸売業が主流でした。上級武士以外の江戸時代の人々は、生まれたところから一生涯出ないで生活をすることもありましたが、明治時代になり、大量輸送の船が広域で機能するようになると、さまざまな人ぐや物資の交流が盛んになってきます。安政6(1859)年のオタルナイ(小樽市総合博物館蔵)"}, {"seq": 56, "page": 47, "img": "guidebook_pages/p056.webp", "t": "卸売業に必要なのは輸送手段と情報収集でした。「A地域では何が不足していて何が豊かなのか、そしてB地域ではどうか、売るIIf期はいつか、値した◇段はどれくらいで売れるか」といった情報を収集、←毎分析し、それらを流通させるための輸送手段を確保していきました。一■一一一弐一一邸一全声一筆〃争一『、坐●商忍路港の鰊漁（小樽市総合博物館蔵）3．小樽商人の系譜小樽商人の勢いがいかに大きかったかを示す言かきょうそんきょう葉に、「華僑」ならぬ「榑僑」という表現さえあります。鰊という有望な資源があったことや、石炭という資源の積出港であった小樽で商機をうまくとらえ、巨万の富を手にした商人が生まれてき■人鞘町暁刊〔蛎榔ました。し必ロ“…■唯上ら＝ー■漁場開拓からはじまった近江商人小樽には、江戸時代中期から岡田家と西川家という近江商人が、鰊を資源とした商いをしていました。有幌船入澗に係留する北前船彼らのこの時代の業務を見ると､知行主(松前藩（小樽市総合博物館蔵）士)から場所を任され､漁獲に必要な道具をそろえ、出稼ぎやアイヌの人たちを雇用して、漁業を行っています。つまり場所という権利確保・漁獲(漁業）・力ll工(工業）・運搬・販売(商業)といった総合的な商いであったことがわかります。ちなみに近江商人と伊勢商人は、日本の近世における商人の元祖ともいえるほどです。長い歴史を経て今も盛業中の近江商人が築いた主な企業は以下のとおりです。澳蓄~悪~F悪玉しにかわじんえもんしようのげんぞう西川仁右衛門の西川産業、正野玄三の日野薬品工業、たけだちょうくえいいだしんしち一一武田長兵衛：武田薬品工業、飯田新七の高島屋(百貨店)、いと･ﾗ)ちゅうぺえひろせすけさぶろう伊藤忠兵衛の丸紅・伊藤忠商事、弘世助三郎の日本生命保つかもと二ういち小樽港の出船入船北前船険会社、塚本幸一のワコール（小樽市総合博物館蔵）"}, {"seq": 57, "page": 48, "img": "guidebook_pages/p057.webp", "t": "◎岡田家おかだやざえもん始祖岡田弥三石衛門は､永禄年間に近江国加茂村に生まれ､6代目まで弥三右衛門を雲名｡文化4(1807）年恵比須屋岡田源兵衛がオタルナイ場所請負として進出し、オコイパッチエイ(堺町)、クッタルウシ(有幌町付近)、ノブカ(信香)、アットマリ（勝納)、クマウス(熊碓)、アサリ(朝里)、ハリウス(張碓）場所を開拓しています。おかだやそじ第11代目岡田八十次(1820～1907)は岡田家中興の祖で､小樽に大三岡田店を開き小樽郡内全域を掌こんたんまち握し金曇町、山ノ上町などの開発を進めました。(『北海道｢海｣の入国記』伊藤孝博著無明舎出版）(http://ikOi99・Web・infoseek.co・jp/nihonhen/oumikikou/oumiinfo.htmlより）(読みは『北海道蝦夷語地名解』北海道聯合教育會昭和2年より）◎西川家にしかわでんえもん始祖西川伝右衛門は、寛永3(1626)年近江国八幡町に生まれ､慶安3(1650)年には松前に渡っています。天明6(1786)年住吉屋西川伝石衛門(松前藩御用達)がオショロ・タカシマ場所請負人として進出し、他にアツタ(厚田）・ウタスツ(歌棄）・イソヤ(磯谷）・ホロベツ(幌別)場所を開拓しています。(『北海道｢海｣の入国記』伊藤孝博著無明舎出版）(http://ikoi99.web.infoseek.co.jp/nihonhen/oumikikou/oumiinfo・htmlより）(読みは『北海道蝦夷語地名解』北海道聯合教育會昭和2年より）忍路の鰊漁（小樽市総合博物館蔵）"}, {"seq": 58, "page": 49, "img": "guidebook_pages/p058.webp", "t": "いしばしひこさふ/うう◎石橋彦三郎彦根生まれ｡明治8(1875)年に北海道へわたり色内町の兄の店で呉服問屋を始め、やがて醤油醸造に専念。丸ヨ石橋商店は有力な醤油醸造会社となりました。のく'ち北の誉酒造(酒泉館)の前身、マルヨ野口商店の始祖野口きちじろうとうじ吉次郎は杜氏として石橋商店で修行をして､暖簾分けで｢マルヨ」の印をもらっています。奥沢1丁目には明治後期に建てられた石橋商店醤油工場群が残っています。(http://ikoi99.web.infoseek.co.jp/nihonhen/oumikikou/oumiinfo.htmlより）凸面け鰊加工場風景（小樽市総合博物館蔵）■鰊を追って北上した松前商人江戸中期から幕末にかけて、松前藩のあった福山地方には場所請負人として鰊の漁場を独占していた近江商人がおり、松前で生まれて近江商人の手ほどきを受けた商人もいました。鰊はしだいに道南沿岸から道央沿岸へと、回遊コースが北上したために､鰊を追って松前から小樽に拠点を移した商人もいました｡彼らを松前商人と呼んでいます。彼らの特徴は、漁業からはじまり、海運業や商業などへも進出、小樽でも成功をおさめて、財を成し、政治やまちづくりに貢献してきたことがあ信香町常夜灯（小樽市総合博物館蔵）げられます。かｵﾑこもとさぶろう◎金子元三郎金子家は代々松前の漁業家でしたが、明治18(1885)年色内町に初代金子元三郎が店を開きました。金子家の養子となった越後生まれ松前育ちの金子元三郎は2代目です。なかえらようみん2代目元三郎は明治24(1891)年|こ主筆に中江兆民を招き、小樽で最初の新聞「北門新報」を発行します。同33(1900)年初代小樽区長になり、同37(1904)年衆議院議員選挙で当選､大正3(1914)年には憲政会北海道支部を結成し支部長に就任、貴族院議員にもなっています。市内緑にある直行寺は金子家が建立した菩提寺でした。堺町の旧金子元三郎商店には「北門新報」の印刷所として旧石橋商店の印も使われていた石蔵が残っています。"}, {"seq": 59, "page": 50, "img": "guidebook_pages/p059.webp", "t": "やまだへいぞうやまだきちべえ｢qｺﾗﾑD、、◎山田兵蔵・山田吉兵衛兵蔵は、文化年代中頃(1810年前後)に来樽、元治2(1865）「小樽市金満家名簿」年オタルナイ村の名主となりますが、小樽が村並になった昭和6(1931)年新年号『講談倶この年は小樽の開基とされています｡安政3(1856)年に信香楽部』「小樽市金満家名簿｣にお町で呉服・瀬戸物・塗物・米・味噌・荒物などを扱う店をいたやみやきち開き､漁業も営み､和船2隻を所有して交易もしていました。いて､トップはダントツで板谷宮吉ふじやまようきち明治5(1872)年に没しますが、同3(1870)年に家督を養子吉が資産5千万円、2位が藤山要吉兵衛に讓っています。で桁が－つ落ちて5百万円､そし吉兵衛は松前藩の城下町福山に生まれ、山田兵蔵の養子’て3位に石橋彦三郎の4百万円とになり、家督を継いだ後、開拓使小樽出張所の金穀御用逹あります｡当時の小樽市の一般・を勤めています。また同21（1888)年には港町で活版所を経特別会計合わせて399万円ですか営しています。ら､石橋の資産で小樽が1年食え明治15(1882)年1月､所有地の相生町から水天宮山の西裾るという金額です。を通って堺町のオコバチ川までの道路造成を､427円全額をちなみに平成18年度の小樽市負担して行ったことに感謝した地元が､同19(1886)年5月山の総予算は1,162億円ですが､個田町と命名しました。人でそれほどの資産を持ってい明治28(1895)年に小樽商業会議所発起人会がスタートしる人が今いるでしょうか？ました時の初代会頭に就任し､同35(1902)年には第2代小樽区長てその10倍の資産を持った人もになっています。いたのですから、小樽商人がどれほどスゴかつたかはまさに雲をつかむような感じです。｜旧金子元三郎商店明治24(1891)年頃の小樽港図（小樽市総合博物館蔵）"}, {"seq": 60, "page": 51, "img": "guidebook_pages/p060.webp", "t": "わたなくひょうしろう【コラL】◎渡辺兵四郎渡辺は秋田県能代生まれ｡安政4(1857)年商用で秋田にやっ｢会議所発起人」て来た山田兵蔵に連れられ、15歳で小樽に来ました。兵蔵明治28(1895)年に代わって明治24(1891)年には小樽郡の総代人も勤めまし小樽商業会議所設立発起人板谷宮吉林清一独立は32歳と少し遅く、山田家の漁業のほか荒物商を営早川両三西谷庄八みました。明治13(1880)年山田家総代理人になって、漁網堀井音次郎渡辺兵四郎の改良を手掛けるなどし、小樽漁業組合頭取・小樽水産組田口梅太郎田中武左衛門合長と、水産業界の舵取り役を果たします。同23(1890)年第一渡辺精米、同25(1892)年第二渡辺精米を設立、精米業高橋直治田巻誠司をはじめています。商売から政界に転じ、区会議員から始高野源之助直江久兵衛まり、同35(1902)年道会議員となり、同41(1908)年衆議院山田吉兵衛町野清太郎議員。同45(1912)年5代目の小樽区長に就任し、長い間もめ福長作太郎遠藤又兵衛た明治の運河問題を解決しました。新谷喜作塩田安蔵鈴木市次郎の19人会頭に山田吉兵衛畠'｣会頭に渡辺兵四郎を選任「小樽商工会議所ホームページ｣より金子元三郎山田吉兵衛渡辺兵四郎山本久右衛門(小樽市総合博物館蔵）(小樽市総合博物館蔵）(『小樽商工会議所百年史』より）（『小樽』より）"}, {"seq": 61, "page": 52, "img": "guidebook_pages/p061.webp", "t": "やまもとき;力うえもんこうぞう◎山本久右衛門・厚三山本久右衛門は陸奥田名部(胄森県)の出身です。天保12（1841)年に16歳で松前に渡り、米や味噌を商う店を開いています。養子の2代目久右衛門は焼尻・天売・利尻・礼文に漁場を開き、北前船交易を行い、明治になってから西洋型帆船4隻を買い入れ、商売を盛んにしていきました。同30(1897)年に雲名した養子の3代目久右衛門が同39(1906）年函館・瀬棚、同40(1907)年小樽・樺太、大正3(1914)年小樽・新潟・佐渡の航路を開いています。明治38(1905)年には小樽倉庫株式会社の経営権を握りました。4代目にあたる厚三は明治14(1881)年長野県飯田の平沢家の三男として生まれ、同36(1903)年現一橋大学を出て山本家の養子となります。小樽倉庫・北日本汽船・小樽信託・帝国養蜂・大正製麻・大北火災・定山渓鉄道・北海道製綿などの発起人や社長に就任しています。また区会議員・市会議員を経て､大正9(1920)年金子元三郎の支援で衆議院議員に初当選、以後8回も連続当選しています。しんじ小樽倉庫は厚三の次男信爾が継ぎ、昭和58(1983)年には小樽市が|日倉庫の建物を買い取り、右棟に総合博物館運河館、左棟に運河プラザ、中央棟に観光協会が入っています。小樽倉庫株式会社は今日も発展継承され、運河沿いの倉庫の一部はアレフ経営の小樽ビールがテナントとして再利用しています。小樽ビール（小樽倉庫所有）小樽区公会堂（現小樽市公会堂）（小樽市総合博物館蔵）山本厚三藤山要吉(『小樽商工会議所百年史』より）(『小樽』より）"}, {"seq": 62, "page": 53, "img": "guidebook_pages/p062.webp", "t": "ふじやまようきち＝◎藤山要吉嘉永4(1851)年秋田久保田町に生まれた要吉は､慶応3(1867）『北海道加越能人名録』たなかふざえもん年に17歳で松前の廻船問屋田中武左衛門に学び、同じく福ふじやまじゅうぞうこの人名録は大正5(1916)年に山から小樽に渡った信香町の廻船問屋藤山菫蔵（山田吉兵道内で広告掲載を呼びかけて応衛の親類)の養子となり､明治12(1879)年家督を継ぎました。募があった人物のみを掲載して小樽－北陸、小樽一稚内、小樽一越後の航路を開き、同37(1904)年の日露戦争に船を提供して財を築きます。漁業にいるので、応募しない人々も多も着目し主に道北に鰊漁場を開拓し、他|こ牧場・林業・鉱くいたであろうことは充分想像業・倉庫業・銀行・不動産などを手がけ、明治44(1911)年できますが、他市との比較はあの東宮行啓に際しては東宮宿泊所(今の公会堂)を寄贈してる程度信頼できる数字と思われいます。ます。小樽が257人、函館が123市民会館に銅像が建立されています。北海製罐(株)電解人、札幌が162人、旭川が81人と工場の倉庫は|日藤山倉庫です。なっており、小樽にはダントツで加越能出身者が多くいて、しかもそれなりの財を築いたことが見えてきます。ちなみにこの加越能は加賀・能登の石)||県と越中の富山県|こ限られています。広い意味での加越能にはこれに越前の福井県も加わるので、その差はまだつくと思われます。（大正5年発行『北海道加越能人名録』より小樽市総合博物館蔵）■北前船交易の加越能商人江戸ll寺代に財を成した船主の近江商人は、明治に入るとスポンサーもしくは株主あるいはオーナー的存在になっていきます。船を所有し、安い賃金で船乗りを雇い､航海をさせていきます。「板コー枚下は地獄」という危険な航海で、船主は金銭的リスクを､船乗りは生命的リスクを負っていました。船乗りには､力ll賀(石川県南部)･越前(福井県)･越中(富山県）・能登(石川県北部)の人々が多くいました。これらの船乗りがやがて船頭となり、船主となり、新興の地である小樽に進出してきました。彼らを称して「加越能商人」といいます。加越能商人が小樽の歴史を創ってきた大立て者といっても過言ではありません。一方､人口が増えていく北海道や樺太を市場に、雛浸寿原彌平次寿原猪之吉寿原菫太郎寿原英太郎(『寿原商事株式会社50年史』より）(『寿原商事株式会社50年史』より）(陦原商事株式会社50年史』より）(『寿原商事株式会社50年史』より）"}, {"seq": 63, "page": 54, "img": "guidebook_pages/p063.webp", "t": "避信外業も活発になってきました。小間物(化粧品)、瀬戸物、食品、衣類、酒類を扱い、財を成す加越能商人やも募出しています。⑨西出和孫左衛門(北前船P38参照)⑨西谷庄八(北前船P38参照)⑨広海一三郎(北前船P39参照)⑨犬家七平(北前船P40参照)⑨⑤右近権左術門・中村三之永(北前船P40参照)すはらやへいじいのきちじゅうたろう⑨ぐ寿原弥平次・猪之吉・重太郎3兄弟寿原弥平次は富山県砺波郡福岡出身。明治14(1881)年5月に発生した小樽の大火の情報を秋田で聞いて、同年7月には小樽の有幌町で瀬戸物店を開業しました。猪之吉が、オコバチ川畔の堺町で和洋小間物店を開業したのは明治22(1889)年のことです。明治31(1898)年には弥平次が瀬戸物、猪之吉が小間物、その弟重太郎が洋品・缶詰を扱い、3人で経営します。小樽で初めて複式簿記を採用したのも重太郎といわれています。おたる織物(染色アトリエKazu)は元は奥山商店の蔵ですが、明治34(1901年寿原小間物店に店や商品ごと譲渡されii昌コラム「加越能資本の銀行」十三銀行(本店:富山)明治32(1899)年小樽支店開業、昭和18(1943)年北陸銀行に統合第四十七銀行(本店富山)明治40(1907)年小樽支店設置、昭和15(1940)年十二銀行に合併(現北海道紙商事株式会社)中越銀行(本店:富山)明治45・大正1(1912)年小樽支店設置、昭和18(1943)年北陸銀行に統合(現銀の鐘)北陸銀行(本店:富山)昭和18(1943)年設立小樽の金融機関は、年代によ合併等の変遷もありますが、開業はのべで平成13(2001)年までに50社ほどが登記されています。その中で本店が東京24社で最も多く、札幌が8社、小樽・函館・富山が4社となっています。東京は中央市場で当然で、札幌・小樽・函館は北海道の都市ですが、富山という地方の資本が4社も設置されていることはそれほどご縁が深いことを物語っています。(\"小樽の銀行小史」渡辺真吾還欄市総合博物館紀要』(2003年3月)よ寿原九郎寿原外吉((原商事株式会社50年ま】より)(『小樽商工会議所百年喝』より)野口喜一郎(小樽市総合博物館蔵)"}, {"seq": 64, "page": 55, "img": "guidebook_pages/p064.webp", "t": "明7(1893)年りー(時商事株式人50年)より)すはらいのきち@ぐ寿原猪之吉・英太郎・九郎大正元(1912)年には寿原合名会社を猪之吉が設立し、候子英太郎と経営します。色内町に本店をおき、入船町に支店をおきます。昭和5(1930)年に英太郎が市議会議員に当選、郷里の大聖寺から九郎を養子にします。英太郎は同7(1932)年に衆議院議員に当選、戦後の同22(1947)年には小樽市長に当選しています。九郎は大正13(1924)年に小樽高商を卒業、同期に小林多喜二がいました。卒業後三井に入社しますが、昭和9(1934)年に重太郎や英太郎が関わった小樽無尽に入り、同23(1948)年には北洋銀行の社長に就任します。この建物は現在、市民有志が買い取り「おたる無尽ビル」として運営されています。すはらそときち@ぐ寿原外吉外吉は弥平次の縁上で大正9(1920)年酒井から入籍しました。寿原商店と寿原農場の社長に、また小樽商工会議所の第15代会頭にもなっています。外吉が札幌証券取引所の2代目理事長になったのは昭和26(1951)年。3代目の今井道雄に引き継ぐまで14年間も続け、ほかに北海道硝子卸商業協組理事長から全国板硝子卸商連合会の副会長と、本業を支える仕事にも精を出しました。(http://Www.otarucci.jp/kiseki/kiseki.htmlより)水天宮横東雲町の高台に、石志に囲まれた旧寿原邸(最初は高橋直治邸として建設)があります。明:治43(1910)年人内町の寿原合名全社(『寿原商事株式会社50年史』より)旧寿原邸(最初は高橋直治邸として建設)"}, {"seq": 65, "page": 56, "img": "guidebook_pages/p065.webp", "t": "のぐちきちじろうきいちろ･）◎野口吉次郎・喜一郎野口吉次郎は安政3(1856)年石川県河北郡花園村二日市に生まれ、7歳から養子先を4回も変わり、28歳に金沢の野口家の養子になり､野口吉次郎と名を変えます｡明治19(1886）年北海道に渡り、入船町で古着の行商を始め、間もなく石橋商店の杜氏となり、同30(1897)年石橋商店の丸ヨ印をもらい、店を構え独立しました｡3年後には札幌北の誉の始祖ちょうじるうおかだいちまつじゅうじろうで弟の長次郎､旭川北の誉の始祖で同郷の岡田市松と菫次郎が手伝いに入ってきます。明治34(1901)年酒造を開始、同35(1902)年には奥沢に酒造所を建て、同36(1903)年に「北の誉」の商標登録をしました。北の誉酒造は現在「酒泉館」として試飲や日本酒醸造のしくみを見学できる施設を設置しています。喜一郎は吉次郎が石橋商店で杜氏をしていた明治20(1887）年に生まれました。潮見台の丘上の和光荘は「北の誉は野口の誉」ともてはやされた喜一郎の時代、建築家山崎仲が設計しました。喜一郎は建築が趣味だったので、彼も意向も建物に反映されています。「大正11年(1922)建築､木造4階建一部鉄筋コンクリート造､天皇・皇后両陛下が昭和29年(1954)8月にご来道の際、小樽での宿所となった由緒ある建物である」という看板が立っています。(http://www.ota｢ucci.jp/kiseki/kiseki.htmlより）人共成（現小樽オルゴール堂）（小樽市総合博物館蔵）明治39(1906)年に建設された日本郵船株式会社小樽支店（小樽市総合博物館蔵）いまたきさぷろう◎沼田喜三郎天保5(1834)年越中西砺波郡津沢生まれ｡明治15(1882)年48歳で渡道。まだ米がとれなかった北海道に注目し、精米事業を企てました。オコバチ川沿いにいくつか既存の精米用の水車がありましたが、積雪期には機能していませんでした｡そこで上から水をかけることを思いつき､同24(1891）年には共成株式会社を設立しています。_乙負麹明治26(1893)年には開墾委託株式会社を設立､5ヶ年で石狩平野の3千8百町歩の土地を開墾しています。雨竜郡の沼田町は沼田喜三郎の偉業を偲んでつけられています。明治30(1897)年には菜種油を製造する小樽製油株式会社を設立しています。現在の小樽オルゴール堂の建物は大正4(1915)年に共成株式会社として建てられていますが、すでに沼田の経営ではなくなっており､大正8(1919)年には寿原の経営になっています。シＦ砂掘削肌日本郵船小樽支店前（小樽市総合博物館蔵）"}, {"seq": 66, "page": 57, "img": "guidebook_pages/p066.webp", "t": "くらはしだいすけ⑤倉椅大介越前武生の人で、奥羽征討時には越前藩の軍事係、明治5(1872)年に武生町進作学校教師、同9(1876)年山形県四等拘部、同12(1879)年第四十四国立銀行小樽支店設置時に小樽に来ています。同16(1883)年には共同運輸小樽支店副支配人となり、共同運輸は打倒三菱のために創設された会社で、同14(1881)年に設立された越中風帆船会社などが合併して設立されました。同18(1885)年国策で共同運輸会社と郵便汽船三菱会社が合併して日本郵船会社が設立されたときに、石巻支店長として赴任しています。そして同27(1894)年には小樽電灯舎を設立して電気事業を起こし、同30(1897)年には小樽貨物保険株式会社社長となり、その他さまざまな事業に関わっています。金子元三郎・板谷宮吉・寺田省帰・遠藤又兵衛・藤山要吉らとも親交が深かったこともしられています。軒商魂たくましき越後商人近江商人や加越能商人が自ら命をかけて船で渡ってきたのに対し、小樽に定着した越後(新潟)衆は、船で運ばれた積符をどうさばくかというところから身を起こした人が多いようです。したがって堅実で、事務能力に優れていたといわれています。酒はもとより歌舞音曲をさけて、お札を数えることが至福で、数えた札束を金庫室の床に並べて、とうとう2う人金庫室からはみ出て階段から転げ落ちたという逸話を持つ板谷宮吉、ロンドンの殺物相場を牛耳ったという高橋直治、'不在地主」のモデルにされた磯野進、能に熱中したあげく自宅に能2台までつくった岡崎譜などが有名です。壁信すま旧磯野商店倉庫(現海獲屋)"}, {"seq": 67, "page": 58, "img": "guidebook_pages/p067.webp", "t": "いたやみやきち◎板谷宮吉「近江泥棒・伊勢乞食」に対し「越後衆しょっぱいガンー」という俗諺があります。越後衆のケチぶりを表した言葉です。板谷宮吉は安政4(1857)年越後国刈羽郡宮川村生まれ｡14歳で松前にあった同郷の金子元三郎の店に丁稚奉公します。明治8(1875)年には金子の紹介状を手に小樽の山の上町の工藤海産物店に入りました。同15(1882)年にささやかな荒物屋を独立開業し、鰊・精米・醤油などを扱いました。明治35(1902)年英国船を買い、新潟諸港と小樽間に貨物の定期航路を開きました。運は日露戦争で開かれます。船が徴用され莫大な補償金が舞い込んできました。それをもと|こ、同45(1912)年に板谷商船を創立し、阪神・ハワイ航路、大正2(1913)年には大連航路を開始、樺太には銀行を設立しています。2代目宮吉は明治18(1885)年生まれ、板谷順助・柴野仁吉郎に育てられます。大正7(1918)年に初代がたおれますが、小樽市中学校(現長橋中学校)を土地と共に25万円の寄付をしています。母校の早稲田大学にも10万円を寄付しました。昭和2(1927)年貴族院議員に当選、同8(1933)年には無給の名誉市長となっています。永山・美瑛・雨竜でも大農場を経営しました。戦後はそこ､うデパートの社長などもして、同37(1962)年に亡くなっています。たかはしなおじ◎高橋直治高橋直治は安政3(1856)年越後国刈羽郡石地村生まれ｡17歳になるまで祖母から3度の勘当を受けるほどヤンチャだったようです。明治8(1875)年に北海道に渡ります｡山ノ上町の廻船商に奉公に入り、同11(1878)年に独立して｢ジョウヤマキ」の印を掲げ、次第に米穀・海産物の委託販売、味噌醤油の醸造、精米と多角経営に乗り出しています。同27(1894)年には小樽米穀株式外五品取引所の理事長同32(1899)年には小樽商業会議所副会頭、同33(1900)年小樽海陸産物組合長に就任しています｡同35(1902)年には北海道の小豆を買い占め大儲け、その金を鰊漁場に投資してまた大儲け、大正3(1914)年の第一次大戦にはまた小豆を買い占めて、戦地の英国に売って巨万の富を築きました。ここから「小豆将軍」「豆成金」といったあだ名がつけられました。明治34（1901）年北海道初の衆議院議員となり、同42(1909)年・同45(1912)年にも当選後に貴族院議員にもなっています。運河沿いにある、おたるおもしる撮影館の建物は|日高橋倉庫です。初代板谷宮吉2代板谷宮吉高橋直治磯野進(小樽市総合博物館蔵）(小樽市総合博物館蔵）(『小樽商工会議所百年史』より）(『小樽商工会議所百年史』より）"}, {"seq": 68, "page": 59, "img": "guidebook_pages/p068.webp", "t": "いそのすすむ⑥ぐ磯野進明治5(1872)年佐渡両津生まれ。東京法学院(|昌・中央大学)卒業。同30(1897)年に小樽に転居しています。色内町で海陸産物商を営み、北陸人造肥料、北海道精米、北海漁業などの会社にも関わりました。大正2(1913)年4月には小樽商業会議所の7代会頭に就任しています。大正9(1920)年には下富良野に57万9千坪の土地を所有し、農場も経営していましたが、昭和2(1927)年小作争議が起き、小作人の要求をのお形で決着しています。これをモデルにした小説「不在地主」は、同時期に北海道拓殖銀行小樽支店に勤務していた小林多喜二の作品です。この拓銀小樽支店は大正12(1923)年に建てられ、現在はホテルヴィブラントオタルとなっています。また明治39(1906)年に建てられた旧磯野商店の蔵は海獲屋になっています。おかざきけん⑤岡崎謙明治10(1877)年佐渡生まれ。東京英和学校・国民英和学校・東京高等商業学校(現・一橋大学)で学び、同32(1899)年に米・荒物・雑穀・倉庫業の家業を継いでいます。公職では区会議貞・市会議員を歴任、昭和2(1927)年には市会議長|居20)KGlUNESE記加貨藩前田家のおかかえ能楽師であった波吉宮門に能を学ぶなど、深く能を愛し、能舞台を自宅に造るほどでした。現在能舞台は市に寄贈され、小樽市能楽堂として公会堂の一角に移設されています。田中酒造亀甲蔵は明治39(1906)年に建てられた旧岡崎倉庫です。旧岡崎倉庫(現田中酒造亀甲蔵)"}, {"seq": 69, "page": 60, "img": "guidebook_pages/p069.webp", "t": "男小樽の大地主⑨ぐ木村円吉木村家は天保元(1830)年青森県東津軽郡一本木村字大泊生まれの大工、木村円太郎が始祖です。弘化3(1846)年から春になると北海道の増毛で刺綱による押漁を営み、漁期が過ぎると青森に帰っていました。5代目円吉は幼名百太郎と称し、福島の漁家花田伝七の三男でした。明治25(1892)年22歳の時に木村円太郎の孫娘ミヤと結婚、木村家に入りました。仲人は漁家の金沢友次郎ヤマシッメ木村は明治24(1891)年に小樽に本拠を移しています。現在の北一硝子三号館は、明治24(1891)年に建てられた旧木村倉庫です。廻船問屋として米・味噌・縄・雛・食料品などを保管していました。明治後期には、漁場の大兆にも恵まれ、儲けた金で小樽はもことより道内各地の土地を買い占めていきます。大正9(1920)年に道庁が50町歩以上の大地主を調査した時、小樽には山田吉兵衛ら65人いたうちの筆頭が木村円吉でした。本業の水産業では最終的に22ケ統を所有、人道内鯨漁獲高50万石の1割、50,000石を取る最大の親方であり、450人の漁夫を使っていました。6代目円吉は四男で、小樽にフェリーを誘致したのは、彼が小模商工会議所会頭の時でした。6代木村円吉(『小樽商工会議所百年史』より)@人名の地名・通り名西出山(函館山):西出孫左衛門山田。町:山田吉兵衛札幌の山本通り:山本久右衛門雨竜郡沼田町:沼田喜三郎明市藤山:藤山要吉島通り:能島繁蔵吉山:木村円吉(記避映"}, {"seq": 70, "page": 61, "img": "guidebook_pages/p070.webp", "t": "4．小樽商人文化|…「歴代会頭」小樽商人がつくり、それらが時代を経て、今口では小樽の文化となっているものは少なくありま明治29（1896）年8月山田吉兵衛明治31（1898）年7月高野源之助せん。明治33(1900)年6月渡辺兵四郎石造倉庫や石蔵、歴史的建造物になっている社明治35（1902）年6月高野源之助屋や住宅などは、その代表的なものでしょう。そえだたす〈明治36（1903）年4月添田弼小樽に多く残され、文化のひとつともなってい明治42（1909）年4月藤山要吉る「イ」「七」などの印も商人によってもたらされ大正2（1913）年4月磯野進大正4（1915)年4月高橋直治たものです。大正6（1917）年5月山本厚三一方、「旦那衆文化｣ともいうべき文化も生んで大正10（1921）年5月森正則きました。大正14（1925）年4月磯野進岡崎謙の能舞台､野口喜一郎の潮見台シャンツェ、昭和4（1929）年4月河原直孝秋野武夫のスキー資料館奥山富作の写真などは、昭和8（1933）年4月杉江仙次郎今日の小樽に引き継がれた「旦那衆文化」といえ昭和18（1943）年4月松川嘉太郎昭和30（1955）年9月寿原外吉るでしょう。，昭和40(1965）年11月木村円吉商人たちの寄付によってつくられたものも少な昭和48（1973）年9月川合一成くありません。｜ﾘ1治32(1899)年大家・広海寄進のI制蝶黙露悪孔住吉神社大烏居、2代目板谷宮吉の小樽市中学校(現･長橋中学)、土肥太吉の市庁舎、藤山要吉の東宮宿泊所(現･小樽市公会堂)､木村'11吉らの小樽高等商業学校敷地(現･小樽商科大学)などは､商人たちの小樽への貢献として今に伝えられています。【コラム】｜「地名・通名」雨竜郡の沼田町は沼田喜三郎に因んでつけられています。山田吉兵衛は山田町､藤山要吉は留萌の藤山や藤山駅など小樽商人の名が地名になっています。能島繁蔵の能島通り、木村円吉の円吉山という通称も根強く残っています。経済は政治と異なり、後世に建物や施設を残し1識蕊鰯霞？’5．時代の交流拠点小樽にとって明治から大正はまさに北の一大交流拠点でした。これまで紹介した商人のほか、港湾土木の広井勇・青木政徳・伊藤長右衛門、建築家の辰野金吾・曽弥達蔵・佐立七次郎など我が国第一級の智恵が集まりました｡日本銀行をはじめ、民|ﾊl金融機関も数多く設置され、物が縦横無尽に動き、商人の街小樽は活気にあふれていました。商人たちそれぞれの出身地の文化が混じり合い、小樽の文化は創られてきたといっていいでしょう。"}, {"seq": 71, "page": 62, "img": "guidebook_pages/p071.webp", "t": ""}, {"seq": 72, "page": 63, "img": "guidebook_pages/p072.webp", "t": ""}, {"seq": 73, "page": 64, "img": "guidebook_pages/p073.webp", "t": "嘩信1.はじめに\"小樽港から北海道の第一歩がはじまるて較明治24(1891)年の風景明治241891)年、永山の証田兵として高知県から移住してきた野波駒次郎は、計上請ia二時に小樽港に着く。小樽のにぎわい人驚く。二二人の乗客のため航海中は混雑がひどく・・・蒸気船六、七腹が鐘を下ろし、近くの石炭取扱場は実に広大である。江車、そのほか馬車の住復実に多い。色内町八十屋に止宿する(金巻鑑男『上川規田物語』)」と、小樽の印象を移住記録に記し男政府の方針明治新政府は、石狩、空知、上川と順に市田兵を入獲させました。後らは家族を伴い原生株が生い茂る原野で開左と軍事教練に従事したのでした。その役らが入殖にあたり上陸したのが小樽の港でした。小樽港は、まだ近代的な港となっておらず、冬から春の北よりの季節風が吹くと荒濾によって船が岸辺に乗り上げたり、和が通船できなくなり、荷隆しもやままならない時代でした。そのような時代、遼くくは四国や九州からやってきた多くの人達が、狭い船から降りて北海道の大地を踏みしめ、北海道を実感したのは小樽の港だったのです。2.小樽港の現在の姿男車要港湾小樽港は現在、札幌や後志、空知など道央地域を背後地とする日本海側の流通損点港として、また外国買易港として、その役割を果たしており「重要港湾」になっています。「重要港湾」とはわが国における海上輸送網の拠点として位置づけられている港で、国際海上輸送網又は国内海上輸送網の小樽港ノ景/三嶋(北海道大学附属図書館北方資料室所蔵)小樽波止場移民到着ノ景(北海道大学附属図書館北方資料室所蔵)"}, {"seq": 74, "page": 65, "img": "guidebook_pages/p074.webp", "t": "拠点となる港湾その他の国の利害に重大な関係を有する港湾で政令で定めるもの(港湾法第2条第2項)」と記されており、北海道では函館港や釧路港など10港あります。■小樽港の港界線さて、小樽港というと防波堤の内側をイメージかやしぱみ堂きひらいそなさき現在の小樽港するでしょうが､実際は､高島の茅柴岬から平磯岬（北海道開発局小樽開発建設部）に引いた直線(港界線)の内側をいいます｡港界(港域)線内水面積はおよそ570万平方メートル、防波堤に守られている防波堤内被覆水面積は約331万平方メートルです。ちなみに札幌ドームの建築面積は5万4千平方メートルで､防波堤の内側の水面は札幌ドーム約60個分となります。また防波堤内の水深は2.0～20.0mです。河畢戸建萄雪’－－1－圭1言－3．小樽港のはじまり小樽港に停泊するフェリー■江戸時代（北海道開発局小樽開発建設部）17世紀末から江戸幕府を中心に、治水や新田開発などにより、農業の振興が積極的に展開されまにしんかすした。そのことは肥料となる鰊粕の需要を急増させ、当時蝦夷地といわれていた北海道は、鰊の生産地として人々が集まるようになりました。冬季間の季節風が防がれ、また鰊の豊漁が続いた小樽は、江戸時代末、オタルナイ場所と呼ばれ場所請負制が取られていましたが、鰊漁の出稼ぎ人も増え、元治2(1865)年に、村並となり名主・年寄などの村役人がおかれました。万延2（1861)年、場所請負人岡田家が海岸での荷揚げを容易にするために、現在の港町海岸で埋立を行っています。その後も海岸を利用しやすくするために埋立が行われました。"}, {"seq": 75, "page": 66, "img": "guidebook_pages/p075.webp", "t": "男明治初期中期⑨ぐ札幌の海陸連絡の地点さて、明治新政府は、わが国の北方防衛、近代化に必要な資源の入手や人口問題の解決などから、本格的な北海道開発に取り組むこととし、明治2(1869)年に開拓使を設置、同4(1871)年には開拓使本庁が札幌に置かれました。そして小樽は、江戸時代末から漁村として人々が集まり村並となっていたこと、天然の良港であったことから、札幌の海陸連絡の地点として位置づけられました。⑥整備幕末から取り組まれていた海岸の埋立は開拓使が行い、明治4(1871)年、同8(1875)年には現在の堺町、港町で埋立が行われ、さらに、民間による埋立も行われ、海岸谷いの町並みが姿を現しま小樽港では、明治5(1872)年、色内村に石造の坦頭が着工され、翌年に完成します。同10(1877)年には手宮井頭が完成します。埋頭とは、船舶が荷役や旅客の乗降のために接岸する場所ですが、荷物をしまう上屋や荷役機械、旅客の待合所などの陸上施設を含めた広い範囲をいいます。当時築造された埋頭は大型の船が直接接岸できるものではなく、艇などが接岸していました。それでは荷揚げや旅客の乗り降りに不便なので、同13(1880)年、手宮坦頭に延長240間(約430メートル)の手宮機橋が建設されました。同じ年には手宮一札幌間の鉄道が開業しています。〇商業港湾都市としてデビュー小樽港は明治22(1889)年特別輸出港になります。'特別輸出港」とは、米、麦、麦粉、石炭、硫黄の5前目に限り、日本船または日本人雇用の外国船により輸出ができる港として指定されたものでした。小樽港はそれから10年後の同32(1899)年に小樽港/有幌方面ヨリ信香町ノ常燈台ヲ望ム/明治5(1872)年(北海道大学附属図書館北方資料室所蔵)米国帆船ジラルド・シ・トベイ号手宮坦頭へ横着之図/明治13(1880)年(北海道大学附属図書館北方資料室所蔵)手宮停車場と鉄道機橋の早(北海道大学附属図書館北方資料室所蔵)"}, {"seq": 76, "page": 67, "img": "guidebook_pages/p076.webp", "t": "は外国貿易港(開港)に指定されました。開港とは外国貿易のために貿易船が入港できる開かれた港「お雇い外国人のことで､それ以外の港(不開港といいます)では、C、S・メーク」貿易船は特別な場合を除き、あらかじめ税関の許可がなければ入港することができません。開港と明治20(1887)年になり、お雇い外国人技師のC.S.メークになったことにより、対岸のロシア沿海州や中国はよって北海道の港湾調査が行わもとより、世界各国の貿易の窓口となりました。れ全道的な港湾計画がまとめられます。メークは小樽港について石炭桟橋の建設と南町・入船ふなだまり町の船溜(小型船舶を係留するたふないりまめに囲まれた水面、船入澗ともいいます)計画を報告しています◎同23(1890)年、南浜町船入澗と南町.入船町船入澗の建設が北海道庁に出願され、同25(1892）年に工事が完成しました。近代的な港にはまだまだ遠いのですが､札幌への物資が陸揚げされ、また空知の炭鉱からの石炭が運び出されるなど、道央圏の海の玄関口の役割を担うようになりました。〆薯二一小樽市街の明治10年代の見取図（北海道大学附属図書館北方資料室所蔵）4．近代的な｢港｣づくり■日本初の本格的外洋防波堤建設◎背景近代的な港湾としての小樽港の整備は､明治30(1897）年4月の小樽築港第一期工事着工から始まります。防波堤がなかった時代、小樽港は天然の良港とはいえ、冬季間シベリアから吹きつける季節風と波浪は、人々の乗降や荷卸しを阻害し、時として停泊する船舶や陸上施設に損傷を与えました。北海道の本格的な開発のために、気象の影響を受けない近代的な小樽港が求められていました。季節風などによる波浪を遮り、港内を静穏にすることで航行や停泊の安全をはかり、円滑な荷役を可能とし、さらに港の施設を波浪から守る、そのためには冬の日本海の荒波に十分耐える頑丈な防波堤が先ず第一に求められたのでした。"}, {"seq": 77, "page": 68, "img": "guidebook_pages/p077.webp", "t": "工事中の北防波堤。防波堤の右端で積畳機が動いている姿が写っています｡手前には和船が停泊しており､水深の深い防波堤側に軍艦や汽船が停泊しています。（小樽市総合博物館蔵）◎過程きたがきくにみち明治25(1892)年、第4代北海道庁長官の北垣国道は「北海道西部において物資の集散場に適した土地は小樽以外に無い」と小樽に近代的な港湾建設を訴えた意見書を提出。翌年には井上内務大臣の視察があり、同27(1894)年には建設工事の設計に必要な地形や地質などの調査が実施されました。そして'可28(1895)年からは、防波堤の一部を築いた大掛かりな試験工事が行われました。明治29(1896)年、帝|玉|議会は前年までの調査や試験工事の結果を受け、小樽築港費218万8千'11余を、全額国費によるものとして議決。国内最大級の本格外洋防波堤建設工事が国家プロジェクトとして取り組まれることになりました。小樽築港事業が国家プロジェクトとして取り組まれた背景には､18世紀末から急激に緊張の高まった北洋や北方に対する軍事的な備えを充実させ、人口が急増するR本の食料供給基地、人口吸収の地として、北海道がその役割を果たすことへの期待がありました。◎商業港湾都市としての発展小樽築港工事による北防波堤の完成を待たずして、北方の軍事''1勺緊張は高まり、建設途中で日露戦争が勃発しました。そのため建設事業の予算が縮小しましたが、11ヶ年の歳月をかけ、明治41(1908)年に延長1,289メートルの北防波堤が完成。小樽港は近代港湾の第一歩を歩み出します。引き続き第二期工事が始まり、工期13ヶ年、工事費517万円をかけ、大正10(1921)年7月に､南防波堤(延長912メートル)、島防波堤(915メートル)、北防波堤延長(415メートル)が完成。総延長4キロメートルの防波堤が船HI'|を守ることで、小樽港は北海道の中核港湾として北方交通の要衝となり、港湾都市として一層発展しました。"}, {"seq": 78, "page": 69, "img": "guidebook_pages/p078.webp", "t": "軒先端技術を導入した第一期工事⑨火山灰・斜め積み・百年試験、小樽港内での測量や波浪観測を行い、明治28bhーーするとともに、防濾坦の基礎を支える海底の状態や渡浪の動作、海水中にあるコンクリートブロックの状態などについて調査を行いました。それらの結果をもとに、広井は火山灰を用いたコンクリートを防波堤工事に採用。さらに,コンクリートブロックを斜めに積み、自重の一部をかけることで安定させ、また一部分に当たる濾の力を広く分散させることで波力に対抗する構造を採用しました。いずれやもわが国では初めての試みでした。当時、防濾坦にコンクリートを使用したときの長期にわたる耐久性などは明らかになっておらず、横浜港では井頭建設で使用したコンクリートに亀婚が入るなど、国内でゃ成功事例がありませんで|二<つ-で、.広井勇は大量のコンクリートテスズNIS二ース(供試体)を製作し、コンクリート強度の経年変化を長期間にわたり計測する百年耐久性試験を始めました。この世界でも類の無かった試験は平成15年1月を以て終了、その成果を各国の土木技術者が見学に訪れています。小樽築港が計画された明治20年代後半は、コンクリートの強度や材料の混ぜ方などについては十分に解明されていなかっMRMDの港湾工事の成果や自らの実験の成果をもとに、コ一先端技術を生み出した第二期工事⑨⑥ケニーソン最先端の技術を惜しみなく投入することで、日本初の本格的外洋防波堤建設に成功した小樽築港第一期工事でしたが、第二期工事ではユニークな工事方法が開発され、築港工事を成功に導き、港北防波堤の断面図幅約14.4メートル(24尺)、高さ約13.8メートル(23尺)、重量14こ23トンの大型コンクリートブロックが、約71度の傾斜をつけて積み上げられている様子が右上の図(小樽築港工事報文)からわかります。「…七一度三四分の傾斜をつけた。この目的は工事中堤端における崩壊の脱落を予防することを主とし、…兼て隣塊を先合(ひようごう)させ、もって一局部の波撃を広く伝えることにある。この築設法は、当時すでにマノラ・マドラス・コロンボボ等において実施したことがあるが、我が国ではこの工事をもって叶矢とする。」(広井勇著:『日本築港史』)コンクリートブロックとその運搬に用いられた起重機。写真は第二期工事ですが、北防波堤工事でも同様にしてコンクリートブロックが製造されeSし7記。(土木学会附属図書館戦前土木絵葉書ライブラリ)唱代"}, {"seq": 79, "page": 70, "img": "guidebook_pages/p079.webp", "t": "湾技術者の耳目を集めました。第二期工事で建設された南防波堤は北防波堤と|司じコンクリートブロックの斜め積みで建設されました。しかし、工事途中の明治44(1911)年に、防波堤の設計が変更され、南防波堤先端部の島防かんかい波堤と北防波堤の延長部においてケーソン(函塊）を用いることとなりました。第二期工事から小樽港南端の平磯岬から若竹海岸にかけての埋め立て地に築港工場は移転ケーソンとは、主として鉄筋コンクリート造のした｡築港工場のケーソンヤードから､幅､奥行12.1メートル､高さ7．5メートル､1,000トン箱状あるいは円筒状の構造物です｡地上で製作後を超える巨大なケーソンが進水する姿(下の写真)は､小樽築港工事のハイライトでした。水中などに沈下させ防波堤や岸壁として用いるもちなみに､日本で初めて防波堤に使われたケーので、現在でもよく使われています。第二期工事ソンは､1910(明治43)年に神戸港で､浮きドック方式により製作されました。ではこのケーソンの製作を簡単なものとして経費(土木学会附属図書館戦前土木絵葉書ライブラリ）を少なくする工事方法が考案されました｡それは、1,000トンを超える巨大なケーソンを陸上のヤードで製作し海中に向け滑り落とす、進水方式というものでした。fｺよう.・も/この方式は、広井勇の後を継いだ伊藤長右衛門第3代小樽築港事務所長が、数々の試験と検討の結果、明治45(1912)年に開発したもので、優れた工事方法として評{IIIされ、その後各地の築港工事で採用されました。大正時代には留萌や岩内に|f'lけて、小樽で製造されたケーソンが海上運搬され港づくりが行われています。ケーソンは中空のため､設置場所まで移動したのちに､土砂や骨材(砂利)などを充填して重量を増し､海中の基礎に据え付けられます。写真は島防波堤ケーソンの充填作業です。（北海道大学附属北方資料室）5．小樽築港とエンジニア(技術者）■小樽の港づくりと3人のエンジニア（技術者）小樽築港では、防波堤の建設に携わった土木技術者たちを忘れることはできません。1人は、小樽港の生みの親といわれる広井勇。もう1人は小樽港の育ての親といわれる伊藤長右衛門。今ll，旧日本郵船小樽支店前の運河公園で2人の胸像が小樽港を見守っています。そして、寒風吹きすさぷ北の冷たい海に潜り、防波堤の基礎となる石積み工事の監督指揮を行い、若くして命を落とした"}, {"seq": 80, "page": 71, "img": "guidebook_pages/p080.webp", "t": "青木政徳の石碑が手宮公園から、彼が心血を注いだ北防波堤を見守っています。もちろん、近代小樽港は多くの人たちがそれぞれの持ち場で創意と工夫をこらし、また苦労して建設したものです。3人のエンジニアはその人々の代表です。◎広井勇広井勇は、明治30(1897)年、初代小樽築港事務所長となり、同41(1908)年の北防波堤完成までその要職を務めました。その|Al、同32(1899)年からは東京帝国大学教授を兼務し、後進を育成しました。広井門下生は大正、昭和の国士づくりで活躍しています。また、各地の港湾建設から橋梁建設、河川水力発電の指導など幅広く活躍し、第6代土木学会会長となるなど、日本の土木工学の重鎮であり、世界的な権威者でした。広井勇は文久2(1862)年、土佐藩藩士の子として生まれました。幼くして父親を亡くし、苦労して東京外国語学校に通い、明治9（1876)年に札幌うちむらかんぞうにとくいなぞう農学校に入学。同期生に内村鑑三、新渡戸稲造らがいました。札|幌農学校卒業後開拓使に任用され、鉄道建設などに従事しましたが、単身アメリカに渡り図面工となって橋梁設計を学び、その経験をもとに橋梁設計のテキストを渡米''1に出版しました。明治20(1887)年には在米中､札l幌農学校助教授となり、ドイツに留学｡同22(1889)年に帰国し教授に任官。北海道庁技師を兼務し、後進の育成と北海道開発を技術面から指導しました。広井は内村らとともにクリスチャンとなりますが、宗教の道には進まずに「此貧乏国に在りて民に食物を供せずして宗教を教えるもの益少なし、僕は今より伝道を断念して工学に入る(内村鑑三：|||友廣井舅君を葬るの辞)」と土木技術者として文明の基礎を作ることで、神に仕えることを選びました。終生の友であった内村錨三は「広井君在りグ撚広井勇『工学博士廣井勇伝』より", "page_guess": true}, {"seq": 81, "page": 72, "img": "guidebook_pages/p081.webp", "t": "嘩信て明治大正の日本は清きエンジニアを持ちました」と、昭和31928)年、亭年67で亡くなった広井の軸辞を読みました。⑥ぐ伊藤長右衛門伊藤長有衛門は、明治35(1902)年に東京帝国大学を卒業。広井の勧めで北海道庁技師となり、小樽築港事務所に勤務しました。その後、明治42(1909)年から昭和10(1935)年まで築港事務所長を勤め、小樽築港第二期工事などを監督・指揮しました。また留曲・函館・室蘭の築港事務所長も笠務し、港湾建設に情熱を傾けました。昭和2(1927)年高等旨である勅任技師となり北海道の土木事業を技術面から総括。港湾建設のほか主要都市を結ぶ幹線道路の整備等にも取り組みました。小樽一札幌を結ぶ国道整備は伊藤が勅任技師時代のことです。伊藤長右衛門は明治8(1875)年、福井県の名土の家庭に生まれ、茂しい家風の中で育ちました。旧制福井中学校時代は常に首席で、一高から東京天国大学土木科に進みました。同35(1902)年に北海道庁土木部に入りましたが、同37(1904)年からは陸軍士官として日赴戦争に従軍。同43(1910)年からは欧州に港湾施設の視察調査に赴いています。伊藤は広井田とは終生の師弟関係にあり、広井の死後「廣井博士記念事業会」を発起しています。昭和10(1935)年11月に伊藤は高等官一等で退官し、その後日本製鐵会社等の顧問技師などを務め、同141939)年秋に亡くなりました。「…基を愛し、碁友が広かった、其他に趣味として謡曲に親しんだ。後進知友の為に労を執るや実に親切、名利を意に介せず天空快潤の野人ぶりは氏の徳望であった…」と、当時の専門雑誌「土木建築工事画報」に伊藤長右衛門の追悼記事が寄せちられています。右衛門伊藤長『土木建築工事画報』第15巻第10号よりトー計し語りYR第一期工事竣工時の北防波の記念撮影。前列右から4人目が広井勇で、その右隣(右から3人目)が伊藤長右衛門(『写真集小樽築港100年の歩み』)堤堤頭部で", "page_guess": true}, {"seq": 82, "page": 73, "img": "guidebook_pages/p082.webp", "t": "⑤ぐ青木政徳青木政徳は、元治元(1864)年10月京都に生まれました。明治13(1880)年に鉄道局の見習生となり、その後葬普湖貴水工事や関西鉄道加太陸道工事に従事しました。同26(1893)年からは北海道庁に所属し、同29(1896)年に、北海道庁技師となります。小樽築港第一期工事では広井勇の下で築港工事の監督に従事しました。小樽築港ではわが国で初めて火山灰を混ぜたコンクリートを外洋防波堤工事に採用しましたが、そのために細心の注意をもって工事にあたりました。また、自ら潜水服を着て海中に潜り、防濾堤の基礎工事を指揮・監督しました。しかし、冬の厳しい海中での作業や過労から、同33(1900)年、病に倒れ、同年5月に北防波堤の完成を気にかけながら亡くなりました。桜の名所である手宮公園からは小樽港、小樽港北防波堤がよく見えます。その手宮公園の中腹に小樽築港第一期工事を支えた、青木政徳の功績を讃える石碑が、大正5(1916)年8月に建立されています。青木政徳の功績を讃える石碑写ーか:ーーいさム,埋立地に作られた倉庫と船入滴/明治401907)入門工事が終了した順の小江。小樽港に停泊する船朋は、年頃。総延長4キロメートルの防波堤によって波浪から守られることになりま(二木学会附属図書館戦前土木絵葉書ライブラリ)した。図には、運河の埋立予定地や坦頭の建設設計などが書き込まれています。(小樽港修築平面図、『小樽築港要覧』(北海道庁大正11)付図。", "page_guess": true}, {"seq": 83, "page": 74, "img": "guidebook_pages/p083.webp", "t": "6．近代小樽港の発展■埋立の拡大と埋立式運河(小樽運河)の建設小樽港は天然の良港といえども山が迫っており、海岸に平坦な土地はほとんどありませんでした。そのため、荷物の積卸しを容易にし、荷物を保管する倉庫などを建てるために、海陸連絡の設怖として埋立が積極|'|勺に行われました。｜ﾘj治22(1889）年までに､勝納川から手宮桟橋に至る海岸で水深の浅いところを中心に､民間によっておよそ11万平方メートルの埋立地ができていました。そして、防波堤建設が決まり、小樽港が北海道を代表する港として位置づけられたことにより、以前にも増して各ll,'il人や企業が条件の良いところの埋立を願い出るようになりました。しかし、設計変更が繰り返され、資金難などもあり着工は大'l'l1iに遅れます。防波堤の建設が進む一方で､港を活用するために必要な施設の建設はなかなか進まなかったのです。明治42(1909)年、欧米視察から帰国した広井勇は、取扱貨物の種類、荷造り方法などから、さしあたって埠頭式によって大型の船が直接岸壁に接岸するよりも、運河式によって艀を利用する方が便利であるとの意見を出しました｡そのこともあり、当初の埠頭岸壁式から埋立運河方式へ設計変更がなされ、速成派、延期派、埠頭派など意見が対立しました。さらに21回lの設計変更がなされ、着工まで||寺間がかかることとなりました｡検討が始まってから実に18年も経過した大正3(1914)年になり、埋立運河方式で着工することになりました。埋立地の造成と運河の建設は、小樽区(市)営第一期修築工事として、およそ10年ほどかかり、大正12(1923)年に完成。手宮川から立岩に至る沿岸距離1,455メートルの水面部分が埋立られ、長さ1,324メートル、IIIM40メートル、水深2メートル40の埋立式の小樽運河が建設されたのでした。この運河の岸壁には、100トン積みの艀40隻が同時に係留でき、運河周辺の埋立て地約10万8千平方メートルには倉庫が建ち並ぶこととなりました。■港のさらなる発展をめざした埠頭の建設北海道の開拓が進み、産業の振興は小樽港の整備を待ってはくれませんでした。運河が完成した大正12(1923)年の翌13(1924)年には､入港船舶隻数は6,248隻を数え、取扱い貨物量は250万トンを数えました。その結果、貨物の積卸し、燃料の石炭の搬入、蒸気機関のボイラー用水や、飲料・生活用水の供給をすべて艀で行うことは効率が悪く、増大する船舶量に応えることが難しくなってきました。また、艀による荷役は天候に左右されるので､あらためて埠頭岸壁式の港づくりが求められました。小樽運河が完成した大正12(1923)年、増大する貨物量に対応するために、埠頭を建", "page_guess": true}, {"seq": 84, "page": 75, "img": "guidebook_pages/p084.webp", "t": "設することの許可申請がなされています。その後、昭和2(1927)年からの北海道第二期拓殖計画の中で、小樽港の岸壁・井頭施設の整備が盛り込まれ、北海道初の突堤式の公共坦頭が建設されることとがViまま6昭和7(1932)年、立岩から勝納川に至る約1,310メートルの海岸埋立が竣工します。そして、延長352メートル、水深6.6メートルの堺町岸壁が完成しましレた。続いて、同9(1934)年には延長212メートル、水深7.4メートルの厩町岸壁が完成します。厩町の埋立では岸壁以外の施設が築造されたほか、小樽港で待望された船舶修理場などの施設も設備されました。堺町、厩町の両岸克が完成したことで、2<3,000トン級の船舶が直接接岸できるようになり、樺太航路などで利用されました。昭和10(1935)年には突堤式の第一号壇頭の建設が始まります。1万トン級の船舶と、6,000トン級の船舶が係船できるバース(船舶係留場所)が設けられました。埋頭の面積はおよそ3万8千平方メートル。幅員127メートル、長さ右310メートル、左293メートルで、総工費はおよそ99万円でした。同12(1937)年には第二号朝頭が、同15(1940)年には第三号坦頭の建設が始まりましたが、第二次世人有響で同18(1943)年までに工事が打ち切(に3ん大正11(1922)年には、小樽港から運び出される石炭は年間百万トンを超えるようになり、手宮駅構内の既存施設からでは石炭の積み出しが間にあわなくなってきました。同15(1926)年、鉄道省は小樽港の海陸連絡設備の根本方針と具体案を決定しました。それは、勝納川、若竹町の埋立を進め、貯炭場、貯木場を設置するほか、岸璧を整備すると共に、長さ170メートル、幅18メートル、水深8.5メートルの石炭船積み機橋を建設する計画で、7,000トン級の船舶を係留して荷役を行うことで、石炭を年間363万トン、木材を28万トン、雑貨4万6千28ンーに人絵葉書となった小樽港全図(土木学会附属図書館戦前土木絵葉書ライブラリ)小樽港(市営坦豆(土木学会二村ライブラリ)明治44(1911)年に竣エした手宮高機(上学会属図書錠戦前土木業書ライブラリ)昌代", "page_guess": true}, {"seq": 85, "page": 76, "img": "guidebook_pages/p085.webp", "t": "トンを扱うというものでした｡工事は昭和2（1927）年より始まり、同11(1936)年に東洋一といわれた「ゴモ」近代的な石炭荷役施設が完成しました。日雇いの港湾労働者を「ゴモ」■港で働いた人々というのは小樽港がはじまりとさて、小樽港ではどのような人たちが働いていいわれています。カモメのことを北海道では「ゴメ」といいまたのでしょうか。港で働く人は、小樽港に出入りすが、それがなまった、賃金のする船舶の船員だけではありません。船舶への荷ことなどでごねてゴモゴモいう物の積み下ろし、岸壁から倉庫や貨車、トラックからゴモといわれるようになっに運び込むという仕事があります｡小樽港は最初、た、などといくつか説がありま運河方式を採用したので船舶一艀－岸壁一倉庫やす。このような独特な言葉を生み出した港の労働ですが、夏の鉄道という過程を経ることとなりました。石炭だ暑さはもとより、冬の凍てつくけではなく農産物、林産品、生活物資や工業製品寒さの中で大変な苦労がありまの積み下ろしがありました。このためさまざまなした。多くの人たちの苦汁が小荷姿があり、機械化が進むまでは職人的な熟練し樽港の荷役を支え、小樽港の発た技能を持った労働者が数多く必要でした。展に関わっていたことを忘れてはならないと思います。第二次世界大戦前の小樽における港湾労働者のなかし職種は、「仲仕：港に停泊している船舶内で積卸しふせんふに従事」「艀船夫：艀によって貨物の運搬に従事」りくかた「睦方：貨物の揚陸や艀へ積み込みに従事」「倉人夫：倉庫への貨物の積み付けや荷造り手直しなどに従事」「木材積取人夫：木材の積取に従事」「通船船夫：通船によって旅客や船員の輸送に従事」「台車積卸人夫：鉄道駅構内で貨車積卸しに従事する」じようふに大別されます。また、雇用の形態は「定夫」とでめん呼ばれる常傭と、「出面」「ゴモ」と呼ばれるF1雇いがありました。職種、雇用形態別にそれぞれ独特の技能が必要で、身分や生活条件、慣行などが異なり、同じ荷役でも雑貨と石炭でも大きく異なっていました。さらに、木材積取人夫は独特な生活をしていました。", "page_guess": true}, {"seq": 86, "page": 77, "img": "guidebook_pages/p086.webp", "t": "7.第二次世界大戦後の小樽港一戦後復興と小樽港昭和20(945)年8月15日、わが国は敗戦を迎えます。戦争で荒れ果てた国土を復興し、生活を再建するために、食料増産とエネルギー確保が急がれました。海外の植民地に向けられていた人ん々の関心が再び北海道に向けられるようになり、北海道の開発が重要な国家的課題となりました。同25(1950)年には北海道開発法が制定され、北海道の積極的開発が国策として取り組まれることになりました。昭和26(1951)年、北海道開発庁は北海道総合開発計画を策定します。同27(1952)年から10ヶ年にわたる計画で、前半5カ年は第一次5カカ年計画と呼ばれ、電源開発、石戻および食料増産に取り組み、道路、港湾、河川等の整備拡充を行うこととされました。小樽港は内外貿易を行う重要港として位置づけられ、戦争で中断していた港の整備が再び始まります。戦後復興の中で、小樽港では戦争で中断していた第二、第三協頭の工事が再開され、昭和25(1950)年には幅126メートル、長さ293メートル、6,000トン級船舶4バースの第二埋頭が完成します。そして、同29(1954)年には第三坦頭が完成します。第三埋頭は同34(1959)年より延長工事が始まり、同42(1967)年に完成します。戦後復興から経済成長をむかえる昭和30年代後半になると建材用途の外国木材輸入が増大してきました。同37(1962)年には若竹地区に新たに、防波坦595メートル、物揚場275メートル、整備水面6万9千平方メートルの木材取扱施設の整備が行われました。この若竹地区水面貯木場は北海道一といわれる大規模なものでした。一小樽港の新たな整備とフェリーの就航小樽港は第二次世界大戦後、樺太を失い、また当時のソ連や中国との貿易や政治的な問題もあり貨物取扱量が減少しました。昭和11(1936)年に411万8千トンの取扱い貨物量を記録した小樽港は、同25(1950)年には196万トンと半減します。その後同31(1956)年には同11(1936)年の実績を上回りますが、エネルギーが石炭から石油に変わる中で小樽港の取扱貨物の7割以上を占めた石炭取扱量も減少します。さらに、山が海岸に迫っていることから背後に工業用地を確保できず、工業開発と一体となった港湾整備と利用を望むことはできませんでした。小樽港は新たな時代への対応が必要となりました。昭和40年代に入ると船舶はさらに大型化しました。そして、穀物、セメントなどと専用化し、コンテナ輸送も始まりました。そこで、同42(1967)年には大型化する外航船に対応して、2万トン級の船舶が接岸できる中央壇頭の工事が始まります。幅260メートル、手宮側400メートル、勝納側538メートルの大型坦頭には収容能力3万トンの穀物サイロやセメントサイロ、冷凍・冷蔵倉庫などが建設され、同47(1972)年昌代"}, {"seq": 87, "page": 78, "img": "guidebook_pages/p087.webp", "t": "に完成しました。『さらに､遊休地となった石炭積み出し施設のあっ△た若竹、勝納地区に面積48万平方キロメートルの巨大埠頭の建設が計画されます。昭和48(1973)年から工事が始まり､およそ112igl'1をかけて同56(19垂｡、81)年に完成します｡3万トン級の船舶が接岸できるバースを持った埠頭は当時東京以北では小樽港勝納埠頭での荷役風景だけでした｡現在勝納埠頭にはフェリー岸壁やター（小樽開発建設部ホームページより）ミナルが整備され、4万9千トンの収容の力を持つ穀物サイロや輸入原木用地、小樽港マリーナが設けられています。現在小樽港の取扱貨物量の90％をフェリーが占めています。昭和45(1970)年8)lに北海道内ではまいづるつるじめての長距離フェリー航路が、小樽と舞鶴、敦賀の|ﾊlに開設されました。フェリー航路にあわせて小樽と札'幌を結ぶ自動車専用国道(札榑道)が同46(1971)年に開通します。フェリーによる貨物取扱量は年々増力llし、同45(1970)年には20万トンほどだったものが､同50(1975)年には314万トンになり､20年後の平成3（1991)年には2,000万トンを超えました。参者文献『小樽築港工事報文前編・後編』北海道明治41年『躍進の北海道-港湾漁港･河川.鉱業』北海道海運通信社昭和9年『工学博士廣井勇伝』故廣井工学博士記念事業会『土木建築工事画報』第15巻第10号土木建築工事画報社『北海道港湾変遷史』中村廉次著昭和35年『港湾労働』北海道立経済総合研究所編昭和39年『北海道港湾建設史』北海道開発局港湾部監修昭和53年『北海道浪漫鉄道』田辺喜子昭和61年『小樽港民』廣井勇・伊藤長石衛門両先生胸像帰還実行委員会編平成11年『写真集小樽築港100年の歩み』小樽開発建設部小樽港湾建設部平成9年｢小樽市ホームページ小樽港要覧」http://www.city.ota｢u.hokkaldo.jp/minato/minas・htm"}, {"seq": 88, "page": 79, "img": "guidebook_pages/p088.webp", "t": "蒸気の音が運んだ繁栄北海道で初めての鉄道、幌内鉄道は石炭の搬出のための鉄道であり、旧手宮線はその貴重な遺構である。念中心となった技師、クロフォードをはじめアメリカスタイルで造られた鉄道であり、しづか号はその代表的な遺物である。例クロフォードのひらいた朝里一銭了の車馬道は札槽問をむすぶ陸上交通路で、開拓史上特筆すべき速さと技術で造られた幹線であった。義経トンネルは数少ない遺構である。人小樽2番目の鉄道は私鉄の北海道鉄道(函館一小樽)、これにより小樺の玄関は南小樽から小樽駅周辺にかわっていく。"}, {"seq": 89, "page": 80, "img": "guidebook_pages/p089.webp", "t": "1.幌内炭の発見■「燃える石」の発見｜ﾘl治元(1868)年、蝦夷地石狩川支流の山奥で奇妙な黒光りする石が見つかります。一説には小樽きむら本願寺別院の建築用材を伐採に入った石狩の木村よしたろう吉太郎が発見したといわれますが、開拓使にﾙﾊけまつごろう石炭が山積みとなっている手宮駅構内出たのは島松の猟師松五郎でした。(昭和初期）もっともこの段階ではこの石の価値は不明のま(小樽市総合博物館蔵）はやかわらょうじゅうろうまでしたが、明治5（1872)年、札||滉の早川長十郎が'|ﾙ&内から持ち帰った石塊を開拓使に届け、はじめてこれが良質の石炭であったことが判|ﾘjします。明治政府は日本の近代化を図るためには、エネルギー源として石炭の確保が不可欠と考えていましたが、幕末より採掘が開始されていた泊村の茅沼炭鉱と白糠炭鉱は小規模であり、開国の条約により外国船に提供を約束していた石炭の量も満たしてはいませんでした。えのもとたけあき当時、開拓使物産取調掛であった榎本武揚は、この幌内の石炭がきわめて良質であることを理解し､開拓使お雇い外国人､ベンジャミン・スミス・ライマンを派遣します。これが後の近代日本を支えた北海道の石炭産業の幕開けであり、また小樽の地に鉄道が敷かれる原因となったのです。｢日本蝦夷地質要略之図」明治9(1876)年ライマンが作成した北海道初の地質図（小樽市総合博物館蔵）"}, {"seq": 90, "page": 81, "img": "guidebook_pages/p090.webp", "t": "■アメリカ・モデル開拓使は北海道開拓にあたって、そのモデルを西部開拓が進行していたアメリカに求めます。<ろだきよたか1りありのり明治4(1871)年、黒田清隆(後の開拓長官)や森有礼とアメリカ農務省長官ホーレス・ケプロンがアメリカで会談し、その結果ケプロン自らが開拓顧問となり、北海道開拓の設計図を作る事になります。ケプロンはそれを実行するため、各分野の人材を招聰します。その中に鉄道を語る上で重要な二人の人物も含まれていました。一人は鉄道建設に尽力したクロフォード、そして地質学者ライマンです。イギリスの技術を導入し、都市間交通としてつくられた新橋一横浜間、神戸一京都間とはことなる､アメリカ式の鉄道システムが北海道に導入される下地はこうやってつくられていきました。2．搬送方法とルートの検討■船か鉄道かぱいでん発見当時、lll晃内の炭田(当時は「煤田」と表現されていました｡)へは石狩川、|幌lii1川、幾春別川を小舟でさかのぼり、さらに'幌内川の沢伝いに徒歩でいくしかなく、この山奥からどうやって重たい鉱石を運び出し、本州に廻航するか、炭鉱の採掘とともに重要な課題となっていきました。明治5（1872)年のライマンの調査報告を受けたケプロンは翌6（1873)年、黒田に報告をあげます。そのなかでケフ°ロンは、(1)'|暁内ほろかむいらぶと幌向太(石狩川)まで鉄道を敷き､川船で石狩まで運びそこから小樽の港まで搬送。(2)1幌内から鉄道で室藺の港まで搬送。の2案を提示しますが(1)は経費がかさみ、搬出量も限られ、また「小樽港は結氷の石狩川(明治9(1876)年作図）（小樽市総合博物館蔵）幕末～明治初期の手宮付近絵図（越崎宗一氏模写）ざへ』づ"}, {"seq": 91, "page": 82, "img": "guidebook_pages/p091.webp", "t": "沖人@ため半年使えない。」という理由(ケプロンの誤解か?)で(2)の室職までの鉄道敷設を推奨しています。これに対し開拓使や明治政府では慕大な建設がかかる鉄道敷設には消極的であり、江戸時代より行われていた石狩川の河川交通を手直しする、(①⑪の説が主流であったといわれています。なお、ライマンも室蘭までの鉄道敷設がもっとゃ適した案であることを指摘しています。その後、河川利用か鉄道敷設かの議論は西南戦争が勃発し、財政的にも政治的にもこれを検討する余裕はなくなってしまいます。議論は西南戦争後、再び具体化していきます。男石炭と鉄道そもそも鉄道の生まれたイギリスでは、鉄道は石誠などの鉱石を運搬する手段として生まれました。重く、また遠隔の地で産出される鉱石をいかに運搬するかが産業革命の大事な課題でした。蒸気機関車を実用化したスチーブンソンのロコモーション号も石炭運搬の手段として生み出されたものでした。幌内以外でもすでにこのような試みがされていました。それは泊村の茅沼炭鉱でした。茅沼炭鉱で幕末から採掘指導にあたっていたイギリス人技師ガワーが明治2(1869)年採掘口から海岸までのおよそ2.2kmの間に木製(鉄板張)のレールを敷き、4トン積みの貨車を走らせたのです。『日本鉄道史』(鉄道省:大正7(1918)年)によればこれが日本最初の軌道ということになっています。ただ、下りは貨車に積まれた石炭の重さで自走させ、のぼりは和牛に庶かせていたゃものです。確かに「鉄」の「道」ではありますが、「鉄道j]のイメージとはかなり遠いトロッコのよらうらなものでした。実は幌内鉄道に続き、明治20(1887)年に開通した北海道2番目の鉄道、釧路鉄道(標茶一跡佐登)ゃ硫黄鉱石のための専用線でした。道路網が未発達であった明治初期の北海道では「釜石鉱山鉄道」手宮・札幌間が開通した明治13(1880)年11月20日より9ヶ月ほど前の2月17日に岩手県で運転を開始した鉄道があります。岩手県の釜石港から鉄鉱石を採掘していた大橋鉱山までの「官営釜石製鉄所専用鉱山鉄道」(釜石市側の資料では「釜石鉱山鉄道」と略されていますので以降は「釜石鉱山鉄道」と記します。)がそれです。つまり新橋一横浜、神戸一京都につづいて日本で3番目に運転を開始した鉄道が釜石にあったのです。これまでこの鉄道についてはあまり知られていなかったのですが、岩手県、釜石などの資料をみていくと地元では「日本で3番目の鉄道」として古くから知られており、トンネルのー部などが市の史跡として保存されていはま39では、釜石鉱山鉄道とはどんな鉄道であっつたのでしょうか。鉄道の始まりは明治8(1875)年、英国人技師パーセルの派遣から始まります。その前年から開始されていた鉄鉱石の搬出方法として鉄道が採用されたからです。しかし、当初は馬車鉄道が想定されていましたが、のちに蒸気機関車での運搬に変更されるなど決して順調な作業ではなかったようです。この鉄道は鉱石を製鉄所に運び、製品を釜石港に運ぶことを目的としており、鉱山だけではなく、製鉄所を結ぶ有機的なシステムの根幹として機能するはずでした。しかし、開通後半年、やっと待望の製鉄所が稼動し始めますがわずか3ヵ月後の明治13(1880)年12月に燃料を作っていた製央所が焼失してしまい稼動停止となってしまいます。そのため鉄道も自然休業の状態となります。およそ1年間の休業期間中の明治15(1882)年1月には旅客の運搬も認められ、満を持して3月に再開をします。しかし9月に製鉄所の不具合により操業が停止され、そのまま再開されず廃止されるという運命をたどります。あまりに短命でちあったことや、「専用鉄道」という名称のために軽んじひられることがあった釜石鉱山鉄道ですが、実はその生い立ちや目的は幌内鉄道と似たものがおおく、ともに「鉄道局」管理外の鉄道でした。しかし、鉄道史の中では「鉱石運搬」というもっとも緒言的な目的を持った鉄道であり、記憶にとどめておくべき存在ではないでしょうか。ノ"}, {"seq": 92, "page": 83, "img": "guidebook_pages/p092.webp", "t": "「公共交通機関」としての色合いよりも鉱石運搬を主とした鉄道がつくられていきました。事実、｢駅・時刻表・運賃」例えば明治18(1885)年大蔵省から刊行された『開拓使事業報告』では幌内鉄道に関する記載が「運◎駅開通当時の幌内鉄道の姿をとどめるも輸」の項目には無く、物産の「鉱物」の項目と土のは張碓の義経トンネルと張碓鉄橋のレンガ橋脚のみですが、国指定重要文化財木の「道路」の項目に記載されています。となっている「|日手宮鉄道施設」は明治期の鉄道の状況を伝えるものです。特に扇形車庫である「機関車庫3号」はフラン'3．クロフォードの登場ス積みの優雅な外観を持ち、往時の手宮駅構内の様子をしのばせます。開通当時、入船陸橋の試運転写真で見ぱいでん力‘いさいられるように、まだ石置き屋根が普通で■｢煤田開採事務掛」あったのに対し、手宮駅構内はアメリカ長距離の鉄道施設は莫大な費用がかかり、必要技術のもとにトタン屋根やスレート屋根、レンガ造りや、モルタル造りの洋風建築な経費と技術力から考えて当時の政府の目には現物が建ち並んでいました。幌内からの石炭輸送が始まるとさまざまな石炭関係の実的な提案と映りませんでした｡そこで明治10(1877）施設も造られました。やま．）ちていうん手宮-札幌間の開通時には手宮､開運町年山内堤雲は『岩内'|滉内両煤田見込耆』を作成し、（現南小樽)、銭函、札幌の4駅、札幌-幌翌11(1878)年に太政官に上奏します。内間には江別､幌内太､幌内の3駅でした。このほかに朝里､軽川､白石､幌向には｢フその内容は、ラッグステーション｣がつくられました。開通当時は手宮と開運町以外の駅は簡(1)幌内からlll兇向太までは鉄道による輸送。単な駅舎以外に周辺に建物もない状態であったと記録されています。蒸気機関車(2)I幌向太から石狩川河口まで外輪船による曳航。に必要な給水､給炭の施設は手宮､札幌、(3)石狩川河口に貯炭場をもうけ小樽に|[l1漕。幌内にしか設置されず、途中で水がなくなり周辺の住民が水を運んだという話もというものでした。のこっています。フラッグステーションは乗車の人があっ基本的には石狩一小樽の海運を利用する水運方た場合旗を揚げ、停車するという簡便なもので係員がいる小屋以外の施設はあり式でしたが、一部ではあっても鉄道システムを北ませんでした。海道に導入することを求めた画期|'|勺なものでした。◎時刻表開業当初は時刻表は作成されていませこの案は太政官にほぼ原案通り許可され、いよん。明治13(1880)年には朝9:00手宮発、12:00札幌着、そして13:00札幌発、16:0いよ|幌内炭|||の開発と鉄道・水運建設に向かいは0手宮着の－往復のみでした(この年稼動じめます。その拠点として開拓使に「煤田開採事できたのは弁慶1両のみ)。17日間のみの運行でした。務掛」がおかれ、北海道初めての鉄道建設に向け幌内まで開通した時の時刻表は未発見で、現在確認される最古のものは明治17ての第一歩が踏み出されました。（1884)年6月のものです｡1日3往復の運行ですが、第一列車は運炭のみ、第二列車なお､小樽までの鉄道案はこの段階では公的に全は貨客混合そして第三列車は札幌手宮間く議論された形跡がありません。その原因の一つのみの運行となっています。第一列車は6:30手宮発で幌内|こは10:45着となっていに張碓の神居古潭の存在があったと考えられます。ます｡また明治20年頃までは冬季は札幌幌内間は運休となっています。ここは小樽と札I幌という明治初期の北海道にとっ◎運賃運賃は､上等と並等の2本立てとなってて大事な拠点間の交通を阻害している難所でした。おり、明治16(1883)年の運賃表では手宮・明治9(1876)年にここを視察したホイラー(クラー幌内間で上等が2円20銭､並等で1円60銭、手宮-札幌間では上等80銭､並等60銭で本クの後任の教頭)は、鉄道が合理的であるが、たと州の鉄道と比べても割高なものであったようです。え簡単な鉄道であっても高額な費用がかかるため、ノーン"}, {"seq": 93, "page": 84, "img": "guidebook_pages/p093.webp", "t": "上人@現実的ではない、という趣旨の発言をします。また、開拓使がイギリス人ジョン・ベリーに依頼した札樽間の道路建設費の見積もりは85万円という巨額の見積もりでした。この神居十凛の道路開削と短距離の鉄道建設にあたって開拓使が招嶋した技2ジョセラ・ヨリー・ク邊ウォードでした。ただ、招陰された段階では幌内炭田から石炭搬出経路開発の主人公となるべき人物が別に存在しました。オランダから招かれた河川工学の専門家ヨハン・G・ゲン癌(ぐIア/で。画ウの王とゲント召田開採掛事務長となった山内と副長となった松本鞍一郎はオダントとクロフォードの米日に先立ち、石狩川水運経路をさかのぼり幌内までの区間を調査し、また石狩、茨戸、対座(江別)、幌向太で水位の変化、結氷の状況などを記録し始めました。ゲントは石炭運搬のメインの河川整備を担当する「石狩川水利工師」に任命されまま9一方、クロフォードは北海道初めての鉄道システムではあってもや短距離の幌内一幌向太の区間を担当し、また札幌周辺の道路整備をおこなう「北海道ノ炭山二連絡スル鉄道並ビ三車道建築兼土木顧問」となります。この段階でばはクロフォードはゲントの整備する水運に連絡する部分の担当者として認識されていたと思われます。ゲントにとって不運だったのは来日した翌明治12(1879)年4月、雪解け水と大雨で増水した石狩川が池沙し各地に大きな被害をもたらしたことです。この水害により石狩川の水運経路のためには結氷による障害よりも、安定した石炭の積み砺え区域の造成や増水期の対策が重要であることが判明します。ゲダントは石狩川河口の改良案などを策定してきますが、最後まで成功することはなく、幌内鉄道が開通した同13(1880)年逝去します。、)車馬道を建設中のクロフォードWMカムイコタン付近。明治12(1879)年ここ(北海道大学附属図書館蔵)なと4"}, {"seq": 94, "page": 85, "img": "guidebook_pages/p094.webp", "t": "一方、クロフォードは来日当初は幌内から幌向太までの間の鉄道敷設を計画昌和た。そこで開拓使の指示を受け、とりあえず小樽一札幌間の馬車通行可能な道の建設に着手します。4.小樽鉄道ルートの決定男車馬道の建設明治初期、小樽一札幌間のもっとやも主要な交通路は、小樽の港から石狩川さらに涼戸付近までの船(多くの場合、石狩川河口で船を乗り換え)その後徒歩、大友堀などが整備された後は札幌近くまでの船便が主体でした。張確の難所、神居古澤が交通の障害となっていましたが、幕末の頃より徒歩での通行が可能な道が次第に整備され、明治5(1872)年には下手稲村から幅2間(約3.6m)の道路が開通していました。レかし、海が荒れると危険な道であることに変わりなく、何より荷馬車の安全な通行ができない点が問題となっていました。クロフォードは現地視察後、開拓使に札樽間36km総額5万円の工事見積もりを提出します。これは以前イギリス人のペリーの見積り額85万円をはるかに下回るものであり、明治12(1879)年開拓使はクロフォードに札樽間道路の建設を命じます。クロフォードはこの工事を5ヶ月という驚異的な日程で完成させます。後で触れるようにこの車馬道は翌年には鉄道用地となるため1年足らずの使用期間でしたが、北海道で最初の公共交通機関として官設の駅通馬車が運行されます。この駅通馬車は冬季は雪馬車(馬機)が使用され、1日30て50台の雪馬車が行き来していたようです。片道の所要時間は3時間程度でした。完成した車馬道。右に恵比須島が見える。明治12(1879)年(北海道大学附属図書館蔵)上信"}, {"seq": 95, "page": 86, "img": "guidebook_pages/p095.webp", "t": "田貼内一江別そして幌内一小樽車馬道建設直前の明治12(1879)年3月、幌内での鉄道敷設のための詩査報告にクロフォードは幌内炭山から江別(江別太:石狩川と千歳川の合流地点)までの鉄道敷設案を併記しています。水運併用という点では当初の幌内一幌向太案と同様でしたが、和石狩川の池溢を考え、より下流で流速の遅い江別太での積みかえ作業を提案した形でした。しかし、ライマンたちの考えた水運併用案は石狩川を制御できない以上根本的な欠陥がありました。クロフォードも早い段階でそれに気がついたようで、おそくともゃ車馬道建設中の同年8月には小樽までの延伸案を検討し始めていたようです。そしてこの年の4月の石狩川の池溢は水運併用読の限界を示す結果となり、ちょうどそのころ完成に向かっていたクロフォードの車馬道は、財政的・技術的に無理と考えられていた小樽までの鉄道単独運搬を現実的なものとしました。そして車馬道が竣工した同年12月、開拓使は政府に石炭運搬の鉄道を「幌内一小樽間」に変更を申し出、その許可を受けます。ライマンの幌内誠山調査から7年、やっとその運搬の手法が決定したのです。なお、小樽までの延伸の中で、江別太や幌内太までの運行では石炭以外に貨物は考えられないが、小樽まで延伸した場合は「荷物乗客ヨリ生ズべキ利益ハコトゴトク石炭ノ運送費ヲ減少スベべキ補助トナルベキ」『開拓使報文』より)という利点が強調されています。幌内鉄道の本質が鉱山鉄道であったこと、そして小樽延伸で初めて公共交通機関としての乗客運搬の議論が出てきたことを示しています。札幌以東の内陸部に和人集落がほとんどなかった明治初期の北海道の現状がここにもあらわれています。弁慶号の前の技師たち。正面がクロフォード、その左が松本荘ー郎。明治13(1880)年(北海道大学附属図書館蔵)"}, {"seq": 96, "page": 87, "img": "guidebook_pages/p096.webp", "t": "5．建設工事着手■米国人技師と日本人技師たち鉄道敷設のルート決定をうけ、クロフォードは早速､機材の調達にアメリカに戻り、北海道初めてまつもとそう'.、らろうの鉄道工事は副長であった松本荘一郎によって､若竹第三トンネル(現存せず)の開削から始まります。｜|滉内鉄道を支えた日本人技師の中に、札||滉農学校を卒業した若い技師も一人いました。彼は橋梁を担当し､江別にある橋梁の設計施工を行います。完成後、初めての列車がこの橋梁を通ったとき、あまりの緊張で顔面は蒼白となり、ガタガタ震えていたと伝えられています。この若い技師は後にアメリカに留学し、帰国後小樽港の北防波堤を築ひろいいさプムき、「小樽港の父」と呼ばれる広井勇でした。広井のような、若く優秀な技師たちの貴重な実践教育の場ともなった|幌内鉄道の建設ですが、初期の現場はクロフォードが自国からつれてきた技術者チームが固めていました。この米国人チームが若い日本人技師たちの教材となっていきます。機材調達のために帰国中にクロフォードが集めた9人(後に2人合流し計11人）の米国人技師は、いわばごく普通の鉄道技術者たちで彼らが北海道で初めての鉄道建設と運営の中心となりました。明治13(1880)年7月(6月の説もあり）に着任すると、現在の双葉高等学校の位置に建設中であった建物を仮宿舎として活動を開始しました。〃と忠、毒'月齢室若竹トンネル｡奥に熊碓トンネルが見える｡明治13(1880)年頃（北海道大学附属図書館蔵）■札幌までの開通■に＝明治13(1880)年1月に若竹第三トンネルの工事から開始された後､工事は水天宮第一トンネル(現存せず：花園橋付近)、住吉第二トンネル(現存せ手宮桟橋に着岸したトベイ号｡明治13ず：南小樽駅付近)、熊碓第四トンネル(現存：車(1880)年※トベイ号の入港｡当時小樽港は国際港では馬道のものを改良)と小樽市内の4ケ所のトンネルなかったため､太政官の特別許可によって直接入港する手続きがとられます｡これは小樽を次々と開肖llしていきました。また、この区間の港最初の外国船入港でもあったのです。（北海道大学附属図書館北方資料室蔵）最大の工事と見られていた入船川の谷をまたぐ陸"}, {"seq": 97, "page": 88, "img": "guidebook_pages/p097.webp", "t": "橋も「僅カニ九日間ヲ以テ竣工」（『開拓使事業報告第二編｣より）するなど順調に工事は進んでいきました。この間の9月28日にはクロフオードが買い付けた鉄道資材をつんだトベイ号が手宮桟橋に着岸します。「義経｣などの機関車は早速手宮桟橋の付け根の開通のころの手宮駅構内作業場で組み立てが開始され、同時にレールの敷明治17(1884)年以前の写真設もはじまりました。そして10月24日、手宮から（北海道大学附属図書館蔵）熊碓までの敷設が完成し､試運転が行われました。lll晃内鉄道の写真としては一番有名な､入船川陸橋を渡る弁慶号のシーンが撮影されたのがこの日です。ちなみに義経号はまだ組み立て中(完成は12月）で動くことができる蒸気機関車は｢弁慶｣号のみでした。熊碓から銭函までの区間はすでに車馬道としてクロフォードが建設していたため順調に工事は進みます。ちなみにこの区間には現存する北海道最古のトンネル通称｢義経トンネル」（当時は張碓第五トンネル)と最古のレンガ橋脚｢張碓鉄橋｣が残っています。熊碓までの試運転からわずか18日後の11月1111手宮・銭函間の「仮運転」が行われます。この段階ですでに営業を行っていたと推測され、北海道初めての鉄道は実質的にこの日から運行(機関車は｢弁慶」のみ)されていたといえます。一週間後には軽川(手稲)まで延長し、二日後の11月20日、手宮一札幌間、35.9kmが開通し、281~lに運転式が挙行されます。線路工事はもちろんトンネルエ事橋梁工事などすべての工事着工から完成までわずか11ケ月というきわめて速成の工事でした。もっともそれに効果があったといわれるのは、レールの細さでした。明治5（1872)年、日本で最初に鉄道が敷かれた新橋一横浜間で使用されたレールはイギリス、ダーリントン社製の60ポンド(27216kg)レール(双頭型)でしたが、手宮一札|幌間で使用されたものは30ポンド(13.608kg)レー住吉駅を出発したしづか号｡右奥に住吉トンネルが見える｡明治20(1887)年頃（小樽市総合博物館蔵）入船陸橋を渡る弁慶号明治13(1880)年10月24日（北海道大学附属図書館蔵）"}, {"seq": 98, "page": 89, "img": "guidebook_pages/p098.webp", "t": "ル(T字型)で半分しかないものでした。耐久性や加重能力はかなり劣るものでしたが、施工が容易であり、クロフォードが活躍したアメリカ西部でもしばしばぱば用いられた方法でした。6.開通から至通か明治30(1897)年頃の手宮駅構内。正面画脱内までの全通の建物が旅容用駅舎。左奥に三号機関順調に開通した手宮一札幌間にくらべ札幌一由理庫がクスる内間は開拓の手があまり入ってはいないことと地形的な困難さもあり、松本たち残された日本人技師たちは苦労を重ねることになります。明治13(1880)年中に創成川から豊平川までの間の基礎工事を終わり、本格的な施工は雪解けを待って翌14(1881)年6月から着工されました。やもっとゃも困難であったのは山間部の幌内ではなく、札幌近郊の豊平川から江別にかけてでした。当時の厚別は泥炭地が広がっていたからですが、それ以上に技術者たちを悩ませたのは豊平川の池溢でした。計時..妙見川(現寿司屋通り)を渡る機関車ここにはトラス式鉄橋を架けたのですが、工事完明治30(1897)年頃了を待たずに流されてしまい、結局全通時には仮生生還橋のまま、という状態でした。そのような難工事を抱えながらも、札幌まで開通した1年半後の明治15(1882)年6月25日は江別までの仮営業が開始されました。そしてその5ヵ月後、同年11月13日、手宮一幌内91.2kmが全通し、同時に営業運転開始され、14日には幌内鉄道本来の目的である石炭の搬出のはじめての貨車も出発し層16(1883)年2月2日に太政官第三号布達によって正式開業となります。そして同年9月17日に、に材内鉄道開業式が開催されています。「脱内鉄道問人の通」はこの3つの段階があめるのですが、明治15(1882)2年中は豊平川だけではなく、独春別川や幌向川の橋も破損するなど決して順調な運転ではなかった(のMGの語"}, {"seq": 99, "page": 90, "img": "guidebook_pages/p099.webp", "t": "さて9月11日の開通式の様子は函館新聞に詳しく掲載されています。それによれば、朝7時に盛大な見送りを受けて出発した「比羅夫」号は札幌に8時40分に、幌内には11時50分に到着します。参加者一行は幌内炭鉱の視察後、札幌まで戻り、札幌の豊平館での式典に参加しました。その時の式次第と夜会(祝賀パーティー)招待状も残されてまま9なお、開拓使燥田開採事務掛がはじめたこの幌内鉄道の敷設は、明治15(1882)年2月の開拓使廃止にともない「工部省燥田開採事務係」、「工部省岩内幌内両炭山並鉄道管理局」「工部省岩内幌内両炭山並鉄道燥田並鉄道管理局」さらに翌16(1883)年の開通式のときには「農商務省北海道事業管理局」と管理部門が変遷します。幌内鉄道はこのあとゃ名称、管理主体が次々と変わっていきます。7.全通以後画北海道鉄道開通明治13(1880)年に開通した幌内鉄道は、8年後の同21(1888)年業績不振を理由に農商務省より移管していた北海道庁より民間会社の北有社に運輸委託されます。これは主に石炭の販売が振るわず、また出炭量も予想を下回ったためといわれています。しかし、半官半民の北有社では抜本的な経営改革はできず、翌22(1889)年には北海道炭確鉄道会社に払い下げられました。一方で古くから北海道第一の都市として栄えていた函館と札幌を結ぶ鉄道の敷設もさまざまな方面から強く要請されていました。北海道庁はこの区間の建設は官設によって運営していこうと計画し、明治19(1886)年には平井晴二郎(機関車庫3号の設計者)に測量調査を命じます。このときの計画では小樽一小沢、函館一黒松内の区間は現在の函館本線とほぼ同じですが、小沢か入船陸橋を渡る列車。奥は水天宮山明治14(1881)年(小樽市総合博物館蔵)朝里付近を走る機関車。明治30(1897)年頃(小樽市総合博物館奥山コレクション)カムイコタン付近を走る機関車明治30(1897)年頃(小樽市総合博物館奥山コレクション)"}, {"seq": 100, "page": 91, "img": "guidebook_pages/p100.webp", "t": "らは岩内を経て日本海側を寿都付近まで進み黒松内にいたるといらうらものでした。この建設は紀余曲折をたどり、日清戦争などにる財政悪化が背景となり、.民間の手によって建設されることになります。湾沢栄一-など中央の財り人とWWかのか0f(どが人となり「函樽鉄道株式会社」が明治33(1900)年に設立され(翌年「北海道鉄道株式会社」と改称)、翌年より大沼峠下トンネルと忍路トンネルの開削から工事を開始します。この時期、ロシアの南下政策に対し明治政府は強い警戒感をもっており、旭川と函館の間の兵店輸送路の確保が急務となっていました。そのため、政府、道庁や補助金などを支出しますが、「軍事的な理由」が優先され倶知安経由の現在の路線に変更されます。このため道央と道南を結ぶ幹線にもかかわらず、急勾配、急カーブの多い路線となり、スピードや輸送量に限界を持ってしまうことになり、後千歳回りに主役を奪われる一因となります。北海道鉄道は小樽・余市地区と函館地区の比較的平坦な所から同時に工事が始まり、急ピッチで進んでいきます。最初に開始した函館(後の亀田)一本郷(現在の渡島大野)、然別一議島間は本格的な施工からわずか1年余りの明治35(1902)年12月に部分開通します。翌36(1903)年6月には本郷一森、開島一小樽中央の間が開通、さらに難工事であった稲穂トンネルが完成し同37(1904)年10月には全線開通します。ただし、北海道炭太鉄道となっていた幌内鉄道とは結ばれておらず、一般客は人力車などで連絡をしていました。ちなみに高島(小樽中央が改称)一函館間の運賃は最もゃ安い3等で3円でした。翌年には高島一小樽間の連絡線が開通し、小樽停車場は共同運営という形になります。しかし、明治39(1906)年、北海道炭確鉄道、翌年には北海道鉄道が鉄道国有法により国有化され、明治30(1897)年頃の札幌駅前。駅舎は2代目(小樽市総合博物館奥山コレクション)冬の幌内鉄道。機関車右側が'雪払車」明治15(1882)年(北海道大学附属図書館蔵)北有社。『後志国盛業図録』より明治22(1889)征(小樽市総合博物館蔵)"}, {"seq": 101, "page": 92, "img": "guidebook_pages/p101.webp", "t": "長共全帝国鉄道店の一元管理となりました。画小樽駅変遷ところで「著の小樽駅は」という話のときには、「どちらの?」と聞かなければなりません。小樽という駅名はまず明治33(1900)年に北海道炭確鉄道の駅名として登場します。ここは開設当初は地名から「開運町」でしたがすぐ焼失し、現在位置に移転し、これも町名から「住吉」となり小樽となりました。ここは当時、名実ともに小樽の中心街でやり、まさに妥当な駅名でしたが、明治36(1903)年にできた北海道鉄道の「小樽中央」駅は名前と実際の場所にずれがありました。当時の稲穂界隈は町のはずれで、この駅もや町はずれにあった直行寺などを移転させて建設されたものです。しかし駅ができてから急速に発展し、名実ともに小樽の中央になっていくのですが、全線開通時の明治37(1904)年には「高島」と改称します。(このとき蘭島も「忍路」となります。)翌年には再び改称し高島は「中央小樽」となります。(忍路は再び「蘭島」に戻ります。)その後、大正9(1920)年にすでに中央市街地となっていた中央小樽が「小樽、、それまでの小樽を「南小樽」と呼選ことになります。つまり、小樽駅、南小樽駅とも4代目の名前を名乗っているこeSります。弄その後の「義経」たち幌内鉄道に導入された8両の蒸気機関事はそれまで本州に導入された機関車とは系庶がことなるゃものでした。本州の鉄道はイギリス式、幌内鉄道以後に敷設された九州の鉄道はドイツ式でしたが、この燕気機関車はアメリカ、ピビピッツバーグのポーター社製の1Cテンダー形蒸気機関軸でした。内部に火の粉止めがついたダイヤモンド形の煙突と、前面のカウキャッチャー(牛よけ、障害物排除器)、ツク初代の小樽駅舎(小樽市総合博物館蔵)3代目の小樽駅(小樺市総合博物館蔵)※小樽駅の初代駅舎は小樽中央」「高島」「中央小樽」の3つの名前を持ち、明治44(1911)年に新築された2代目の駅舎は「中央小樽」「小樽」の駅名、そして昭和8(1933)年建築の3代目にあたる現在の駅舎は「小樽」駅として建設され"}, {"seq": 102, "page": 93, "img": "guidebook_pages/p102.webp", "t": "そして煙突の後ろに取付けられた鐘が特徴でした。さて、この機関車たちには艦船と同じく「和名」がつけられています。1号が「義経」(現在大阪市の交通科掌博物館にて保管)、2号が弁慶」(さいたま市の鉄道博物館にて保管)、3号が「比羅夫」、4号が「光閉」、5遇が「信広」、6EANskiのか」(現在小樽市総合博物館にて保管)です。このあとに7号と8号が輸入されますが、すでに幌内鉄道は北有社に委託されていた時代であり、和名をつけるといった雅なことはする余裕がなかったのでしょうか、名前はついていません。これらの機関事は国有化後に、全国共通の形式番号がつけられ7100形(7100て7107号)と呼ばれるようになりますが、大正時代にはすべて除籍となり、民間工場などで入換用として、往時の優雅な姿からはかけ離れた改造を受けていきました。その後、鉄道開設50年を記念して東京に「鉄道博物館」を設することになり、「お台し列車」であった「義経」も保存することになりました。そこで7101号は大正12(1923)年8月札幌より東京に向けて出発しました。しかしその途中で関東大震災が発生し、受け入れ不可能となり黒磯駅で保管をされていました。昭和10935)年いよいよ展示のための復元を行うことになり大宮工場に回送されますが、そこでこれが「義経」ではなく「弁慶」であることが判明してしまいます。受け入れ先の鉄道博物館では「お召し列車」でもない「弁慶」の処遇をめぐって議論があったようですが、最終的に同151940)年から鉄道博物館に展示され、現在に至っています。では本当の「義経」はどこにいったのでしょうか?調査の結果、北海道から遠く離れた大阪の帝国車両の工場で入換用として働いていた7105号がそれであることが判明します。この機関車は幸運にも鉄道80周年を記念して、昭和27952)年に神戸の鹿取工場で見事に原形に復されました。一方、北海道に残っていたのが7106号であった「しづか」でした。「しづか」ゃ大きく姿を変え室蘭の日本製鋼所に残っていました。昭和27(1952)年再び国鉄に戻り、荷物であふれる小樽駅。大正時代(小樽市総合博物館蔵)"}, {"seq": 103, "page": 94, "img": "guidebook_pages/p103.webp", "t": "記提3)苗穂工場で復元されたのですが、実は無名であった8号機(当時は7100号)を解体し部品を譲ってもらっての復元でした。「義経」「弁慶」が復元されている状況で、「では静御前もる」といった考えがあったことは間違いないようです。その点で名前がつけられなかった無名の8号機は不運であったといわざるを得ません。『上幌内鉄道史』近藤喜代太郎著成山堂書店平成16年『札幌駅百年史』札幌駅編昭和55年『北海道の鉄道』田中和夫著北海道新聞社平成13年「幌内鉄道の運転時刻」(『小樽市総合博物館紀要』第5号星良助著昭和64年「手宮一幌内間の幌内鉄道はわが国第三の鉄道なのか」(『小樽市総合博物館紀要』第19号)星良助著平成18年『七十年史』北海道炭確汽船株式会社編昭和36年『小樽歴史年表』歴史文化研究所平成18年「開拓使報文』など基礎史料はのぞく"}, {"seq": 104, "page": 95, "img": "guidebook_pages/p104.webp", "t": "きけにすt:回回回小椅の鉛光が見えてくる@小宰観光の「校]運河の歴史$小拉観光の独自性「まちづくり観光」る運河を守る会・ポートフェスティバル$小樽運河百人委員会"}, {"seq": 105, "page": 96, "img": "guidebook_pages/p105.webp", "t": "1.まちづくりの観光観光には名所旧跡・温泉・食べ歩き・体験など、さまざまな目的があります。一方、小樽観光は「まちづくり和観光」ともいわれています。昭和40年代からはじまった小樽運河保存論争をきっかけに、多くの市民がまちづくりに関わってきた成果が、観光につながっているといわれています。小樽の過去の歴史的遺産が観光資源になっていることはまちがいありませんが、小樽市民はそこに、新たな「まちづくり」という価値を加えてきたとえば、古い建物を再利用したり、新築の際にゃ街並みに調和させたり、行政がこのような運動を奨励する条例や制度を定めたり、団体がこのような運動を楽しむせようなイベントを仕掛けたりしてきたことをいいます。この「まちづくり稔光」の原点である「小樽運河保存運動」を振り返ってみたいと思います。2.明治の小樽運河論争画本格的な港づくりに向けて小樽観光には欠くことのできない小樽運河ですが、明治と昭和の2回、今の小樽には運河はなかったかもしれないというできどとがありました。最初に明治の小構運河論争から見てみましょ5。小樽は自然の地形が港にふさわしかったことから北海道開拓の海の玄関口として発展してきましたが、明治も中ごろになると、本格的な港づくりの必要性が高まってきました。小樽運河は小樽港束備の一環として誕生しましたがかが、完成は大正12(1923)年。その間、幾度となく大論争が繰り返されてき還旨|あ/G"}, {"seq": 106, "page": 97, "img": "guidebook_pages/p106.webp", "t": "軒最初の案最初の計画は、水天宮先にあった立岩から手宮までの海岸を埋め立て、中央付近に小さな坦頭を突き出したものでした。この計画がすんなり実現していれば、小樽の港の風景は大きく違っていた2のまこのil和lはきまきま利権が絡んで二転三転します。一番大きかったのは、各地の炭鉱からの石炭を手宮から積み出していた北海道炭確鉄道会社の埋立事業をめぐっての争いでした。小樽のまちが一丸となって港づくりに取り組むにあたって、一企業による手宮の埋め立ては支障になるという意見が大勢でした。それに対して炭確鉄道側が秘密理に関係者の同意取り付けをしたことから、さらに紛紅、ようやく両者が和解するは6年近くの後のことでした。その直後に北海道炭確鉄道会社の鉄道部門は国有化され、今度は国の意向で計画が変更されるなど、なかなか工事に着手されないでいるうちに岸壁と坦頭のかわりに運河をつくるといりき88訴ラiGきのjG還広井勇の指摘沖合を埋め立てて運河をつくるという案は、金語らう明治41(1908)征小樽港北防波堤竣エ(小樽市総合博物館蔵)明治44(1911)年/手宮高架機橋落成(小樽市総合博物館蔵)に1イエううもそりPEけコトに図着図選圧はき則9因忠『洒当山藻笛(はさろ1)11十昌世党"}, {"seq": 107, "page": 98, "img": "guidebook_pages/p107.webp", "t": "いう理由で日の目を見ませんでした。還eaところが、明治42(1909)年7月21日、ヨーロッWeパやアメリカの港湾視察から帰ってきた広井勇が、「小樽港の貨物の種類や荷造りの方法などからみて、埋頭岸璧による貨物の積み降ろしは将来のこととして、艇を利用した運河式の方が便利である」ジュテーゝBSVークトンー埋立以前の小樽倉庫前と指摘したことから、状況は一変しました。そのかでお年の11月には運河式に設計を変更する申請が出されています。広井は、防濾堤をはじめとした小樽の港づくりの中心人物だったので、その影響力は大きいものがありました。画成案へ運河式の計画案は、道庁から埋め立ての範囲が、以前の計画より大きくなっているのは不適当だと指摘を受け、さらに坦頭岸壁式を強く主張した人たちは、計画内容がずさんだとして反対、またまた暗礁に乗り上げます。再度、埋立範囲を縮小し完成した小樽運河/『小樽運河史』た計画がつくられますが、この間に国の勝納方面での大規模な埋立計画が持ち上がるなどしたことから、そちらの情勢を見極めるまで運河をつくるのを延期すべきだという意見も出され、あらためて区会での大論争となりました。最終的に現在のかたちで設計が認可されたのは大正3(1914)年3月。最初の計画から15年が経過していました。運河が完成してから10年あまりで、3つの井頭をつくる工事に着手しているので、港の施設としての運河は旬を過ぎつつあったのかもしれません。この港づくりの論省がもっと早く決着していても、また、これ以上長引いていても、私たちは運河の姿を見ることができなかったでしょう。"}, {"seq": 108, "page": 99, "img": "guidebook_pages/p108.webp", "t": "参考文献:『小樽運河史』渡辺賜之助著:昭和54(1979)年3.昭和の小樽運河の保存運動て守る会の発足て還50年後の姿このように難産の末、誕生した小樽運河ですが、半世紀後には存続の危機に直面します。昭和40(1965)年頃には、港の設備の中心は埋頭に移り、運河の役割はほとんど終わっていました。そのため、昭和41(1966)年につくられた道路整備計画で運河を埋め立てて幹線道路とすることが決められました。そのころの小構運河は、和解や漁船が繋がれていましたが、長年にわたって堆積したヘドロからメタンガスがブクブク泡をたて、壊れた船が沈んでいる状態でした。高度成長の勢いが全国をおおい、街が大きく変わっていった時代に、港の真ん中に無用となった水路が残り、岸辺に明治時代の遺物の倉庫が並んでいるのは「小樽の恥」と考えた人が多くいたとしてゃ不思議ではなかったでしょう。画埋立工事着工札幌から小樽までの高速道路札樽自動車道が完成した昭和46(1971)年の翌年、高速道路から運河を埋め立てて整備される予定だった道路の工事により、有幌地区にあったたくさんの石造倉庫が壊されました。小樽運河沿いの石造倉庫は、水際に長く長く軒を連ねていたのが特徴でしたが、この有幌地区は数本の道を挟んで石造倉庫が約30棟建ち並び、まるでヨーロッパ中世の街並みのようでした。それが上く間になくなった。そして、その次には運河が・・・埋立前の運河埋立前の運河"}, {"seq": 109, "page": 100, "img": "guidebook_pages/p109.webp", "t": "一「小樽運河を守る会」の発足昭和48(1973)年12月、「このままでは小樽の歴史がなくなってしまう。小樽が小樽でなくなってしまう「」という思いから、一部の市民が立ち上がりました。それが「小樽運河を守る会」の発起人会でした。当初、25名。郷土史家の越崎款一さんを会長に正式に会が発足するのは翌年の6月ですが、思い返せばそれらの方々立ち上がらなければ、私たちは今、小樽運河の風景に出会うことはなかっ7まり。すでにた計画が決まっていたばかりではなく、工事も始まっていました。そんな大しい状況に加えて、市民の生活から遼い存在になってしまった小樽運河を、貴重な歴史的な遺産として残して欲しいという運動がどれほど大変だったことか。「小樽経済の再生に欠くことのできない幹線道路整備の早期実現を」との声の前に、おそらく四面雑歌といっていい状況だったと思います。それが10年にゃもおよぶ粘り強い取り組みとなり、現在に多くの遺産を残すことができたのは、なぜだったのでしょ画保存運動の背景唯一の光明は時代の風であったかやもしれません。昭和48(1973)年のオイルショックを契機に、高度成長の代償として失ってきたものの大きさを顧みる機運が高まっていました。日本で歴史的街並みを保存する制度ができたのが同50(1975)年ですから、ちょうど小樽運河の保存運動が始まった直後です。それに先立ち、同45(1970)年には、日本建築学会の明治建築調査小委員会による保存したい明治建築のリストが公表され、街並みとしては、グラバー邸を核とする長崎の南山手地区、神戸の山本通りの異人館街、そして、小樽運河周辺の歴史的街並みなが取り上げられていました。文化庁でも小樽運河には高い関心を寄せていたわけです。ヤンンアムグ24グク運河に道路ができると出典『小樽運河の保存のための港湾再開発と運河再利用計画展パンフレット』有幌の石造倉庫群(小机総合博物館蔵)"}, {"seq": 110, "page": 101, "img": "guidebook_pages/p110.webp", "t": "同53(1978)年には、札幌を中心に道内の著名な作家・画家・学者など43名により「｢小樽運河|川題」を考える会」が結成され、「小樽運河と石造建築群周辺の、歴史的・文化的街並の保存と再生を求めるアピール」が発表されました。さらに、｜司じ年、東京では「小樽運河を愛する会」が結成されるなど、全国的な取り組みに発展し、アピール賛同署名者は全国の著名人およそ120名にまで拡大していきました。これら外からの風は、大きな反響を呼びましたが、それ以上に大きな時代の風は小樽のまちの中から起きてきました。小樽運河を残したいという声に冷ややかだった小樽のまちで起きた新しい風は、二十歳前後の若者たちからでした。参考文献：『小樽運河戦争始末』小笠原克著昭和61(1986)年参考文献：『小樽運河存の運動・歴史篇資料篇』「小樽運河問題」を考える会編昭和61（1986)年（1）共同アピール昭和53年11月I日昭和五十一一一（一九七八）年十一月一日保存四団体による共同アピール「小樽運河保存の運動」より河罵･1I時曾郎呂呵箆次属卑鹿わたりぷ白廼向Ｔ守るの侭しかならないでＬ上今石ｌ小樽復興の経済学Ｉい掌踵喝阜すみかという力近年も■＆いか偶鯵炭寸ら年でばなく華立もした即くみ万で蛇、ロ易画新しい町自慢の創造を／と心え半うとしてい▲せん。その里づく申という筏い珂且か今し隼し炉し『小睡命哩勗問軍ぞ四韓■せつ吋凸か垂久でいまず。運河からのまちづくり耐■野咳”そう助礎しぃ固凶轄の醍壷刃吐邸殴■であることｅ小樽市ｕこのたび■肉唖立て"}, {"seq": 111, "page": 102, "img": "guidebook_pages/p111.webp", "t": "4.「地域に生きる」とは何か^若者が担ったポートフェスティバルて田「ポボートフェスティバル・イン・オタル」開催小樽運河を守る会の2代目会長として、全国的にゃ小樽運河保存運動のシンボルとなった節山富美さんは、小樽運河を残す運動に関わる意味を、よく地域に生きるとは何か」といら問いとして投げかけていました。ただ単に生きるということではなく、「地域に生きる」ということには、どういうら意味があるのか。この問いに、自らの体験を持って答えたのは、東京からけターンして小樽に戻ってきた若者たちであり、これから小樽に残るか、まちを出るかひとつの岐路に向き合っていた高校生たちでした。昭和53(1978)年7月8、9日。それは、いつゃもは時間が止まったような静けさに沈んだ小構運河が、一瞬、かつての輝きを取り戻した日でした。最盛期の運河は279POR7存S77147の74ROU7月7日(土)PMS一7月8日(日)AM10一場所小摘港第3朝頭・小樽運河周辺第2回ポートフェスティバルちらし「小樽運河保存の運動」より"}, {"seq": 112, "page": 103, "img": "guidebook_pages/p112.webp", "t": "「づくり文化わが街水辺のまつりの」第4回運河大宗931ポートフェステイバルジルpy/)トルみややいいにだで1>さきれれまきいロフ第4回ポートフェスティバルちらし千人以上の港湾労働者で活気にあふれていたそうですが、この両日は、約6万人もの市民が運河を訪れました。運河とその周辺の石造倉庫を舞台にした市民手づくりの祭り「ボポートフェスティバル・イン・オタル」。中央橋と龍宮橋の間は歩行者天国となり、運河の岸辺にはおよそ100軒近くの店が並びました。店といっても、お祭りでよく見る屋台ではなく、手づくりの商品や、小樽らしさきにこだわった商品を扱う店が軒を連ね、和狼の市のような魅力にあふれていました。運河に係留された和はビアガーデンとフォークソングのステージに、龍宮橋先の港にあった空き地はロックコンサートの会場に、そして龍宮橋のたもとにあった石造倉庫は、舞踏やジャズのライブ会場にと、運河や石造倉庫を舞台にして、生き生きとした時間が過ぎていきました。メタンガスが吹き上がり、小樽経済の衰退を象徴するような場所として忌み嫌われ、なかば忘れ去られていた小樽運河が、実は多くの人をひきつける魅力あふれる場所になる可能性があることを実証したのが、この「ポートフェスティバル・イン・オグレロSIと。このイベントの企画、運営に携わったのは、当時、二十代半ばの若者たちでした。東京からUターンして小樽に戻ってきた人や、放浪のあげく小樽に腰をおちつけた人など、どこか、自分探しのにおいを感じる人が多かったようです。そのような人たちを中心に、高校生までも参加して実行委員会がつくられ、企画から、資金集め、いろいろな許可手続きまで、力をあわせて実現にこぎつけたのでした。ポートフェスティバルは、その後ゃ毎年開催され、合計17回を数え、小樽の和夏の"}, {"seq": 113, "page": 104, "img": "guidebook_pages/p113.webp", "t": "お祭りのひとつとして市民にも親しまれるイベントになりました。'5．’9万7千人の市民の声～小樽運河百人委員会～■「小樽運河百人委員会」発足このように内外で運河保存運動が盛り上がりをみせたことや、西武グループが運河地区の観光商業開発には全面保存が不可欠との認識を示したことなどから、道路建設促進を掲げていた経済界も、商工会議所の首脳を中心に運河埋め立ての見直しへと180度、方向転換をすることになります。小樽運河を守る会の会長をはじめ、商工会議所の副会頭、小樽商大の先生、一般市民、主婦など|幅広い層の人々が100人名前を連ね、「小樽運河百人委員会」が結成されたのは、小樽運河の埋め立てのための杭打ちを目前にした昭和57(1982)年9月でした。ほんとうの市民の声を目に見えるかたちでと、10万人の署名を集める運動を始めます。当時の小樽の人口は約18万人でしたから、とてつもない目標だったといえます。ポートフェスティバルに参加した多くの若者も署名集めに奔走し、結果的におよそ9万7千人の署名が2ケ月間という短期間に集まりましたが､それでも、運河を埋めて道路をつくる計画は止まらず、11月11日に1本目の杭が運河に打ち込まれました。■現在の運河今、私たちが見る運河は、当初の中央に水路を残し将来的に高架道路をつくれるようにという計画を一部見直し、水路を片側に寄せて水路沿いに散策路を整備した｜小樽運河100人委員会ｱﾋﾆ兀二運河は小樽をよみがえらせ港～連河保存と道路建設は両立可能一一"}, {"seq": 114, "page": 105, "img": "guidebook_pages/p114.webp", "t": "ものです。もともとの運河の幅と周辺の風景を見られるのは、運河の北側3分の1の部分です。緩やかにカープを描く水面浴いに、20棟近くの石造倉庫が軒を達ねる姿は見られませんが、その面影は感じ取ることができるかゃもしれません。6.まちづくぐりの燈は消えずその後の市民運動>小樽運河の風景は変わりましたが、小樽運河をめぐる10年という歳月は、小樽の歴史的街並みの存在を内外に強く印象づけ、小樽のまちのシンボルとして蘇らちせました。そればかりか、ポートフェスティバルに参加した若者たちをはじめとして、運河保存運動をつうじて小樽のまちと自分を見つめる機会を得た多くの人々のエネルギーが、その後のまちづくりに脈々と生き続けているのです。コラム「小樽運河保存運動の5つの特徴」東京大学工学院系都市工学科教授西村幸夫氏発言要旨手宮線プラン小樽まちづくり協議会発行平成10(1998)年3月1日発行よりイマジネーション」のある運動あの臭をつまみそうな汚れた空間から歴史的原風景を想像し、そして新たな明るい空間を想像したこと。.単なる反対運動ではなく「対案提起」の運動対案を出すためには専門的知識がなければならないが、これをしっかりと構築したこ.「環境の教育力」という新たな表現を主張した運動運河という「場」がもつ潜在力を引き出すためにポーフェスティバルのようなイベントを行い、その場に立つて考え方が変わることを主張実践したこと。.町並み保存運動の「教科書」となった運動小樽運河というのは町並み保存運動のために次々と書き下ろされている教科書であっ.日本のモデル事業の政策転換のきっかけをつくった運動昭和61(1986)年に完成した運河散策路等の整備事業は、シンボルロードという建設省のモデル事業になつたこと。)トっ剛介"}, {"seq": 115, "page": 106, "img": "guidebook_pages/p115.webp", "t": ""}, {"seq": 116, "page": 107, "img": "guidebook_pages/p116.webp", "t": "小樽は屋根のない博物館ぐ克史的建造物の建てられた到景$奏史的建造物の建築的特徴歴史的建造物と関連人物"}, {"seq": 117, "page": 108, "img": "guidebook_pages/p117.webp", "t": "まちの推移江戸末期から明治10年代にかけて小樽で多くの人々が生活していた場所は、勝納川の河口付近(現在の信香町)でした。この周辺はりl治3（1870)年の区分によると小おこばち樽郡とよばれ、その北端は於古発川を境に高島郡と接していました。こんたん明治14(1881)年5j121日におきた金曇l1l]-の大火で勝納川の北側にあった小樽郡役所をはじめ多くの建物が焼失したため、まちの中心を北の入船川に沿った場所に移設し、新しい道路と市街地がつくられました。1．鉄道開通大火の前年の明治13(1880)年11月28日に開拓使は、｜幌内鉄道の手宮一札|Md間で運転式を行いました。線路は手宮を起点として海岸に沿って南北に敷設され、入船にはまちの上を通過する木造の陸橋が建設されました｡鉄道の最大の目的は'|滉内(現在の三笠市)で採掘した石炭を運搬することでしたが、人や食料、日用品などの物資も輸送したことから小樽では流通が活発になり、にわかに商都の賑わいを呈しました。船の荷物の揚げ卸しは、現在の運河に架かる浅草橋付近にあった波止場を中心にしもつこつせきぞうたことから同20(1887)年ころから周辺に大きな木骨石造の倉庫が建ち並び、また、色内通には今日の中心市街地の基盤となる商店や旅館などが建てられました。2.大火｜ﾘl治期小樽のまちは何度も大火がありましたが最大の被害をもたらしたのは明治37(1904)年5月8日に発生した稲穂町の大火です。火の手は色内、石山を越えて手宮まで達し、2,500余戸を焼き尽くしたと伝えられます。その結果、小樽区は市区改正(現在の都市計画)をおこない、色内地区を中心とした道路の拡'幅と新設工事を実施し、幌内鉄道の線路も西側に移設させています。さらに、この大火を契機に市街地の主要建物の構造は木造から木骨石造へ一気に転換しました。木骨石造が用いられた理由は防火のためであり、色内・堺町周辺にその商店が軒を連ねました。現在見られる木骨石造の商店は大火後に建築されたもので、小樽|,kl有の歴史的な町並みを形成しています。3．市街地形成宅地の造成は、明治後期から大正期にかけて、川や沢の上流に沿って1l1間に伸展しました｡於古発川沿いに開発されたのが富岡に続く緑・最上地区であり明治43(1910）年の小樽高等商業学校(現小樽商科大学)の開校も契機になっています。市街地の北部では手宮川に沿って梅ケ枝・末広地区が伸び、手宮仲通沿いには豊川・石山・清水地区が広がって行きました。"}, {"seq": 118, "page": 109, "img": "guidebook_pages/p118.webp", "t": "4.港と運河明治・大正期の港の建設は、港内の波浪を防ぎ、貨物の移動と貯蔵の流れを確立し、親水空間を生み出しました。第1の大きな工事は防波堤をコンクリートで建設たことであり。IIた。北防小堤の第一期工事は明治41(1908)年に竣工し、南防波堤の第2期工事は大正10(1921)年に完成しています。第2の大工事は運0です。運河は沖の船と倉庫の荷役を運搬する艇を考慮した計画であり、工事は港内を埋立てて出島を築き、岸辺との間に水路を造る方法で同12(1923)年に完成しました。なお、昭和期になると大きな船舶を直接横付けできる埋頭の建設が始まり、昭和14(1939)年には第ー坦頭が完成して新たな港湾が形成されることになりました。2明治期の建築1.すまい一石置き屋根の住宅と邸宅一明治10年代の庶民の住宅は、簡易な木造で建てられていました。建物の外観は、入船の鉄道橋脚付近の写真によれば、外翌に横板を張って縦機を打ち付け、出入口と窓に障子を入れ、勾配の緩い屋根に板を暮いてその上に石を置いていました。明治11(1878)年、アメリカの動物学者モース(EdwardSylvesterMorse、大森貝塚の発見者)は小樽を訪れ、屋根に石を置いた宿と庶民の様子をスケッチで描いています。石置き屋根の建物は、日本海沿大の松前や江差、函館などでも多く建てられていたことが知られています。なもに古板芝必要の民家/入船明治17(188前(市金友炊(後、五守。富明治37年ころ)は中央に和館、右手に洋館、左にサンルームがあり、植物園も併設する大邸宅でした。金澤友次郎は福島町(渡島の出身で、録光で資産家になった一人で記す同卿の花田家は留萌で錬光を営み、現在、花田家番屋(留前市鬼鹿)は国指定|重要文化財になっています。金澤友次郎邸の和館。竹の床柱と金澤友次郎氏の洋館。暖炉にはビクトリアン・(写真撮影:安達治高い天井が特徴。タイル(イギリス製)が使われていました。上段右、下段)"}, {"seq": 119, "page": 110, "img": "guidebook_pages/p119.webp", "t": "態欠明治初年、祝津では角漁の建網漁業者が定住し、次第に番屋や倉庫が建ち並び、明治20年代には小樽・高島郡で漁獲量がピークに達しました(『小樽市史第2・3巻』)。白鳥家番屋は明治10年代の建物です。網元のすまいと漁夫の居住部分が一つの大屋根でおおわれ、当時の漁家の様子を伝えてい明治後期になると実業家の邸宅が市街地に建てられ、中には広大な敷地に和風の母屋と洋館を併置する大邸宅も出現しました。2.鉄道の建築一木造洋風建築とれんがの導入一開拓使は幌内(現三笠市)に炭鉱を開鉱し、その石炭を輸送するため手宮に明治13(1880)年から鉄道施設と機橋を建設しました。最初の建物である事務所、停車場、工場、機関室、列車置場は木造で西洋風の外観でした。西洋風建築の特徴は、外克を横板張り(下見板張り)にして窓の戸を上下させる縦長窓(上げ下げ窓)にしている点です。鉄道技術を指導するアメリカ人を和宿泊させるため、明治13(1880)年、住吉(現双葉高校付近)に洋風の寄宿所を木造2階建てで建てました。しかし、翌14(1881)年5月に金曇町の大火で類焼した郡役所に転用することになり、急いで手宮に合宿所をアメリカの工法(気球構造」バルーン・フレーム)で新築しました。鉄道の建造物にれんがを使う計画は明治16(1883)年に始まります。その目的は火災から施設を守るデme鉄道開設時の手宮の施設/明治13(1880)年/図中A:工場、B:板庫、C:吹抜庫、D:石炭庫(北海道大学附属図書館蔵)小樽郡役所に転用された外国人寄宿所(小樽市総合博物館蔵)入船町陸橋『北海道炭確鉄道』"}, {"seq": 120, "page": 111, "img": "guidebook_pages/p120.webp", "t": "ためでした。れんがは最初東京から輸送していましたが、輸送費が高いため札幌の白石に工場を新設し、入船の陸橋と手宮の倉庫、次いで機関車庫(明治18(1885)年)をれんがで建設しました。現在、機関車庫はわが国最古のれんが造機関車庫として国指定重要文化財になっています。これらを指導したのはアメリカのレンセラーエにっ科大学(ニューヨーク州トロイ)に留学し開拓使のも技術者になった松本班一郎と平井晴ニ-郎です。2井晴二郎は留学で得た知識と手宮での建築の経験を発展させ北海道庁旧本庁舎(明治21(1888)年)を設計し、東京駅(大正3(1914)年)の新築では最高責任者の帝国鉄道庁総裁として総括しました。vずれの建物もれんがを用いた洋風建築として国の重要文化財に指定されています。、平井晴郎3.倉庫と商店の建築一木骨石造の導入(レンセラーエ科大学蔵)小樽には石造りの倉庫や商店、蔵が多くあり、歴史的な町並みの特徴となっています。石壁の構造は2種類に大別できます。1つは内部を木で組み外側に石を積んだもの(木骨石造)、2つは石だけで厚く積み重ねたものです。平成4(1992)年の小樽市全域の調査では、石造り388棟の内、木骨石造が345棟もやもやりました。木骨石造が圧倒的に多い理由は、石の産地が近隣にあり、木造の技術を使って工期が短縮でき、経費が安く、防火構造にできたからです。木骨石造の大規模な倉庫は小樽運河沿いに建ち並び、広海倉庫(明治22(1889)年)、右近倉庫(同27(1894)年)、小樽倉庫(同23て27(1890て1894)年)、大家倉庫(同24(1891)年)などであります。また、市街地の商店では、金子元三郎商店(明治20(1887)年)、岩永時計店(同29(1896)年)、早川支店(同38(1905)年)、名取高三朗商店(同39(1906)年)などが人急右近廊庫(明治27(1894わ年誠王)下広海あり、建物の正面脇に防火のための袖壁(うだつ)倉庫(明治22(1889)年竣工、撮影:安達治)を建てるものもあります。"}, {"seq": 121, "page": 112, "img": "guidebook_pages/p121.webp", "t": "かつて全国各地にも木骨石造の建物が建てられていましたが地震などの被害で減少し､現在､小樽が随一の棟数を誇り固有の街並みをつくっています。4．会社と銀行の建築－日本郵船と日本銀行の支店－日本郵船と日本銀行の小樽支店は、西洋建築の日本郵船(株)小樽支店の竣工写真手法を本格的に用いた明治期のわが国を代表する明治39(1906)年建物です。設計は西欧の建築を初めて工部大学校(『重要文化財旧日本郵船株式会社小樽支店保存修理工事報告書』/昭和62(1987)年）ぞうかさたちしちじろう造家学科で学んだ佐立七次郎(日本郵船小樽支店）たつのきんごと辰野金吾(日本銀行小樽支店、工事顧問)です。造家学科の第一期卒業生はわずか4人だけであり、柵《織繍それたつぞう2人のほかには曾禰達蔵(三井銀行小樽支店）と9かたやまとうくま片山東熊がいます。片山を除く3人の設計した建物が現在も残っているのは小樽と東京のみに限られていることから、小樽は明治期の本格的な洋風建築を肌で感じられる貴重なまちといえます。日本郵船の本屋は外壁を石で造り（石造)、2階の貴賓室と会議室を華やかなデザインのシャンデきんからかわがみリアや壁紙(金唐皮紙)で装飾しています。日本銀行は壁をれんがで造り､玄関ホール(客溜）と営業室の境に柱を使わない大空間が見所です。柱を取り除いたのは､小屋組に鉄骨(八幡製鉄所で製造)を使用したことで旧来の木造よりも軽量になったためです。明治期、日本銀行の主要な建物はれんがや石でさいぶ建てられていました｡本店が最初に建築され､西部(門司)支店、大阪支店、名古屋支店、京都出張所そして小樽支店、福島支店へと続きます。明治45(1912)年に完成した小樽支店の建築費は37万円を要し、本店と大阪支店に次ぐ3番目でした。日露戦争が終結し､南樺太へ現金を輸送する拠点となった時期と重なります。小樽支店の設計者は、辰野金吾(顧問)、長野宇平治(技師長)、|i'1田信一郎(嘱託)の3人で、長野が実質の設計を担当しました。…霧j写日本郵船(株)小樽支店貴賓室のシャンデリア築‐‐１町鍵一－雷悪一，咄荊咽Ⅳ言馳炉寸１１・熱一『・』・・ｒ一一｛‐一一・へ鴎一阜出日本銀行小樽支店の竣工写真明治45(1912)年（日本銀行）日本銀行小樽支店鉄骨小屋組Lエニダ"}, {"seq": 122, "page": 113, "img": "guidebook_pages/p122.webp", "t": "5．迎賓の建築一小樽区公会堂一小樽区公会堂(現・市公会堂)は、明治44(1911）年、皇太子行啓の「御旅館」として区民・藤lll要吉の寄付によって現在の市民会館の場所に建てられました｡建物の構成は大きく2つの棟からなり、平行に並んでいました。1つの棟は玄関のある｢本館｣、2つは座敷を連ねた「御殿」の建物です。「本館」は謁見に用いられ広間が中央の廊下を挟んで左右朴|称に配置され、「御殿｣は宿泊のために一の間、この間、三の間が連なり、中でも一の間は床の間、違い棚を備え、天井を一段高く上げて格子おりあごうを組み(折上げ格天井)、最上位の部屋としての格式を現しています。かとうち.むう‐ろ‐小樽区公会堂(明治44(1911)年竣工)の記念写真工事を請け負った大虎・加藤忠五郎(小樽､新潟県尼瀬出身)は､設計の指導を仰ぐため宮内省を訪たくみきご問し、内匠寮の技師・木子幸三郎に図面を書いて小樽区公会堂便殿御一ノ間もらい､厳冬の明治44(1911)年1月に工事を始め、7月に完成させました。小樽市は、昭和35(1960)年、公会堂を花園公園内の現在地に移築し、岡崎邸から移設の能舞台と組み合せました。これらは、北海道の近代を代表する和風建築となっています。一一金安6．寺社と教会の建築つこたん神社の建築は江戸時代に建てられた津古丹稲荷神社本殿(忍路、嘉永2（1849)年)と恵美須神社本木子幸三郎加藤忠五郎(『ある工匠家の記録』（加藤家蔵）殿(祝津、文久3（1863)年)があります。ともに鰊昭和63(1988)年）漁で栄えた海岸近くに建ち、大漁と安全を祈願する神社でした。津古丹稲荷神社本殿は小樽に現存する最古の建物であり、西川番屋の社殿として国道5号付近に建っていましたが道路拡幅のため忍路神社境内に移築されました。正面には細かな彫刻が施され江戸時代の栄華を伝えています。恵美須神社本殿は、正面の柱の間隔が1つで屋根が前いつけんしや面に延びた社殿の形式(一間社流れ造り）であり、津古丹稲荷神社本殿(嘉永2(1849)年）さやどう保護のため外壁を建物(鞘堂)で囲っています。"}, {"seq": 123, "page": 114, "img": "guidebook_pages/p123.webp", "t": "寺院建築では、龍徳寺本堂(真栄、明治9（1876）年)が現存する中で最も古く、緩やかに四方に広げいりもやた屋根は入母屋と呼ばれる伝統的な形式です。天上寺本堂(入船、同23(1890)年)は緑に囲まれた境内に建ち、その外観は長野の善光寺を模して建てたと伝えられます。大屋根の下にひさし状の屋根もこしからはふう（裳階)をつけ、玄関に唐破風(中央部がむくり、龍徳寺本堂(明治9(1876)年竣工）左右両端が反っている)の屋根をのせ堂々としています。小樽聖公会(東雲明治23(1890)年)は、正面の中心軸に切妻の3つの屋根(玄関・母屋・尖塔)が並び玄関脇の窓も左右相称に配され、小規模ながらシンメトリーな教会の形態を伝えています。軒のレース状の装飾はアメリカで流行したカーペンター・ゴシックの特徴といえます。3．大正期の建築小樽聖公会1．すまい一事業家の邸宅一(明治23(1890)年竣工）経済が活発化した大正期には事業家の高尚な趣味を生かした邸宅が建てられました。和光荘(潮見台、大正11(1922)年竣工)は、幾何学模様のアール・デコのデザインを基調にした酒造会社2代目社長の住宅です。当時、アール．デコはパリを中心に流行の兆しが見られるころでした。傾斜地を上手に使い、正面の階段をのぼると左手に応接室があり、奥に昭和天皇が宿泊された和室が続き､下階は半地下の食堂になっています。また､別棟の仏殿が渡り廊下でつながっています。一方、岡崎邸(入船、大正15(1926)年)は、中庭に能舞台が建てられた全国でも希少な住宅でした。当主岡崎謙は能舞台を建てるために大工の小杉米蔵(小樽、佐渡出身)を伴って各地を調べ、佐渡のじんだいすぎひのきもちのぶ神代杉や九州の檜を調達し、狩野派17代乗信を呼び寄せ鏡板の絵を描かせました。能舞台は小樽市へ寄贈され、公会堂の庭に移設されています。和光荘(大正11(1922)年竣工､撮影:安達治）IDや寺［,甲、ｌ科■■■日引Ｉｰ脚、旧岡崎邸能舞台(現小樽市能舞台､大正15(1926)年竣工）"}, {"seq": 124, "page": 115, "img": "guidebook_pages/p124.webp", "t": "2．銀行の建築、－大正10年代、金融関連の建物が色内大通と緑山手通の交差点に集中して建てられました。三菱銀行(大正11(1922)年)､北海道拓殖銀行(同12(1923）年)、第一銀行(同13(1924)年)の各支店が完成し、その構造はいずれも鉄筋コンクリート造でした。ちょうど鉄筋コンクリートがわが国の主要建築緑山の手通をはさみ左手側に銀行集会に採用されはじめた時期であり、小樽の銀行に最所(大正14(1925)年竣工､平成17(2005)年取壊)、三菱第一、日銀､右側に拓銀､郵便局、先端の建築技術が導入されたのです。設計は中央北海道銀行が並ぶ｡(撮影:安達治）の建築家や設計組織によるもので三菱銀行は清水組(現清水建設)、拓殖銀行は大蔵省営繕に属し後に国会議事堂の設計で技師長になった矢橋賢吉らであり、第一銀行は中村田辺建築事務所の田辺淳吉が担当しました。第一銀行の装飾は、曲線を生かすアール・ヌーヴォーの影響を受けてドイツ・オーストリアで興っ第一銀行小樽支店東立面復原図た芸術の革新運動(ゼツェッション)の様式が取り(製図:佐藤由美子･北海道職業能力開発大学校）入れられました。建築家田辺淳吉は、渡欧して感銘を受けた華やかな装飾を小樽で表現したのです。残念ながら出入口周りの彫刻や柱の装飾は取り除かれましたが内部の柱や梁に曲面や曲線の連続模様を見ることができます。3．商店の建築大正期、商店の外壁にコンクリートやモルタルを塗り、さらにタイルを張る防火建築が出現しま北海道拓殖銀行小樽支店『建築雑誌』大正13(1924)年した。明治期の小樽でさかんに用いられた石材にかわり、セメントが新たな建築材料として使われるようになったのです。木造の建物の外壁に細い鉄筋や金属の網を張付け、コンクリートやモルタルを塗り重ねる工法です。重い石材よりも建築作業が容易であり鉄筋コンクリート造よりも安価に建てられることから、しだいに住宅にも普及していきました。モルタル塚本商店は細かな装飾にも適していることから表情豊かな(大正9(1920)年竣工､撮影:志佐公道）外観が造られました｡塚本商店(色内､大正9(1920)"}, {"seq": 125, "page": 116, "img": "guidebook_pages/p125.webp", "t": "年)は土蔵造りのように見えますが外壁全体に厚いモルタルが塗られています。近藤硝子店(稲穂、大鳶鎚正初期)は正面に緩やかな3つのアーチを連続させ、軽やかさを表現しています。前堀商店(色内、大正8(1919)年頃)はモルタル下地にタイルを張った初期の商店建築であり、窓枠にはスチールサッシが司､Y用いられています。畷小樽運河埋め立て前の風景（撮影:安達治）4．運河と工場建築小樽運河の建設には10年の歳月をついやし、大正12(1923)年に完成しました。水路は沖に出島を築いて造り、全長1,324m、111540mありました。運河の目的は船荷を運搬するためであり、沖合の大型船と岸辺の倉庫を艀で結びました。せいかんこの運河の建設と同時に北海製罐倉庫(現北海製罐)の工場施設が出島に建設されました｡大正10(1921)北海製罐(株)工場(昭和6(1931)年竣工）鉄筋コンクリートによる近代工事建築の外観年から昭和10(1935)年にかけて事務所棟をはじめが運河の水辺に映っています。工場・倉庫の主要な建物が鉄筋コンクリート造で竣工しました。事務所(昭和10(1935)年)は横長の連続窓が特徴であり、近代建築のモダンな外観を表現しています。工場(昭和6（1931)年)の外観ははり柱と梁で建物の骨格を現し、そこにスチールの窓枠を納めた単純明快なデザインになっています。第三倉庫(大正12(1923)年)は、外壁にスパイラルシュート(渦巻状滑り台)をつけ、製品を一気に艀に積み込む工夫をしていました。北海製罐(株)第三倉庫(大正12(1923)年竣工）小樽運河の北側に建ち並ぶ工場施設は機能をデザインに組み込む近代建築の典型であり、今もなお運河の水辺に映えて良好な景観を形成しています。O&0\\1P0M北海製罐の一連の建物は､観光客で賑わう運河沿いに建つ(建物配置は1992年時）"}, {"seq": 126, "page": 117, "img": "guidebook_pages/p126.webp", "t": "1.すまい一建築家とデザインの洗練化一まちの繁栄にともない大正末から昭和初期にかけて建築家や請負人、建て主の設計になる洗練された住宅や店舗を兼ねたすまいが建てられました。坂氏(見晴町、昭和2(1927)年、平成19(2007)年FPP焼失)、坂邊邸(入船、昭和2(1927)年)と高田対(滞平成19(2007)征焼失撮影:安達治)岡、大正14(1925)年)の設計者である田上義也は、oe東京の帝国ホテルを設計したライト(HFrankLloydWright)に師事し、ライトの帰国後に来道してモダンなライト風の建築を数多くデザインしました。田上の設計した住宅の外観は変化に富み、軒は深S二外台は横板と漆喰を組み合わせ、窓の機割り(3結器納(SOっています。坂邊(昭和2(1927)年琴エ坂邸は北海道の炭鉱発見者の一人である坂市太郎の子息・敏男の別蘭として海を望む銭糸の高台に建てられました。屋根の色が赤、壁が淡いビンクだったことから「赤別曹」と呼ばれていました。水上歯科医院(住ノ江、昭和8(1933)年)は、玄関を正面中央に置きながら左手に円柱と塔屋を構えて非対称の美しさを表現しています。一方、岡川薬局(若松、昭和5(1930)年)の正面はドーマ窓を屋根の中央に配置し、左右対称の均一さを印象SRい]のー人宅カミ水上歯科医院づけています。いずれやゃ母屋の後方に住宅が続き。語和5(d933)征本撮影:運治併用住宅になっています。2.公共の建築一小樽駅舎と小樽市庁舎一昭和初期に小樽の公共建築はコンクリートで建てられました。これは地方都市として全国的に早い導入といえます。小樽駅(稲穂)は東京上野駅以北で最初のコンクリート造による近代駅として昭和9(1934)年12月25日に竣工しました。吹き抜けの中央のホールはL13昌給。前後の高窓から自然光を入れ、ガラスが張られんトー0)年表撮影)天井からはシャンデリアのように電灯で照らす明態欠"}, {"seq": 127, "page": 118, "img": "guidebook_pages/p127.webp", "t": "るい室内を設計していました。また、敷地の高低差を利用したプラットホームと地下道の設置は、ﾈ'l'戸や東京で造られた高架式駅舎の設計を応用し_=－－坐一r凸罰たものと考えられます。先端の素材と設備を用い鯨報ているのも特徴といえます。磁器タイルを外壁に一…張り、浄化装置を便所に設置し、エレベーターを荷の揚げ卸しに備えました。小樽駅舎(昭和9(1934)年12月25日竣工）小樽市庁舎(花園、昭和8（1933)年)は、市建築課長・成田幸一郎の設計になり、玄関ホール正面ほうおうの階段室には鳳凰と幾何学模様を組み合わせた美しいステンドグラスを入れ、重厚な中にも華やかさが盛り込まれています。外観は小樽駅舎と共通し、正面玄関をはさんで左右を相称にして中央を高め、中心性を強調しています。正面6本の柱の上(柱頭)には古代ギリシア建築に端を発する渦巻状の彫刻模様が施されています。当初の設計では中庭にテニスコートがあり、それを取り囲むよう小樽市庁舎(昭和8(1933)年竣工､撮影:志佐公道）に事務室と倉庫が配置され、余裕のある市庁舎のたたずまいが感じられます。ー判酔討一一生一3．銀行建築一三井銀行と安田銀行支店一小樽の経済活動が活発であった昭和初期、三井銀行(色内、昭和2（1927)年)と安田銀行(色内、同5(1930)年)の支店が新築しました。かこうがん三井銀行は外壁に花崗岩を積み、アーチを連続させ、軒を装飾するルネサンスのデザインで統一三井銀行小樽支店(昭和2(1927)年竣工､撮影:安達治）していますが、その構造には鉄骨鉄筋コンクリート造が採用されています。耐震に優れた鉄骨鉄筋そねちゆうじょうコンクリート構造を曾禰中條建築事務所が設計した理由は、大正12(1923)年に発生した関東大震災によって石造やれんが造の建築が甚大な被害をうけたためです。その後鉄骨鉄筋コンクリート構造は三井銀行名古屋支店(昭和11(1936)年）・大阪支店(同12(1937)年)でも採用され、わが国の高層建築における耐震構造の規範にも発展しました。安田銀行小樽支店安田銀行小樽支店は同行本店営繕課が設計し、(昭和5(1930)年竣工）"}, {"seq": 128, "page": 119, "img": "guidebook_pages/p128.webp", "t": "全国の支店と類似した外観になっています。その特徴は、中央に大きな柱を連続させて柱の間に縦長の窓を配し、両脇に壁を設ける形態です。平成ひきや13(2001)年、中央通り拡'隅工事のため曳家で移築し、所有者の理解で次代へ引き継がれる鉄筋コンクリートの建物になりました。龍宮閣とオタモイ海岸/昭和9(1934)年4．娯楽の建築一龍宮閻－竣工､同27(1952)年焼失まちが活発になり、夢のような計画を実行する（小樽市総合博物館蔵）人物が現れました。蛇の目寿司の加藤秋太郎は、オタモイ海岸の断崖絶壁に龍宮閻を建て、遊園地をつくり､娯楽と憩いの場を市民に提供しました。かけづく龍宮閣は清水寺のように崖地に建つ懸造りにして海へせり出し、絶景を楽しむ料亭でした。現地を調査した結果平地の'隅はわずか4m、水而からの高さは約33mありました。建築工事は昭和8龍宮閣外観図(1933)年春から始まり同9（1934)年夏に完成しま(製図:平松久留美･北海道職業能力開発大学校）した。夢を実現した加藤秋太郎の龍宮閣ですが同27(1952)年5月9FIに出火し、15mの海風にあおられ5時30分に焼失してしまいました。現在、跡地に基礎が残っています。5．建物の再利用一鰊漁家とまちの現況一小樽の歴史的建造物は移築や改築によって飲食店や硝子・オルゴールの店、ホテル、新聞社、住宅などさまざまな用途に転用されています。その 寿司があります。醗酵させた酢を使うことで保存性をもたせる技術です。これが原型となって寿司が誕生しました。寿司には、l對酉g押し寿司、江戸の江戸前寿司の2つの起源があるといわれていオ硝ル子ます。キlllし寿司は酢の特徴を生かした料理であるのに対して、江戸前寿司は、同じ酢めしでも延頁の前浜で.とれた新鮮なネタに特徴があります。ル司小樽で寿司の人気が高いのは、小樽の前浜でとれた新鮮な魚貝類が豊富なことにあるといえそうです。2．小樽の寿司寿司は小樽でも明治時代からありましたが、今のような寿司専門店は少なく、和食あり、洋食あり、鰻もだせば、寿司も出すといった料理屋が大半でした。大正初期には会津屋・加賀屋・福井屋といった店の広告に、「寿司・御料理」がみられ、寿司店には都寿司や江戸シ子という店がありました。家庭では「押し寿司」をつくっていた記録も残っています。"}, {"seq": 132, "page": 123, "img": "guidebook_pages/p132.webp", "t": "寿司は当時も御馳走の一つで、来客や祝い事などがあると、家族総出で食べにいく光景がみられました。3．小樽寿司屋通りll召和62(1987)年寿司店有司こよよるる、、鰊をはじめとした「魚供養祭」が始まり、これを核に「小樽小樽寿司屋通り寿司屋通り会」が誕生、今口の｢小樽寿司屋通り」に発展しました｡中心になっているのは五店会(政寿司・まちの．日本橋・大和家・しかま)、同62(1987)年当'1寺、寿司屋通りにはこの5店舗しかありませんでしたが、現在では約20店舗が営業しています。小樽市内全体では100店舗以上の寿司屋が腕を競っています。’3．小樽のオルゴール1．オルゴールの歴史1796年スイスのジュネーブの時計職人アントワーヌ・ファーヴルによってシリンダー型のオルゴールが誕生しました。ディスク型のオルゴールは、1886年にドイツでポール・ロッホマンによって完成され、1889年ポール・ロッホマンのシンフォニオン社は、ディスクオルゴールの本格的な工場となり、商業的に大きな発展をみました。オルゴールは、210年の歴史の中で、各国でさまざまに作られていきます。王侯貴族の愛玩用に、ホテルやレストランで、駅の待合室で、そして家庭の中で、赤ちやんを育て、たくさんの思い出をつくってきました。こうして200年前に音楽の缶詰として生まれたオルゴールは時代に受け入れられ、オ硝ル子誕生の100年後全盛時代を迎えることになりました。ゴ・ル司2．日本での歴史じめいきんオルゴールの語源はオランダ語のオルゲル(0rgel)です。日本では「自鳴琴」といわれていました。嘉永5（1852)年見世物として江戸の深川LI'町で披露され、文久年間(1861～1864)には時計師小林伝四郎が日本の曲譜に合わせたオルゴールを製造したという記録があります。3．小樽とオルゴールオルゴールの音色がレトロな町並みに最も似合うという感じた人々(小樽オルゴール堂．海鳴楼など）が、小樽にオルゴール市場を形成してきました。"}, {"seq": 133, "page": 124, "img": "guidebook_pages/p133.webp", "t": "オ硝ル子ヨ切ル司硝子・寿司と並び称されるまでになったオルゴールは、今でもさらなる進化に向けて歩みを続けて4.小樽の硝子1.硝子の歴史硝子はエジプトやメソポタミアなどの古代文明に起源をもっています。初期には宝石や貴金属に“近いものとして支配者階級の愛好品でした。これ2が採光用(窓)として普及するのは14世紀以降です。日本では、天正3(1575)年オランダ人技師こよって、長崎で製造が始められました。明治6(1873)年東京府北品川宿(現・東京都品川区北品川)に民営の品川興業社硝子製造所が開設され、同9(1876)年工部省がこの製造所を買い上げ官営になりまし7佑919世紀末には都市化にともない採光用の板硝子寺PSが普及し、板硝子と硝子器は分化していきました。2.小樽と硝子田硝子製造明治34(1901)年設立された浅原硝子は、北海道の硝子器製造業の草分けといわれ、現在唯一の漁業用浮玉工場として、また「小樽雪あかりの路」の運河にちりばめられた浮玉製造で有名です。浅原硝子は、博多で生まれた浅原久吉が博多や大阪で腕を磨き、小樽の富岡町で仁を開いたのがはじまりです。画硝子販売昭和9(1934)年浅原硝子は現在の天神に移転します。淫原久吉は製造と販売を分離し、久吉亡き後、製造は2代目久吉、販売は第久重が継承します。この販売会社が今の北一硝子です。昭和40年代小樽のレトロブームの火つけ役となったのは、稲穂町で馬そりにランプをディスプレーしていた北一硝子でした。昭和58(1983)年北一硝子は堺町の木村倉庫を譲り受け、北一供子三号館を開設、多くの人ん々に小樺の硝子の魅力を見せつけ、小樽観光の率引役を果たしてきました。ィ7グクダ"}, {"seq": 134, "page": 125, "img": "guidebook_pages/p134.webp", "t": "■スタジオ(工房）・グラス硝子を素材としたスタジオ・グラスが立体造形のアートとして認められたのは、1960年代のアメリカでした。ヨーロッパの伝統から発し、アメリカで起きたスタジオ・グラス・ムーブメントは世界に波及し、昭和47(1972)年「日本ガラスエ芸協会」が発足し小樽オルゴール堂ます。同49(1974)年本邦初の「日本のガラス展」あさはらちよじに出IIIIIIして注目を浴びたのが浅原千代治です。千代治は同54(1979)年に小樽に｢グラス・スタジオ・イン・オタル」を設立しています。参考文献｢スイスオルゴール・リュージュ社」http://www.musicbox.co.jp/index・html｢小樽国際ガラスエ芸フエステイバル図録」小樽国際ガラスエ芸フエステイバル実行委員会平成2(1990)年北一硝子三号館店内『風の軌跡』土屋良雄『浅原千代治ガラスエ芸』日本放送出版協会F．F‐舎凸一農悪いe巳オルゴール●硝子・寿司小樽雪あかりの路に使用される浮き玉ジャパンブランドの作品"}, {"seq": 135, "page": 126, "img": "guidebook_pages/p135.webp", "t": ""}, {"seq": 136, "page": 127, "img": "guidebook_pages/p136.webp", "t": "多くの画家を墓出した小樽の風土を知る小樽画壇の立役者たち半路画会久小模派と呼ばれた画家三浦鮮治門下の小樽の風景斎藤清・河野薫"}, {"seq": 137, "page": 128, "img": "guidebook_pages/p137.webp", "t": "1．小樽美術の夜明け一羊蹄画会■小樽美術の夜明け小樽は札幌とともに黎明期の北海道美術界で重要な美術運動がおこりました。明治期の美術団体ようていかかい「羊蹄画会」は、明治40(1907)年夏休みで帰省していた東京美術学校(現東京芸術大学)在学中の、はせがわのぼる二でらけんきち<と．うさぶろ農羊蹄画会自由研究所新年会記念写真長谷川昇、小寺健吉、工藤三郎の3人によって設明治43(1910)年､前列左端長谷川昇､中央小くるゆりかい寺健吉､右端工藤三郎､右から2人目平澤大立されました。これは北大黒百合会が有島武郎の璋､後列右から3人目が木田金次郎とみられる。発案で札l幌に誕生したのとほぼ同時期であり、北､■■■酪i一､一宮■■海道ではもっとも早い洋画の展覧会であったことになります。羊蹄1II1i会は、小樽における洋画の出発点となりましたが、中央ではすでに文展が開催され、洋nl'iの普及はすすんでいました。しかし、北海道の美術活動の本格的な動きはまだ始まったばかりでした。第1回羊蹄画会は、当時小樽区東雲町の高台にあった小樽倶楽部の日本間で開かれ、北海道の洋画の普及と定着に大きく貢献しました。なかでみうらせんじも、のちに小樽画壇の中心となった三浦鮮治は、毎日その展覧会を見に行って、画家志望を|古|めたというほど強い印象を受けています。羊蹄画会は明治41･42(1908･09)年と引き続き展覧会を開き、メンバーが次第に増え､その後研究所も設立され、当時の記念写真が残されています。その後、創立の3人はヨーロッパ留学へと旅立ち、羊蹄仙i会は消滅します。工藤三郎ただひとり留学後小樽に戻り、画家志望の若者が彼のもとに集まりました。その後の小樽画壇は、羊蹄画会に刺激をうけて、工藤三郎に指導を受けた三浦鮮治らによって牽引されていきました。ｌ一椒囎”綱魁，咀酎駕番ご鐸卿一句堀凸豆、鐸ｉ含審ワ」．．第3回小樽洋画研究所展/大正9(1920）年（小樽倶楽部）前列右から三浦鮮治､石橋幸悦郎､2列目右から兼平英示､山本誠､谷吉二郎､平田豊策､3列目右から大月源二､桝田誠一､安保豊三郎､竹部武一・長谷川昇「肩の子猫」昭和2(1927)年頃／油彩･キャンバス明治19～昭和53(1886～1973)年●美小寺健吉｢モレーの洗濯場」昭和41(1966)年油彩･キャンバス明治20～昭和52(1887～1977)年"}, {"seq": 138, "page": 129, "img": "guidebook_pages/p138.webp", "t": "2.三浦鮮治・兼平英示兄弟の活鹿羊路画会の消滅後、その展覧会に感銘を受けて画家を志した青年たちがいました。大正・昭和初期の小樽は、三浦鮮治とその実弟兼平英示が中心となって、活発な美術運動を展開します。大正4(1915)年三浦は上京して日本美術院洋画部研究所に学びますが、家庭の事情で1年で帰郷し、その者PE後は小樽に密着した活動を始めています。同6(1917)年に自らのアトリエを解放して「小樽洋画研究所」には中村療策ら多くの若い画学生が学び、三8のたののちにプロレタリア美術運動に加わる大月源二も展覧会出品者として名を列れねNeおまが。小樽美術の草創期はそのまま北海道画壇の基礎ができあがる頃と重なり、札幌と小樽の画家が合流して、美術グループの広域化と団結の気運を盛り上げていきました。三浦・兼平見弟はその要として活躍していきます。2人の画風は見第でありながら、渋い色彩を効かせ閣達で洗練された描法の三浦と、骨太なタッチで立体的に表現しようとする幸平とで、対照をなしていました。のちに日本を代表する風景画家となった中村善策を加えた3人の先輩画家たちが、小樽美術を育てていった研究所の主要メンバーたちは道内の他の地域に先駆けて大正13(1924)年公募展「太地社」を設立します。そのことが、札幌はもちろん、函館の赤光会、旭川のスタックカムシュッペ男会など北海道各地で行われていた各グループをまとめる原動力となっていきました。やがて北海道全域にわた-夫る公募展を設立しようという大きな意識が芽生え太地社の融ます。落平や小樽新聞社の漫画家であった立避人の春走があって、「道展」が同14(1925)年記念すべ吉二郎、兼平英示、中村善策、桶口忠次郎き第1回展を開催しますが、そこには創立会員と/グの"}, {"seq": 139, "page": 130, "img": "guidebook_pages/p139.webp", "t": "して小樽の画家たちの名前が多数含まれています。ふでやとうかんまた特別会員として、筆谷等観、長谷川昇、小寺ひらさわたいしよう健吉、工藤三郎、平澤大障、山崎省三ら、すでに中央で実績を持つ小樽ゆかりの画家たちが名を列ねています。道展が着々と基盤を'11｢|め、北海道全域をまとめる唯一の公募団体に成長することによって、太地社はそれまでの役割を終え、幕をおろしました。酬哺ごＦＨ』呼悪》《一宮ゞ←一一一一吋一商｝一色．』１一湾一■「１戸１‐１劃７鞭‐一一《三深》シ‐薑拳、」坐。昨可ｑ戸一ご一》一三浦鮮治「岩影｣昭和29(1954)年/油彩･ｷｬﾝﾊｽ明治28～昭和51(1895～1976)年3．裸童社の画家たち太地社以後三浦は再びアトリエを開放し､第二口一らどうしや1肇一の洋画研究所「裸童社」を設立します。昭和はじめの小樽は経済的にも繁栄した活発な気運のなかしぷやまさおにあり､三浦､兼平､渋谷政雄など海岸近くに居住するグループ､小樽高等商業学校(現小樽商科大学)やさまざまな学校の分布する文教地区に住む工藤三ひぐちちゅうじろうたけべたけいち郎､樋口忠次郎､竹部武一ら､またその中間地点の稲穂花園、量徳などに住む新進気鋭の画家たち、くにまつのぼるこたけよしおとがしまさおわたなべゆういらろう国松登、小竹義夫、富樫正雄、渡辺祐一郎、かねまるなおえかねこせし、じ金丸直衛、金子誠治らがグループとなり、互いに競い合う環境となっていました。「裸童社」の設立は、三浦鮮治が花園にあった研究所を閉めて、入船に新しくアトリエを新築した昭和3(1928)年に始まります。ここには熱心にすえたけ絵を学びたいと願う若者たち､国松登､末武(加藤）きよえこじままさきちすだみよじ清江、小竹義夫、小島真佐吉、須田三代治らが毎日のように通い、夜遅くまでデッサンを続けました｡会の名称を決めるとき、「われわれはまだ未熟で裸童にも等しい」という意味と、研究所におかれていたデッサン用のキューピット像にあやかってメンバーが「裸童社」と名付けました。裸童社は夜間だけ開かれ、デッサンや自由研究を重ね、月例会として互評が行われていました。当||寺電気館通りと呼ばれていた都通りには、国松登が経営する喫茶店「夢」があり、ここはそうした若い両ロゴ兼平英示「少女像｣昭和15(1940)年/油彩･ｷｬﾝﾊｽ明治31～昭和21(1898～1946)年術国松登「白馬」昭和10(1935)年/油彩･キャンバス明治40～平成6(1907～1994)年"}, {"seq": 140, "page": 131, "img": "guidebook_pages/p140.webp", "t": "家だたちのコミュニケーションの場となって、芸術論に花を咲かせる日々が繰り広げられていました。「夢」の2階が一時裸曹社の研究所として利用されていた時期もあります。裸童社は、次代を担う画家を輩出したグループとして、優れた先達と若手画家を結び付ける役割を果たしました。兼平英ホは病に倒れ昭和21(1946)年世を去りますが、三浦は戦後も絵筆を握り続け、多くの後進を育成した功績を評価され、北海道文化賞、勲五等瑞宝章を受けています。いつしか小樽の画家たちは「小樽派」の呼称で親しまれるようになりました。そこに独自の主義主張があったとは思われませんが、三浦鮮治門下の多くが描いた小樽の風土を巧みにとらえた港の展望風景、またその後を受けた中村善策の複雑な地形を活かした構図の作り方、現場制作の風景などを総称してそのように呼んだようです。4.中村善策と一水会の系譜中村善策は、のびやかな構成と明るい人色調で、北海道の自然をモチーフに多くの秀作を生み出しています。大正来に上京したため、昭和3(1928)年に結婚して一時小樽に戻った以外は、東京の上落合にアトリエを持って活躍していました。題材を求め毎年のように帰郷し、地元の後募たちと交流するなかで、その現場主義を伝えています。小樽では夏のほぼ1ヶ月、南小樽駅前の魚松旅館に滞在し制作していました。写生地は、花園公園、小樽運河、張確、朝里海岸、奥沢水源地、祝津、塩谷などが主な場所で、熟知した対象を繰り返し描いています。数十回も同じ現場を訪れるという執益さは、その風景を巧みに消化するというだけでなく、構図を練り上げ、色彩を交かせて風景まるごどとの生命をとらえようとしたからです。その土地の地形や生活習慣をよく知るほど、生きた中村善策「けむり」昭和12(1937)年/油彩/キャンバパス明治34ご昭和58(1901こ1983)年中村善策「海港の秋」昭和34(1959)年/油彩・キャンバス"}, {"seq": 141, "page": 132, "img": "guidebook_pages/p141.webp", "t": "構図を作りやすいと語っていました。描き出された風景は、現場の忠実な再現に留まっていません。中村は徹底的に風景を観察します。そのうえで理想の画面構成を得るために、必要なだけ変形し強調し、あるいは省略されていることが、制作現場に立ってみて納得させられます。小樽をこよなく愛していた巾村は、生前から小樽市に作品を寄贈し、かつては市民会館で公開されていましたが、市立小樽美術館が開館した昭和54(1979)年に作品が移管され、さらに没後ご子息からの多くの寄贈があり、美術節の11階に中村善策記念ホールが併設されました。いつすいかい中村善策の画業は－水会を中心に展開しています。そのため北海道でも中村を尊敬する若手画家たちは、この展覧会をめざす者が多くなりました。風景画の題材にいし一j刀､つれお恵まれた小樽は、小竹義夫、金丸直衛、石塚常男など多くの風景画家を輩出し、彼らは中村にあこがれ－水会へ出品を続けました。おがわきよしとみさわけん現在活躍する在住画家では、小川清、冨澤謙がいます。彼らは中村善策を頂点とする風景画家の系譜に属し、その写実の精神を直接継承した最後の画家たちといえます。小川清は、小樽にじっくりと腰を据えて、古びた路地と新しい町並みの共存をはかる小樽の新旧を情感豊かに描いています。冨澤謙は、中村の小樽での写生地を丹念に追跡調査し、その創作の原点をひもといています。中村の現場主義を小樽を題材に受けつぐと同ll寺に、近年は旅にlllて風景のモチーフを選ぶという姿勢で制作に取り組んでいます。5．小樽創作版画のひとびとさいとうきよし戦前、小樽には重要な版画家が2人かかわっていました。ひとりは斎藤清、もうむなかたしこうひとりは棟方志功で、lll界的に著名な版画界の巨匠です。ともに東北出身で、その作品が認められたのは海外の国際展からで、戦後の版画ブームの火付け役となりました。斎藤には洗練されたモダンな感覚があり、棟方には原始的な心象性があります。その芸術は鮮やかな対照をなしていますが、この2人の若い頃の接点が実は小樽にありました。なり↑-きI′1上ん棟方志功の来榑のきっかけをつくったのは、成田玉泉という図画教師でした。成田によって、棟方志功が小樽に招かれ、斎藤清が美術家としてのスタートを切り、かわのかおる河野薫や金子誠治が木版の道に進むことになったのです。成lll玉泉(本名成田正実)は､緑小学校と小樽市中学校で図画教師として指導にあたっており、棟方志功とは|両l郷の友人でした｡昭和4(1929)年小樽駅に到着した棟方を、成田と当時彼のもとで絵を習っていた斎藤清が出迎えています。成田は小樽市中学校へ棟方を案内しそこで講演会を開催し､学生たちとも語り合い､ともに小樽公園へ写生にでかけています。その学生のなかに金子誠治がいました。成|Ⅱは棟方志功の力強い多色刷木版を見せ､下絵の描き方､画材の選び方までを熱心に指導しました。"}, {"seq": 142, "page": 133, "img": "guidebook_pages/p142.webp", "t": "昭和5(1930)年の道展には\"小樽棟方志功」として出品の記録があり、作品搬入の手伝いをしたのが金子誠治でした。斎藤清は福島県出身ですが、4歳のときに一家で夕張に移住して、14歳から24歳で上京するまでの10年間を小樽で過ごしたため、小樽もゆかりの故郷といってよいでしょう。タ張で母を失い、小樽の薬局にひとり奉公に出され、薬局からガス会社の見習い職工、看板店の修業など、斎藤の生涯でやもっとゃ苦労した時代をすごしました。。、有板の修業先は、水彩固家として後に知られる宮崎信吉(小樽水彩画会創立者)の店、花園町の広告研究社でした。やがて独立して住之江1丁目に「看板のすずらん」を開店し、室内装飾などもてがけ多角的な経営を行ったようです。看板を描いているうちに絵の勉強の必要性にも人迫られ、知り合いの紹介で、緑小学校の教師をしていた成田玉泉に出会い、はじめて石誰デッサンと油絵の手ほどきを受けたのです。6.河野薫と金子誠治さらに成田の教え子には、河野薫と金子誠治がいます。河野薫は大正5(1916)年小樽に生まれ、緑小学校在学中に成田から棟方志功を紹介され、同時に小樽にいた斎藤清と知り合います。庁立小樽中学校(現小樽潮陵高校)卒業後上京し、図案制作や装丁の職に就きながら、日本版画協会展に出品しました。しかし、戦争のために制作が中断され、敗戦と同時にシベリアに4年間抑留されてしまいます。シベリアから帰還して一時、清見台中学校の美術教師として勤務しています。やがて再度東京に出、斎藤の後押しもあって海外で高い評価を受け、膨大な版画作品が求められるようになりました。河野の特徴は人物、特にシベリア抽留のために長期間会うことができなかった娘をモデルにした独特の「少女像」にもっとゃ田玉泉明治35<昭和55(19021980)年金子誠治「観劇の人々」了RTB606紙大正3~平成6(1914~こ1994)年河野薫「蝶BUTTERFLIES」大5~昭和40(1916<1965)年昭和36(1961)年/版紙"}, {"seq": 143, "page": 134, "img": "guidebook_pages/p143.webp", "t": "準信個性が出ています。金子誠治は北海道草創期の木版画のパイオニアのひとりです。金子は大正31914)年砂川生まれで、効少の頃小樽に移住しています。恩師である成田玉泉が棟方のすすめで上京したために、今度は金子自身が成田の後を受けて、緑小学校の教員として図画工作の指導にあたり、そのかたわら木版の制作にあたります。子供の頃から持病をともなっていたこともあり、選者に対する温かいヒューマンな心がベースにあります。それは風刺を込めて社会を批判するという形式をとらず、むしろ日常感じられる幸せや美に目を向けた温かい作品となっています。7.一原有人徳の世界小樽市で生涯を過ごし国際的にも高い評価を受けた版画家、一原有徳は、少年期に小樽に移住し、小樽地方貯金局(建物は現在の市立小樽美術館)に勤務しながら、版画制作をはじめました。パレットに偶発的に残った絵の具を刷り取ることによっ_て生み出さきれたモノタイプ(一点刷)を発表し、一躍注目を浴びました。その作品は冷たい金属の削りくずや、宇宙空間などさまざまなイメージを喚起し、アンフォルメル旋風が起こっていた1960年代の美術界できわめて印象的な存在どなりました。独特の手法によるモノタイプ版画は美術評論家ひじかたていいち土方定一に認められ、一虫日本を代表する版画家の1人に加わりました。登山家としても知られ、作品の奥深くにその境地が反映されています。参考又責『北海道美術史』今田拘一著北海道立美術館友の会昭和45征『北海道美術の青春期』図録市立小樽美術館平成11年『析童社の頃』須田三代治21ACT札幌時計台ギャラリー昭和51年「小樽版画史・草創期の人々」金子誠治『市立小樽美術館報』第9号平成6年明治43(1910)年ご平成23(2011)年昭和35(1960)年昭和55(80)年/ステンレス版モノタイプ"}, {"seq": 144, "page": 135, "img": "guidebook_pages/p144.webp", "t": "小模の文学と観光資源多明木らが残したもの小樽の詩歌足跡をたどる観光小林多喜二と伊藤整知的な小樺散策文学秦真提供:市立小樽文学館"}, {"seq": 145, "page": 136, "img": "guidebook_pages/p145.webp", "t": "性油1.小樽の誇歌画石川叶木石川明木は明治371903)年小樽中央駅駅長の中庄=郎に嫁いでいた姉を訪ねます。このときの滞在はわずかでしたが、翌年の明治38(1905)年、19歳で初めての詩集『あこがれ』を出版し、一虫天才詩人として有名になります。明木はその後、郷里(岩手)を離れ、北海道に渡り、明治40(1907)年、創立したばかりの小樽日報人C他じじ、記者としで活躍じます。なお、とのころの同僚(に、童話\"赤い靴」や、流行歌「船頭小唄」で知られる野口雨惜がいました。小樽日報社は小さな新聞社でしたが、叶木の入社で紙面がいきいきとした、といわれています。新聞社は今の静屋通り、本間内科付近にありました。けれども小樽での記者生活は長く続かず、社の方針などに不満をもちだした唆木は、12月に事務長とけんかをして小樽日報社を辞めてしまいます。けれどもゃ釧路新聞社に入社が決まり、1月19日、小樽に家族を残して単身赴任することになります。こうらして石川叶木の4か月足らずの小樽時代は終わりましたが、明治43(1910)年出版され、現代まで多くの人に愛読されている石川木歌集『一握の砂』には、小樽時代を回想して歌った短歌が20数首入っています。かなしきは小樽の町よ/歌ふことなき人人のンプ声の荒さよ木画並木凡平並木凡平は明治24(1891)年札幌生まれ。大正9(1920)年小樽新聞記者となります。昭和21927)年、雑誌『新短歌時代』を創刊。同5(1930)年より小樽新聞紙上に口語短歌、つまり、普段の生活で読み書きするようなやさしい言業で作る短歌の欄をつくり、大勢の投稿作品をの石川味木(市立小樽文学館蔵)並木凡平(市立小樽文学館蔵)"}, {"seq": 146, "page": 137, "img": "guidebook_pages/p146.webp", "t": "せます。凡平は、「生活即短歌｣をモットーに口語短歌の普及につとめました。晩年になって突然新聞社を追われ、ガラスコップに自分の短歌を刻んで行商をするなど苦労しましたが、室蘭の新聞社に招かれて、住みなれた小樽を去りました。それから間もなく、昭和16(1941)年小さなケガがもとで、室蘭で亡くなりました。あの丘に青いペンキの家たてて住んでみたいと思ふ秋晴れ凡平ころはち■田中五呂八田中五呂八は|ﾘ1治28(1895)年釧路生まれ。江戸時代以来の川柳を、芸術性の高い文芸に改革しようと、新興川柳をll昌え、「川柳は詩なり」と宣言しひょうげんました。大正12(1923)年、川柳誌『氷原』を創刊。同14(1925)年には『新興川柳詩集』を刊行しました。翌15(1926)年、小樽新聞社に入社。理論派でもあった五呂八は、昭和3（1928)年『新興川柳論」を刊行しています。神が書き閉づる最後の一頁五呂八りよくき,ちうぎんしや■小樽高商俳句会緑丘吟社大正6（1917)年、小樽高等商業学校(小樽高商）田中五呂八（市立小樽文学館蔵）じぞうそんひ1年に在学中だった松原地蔵尊がII平びかけて、比らぼせつこなめいじん良暮雪、職員の小納迷人らが参加し、小樽高商俳句会緑丘吟社が結成されました。同8（1919)年、日本に近代俳句を確立し、俳句雑誌『ホトトギス」きよしとしおを作った高浜虚子の長男、年尾が小樽高商に入学し、緑丘吟社に参加。同8（1919)年と翌9(1920)年、年尾の父、高浜虚子の小樽来訪は青年たちを感激させました。"}, {"seq": 147, "page": 138, "img": "guidebook_pages/p147.webp", "t": "’2．小樽の小説小林多喜二と伊藤整たきじせい高浜年尾の小樽高商時代、小林多喜二、伊藤整も、この学校に在学していました。明治44(1911)年、日本で5番目の国立高等商業学校として開校した小樽高等商業学校は、高浜年尾、小林多喜二、伊藤整らが在学した大正10年代、当時の自由主義的な風潮のなかで若手の優秀な教授をそろえ、清新で盛り上がるような雰囲気に満ちていたといいます。ここで小林多喜二は社会科学に関心を深め、伊藤整は英語の力を高めていきました。たきじ■小林多喜二小林多喜二は明治36(1903)年秋田県生まれ。石川啄木が小樽にいた同40(1907)年末､4歳で家族で移住します。小樽でパンエ場を経営し成功していた伯父の援助で学校に通い、小樽高商を卒業後北海道拓殖銀行小樽支店に勤めます。このころからマルクス主義を本格的に勉強し、いわゆるプロレタリア文学作品を書き始めます。その第1作目「一九二八年三月十五日」は、日本で初めて行われた普通選挙直後左翼活動家に行われた弾圧を生々しく描いた作品で、小林多喜二の名前を一躍小林多喜二（市立小樽文学館蔵）有名にしました。その後続けて、「蟹工船」ll召和4(1929)年、「不在地主」（|司)などの傑作を発表し、外国からも
