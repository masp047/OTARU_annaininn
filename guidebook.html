いのです。ぐ秋9月一10月9月になると朝晩は涼しくなります。しかし近年は温暖化の現象か暑い日が続く年もあります。10月中旬になると紅葉がはじまります。市内では朝里峠や毛無幅の紅葉が絶景ですが、小樽公園やなえば公園も見事です。近郊ではニセコを積丹方面も美しい紅葉で有名です。また10月下旬には初雪の季節となります。毛無山や天狗山の頂上が白くなると、いよいよ冬の到来です。ぐく冬>11月~3月例年、11月の下旬から12月上旬には根雪となります。年内は比較的積雪は少なめですが1月、2月はドカ委となり、吹雪の日も多くなります。小樽は古い建物が多いため、雪の重みから建物を守るため、屋根の雪降ろしを行います。天気の良い日曜日などは、あちこちで一斉に屋根の雪降ろし7ダグの毛無山展望所EAA6el60填8"}, {"seq": 157, "page": 147, "img": "guidebook_pages/p157.webp", "t": "が行われます。冬の風物詩のひひとつです。3月、彼岸の頃から因解けがはじまります。2.小樽の風物誇あれこればふんかぜ@春ぐ馬糞風>中年以上の人には懐かしい言葉です。今ではも2うありませんが、春は馬糞風の季人節でした。馬車が市内を走っていた時代、冬の間、路上に積もっていた馬開が、雪解けの後、乾燥し風に乗って匂いとともにだ運ばれてくるのです。昭和30年代後半には死語になりました。その後に出てきたのが車粉出です。自動車のスパイクタイヤが全盛の頃、雪解けの春には町がかすむほど粉塵が舞っていました。しかし、スパイクタイヤが全面禁止になってからはことのことばも消えました。環境にやさし(OSUESI(人@夏く高島おばけ>「高島おばけ」とは、弘化3(846)年に伊勢(現三重県松阪市)出身の北方探検索・松浦武四郎が小樽沖を航行中に見た展気析です。松浦武四郎がまとめた『三航昌夷日誌』や『西戦夷日誌』に記述されています。当時の高島では震気楼を「高島おばぱばけ」と呼んでいました。これはめずらしい現象である上位翌気楼で、石狩湾の広い範囲で、春から臭にかけて年に10回程度発生することがあります。4て7月の暖かい日に発生する可能性が高く、その中でもゃ大規模な翌気楼は、5月中旬から6月中旬にかけて発生する可能性がありますが、予測することは難しい状況です。上位翌気楼の発生は時間的には午前よりも午後の方が確率は高く、晴れている日で、風があまりなく遠くの山々にかすみがかかっていて、海面近いところにより白濁したモヤが発生した場合に観測される傾向が強いよりIGす。吹雪の小樽石狩湾新港のタンク群(超望遠撮影)。上:居気楼によってタンクが天きく上に伸び上がって見えた(平成20(2008)年5月3日)下:通常の状態7プイZ"}, {"seq": 158, "page": 148, "img": "guidebook_pages/p158.webp", "t": "IINSたII)翌気楼が発生する頻度としては、肉眼でも比較的容易に見えるような大規模なものは1シーズン1回程度です。観測場所としては、旧高島トンネルの南側や高島港周辺の海岸、小樽港の南北防波堤、朝里の海岸や銭画の海岸など、対岸を見渡すことができる場所が居気楼を見るにも適しているようです。候秋ぐ手宮公園の栗ひろい>中央バス手宮ターミナルから徒歩15分、小樽市街の北にある高台の公園を手宮公園といいます。この公園は春は桜の名所として、秋は栗の自然林(月82S園KG2す。特に栗林は推定樹齢100こ170年以上、古木からの実生自然繁殖と考えられる貴重な自然林で、北限とも言われ北海道の美林に指定されています。幼稚園や小学校の遠足の定番コースとして親しまれ、子供たちがこの公園で票ひろいをはじめると小樽も秋本番となります。手宮公園からは小樽港と、小樽の街が見渡せ、公園の下には大代の人々が岩面に描いた陰刻画で知られる手宮洞窟もあり、ロマンがあふれる場所@冬く錬漬け>北海道の冬の風物誇のひとつに人魚漬けがあります。身欠錬、大根、キャベツ、にんじん、生姜などを麹を混ぜて漬け込みます。昔は、小樽でもあちこちで雪が積もる前の11月下旬ころから木の構に漬け込みました。家庭ごとに大根の切り方や味に違いがあり、おすそ分けをしあう季節で、井戸端会議も盛り上がったそうです。正月にはなくてはならない漬物で、シャリシャリと凍った人錬漬けは、今では懐かしい一品です。現在は住宅の気密性がよくなり、寒い部屋などがなくなったので漬物を漬けない家庭が増えたのは残念です。『わたしたちの小樽』小樽市教育委員会平成16年2002年市勢要覧』小樽市平成14年『おたるの自然』小樽市教育委員会平成11年「ACC札幌もうっひとつのホームページ」http://diary.jp.a0|.cOWjhtKjtW/78.htW|「小樽市総合博物館」Itt0://WW.GIU.0taU.I9.)WSI/6ls6hU/W59MWWII89/「小樽市http://www.city.otaru.|g.jp/"}, {"seq": 159, "page": 149, "img": "guidebook_pages/p159.webp", "t": "1.位置・面積位置は、北緯43度11分27秒、東経140度59分40秒。面積は243.14平方km、東西36.47km、南北20.39km、海岸線は68.62kmに及びます(平成17年現在)。市制が施行された大正11(1922)年の小樽の面積は56.754平方kmでした。その後、高島町、朝里村、塩谷村との合併や埋め立てなどで現在の面積となりました。2.地形の特徴・西側には突き出した忍路半島、赤岩の山々が続き、その先には灯台のある高島岬が北に突き出しています。東には平磯岬が張り出しています。・市街地の南には天狗山や毛無山がそびえ、海に向かって坂をつくり、いわゆる「坂のまち」とRaまり9・市街地には小樽公園、水天宮、住吉神社など小高い丘があります。・市内の川は、勝納川や朝里川など大小の川が流れ、川の流れに沿って平らで階段のような地形の河岸段丘がみられます。・砂浜は蘭島、塩谷、銭画にあり、海水浴場となっでの・主な山は天狗山、毛無山、丸山で500て600m位の高さで、なだらかな山並みをつくっています。赤岩海岸市内中心部図革(ry選峡念"}, {"seq": 160, "page": 150, "img": "guidebook_pages/p160.webp", "t": "【コラム】●地形と街区3．小樽の川｢天狗山命名のいわれ？」小樽のおもな川は、藺島川、塩谷川、色内川、おこばちきしやく妙見川(妙見市場から上は於古発川)、勝納川、朝明治の初め、廃仏殼釈と呼ば里川、張碓川、銭函川、星置川、キライチ川などれる仏教排斥運動で本州の多くのｲ|多験者たちが修行の場を追わです。一番長い川は朝里川で13.8km・小樽の水源れました。新天地を求め、北海の多くは、河川水です。市域のほとんどがll1陵で道を目指した者も少なくないよ海が迫っている地形であることから、小河川ですうでした。小樽の港に降り立っが、上流の多くは、汚染源となる工場や田畑もなた彼らは眼前にそびえる山に分く極めて良好な環境が保たれています。さらに水け入り、護摩を焚きました。人里離れた山奥から立ち上る煙を質は旨み成分のミネラル類や炭酸ガスなどがほど見て、ふもとの人々が叫びましよく含まれ､厚生省(現厚生労働省)のおいしい水た。「天狗さまだ｣。これが命名研究会が発表した「おいしい水の水質要件」に適の由来？とされています。天狗合しています。山周辺にはいくつもほ桐こらなどが残っており、付近の山全体が修験の場だったのではといわれていま4．小樽の坂小樽のまちは､市の'|'央部の三方が山にI＃|まれ、まちを流れる川の河口のあたりと、埋め立てをした土地のほかは、すべて海岸から山手へ坂になっています。それで「坂のまち」といわれるようになりました。そして、小樽のまちづくりは、坂によって結び合わされていったのです。かたぎ「小樽気質」は、坂道を行き交う暮らしの中から、次第につくられていきました。坂道は、生活するのには苦労も多いですが、丼勝納川一杯のみその貸し借り、一升マスの米の融通や病人の世話などは、向こう三軒両隣りの連帯感の形成を促していったのです。最近では、高台からの景観が人々の詩情を誘うのか、カメラを構える旅人の姿をよく見かけるようになりました。見知らぬまちでとまどう彼らに対しても、「小樽気質｣は発揮されます。損得を離れて他人に奉仕することをこの上ない喜びとする人々が、肩を寄せ合って生きている､それが坂と人情のまち､小樽なのです。朝里川『広報おたる』平成13年4月号｢おたる坂まち散歩｣序章より"}, {"seq": 161, "page": 151, "img": "guidebook_pages/p161.webp", "t": "人小樽の代表的な坂く船見坂>勾配15%を超える船見坂は、小樽でも屈指の急な坂です。市民は腰をかがめながら坂を登ります。明治37(1904)年、函館本線の函館-小樽(高島)が開通しました。また、この年、稲穂町で大火が発生しました。この大火により2,000戸以上の家屋が焼失し、火は坂のすぐ近くまで迫りました。この火事がきっかけとなって中央通りと龍宮通りとの中間に防火帯として、もう一本の道路を開削することになり、その結果誕生したのが船見坂でした。とこの坂ができたことにより、三角山斜面一帯の開発が進み、高級住宅地富岡が出現しました。財をなした小樽の人たちは、あこがれのこの高台に居を構え、青い海と増毛連山を眺めながら生活したといわれています。坂の中ほどには函館本線をまたぐ船見椅があり、さらに坂を登りつめると右手に15%と勾配を示した表示板が立っています。振り返ればその名のとおり小樽港に停泊する船を眼下に見ることができます。ここからの眺めは、小樽を舞台としたテレビや映画などに必ずといってよいほど取り上げら坂の登り口には、国道5号との交差点を中心として対角線上に三角市場と中央市場があります。この2つの市場は小樽駅に近接しているという地の利を生かし、戦後の商品流通の拠点として活躍しました。ブリキの容問に鮮魚類をあふれるほど詰め込んだ「ガンガン部隊」も、この市場で商品を仕入れ各地へ出発しました。当時の流通の担い手「ガンガン部隊」。今はもう、遠い幻の世界のこととなってしまったのでしょうか。ーーニーニニーーン船見坂と三角市場図吐(r選信"}, {"seq": 162, "page": 152, "img": "guidebook_pages/p162.webp", "t": "＜地獄坂＞国道5号の産業会館前交差点から山手へ浅草寺、商業高校前を経て､小樽商科大学に至る約1.5kmの坂道を地獄坂といいます。明治45(1912)年2月23日の「小樽新聞」には、この通りが地獄坂という名で登場しています。この地獄坂の名の由来は、小樽商大の草創期の歴史と切り離すことができません。小樽商大の始まりである小樽高等商業学校が開校したのは明治44(1911)年。まちを挙げての学校誘致の成果でした。12,000坪の敷地は地主たちが寄付し、建設費37万円のうち20万円は小樽区債により賄われました。小樽区の年間予算が30万円でしたから、この金額がいかに巨額だったかがわかわたなくりゅうせいります。渡辺龍聖が初代校長として着任したのは''1年2月。当時は緑第一大通りから上には家がなく、「荒涼たる無人境の観｣があったと彼は記しています。地獄坂の深い雪をこいで上り、たどりついた渡辺校長が見たのは、校舎に黒板、いすや机すらないありさま。今後の苦難が思いやられました。開校当初は教授、学生の住む家もなく、教授じきぎようじ陣は直行寺で合宿し、学生は雨天体操場を仮寄宿舎として生活し始めました。全国から集まった一期生72人は、冬は深い雪の中を泳ぐように、そして夏は暑さに汗をかきながら、坂を上って通学しました。こうして学生を苦しめた坂は、開校当初から地獄坂とll平ばれるようになったといいます。雪解けになると受験生は滑って転んでは縁起が悪いと必死で登ったとのことです。その頃の学生たちは、この地獄坂の恨みつらみをデカンショ節ときわで「行くか常磐へ帰るか寄宿ヨホホ、ここが思案の地獄坂」と歌っていました。常磐とは坂の登り口にあった飲み屋のことです。●地形と街区地獄坂言一一一地獄坂より市内中心部小樽商科大学正門"}, {"seq": 163, "page": 153, "img": "guidebook_pages/p163.webp", "t": "く外人坂>水天宮から海側の堺町へ降りる急な坂が外人坂です。大正6(1917)年から昭和24(1949)年まで、木材貿易商を営むドイツ・ハンブルグ出身のカール・コッフ氏が坂の途中に住んでいたことに由来して名づけられました。道幅が狭く、石垣が続いており、清閑な雰囲気が漂っています。水天宮の方へ登りつめていくと、上の方は123段の石段になっドイツ・ハンブルグ市に本社のあるゲルトネル商会も明治42(1909)年に小樽に支店を開設し、インチ材の輸出をしていました。コッフさんが大正2(1913)年にゲルトネル商会に来たとき、彼はまだ18歳の青年だったそうです。コッフさんは大正11(1922)年に結婚し、小樽で一男一女をもうけました。小樽生まれのグンター君とエルガさんは、近所の道路で自転車に乗り、冬は坂でスキーをする姿が見られたそうです。お嬢さんのエルガさんは親しくしていた近所の奥さんから「菊」という日本名をつけてもらったほどかわいがられていました。港を見下ろるすコッフ家からはたくさんの外航船でにたぎわうら小樽港が見えたことでしょら5。く職人坂>妙見川から水天宮通りを横切り、入船方面に向かう坂を職人坂といいます。昔は、塗り師、張り師、彫り師、表具師、指物師、金具師、建具、家具屋、古着屋、古道具屋などの仕事場が軒を並べ、付近がこれらの仕事と縁のある料亭などがある市街だったことから、年中人が集まり、にぎわって往時のにぎわいは薄れましたが、現在も坂の通りに並ぶ建物から昔の面影をしのぶことができま外人坂職人坂IEHNNNにえ)"}, {"seq": 164, "page": 154, "img": "guidebook_pages/p164.webp", "t": "＜浄応寺の坂＞石山町の日乃出湯から、この坂を仰ぎ見ると、まるで覆いかぶさってくる様な急坂で、道路わきの表示には、勾配20％とあります。自動車が通行できる市街地の坂では－、二の急勾配です。坂を上っていくと、右手に立派な石垣があり、その上には名の由来の浄応寺があります。山門から境内に入ると、正面に優雅な曲線の屋根の本堂があります。これは初代の本堂が明治42(1909)年の大火で焼失した後、大正11(1922)年に建てられました。山門のかたわらには、石組みの碑がひっそりとあります。実はこの碑文には、驚くべき大事故の顛末が記されているのです。大正13(1924）年12月271=1、昼下がりの手宮駅構内で突然、大音響とともに爆発が発生。その振動は札l幌の地震計にも記録され、爆発音は利尻島にまで届きました。この爆発は、|幌内炭鉱で使用する600余箱、約10トン半の火薬類を貨車に積み替える作業中に起きた事故でした。この爆発による死者は64人、行方不|ﾘl者は30人もの多数に上りました。急きょ、浄応寺の境内には、むしろが敷かれ、遺体を安置して検死作業が行われました。浄応寺の建物にも爆風により大きな被害が出ましたが、判別も難しい遺体が境内に並ぶ悲惨なありさまを目の当たりにしまあきらした住職島彰氏は深く心を痛めました。事故の1周年に、住職が関係者とともに犠牲者の慰霊と事故の戒めにと建てたのがこの慰霊碑です。●地形と街区両陰哩浄応寺の坂醐強牌、i坂の上から手宮方面を望む静屋通り●小樽の代表的な通りく静屋通り＞JR小樽駅前の国道5号を海側に1本下った通りで、長崎屋の裏通り。かつてはキャバレー「現代」が営業しており、独特のいい味を出していました。「静屋｣の名はこの一帯の大地主だった北垣浅草通りせいおく国道の号の「静屋」に由来していますが、“せいお"}, {"seq": 165, "page": 155, "img": "guidebook_pages/p165.webp", "t": "く通り\"ます。通りには蔵を利用した喫茶店や蕎麦店もあり、風情のある通りです。とは呼ばず“しずや通り\"と呼ばれてい梁川通り>小樽駅前の中央通りを海側へ下り、右手に都通りのアーケード街をみて左折すると梁川通りで、都通りと中央通りを挟んで続く通りです。通り名はかつて、この稲生町一帯を所有していた榎本武揚の号の「梁川」に由来しています。日常生活に必要な様々な商店が軒を並べています。く浅草通り(日銀通り)>国道5号沿いの産業会館を海側に折れ、運河の浅草橋へ下る通りがあります。小樽の2つのアーケード街を分ける通りでもあり、金融資料館(|旧日銀小樽支店)が堂々んたる構えで鎮座しており、日銀通りとも呼ばれています。色内交差点からの眺めは堂んたるもので、往時の面影が色濃く残っています。く都通り>小樽駅前の中央通りと浅草通りとを結ぶ中心部のアーケードの通りで、街でも最も賑わいがある商店持の一つです。アーケードの両側にはさまざまな店舗が個性ある飾り付けで軒を並べ、アーケードの下では季節や祭りに合わせた催物も多く開かれています。人通りの途中に設けられた榎本武揚の案内板や方言の垂れ幕がとてもユニークです。ぐ中央通り>JR小樽駅前から真直ぐ海へ向かって延び、小樽運河へ行くもっともわかりやすい通りです。緩い勾配で下っており、電線が地中化されたことで港と石狩湾がすっきりと望めるようになりました。コラム1i=rrormmmーーややでに染川通り「榎本武揚と小樽と時代の創造者」榎本武揚は幕末は徳川幕府の海軍副総裁となり、維新後は開拓使の役人を皮切りに様々な大臣を歴任した政治家で、小樽にも大きな足跡を残しています。明治5年に開拓使は「土地払下規則」という法律を発令し、北海道の土地を買って開表したり街をつくったりすることを積極的に進めようとします。榎本は友人の北垣国道(後の北海道開拓長官)と一緒に、今の小樽の稲穂と富岡地区一帯(東西は手宮線から旭山奥、南北はオコバチ川から色内川)20万坪を購入しました。そのときのこの一帯は未開の荒野でした。時代が大きく変わるとき、多くの人々は従来通りの延長でしか考えることができませんが、日本史上、苦星の如く登場し、新たな時代の社会像を明確に提案してきた人物がいます。鎌倉時代を築いた源頼朝、幕末では勝海骨や坂本龍馬がそうだとすれば、維新後には大久保利通や榎本武揚が挙げられるでしょう。図壮(r寺性人"}, {"seq": 166, "page": 156, "img": "guidebook_pages/p166.webp", "t": "図吐(r寺居信かつての拡幅工事の際は、色内大通りの歴史的建造物(IH日刊北海経済新聞社など)を、建物ごと後方に移動して保存しました。都通り『おたるの自然』小樽市教育委員会平成11年『わたしたちの小樽』小樽市教育委員会平成16年「おたる坂まち散歩」http://WW.City.0taru.hokkaid0.jp/「小樽市http://Www.city.0tarU.「小樽の通り」ID//WWW.WeD0t3IU.jp/D0I09Ue/90e0BU6/090607.血さく中央通り"}, {"seq": 167, "page": 157, "img": "guidebook_pages/p167.webp", "t": "小樽市の花は昭和43(1968)年5月28日に制定されたツツジです。制定の経緯は、北海道新聞社小樽支社と共催で、昭和43年北海道100年を記念して6月1日、2日開催の「第4回おたるつつじまつり」の一環行事として「小樽の花、小樽の木」を市民から公募しました。選考は市と北海道新聞社小樽支社、学識経験者等の関係者によって行われました。一般市民からの応募でツツジは一番多い応募数で、小樽公園にはすでに多くのツツジが植樹され、小樽の新名所として親しまれているということで選考委員の賛成が多かったようです。現在、小樽公園内には20種類、約7,000本のツツジが植えられ、4月下旬から6月にかけて、市民の目を楽しませてくれます。小樽市のり木はシラカンバです。制定の経緯はツツジと同様、市民からの公募により昭和43(1968)年5月28日に制定されました。シラカンバは小樽近郊に数多く見られ、市内各公園内にゃ植樹されており、生長力が強く育てやすく、北海道的な美しさを感じさせるというのが選定理由でした。昭和39(1964)年にロータリークラブが創立30周市の花ツツジ"}, {"seq": 168, "page": 158, "img": "guidebook_pages/p168.webp", "t": "年を記念して、緑化事業に取り組みたいと小樽市に申し入れました。市はこれを受けて小樽公園の南斜面、順誠塔の裏側に植樹してもらうことにしました。かつてこの場所はトドマツを植樹しましシラカンバは温帯から亜寒帯たが、乾燥地のため育ちませんでした。このため地方に多く見られるカバノキ科の植物で、落葉樹の一種です。シラカンバなら土地を選ばないだろうと､1,500本樹皮が白いことからこの名がつのシラカンバの苗を緑小学校の高学年の児童も参けられたようです。現在目にす加し植樹しました。これが順洲に育ったこともある植物関連の本のほとんどは、り、シラカンバが見直されたのも選定理由のひと白樺のことを「シラカバ」ではつでした。なく「シラカンバ」と呼ぶのが標準的になっています。なぜこれだけこだわって「カンパ」と呼ぶのでしょうか。シラカンバとは樹皮の白い｢カンパ」です。それでは「カンパ」とは何かというと、アイヌ語でサクラの木の皮のことを「力リンパ」(ka｢impa)と言い､この力リンパが「か|こは」となり「カバ」に転じましたが、古来アイヌの人々はサクラと力バノキ属の樹皮を同類として扱ったと考えられます。3．街路樹小樽市内各路線の街路樹には高木の広葉樹、針葉樹、低木の広葉樹、針葉樹があります。その種類は高木で約30種以上、低木で約20種以上です。現在、一番多い樹種は高木広葉樹のナナカマドで、千秋通りや臨港道路の街路樹はナナカマドで彩られています。市内ではプラタナスもよく目にしますが、管理の問題で近年は新たに植えていないようです。参耆資料｜『小樽市史第7巻』小樽市平成5年『2002年市勢要覧』小樽市平成14年｢小樽市」一一ー一一一一//www・city・otaru.|9.jp一一一一,＝千秋通りのナナカマド"}, {"seq": 169, "page": 159, "img": "guidebook_pages/p169.webp", "t": "人@保存樹木名称は所有者所在地。|樹種2日に存樹木龍守寺真栄1-9-8天婦イチョウ(公琵樹)|2本上還黄(提.6ーー葉(イチョウ)植栽の経緯は定かでないが、市民には銀査の取れる夫婦イチョウとして親しまれている。保存樹木|2|恵美須神社祝津9丁目クワ(径)イチイ(様)|2本|王器愚JI安永3年創建の境内にあり昔から住民に拘愛されてきた。クワは雄樹なのか結実はしないが、日本でも珍しい大樹で、北海道の名木に指定されている。保存樹木|3|大忠寺妨路1-281|アカマッ(赤松)4本|(89083赤松は別名女松とも言われ黒松(男松)と共に日本の風景を代表する樹木であり、樹皮が赤褐色なところから赤松とわれる。推定樹齢250年以上。存樹木|4|妨路神社忍路-412ィイチョウ(公孫樹)|1本|\\病 内16団体の代表により討議されましたが、いろいろな意見があり直ちに決定とはなりませんでした。しかし、その後も指定への運動が続一堂虹酢竺一ヒグマトド"}, {"seq": 171, "page": 161, "img": "guidebook_pages/p171.webp", "t": "けられ、昭和60(1985)年9月に市議会で採択、翌年の5月に制定されました。2.小樽の動物今、街になっているところは、昔は丘から山にかけてミズナラなどの大木や雑木林が続いていましレした。明治の初め、小樽へ移ってきた人々は、丘をたがやし、畑を作って野菜を育てていました。この頃はヒグマやエゾオオカミなどが住んでいて夜の山道は危険でした。また、祝津のト下岩にはたくさんのトドがいたそうです。トド岩3.小樽近海で獲れる水産物かつて人触漁で栄えた小樽は今も漁業も盛んなまちです。年間を通して近海のさまざまな水産物が水揚げされています。平成24(2012)年度の統計資料によると、総漁獲量は23,456トン、人金額にすると約33億円となります。急類ではホッケが量、金額とゃ一番で、カレイ、スケトウダラが続きます。水産動物ではイカ、ウニ、タコとなっています。員類ではホタテ稚由が全体の9割を占めています。ホタテの中間育成事業は小樽市漁協が北海道・小樽市の補助を受け昭和55(1980)年から取り組み、57(1982)年度から祝津沖で行われています。昭和57(1982)年には103トンの水揚げでしたが、年々実績を上げ、今では1,800トンの水揚げとなっています。今ではいなくなった動物ョツクカミヨットンクalのルの今でもいる動物ギ=E0Wネコソシンカカト記回のキジパドョアイタイシ紀ウジマペ回YRンドカク中ウサシッショウウスUIj=小樽近海の水産物魚類:カレイ、ホッケ回時陸202MIiの2三有22人ハッカク、カジカタラ、ヤナギノマイツウに0/ら水産動物:イカ、タコ、エピナEC2の=N議2ジ22120ョINヤ、カニ2の|生還NEシツ回目二のイガイ時ジ)ァ海草類・gpカリ『小樽市史第7巻』小樽市平成5年「森でひろったメッセージ」httD://WWW.980CItie5.jp/WOWOWaTUII/IOeX.I人|『おたるの自然』作成委員会小樽市教育委員会平成3年『小樽市統計書平成24年版』小樽市"}, {"seq": 172, "page": 162, "img": "guidebook_pages/p172.webp", "t": "朝里川温泉小樽を代表する温泉は朝里川温泉です。明治20(1887)年頃から朝里の奥に湯が出るという話が一部の人たちに信じられていました。明治34(1901)年8月、朝里村山の上に旭風館開業が温泉の最初とされていますが、地域の開発は次のとおりです。朝里川温泉は昭和14(1939)年、朝里土地株式会社により、現在の豊倉橋付近で掘削に着手しました。苦労の末、昭和17(1942)年にようやく281mの地下から48Cの湯が自串しました。しかし、その後日中戦争の影響と資金難で掘削工事は中断されました。昭和28(1953)年、久野岩冶(朝里温泉株式会社社長)、板谷宮吉(会社重役)、渡辺得郎(漁業)らが再び掘削に着手し、4月に40.5Cの湯が出ました。元湯朝里川温泉が建設されたのは、昭和29(1954)年6月のことことでした。元湯温泉旅館が開業してから急激な発展を続け、元横綱吉葉山(北海道出身)も「吉葉蘭」という温泉旅館を開くなど、昭和34(1959)年9月には十数軒が建ち並び、市営朝里川温泉センター、老人ホームなどもゃ建設され、その後スキー場もできました。〇朝里川温泉の泉質はカルシウム・ナトリウム塩化物泉で、神経痛・筋肉痛・関節炎・疲労回復・慢性婦人病・凌疾に良いといわれています。朝里川温泉"}, {"seq": 173, "page": 163, "img": "guidebook_pages/p173.webp", "t": "〇近年、この一帯は「ゆらぎの里」と呼ばれ、温泉のみならず地域でのイベント開催や名所を積、蘭活き極的にPRしています。中でも、定山渓へ向か『小樽市史第8巻』小樽市平成0年昌8「小樽朝里川温泉郷「ゆらぎの里」」2途中のループ橋(朝里スカイループ)や大きhttp://WWw.0taru-8sari.CO.jp/な噴水がある朝里ダムなどは新たな観光スポットとして親しまれています。朝里ダム過朝里スカイループ"}, {"seq": 174, "page": 164, "img": "guidebook_pages/p174.webp", "t": "1.小樽の水はどこから?(水系)小樽市は東西に細長く山坂の多い地形なので、給水区域を大きく3つに分け、3ヶ所の浄水場から給水されています。市内中心部(花園・稲穂など)は、朝里ダムの水が給水されています。高台地区(最上・幸など)や桃内・忍路・蘭島地区は、水源で一番標高の高い余市川の水が給水さ外幽地区は、銭画川の水に朝里ダムの水をプレンドし、給水されています。還小樽の水源水源浄水場KS給水区域四間是時中心市街地・朝里・望洋台・桜朝里川一朝里ダム|豊倉浄水場央見合著作鐘了計|手宮・高島・祝津・長橋・幸余市有川|天神浄水場オタモイ・塩谷・最上・桃内・忍路蘭島等|是|銭函。有川|鍼函浄水場銭函・桂岡等2.小樽の水はおいしいの?(水質)気温が高く湿度の低い時、運動をして喉が潟いている時などは水をおいしく感じますが、水のおいしさには2つの大きな要素があります。1つは水溶けている成分が創り出すもの、もう1つに水温があります。水温は特に重要な要素で、体温より20て25で低いと生理的に最もおいしく感じるといわれています。"}, {"seq": 175, "page": 165, "img": "guidebook_pages/p175.webp", "t": "小樽の水のおいしさには、3つの要因があります。第一に、豊かな自然と水源環境に恵まれ、原水の水拘が良好で過度の薬品如理を必要としないことから、水が本来持っているおいしさを損なうことなく、自然に近い水道水を供給できること。第二に、ミネラル分が多すぎると水に苦みや渋みをつけますが、小樽の水はミネラル分を適度にバランスよく含んでいることからクセがなく、口当たりのよいこと。第三に、小樽は山坂が多く、東西に細長いといった独特の地形から、人口の割に水道施設が多く、施設内に止まっている時間が短いことから、浄水場で作り立ての新鮮な水道水を供給できることです。水道水を供給する区域が広くなると、施設内に止まっている時間が長いため、水道水が需要者に届くまでに水温上昇が大きいことも水道水のおいしさを損なう要因の一つとなっています。小樽の水のおいしさは、恵まれた自然環境と水質の良さ、小樽独特の地形が創り出しているものです。3.伏流水(地下水)の産業利用山から流れてくる水には地上を流れる「川」と、地下に水系を持つ\"地下水」とがあります。現在、小樽市内の水道水の原水は「川」や川を堀止めた「ダム」から取水していますが、小樽の酒造メーカーでは、地下水をポンプでくみ上げて使用しています。田中酒造は地下75mの水を原料に使用し、北海道ワインは地下152mから吸い上げた水をワインは冷却用に、また地ビールは原料として使用しています。「水の成分」本来水は無味無臭です。雨水は蒸留水に近く、ミネラル成分なごどをほとんど含んでいません。この点ではある意味きれいな水とも言うことができます。しかし不純物をまったく含まない「純水」は、味の点からすると、湯ざましと同じように、とても飲めたものではありませ雨水は地球上に降った後に、地質層や岩石層の狭い隙間に浸み込んでいつて、いろいろなミネラル成分(カルシウム、マグネシウムなど)を溶かし込みます。水に味があるというのは、飲み水が純粋なH2Oではなく、鍼物分などが溶け込んでいるからで「軟水・硬水」水道水中にはカルシウムやマグネシウムなどのミネラル分が含まれており、この量を表すのに硬度が使われます。一般的に、硬度100mg/2以上の水を硬水、それ以下の水を軟水といいます。ミネラル分が多すぎると水に渋みを付け、また、カルシウムに対してマグネシウムを多く含む水は苦みを付けます。小樽の水は、人硬度15て30mg/1を含むお軟水で、マグネシウムの2.5ン4倍程度のカルシウムが含まれています。1mg/2(ミリグラムパーリットルと読お)は、水1リットル中に千分の1グラムを含むお量を表す。"}, {"seq": 176, "page": 166, "img": "guidebook_pages/p176.webp", "t": "4.伏流水(地下水)の原理地下水は基本的に深きはまちまちですが、小樽ではどこを掘っても出てきます。従って水道が普及される以前はどの町内にゃも井戸がありました。そこで産業で使用する地下水の問題は水質と安定した供給量にあります。たとえば美味しさの原因となっているミネラル分が逆に少ない方が、酒には適しています。光の当たらない海の深層水や山麓に湧出している名水などは、いずれも豊富なミネラルバランスを自慢にしていますが、それは「水」として飲んだときに、人間の味覚が感じる「うまみ」に通じるがらIでつまりそのような「おいい水」とちとは逆に、「きれいな水」が産業には適しているということになります。材料に個性があると、製品である酒の個性と対立をしてしまうからです。また安定した豊富な供給の量を地上で確認できるヒントがあります。山から川が流れていきますが、地上の川を流れる量が多いほど地下に潜る量も多いということになります。小樽にもいくつかの川がありますが、勝納川の流域は大きい方なので、従って地下水も豊富であるという理由によって、小樽の水を使用する産業群が勝納川流域に形成されてきたのです。ら.小樽の工業商業がリードして発展してきた小樽には、高度な技術を持った工業もしっかり根付いてきました。触漁から派生した水産加工業、蒸気機関還づくりから派生した金属加工業、木材輸入から派生した木工業、繊維問屋から派生した縫製業、そして水を原料もしくは食品加工業などが今日の小樽の地場産業を形成しています。この中で特に、酒、精米、菓子、豆腐などは水井戸(田中酒蔵)酒づくり(田中酒蔵"}, {"seq": 177, "page": 167, "img": "guidebook_pages/p177.webp", "t": "が欠かせない素材になりますが、小樽が自慢できるこれらの味を助けてきたのは、まさに小樽の水に他なりません。その他にも、ゴムでは冷却用、水産加工では洗浄用として、水は欠かせないものでのそしてもう一つ、北海道は寒浴地なので、水道便結には昔から悩まされてきました。そんな地域だからこそ進化してきた水抜き装置(不凍給水栓など)の技術があります。較酒と水1朝1.80)の酒をつくるには10井の水を使うといわれるように、酒の10倍以上の水がさまざまな段階で必要です。「洗米」米を洗う水、「浸濱」米を適度に潤す水、「茶米」米を蒸気で蒸す水、「仁込水」米と欧とを一緒にタンクに入れる水、「割水」度数調整のための水といったほとんどすべての過程で水を使用しまお9画某子と水和菓子では練り製品」(あんこ)に、洋菓子では「ゼリー」などに多くの水を使用します。特に小樽は小豆の集積地になっていたことから、小樽には多くの「練り」製品が競ってつくられ、洗練された技術と美味しさが今日の菓子づくりに活かされています。小樽の菓子文化のもう一つの特徴は「餅」です。餅にも大量の水が使われます。北海道で米が本格的につくられるようになったのは明治中期くらいですが、以前から移入した米を精米するため、川沿いに水車を設置して水力を利用してきました。水を利用した技術と、さらに「小樽の水」が支援して美味しい餅がつくられ、今や小樽には餅をつくっているお店が多くあります。渦水や水不足に悩む地域から見ると、小樽の水豆腐づくり(土門豆腐店)菓子づくり(新倉屋)菓子づくり(新倉"}, {"seq": 178, "page": 168, "img": "guidebook_pages/p178.webp", "t": "環境は大変恵まれています。また海があり川が流れている自然環境からの恩恵もたくさん受けています。一F一一~~勺..令L沙今デー■近代化遺産◎防波堤ひろいいさみ世界屈指の技術として広井勇設計の北防波堤は、北防波堤明治41(1908)年に完成します｡100年以上も維持している素|情らしい遺産です。◎運河ー大正12(1923)年に完成した小樽運河は、当時の物流基地小樽の名残をふんだんに残し、小樽観光の目玉になっています。◎水源地北海道開発局小樽開発建設部大正3（1914)年に、小樽の近代水道創設施設で小樽港湾事務所みなと資料館ある奥沢水源地が完成しました。昭和60(1985)年に当時の厚生省が実施した「近代水道百選」に選定され、平成20(2008)年には公益社同1法人土木学会「選奨土木遺産」に認定されています。階段式いつりゆうろの溢流路から流れ落ちる水すだれの景観は、夏は清涼感を与え、秋は紅葉に映え、周|此'の自然とよく調和した美しさを見せていました。※創設時から稼働してきた奥沢ダムは堤体に陥没箇所が見つかり、平成23年に廃止する判断をしました。&\"Ww騒潤凸曲凸奥沢水源地■ず分◎浄水場小樽の潮見台浄水場は、入船や松ケ枝方面に送水する目的で昭和2（1927)年に完成しました。管理棟は昭和初期に流行したヨーロッパ風のモダンな建物です。なお、水道施設としては現在休止しています。潮見台浄水場(休止）"}, {"seq": 179, "page": 169, "img": "guidebook_pages/p179.webp", "t": "■商品小樽市が近代水道創設90周年を記念して、平成16(2004)年から製造しているボトルドウオーター｢小樽の水(500mO)」は平成17(2005)年11月より市内各所で販売されています。「小樽の水｣は､恵まれた自然環境の中で育まれ、炭酸ガスや酸素などがほどよく溶けていることなどから清涼感があります。そして、ミネラルがバランスよく含まれ、口当たりがよいため、おいしいと言われています。ボトルドウォーター「小樽の水」は、このおいしい水を原材料とし、ヤシガラ活性炭や力ll熱殺菌処理により塩素を取り除いて、自然のおいしさを詰めたものです。ボトルドウオーター｢小樽の水」ペットボトル■ミュージアムしゆせんかん◎北の誉酒造「酒泉館」明治34(1901)年に創業した北の誉酒造(株)が平成8(1996)年に設置した見学施設です。「歴史を旅する展示ゾーン」「知識を深めるライブラリー」「昔の酒造り工程をジオラマで再現」「昭和初期のポスター展示」などのコーナーなどがあり、試飲もできます。小樽市奥沢1-21-15TELO134-22-2176‐‐一二一酒泉館さつ－フ、1つ◎田中酒造(株）「亀甲蔵」明治32(1899)年に創業した田中酒造(株)が平成亀甲蔵8（1996)年に設置した酒造工場と見学施設です。10種類以上のお酒が試飲できるミュージアムです。点小樽市信香町2-2TELO134-21-2390◎北海道ワイン(株）「おたるワインギャラリー」昭和49(1974)年に創業した北海道ワイン(株)が平成8(1996)年に設置した見学施設です｡葡萄栽培からワインができるまでの工程をビデオで観賞でおたるワインギャラリーきたり､硝子越しに瓶詰ラインを見学できるほか､そ"}, {"seq": 180, "page": 170, "img": "guidebook_pages/p180.webp", "t": "の時をのおいしいワインを試餅することができます。小樽市朝里川温泉1-30TEL0134-34-2181⑨⑥(株)かま栄「見る工場」明治38(1905)年に創業したかま栄(株)が昭和63(1988)年に設置した見学施設です。浦鮮製造の一連の工程を見学および試食ができます。小樽市堺町3-7TEL0134-25-6181⑨⑤(株)アレフ「小樽ビール銭函醸造所」平成7(1995)年に創業した小樽ビールが平成11(1999)年に銭画醸造所を設置、見学施設を併置しました。地ビール独自の製法の見学と試飲ができ小樽市銭函3-263-19電話0134-61-2280@ぐ朝里ダム記念小樽市朝里川温泉2-580TEL0134-52-0241⑥(株)光合金製作所「朝里工場」昭和22(1947)年に創業した(株)光合金製作所が昭和48(1973)年に新設した朝里工場では事前申し込みで見学が可能です。水の特徴を熟知した企業技術の粋が見えてきます。小樽市新光5-11-1TEL0134-54-7568(株)光合金製作所朝里工場志力小樽市水道局サービス課小樽市水道局水質管理課"}, {"seq": 181, "page": 171, "img": "guidebook_pages/p181.webp", "t": "京抽小樽敬察署1.小樽八区八景小樽市では魅力あるまちづくりをすすめるために、市内を八つの地区に分け、それぞれの地区を代表する景観を八つ選び出し、市内全体で64景(八地区八景)を「小樽八区八景」として選定しました。選定にあたっては平成8(1996)年3月から2年間にわたり、市民が参加しました。小樽を代表する景観は運河周辺に集約されがちですが、各地区の八景を見ると小樽がいかに魅力的なかまちであるかが実感できます。それぞれの地区で景観の特性が人逢うことが分かります。地域の個性や魅力を知ることが、まちに愛着や誇りを持のNeの00の0のGOお男各地区の特徴く中央地区>港から山に向かって放射状に街が広がる景色は、古代ローマなどの野外劇場をイメージさせます。坂道や丘から市街地を見渡すことが出来るため、日々のくらしの中で、まち全体の四季の移ろいや表情を知ることが出来ます。運河周辺では歴史的建造物が保全され、新旧調和のとれた町並みづくりが進められています。コラフムsN「明治初期の小樽八景」すでに明治9(1876)年に太政大臣・三條実美が小樽の風光明婚な景観に打たれて八景を選びまし①祝津夜雨②色内晴嵐③住吉秋月④龍徳思鐘⑤浜中夕照⑥朝里落應(⑦石狩帰帆⑧増所暮雪上上WVキキゥやキやキゎsbほほ旧手宮線"}, {"seq": 182, "page": 172, "img": "guidebook_pages/p182.webp", "t": "河例く桜・朝里地区>早くから土地区画整理事業により、良好な住宅地として発展し、近年は望洋パークタウンの大規模開発などにより、朝里川を挟む丘陵沿いに住宅地が広がっています。海水浴場、朝里川温泉、スキー場、オタルナイ湖などにより、レクリエーションやリゾート地のための整備がすすみ、また、国道5号沿いには郊外型物販店が増えています。ぐく張確地区>断崖の海岸線と、三方を山に囲まれた沢沿いに街が形成されています。市の島のアオバトが恵比須島に飛来することでも知られ、美しい自然景観が特徴です。上空を横断する張確大橋がランドマーク(目印)となっています。断崖どしに海岸線や海を見渡せることなどから、住宅地の中にホテルなどのリゾート施設が建築されています。く銭函地区>札幌市に近接し、平坦地に富み、工業・住宅地として開発が進んでいます。JR線より山側及び桂岡方面は斜面市街地が広がり、そこからは石狩湾新港までの約10kmにわたる砂浜の海岸線が見渡せます。また、北海道薬科大学や公営住宅などが町並みの中でランドマークとなっています。く祝津・高島地区>古くから漁業で開け、小樽の主要な水産基地として栄えてきました。。変化に富だ海岸線沿いには人角・番屋などの歴史的建造物も点在し、高島岬や日和山灯台がラドマークとなっています。水族館や祝津マリーナがあり、観光・座レクリエーションゾーンとなっています。また、丘陵には大規模な住宅団地が開発されています。くオタモイ・赤岩地区>赤岩・オタモイ海岸は国定公園に指定されており、奇岩や絶長など勇壮な海岸線をフェリーや遊覧船から見ることができます。オタモイから祝津までの自然探勝路からは積丹方面も望めます。また、四季折々の表情を身近に見ることが出来る赤岩山の南斜面には住宅地が広がり、高人からは遠く札幌方向も見渡せます。く桃内・塩谷地区>丸山のふもとの山あいを抜ける農道沿いには、畑や果樹園が連なり、自然が豊かな田園風景が広がっています。また、フルーツ街道からは緑に囲まれたゴロダの丘と、砂鉄の黒い砂浜で知られる塩谷の湾を見渡せます。国道5号沿いには工場などがあり、両側の斜面には住宅が建ち並んをでいます。ィ7Zグ"}, {"seq": 183, "page": 173, "img": "guidebook_pages/p183.webp", "t": "ぐく蘭島・忍路地区>岬の縁と入り江の水面の色を刻々と変化させるタタ日が美しい忍路湾と、夏場に道内有数の賑わいを見せる蘭島海水浴場で知られています。農道沿いには田園的な自多景観が広がり、また、忍路環状列石などの史跡があり、多くの埋蔵文化財が発掘され、古代の歴史を感じさせる地区でもあります。人@小樽運河と歴史的まちなみ栗林と桜の手宮公園人@海からの街なみと山なみ久坂の街の船見坂人@小樽公園の春夏秋冬人@旭展望台からのまちと港人@奥沢水源地緑映人天狗山スキー場からの増毛連山信張確カムイコタンの断崖人@春香山スキー場からの昧望@アオバト飛来の恵比須島信義経トンネルと瓦の橋@緑につつまれた張確のまち人景勝園眼下の海信相確川とアーチ橋@八眺山からの眺望@江差追分碑からの海・崖・灯台@下赤岩山からの日本海のホい守り生3吾。人@祝津湾港とマリーナ祝津高島地区@にしん番屋のまちなみ人@豊井浜から望お高島岬人@弁天鳥と高島漁港供直後踊りと高島神社信丸山からの360度眺望信フルーツ街道からのポンマイ岬信文庫歌から望む岬のつらなり@伊藤整文学斬とゴロダの丘信黒い砂浜から望む積丹半島人@者谷漁港から望お丸山念海から望お窓岩人@桃岩と桃内海岸桃内・塩谷地区人@下和トンネルからの小樽港@@銀鱗壮と平磯岬信桜ロータリーと熊確神社信望洋台から望お朝里のまちと海人@朝里川温泉郷とスキー場人@オタルナイ湖とループ橋念紅葉の朝里峠人⑯毛無山からの雄大な眺思@楽科大から望む石狩湾人十万坪線の桂並木開拓時をしのぶ銭函駅と豊足神社@赤別注と御膳水信銭函前浜の漁⑱ハマナス咲く10キロメートルの砂浜食銭函天狗の遠望念広大な工業地と石狩湾新港信積丹へ続くオタモイ海岸人@海から望お奇岩断崖久能照寺から望お青い海人@山中海岸⑱オタモイの唐門@@小樽海岸自然探勝中信赤岩山からの眺望赤岩のロッククライミング信夕日が映える忍路湾竜ヶ崎とカブト岩@緑と古木に囲まれた忍路神社師路から望お桃岩・塩谷海岸久礼路のストーンサークル群人@蘭島海水浴場@蘭鳥海岸から望おフゴッペ岬@フルーツ街道そいの田園風景桜・朝里地区蘭島・忍路地区画参考資料『小樽八区八景ガイドマッフ』小樽市建設部まちづくり推進室まちづくり推進課2.小樽市都市景観錠この賞は、小樽の歴史と風土に調和した都市景観をつくり出している建築物や活動などを表彰することにより、都市環境の向上と市民のまちづくりへの理解を深めてもららことを目的として、昭和63(1988)年度に設けられました。建築家、都市計画家、画家などの学識経験者や市民の代表者からなる小樽の歴史と自然を生かしたまちづくり景観審議会」の中で、現地審査やスライド審査を実施し、議論を重ね、かつ慎重に選考が行われています。小樽市の都市景観行政べの取り組みの開始は、小樽運河の半分を埋立てが行われた昭和58(1983)年のことで、「小樽市歴史的建造物及び景観地区保全条例」が制定さ湘人"}, {"seq": 184, "page": 174, "img": "guidebook_pages/p184.webp", "t": ""}, {"seq": 185, "page": null, "img": "guidebook_pages/p185.webp", "t": ""}, {"seq": 186, "page": null, "img": "guidebook_pages/p186.webp", "t": "く歴代市長>大正11(1922)年8月、市制が施行され、その後初代の市長選挙が行われました。当時の市長選挙は現在のような市民による投票ではなく、市会議員によるものでした(市長公選制は昭和22(1947)年から)。最初の市長だけに、革新(憲政派)、公正(政友派)両派とも自派の手に収めたく、強い意欲で臨みましたが候補者選びで難航しました。革新派は候補者選びを中央に持ち込み、推薦により前熊本市長の佐柳藤太を第一候値とし、選挙の結果初代員二SERりまだ佐柳は明治3(1890)年、香川県に生まれ東京法学院を卒業「名誉市長」歴代市長のなかで唯一の名誉職市長が板谷宮吉です。初代、2代と中央から移入した市長でしたが、昭和初期の小樽は「大小樽」となっており、市長は地元より選出すべきだという声がEKaWo)ItGUUGSILEOくらでRE請を受けた板谷は1期、無給の条件で市長を引き受けました。後、長野、新潟参事官等を歴任し熊本市長となりました。参考貴料大正12(1923)年、晴れて小樽市長こなった佐柳でしたが任『小樽市史第4巻』期半ばにして病気になり大正14(1925)年月に亡くなりまし小樽市昭和56年た。わずか1年6ヶ月という短い就任期間でした。く歴代市長名>氏就任期間大味久五郎|大正11年8月一大正11年12月佐柳大正12年8月一大正14年2月木田川奉彦|大正14年9月昭和7年11月|7年2ヶ月板谷宮吉(名誉市長)|昭和8年12月昭和12年12月河原直孝|昭和13年4月昭和20年5月福岡幸吉|昭和20年6月て昭和21年11月寿原英太郎|昭和22年4月ご昭和26年3月安達与五郎|昭和26年4月ご昭和42年4月|_稲垣祐昭和42年4月昭和50年4月8年代|志村和雄|昭和50年4月昭和62年4月12年|10代|新谷昌明|昭和62年4月平成11年4月|2導|11代|山勝鷹平成11年4月平成23年4月|出征|12代|中松義治|平成23年4月現在決藻結全"}, {"seq": 187, "page": 176, "img": "guidebook_pages/p187.webp", "t": "小樽市の行政区域の大まかなが推移は次の通りです。還小樽の行政区域の推移真文10(1670)年|オタルナイII生。明治2(1869)年8用小樽同上間治92(699)和0月小樽|山科郡・閣の一大正11(1922)年8月|小市同上昭和15(1940)年4月高島町合併”|高島・祝津昭和15(1940)年9朋朝里村合併”|衣確ご銭昭和33(1958)年4月塩合村合俳”|場合ご蘭島明和50(1975)年4月石狩町の一部編入|石独困枯川村小樽市内には現在58の町名があります。明治31870)年、開拓使により町名がつけられました。山ノ上・信香・信香禅・勝納・金曇・芝居・土場・新地の8町です。今でや残っているのは信香と勝納です。その後、明治23(1890)年までには30町となりました。明治32(1899)年には区制施行により高島郡から6町(色内、稲穂、手宮、手宮禅、南浜、北浜)、堂33(1900)年には6町(厩、柳、京、仲、弁天、羽衣町)と、総計42町となりました。大正4915)年、町名の大改正があり、9町が廃止され、新たに21町が新設され、総計54町となりました。雪を表徴した六花の中に小樽の頭文字(小)を図案化したものです。明治34(1901)年9月10日制定"}, {"seq": 188, "page": 177, "img": "guidebook_pages/p188.webp", "t": "小樽の町名銭函|46|思洋台星野町築。港|48|真。栄松ケ校天狗山|50緑|6|有幌町|21|塩谷|36|天神|5l|港町37|富。岡|52|見晴町|8|稲穂|23|清水町|38|豊川町|53|最上|9|入船|24|祝津|39|長橋|54|桃内|錦。町|55|山田町蘭島42|花57|若竹町43|張確町|58|若松春香町勝納町2.由来小樽の町名には由来のはっきりとしていないものがまだまだあります。町名や地名、橋の名前など調べていくと昔の小樽を想像することができます。ここでははほんの一部だけ由来を紹介していきます。*小樽の町名由来は大きく4つに分けることができます。①アイヌ語に由来するもの。(蘭島、オタモイ、高島、祝津・・・など)⑨②人名に由来するもの。(山田)③地名・物名に由来するもの。(長橋、石山、赤岩、天神、筑港・・・など)④その他はっきりしていないもゃの。(清水、豊川、錦、見晴・・・など)く小樽>語源はオタ・オル・ナイでオタは砂浜、オルは中、ナイは川または沢と訳し'秘浜の中の川」という意味です。銭画(大浜)オタルナイ川のほとりに鮭漁を業とするアイヌの人たちの集落がありましたが、鮭漁の不漁が続いたため、人触漁の中心がクッタルウシ(イタドリの多い所:現在の堺町郵便局付近)に移ったためオタルナイのアイヌをクッタルウシに移住させたのでクッタルウシをオタルナイと呼ぶようになりました。この時以来、近隣の石狩、高島、祝津場所などと区別するためオコバチ川(紗見川)からオタルナイ有川銭函)までの4里32丁を総称して「オタルナイ場所」としました。明治2(1869)年、昌夷を北海道と改称し、オタルナイを小樺に改めたのは松浦武四郎の発案だと伝えられています。"}, {"seq": 189, "page": 178, "img": "guidebook_pages/p189.webp", "t": "斗人@く高島>原名はタカシュマ。タカは伺の鷹、シュマはアイヌ語の岩で、タカに似た岩があったためと伝えられています。「茅柴岬そばの二つ岩付近に沖合いから見てタカに似た岩があった。明治20(1887)年頃、この付近漁舎を建てるため岩を壊してしまったが、岩の一部で元の形を刻み、岬の空にまつった」という説もやあるようです。く鍼函>町名の由来には3つの説がありますが定かではありません。①豊漁説明治初期、角の豊漁で漁場の収入は慕大でした。どこの漁場へいっても鯖の函が積まれんていたから。②運上金免除説漁場収入が英大であったにもゃも関わらず、場所制度の税金にあたる運上金が免除されていました。そのため、あちこちの漁師の家には銭の函が積まれんていたから。③海岸の潮流説海岸に潮流の関係で石炭が流れつき、付近の住民はこれを拾い冬を過ごした。また難破船やいろいろなものが流れつき、ドル函のような海岸なので銭両となった。く山田町>江戸時代末期に和人が勝納川両岸に定住するようになり、やがて明治になると街は次第に広がりを見せてきました。まず入船川尻さらちにオコバチ川(妙見川周辺に集まってきましたが、入船川とオコバチ川との間の道は水天宮の丘の下の濾打ち際の道路しかなく、海が荒れると通ることができませんでした。そこでこの央をいつでも人に肖れる池の上で作ることを計画しました。そして明治15(1882)年からほばぼ1年かけて完成させました。明治1990年この必の提便を山国打と名されました。その後天作は條樽区長になりました。小樹経済の基礎やや都市基盤を整備した功労者としても有名です。く花園町>小樽市街の繁栄が北に移り始めた明治17(1884)年、花園町が誕生しました。当時の区域は天狗山山枚までの広範囲なものでした。町名の由来ははっきりとしていませんが、「京都・花園の妙心寺が浮世通りに説教所を構えていたところから花園町の町名になった」という説があります。町名ではありませんが、市内には京都文化を匂わせる地名があります。北山、東山、上山・・・。都へのあこがれでしょうか。"}, {"seq": 190, "page": 179, "img": "guidebook_pages/p190.webp", "t": "く勝納町>信香町とともに明治3(1870)年、開拓使より命名された小樽最古の町名です。大正41915)年の町名改正でも区域、町名とも存続した町です(昭和42(1967)年には再編された)。原名はアイヌ語のアッチナイ(水源の豊かな沢)を和人がなまってカッチ天和2ツの邊つっだと伝えられのまう山田町このように小樽の町名にはいろいろな歴史や言い伝えがあり、興味はつきません。今自分が立っている場所は当時、どんなところだったのでしょうか。町名や地名からはいろいろなが話題を発見で銭函海岸『小樽町名の由来』河村礼三昭和57年[小樽の町名」『北海道新聞!明和53年8月1日昭和54年3月31日連載河村礼三著『角川日本地図大辞典』北海道上下巻編集委員会編角川書店明和62生"}, {"seq": 191, "page": 180, "img": "guidebook_pages/p191.webp", "t": "●国際交流ナホトカ市文化や経済などの交流を通じて相互理解と友好親善を深めるため、小樽市では現在3都市と姉妹都市の提携をしています。'1．ナホトカ市(昭和41(1966)年9月､姉妹都市提携）ナホトカ市小樽市とナホトカ市は、日本海を隔て相対する貿易港を持つ間柄であることから、対岸貿易の振興を図るとともに両市の経済的・文化的交流を通じて日ソ両国間の友好親善に貢献するため、当時あだちよごろうの安達与五郎市長がソ連を訪lhlの途中にナホトカ市を訪れた際姉妹都市の調印を行いました。人口約17万5千人のナホトカ市は、小樽市からナホトカでの交流696kmの距離にあります｡日本海に面した港湾都市で、極東における漁業や海運の中心地として発展してきた都市です。効率的な貨物輸送を行う目的で､1970年代前半にナホトカ港の束に新港(ボストーチヌイ)が建設され､1990年にはナホトカを含む地域が自由経済特区として指定されました。1967年財凌から1993年まで日本領事館も開設されていました。2.ダニーデン市(昭和55(1980)年7月25日姉妹都市提携）小樽市は昭和41(1966)年5月にラム・マトンの輪入港の指定を受けて以来、ニュージーランドとダニーデン市深い関わりがありました。そのため、人口、町並"}, {"seq": 192, "page": 181, "img": "guidebook_pages/p192.webp", "t": "み、歴史性など小樽にふさわしいニュージーランドの都市と姉妹都市提携を結び、相互の友好親善を深め、両市関係の発展に寄与したいと考えていたおり、駐日ニュージーランド大使館からダニーデン市の紹介を受け、昭和55(1980)年7月、スケッグス市長来樽時に姉妹都市の調印を行いました。ダニーデン市は小樽のはるか彼方10.320km、ニュージーランド南島の南東岸オタゴ湾の最深部に位置2クシンドニウエリントンクラ00Rigait2esa2S2ミドンク(e7人Kでーーンジンーランドで5番目の人口(約11万人)を有し、ビクトリア様式の建造物が多いことで知られています。19世紀の中頃にスコットランドからの移民によって建設されたことから、今でや「南海のエジンバラ」と称される都市です。また、ダニーデン市にはニュージーランド最古の大学であるオタゴ大学があり、伝統ある学園都市としても有名です。オクタゴンと呼ばれる八角形の広場を中心に整然とした町並みが特徴で、起伏の多い地形、港や歴史などが小樽とよく似ています。1998年に開基150周年を迎えまレ江3.ソウル特別市江西(カンソ)区(平成22(2010)年7月22日姉妹都市提携)小樽市とソウル特別市江西区とは1988年ころに、小樽の自動車学校が日本の指定自動車教習所制度などを教えたことがきっかけとなり、次第に市民、民間交流が広がりを見せ、両都市において民間交流協会が設立されました。平成18(2006)年に両協会の友好交流協定が結ばれ、平成21(2009)年に、小樽市において友好都市の調印が行なわれました。その後、友好団体やスポーツ分野でのさらなる交流の深まりを踏まえ、平成22(2010)年7月22日小樽市において姉妹都市の調印が行なわれました。韓国の首都ソウツルにある25の自治区のうち、江"}, {"seq": 193, "page": 182, "img": "guidebook_pages/p193.webp", "t": "西区は南西部に位置し、人口は約58万人。区内には、金浦(キムポ)国際空港があり、交通網が発達していることから、国内外の物流拠点ともなっているほか、朝鮮時代の遺跡、寺院や建物など多くの文化遺産を有する歴史あるまちです。4.外国人入込客数平成24(2012)年度北海道経済部観光局の観光客入込客数データによると、人小樽市での外国人宿泊客数は年間で45,491人。国別の多い順では香港、韓国、台湾、中国、シンガボールとなっています。ちなみに、後志全体では年間で191,593人。国別では香港、台湾、オーストラリア、韓国、シンガポールの順となっています。このように近年ではアジア各国から小樽へ訪れる観光客は増加しています。友好親善のために市民一人一人が国際化に向けて、おもてなしの心構えが必要な時代になってきたといえます。「小樽市」http://WWw.City.otaru.|1g.jp/『北海道観光入込客数調査報告書く資料編>平成24年度』北海道経済部観光局"}, {"seq": 194, "page": 183, "img": "guidebook_pages/p194.webp", "t": "小樽市の人口は平成25(2013)年12月末現在で127,224人で、前年同月比イナス2,210人となっています。道内での順位は札幌市、旭川市、了此館市、釧路市、苫小牧市、帯広市に次いで7番目です。明治2(1869)年、開拓使が設置され、小樽港を玄関口として多くの移民が内地から流入しはじめました。明治元(1868)年の小樽の人口は2,230人でしたが、明治13(1880)年の鉄道開通時には9,551人と約4倍、その後北防波堤の竣工、開拓物資の受け入れなど物流の拠点としてまちは繁栄し、明治末には9万人を超え、飛虫的に伸びました。大正11(1922)年の市制施行時には117,953人。以後、毎年約1万人増加し、昭和15(1940)年、高島町、朝里村合併で164,282人となりました。しかし、戦争に入り昭和20(1945)年までは人口増加率は低下していきました。昭和22(1947)年、戦後のベビーブームにより人口はまた増加していきました。昭和33(1958)年、塩谷村合併時には遂に20万人を超え、その後、昭和44(1969)年まで20万人台の時代が続きました。しかし、石油危機を契機とした長期的な景気の停滞や出生率の低下などで人口は毎年減少していきました。近年の人口減少傾向は大都市札幌への流出が最も大きな要因といえます。若者の就職先が札幌へ集中する傾向が強いことです。その結果として小樽市は人口に占める65歳以上の高齢者の比率が309%を超す高齢化の町となっています。小構市の高齢化率がいかに高いのかがわかります。"}, {"seq": 195, "page": 184, "img": "guidebook_pages/p195.webp", "t": ""}, {"seq": 196, "page": null, "img": "guidebook_pages/p196.webp", "t": ""}, {"seq": 197, "page": 185, "img": "guidebook_pages/p197.webp", "t": "1.市場と商店街古来、物資を交換する機会を市がたつ」といい、目立つ場所や定期的な日時をもって、開かれていました。出店者個人が「市がたつ」以前から、また「市」以外の場でも行われていましたが、商品の種類や品数に限りがあるので需要に応えられませんでした。つまり「個」より「群」の方が選択肢がはるかに多いので「市」が開かれてきまし「市」が固定して「市場」となり、近代以降に商店街、百貨店、スーパー、モールなどのさまざまな形態が登場し、それぞれの特徴をもって営業し還市場⑨ぐ南樽市場(南小樽市場協同組合)昭和21(1946)年、樺太からの引揚者らが勝納川沿いに長屋の店を開いたのがはじまりです。鮮魚店9店、青果店4証、精肉店2店、海産物・食料品雑貨・惣菜・ベーカリー・寿司・金物などの店が揃っています。⑥新南樽市場(丸市新南樽市場協同組合)マイカルの築港地区進出にともない、平成11(1999)年9月にオープンした小樽で最も新しい市場で誤本右(Y敵填人@"}, {"seq": 198, "page": 186, "img": "guidebook_pages/p198.webp", "t": "品本尉r敵店す。鮮魚・青果・薬・惣菜・漬物・食堂・ばんじゅうなど25店が営業しています。広い駐車場が完備されています。⑨⑤入船市場(入船市場組合)大正時代に、繊維問屋が軒を並べる地区にできた市場です。鮮魚店が充実しています。⑨落晃市場(氷見市場商業協同組合)戦後、樺太や満州からの引揚者が於吉発川の川べりに露店を開いたのがはじまりです。その後、川の上に丸太を渡して建物が建てられたりし、昭和371962)年の洪水で流されたものの、小様市営市場として再建され、現在の姿になっています。⑥三角市場(小樽駅前市場協同組合)昭和30955)年頃、手宮の朝市や漁場から仕入れた行商の人たち(ガンガン部隊)が集まって、次第に商店化をしてきました。海産物が中心で観光竹にも人気があります。⑨中央市場(小樽中央市場協同組合)昭和21(1946)年、外地からの引揚者が、現在地でバラックの仮店舗による営業をおこなったのがはじまりです。同31(1956)年にコンクリート3階建てになって、市民からは下駄履き市場として親しまれています。⑨中央卸市場(小樽中央卸商業協同組合)樺太からの引揚者が店を開き、昭和22(1947)年に42店舗からはじまりました。小樽駅に近かったことから、行商(ガンガン部隊)はここから仕入れてきました。同32(1957)年に現在のコンクリート4階建てになっています。中央市場(小樽中央市場協同組合)"}, {"seq": 199, "page": 187, "img": "guidebook_pages/p199.webp", "t": "●市場と商店街◎手宮市場（小樽丸共手宮市場商業協同組合）大正6（1917)年に開設された小樽でも古い市場です。中には大正時代から営業している老舗の鮮魚店もあります。建物は平成6（1994)年に改築されました。りんゆう◎鱗友朝市（小樽鱗友商業協同組合）ーご重言ﾐﾐこ=皇早朝3時から営業している小樽唯一の朝｢|jです。近くの公設卸売市場で競り落とされたばかりの商品がいち早く並びます。平成16(2004)年に現在の鉄筋造平屋の建物になっています。一一■商店街鱗友朝市◎都通り（小樽都通り商店街振興組合）通称「電気館通り」として賑わい、同10(1921)とうでんかい年には「稲電会」として発足し、昭和6（1931）年から「都通り」と呼ばれるようになりました。｜司41(1966)年にアーケードが整備されました。由り」◎サンモール都通り（小樽サンモールー番街商店街振興組合）昭和17(1942)年に｢稲穂銀座商店街｣として組合が発足し、平成2(1990)年にアーケードが整備され、「サンモールー番街｣と呼ばれるようになっています。丸井今井・大国屋・ニューギンザといった小樽三大百貨店に|丼|まれていましたが、最後の丸井が同17(2005)年に撤退しています。サンモール◎花銀（小樽花園銀座商店街振興組合）昭和42(1967)年に組合が結成されました。小樽の新倉屋､かま栄などの有名店の本店が並び｢本店通り」という異名もあります。夜の歓楽街とも接し、昼夜の賑わいはとぎれません。花銀"}, {"seq": 200, "page": 188, "img": "guidebook_pages/p200.webp", "t": "●市場と商店街‐や7よ刀ﾕわ◎梁川通り（小樽都通り梁川商店街振興組合）大正7（1918)年に「梁川親睦会」として発足しえのもとたけあきました。この地区は当時、榎本武揚が所有してりょうせんおり、その号「梁川」から命名されました。縦通りには中央市場があり、商店街と市場とが共存する特徴があり、小樽では最もレトロ感覚豊かな通りです。梁川通り◎公園通り（小樽公園通り商店街振興組合）大正13(1924)年に「花園本町会」として発足し、昭和23(1948)年に「花園本通り商店街」として再生し、同39(1964)年に法人化しました。文字通り小樽公園と中心市街地を結び、老舗も軒を連ねています。◎花園中央（小樽花園中央商店街振興組合）公園通り大正時代に「花園中央会」として発足し、昭和49(1974)年に「花園中央商店街振興組合」として法人化されました。明治44(1911)年創業の陶n曲器店、大正9（192())年創業の生花店や履物店、耐珊榊“昭和初期から続く文具店などの老舗も集まって■います。-･一己公ほくもん◎北門（小樽花園北門商店街振興組合）花園中央戦前は「北門町会」と称していましたが、昭和23(1948)年に「北門通り商店街」と再編成し、平成7（1995)年に「小樽花園北門商店街振興組\\合」として法人化されました。官庁（小樽市役ながくらしんばち所）や歓楽街と接し、新撰組の永倉新八ゆかりの立札もあります。繁り◎入船銀座（小樽入船銀座商店街振興組合）昭和のはじめに親睦団体「大交会」として発足北門し､昭和24(1949)年に｢入船商店会｣､|司29(1954）年に「入船銀座街｣、|1149(1974)年に「小樽入船銀座商店街振興組合｣として法人化されました。"}, {"seq": 201, "page": 189, "img": "guidebook_pages/p201.webp", "t": "老舗の浦鮭店や天ぷら店や質屋に当店などがありま2記⑥ぐ稲穂大通り(稲穂大通り商店会)明治から大正には色内が繁華街でしたが、昭和に入ってから笑穂・花園が中心市街地になってきた時に、この通りゃ賑やかになってきました。北洋銀行、北海道銀行、札幌銀行、北陸銀行、北海信金という人金融機関が客人集しています。⑥⑤稲穂本通り(稲穂本通り会商店会)昭和30年代までは容器・海産物・菓・印刷などの加工業が立地していましたが、名店街が誕生してからは、物販というより、美容、理容、不動産、飲食、ホール、クリーニングなど近隣市民の生活サービス業が集まるようになりました。⑥花銀3丁目(花園銀座3丁目会商店会)明治末期に「親栄会」。として組織されたことがはじまりです。昭和中期には映画館が密集していました。現在は飲食店が中心になっています。⑥花園大通り(花園大通り商店会)昭和10(935)年頃に商店会として発足しました。病院やサービス業などがあります。⑨ぐ第一ビル(駅前第二ビル商店会)昭和40て50(1965て75)年にかけて再開発された3つのビルのうちの1つです。小樽駅に最も近い商店会です。⑥〇サンポート(サンポート事業協同組合)駅前再開発を期に長崎屋出店とともに集約された組織で、平成13(2001)年に法人化されました。稲穂大通り長崎屋とサンポート"}, {"seq": 202, "page": 190, "img": "guidebook_pages/p202.webp", "t": "壮一避(r敵圭介小樽商工会議所1次・2次産業振興プロジェクト平成23年1月から、小樽商工会議所は人口減少に歯止めをかけるとともに地域経済活性化のため1次・2次産業、観光、港湾、商業の4つのプロジェクトを立ち上げました。このうち1次・2次産業振興プアロジェクトでは付加価値の高い食品や加工品の開発を目指し、農業と水産業の2分野で商品開発を行い生産者と加工業者、販売者を一体化させた新たな取り組みとして注目されています。小樽をイメージする一つのブランドを複数の企業で育てる仕組みはこれまで市内になかった試みです。小樽観光のおみやげとしてもゃ、今後の広がりに期待されています。画小樽美人農業分野の第1弾として未利用果実飲料開発事業委員会の女性メンバーが中心となり、商品企画からパッケージデザインまで手掛けました。余市町産、仁木町産の梅1006の梅酒ににアルロン酸、コンニノ2の6アロニテアポ果汗を添加レた梅酒「小樽美人」が開発され発売されました。その後、小樽美人プランドとして、余市町産プルーン酒、仁木町産プルーベリー酒、余市・仁木産アロニア酒、余市産桃酒も発売されています。田にしん小樽漬水産分野では、小樽の歴史と関わりのある人角の加工品を開発することになりました。函館の松前漬のような地域ブランドに育つことを願い、「にしん小樽漬」とネーミングされました。ーー開発に向けてはルールづくりが行われました。にしん小樽演コンセプトは水産加工業者だけでなく飲食店でも作れるようにすることですそのルールは①北海道産の儲を使うこと。②数の子、昆布を使うこと。③舞商品を強調するため触を販売容量の409%%以上入れ、醤油ベースであること。④他の具材、味付けは各社独自の製法とする。これらの基準に従った製品には統一のロゴマークが貼られています。現在、市内の水産加工業者や飲食店が製品として、またお店のメニューとして展開しています。このような開発プロジェクトは経済の活性化のみならず、小樽プランドとして観光にも大きく頁献していくことが期待されています。"}, {"seq": 203, "page": null, "img": "guidebook_pages/p203.webp", "t": "祭りとイベント冬の暮らし小樽の食文化"}, {"seq": 204, "page": 191, "img": "guidebook_pages/p204.webp", "t": "●祭りとイベント■祭りとイベント小樽には、20を超す、たくさんの神社があります。それぞれの神社は、創建以来、祭りなどを通じて常に地域社会と関わり、今口に至っています。北海道の神社は、主に海岸部の漁業や交易の守護としてまつられたお宮と、開拓とその後の農業林業の守護としてまつられたお宮に大別されます。小樽の神社も忍路場所請負人西川伝右衛門が漁業の守護として創建した忍路神社や移民の守護として榎本武場が創建した龍宮神社などがあります。各神社には例祭日があり、地域に根ざした祭りが毎年行なわれています。5月から7月にかけて各神社の祭りが集中し、小樽はお嗽子がいつも聞こえる季節を迎えます。また小樽には潮まつりに代表される観光祭りをはじめ、季節や地域ごとにたくさんのイベントが毎年行われます。■小樽市内のおもなお祭り日程祭典名開催場所お問い合わせ招魂祭花園5丁目(小樽公園）0134-22-1704不動院奥沢3丁目17-100134-22-7839潮見ケ岡神社若竹町1-100134-22-8230張碓稲荷神社舂香町2910134-22-7984(天満宮）小樽稲荷神社末広町38-10134-22-2591水天宮相生町3-10134-22-3495藺島神社藺島1丁目3-260134-26-1383(塩谷神社）龍宮神社稲穂3丁目22-110134-22-4268惠美須神社祝津3丁目1610134-34-3480豊足神社銭函2丁目9-100134-62-2847熊碓神社桜5丁目26-100134-22-7984(天満宮）忍路神社忍路1丁目4160134-64-2837(町内会長）高島稲荷神社高島3丁目14-10134-22-4318塩谷神社塩谷2丁目20-200134-26-1383住吉神社住ノ江2丁目5-10134-23-0785天満宮天神1丁目9-210134-22-7984朝里神社新光2丁目13-50134-22-7984(天満宮）"}, {"seq": 205, "page": 192, "img": "guidebook_pages/p205.webp", "t": "ィナメふ[TO潜信小樽の夏・冬を彩る2大イベントおたる潮まつり田おたる潮まつり誕生の経緯昭和33(1958)年の北海道博覧会成功を機に、それまで実施されてきた「港まつり」(昭和25(1950)年から)、「競争花火大会」(昭和281953)年から)、「北海道工業品共進会」(昭和25(1950年から)、「見本市」などを統合し「みなと小樽商工観光まつり」として昭和34(1959)年より昭和41(1966)年まで8回開催されます。これが前身となります。しかし「小樽の特徴がお生かされていない」などの意見もあり、一般市民9人をメンバーとする企画小委員会を設けられ、構想を練り、今日の「潤まつり」を提案する運びとなりました。そして昭和42(1967)年に第1回「おたる潮まつり」が第3埋頭で開催されました。会場は第2回からは小樽公園に移されましたが、昭和56(1981)年の第15回からは第3坦頭に戻り現在に至っています。毎年、市民及び札幌市など近隣市町村、さらに観光客などがたくさん訪れ、小構の夏を代表するイベントとして定着しています。画タイトル「潮」について海に育ち、海に生きる小樽市民の燃えるような意気と気概を「潮」のしぶきのイメージで表現したもので、動的な流れ、いわば虫進する郷土の明日のために考えついた名称です。較イベント概要・開催時期:7月後半の3日間開催。リルルク"}, {"seq": 206, "page": 193, "img": "guidebook_pages/p206.webp", "t": "・初日に「潮ふれこみ」、2日目に「潮ねりこみ」、最終日に漁船や屋形船による小樽港内パレードの「潮わたり」が行われます。また、大花火大会が行われます。・この祭りのメインイベントとも言えるのが「潮4でみぐでず。小樽市内外の企業や団体などでチームを結成し、市街地を「おたる清音頭」「潮おどり唄」を踊りながら練り歩きます。中には「とびいりDE踊り隊」と呼ばれる申し込みなしでも参加できる企画もやあります。コースは花園グリーンロードからメイン会場の第3埋頭まで。・おたる清音頭:作詞ンプ米谷祐司作編曲/春川一夫歌ノ有三波春夫・テイチク男声コーラス・潮おどり唄:作詞プ萩原頁作編曲ノ川越守歌美幌健参考資料おたる潮まつり公式ホームページhttp://0taru.ushiomatsuri.net/小樽雪あかりの路園イベント概要平成111999)年2月に市民有志により始まった「小樽雪あかりの路」は、キャンドルの灯火が古い街並みを優しく照らす幻想的なイベントです。運河会場、旧手宮線会場をメイン会場に開催され、毎年多くの来場者を迎えます。夕暮れ時から辺りが真っ暗になる時間まで、その日の空の色や天候により、毎日違った表情を楽しめます。運河の水面で陣く古い漁具をモチーフにした浮き玉キャンドル、旧手宮線会場の柔らかな光がともるスノーキャンドル、オブジェなど、多くがボランティアの手作業によるものです。朝里川温泉会場や天狗山会場などの、あかりの路会場も人気があり、ろうそくの温かなあかりが来場者をもてなします。男「小樽雪あかりの路」の名前の由来このイベントの名称は、小樽出身の作家、伊藤整(明治38(1905)年て昭和44(1969)年)の詩集『雪明りの路』の中の「雪夜」が由来となっています。あ>雪のあらしだ。PAたhaetI)"}, {"seq": 207, "page": 194, "img": "guidebook_pages/p207.webp", "t": "ANたlast)家々はその中に盲目になり身を伏せて埋もれてゐる。この恐ろしい夜でもそつと窓の雪を叩いて外を覗いてごらん。あの吹雪が木々に喰つて狂つて一しきり去つた後を気づかれない様に覗いてごらん。雪明りだよ。案外に明るくてもゃもう道なんか無くなつてゐるがしづかな青い雪明りだよ。弄イベントの原動力はボランティアスタッフこのイベントは延べ2,000人を超えるボランティア・スタッフが支えているといっても過言ではありません。厳しい寒さの中、イベント期間中は毎日、一つひとつのキャンドルを設置し、火を灯し、消えるたびにまた一つひとつ手で灯していくのです。町内会、各種団体をはじめ、韓国・中国などの海外からのボランティアの地道な作業により「あったかさ」を演出しているのです。画おもな受賞歴・第10回ふるさとイベント大賞で、道内初の「総務大臣表彰」受賞(F成18年度)・第2回JTB交流文化賞「最優秀賞」受賞(平成19年1月)・2003年(平成15年)度(社)日本青間生PEワートのに・2010年(平成22年)度国土交通省「地域づくり表彰」特別賞「日本政策投資銀行賞」受賞参考資料小樽雪あかりの路公式ホームページhttp://otaru.yukiakarinOmichi.0rg/"}, {"seq": 208, "page": 195, "img": "guidebook_pages/p208.webp", "t": "八角冬に雪のある暮らしは、私たちには当たり前ですが、本州から来られる人には見慣れないもの、奇妙に見えるものがたくさんあります。北海道独特の冬の暮らしに登場するものをおさらいしておきましょうっう。人@北海道の住宅冬の寒さを防ぐため、近年の北海道の住宅は高断熱・高気突となっています。また、効率の高い暖房方式や換気技術により、快適な住宅となっており、冬の寒さを防ぐだけでなく、夏の暑さにゃも対処できる住宅となっています。屋根:トタン区きの屋根が主流で、瓦屋根の家は、ほとんどありません。雪が落ちない平らな屋根もあります。:拓さを防ぐために、窓が二重になっています。硝子がペア硝子になっているものもあります。煙突:最近のストーブは吸排気口が璧から出ており、強制排気をしています。煙突のある家は少なくなりました。玄関:硝子で明った玄関フードが多く付いています。雨戸:北海道では雨戸のある家は、ほとんどありません。念灯油タンク灯油ストーブを使う家庭では家の外に大型の灯油タンクが設置されています。容量は200リットル以上のものが多く、北海道での灯油の消費量は、全国的にも非常に多いといわれています。人@びママさんダンプママさんが運転するダンプカーを連想する人が多いのですが、北海道での雪かきの道具のひとつです。大型の雪かきショベルのことで、別名スノーダンプとも呼ばれています。雪をたくさん載せて押しながら運びます。雪の多い小樽では雪かきは冬の大仕事です。普通のスコップなどでは、追いつかないので、ママさんダンプが活躍します。で測③/問信"}, {"seq": 209, "page": 196, "img": "guidebook_pages/p209.webp", "t": "●室内温度北海道の冬の室内温度は本州の人にとって、必要以上に高い温度に感じているはずです。暖房を強くし、半袖でビールを飲む人もいるくらいです。寒さが厳しい分、屋内は暖房温度を高くしているのです。こたつのように部分的な暖房ではなく、室内全体を暖房するのが北海道の特徴です。●水道凍結注意放送冬、翌朝の気温がかなり下がると予想されるとき、夜間、テレビのCM時間帯に水道凍結注意や天気予報でも凍結注意がでるのは北海道独特の放送です。●冬靴北海道では夏靴と冬靴を履き分けるのは当たり前です。これは凍結した路面では冬用の滑らない靴でなければ歩けないからです。最近の靴底素材は凍結路面などで滑るのを防ぐように加工されています。また、車のワイパーも冬用があります。これは普通のワイパーより幅が広く、低温にも耐えられるゴム質で、雪を掻き分けることができるものです。北海道の冬にはこのワイパーは欠かせません。●砂箱急勾配の道路端には砂袋が入った箱が設置されています。坂道で車がスリップした際道路に砂を撒いて発進できるようにするものです。●屋根の雪止め小樽では古い民家も多く残っていますが、その屋根には丸太や角材が組まれています。積もった雪が滑り落ちないようにするための「雪止め」です。トタン屋根の葺き方によっては金属製の雪止めもありますが、木材の雪止めは昔ながらの光景です。運河沿いの倉庫の屋根にも見られます。●小樽の冬の魚八角昔は大衆魚でしたが、今では高級魚になってしまいました。小樽周辺では昔からよく獲れていたのですが、一般に出回るようになったのは50年程前からで、かつては北海道では割とポピュラーな魚でした。八角は硬い皮を剥ぐと、とても艶やかでプリッとした白身が現れます。小樽の料理屋さんではこの獲れ立ての八角を姿造りにして出してくれる所もあります。ちょっとグロテスクなこの魚の姿に観光客のみなさんはきっとビックリすることと思いますが、刺身を一度口にしてみるとコリッとした淡白で繊細な味に満足するでしょう。刺身でよし、焼いてよし、「小樽の味」です。●冬の暮らし"}, {"seq": 210, "page": 197, "img": "guidebook_pages/p210.webp", "t": "小椅の代表的な食文化を伝えるとき、蒲鐘と菓子(餅類)があげられますが、これには歴史的背景があります。人浦魚「蒲欠」が書物に登場したのは、SIの「竹輪の由来」昔は、大名、旗本しか食べられないほごど高級品だった蒲鮮も、江戸時代中期以降には、武土、商人、町人へと順次広まっていきました。幕末になると下級武士は貧しくなり、旅先などでは蒲鮭が食べられなくなりました。一方、商人は金持ちになり、克沢な食事をするまでになっていました。そんな商人たちを見て、「下級人の分際で、武士の魂である鮭を食べるとは、何ごとぞ」と嫌がらせを言う武士がい7の7大<ざつら)(GSで)そこで、庶民は、武士に気兼ねして、蒲鐘と呼ばれていた人竹輪の切り口が竹の様であるところから、人竹輪と書き、武士には頃からです。そのころの書物に「かまぼこは浦の穂に、似せたる也」『宗吾1るところから、岸辺に育つ蒲の穂に似ているので、「蒲欠」と言う名がおこったのだといわれています。解からない隠語として竹輪と名小樽のかまぼこ製造は明治24、25(1891、92)年|3pょっです。ごろからはじまったと伝えられています。新潟県人の曲岩という人が蒲鍵工場を設けて、新潟県人を招いて製造したのがはじまりといわれています。昭和33(1958)年、小樽には約920(全業種)の工場がありましたが、このうち207が水産加工場でした。しかやも水産加工生産量の約40%は浦鍵で、他の加工癌は魚体に簡単に手を加えたにすぎないゃので、消鮭が工業製品といえるものでした。小樽で蒲鍵生産が盛んになったのは、前浜で漁獲される豊富な原料に恵まれたことと、葛らく過去の角加工で培われた高い加工技術にこよるものと思われます。昭和30(1955)年から35(1960)年が浦欠の街としてのピークでした。かつては40軒以上ありましたが、小樽の人口減少衰退と期を一にして、洒鍵業者も減少していき、現在では10数軒となりました。しかし小樽の蒲鍵は、現在でもその加工技術と味は評価が高く蒲欠の街としての誇りを感じさせてくれます。民生和9暮"}, {"seq": 211, "page": 198, "img": "guidebook_pages/p211.webp", "t": "箇9慕ど人@葉子小樽の菓子業の発祥は『小樽経済産業史』(昭和24(1959)年)に「明治初年開陽亭の上り坂三本木のそばに、人魚屋開業されたるが菓子店の元祖とするという。即ち千秋庵、布袋屋布袋辰二郎である」と記されています。小樽は北海道開拓の道央の玄関口として本州各地から生活文化が入ってきました。経路が北前船の西回り航路であったことから、京阪・北陸・越中・越後などの日本海側の文化が主流となりました。当初は餅菓子が中心でした。港が栄えていた頃は荷揚げ作業には、おにぎりよりや保存が利く餅が船員に重室されたようです。小樽に餅店や菓子店が多いのはこのような事情からと推測されます。また、小簡は北海道雑穀の集散地という経済的、地理的好人条件もあり、良質の北海道産原材料が豊富に得られたこと、日本海側から菓子職人が移住し、京阪地帯の菓子生産の伝統が小樽に定着したことゃ菓子業が盛んになった要因のひとつで小樽の菓子が高い評価を受けたのは、職人の伝統的技術水準が高かったことと、これらの地理的条件によるものだといわれています。戦前の小樽は製菓生産高は全道最大で、製品は道内各地に出荷されていました。また、小樽で育った多くの葉子職人も全道各地に散っていきました。「花月堂」は喜永4(1851)年に越後で創業、小樽での開業は明治37(1904)年。水晶あめ玉「澤の露」は明治44(1911)年創業の澤崎衛生堂から生まれま小樽を代表する浦欠と菓子は調べていくと、エピソードがたくさんありそうです。『小樽市史第5巻』小樽市昭和56年『小樽市史第10巻』社会経済編小樽市平成12年「橋本商会の背景」http://WWW.SUrIimi.CO.jD「かまぼこの歴史」http://kamaDok0.0r.jp「ちくわ風雲録」http://yamasa.chiKuwa.CO.jp"}, {"seq": 212, "page": 199, "img": "guidebook_pages/p212.webp", "t": "1.小樽の酒造史画北海道北海道では明治初期には、ほとんど米がとれず、その米を原料にしてつくる清酒は本州からの移入に頼っていました。北海道最初の清酒造りは、慶応2(1866)年に高島運上屋において、醸造されていた記録がありますが、米はもちろん、麹や醸造設備などすべてを移入しなければならず、品質は悪い上に量ゃ少なく、本州産とは比べるべくもありませんでした。その後、各地で品質向上の努力がはらわれ、道産米や研究されていきます。昭和5(1930)年の全国酒類醤油品評会において、道内出品79点のうち49点が入賞し、受賞率は全国ーーにまでなりました。それは上質な水と貯蔵環境という天恵に加えて、道産の酒造米研究や杜氏の技術向上に向けた和夫力の成果といえます。画小、樽明治に入ってからは、小樽・岩内・古平・島牧などで清酒の醸造が始まっていますが、これは北前船寄港地としての原材料調達の地の利によります。ただし零細な個人商店であり、交通手段も未整備なため販路も限らちられていました。開拓が進むにつれ、商業によって本州産の酒を玉党と*酒イマウ交イ邊『後志飲食物語』よりののの"}, {"seq": 213, "page": 200, "img": "guidebook_pages/p213.webp", "t": "にえ)仕入れ全道に販売していく商人が台頭してきます。大家支店、板谷合名会社、宅合名会社などは、堺・灘・伏見・越後の酒の特約店となって独占販売し明治21(1888)年には小構高島両郡酒造組合が創立されるほど増え、同27(1894)年には27カ所を数えるようになります。同36(1903)年には醸造戸数22戸、同38(1905)年の醸造石高は23,209石で全道一、明治後期には小樽は北海道の主要酒造地の位置づけになりますが、大正7(1918)年には旭川・札幌に抜かれ3位になってきます。ただこの段階でも、道産酒は全消費量の65%%で、残りは移入でした。販路は、提大正4(1915)年の第2回北海道酒和組合の品評会では、rorのが出品数341点の最高の優等賞を受賞しています。2.小樽の酒還北の営酒造(株)(清酒)創業:明治34(1901)年創始者:野口吉次朗主要銘柄:純米吟醸酒「雄冬」純米大吟醸酒「角・御殿」摘要:私設ミュージアム酒泉館」田曲イ田中酒造(株)(清酒)創業:明治32(1899)年創始者:田中市太郎主要銘柄:本醸造「宝川」大吟醸「室川」摘要:私設ミュージアム「亀甲蔵」北の誉「錬御殿」ラベル現在のラベル田中酒造本醸造「宝川」ラベル田中酒造大吟醸「宝川」ラベル画計おわおだな人「雪中花」ラベル山二わたなべ「北宝」ラベル『後志飲食物語』より"}, {"seq": 214, "page": 201, "img": "guidebook_pages/p214.webp", "t": "(株)山二わたなべ(清酒)ンao創業:明治12879)征創業者:渡辺仁佐衛門「魚と看」主要銘柄:大吟醸「雪中花」上揚鮮魚を扱う「魚河岸は「う摘要:本社社屋は昭和3(1928)年建築の小樽|おがし」と読み古くからある言市歴史的建造物指定画北海道ワイン(株)(ワイン)創業:昭和49(1974)年創始者・現代表者:記村彰薦主要銘柄:ガツウ完熟フリーラン」摘要:私設ミュージアム「ワインギャラリー」脅(株)アレフ(ビール)創業:昭和43(1968)年創始者:庄司昭夫主要銘柄:小樽ビール「ピルスナーのイスII摘要:ビアパブ小樽倉庫No1「完熟ナイアガラ」「ミュラー・叶ドジタクのwmfwwweTradmkwhcriveヴァイスタイブピール小樽ビール小樽ビールac「ヴァイス」ラベルラベル1小樽ビールに*特ビールrドンケル」多ドンケルタイプビールラベル小粒ビール葉です。魚は「うお」という訓読みが正規で、「さかな」というのは後になってから読まれるようになりました。ですから魚河岸は「さかながし」とは読みません。それは、「酒の着」からきています。酒にはツマミがつきものです。このツマミのことを「着」と書き「さかな」と読んでいますが、もともとは「酒菜」「酒媒」と書かれていました。日本は島国なので魚貝類が豊定です。したがってツマミの主流は魚貝類が添えられる率が圧倒的に高くなり、いつしか着に魚が重なり、魚を「さかな」と呼びようになりました。ちなみに中国では圧|倒的に鳥獣が多いようですので、着に魚というのは日本独自の食文化といえます。ノトゥル参考中笠『後志飲食物語後志飲食祭実行委員会の/WW.ぷ0/ルの2//2/rawwaioe者YT7P北海道ワイン本御旬酒北海道ワインが「ミュラー・トゥルガウ」ラベルにnM「後人食物年』よりにだえ】"}, {"seq": 215, "page": 202, "img": "guidebook_pages/p215.webp", "t": "塙一思恥雪豚＃内匠Ｌも夕ＦＩＨ弔《一毎夜日一言《苧毎ふ緬唖郵句ヴトマ涛鐙“一号．■司吋ｒ雫鋤抑手一二一ｰ熱f庄字牌「弦熟~四Q日＝＝雪必Pノ小樽の教育は明治6(1873)年､開運町の小樽郡教育所開設(量徳小学校)で始まり、同年高島教育所（現色内小学校)も開設されました。この年の小樽の人口は約4,500人位だったといわれています。育■市内の学校（『小樽市の教育平成25年度版』より）園児･児童･生徒･学生数総数，男’女1,180人612人568人5,0982,5662,5322,8321，4301,4023,6522,9371，715229134953,6022,0441,55816,593’8,7237，870，学校数公立，私立0校14校，教員数国立総数0校112人織一雌一別一旧|幼稚園小学校中学校高等学校特別支援学校大学総数小樽には小林多喜二や伊藤整を輩出した全国的にも有名な国立大学、小樽商科大学があります。小樽観光にも関係するので慨l11#を紹介します。■小樽商科大学小樽商科大学(英語表記:0taruUniversityofCommerce)は､昭和24(1949)年5月に設置されました。起源は、5番目の官立高等商業学校として|ﾘl治43(1910)年3月に設置され、翌44(1911)年5月に開校した小樽高等商業学校です。その後、||N和19(1944)年4月、小樽経済専門学校と改称されます。たるしよう一般的に道内では樽商とl1平ばれていますが､小樽市内では商大と呼ばれています。（ちなみに、小樽市内で「樽商」というと小樽商業高等学校を指すことが多い｡）全国の高等商業学校の中では早い時期、明治時代に設立されており、他の旧高商、"}, {"seq": 216, "page": 203, "img": "guidebook_pages/p216.webp", "t": "旧商大とゃも親交が深いようです。また、北海道で履少ない文科系の調和教育機関であったた文芸「(\\/駐志向の学生も入学し、小林多喜二や伊藤整といっNN溢た作家を輩出しました。現在、国立大学では唯一NS人人少ペがシの社会科学系単科大学です。OOでシ大学へ向かう坂道は「地獄坂」としても有名です。小樺商科大学学章(シンボルマーク)「ヘルメスの糞に一星」について平成10(1998)年10月1日に学章(シンボルマーク)が制定されまこの学章「ヘベルメスの要に一星」は、商業神ヘルメスの思の上にある一星が、北の大地から英知の光を放つ様子をあらわしたものです。下のリボンには、明治43(1910)年の創立とOtaruUniversityofCommerceの頭文字が示されています。ヘルメス(Hermes)は、ギリシャ神話の神の一人で伝令の神、また商業、学術などの神とされています。ローマではマーキュリー(Mercury)と呼ばれています。ヘルメスは2匹の蛇がからみついたの杖をもち、伝令の神として世界を飛翔しています。一星は、商大の前身である小樽高等商業学校以来、本学のシンボルとして用いられてきました。「北に一星あり。小なれどその輝光強し。」と誠われた商大の伝統を象徴しています。かつての地狼坂|矯老資料|『小樽市の教育】平成17年度上小樽教育委員会「小樽商科大学」小樽商科大学旧校舎(現存せず)http://WWW.0taru-UC.8C.jp/"}, {"seq": 217, "page": 204, "img": "guidebook_pages/p217.webp", "t": "●がおる■北海道の方言（小樽で使われる方言）●北海道の方言のなりたち北海道の方言には歴史的背景から、海岸部方言と内陸部方言に大きく分けることができます。北海道に和人が初めて渡ってきたのは鎌倉時代初期で、開発がはじまったのは室町時代末期からといわれています。蝦夷地の豊富な魚介類と交易を目的に松前付近を中心に移住してきました。移住者は当初、おもに下北、津軽半島の漁民でしたが、造船技術の進歩により大型船が造られるようになると秋田・山形・新潟・富山・石川．福井からも来道するようになりました。移住者は漁業を行うため海岸線沿いに定住していきました。このことから海岸部方言はおもに東北地方出身者によって形成され、北海道方言の基盤になりました。一方、内陸部の開発が本格化したのは明治2(1869)年、開拓使が置かれてからです。開拓使の拓殖計miにより、本州各県から移住民が大挙して来道しました。これは北辺の防備と本州の生活困窮者救済、開墾が目的でした。海岸部は数百年の間に徐々に開拓されましたが、内陸はわずか数十年の間に急速に開拓されました。また移住者の多くは農民や士族であったことや出身地が全国におよんでいたこともあり、海岸部とは異なることばが使われていました。同郷人の多い所では出身地のことばが使われていましたが、入植者が増え出身地が混じったところではことばが通じなかったため、意思の疎通ができることばを求め合い共通語化され、残ったことばが内陸部方言となりました。出身地の方言を捨て去る言語生活の積み重ねで、内陸の方言は形成されていきました。●小樽の方言このように海岸部方言と内陸部方言では歴史的背景に違いがあります。海岸部方言は道南を中心に、’二|本海側・太平洋側・オホーツク海側の海岸部で使われている"}, {"seq": 218, "page": 205, "img": "guidebook_pages/p218.webp", "t": "方言です。さらに分類すると松前郡一帯の「松前方言」と松前を除く渡島、檜山、後志地方の「道南方言」、道南以外の「道東、道北、オホーツク沿岸方言」に分けるととができます。小樽は「道南方言」に属していますが、その色彩は薄まりつつある地域といえます。久発音のおもな特徴Il表記引の還と上つIPの較別がつき(oeぐり:<例>すす(寿司、獅子)つつ(土、父、乳)つず(知事、地図)・「い」と「え」が混同している。く例>えだ(板、枝)えぎ(息、駅)・「へ」と「せ」が混同している。<例ツへなか(背中)かせる、かへる(食わせる)ことばの特徴・「べ」で二つの意味を表す。Wa人SSSり全くだろる2)・「ない」にあたるところは「ね」になる。<例>見ね(見ない)知らね(知らない)・助詞「に」「へ」「を」が「さ」になる。<例>船さ乗る(船に乗る)店さ寄る(店に寄る)人小樽でよく耳にするおもな方言・いやいや(やいや)あいづちに使います。「まあまあ」などあいまいな感じ。・いずい@いずい痛塗いこと。我慢できないほどではないが痛療い状態。・おがるおやもに植物が成長したときに使うが、こどもが成長したときにゃ使う2ことがある。・おばんでしたのこんばんは。なぜか過去形です。・がおる疲れ果てて死にそうになる。疲れるの最上級。・がさい(がっさ)物の状態がわるいこと。ダサイに似ている。・かっぱがすひっくり返す。@はかいく"}, {"seq": 219, "page": 206, "img": "guidebook_pages/p219.webp", "t": "・きかない勝気なこと。気丈。コレじゃっ紀い冷たい。・ちょす久る、いじる、ちょっかいを出す、からか2。0つ)つ)の3栓。「つっぺかう」(栓をしてふさぐ)・はかいくはかどる、作業が進む。・まかす撤き散らすこと。・まぶい美しい、かっこいい。・ゆるくないつらい、難しい、大変。介方言は文化遺産北海道の方言、特に後志以南の海岸部方言はいわゆる「浜ことば」といわれ、田舎の人の使う'悪いことば」だと思っている人が多いのですが、これは間違った考えです。ことばには地理的分布があり、分布範囲の広いことばが通用範囲も広く共通語となりました。方言は、その範囲が狭く地域に残っていきましたが、その方言は自分が作ったことばではなく、親やまたその親から伝承された地域の足重な文化遺産です。方言には由緒ある古語が使われていたり、標準語では表せない感情や状態、深みを表現できる魅力あることばです。方言の語源を探ると、もっと街の魅力を発見することができるかゃもしれません。和考中笠『北海道のことば北の生活文庫第8巻』北の生活文庫企画編集会議編平成11年『北海道の方言紀行』石垣福雄著北海道新聞社平成9年『北海道方言辞典』石垣福雄著北海道新聞社平成2年『マンガほっかいどう弁』北海道新聞社昭和63年『北海道方言の研究』小野米一著学芸図書株式会社平成5年"}, {"seq": 220, "page": null, "img": "guidebook_pages/p220.webp", "t": ""}, {"seq": 221, "page": 207, "img": "guidebook_pages/p221.webp", "t": "昌和気候で、夏はさわやか、冬は積雪寒冷を特徴としており、四季の移り変わりが鮮明札幌市の語源については、アイヌ話の「サッ・ポロ」(乾いた広いところ)とする説と「サリ・ポロ・ペッ」(大きな湿地のあるところ)とする説などがあります。アイヌの人たちが住んでいた昌夷地は、明治2(1869)年に北海道と改称されて、開拓使が置かれ札幌本府の建設が始まりました。判官・鳥義男は、円山の丘からはるか東方を見渡し、まちづくりの構想を練ったといわれています。明治8(1875)年、最初の市田兵が入植。人々は遠大な札幌建設計画に基づいて、鉄道を敷き、産業を興して、道都・札幌を築きました。大正11(1922)年の市制施行以来、近隣町村との度重なる合併・編入によって、市域・人口を拡大してきた札幌市は、昭和45(1970)年には人口が100万人を突破し、2年後の昭和47(1972)年に政令指定都市へ移行しています。明治2(1869)年の開拓使設置以来、北海道開拓の拠点として発展し続け、現在では人口185万人を超える(北海道の人口の約3割)、全国5番目の都市に成長しています。札幌市で開催される「さっぽろ雪まつり」や「YOSAKOIソーラン祭り」は全国的にも有名なイベントで、毎年たくさんの観光客が訪れます。札幌の観光地で有名なのは、時計台、テレビ塔、大通公園、北海道庁旧本庁舎(赤れんが)、北海道大学、大倉山ジャンプ競技場などです。また、食べ物では札幌ラーメン、ジンギスカンが根強い人気ですが、最近ではスープカレーも札幌発で新たな人気を得ています。置札幌市時計台(I旧札幌農学校演武場)く国指定重要文化財>札幌市時計台は、北海道大学の前身である札幌農学校の演武場として明治11(1878)年10月に建築されました。この建物はW・S・クラークの後を継いで教頭となったW・ホイラーによって構想されたもので、当時アメリカ中・西部で流行したバルーンフレームと呼ばれる木造建築様式をモデルとしたものです。団呈添芝久"}, {"seq": 222, "page": 208, "img": "guidebook_pages/p222.webp", "t": "団呈甘菩人(EE所札幌市中央区北1条西2丁目アクセス地下鉄全線「大通駅」下車徒歩約5分、JR「札幌駅」南口から徒歩で約10分問い合わせ札幌市時計台電話011-231-0838還北海道店旧本庁舎(赤れんが庁舎)ぐ国指定重要文化財>「赤れんが」の愛称で親しまれている北海道庁旧本庁舎は、明治21(1888)年にアメリカ風のネオ・バロック様式で建てられました。日本の明治期を代表する建物とともに、緑豊かな前庭は札幌市のオアシスとなっています。現在の「赤れんが」は実は2代目。最初の建物は煙突の不備により焼失してしまいました。庁舎の北側には「開拓使本庁舎跡」を示す石碑が立っています。また、内部は北海道の古文書などが収蔵された北海道立文書館として一般開放さルルMYまま9(5所札幌市中央区北3条西6丁目アクセスJR「札幌駅」下車徒歩10分。地下鉄全線「大通駅」または、地下鉄南北線・東豊線「さっぽろ駅」下車徒歩10駐車場無問い合わせ北海道店電話011-231-4111圏さっぽろテレビ塔大通公園の最東端にそびえ立つ高さ147.2メートルのテレビ塔は、大通公園のシンボル。昭和32(1957)年に電波の受信、発信塔として建てられましたが、現在はその役目をほぼ終え、展望台や土産物店、レストランなどがある観光名所となっています。(EE所札幌市中央区大通西1丁目アクセス地下鉄全線「大通駅」下車徒歩約5分問い合わせ株式会社さっぽろテレビ塔電話011-241-1131札幌市時計台サッポロビール国"}, {"seq": 223, "page": 209, "img": "guidebook_pages/p223.webp", "t": "団呈薄信男北海道大学明治9(1876)年、札幌農学校として生まれた北海道大学は、構内にハルニレ(エルムと呼ばれる)やイチョウ、ポプラなどの大木がいたるところに残り、夏にはたくさんの木際をつくってキャンパス人涼風を誘います。構内には重要文化財に指定された農学部第二農場、クラーク像やポプラ並木など、見どころもゃも多く、歴史を感じさせる各学部の建物とともに観光客に高い人気を得ています。人@資料[札幌市」http://WWwW.City.SaDpOr0.jD"}, {"seq": 224, "page": 210, "img": "guidebook_pages/p224.webp", "t": "団叶時穴念還後志地域北海道は14の行政上の区分をされています。天気予報でお馴染みの呼び名です。その中の後志地域は昭和30(1955)年以来約50年にわたって、以下の20市町村で構成されています。沿居部には小樽市・余市町・古平町・積丹町・神恵内村・泊村・岩内町・寿都町・鳥牧村が、農村部には赤井川村・仁木町・共和町・倶知安町・ニセコ町・真狩村・京極町・喜茂別町・留寿都村・蘭越町・黒松内町があります。沿則部の集落はいずれも便が押し寄せる浜であったことから誕生し今日の基章産業や漁業と水産加工業になっており、農村部は楓農・米作・畑作・果物などが基幹産業になっています。北海道を代表する山・羊踏山と、岬・神威岬を擁し、豊かな四季と山海の幸に恵まれ、温泉や海水浴場が整備され、山菜採りやアウトドアも盛んで、まさに北海首の縮図ともちいわれています。田小樽と後志総論として、「小樽の歴史・後志の自然」という認識が一般的です。従って異国情緒の小樽と、雄大な自然と山海の幸の後志という推奨がかなされてきました。逆に、小樽にゃ祝津海岸やオタモイ海岸のような海の絶景や、天狗山や毛無山や丸山のような山々があり、後志にも小樽に勝る歴史物語が数多く残されています。小樽の人御殿は泊村から、銀鱗蘭は余市町からの移築です。また小樽に来たお雇い外国人は明治ですが、既に幕末から岩内の茅沼炭鉱にイギリス人が調査に入っています。さらK人後志沿岸9市町寺はいずれも人角で集落が誕生しましたが、人触が獲れなくなってやゃ、角の加工は岩内が日本一、余市が2番目といったように今日も進化をし続けています。勿論、小樽も後志の一員ですから、あえて分類することでもなく、後志全体の観光振興に20市町村が共に手を取り合って励むやことが大事になります。"}, {"seq": 225, "page": 211, "img": "guidebook_pages/p225.webp", "t": ""}, {"seq": 226, "page": 212, "img": "guidebook_pages/p226.webp", "t": ""}, {"seq": 227, "page": null, "img": "guidebook_pages/p227.webp", "t": ""}, {"seq": 228, "page": null, "img": "guidebook_pages/p228.webp", "t": ""}, {"seq": 229, "page": null, "img": "guidebook_pages/p229.webp", "t": "唾寺』訂令もてなしの心構えjIf礎知識ガイドを実践する前に実践その他滝一"}, {"seq": 230, "page": 215, "img": "guidebook_pages/p230.webp", "t": "●おも喜品一鍔一天おもてなしの川幅え1マナーオリエンテーション■ホスピタリティおもてなしの心小樽は観光資源に恵まれています。自然環境や美味しい食べ物はもちろん、過去の人々が築き上げた多くの遺産があります。この素||青らしい資源を案内するには、ビジネススケールではなく、ヒューマンスケールでのホスピタリティあふれる対応がとても重要です。さまざまな業態・業種で、ものやサービスを売る消費中心の行為から、ホスピタリティへの変化が求められています。それは「買った」商品そのものへの満足に加えて、「あの人から買ってよかった｣、「あの店で買ってよかった」という、個別な印象を誰もが求めはじめているからです。一般の賊買行為でさえ､このようなホスピタリテイが求められているのですから、観光はもっと求められています。なぜなら、旅行者は非｢l常を求めて行動し、着いた先では「特別づくし」を期待しているからです。ホスピタリティとは、思いやり、感謝、おもてなし、癒し、他人への優しさなどを意味する言葉です。一人一人の個を尊重し、相手の立場を考え、相手の痛みを感じ取れる心のあり方ともいえます。人間は一人では生きられず、他人とのかかわりの'|｣でしか存在できません。そのかかわりを豊かなものにするためには、「まどころのふれあい」が、とても大切です。■人として小樽市民としてガイドとしてあなたは、何を求めて旅をしますか？リフレッシュするため、新しい情報を取り入れるため、｜全|分を見つめるため、誰かに会いに行くため・・いろいろな'三|的があると思います。非日常的な空間に身をおくことで、煩雑"}, {"seq": 231, "page": 216, "img": "guidebook_pages/p231.webp", "t": "EtAISIuiy)な日常を離れ、心身共に疹され英気を養えることも旅の大きな収穫です。あなたが旅行に行ったときのことを思い出してみましょう。あなたの思い出を彩る記憶には、どのようなものがありますか?さまざまな美しい景色、歴史に残る建造物、町並み、ホテル、美味しい食事・・・。これらをさらに楽しく懐かしくさせる、そこで言葉を交わした人々。その対応が悪かったときには、その土地の印象までもが人台無しにしなってしまったことはありませんか?ものやサービスではない、ホスピタリティ溢れる心の交流があったとき、その思い出・その土地は、とても心地よく懐かしく大切な心の宝物にもなるでしょう。観光産業に直接従事していないとしても、私たちは一人一人が市民として、小樽という観光を形づくる代表選手です。自分の家にお招きするように、小樽に生きるすべての人が小樽市民として、小樽を訪れてくださる人々に「ようこそ!いらっしゃいませ!」「楽しい旅を!」の心からの対応があれば、それは極上の旅となり、2度3度と足を運んでいただける魅力ある観光地となるのです。男笑顔と声がけは最小にして最大のおもてなし小樽は山に抱かれ海を抱き、自然の幸は小樽観光の大きな魅力にもなっています。そういった環境で、少々荒っぽい言葉も飛び交います。土地特有の浜言葉やなぶっきらぼうな態度は、文化の知う人々には時として不愉快に映ることもあります。方言はその土地のユニークな魅力でもあります。そこに笑顔と気さくな声がけがあれば、旅は印象深く魅力的に彩りられることでしょう。難しいことはいりません。どこでもどんなときも誰にでも、心のこもった笑顔と、ちょっとした声がけは最小にして最大のおもてなしです。2.基礎知識.時基礎知識確認ガイドには、各ジャンルの基礎知識が必要です。歴史的物語、歴史的遺産の内容、文化・レジャー施設・食に関する情報(食材知識、施設、飲食店)など、十分な基稚知識を持ちましょう。また情報は日々刻々変化するので、関係機関やテレビ・ラジオ・インターネット・情報誌などで更新することを心がけましょ5。"}, {"seq": 232, "page": 217, "img": "guidebook_pages/p232.webp", "t": "●おも忘易一繕一弐■マニュアル作成調べた情報は、各ジャンルごと整理してマニュアル化しておきます。観光協会やボランティア団体などのガイドブックを基本に、自分なりの情報や提案を盛り込んだオリジナリティあるものをつくりましょう。形は自分なりでよいですが、情報には時間経過によって変化や増幅がありますから、バインダー形式などが便利です。経験が増えていくつかのコース傾lhjがはっきりしたり基本ガイドによってコースがある場合は、コース別にマニュアルを用意しましょう。3．ガイドを実践する前に■実地研修実際のガイドでは、初対面の旅行者の方々に直接さまざまなアプローチをすることになります。そのときになってから流れや組み立てをしていたのでは、時間がかかるばかりか楽しい旅行を演出するには無理があります。スムーズで充実したガイドをするためには、シミュレーションが不可欠です。説明も、実際に誰かに聞き役になってもらうという疑似体験をすることにより、よりよい案内ができるようになるでしょう。このときには、移動や説明などに実際にかかる時間を把握したり、案内するものがよく見えるガイド位置、トイレや飲食の場所や時間の設定など、細かなチェックをしてください。また、旅の思い出となる写真撮影のポイントなども重要で、とても喜ばれる提案になります｡これら事前シミュレーションにより気持ちにも余裕が生まれるため､充実したガイドができるようになるでしょう。■オリジナリティ人はそれぞれに素I青らしい個性を備えています。もちろんあなたもです。ガイドのための基本的なマニュアルができたら､ぜひ自分なりの感性を添えてみましょう。例えば、料理が得意なら食材に対しての調理アドバイスを、歌が得意なら小樽ゆかりの歌の披露など、人物像に詳しければ、その皿味深い話などを。また、自分の周りの多方面の人々に聞く情報も､視点や考え方が広がり、よいエッセンスとなるでしょう。ただし、あくまでもお客様の反応を見ながら、決して知識のひけらかしや自慢の押し付けなどにならないように気をつけましょう｡少しの量で本来のものをピリッと引き立てるスパイスのようなさじ加減を心がけましよう。思い出に残るような楽しいガイドをすることは､小樽観光にとって大変大きな貢献となるでしょう。"}, {"seq": 233, "page": 218, "img": "guidebook_pages/p233.webp", "t": "[ガイドを依頼された時]画情報収集(1)地元サイドの情報収集をします。情報は絶えず変化しています。基本情報に加え、変化していることがないか、それらに付随するタイムリーなトピックス情報はないかなど常に広く収集します。関係機関情報や社会情勢など、関連事項に日々敏感でいることもゃ大切です。基本的なマニュアルにそれらの情報を見やすく付け加えたものを用意しましょうり。画情報収集(2)お迎えするお客様の情報を把握します。スケジュール・人数・年齢層・旅行の目的・要望など情報が多いほど、求めているものに対して的確なガイドを実践することができ、お客様の満足感がぶ高まります。あらかじめこちらの知りたい情報を依頼先などにお願いしておくのもよいでしょう。これらもゃも基本マニュアルに付け加えておきましょうら。田プレゼンテーションお客様のニーズを把握できたら、まず希望に沿える基本のガイドスケジュールを作ります。それにあわせて自分なりのオリジナルな提案などがあれば、どこで提供できるかなど組み立てましょう。その人の個性が出た提案があれば、話題性もあり、新客の掘り起こしに一役買うことにもなるでしょう。ただし、押し売りはいけません。あくまでも引き立つような演出にとどめます。[実践]因服装・身だしなみ服装は、あまりに装飾性の強いものや華美なものは避けましょう。しかし、知らない土地の中でのお客様の誘導をするので、すべてが地味なもるのよりは目立つように明るい色合いで動きやすい物のほうがよいでしょう。制服や規定のTシャツ・ジャンパーなどがあれば、必ず着用しましょ5。眼から入る情報は、大きな影響力を持ちます。きちんとした清潔感のある身だしなみで、親しみやすく好感をもっていただけるように留意しましょう。グ7ざ@"}, {"seq": 234, "page": 219, "img": "guidebook_pages/p234.webp", "t": "●おも妄品一捲一表■携帯品・提供品持ち物は事前に必ずチェックしましょう。ガイドブックやパンフレット、マニュアルや地|X|など、必要な携帯品や提供品のチェックリストを川意し、それに従って事前チェックをすればミスも防げるでしょう。携帯電話は緊急時対応の場合などでも必需品です。ご案内する場所においては、靴ずれやちょっとした切り傷などに対応する絆創膏や、虫除けや虫刺され薬なども用意しておくとよいでしょう。また、ガイド中は､両手を自由に使える状態が基本です｡荷物を手に持たず､リュックやウエストポーチなどで両手を空けておきましょう。■待ち合わせ◎待ち合わせ場所駅、ターミナル、観光案内所、ホテルなど、わかりやすい場所にします。公共的で、観光客の誰もがわかる場所や地図に明記されている場所がよいでしょう。初めて訪れる場所ですから、地元の慣れた認識とは異なることを肝に銘じて、初めての方でもよくわかるように、行き違いのないよう細かく指示することが必要です。できれば事前に、言葉だけではなく詳糸lllな地図を渡せると理想的です◎時間厳守慣れない土地での移動なので、時間より早く来るお客様も多数いらっしやいます。お客様の信頼と安心感を得るためにも、約束の時間間よよりり最最低低ででもも2200分分程程はは先先にに出出向向いいてていいるるよよううににししまますす。。理理想想的的にには30分前には到着し、気持ちを落ち着かせて挨拶や組み立てのおさらいや、周りの状況確認などができることが望ましいでしょう。◎目立つように初対面のお客様がほとんどです。一目でガイドとわかるように、制服や腕章・タスキ・旗・名札など、眼に留まる格好をしましょう。■挨拶・言葉遣い第一印象はとても大切です。大きな声で、元気よく「ようこそ！いらっしゃいました！」の言葉に心からの気持ちを込めて、笑顔でご挨拶します。このときには、お－人お一人にきちんと||艮を合わせるアイコンタクトを忘れないようにしましょう。あまり堅苦しい言葉遣いで親近感がうまれず楽しめないのでは、せっかくの旅行も台無しです。お客様を尊重し、リラックスして楽しい会話を心がけましょう。方言もその土地の魅力です。意味が通じないのは困りますが、説明しつつ織り交ぜるととても魅力的なガイドができるのではないでしょうか。ただし、あくまでもお客様ですから、途中は状況に合わせてフレンドリーな会話でも、お迎えする時とお見送"}, {"seq": 235, "page": 220, "img": "guidebook_pages/p235.webp", "t": "Ei)SIAlu)りの時には、立場をはっきりさせた丁寧な言葉使いをしましょ2う。男引率・誘導常にお客様の興味やペース・体調などに留意しながら歩きます。説明や指示の声が、全体に聞こえているかやも時を々チェックしましょう。また、人数が多い場合、全体を一人で把握することはなかなか容易なことではありません。最初に、グループ化をしてお互いで状況を管理しあう方法なども有効です。ご案内のときに、一方的な説明だけではなくお互いのコミュニケーションがとれる会話などを心がけると、一体感や共有感が増し、思い出深い観光になることでしょう。常に人数確認もします。あらかじめ想定した案内時間に準じ、時間内にスケジュール通りの行動ができるよう配慮しましょう。画観光施設使用時の留意点施設側へは、事前に連絡を入れておくのが一番よいでしょう。施設利用の際は、訪問先に必ず挨拶をします。施設にこよって、撮影禁止や歩行順序、飲食の規制など注意事項がある場合も多くあります。事前に確認したうえ、必ずお客様にお知らせします。ガイドが入館できない場合もあります。その場合は、お客様にその旨を説明し、施設利用後の待ち合わせ場所と時間を確認し、待機します。待機中といえども、お客様をお見送りするまではガイドとしての仕事です。品位を保つ適切な態度で過ごしましょう。また、施設内の不備などに気づいた場合は、ガイド終了後の報告事項などで自分の所属組織に報告し対応してもらいます。個人で施設に直接指摘することは避けましょう。画休憩時の留意点基本的には、お客様とは別に休憩することが望ましいでしょう。自分自身のリラックスの時間や、行程の見直しや予習などの時間は、その後のガイドにもゃ役立つでしょう。別に休憩する場合は、次のガイド開始時間と待ち合わせ場所を決めて別行動をとります。開始時間には遅れないよう、お迎えのとき同様、少なくとも5分ほどは早めに待機します。お客様と一緒に休憩をとる場合は、あくまでも仕事の延長となりますから、立場をわきまえた過ごし方をしましょう。お客様からのもてなしは原則的には遠慮します。しかし、相互の感情的配慮もやあるので、和常識的な範囲であれば感謝の気持ちをもって応じることもよいでしょう。忘れ物が発生しやすいのも休憩時の特徴です。"}, {"seq": 236, "page": 221, "img": "guidebook_pages/p236.webp", "t": "●おも蟇品一鑑一えお客様の忘れ物がないかもチェックします。全国的・国際的に禁煙が広まっている中、｜喫煙しない方々も多くなっています。原則禁煙を励行しましょう。■緊急時の対応万一、緊急事態が発生した場合は、適切な機関に迅速に連絡を取り対処します。このためにも携帯電話は必需品ですし、関係各所（警察署・交番・救急病院・市役所観光課・各団体など）の住所や電話番号は必ずリストアップし、携行しましょう。現場での対処が必要な場合も、決して素人判断で自己処理せず、必ず関係機関に連絡を取った上で指示を仰ぎ行動しましょう。■終了時の対応と留意点お見送りの際には、今回小樽観光をしていただいたお礼、無事終了できたお礼を心を込めてお伝えします｡お客様と感想を話し合うことも大きく共有感を増します。感想を聞くことはガイドとしての評価にもなるので、素直に受け止め、自分の成長や喜びとしましょう。お客様からの要望や不満などは、アンケート用紙を配るなどすると伝えていただけるでしょう。これらにより、さまざまなデータを蓄積することができ、次回のガイドや小榑観光に反映させることができます。アンケート用紙は事前に用意しましょう。今回ご案内できなかったたくさんの見所もさりげなくご説明し、リピートにつなげましょう。謝礼や心づけは、丁寧に辞退します。忘れ物がないか確認し、帰路の無事を願ってお見送りします。[終了後］■報告書・記録作成終了後、記憶が新しいうちに報告害を作成します。記録を残しておくことで、情報の把握にもなりますし、よりよい業務に反映させることができます。それは、小樽観光の質を上げるためにも有効な情報となります。必要事項のほか、お客様との会話や、糸|||々した出来事も記入しておきましょう。自分自身の客観的な反省も書きとめ大いに今後の参考にしましょう。各施設や交通機関、観光ポイントなどに事前情報と相違や変化があった場合なども、書き換えておきましょう。"}, {"seq": 237, "page": 222, "img": "guidebook_pages/p237.webp", "t": "●おも暮しの捲一エ■お礼状など所属機関の考え方もありますが、差し支えなければお礼の手紙を出すことなどは、旅の思い出を更に印象深いものにしてくれるものです。人と人の心の交流こそが観光の真髄だからです。それはガイドにとっても感動的な宝物となるでしょう。リピートを促す最大のアブ°ローチともいえます。5．身障者の方々や特別なニーズへの対応と情報把握昨今バリアフリーが標準化されてきているようにいわれますが、当事者の方々にとってはまだまだ十分ではありません。トイレの場所や、車椅子乗り入れ可能な施設､交通機関､透析対応病院など、さまざまな関係各所の情報を把握しておきましょう。どのようなニーズがあるのか､実際に当事者の方々や介護施設､福祉施設の方々に尋ねてみるのもよいでしょう。得られた情報は、一覧や地|X|にしたりして、見や川しやすくまとめておきましょう。バリアフリー対応になっていとも、「人の力」でバリアをなくすことができます。添者に対応の仕方を確認してから対処しましょう）＊小樽の街は坂道が多く、しかもバリアフリー対応の施設が少ないのが現状です。皆の人力でバリアを取り除きましょう！6．「3おたる案内人』に』必要なコミュニケーション能力ごクレームを発生さ冒せないために～お迎えする側と訪ねる側との一期一会の交流は、その人生を彩る価値あることになってほしいものです。それが、つかの間の時間であっても、楽しく、または癒され、英気を養われるものとなるのが理想であり望まれることではないでしょうか。「おたる案内人」としてさまざまな知識を有し、それを提供するだけなら、パンフレットなど活字での情報提供、あるいは、レコーダーや機械でのアナウンスで事足りるでしょう。しかし、このアプローチは一方通行です。知識や情報はその地へ赴かなくても、今やインターネットではクリック－つで、書店に行けば大量の情報満載旅行ガイドブックで、テレビのスイッチを入れれば多彩な番組で得られます。時間と費用をかけて現地へ赴かなければ手に入れることができないもの､それが、その瞬間瞬間での双方の関わり、つまりコミュニケーションにより創られる体験なのです。"}, {"seq": 238, "page": 223, "img": "guidebook_pages/p238.webp", "t": "●雪妄し忠豐「知識」ではなく「体験」です。人は自身の「体験」でしか、ほんとうに理解することはできないともいわれます。二度と同じことは起こることのない、その瞬間のコミュニケーションで創られる最高の感動を提供するのが「おもてなし｣、「おたる案内人」なのです。ではコミュニケーションとはいったいどのようなものでしょうか。コミュニケーションには、大きく分けて、「自身との内的コミュニケーション」と「他者との外的コミュニケーション」がありますが、ここでは「外的コミュニケーション」を扱うこととします。「おたる案内人」が実践することは、「知識の受け渡し」ではなく、観光にいらした方々とのコミュニケーションです。大切なことは「どう伝えたか」ではなく「どう伝わったのか」です。私たちは、常に自分の周りの存在とコミュニケーションを取りながら生きています。しかし、言葉(知識ともおきかえられる)のみでコミュニケーションを行っているわけではありません。例えば､会話そのものをしなくても、相手の状況や心情をくみ取りながら対応し、次の行動を選択しています。態度やしぐさ・表情も大きな認知要素となります。心理学者などの実験によれば、初対面の時、相手の印象を決める要素として言葉そのものから受ける影響は非常に少なく、代わりに声の大きさやトーン・速さ、態度やしぐさ・表情などが90％以上を占めるなどのデータがあります｡自分を振り返ってみても、なるほど、納得のいくことが思い当たるのではないでしょうか。■ここで、観光地で多く聞かれるクレームを、少しご紹介しましょう。●お客様からは、「ガイドさんの話が一方的でつまらなかった｡」「次の目的地まで何分かかるかわからず不安だった｡」「その場所でゆっくりしたかったのにせかされて落ち着かなかった｡」「質問しても怪訊な顔をされて十分に答えてもらえなかった｡」「違うところに行きたかったのに薦められて断れなかった｡」等々。●ガイドさんからは、「あれもしたいこれもしたいと言われたが､時間がなくて困った｡」「こちらが熱心に話しているのに、お客様が聞いてくれない｡」「まったく時間を気にしないお客様で、時間のことを言うと嫌な顔をされた｡」「せっかく食事の穴場を紹介したのに行かなかった｡」「安く買える店を紹介したのに買わなかった｡」等々。これらのコミュニケーションを円滑かつ有効にするには、やはりそれなりの対応力を要します。同じ内容でも、使う言葉によって伝わり方も変化します。表現の豊かさ、ネガティブではなくポジティブな言い回しや問いかけの仕方、相手の言葉の受け取り方、自分の主張や提言の柔らかな伝え方、感情の伝え方などです。"}, {"seq": 239, "page": 224, "img": "guidebook_pages/p239.webp", "t": "●おもてなしの心構一三私たちがものごとを認識するということは、それぞれの生活環境や育ち方・価値観など多様な影響を受けています。地域が違えば、常識の捉え方も考え方も違います。人それぞれに、明確に言葉では表せないものがあるのです。このように、自分が伝えたつもりでも、そのとおりに相手が受け取っていない場合があります。これが、「どう伝えたか」ではなく「どう伝わったのか」が大切という所以です。コミュニケーションは双方向の発信と受信といいましたが、伝え方が発信だとすれば受信は聴き方となります。「聞く」のではなく「聴く」のです。相手の欲求や真意を的確に受け取れなければ、独りよがりな対応や望まれない間違った対応をしてしまい、前出のようなクレームとなってしまうことにもなります。せっかくよかれと思ってしていることが、クレームとなってしまうことがあります。これらのことを念頭に置き、十分に配盧することが重要です。コミュニケーション能力は、まさに実践でしか身につけることも上達することもできません。上手にできるようになるまでには、失敗もあるかもしれませんが、大いに学びながら実践を積んでいく他はありません。まずは第一歩の笑顔と挨拶を大切にし、ぜひ自分なりの努力と工夫を実践してください。"}, {"seq": 240, "page": null, "img": "guidebook_pages/p240.webp", "t": ""}, {"seq": 241, "page": null, "img": "guidebook_pages/p241.webp", "t": ""}, {"seq": 242, "page": 226, "img": "guidebook_pages/p242.webp", "t": "｜’’■文化財●国指定史跡手宮洞窟(TemiyaCave)の洋風石造建築を代表する建物のひとつです｡純■所在地：小樽市手宮1丁目3番4号石造2階建てで内部は漆喰壁に北海道産木材のワニ■指定年月日：大正10(1921)年3月3日ス塗装で､落ち着いた重厚なデザインに統一され■管理者：小樽市教育委員会生涯学習課ています。TEL､32-4111(内線531)当時この建物前面には、専用の船入澗、輸出入手宮洞窟は慶応2(1866)年に小田原の石工長兵衛倉庫があり建物の裏側には鉄道が走るという営業が建築用石材捜しの際に偶然洞窟に入り彫刻を発のための好施設が完備しておりました｡この建物見したといわれています。は昭和29(1954)年まで支店に使われていましたが、この岩壁彫刻を最初に学界に発表したのは英国昭和30(1955)年に市が譲り受け、その後、昭和44人地震学者ジョン・ミルンで､明治12(1879)年夏、(1969)年に国の重要文化財に指定され､昭和59(1984）現地を訪れて彫刻を模写し、翌13(1880)年『アジ年から3年間､全面的な修理復元工事を行い､当時ア協会誌』にその全貌を紹介しました。の雰囲気を再現しました。この彫刻は､古代岩壁彫刻として研究されています｡平成元(1989)年に行われた発掘調査ではそ●道指定史跡の出土遺物から､洞窟壁画は約1,600年前に刻まれ地嶺山環状列石(ZichinyamaStoneCircle)たものであることが判明しています｡この遺跡は■所在地：小樽市忍路2丁目考古・人類学上､古代人の精神文化を知る上で第■指定年月日：昭和25(1950)年8月28日1級の遺跡といえます。■管理者：小樽市教育委員会生涯学習課TEL.32-4111(内線531)●国指定史跡忍路環状列石の西､約1kmのところにある地鎮山忍路環状列石(OshoroStoneCircle)(標高50m)の山頂に位置しています｡その形は楕円■所在地：小樽市忍路2丁目形で､12個の大石が10m×8mの規模に配置されてい■指定年月日：昭和36(1961)年3月10日ます｡昭和24(1949)年に行われた発掘調査では中■管理者：小樽市教育委員会生涯学習課央よりやや南寄りに円形に小さな円石を集めた部TEL､32-4111(内線531)分がみられ､その地下から2m×2mほど．深さ1m方忍路環状列石は三笠山山麓の緩斜面を平坦にカッ形の墓穴が発見されています｡底には川原石とみトし、その面に、大きな立石とその周囲に小石をられる円石が敷かれていました｡この遺跡も縄文並べたものを大きな楕円形(33m×22m)にめぐらせ時代後期の区画墓の一種と考えられています。ているものです｡この遺跡は､縄文時代後期(約3,500年前)のもので、この時代に出現する「区画墓」と●道指定有形文化財呼ばれる集団の墓地と考えられています｡文久元にしん漁場建築(旧田中家母屋）(1861)年に発見され､大規模な土木工事の結果つ(PalatialHouseofHerringFishermanくられたこの環状列石から、この地域に住んでい(NishinGoten))た集団の力を読み取ることができます｡この環状■所在地：小樽市祝津3丁目228番地列石の北側に隣接する同じ時代の忍路土場遺跡かTEL.0134-22-1038らは発掘調査で巨大木柱が発見されており、環状■建築年代：明治26(1893)年列石と関連する祭祀的な遺跡と考えられています。■指定年月日：昭和35(1960)年5月31日■管理者：小樽市(経済部観光振興室）●国指定重要文化財旧日本郵船(株)小樽支店TEL.32-4111(内線266)(FormerNihonYusenCo.,LtdOtaruBranch)明治から大正年間にかけて､日本海沿岸地域で■所在地：小樽市色内3丁目7番8号は鰊漁で大いににぎわい、繁栄しました。その漁TEL.0134-22-3316場経営者たちは豊富な資金を利用し母屋を中心と■建築年代：明治37(1904)年する番屋､蔵などの大規模な施設を沿岸各地に建■指定年月日：昭和44(1969)年3月12日設していきました｡この建物はそのうちの一つで、■管理者：小樽市教育委員会生涯学習課積丹半島の泊村に漁場を経営していた田中福松のTEL､32-4111(内線531)住居兼作業場の母屋です｡この建物は明治24(1891）重要文化財旧日本郵船株式会社小樽支店は明治年から基礎工事にかかり、同26(1893)年に建築に37(1904)年に着工し､明治39(1906)年に落成しま着手、同30(1897)年に竣工しました。その後、昭した｡設計者は工部大学校造家学科(東大工学部建和33(1958)年、現在地へ移築されたものです。豊築学科の前身)の第一期生､佐立七次郎です｡明治富な道産の木材を使った梁や柱､また東北地方か"}, {"seq": 243, "page": 227, "img": "guidebook_pages/p243.webp", "t": "ら取り寄せたと思われる檜などがふんだんに使われ、建築者の財力の一端をうかがうことができます。建物の外観は特徴的な大屋根中央の切妻造りの天窓、伽藍調を帯びた大屋根の底などが目を引きます。建物内部には資料コーナーに、角・漁の様子を写真などで展示しています。@道指定有形文化財木造五百維漢像(WoodenGohyakuRakanStatues)還所在地:小樽市潮見台1丁目19番10号置指定年月日:平成6(1994)年2月9日画管理者:宗園寺TEL.0134-22-7772五百苺漢像を安置している宗園寺は、寛永7(1630)年松前藩主7代公廣の追善供養のため福山に建立されましたが、明治42(1909)年に羅漢像や建物の部材とともに小樽に移設されたものです。この五百羅漢像は、14代章廣が供養のため南部藩主に依頼し、文政8(1825)年盛岡より勧請し宗園寺に納めたといわれていますが、室町て桃山時代の作と思われるもの11体、江戸中期のもの236体、江戸末期のもの268体という調査結果が報告されています。このうち江戸中期のゃのの製作者名「睡常(うちんじょう)」は最近の調査で松前に居住した能面師であったことが判りました。以上のように羅漢像の大半が江戸中期から末期のものであり、製作者についてゃ一様ではありませんが、北海道での仏教信仰や彫刻の歴史を考えるうえで重要な資料となっています。久国指定重要文化財旧手宮鉄道施設(FormerRailwayFacilitiesinTemiya)画指定年月日:平成13(2001)年11月14日@市指定史跡北海道鉄道開通起点(HokkaidoRailwayPointofOrigin)画指定年月日:昭和41(1966)年11月3日較所在地:小樽市手宮1丁目画管理者:小樽市教育委員会生涯学習課TEL.32-4111(内線531)北海道最初の鉄道はアメリカ人技師ジョセフ・U・クロフォードの指揮の下、明治13(1880)年に手宮と札幌間にひかれました。この鉄道は、本格的な鉄道としては新橋一横浜間、神戸一大阪間に続くもので、北海道の内陸部に米や生活物資を運ぶ生命線でした。本州などに運ばれた石炭は、日本の近代化に大きく貢献しました。旧手宮鉄道施設は、現存する日本最古の機関車庫=機関車庫3号(明治18(1885)年)、機関車庫1号、転車台、貯水槽、危険品庫、擁壁から構成されており、蒸気機関車が主流であった時代の鉄道システムを現在に伝えるものです。@市指定有形文化財日本銀行旧小樽支店置所在地:小樽市色内1丁目11番16号画指定年月日:平成14(2002)年9月17日画管理者:日本銀行TEL.0134-21-1111小樽に日本銀行の派出所が初めて開設されたのは明治26(1893)年のことで、その後出張所を経て小樽支店に昇格となり、平成14(2002)年9月に営業を廃止するまで、地方経済の発展に重要な役割を果たしました。現在の建物は、明治42(1909)年7月に着工し、明治45(1912)年7月に完成したもので、北海道経済を担った小樽を代表する建物です。石造り風の外観は、れんが造りの璧にモルタルを塗ったもので、銅茸きの屋根とともに銀行建築にふさわしい重厚な印象を与えています。設計者は、日本近代様式建築の先駆者である辰野金吾、長野宇平治、岡田信一郎の連名で記録されています。辰野は、日本銀行本店や東京駅といった明治・大正を代表する数多くの建物を設計しており、東京駅に代表される、赤れんがと白い花賠岩を組合せた「辰野式」と呼ばれている様式でも有名です。「辰野式」とは異なる外観のこの建物は、当時まだ20代の新鋭であり、以後、大正・昭和にかけて、日本建築の近代化に多大な功績を残す岡田の意匠よるところが大きいとゃ言われています。平成15(2003)年5月より、金融資料館として公開されています。@市指定有形文化財木造聖観音立像(WoodenSho-Kan'nonStatue)画所在地:小樽市富岡1丁目19番21号画指定年月日:平成11(1999)年11月3日一管理者:浅草観音寺TEL.0134-22-4869平安時代中ごろ、10世紀後半に京都・滋賀周辺で造られたものと考えられる、道内で最も古い仏像の一つです。京都の聖護院にあった有門院から明治20年代後半に小樽にもたらされたといわれています。サクラ材による一木造。右手有対より先、左手の肩より先を別材で補修していますが、顔や胴体など主要な部分は約千年前の姿をよく残しています。丸顔に小ぶりの目と鼻が、それ以降の仏像とは佑い、たいへん穏やかな表情をあらわしています。なお、拝観を希望する方は事前に浅草観音寺までご連絡ください。く無形文化財>人@道指定無形民俗文化財松前神楽(MatsumaeKagura)画指定年月日:平成20年6月9日画連絡先:小樽市総合博物館TEL.0134-33-2523松前神楽は、江戸時代の始め人道南の松前周辺で行われていた、さまざまな神楽、田楽などの伝"}, {"seq": 244, "page": 228, "img": "guidebook_pages/p244.webp", "t": "統芸能を集大成し、城内神事として伝承されてきました。当時の松前神楽は松前周辺の12の神社の神職によって演じられ、家ごとにその技術が伝えられていきました。その後、全道各地へ広がって行きますが、小樽へもる福島町の常磐井家により明治26(1893)年に伝えられました。現在でゃ小樽市と道南の町村には江戸時代以来の伝統的な舞・奏楽が伝承され、連合保存会も結成されています。演目は23座の演舞を含む33事の舞楽と神事によって構成されており、その中には、神遊舞、四ヶ散米舞、荒馬舞など北海道の独自性を良く表わしているものがあります。小樽では、広く市民各層からなる小樽保存会により活発な保存活動が行われています。@市指定無形民俗文化財高島越後盆踊りの行事画指定年月日:平成13(2001)年7月23日田保持団体:高島越後盆踊り保存会國連絡先:小樽市教育委員会生涯学習課TEL.32-4111(内線531)高島地区は古くから漁業で栄えた地域であり、本州からの移住や往来が盛んに行なわれていました。本州からやってきた人ん々は、出身地からさまざまな風俗・習慣を持ち込みましたが、新潟県北蒲原郡地方出身者によって伝えられた知蘭盆の行事(節踊り)が越後節踊りとして広まったといわれています。とくに明治以降、漁場の開発と漁業(特に人・漁)の進展に伴い、新潟県北蒲原郡の各村から高島地区へ多くの移住者がやってきたこと6こより、節踊りの行事はますます盛んになりました。高島越後節踊りは、元禄年上中(1688>1703)に新当県地方で成立した踊り歌までその起源を遡ることができるといわれています。踊りと員子は二つの形態があり、これらを交互に連続して行なうのが特徴です。歌は労働歌を中心に、およそ190の歌詞が採録されています。現在、他地域に伝えられていた委踊りのほとんどは統合されたり消滅していますが、高島では近代以前にみられた委踊りの形態が残されており、地域に密着した年中行事として今ゃ地域の人々により保存されています。@市指定無形民俗文化財忍路鯨漁揚の行事(OtaruHerringFishingFestival)画指定年月日:昭和55(1980)年10月8日還保持団体:忍路鯨場の会還連絡先:小樽市教育委員会生涯学習課TEL.32-4111(内線531)北海道では、江戸時代から昭和初期にかけて日本海沿岸を中心に人漁でおおいに賑わいました。その後、儲の漁場が北上するにつれ、この積丹半島周辺が一大好漁場となり、中でゃも西川伝右衛門が請負う忍路場所は江差追分のなかで「忍路高島及びもないが」と歌われるほどの大漁場でした。現在、この忍路場所があった忍路・蘭島地区で「忍路触場の会」が結成され、この健漁携に関する歌、行事などが保存されています。保存されている労働歌は、手浴ぎ船で進む際に唄われる「船こぎ歌」、網をたぐり寄せるときに唄われる「網おこし歌」、網から鯨を船にすくいあげる時に唄う「沖あげ音頭」(いわゆるソーラン節)、網についたカズノコを叩いて落とす際に唄われる「子はたき音頭」などがあります。これらの歌は、苦しい労働の中から生まれた庶民の心の歌として、聞くものの心に大きな感動を与えるやものです。また、角・漁に伴う各種行事についてやも保存されており、民俗文化財として、高く評価されるものです。人市指定無形文化財向井流水法(ClassicalStyleofSwimming\"Mukaistyle\")還指定年月日:平成3(1991)年9月2日還保持団体:向井流水法会画連絡先:小樽市教育委員会生涯学習課TEL.32-4111(内線531)向井流は15世紀頃、伊勢(現在の三重県)地方でうまれ、主に御船手の泳法として確立しました。その後、会津(福島県)、佐倉(千葉県)、佐野(栃木県)、松江(島根県)などに伝わり、小樽には明治28(1895)年元会津藩士によって伝えられまこと泳ぎの基本は、飛び込むときゃ泳ぐときゃ常に目標から目を離さない、実用的なものです。そのの泳ぎの姿勢は立ったような状態が基本とな、水中を歩くような足技「あおり足」や足首のップを生かして前足の裏で水を踏み込む「踏込扇」などが特徴的です。「小樽市」http://Www.city.otaru.|g.jp/高島直後急破り(写真提供:小椅豆館)"}, {"seq": 245, "page": 229, "img": "guidebook_pages/p245.webp", "t": ""}, {"seq": 246, "page": 230, "img": "g  149, "項": ["位置・面積", "地形の特徴", "小樽の川", "小樽の坂"], "end": 156}, {"部": "自然編", "節": "植物", "page": 157, "項": ["市の花", "市の木", "街路樹", "保存樹木・保存樹林"], "end": 159}, {"部": "自然編", "節": "動物", "page": 160, "項": ["市の鳥", "小樽の動物", "小樽近海で獲れる水産物"], "end": 161}, {"部": "自然編", "節": "温泉", "page": 162, "項": ["朝里川温泉"], "end": 163}, {"部": "自然編", "節": "水", "page": 164, "項": ["小樽の水はどこから？", "小樽の水は美味しいの？", "伏流水の産業利用", "伏流水の原理", "小樽の工業"], "end": 170}, {"部": "自然編", "節": "景観", "page": 171, "項": ["小樽八区八景", "小樽市都市景観賞"], "end": 174}, {"部": "行政編", "節": "行政機関", "page": 175, "項": ["市政"], "end": 175}, {"部": "行政編", "節": "市域", "page": 176, "項": ["町名", "由来"], "end": 179}, {"部": "行政編", "節": "国際交流", "page": 180, "項": ["ナホトカ市", "ダニーデン市", "ソウル特別市江西区", "外国人入込客数"], "end": 182}, {"部": "行政編", "節": "人口", "page": 183, "項": ["小樽市の人口"], "end": 184}, {"部": "経済編", "節": "経済編", "page": 185, "項": ["市場と商店街", "小樽商工会議所 1次・2次産業振興プロジェクト"], "end": 190}, {"部": "生活文化編", "節": "祭りとイベント", "page": 191, "項": ["小樽市内のおもなお祭り日程", "小樽の夏・冬を彩る2大イベント"], "end": 194}, {"部": "生活文化編", "節": "冬の暮らし", "page": 195, "項": [], "end": 196}, {"部": "生活文化編", "節": "小樽の食文化", "page": 197, "項": ["蒲鉾", "菓子"], "end": 198}, {"部": "生活文化編", "節": "地酒", "page": 199, "項": ["小樽の酒造史", "小樽の酒"], "end": 201}, {"部": "生活文化編", "節": "教育", "page": 202, "項": [], "end": 203}, {"部": "生活文化編", "節": "方言", "page": 204, "項": ["北海道の方言"], "end": 206}, {"部": "周辺編", "節": "札幌方面", "page": 207, "項": [], "end": 209}, {"部": "周辺編", "節": "後志方面", "page": 210, "項": [], "end": 214}, {"部": "おもてなしの心構え", "節": "おもてなしの心構え", "page": 215, "項": ["マナー オリエンテーション", "基礎知識", "ガイドを実践する前に", "実践", "身障者の方々や特別なニーズへの対応と情報把握", "「おたる案内人」に必要なコミュニケーション能力"], "end": 224}, {"部": "資料", "節": "資料", "page": 225, "項": ["小樽の歴史概要図", "文化財", "小樽の老舗", "観光情報", "観光案内所", "外国人の相談窓口"], "end": 230}, {"部": "資料", "節": "協力者・執筆者一覧", "page": 231, "項": [], "end": null}], "first_numbered": 1};</script>
<script>
const $ = s => document.querySelector(s);
const PAGES = DATA.pages;
const LAST = 'otaru-gb-last';

let i = 0;                 // いま開いている通しページの添字（0始まり）
let two = false;           // 見開きかどうか
let tab = 'toc';

const esc = s => (s || '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = p => p.page ? `p${p.page}` : `${p.seq}枚目`;

/* ---------- 表示 ---------- */
function show() {
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  const stage = $('#stage');
  stage.classList.toggle('two', two);
  const list = two ? [PAGES[i], PAGES[i + 1]].filter(Boolean) : [PAGES[i]];
  stage.querySelectorAll('img').forEach(e => e.remove());
  const anchor = $('#tapNext');
  list.forEach(p => {
    const img = document.createElement('img');
    img.src = p.img; img.alt = `${label(p)} の誌面`;
    stage.insertBefore(img, anchor);
  });
  $('#where').textContent = list.map(label).join('・');
  $('#slider').value = i;
  $('#jump').value = PAGES[i].page || '';
  $('#prev').disabled = i <= 0;
  $('#next').disabled = i >= PAGES.length - 1;
  localStorage.setItem(LAST, String(i));
  markToc();
  prefetch();
}

/* 次に見るページを先に読み込んでおく。めくった瞬間に出るように。 */
function prefetch() {
  [i + 1, i + 2, i + 3, i - 1, i - 2].forEach(k => {
    if (k >= 0 && k < PAGES.length) { const im = new Image(); im.src = PAGES[k].img; }
  });
}

function go(delta) { i += delta * (two ? 2 : 1); show(); }
function goSeq(seq) { i = PAGES.findIndex(p => p.seq === seq); show(); closePanel(); }
function goPage(page) { const k = indexOfPage(page); if (k >= 0) { i = k; show(); closePanel(); } }

/* ---------- 目次 ---------- */
function renderToc() {
  let out = '', part = null;
  DATA.toc.forEach((s, k) => {
    if (s.部 !== part) { part = s.部; out += `<div class="part">${esc(part)}</div>`; }
    const range = s.page ? (s.end ? `${s.page}–${s.end}` : `${s.page}–`) : '—';
    out += `<button class="sec" data-page="${s.page ?? ''}" data-k="${k}">
      <span class="pg">${esc(range)}</span>
      <span><b>${esc(s.節)}</b>
        ${s.項.length ? `<span class="kou">${esc(s.項.join('・'))}</span>` : ''}</span>
    </button>`;
  });
  return out;
}

/* いま読んでいる節に印をつける */
function markToc() {
  const page = PAGES[i].page;
  let best = -1;
  if (page != null) DATA.toc.forEach((s, k) => {
    if (s.page != null && s.page <= page && (s.end == null || page <= s.end)) best = k;
  });
  document.querySelectorAll('.sec').forEach(b =>
    b.classList.toggle('here', Number(b.dataset.k) === best));
}

/* ---------- 検索 ---------- */
function search(q) {
  q = (q || '').trim();
  if (!q) return `<p class="msg">語を入れると、その語が出てくる誌面を探します。<br>
    目次の見出しからも探します。</p>`;
  const flat = q.replace(/\s+/g, '');

  /* まず目次から。見出しは手で起こしてあるので、OCRの読み違いの影響を受けない。 */
  const tocHits = [];
  DATA.toc.forEach(s => {
    const hay = s.節 + ' ' + s.項.join(' ');
    if (s.page != null && hay.includes(flat)) tocHits.push(s);
  });

  /* 本文はOCRなので読み違いがある（「鰊」を「鯨」と読むなど）。
     完全一致で拾えなかったときのために、1文字だけ違う箇所も探す。 */
  const exact = [], near = [];
  for (const p of PAGES) {
    if (!p.t) continue;                  // 読み取れていないページは当てにしない
    const at = p.t.indexOf(flat);
    if (at >= 0) { exact.push({p, at, len: flat.length, near: false}); continue; }
    if (flat.length >= 3 && exact.length + near.length < 40) {
      const at2 = findNear(p.t, flat);
      if (at2 >= 0) near.push({p, at: at2, len: flat.length, near: true});
    }
  }
  const body = exact.concat(near).slice(0, 60);

  if (!tocHits.length && !body.length) return `<p class="msg">
    「${esc(q)}」は見つかりませんでした。<br>
    本文の検索は誌面を機械で読み取った文字を使っているため、
    読み違いや、図版が主のページで見つからないことがあります。</p>`;

  let out = '';
  if (tocHits.length) {
    out += `<div class="part">目次から</div>` + tocHits.map(s =>
      `<button class="hit" data-page="${s.page}">
        <span class="pg">p${s.page}</span> ${esc(s.部)} ／ <b>${esc(s.節)}</b></button>`).join('');
  }
  if (body.length) {
    out += `<div class="part">本文から ${body.length}件</div>` + body.map(h => {
      const from = Math.max(0, h.at - 22);
      const snip = h.p.t.slice(from, h.at + h.len + 38);
      const hit = h.p.t.slice(h.at, h.at + h.len);
      return `<button class="hit" data-seq="${h.p.seq}">
        <span class="pg">${esc(label(h.p))}</span>
        ${h.near ? '<span class="near">1文字違い</span> ' : ''}
        ${esc(snip).split(esc(hit)).join(`<mark>${esc(hit)}</mark>`)}</button>`;
    }).join('');
  }
  return out;
}

/* 1文字だけ違う箇所を探す。OCRの読み違いを拾うため。 */
function findNear(hay, needle) {
  const n = needle.length;
  for (let i = 0; i + n <= hay.length; i++) {
    let bad = 0;
    for (let k = 0; k < n; k++) {
      if (hay[i + k] !== needle[k] && ++bad > 1) break;
    }
    if (bad <= 1) return i;
  }
  return -1;
}

function setTab(t) {
  tab = t;
  document.querySelectorAll('#panel .tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === t));
  $('#qwrap').style.display = t === 'find' ? '' : 'none';
  $('#list').innerHTML = t === 'toc' ? renderToc() : search($('#q').value);
  if (t === 'toc') markToc();
  if (t === 'find') $('#q').focus();
  bindList();
}

function bindList() {
  document.querySelectorAll('.sec').forEach(b => b.onclick = () => {
    if (b.dataset.page) goPage(Number(b.dataset.page));
  });
  document.querySelectorAll('.hit').forEach(b => b.onclick = () => {
    if (b.dataset.seq) goSeq(Number(b.dataset.seq));
    else if (b.dataset.page) goPage(Number(b.dataset.page));
  });
}

/* ---------- 引き出し ---------- */
function openPanel(t) {
  $('#panel').classList.add('open'); $('#scrim').classList.add('on'); setTab(t);
}
function closePanel() {
  $('#panel').classList.remove('open'); $('#scrim').classList.remove('on');
}

/* ---------- 操作 ---------- */
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#tapPrev').onclick = () => go(-1);
$('#tapNext').onclick = () => go(1);
$('#toc').onclick = () =>
  $('#panel').classList.contains('open') && tab === 'toc' ? closePanel() : openPanel('toc');
$('#find').onclick = () =>
  $('#panel').classList.contains('open') && tab === 'find' ? closePanel() : openPanel('find');
$('#scrim').onclick = closePanel;
$('#spread').onclick = () => { two = !two; $('#spread').classList.toggle('on', two); show(); };
$('#slider').oninput = e => { i = Number(e.target.value); show(); };
$('#jump').onchange = e => {
  const n = Number(e.target.value);
  if (indexOfPage(n) >= 0) goPage(n); else show();   // 無い番号なら今の表示に戻す
};
$('#q').oninput = () => { $('#list').innerHTML = search($('#q').value); bindList(); };
document.querySelectorAll('#panel .tabs button').forEach(b =>
  b.onclick = () => setTab(b.dataset.t));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'ArrowLeft')  { go(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { go(1);  e.preventDefault(); }
  if (e.key === 'Home') { i = 0; show(); }
  if (e.key === 'End')  { i = PAGES.length - 1; show(); }
  if (e.key === 'Escape') closePanel();
  if (e.key === 't') openPanel('toc');
  if (e.key === '/') { openPanel('find'); e.preventDefault(); }
});

/* スワイプ */
let x0 = null;
$('#stage').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
$('#stage').addEventListener('touchend', e => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
  x0 = null;
}, {passive:true});

/* 広い画面では見開きを既定にする */
if (window.matchMedia('(min-width:64rem)').matches) { two = true; $('#spread').classList.add('on'); }

/* 誌面のこのページが何枚目かを返す。番号が拾えていないページは、
   番号のある一番近い後ろのページから枚数を戻して割り出す。
   （誌面のp1はノンブルが入っていないので、これが無いとp2から始まってしまう） */
function indexOfPage(n) {
  const hit = PAGES.findIndex(p => p.page === n);
  if (hit >= 0) return hit;
  const after = PAGES.findIndex(p => p.page != null && p.page > n);
  if (after < 0) return -1;
  const back = after - (PAGES[after].page - n);
  return back >= 0 ? back : -1;
}

/* 前に読んでいたページから続ける。無ければ本文の1ページ目から。 */
const savedRaw = localStorage.getItem(LAST);
const saved = savedRaw === null ? NaN : Number(savedRaw);
i = Number.isInteger(saved) && saved >= 0 && saved < PAGES.length
  ? saved
  : Math.max(0, indexOfPage(1));   // 既定は本文の1ページ目
$('#slider').max = PAGES.length - 1;
$('#list').innerHTML = renderToc();
bindList();
show();
</script>
</body></html>
