": 11, "no": 20, "sub": "", "q": "次の江戸時代の海路の中で、北前船が活躍していた正しい海路はどれですか。", "a": "2"}, {"exam": 11, "no": 21, "sub": "", "q": "北前船は菱垣廻船や樽廻船とは違う、特徴ある航海をしました。その手法とは次のどれでしょうか。", "a": "3"}, {"exam": 11, "no": 22, "sub": "", "q": "北陸地方の北前船の船乗り達には「切出し」「帆待ち」と呼ばれた手法があり、得たお金を蓄えていきました。その意味は次のどれでしょうか", "a": "2"}, {"exam": 11, "no": 23, "sub": "", "q": "次の写真は北運河にある倉庫で、印が大きな特徴です。この建物に関係ある北前船主名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "右近権左衛門"}, {"exam": 11, "no": 24, "sub": "", "q": "北前船の上り荷として間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 25, "sub": "", "q": "次の文章はある北前船主を説明しています。その人物名（姓・名両方）を書きなさい。（姓のみ不可）石川県加賀市出身。明治37年には貴族院の多額納税議員にも選ばれました。北前船衰亡以後は大阪の三十四銀行に出資し監査役に就き、さらに日本火災海上保険株式会社を創設し、初代社長に就任しまた。", "a": "広海二三郎"}, {"exam": 11, "no": 26, "sub": "", "q": "問25の北前船主は同じ出身地の北前船主とともに住吉神社の大鳥居を寄進しました。その北前船主名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "大家七平"}, {"exam": 11, "no": 27, "sub": "", "q": "北前船ビジネスでは、積荷を宣伝するため京阪でいう「ちらし」を寄港予定地に配布しました。江戸ではこの媒体を何といっていましたか。", "a": "4"}, {"exam": 12, "no": 17, "sub": "", "q": "北前船の説明として正しいのは、次のどれでしょうか。", "a": "4"}, {"exam": 12, "no": 18, "sub": "", "q": "次の文章の（　）内に該当する語句を書きなさい。「北前」という呼び名は瀬戸内地方で（　）地方のことを「北前」と呼んでおり、江戸初期には越中や出羽への出稼ぎ届けを「北前行」といい、そのような「北前」地方から瀬戸内に来る船だから「北前船」と呼ぶようになった。", "a": "山陰"}, {"exam": 12, "no": 19, "sub": "", "q": "北前船の商売の特徴を表す言葉として正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 20, "sub": "", "q": "北前船主たちも、積荷を売るためには様々な費用がかかりました。そのなかで「蔵敷」という費用が発生する場合がありました。これは次のどれでしょうか。", "a": "3"}, {"exam": 12, "no": 21, "sub": "", "q": "次の写真は小樽市内の神社の大鳥居です。北前船主2名が寄進したものです。この神社の名称を書きなさい。", "a": "住吉神社"}, {"exam": 12, "no": 22, "sub": "", "q": "石川県加賀市大聖寺瀬越町出身の北前船主で、地元瀬越で公的寄付に協力的だったことで「両家様のおかげ」と町中から感謝された、この両家とは次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 23, "sub": "", "q": "次の文章はある北前船主を説明しています。その人物名（姓・名両方）を書きなさい。（姓のみ不可）現在、総合博物館運河館、運河プラザ、観光協会などが入っている小樽倉庫を西谷庄八とともに建設。のちに函館に転居し、各種の企業に参画した。", "a": "西出孫左衛門"}, {"exam": 12, "no": 24, "sub": "", "q": "次の倉庫で北前船主が建てたものではないのはどれでしょうか。（名称は創建時）", "a": "2"}, {"exam": 13, "no": 19, "sub": "", "q": "北前船の航路として正しいのは次のどれですか。（＊当時今の大阪は大坂と書いた。）", "a": "3"}, {"exam": 13, "no": 20, "sub": "", "q": "北前船は、荷物を運ぶ単なる運送業ではなく、寄港地で商品を仕入れ・販売を行う商法でした。この商法をなんといいますか。", "a": "買い積み商法"}, {"exam": 13, "no": 21, "sub": "", "q": "次の文中の「　」に当てはまる語句を記入しなさい。北前船の船乗りの給料は少なく、しかも遭難をともなう危険な職業でした。そのため船乗りには、「積荷の約1割を自由に売買でき、自分の収入にできる」抜け道が用意され、これで金銭を蓄えていました。これは「（　）、または切出し」と呼ばれました。", "a": "帆待ち"}, {"exam": 13, "no": 22, "sub": "", "q": "次の写真は北運河に3棟並ぶ倉庫の一つです。北前船主だったこの人物は後に日本火災海上保険株式会社を創設し、初代社長に就任しています。この人物名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "広海二三郎"}, {"exam": 13, "no": 23, "sub": "", "q": "北前船の小樽からの上り荷として間違っているのは次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 18, "sub": "", "q": "北前船の説明として正しいのは、次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 19, "sub": "", "q": "次の文章の（　）内に該当する語句を書きなさい。北前船の船乗り達の給料は少ないうえ、危険な仕事だったので、積荷の約1割を自由に売買でき、自分の収入にできる仕組みがありました。これを（　）または「帆待ち」と呼ばれ、得たお金を蓄えていきました。", "a": "切り出し"}, {"exam": 14, "no": 20, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。北陸地方の北前船の船乗りたちは、近江商人に雇われ、彼らの商い手法を学びました。北前船の代表的な手法である買い積み商法の基になったのが「持下り商法」とか「（　）商法」という手法でした。", "a": "のこぎり"}, {"exam": 14, "no": 21, "sub": "A", "q": "小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する語句を選びなさい。この倉庫を建てたのは北前船主の西出孫左衛門と西谷庄八で、二人とも（　A　）の出身です。また屋根の上の鯱は当時、寄港する船のランドマークにもなっていましたが、もう一つ重要な意味がありました。それは（　B　）です。", "a": "1"}, {"exam": 14, "no": 21, "sub": "B", "q": "小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する語句を選びなさい。この倉庫を建てたのは北前船主の西出孫左衛門と西谷庄八で、二人とも（　A　）の出身です。また屋根の上の鯱は当時、寄港する船のランドマークにもなっていましたが、もう一つ重要な意味がありました。それは（　B　）です。", "a": "4"}, {"exam": 14, "no": 22, "sub": "", "q": "北前船に関係した地域の社寺などには、航海の安全への祈願や無事であったことの感謝を込めて奉納したものがあります。（写真）昨年、小樽市内の龍徳寺で、北前船の船主たちが奉納した未調査のものが発見されたというニュースもありました。この奉納したものは何といいますか。", "a": "船絵馬"}, {"exam": 14, "no": 23, "sub": "", "q": "北前船は、商品の販売促進や開店、改築の宣伝をするため、今日のチラシの前身となった印刷物も寄港地へ運んできました。江戸ではこの媒体のことを何といったでしょうか。", "a": "2"}, {"exam": 14, "no": 24, "sub": "", "q": "小樽ゆかりの北前船主のなかで、「両家様のおかげ」と故郷から感謝された船主がいました。その船主と関係のある倉庫は次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 18, "sub": "", "q": "明治期の北海道において、北前船がもっとも貢献したことは次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 19, "sub": "", "q": "北前船の航路として正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 20, "sub": "", "q": "北前船の一番の特徴は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 21, "sub": "A", "q": "写真の倉庫の説明です。（　）内に該当する語句を書きなさい。この倉庫を建てたのは北前船主の（　A　）で、石川県加賀市の出身です。倉庫の妻面には印があり、その印の読み方は（　B　）です。", "a": "大家七平"}, {"exam": 15, "no": 21, "sub": "B", "q": "写真の倉庫の説明です。（　）内に該当する語句を書きなさい。この倉庫を建てたのは北前船主の（　A　）で、石川県加賀市の出身です。倉庫の妻面には印があり、その印の読み方は（　B　）です。", "a": "ヤマシチ"}, {"exam": 15, "no": 22, "sub": "", "q": "次の写真は小樽市内の神社の大鳥居です。この大鳥居を寄進した北前船主は広海二三郎と、もう一人は誰でしょうか。", "a": "大家七平"}, {"exam": 15, "no": 23, "sub": "", "q": "北前船の航海には、いろいろな経費がかかりました。その中に「蔵敷」という経費があります。それは次のどれでしょうか。", "a": "1"}, {"exam": 15, "no": 24, "sub": "", "q": "次の文と関係のある北前船主名（姓・名両方）を書きなさい。（姓のみ不可）加賀市橋立町出身で、小樽倉庫の株主の一人でした。後に海運会社を設立し、「東洋一の回漕店」といわれるようになりました。また千登勢温泉はこの船主の別荘でした。", "a": "西谷庄八"}, {"exam": 16, "no": 18, "sub": "", "q": "明治期の小樽において、北前船がもっとも貢献したことは次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 19, "sub": "", "q": "江戸時代の海路の中で、北前船が活躍していた正しい海路は次のどれですか。", "a": "2"}, {"exam": 16, "no": 20, "sub": "", "q": "北前船の商法の特徴として代表的なことは次のどれでしょうか。", "a": "3"}, {"exam": 16, "no": 21, "sub": "", "q": "北陸地方の北前船の船頭には「帆待ち」と呼ばれた手法があり、得たお金を蓄えていきました。その意味は次のどれでしょうか", "a": "2"}, {"exam": 16, "no": 22, "sub": "", "q": "小樽は昨年「北前船」日本遺産に追加認定されました。次の写真のなかで日本遺産の構成要素と関係ないのはどれでしょうか。", "a": "4"}, {"exam": 16, "no": 23, "sub": "A", "q": "小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する語句を書きなさい。この倉庫を建てたのは北前船主の（　A　）と西谷庄八で、二人とも石川県加賀市橋立町の出身です。（　A　）はのちに夜景のスポットで有名な道南の（　B　）を所有したと言われています。", "a": "西出孫左衛門"}, {"exam": 16, "no": 23, "sub": "B", "q": "小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する語句を書きなさい。この倉庫を建てたのは北前船主の（　A　）と西谷庄八で、二人とも石川県加賀市橋立町の出身です。（　A　）はのちに夜景のスポットで有名な道南の（　B　）を所有したと言われています。", "a": "函館山"}, {"exam": 16, "no": 24, "sub": "", "q": "北前船が遺したもので、航海の安全を祈願し、あるものを神社などに奉納しました。小樽では龍徳寺や祝津の恵美須神社にあることが確認されています。この神社に奉納されたものは何というでしょうか。", "a": "船絵馬"}, {"exam": 17, "no": 12, "sub": "", "q": "次の文に該当する建物名を書きなさい。この建物は昭和13(1938)年、㈱北海ホテル創業20年の記念事業として余市の大漁家の住宅を小樽に移築しました。この漁家は廻船業や清酒醸造など多方面でも活躍しました。屋根の上の望楼が特徴的です。", "a": "銀鱗荘"}, {"exam": 17, "no": 18, "sub": "", "q": "江戸時代の日本の海路の中で、北前船が活躍していた正しい海路は次のどれですか。", "a": "2"}, {"exam": 17, "no": 19, "sub": "", "q": "菱垣廻船や樽廻船は運搬目的の船でした、北前船は各地で買い集めた品物を有利に売れる土地に運んで高く売るという商売をする船でした。この商法を何というでしょうか。", "a": "買い積み商法"}, {"exam": 17, "no": 20, "sub": "", "q": "次の写真は北前船主が建てた倉庫です。倉庫名は次のどれでしょうか。", "a": "4"}, {"exam": 17, "no": 21, "sub": "", "q": "小樽における北前船の積み荷で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 17, "no": 22, "sub": "", "q": "北前船は、航海において様々な費用がかかりました。そのなかで「蔵敷」という費用が発生する場合がありました。これは次のどれでしょうか。", "a": "3"}, {"exam": 17, "no": 23, "sub": "", "q": "次の文と関係のある北前船主名を書きなさい。（姓のみ不可）石川県加賀市橋立町出身で小樽に海運会社を設立。日露戦争後の海運発展に乗じ、「東洋一の回漕店」といわれるようになった。現在の山の手小学校付近にあった千登勢温泉は別荘だった。", "a": "西谷庄八"}, {"exam": 17, "no": 24, "sub": "", "q": "問23の北前船主と同じ出身地の西出孫左衛門は、問23の北前船主とともに倉庫を建設しました。その倉庫名を書きなさい。", "a": "小樽倉庫"}, {"exam": 17, "no": 25, "sub": "", "q": "小樽は北前船日本遺産に認定されたまちですが、次のなかで小樽での北前船日本遺産の構成文化財ではないのはどれでしょうか。", "a": "4"}, {"exam": 17, "no": 64, "sub": "", "q": "小樽ゆかりの画家で、北前船主の西谷家の海運会社「西谷海運」に入社し、働きながら小樽洋画研究所に通い絵の勉強を続け、西谷氏が建てた別荘にこもって描き続けるなど、西谷家が全面的に支援した経緯がある画家は次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 18, "sub": "", "q": "江戸時代から明治時代にかけての北前船の航路として正しいのは次のどれですか。", "a": "3"}, {"exam": 18, "no": 19, "sub": "", "q": "次の文章の（　）内に該当する語句を書きなさい。「北前船の仕事は危険な仕事でしたが船乗り達の給料は多くはありませんでした。そこで水主には売上高から「切出し」といわれるボーナスのような配分が用意され、船頭には積み荷の一割相当を自由に売買できる（　）という配分が用意され、蓄財できる道がありました。」", "a": "帆待ち,切出し"}, {"exam": 18, "no": 20, "sub": "", "q": "次の写真は北前船主が建てた今も残る倉庫です。この写真の船主名と倉庫名の組合せで正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 21, "sub": "", "q": "北前船の大きな特徴である「買い積み商法」の説明として正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 18, "no": 22, "sub": "", "q": "小樽ゆかりの北前船主のなかで、故郷の瀬越では公的寄付に協力的だったことから「両家様のおかげ」と感謝された船主がいました。その両家とは次のどれでしょうか。", "a": "1"}, {"exam": 18, "no": 23, "sub": "", "q": "北前船に関係した地域の社寺などには、航海の安全への祈願や無事であったことの感謝を込めて船絵馬が奉納されています。小樽市内でも船絵馬が確認されている社寺があります。次の社寺のなかで船絵馬が確認されているのはどれでしょうか。", "a": "2"}, {"exam": 18, "no": 24, "sub": "", "q": "次の文章は北前船主によりもたらされた文化を表しています。今も残るその文化とは何でしょうか。「戦国時代に、敵味方を区別するために使われたことが由来といわれている。江戸時代になると商人が店の暖簾や半纏などに付け、独自のマークのような使い方をするようになりました。」", "a": "印"}, {"exam": 18, "no": 25, "sub": "", "q": "次のなかで小樽における北前船日本遺産の構成文化財ではないのはどれでしょうか。", "a": "2"}, {"exam": 18, "no": 52, "sub": "", "q": "次の文章に当てはまる小樽市内の木骨石造の建物名を書きなさい。「北運河に3棟並ぶ木骨石造倉庫の一つです。特徴は採光を目的とした越し屋根と出入口のアーチが壁面のアクセントとなっています。この倉庫は加賀出身の北前船主が建てたもので住吉神社の大鳥居を寄進した一人です。」", "a": "旧広海倉庫"}, {"exam": 18, "no": 64, "sub": "", "q": "市立小樽美術館では2020年10月24日〜12月27日まで、石川県にある美術館の調査結果をもとに北前船によって小樽、後志に渡ってきた、ある物の展覧会が開催されました。ある物とは何でしょうか。", "a": "九谷焼"}, {"exam": 19, "no": 18, "sub": "", "q": "北前船の説明として正しいのは、次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 20, "sub": "", "q": "次の写真は北前船主が建てた倉庫で日本遺産の構成文化財になっています。この写真の船主名と倉庫名の組合せで正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 21, "sub": "", "q": "北前船の商法の特徴として正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 22, "sub": "A", "q": "旧小樽倉庫の説明です。（　）内に該当する語句を選びなさい。この倉庫を建てたのは北前船主の（　A　）と西谷庄八で、二人とも石川県橋立の出身です。また屋根の上には（　B　）がつけられ、寄港する船のランドマークにもなっていました。", "a": "1"}, {"exam": 19, "no": 22, "sub": "B", "q": "旧小樽倉庫の説明です。（　）内に該当する語句を選びなさい。この倉庫を建てたのは北前船主の（　A　）と西谷庄八で、二人とも石川県橋立の出身です。また屋根の上には（　B　）がつけられ、寄港する船のランドマークにもなっていました。", "a": "4"}, {"exam": 19, "no": 23, "sub": "", "q": "北前船は航海が成功すると1航海で船主の利益は大きな金額になったといわれています。それは次のどれでしょうか。", "a": "2"}, {"exam": 19, "no": 24, "sub": "", "q": "左の写真は北運河に3棟並ぶ倉庫の一つです。北前船主だったこの人物は後に日本火災海上保険株式会社を創設し、初代社長に就任しています。この人物名(姓・名両方)を書きなさい。（姓のみ不可）", "a": "広海二三郎"}, {"exam": 19, "no": 25, "sub": "", "q": "北前船は、航海において様々な費用がかかりました。そのなかで「作事の口」という費用がありました。これは次のどれでしょうか。", "a": "1"}, {"exam": 19, "no": 50, "sub": "", "q": "次の文章は現在の小樽運河に架かる橋の説明です。橋の名称を書きなさい。「この橋の手宮方向には左側に北前船日本遺産に指定されている構成文化財が見えます。また、この橋の街園にはモニュメントもあり、春にはツツジが咲く憩いの場にもなっています。」", "a": "中央橋"}, {"exam": 19, "no": 56, "sub": "", "q": "小樽市指定歴史的建造物のなかで、日本遺産「北前船」の構成文化財ではないのは次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 19, "sub": "", "q": "菱垣廻船や樽廻船は運賃積みの運搬船でしたが、北前船は各地で買い集めた品物を有利に売れる土地に運んで高く売るという商売をする船でした。この商法を何というでしょうか。", "a": "買い積み商法"}, {"exam": 20, "no": 20, "sub": "", "q": "蝦夷地における北前船の積み荷で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 21, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。北陸地方の北前船の船乗りたちは、近江商人に雇われ、彼らの商い手法を学びました。後に北前船の代表的な商法の基になったのが「のこぎり商法」とか「（　）商法」という手法でした。", "a": "持下り"}, {"exam": 20, "no": 22, "sub": "", "q": "小樽は「北前船」日本遺産に追加認定されています。次の写真のなかで「北前船」日本遺産の構成文化財ではないのはどれでしょうか。", "a": "1"}, {"exam": 20, "no": 23, "sub": "", "q": "次のなかで小樽での北前船日本遺産の構成文化財ではないのはどれでしょうか。", "a": "4"}, {"exam": 20, "no": 24, "sub": "", "q": "次の写真は小樽市内の神社の大鳥居です。この大鳥居を寄進した北前船主は大家七平と、もう一人は誰でしょうか。この人物名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "広海二三郎"}, {"exam": 20, "no": 25, "sub": "A", "q": "旧小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する語句を書きなさい。この倉庫を建てたのは北前船主の（　A　）と西谷庄八で、二人とも石川県加賀市橋立町の出身です。この倉庫の大きな特徴は煉瓦造の建物を中心に左右対称の姿の屋根に鯱が掲げられていて全部で（　B　）体あり、当時は、鯱がシンボルとなり、その存在を海に向かってアピールしていました。", "a": "西出孫左衛門"}, {"exam": 20, "no": 25, "sub": "B", "q": "旧小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する語句を書きなさい。この倉庫を建てたのは北前船主の（　A　）と西谷庄八で、二人とも石川県加賀市橋立町の出身です。この倉庫の大きな特徴は煉瓦造の建物を中心に左右対称の姿の屋根に鯱が掲げられていて全部で（　B　）体あり、当時は、鯱がシンボルとなり、その存在を海に向かってアピールしていました。", "a": "8"}, {"exam": 20, "no": 26, "sub": "", "q": "北前船主の西谷庄八は小樽に進出後、「東洋一の回漕店」といわれるまでになりましたが、北前船衰亡以後は広海二三郎らとともに会社を創設し取締役に就任しました。その会社とは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 18, "sub": "", "q": "明治初期の小樽における北前船がもっとも貢献し、大きな商売をしたのは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 19, "sub": "", "q": "北前船の航路として正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 20, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。北前船は各地で買い集めた品物を有利に売れる土地に運んで高く売るという商売（買い積み商法）をする船でした。一方、菱垣廻船や（　）廻船は運搬目的の船でした。", "a": "樽"}, {"exam": 21, "no": 21, "sub": "", "q": "次の文中の（　）に当てはまる語句を記入しなさい。北陸地方の北前船の船乗りたちの給料は大変少ないうえ、遭難も多い危険な仕事でした。そこで、積み荷の約（　）は船乗りの個人商売を認めるという「切出し」とか「帆待ち」と呼ばれた抜け道がありました。船乗りたちはこれを利用し金銭を蓄え独立していきました。", "a": "1割"}, {"exam": 21, "no": 22, "sub": "", "q": "次の写真は北前船主が建てた倉庫で日本遺産の構成文化財になっています。この写真の北前船主名と倉庫名の組合せで正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 23, "sub": "", "q": "小樽での北前船日本遺産の構成文化財を説明した文章です。この構成文化財名を書きなさい。江戸時代の「場所請負人」であり、北前船による廻船業も営んでいました。この「商店日誌」には、小樽の堺町、高島、忍路各支店と各地の取引状況や、まちの様子などが詳しく記されています。", "a": "西川家文書"}, {"exam": 21, "no": 24, "sub": "", "q": "北前船は蝦夷地と大坂を往復していました。北前船の積み荷で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 21, "no": 25, "sub": "A", "q": "旧小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する番号を選びなさい。この倉庫を建てたのは北前船主の西出孫左衛門と西谷庄八で、二人とも（　A　）の出身です。また屋根の上の（　B　）は当時、寄港する船のランドマークにもなっていました。", "a": "2"}, {"exam": 21, "no": 25, "sub": "B", "q": "旧小樽倉庫（現運河プラザ・小樽市総合博物館運河館）の説明です。（　）内に該当する番号を選びなさい。この倉庫を建てたのは北前船主の西出孫左衛門と西谷庄八で、二人とも（　A　）の出身です。また屋根の上の（　B　）は当時、寄港する船のランドマークにもなっていました。", "a": "4"}, {"exam": 21, "no": 26, "sub": "", "q": "小樽ゆかりの北前船主のなかで、「両家様のおかげ」と故郷から感謝された船主がいました。その船主と関係のある倉庫は次のどれでしょうか。", "a": "2"}, {"exam": 22, "no": 19, "sub": "", "q": "北前船の一般的な特徴として違うのは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 20, "sub": "", "q": "次の写真は北前船主が建てた倉庫で日本遺産の構成文化財になっています。この倉庫名を書きなさい。", "a": "広海倉庫"}, {"exam": 22, "no": 21, "sub": "", "q": "「北前船」日本遺産の小樽における構成文化財の一つに船絵馬があります。現在小樽では、恵美須神社本殿（祝津3-161）に2面、龍徳寺金比羅殿（真栄1-3-8）に8面、徳源寺（塩谷2-25-1）に3面あります。あともう一つの神社には30面の船絵馬が確認されています。その神社名を書きなさい。", "a": "塩谷神社"}, {"exam": 22, "no": 22, "sub": "", "q": "北前船の航海には、いろいろな経費がかかりました。その中に「蔵敷」という経費があります。それは次のどれでしょうか。", "a": "1"}, {"exam": 22, "no": 23, "sub": "", "q": "小樽での「北前船」日本遺産の構成文化財を説明した文章です。この構成文化財名を書きなさい。この場所は古くから船乗りたちが出港前に天候や空模様を見た場所でした。明治16（1883）年10月に北海道で2番目となる灯台が建設されました。", "a": "日和山"}, {"exam": 22, "no": 25, "sub": "A", "q": "旧大家倉庫の説明です。（　）内に該当する番号を選びなさい。この倉庫を建てたのは北前船主の大家七平で、（　A　）の出身です。建物の特徴として妻面の大きな印と採光と換気を目的とした（　B　）屋根です。", "a": "1"}, {"exam": 22, "no": 25, "sub": "B", "q": "旧大家倉庫の説明です。（　）内に該当する番号を選びなさい。この倉庫を建てたのは北前船主の大家七平で、（　A　）の出身です。建物の特徴として妻面の大きな印と採光と換気を目的とした（　B　）屋根です。", "a": "2"}, {"exam": 22, "no": 26, "sub": "", "q": "北前船日本遺産の構成文化財となっている旧小樽倉庫の説明で間違っているのは次のどれでしょうか。", "a": "1"}, {"exam": 23, "no": 20, "sub": "", "q": "次の中で小樽市における日本遺産「北前船」の構成文化財ではないのはどれでしょうか。", "a": "1"}, {"exam": 23, "no": 21, "sub": "", "q": "次の文中の（ ）に当てはまる語句を選びなさい。北陸地方の北前船の船乗りたちの給料は大変少ないうえ、遭難も多い危険な仕事でした。そこで、積み荷の約1割は船乗りの個人商売を認めるという（ ）とか「帆待ち」と呼ばれた抜け道がありました。船乗りたちはこれを利用し金銭を蓄え独立していきました。", "a": "1"}, {"exam": 23, "no": 22, "sub": "", "q": "北前船が大坂から蝦夷地へ向かうのを「下り」、その逆を「上り」といいますが、次のなかで間違っているのはどれでしょうか。", "a": "3"}, {"exam": 23, "no": 23, "sub": "A", "q": "この写真は、北運河にある北前船主の倉庫です。（ ）内に該当する番号を選びなさい。この北前船主は（A）出身で明治中期には6〜8隻の北前船を所有していました。この北前船主は後に（B）らとともに日本海上火災保険株式会社を創設し取締役に就任します。【A：出身地】", "a": "3"}, {"exam": 23, "no": 23, "sub": "B", "q": "この写真は、北運河にある北前船主の倉庫です。（ ）内に該当する番号を選びなさい。この北前船主は（A）出身で明治中期には6〜8隻の北前船を所有していました。この北前船主は後に（B）らとともに日本海上火災保険株式会社を創設し取締役に就任します。【B：人物】", "a": "2"}, {"exam": 23, "no": 24, "sub": "", "q": "小樽での日本遺産「北前船」の構成文化財には船絵馬があります。次の文章を読みこの船絵馬が奉納されているのは何というお寺でしょうか。このお寺は文久2(1862)年に開創し、本堂は小樽市指定歴史的建造物になっています。本殿左脇の龍神堂内には船絵馬が3面奉納されています。龍神堂正面には越前産の笏谷石製の狛犬、境内地には笏谷石製の三十三観音が設置されています。", "a": "徳源寺"}, {"exam": 23, "no": 25, "sub": "A", "q": "ある北前船主の説明です。文中の（ ）に当てはまる語句を記入しなさい。石川県加賀市橋立町出身で小樽に海運会社を設立。日露戦争後の海運発展に乗じ、「（A）の回漕店」といわれるようになった。天狗山麓にある金昆羅大本院はこの北前船主の農場の敷地内で祀ったものです。現在の（B）小学校付近にあった千登勢温泉は別荘でした。", "a": "東洋一"}, {"exam": 23, "no": 25, "sub": "B", "q": "ある北前船主の説明です。文中の（ ）に当てはまる語句を記入しなさい。石川県加賀市橋立町出身で小樽に海運会社を設立。日露戦争後の海運発展に乗じ、「（A）の回漕店」といわれるようになった。天狗山麓にある金昆羅大本院はこの北前船主の農場の敷地内で祀ったものです。現在の（B）小学校付近にあった千登勢温泉は別荘でした。", "a": "山の手"}, {"exam": 23, "no": 26, "sub": "", "q": "次の文章は北前船交易によりもたらされた文化です。それは何というものでしょうか。江戸時代宝永年間に商業が盛んになると販売促進のために登場した1枚物の商業印刷物です。浮世絵の影響を受けた多色刷りや絵画的芸術性の高いものも配布されました。", "a": "引札"}, {"exam": 23, "no": 84, "sub": "", "q": "小樽市内の神社、寺と関わりのある事柄の組合せで間違っているのは、次のどれでしょうか。", "a": "2"}], "鉄道": [{"exam": 1, "no": 6, "sub": "", "q": "手宮〜幌内間の鉄道敷設に直接貢献したお雇い外国人は誰ですか。", "a": "1"}, {"exam": 1, "no": 41, "sub": "", "q": "北海道の最初の鉄道、幌内鉄道建設のために設けられた開拓使の部局はどれでしょうか。", "a": "1"}, {"exam": 1, "no": 42, "sub": "", "q": "幌内鉄道開通（手宮−札幌間）当時の停車場は数も少なく、簡単な設備しかありませんでした。開通当初、手宮を出た列車が次に停車した駅（停車場）の当時の名前はどれでしょう。", "a": "1"}, {"exam": 1, "no": 43, "sub": "", "q": "幌内鉄道が手宮−札幌間で開通した明治13年、手宮から札幌までの汽車の所要時間は何時間だったでしょうか。", "a": "3"}, {"exam": 1, "no": 44, "sub": "", "q": "北海道鉄道の開通により現在の小樽駅が開業しますが、この駅は次々と名称が変わっていきます。その変遷で正しい組み合わせは次のどれでしょうか。", "a": "4"}, {"exam": 1, "no": 45, "sub": "", "q": "幌内鉄道1号機関車「義経」号は現在どこに保存されているでしょうか。", "a": "4"}, {"exam": 2, "no": 3, "sub": "", "q": "手宮〜幌内間の鉄道敷設に最も貢献したお雇い外国人は誰ですか。", "a": "クロフォード"}, {"exam": 2, "no": 5, "sub": "", "q": "上記の炭鉱から鉄道で実際に石炭が小樽に運ばれたのは次のうちどれですか。", "a": "2"}, {"exam": 2, "no": 40, "sub": "", "q": "幌内で発見された石炭が良質であることを見抜き、幌内炭鉱の開発を推進した開拓使物産取調掛は誰だったでしょうか。", "a": "榎本武揚えのもとたけあき"}, {"exam": 2, "no": 41, "sub": "", "q": "当初、幌内からの鉱石輸送は開拓使による水運工事を中心に計画され、オランダから河川工学の専門家ヨハン・G・ゲントを招きます。しかし、クロフォードによる札幌〜小樽間の馬車道の開削成功は鉄道主体の案に大きく変わっていく要因となります。しかし、それ以上に根本的な問題が水運案にはありました。もっとも深刻な問題はどれであったでしょうか。", "a": "4"}, {"exam": 2, "no": 42, "sub": "", "q": "明治12(1879)年、開拓使はクロフォードに札樽間道路の建設を命じます。クロフォードはこの工事を驚異的な日程で完成させます。それは何ヶ月だったでしょうか。", "a": "5ヶ月"}, {"exam": 2, "no": 43, "sub": "", "q": "明治12(1879)年12月、開拓使は石炭運搬の鉄道を幌内〜小樽間に敷設することを決定します。この時、小樽までの延伸で生まれる副次的な効果が『開拓使報文』に掲載されています。幌内鉄道のその後を決定付けたその副次的な効果とは何でしょうか。", "a": "4"}, {"exam": 2, "no": 44, "sub": "", "q": "幌内鉄道が手宮〜札幌間で開通した明治13(1880)年、手宮から札幌までの汽車の所要時間は約何時間だったでしょうか。", "a": "3時間"}, {"exam": 2, "no": 54, "sub": "", "q": "旧手宮機関車庫（手宮、明治18年）は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、後に北海道庁本庁舎（赤れんが庁舎、札幌市中央区、明治21年）も設計しました。さて、この設計者は、誰でしょうか。", "a": "ひらいせいじろう平井晴二郎"}, {"exam": 2, "no": 64, "sub": "", "q": "小樽の職人は様々な歴史的背景により生まれてきました。明治13年、手宮〜札幌間に鉄道が敷設されましたが、その土木・建設・金属加工技術に派生したおもな職人はどれでしょうか。", "a": "3"}, {"exam": 3, "no": 3, "sub": "", "q": "幌内の石炭を輸送するため、鉄道が敷設されます。手宮〜幌内間が開通したのはいつですか。", "a": "4"}, {"exam": 3, "no": 41, "sub": "", "q": "幌内で発見された良質の石炭をどうやって運び出すか、さまざまな意見が出ますが、北海道の開拓顧問ケブロンと地質調査をしたライマンが最適とした運搬方法はどれですか。", "a": "3"}, {"exam": 3, "no": 42, "sub": "", "q": "クロフォードが建設した車馬道は短期間ではありましたが、最初の公共交通機関である官設の駅逓馬車が設けられました。また冬季には新たな交通システムが導入されました。それはどのようなものですか。", "a": "雪馬車・馬橇"}, {"exam": 3, "no": 43, "sub": "", "q": "明治13年、札幌までの鉄道工事が着工されました。9月にはクロフォードが買い付けた鉄道資材が手宮桟橋に着きます。この資材を積んできた小樽港最初の外国船入港でもある船の名前は何と言いますか。", "a": "トベイ号"}, {"exam": 3, "no": 44, "sub": "", "q": "手宮〜札幌間の鉄道開通当時から今も残っているトンネルがあり、北海道最古といわれています。そのトンネルの名前は何といいますか。", "a": "義経トンネル・張碓第五トンネル"}, {"exam": 3, "no": 45, "sub": "", "q": "幌内鉄道には8両の蒸気機関車が導入されました。その内、6号までは「和名」がつけられています。正しい組み合わせはどれですか。", "a": "2"}, {"exam": 3, "no": 53, "sub": "", "q": "手宮に明治13年から鉄道施設を建設しました。最初の建物である事務所、停車場、工場等は木造で西洋風の外観でした。外壁の板の張り方が特徴ですが、この張り方を何といいますか。", "a": "下見板張り"}, {"exam": 3, "no": 54, "sub": "", "q": "旧手宮機関車庫（手宮、明治18年）は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、後に北海道庁本庁舎（赤れんが庁舎、札幌市中央区、明治21年）も設計しました。さて、この設計者は誰ですか。", "a": "平井晴二郎"}, {"exam": 4, "no": 4, "sub": "", "q": "幌内の石炭を輸送するため、鉄道が敷設されます。手宮〜札幌間が開通したのは明治13年ですが、幌内まで開通したのは明治何年でしょうか。", "a": "明治15年"}, {"exam": 4, "no": 5, "sub": "", "q": "開拓使はお雇い外国人の力を借りて開拓を進めていこうとしていました。その外国人の中で、幌内炭田の発見で大きな業績をあげた人物はだれでしょうか。", "a": "4"}, {"exam": 4, "no": 40, "sub": "", "q": "北海道の鉄道システムは本州がイギリスのシステムを導入したのに対し、アメリカのものを採用します。では北海道最初の軌道であった茅沼炭鉱のシステムはどこの国の技師が導入したのでしょうか。", "a": "2"}, {"exam": 4, "no": 41, "sub": "", "q": "北海道の最初の鉄道、幌内鉄道建設のために設けられた開拓使の拠点はどれでしょうか。", "a": "1"}, {"exam": 4, "no": 42, "sub": "", "q": "幌内鉄道開通（手宮−札幌間）当時の停車場は数も少なく、簡単な設備しかありませんでした。開通当初、手宮を出た列車が次に停車した駅（停車場）の当時の名前はどれでしょう。", "a": "1"}, {"exam": 4, "no": 43, "sub": "", "q": "明治13年クロフォードが買い付けた鉄道資材を積んだ船が手宮桟橋に着岸しました。この船の名前は何といいますか。", "a": "トベイ号"}, {"exam": 4, "no": 44, "sub": "", "q": "幌内鉄道につづいて明治20年に開通した北海道2番目の釧路鉄道（標茶−跡佐登）は何を運ぶために敷設されたのでしょうか。", "a": "2"}, {"exam": 4, "no": 45, "sub": "", "q": "幌内鉄道には8両の蒸気機関車が導入されました。現在、小樽市総合博物館にはその内の1両、6号機関車が保管されています。その名前は何といいますか。", "a": "しづか"}, {"exam": 4, "no": 52, "sub": "", "q": "手宮に明治13年から建設した鉄道施設は木造で西洋風の外観でした。その特長は外壁の板の張り方が下見板張りであること、もう一つ窓にありました。どんな窓だったでしょうか。", "a": "縦長窓または上げ下げ窓"}, {"exam": 4, "no": 53, "sub": "", "q": "旧手宮機関車庫（手宮、明治18年）は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者になりました。この技術者とはだれでしょうか。", "a": "平井晴二郎"}, {"exam": 4, "no": 54, "sub": "", "q": "上記の設問（問53）の技術者は、手宮で機関車庫を建築した経験を活かし、札幌でもある建物を設計しました。その建物とは何でしょうか。", "a": "2"}, {"exam": 5, "no": 4, "sub": "", "q": "手宮〜幌内間の鉄道が開通したのは明治15年ですが、鉄道敷設のもっとも大きな目的は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 41, "sub": "", "q": "幌内で発見された良質の石炭をどうやって運び出すか、さまざまな意見がでますが、北海道の開拓顧問ケプロンと地質調査をしたライマンが最適とした運搬方法はどれでしょうか。", "a": "3"}, {"exam": 5, "no": 42, "sub": "", "q": "北海道の最初の鉄道、幌内鉄道建設のために設けられた開拓使の部局はどれでしょうか。", "a": "4"}, {"exam": 5, "no": 43, "sub": "", "q": "幌内鉄道が手宮－札幌間で開通した明治13年、手宮から札幌までの汽車の所要時間は約何時間だったでしょうか。", "a": "3時間"}, {"exam": 5, "no": 44, "sub": "", "q": "北海道鉄道の開通により現在の小樽駅が開業しますが、この駅は次々と名称が変わっていきます。その変遷で正しい組み合わせは次のどれでしょうか。", "a": "4"}, {"exam": 5, "no": 45, "sub": "", "q": "北海道鉄道は工区を分けて建設し各地で部分開業を行いながら全線開通を目指していきます。では現在の小樽市内の駅で最も早く開業した北海道鉄道の駅はどこでしょうか。", "a": "2"}, {"exam": 5, "no": 52, "sub": "", "q": "明治13年から建設した小樽の鉄道施設の特長は木造の西洋風建築でした。明治10年代後半に入船の陸橋、手宮の倉庫、機関車庫は防火を目的に、ある材質で建設されました。その材質とはなんでしょうか。", "a": "れんが"}, {"exam": 5, "no": 53, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった（　A　）です。彼は留学の知識と手宮での建築の経験を発展させ、札幌の（　B　）を設計しました。", "a": "平井晴二郎"}, {"exam": 5, "no": 53, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった（　A　）です。彼は留学の知識と手宮での建築の経験を発展させ、札幌の（　B　）を設計しました。", "a": "北海道庁旧本庁舎"}, {"exam": 6, "no": 4, "sub": "", "q": "手宮から幌内までの鉄道が開通した時期で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 6, "no": 5, "sub": "", "q": "幌内鉄道を開通させるにあたり技師長となって指導したお雇い外国人は何という名前でしょうか。小樽市総合博物館に銅像のある人物です。", "a": "クロフォード"}, {"exam": 6, "no": 42, "sub": "", "q": "開拓使物産取調掛であった榎本武揚は、幌内で発見された石炭が良質であることを理解し、お雇い外国人を派遣します。その派遣された外国人はだれでしょうか。", "a": "4"}, {"exam": 6, "no": 43, "sub": "", "q": "幌内鉄道につづいて1887年に開通した北海道2番目の釧路鉄道（標茶－跡佐登）は何を運ぶために敷設されたのでしょうか。", "a": "2"}, {"exam": 6, "no": 44, "sub": "", "q": "明治12年12月、開拓使は石炭運搬の鉄道を幌内―小樽間に敷設することを決定します。この時、小樽までの延伸で生まれる副次的な効果が『開拓使報文』に掲載されています。幌内鉄道のその後を決定付けたその効果とは何でしょうか。", "a": "4"}, {"exam": 6, "no": 45, "sub": "", "q": "明治13年10月24日、手宮から熊碓間での試運転が行われます。北海道にはじめて蒸気機関車が走った日ですが、このときの機関車はどれでしょうか。", "a": "2"}, {"exam": 6, "no": 47, "sub": "", "q": "幌内鉄道で使用されたポーター社製機関車の義経号たちは国有化以降は和名ではなく形式番号で呼ばれるようになりました。以下の中でこれらの機関車につけられた形式番号はどれでしょう。", "a": "2"}, {"exam": 6, "no": 54, "sub": "", "q": "手宮に明治13年から建設した鉄道施設の特長は木造の西洋風建築で外壁を「下見板張り」にしてありました。この特長の説明で正しいのはどれでしょうか。", "a": "2"}, {"exam": 6, "no": 55, "sub": "A", "q": "（　）内に該当する人名を記入しなさい。旧手宮機関車庫は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった（　A　）と（　B　）です。", "a": "又は"}, {"exam": 6, "no": 55, "sub": "B", "q": "（　）内に該当する人名を記入しなさい。旧手宮機関車庫は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった（　A　）と（　B　）です。", "a": "松本荘一郎"}, {"exam": 7, "no": 4, "sub": "", "q": "内陸の幌内から石炭を輸送する目的で、まず明治13年、手宮から札幌までの鉄道が開通しました。その後、幌内まで開通したのは明治何年でしょうか。", "a": "明治15年"}, {"exam": 7, "no": 5, "sub": "", "q": "お雇い外国人ホーレス・ケプロンはアメリカから優秀な人材を呼び寄せ北海道開拓に力を発揮しました。呼び寄せた外国人のなかで、幌内炭田はじめ地質調査で活躍した人物は誰でしょうか。", "a": "ベンジャミン・スミス・ライマン"}, {"exam": 7, "no": 41, "sub": "", "q": "北海道開拓に関わった人物とその主な役割の組み合わせで間違っているのはどれでしょうか。", "a": "1"}, {"exam": 7, "no": 42, "sub": "", "q": "北海道の最初の鉄道、幌内鉄道建設のために設けられた開拓使の部局はどれでしょうか。", "a": "3"}, {"exam": 7, "no": 44, "sub": "", "q": "次の（　）内に該当する数字を記入しなさい。明治12年、開拓使はクロフォードに札樽間に車馬道の建設を命じ、クロフォードはこの工事を（　）ケ月間という驚異的な日程で明治12年12月に完成させます。", "a": "5"}, {"exam": 7, "no": 45, "sub": "", "q": "幌内鉄道開通（手宮－札幌間）当時の停車場は数も少なく4駅でした。その4駅とは次のどれでしょうか。", "a": "2"}, {"exam": 7, "no": 46, "sub": "", "q": "（　）内に該当する語句をどれでしょうか。幌内鉄道は明治21年、業績不振により北有社に運輸委託されましたが抜本的な経営改革は出来ず明治22年、（　）に払い下げられました。", "a": "1"}, {"exam": 7, "no": 47, "sub": "", "q": "幌内鉄道6号機関車「しづか」号は現在どこに保存されているでしょうか。", "a": "2"}, {"exam": 7, "no": 54, "sub": "", "q": "手宮の鉄道施設で、明治18年に建設された機関車庫の特長は次のどれでしょうか。", "a": "2"}, {"exam": 7, "no": 55, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫の建設を指導したのは平井晴二郎と（　A　）で、さらに平井晴二郎は札幌でも（　B　）を設計しています。", "a": "松本荘一郎"}, {"exam": 7, "no": 55, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫の建設を指導したのは平井晴二郎と（　A　）で、さらに平井晴二郎は札幌でも（　B　）を設計しています。", "a": "北海道庁旧本庁舎"}, {"exam": 8, "no": 42, "sub": "", "q": "幌内で発見された良質の石炭を運び出す手段として、幌内から鉄道で室蘭の港まで運搬するのが最適という報告をケプロンがしますが、その地質調査をした人物は次のどれでしょうか。", "a": "3"}, {"exam": 8, "no": 43, "sub": "", "q": "幌内鉄道に続いて、明治20年に開通した北海道2番目の鉄道は硫黄鉱石を運ぶ専用線でした。この鉄道は何と呼ばれたでしょうか。", "a": "4"}, {"exam": 8, "no": 44, "sub": "", "q": "明治13年、幌内鉄道建設最初の難工事といわれた、入船川の谷をまたぐ陸橋の工事は、クロフォードや松本荘一郎らの努力で無事竣工しますが、この架橋工事はおよそどのくらいの期間が必要であったでしょうか。", "a": "1"}, {"exam": 8, "no": 45, "sub": "", "q": "明治13年10月24日、手宮から熊碓間でのレールの敷設が完成し、試運転が行われます。北海道に初めて蒸気機関車が走った日ですが、このときの機関車は次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 46, "sub": "", "q": "次の（　）内に該当する数字を書きなさい。手宮―札幌間の鉄道開業当初（明治13年）、朝9：00に手宮を出発した列車が札幌に到着したのは（　）：00でした。", "a": "12"}, {"exam": 8, "no": 47, "sub": "", "q": "明治36年、北海道鉄道の開通により現在の小樽駅が開業しますが、この駅は次々と名称が変わっていきます。その変遷で正しい組み合わせは次のどれでしょうか。", "a": "4"}, {"exam": 8, "no": 54, "sub": "", "q": "明治18年に手宮の機関車庫を建設しました。この建物はれんがを使いましたが、その主たる目的は次のどれでしょうか。", "a": "3"}, {"exam": 8, "no": 55, "sub": "A", "q": "（　）内に該当する語句を書きなさい。旧手宮機関車庫をれんがで建設する指導をしたのは松本荘一郎と（　A　）で、この二人はニューヨーク州トロイにある（　B　）に留学し技術を学びました。", "a": "平井晴二郎"}, {"exam": 8, "no": 55, "sub": "B", "q": "（　）内に該当する語句を書きなさい。旧手宮機関車庫をれんがで建設する指導をしたのは松本荘一郎と（　A　）で、この二人はニューヨーク州トロイにある（　B　）に留学し技術を学びました。", "a": "レンセラー工科大学"}, {"exam": 8, "no": 89, "sub": "", "q": "平成22年10月14日、ＪＲ北海道は新たに3点、鉄道記念物として指定しました。いずれも小樽市総合博物館に保存されている車輌です。「しづか号機関車」「い1号客車」、あともう一つは次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 5, "sub": "", "q": "明治13年、手宮〜札幌間に鉄道が開通します。「一般営業鉄道」として日本で何番目に開通した鉄道でしょうか。", "a": "3番目"}, {"exam": 9, "no": 41, "sub": "", "q": "幌内の石炭が良質であることを理解した開拓使物産取調掛は、開拓使お雇い外国人のライマンを派遣しました。これが北海道の石炭産業の幕開け、また小樽に鉄道が敷かれる要因となった時でした。この開拓使物産取調掛とは誰でしょうか。", "a": "榎本武揚"}, {"exam": 9, "no": 42, "sub": "", "q": "幌内で発見された良質の石炭をどうやって運び出すか、さまざまな意見がでますが、北海道の開拓顧問ケプロンと地質調査をしたライマンが最適とした運搬方法はどれでしょうか。", "a": "1"}, {"exam": 9, "no": 43, "sub": "", "q": "そもそも鉄道の生まれたイギリスでは、鉄道は何を運搬する手段として生まれたものでしょうか。運搬したものを書きなさい。", "a": "石炭又は鉱石"}, {"exam": 9, "no": 44, "sub": "", "q": "明治12年、開拓使はクロフォードに札樽間道路の建設を命じました。それは驚異的な日程で道路を完成させました。その建設期間は次のどれでしょうか。", "a": "4"}, {"exam": 9, "no": 45, "sub": "", "q": "鉄道敷設のルートが決定し、クロフォードは資材調達でアメリカに戻りました。その間、北海道初めての鉄道工事は副長によって若竹第三トンネルの開削から始まりました。その時の副長とは次のどれでしょうか。", "a": "1"}, {"exam": 9, "no": 46, "sub": "", "q": "次の（　）内に該当する語句を選びなさい。熊碓から銭函までの区間には、明治13年の鉄道建設当時から今でも残っているものがあります。いずれも北海道最古で、一つは通称「義経トンネル」、もう一つはレンガ橋脚で（　）鉄橋といいます。", "a": "3"}, {"exam": 9, "no": 47, "sub": "", "q": "幌内鉄道に導入された蒸気機関車は6号まで「和名」がつけられていました。次の4つの中で正しいのはどれでしょうか。", "a": "1"}, {"exam": 9, "no": 54, "sub": "A", "q": "（　）内に該当する語句を書きなさい。明治13年、手宮の鉄道施設として木造の西洋風外観の建物ができました。その特徴は、外壁を（　A　）にして、窓の戸を上下させる（　B　）にしていることです。", "a": "横板張り又は下見板張り"}, {"exam": 9, "no": 54, "sub": "B", "q": "（　）内に該当する語句を書きなさい。明治13年、手宮の鉄道施設として木造の西洋風外観の建物ができました。その特徴は、外壁を（　A　）にして、窓の戸を上下させる（　B　）にしていることです。", "a": "縦長窓又は上げ下げ窓"}, {"exam": 9, "no": 64, "sub": "", "q": "小樽の職人は様々な歴史的背景により生まれてきました。明治13年、手宮〜札幌間に鉄道が敷設されましたが、その土木・建設・金属加工技術から派生したおもな職人はどれでしょうか。", "a": "3"}, {"exam": 10, "no": 4, "sub": "", "q": "北海道内陸から石炭を輸送するため、鉄道が敷設されます。手宮〜札幌間が開通したのは明治13年ですが、明治15年に開通したのは手宮とどこでしょうか。地名を書きなさい。", "a": "幌内"}, {"exam": 10, "no": 5, "sub": "", "q": "開拓使はお雇い外国人の力を借りて開拓を進めていこうとしていました。その外国人の中で、鉄道敷設で活躍した人物はだれでしょうか。", "a": "3"}, {"exam": 10, "no": 42, "sub": "", "q": "（　）内に該当する語句を記入しなさい。明治期、鉄道は都市間交通としてつくられた新橋〜横浜間、神戸〜京都間は（　）の技術を導入し、幌内鉄道はアメリカの技術を採用した。", "a": "イギリスまたは英国"}, {"exam": 10, "no": 43, "sub": "", "q": "北海道の最初の鉄道、幌内鉄道建設のために設けられた開拓使の部局はどれでしょうか。", "a": "2"}, {"exam": 10, "no": 44, "sub": "", "q": "明治12年、クロフォードが建設した札樽間の車馬道は1年足らずの使用期間ではありましたが、最初の公共交通機関である官設の駅逓馬車が設けられ、冬季には新たな交通システムとして導入し、片道の所要時間は3時間程度でした。それはどのような乗り物でしょうか。", "a": "雪馬車または馬そり"}, {"exam": 10, "no": 45, "sub": "", "q": "明治13年、札幌までの鉄道工事が着工され、9月にはクロフォードが買い付けた鉄道資材が手宮桟橋に着きます。小樽港最初の外国船入港でもありました。この資材を積んできた船の名前は何というでしょうか。", "a": "トベイ号"}, {"exam": 10, "no": 46, "sub": "", "q": "幌内鉄道開通後の明治19年、北海道庁は函館と札幌を結ぶ鉄道を官設によって運営していこうと計画します。この時、測量調査を命じられたのは次の誰でしょうか。", "a": "3"}, {"exam": 10, "no": 47, "sub": "", "q": "明治37年10月、小樽と函館間の鉄道が開通しました。この時、小樽中央と函館間の3等運賃はいくらだったでしょうか。次の中から選びなさい。", "a": "1"}, {"exam": 10, "no": 54, "sub": "A", "q": "（　）内に該当する語句を書きなさい。手宮に明治13年から建設した鉄道施設の特徴は木造の（　A　）風建築であったこと、もう一つは入船の陸橋、手宮の倉庫、機関車庫は防火を目的に、（　B　）で建設されました。その材質とはなんでしょうか。", "a": "西洋"}, {"exam": 10, "no": 54, "sub": "B", "q": "（　）内に該当する語句を書きなさい。手宮に明治13年から建設した鉄道施設の特徴は木造の（　A　）風建築であったこと、もう一つは入船の陸橋、手宮の倉庫、機関車庫は防火を目的に、（　B　）で建設されました。その材質とはなんでしょうか。", "a": "れんが"}, {"exam": 10, "no": 55, "sub": "", "q": "旧手宮機関車庫（手宮、明治18年）は、国指定重要文化財ですが、この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者になりました。大正3年、東京駅新築にも関わったこの技術者とはだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "平井晴二郎"}, {"exam": 11, "no": 4, "sub": "", "q": "明治期、幌内の石炭を輸送するため、鉄道が敷設されます。手宮〜幌内間が開通したのは何年でしょうか。", "a": "3"}, {"exam": 11, "no": 42, "sub": "", "q": "開拓使物産取調掛だった榎本武揚は幌内の石炭がきわめて良質であったことを理解し、あるお雇い外国人を派遣しました。これが後に小樽に鉄道が敷かれる要因となります。この外国人とは次のどれでしょうか。", "a": "3"}, {"exam": 11, "no": 43, "sub": "", "q": "幌内からの鉄道建設にあたり、当初ライマンは小樽までではなく、別の港の方が適していると考えていました。その港とは次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 44, "sub": "", "q": "幌内鉄道に続いて、明治20年に開通した北海道2番目の鉄道は硫黄鉱石を運ぶ専用線でした。この鉄道名は次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 45, "sub": "", "q": "明治12年、開拓使はクロフォードに札樽間の道路建設を命じます。クロフォードはこの工事を驚異的な日程で完成させました。それは次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 46, "sub": "", "q": "明治12年12月、開拓使は石炭運搬の鉄道を幌内―小樽間に敷設することを決定します。この時、小樽までの延伸で生まれる副次的な効果が『開拓使報文』に掲載されています。掲載されているその効果とは次のどれでしょうか。", "a": "4"}, {"exam": 11, "no": 47, "sub": "", "q": "明治13年10月24日、手宮から熊碓間で機関車の試運転が行われます。北海道にはじめて蒸気機関車が走った日ですが、このときの機関車名を書きなさい。", "a": "弁慶号"}, {"exam": 11, "no": 48, "sub": "", "q": "（　）内に該当する語句はどれでしょうか。幌内鉄道は明治21年、業績不振により北有社に運輸委託されましたが抜本的な経営改革は出来ず明治22年、（　）に払い下げられました。", "a": "4"}, {"exam": 11, "no": 54, "sub": "", "q": "手宮に明治13年から鉄道施設を建設しました。最初の建物である事務所、停車場、工場等は木造で西洋風の外観でした。外壁の板の張り方に特徴があります。この板の張り方を何といいますか。", "a": "横板張り又は下見板張り"}, {"exam": 11, "no": 55, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫の建設を指導したのは平井晴二郎と（　A　）で、さらに平井晴二郎は大正3年、東京で（　B　）新築の統括責任者として関わっています。", "a": "松本荘一郎"}, {"exam": 11, "no": 55, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫の建設を指導したのは平井晴二郎と（　A　）で、さらに平井晴二郎は大正3年、東京で（　B　）新築の統括責任者として関わっています。", "a": "東京駅"}, {"exam": 12, "no": 5, "sub": "", "q": "北海道の地質と鉱山の調査にあたり、幌内で炭鉱を発見し、更に炭鉱の開発や石炭の輸送などの技術者を育てたのは次の誰でしょうか。", "a": "4"}, {"exam": 12, "no": 40, "sub": "", "q": "北海道開拓に関わった人物とその主な役割の組み合わせで間違っているのはどれでしょうか。", "a": "3"}, {"exam": 12, "no": 41, "sub": "", "q": "幌内鉄道が建設される前年、開拓使はクロフォードに札樽間道路の建設を命じました。この完成した道路に該当するのは次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 42, "sub": "", "q": "明治6(1873)年、幌内で発見された石炭をどうやって運び出すか、さまざまな意見がでますが、北海道の開拓顧問ケプロンと地質調査をしたライマンが最適とした運搬ルートはどれでしょうか。", "a": "3"}, {"exam": 12, "no": 43, "sub": "", "q": "小樽、幌内間の鉄道敷設のルート決定をうけ、北海道初めての鉄道工事は若竹第三トンネルの開削から始まりました。これを指揮したのは次の誰でしょうか。", "a": "2"}, {"exam": 12, "no": 44, "sub": "", "q": "朝里から銭函までの鉄道区間で、鉄道建設当時のトンネルが現存しています。そのトンネル名を書きなさい。", "a": "義経トンネル又は張碓第五トンネル"}, {"exam": 12, "no": 45, "sub": "", "q": "幌内鉄道に導入された蒸気機関車は6号まで「和名」がつけられていました。次の4つの中で正しいのはどれでしょうか。", "a": "1"}, {"exam": 13, "no": 5, "sub": "", "q": "北海道開拓において、お雇い外国人は今日につながる技術などを指導してくれました。次の中で、お雇い外国人とは関連のないものはどれでしょうか。", "a": "4"}, {"exam": 13, "no": 40, "sub": "", "q": "明治4年、黒田清隆、森有礼、ホーレス・ケプロンがアメリカで対談し、ケプロン自らが開拓顧問となり、北海道開拓の設計図を作ることになります。その中で鉄道建設のため、ケプロンは重要な人物を招きます。一人はクロフォード、もう一人は誰でしょうか。", "a": "ライマン"}, {"exam": 13, "no": 41, "sub": "", "q": "北海道の最初の鉄道、幌内鉄道建設のために設けられた開拓使の部局はどれでしょうか。", "a": "3"}, {"exam": 13, "no": 42, "sub": "", "q": "そもそも鉄道の生まれたイギリスでは、鉄道は何を運搬する手段として生まれたものでしょうか。運搬したものを書きなさい。蒸気機関車を実用化したスチーブンソンのロコモーション号もこれらを運搬するために生み出されたものです。", "a": "石炭または鉱石"}, {"exam": 13, "no": 43, "sub": "", "q": "次の（　）内に該当する数字を記入しなさい。明治12年、開拓使はクロフォードに札樽間に（　）の建設を命じ、クロフォードはこの工事を5ケ月間という驚異的な日程で明治12年12月に完成させます。", "a": "質問に不備がありましたので全員1点加点"}, {"exam": 13, "no": 44, "sub": "", "q": "幌内鉄道敷設のルートが決定し、クロフォードは資材調達でアメリカに戻りました。その間、北海道初めての鉄道工事は副長の指揮により若竹第三トンネルの開削から始まりました。その時の副長とは次のどれでしょうか。", "a": "2"}, {"exam": 13, "no": 50, "sub": "", "q": "明治13年から手宮に建設された鉄道施設の特長は木造の西洋風建築であったこと、もう一つは明治16年から入船の陸橋、手宮の倉庫、機関車庫は防火を目的に、ある材質で建設されました。その材質とはなんでしょうか。", "a": "れんが"}, {"exam": 13, "no": 87, "sub": "A", "q": "小樽市内の文化財を説明した文章です。（　）内に該当する語句を選びなさい。「手宮にある旧鉄道施設は（　A　）指定の文化財です。指定されているのは機関車庫3号、1号、転車台、貯水槽、危険品庫、（　B　）から構成されています。」", "a": "3"}, {"exam": 13, "no": 87, "sub": "B", "q": "小樽市内の文化財を説明した文章です。（　）内に該当する語句を選びなさい。「手宮にある旧鉄道施設は（　A　）指定の文化財です。指定されているのは機関車庫3号、1号、転車台、貯水槽、危険品庫、（　B　）から構成されています。」", "a": "2"}, {"exam": 14, "no": 11, "sub": "", "q": "平磯岬にある旅館「銀鱗荘」は、明治33年に建設された余市町の大漁家猪俣家住宅を昭和13年に移築したものです。これは小樽のある会社の創業20年の記念事業のひとつとして行われました。その会社名は次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 39, "sub": "", "q": "次の人物のなかで、明治13年に着工した幌内鉄道建設に関わっていないのはどれでしょうか。", "a": "3"}, {"exam": 14, "no": 40, "sub": "", "q": "幌内から石炭を輸送する鉄道建設にあたり、当初ライマンは小樽港へのルートではなく、別の港と結ぶルートの方が適していると考えていました。その港とは次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 41, "sub": "", "q": "明治13年、幌内鉄道建設最初の難工事といわれた、入船川の谷をまたぐ陸橋の工事は、クロフォードや松本荘一郎らの努力で無事竣工しますが、この架橋工事はどのくらいの期間で完成したでしょうか。", "a": "9日間"}, {"exam": 14, "no": 42, "sub": "", "q": "手宮〜札幌間の鉄道建設はわずか11ケ月という短い期間で完成しました。工期を短くした要因の一つとなったのは次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 43, "sub": "", "q": "明治13年10月24日、手宮から熊碓までの鉄道が敷設され、試運転が行われます。北海道にはじめて蒸気機関車が走った日ですが、このときの機関車は次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 44, "sub": "", "q": "明治20年、北海道で2番目の鉄道が開通しました。この鉄道は硫黄鉱石を運ぶ専用線でした。この鉄道の名称は次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 45, "sub": "", "q": "北海道鉄道の開通により現在の小樽駅が開業しますが、この駅は次々と名称が変わっていきます。その変遷で正しい組み合わせは次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 52, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。明治16年から手宮の鉄道施設の建造物に（　A　）を使う計画が始まりました。その目的は火災から守るためでした。この建設を指導したのは松本荘一郎と（　B　）でした。Bは札幌の北海道庁旧本庁舎の設計もしました。", "a": "れんが"}, {"exam": 14, "no": 52, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。明治16年から手宮の鉄道施設の建造物に（　A　）を使う計画が始まりました。その目的は火災から守るためでした。この建設を指導したのは松本荘一郎と（　B　）でした。Bは札幌の北海道庁旧本庁舎の設計もしました。", "a": "平井晴二郎"}, {"exam": 14, "no": 75, "sub": "", "q": "平成13年度より始まった旧手宮線散策路の整備が平成28年10月で終了し、新たな観光ルートの一つとして期待されています。寿司屋通りから小樽市総合博物館までつながった散策路の総延長は次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 78, "sub": "", "q": "大正13年12月、幌内炭鉱で使用する火薬類の積み替え中に起きた爆発事故で多くの死者、行方不明者が出ました。急きょ遺体を安置および検死作業をするため、このお寺の境内が使われました。現在も惨事の慰霊碑があるお寺は、何という坂に位置するでしょうか。坂の名前を書きなさい。", "a": "浄応寺の坂"}, {"exam": 15, "no": 39, "sub": "", "q": "幌内の石炭が良質であることを理解した開拓使物産取調掛であった榎本武揚は、開拓使お雇い外国人を派遣しました。これが北海道の石炭産業の幕開け、また小樽に鉄道が敷かれる要因となった時でした。このお雇い外国人とは誰でしょうか。", "a": "ライマン"}, {"exam": 15, "no": 40, "sub": "", "q": "幌内で発見された良質の石炭をどうやって運び出すか、さまざまな意見がでますが、北海道の開拓顧問ケプロンが、明治6年に黒田清隆に報告した運搬方法はどれでしょうか。", "a": "3"}, {"exam": 15, "no": 41, "sub": "", "q": "そもそも鉄道は石炭や鉱石を運搬する手段として生まれたものでした。鉄道はどこの国から生まれたでしょうか。", "a": "イギリス"}, {"exam": 15, "no": 42, "sub": "", "q": "北海道の鉄道、幌内鉄道建設のために設けられた開拓使の部局名は次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 43, "sub": "", "q": "幌内鉄道建設を支えた中に日本人の若い技師がいました。江別の橋梁の設計施工を担当した人物とは次の誰でしょうか。", "a": "1"}, {"exam": 15, "no": 44, "sub": "", "q": "幌内鉄道は業績不振により、明治21年には民間会社の北有社に運輸委託されたが経営改革はできず、明治22年に別の会社に払い下げられました。その会社名は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 45, "sub": "", "q": "幌内鉄道に導入された蒸気機関車は艦船と同じく6号まで「和名」がつけられていました。次の4つの中で正しいのはどれでしょうか。", "a": "2"}, {"exam": 15, "no": 52, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫は、わが国最古のれんが造の機関車庫として（　A　）に指定されています。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった平井晴二郎と（　B　）です。", "a": "国指定重要文化財"}, {"exam": 15, "no": 52, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。旧手宮機関車庫は、わが国最古のれんが造の機関車庫として（　A　）に指定されています。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった平井晴二郎と（　B　）です。", "a": "松本荘一郎"}, {"exam": 16, "no": 3, "sub": "", "q": "小樽は「村並」から「郡」へと変わっていきました。「郡」となった年にあった出来事で違うのは次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 5, "sub": "", "q": "明治7年に開拓長官となった黒田清隆は北海道開拓を大きく進めることになります。その一つがお雇い外国人による様々な技術の導入です。そのなかで開拓使顧問として契約したのはだれでしょうか。", "a": "3"}, {"exam": 16, "no": 40, "sub": "", "q": "北海道の鉄道システムは本州がイギリスのシステムを導入したのに対し、アメリカのものを採用します。では北海道最初の軌道であった茅沼炭鉱のシステムはどこの国の技師が導入したのでしょうか。", "a": "2"}, {"exam": 16, "no": 41, "sub": "", "q": "クロフォードの車馬道建設以前にも小樽－札幌間の陸路建設の試みがありました。熊碓村から下手稲村への幅二間の道路が開通したのはいつでしょうか。", "a": "4"}, {"exam": 16, "no": 42, "sub": "", "q": "クロフォードが建設した車馬道は短期間ではありましたが、最初の公共交通機関である官設の駅逓馬車が設けられました。またここでは黒田清隆の意向を受けウラジオストックをモデルにした交通システムが導入されました。それは次のどれでしょうか。", "a": "3"}, {"exam": 16, "no": 43, "sub": "", "q": "幌内鉄道建設の決定をうけ、クロフォードは機材の調達にアメリカに戻ります。その間、北海道初めての鉄道工事は副長であった日本人技師が指揮しました。その技師とは誰でしょうか。", "a": "松本荘一郎"}, {"exam": 16, "no": 44, "sub": "", "q": "幌内鉄道開通（手宮－札幌間）当時の停車場は数も少なく、簡単な設備しかありませんでした。開通当初、手宮を出た列車が次に停車した駅（停車場）の当時の名前はどれでしょう。", "a": "1"}, {"exam": 16, "no": 45, "sub": "A", "q": "次の（　）内に該当する数字を書きなさい。手宮－札幌間の鉄道開通当初（明治13年）、朝（　A　）：00に手宮を出発した列車が札幌に到着したのは（　B　）：00でした。", "a": "9"}, {"exam": 16, "no": 45, "sub": "B", "q": "次の（　）内に該当する数字を書きなさい。手宮－札幌間の鉄道開通当初（明治13年）、朝（　A　）：00に手宮を出発した列車が札幌に到着したのは（　B　）：00でした。", "a": "12"}, {"exam": 17, "no": 6, "sub": "", "q": "日本初の総合的な地質図「日本蝦夷地質要略之図」が作成された明治9(1876)年5月10日を記念して、この日を「地質の日」として制定しました。この地図を作製した外国人は次のどれでしょうか。", "a": "4"}, {"exam": 17, "no": 40, "sub": "", "q": "石炭は日本の近代化に大きな貢献をしますが、幌内で石炭が発見される以前の幕末から北海道の炭鉱で採炭されていたのは次のうちどれでしょうか。", "a": "1"}, {"exam": 17, "no": 41, "sub": "", "q": "（　）内に該当する語句を記入しなさい。明治期、幌内鉄道はアメリカの鉄道システムを導入し建設されましたが、都市間交通としてつくられた新橋〜横浜間、神戸〜京都間は（　）の技術を採用した。", "a": "イギリスまたは英国"}, {"exam": 17, "no": 42, "sub": "", "q": "幌内の山奥で発見された重たい石炭をどうやって運び出すか、さまざまな意見がでますが、北海道の開拓顧問ケプロンと地質調査をしたライマンが最適とした搬送方法はどれでしょうか。", "a": "1"}, {"exam": 17, "no": 43, "sub": "", "q": "幌内鉄道につづいて明治20(1887)年に開通した北海道2番目の釧路鉄道（標茶－跡佐登）は何を運ぶために敷設された鉄道だったでしょうか。", "a": "2"}, {"exam": 17, "no": 44, "sub": "", "q": "次の（　）内に該当する数字を記入しなさい。明治12(1879)年、開拓使はクロフォードに札樽間に車馬道の建設を命じ、クロフォードはこの工事を（　）という驚異的な日程で明治12年12月に完成させます。", "a": "5ヶ月間"}, {"exam": 17, "no": 45, "sub": "", "q": "明治12(1879)年12月、開拓使は石炭運搬の鉄道を幌内〜小樽間に敷設することを決定します。この時、小樽までの延伸で生まれる副次的な効果が『開拓使報文』に掲載されています。その効果とは次のどれでしょうか。", "a": "4"}, {"exam": 17, "no": 46, "sub": "", "q": "幌内鉄道開通後の明治19(1886)年、北海道庁は函館と札幌を結ぶ鉄道を官設によって運営していこうと計画します。この時、測量調査を命じられたのは次の誰でしょうか。", "a": "3"}, {"exam": 17, "no": 53, "sub": "A", "q": "（　）内に該当する語句を書きなさい。手宮にある機関車庫は防火のため（　A　）を用いて建設されています。これらの鉄道施設建設の指導は開拓使の技術者になった松本荘一郎と（　B　）でした。", "a": "れんが"}, {"exam": 17, "no": 53, "sub": "B", "q": "（　）内に該当する語句を書きなさい。手宮にある機関車庫は防火のため（　A　）を用いて建設されています。これらの鉄道施設建設の指導は開拓使の技術者になった松本荘一郎と（　B　）でした。", "a": "平井晴二郎"}, {"exam": 17, "no": 54, "sub": "", "q": "（　）内に該当する語句を書きなさい。問53のBは手宮での建築の経験を発展させ、札幌の（　）を設計し、さらに東京駅の新築工事では帝国鉄道庁総裁として総括した人物です。", "a": "北海道庁旧庁舎または赤レンガ庁舎"}, {"exam": 18, "no": 37, "sub": "", "q": "問36の工事は現在の高知県出身の技師が指揮しました。また幌内鉄道建設では橋梁の設計にも携わっていました。この人物とは誰でしょうか。この人物名（姓・名両方）を書きなさい。", "a": "広井勇"}, {"exam": 18, "no": 40, "sub": "", "q": "次の4人のなかで、幌内鉄道建設に関わっていない人物はどれでしょうか。", "a": "2"}, {"exam": 18, "no": 41, "sub": "", "q": "次の文章の（　）内に該当する数字を記入しなさい。「開拓使が札樽間の道路建設費の見積りをイギリス人のジョン・ペリーに依頼したところ当時の金額で85万円という巨額の金額でしたが、それに対してクロフォードが出した金額は、はるかに下回る（　）万円でした。」", "a": "5"}, {"exam": 18, "no": 42, "sub": "", "q": "北海道で最初の鉄道、幌内鉄道建設のために設けられた開拓使の部局はどれでしょうか。", "a": "2"}, {"exam": 18, "no": 43, "sub": "", "q": "明治13年10月24日、手宮から熊碓間までの鉄道が敷設され、試運転が行われます。入船川陸橋を渡るシーンは幌内鉄道の写真としては一番有名です。このときの機関車は次のどれでしょうか。", "a": "3"}, {"exam": 18, "no": 44, "sub": "", "q": "札幌―幌内間の鉄道建設は手宮―札幌間に比べ困難な工事となりました。最も困難だった理由で正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 45, "sub": "", "q": "2020年は旧官営幌内鉄道の手宮―札幌間の開通からの節目の年で、小樽で様々なイベントが開催されました。開通から何年目だったでしょうか。", "a": "140年"}, {"exam": 18, "no": 46, "sub": "", "q": "官営幌内鉄道は開通後の明治21（1888）年、業績不振により民間会社の北有社に運輸委託された後、明治22（1889）年に、ある会社に払い下げられます。その会社とは次のどれでしょうか。", "a": "2"}, {"exam": 18, "no": 47, "sub": "", "q": "明治36（1903）年、北海道鉄道の部分開通により現在の小樽駅が開業しますが、この駅の名称は次々と変わっていきます。小樽中央から始まった駅名の変遷で正しい組み合わせは次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 53, "sub": "A", "q": "明治期における手宮の鉄道に関わる建築について（　）内に該当する語句を書きなさい。最初の建物は木造で西洋風の外観でした。その特徴は外壁を（　A　）にして窓の戸を上下させる（　B　）でした。", "a": "横板張り又は下見板張り"}, {"exam": 18, "no": 53, "sub": "B", "q": "明治期における手宮の鉄道に関わる建築について（　）内に該当する語句を書きなさい。最初の建物は木造で西洋風の外観でした。その特徴は外壁を（　A　）にして窓の戸を上下させる（　B　）でした。", "a": "縦長窓又は上げ下げ窓"}, {"exam": 18, "no": 54, "sub": "", "q": "手宮でのレンガづくりの鉄道の建築には平井晴二郎が関わっていました。次のなかで平井晴二郎が関わっていない建物はどれでしょうか。", "a": "4"}, {"exam": 18, "no": 76, "sub": "", "q": "「小樽八区八景」のある地区の八景の一つに「義経トンネルと煉瓦の橋」があります。該当する地区は次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 89, "sub": "", "q": "手宮にある旧鉄道施設は国指定の重要文化財です。指定されている組合せで正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 19, "no": 2, "sub": "", "q": "明治2（1869）年、7月〜9月の蝦夷地（現在の北海道）での出来事で正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 5, "sub": "", "q": "北海道開拓は、お雇い外国人の知恵と技術を借り、積極的に活用したことで開拓は大きく進みました。開拓次官だった黒田清隆はアメリカに渡り、農務省長官だった人物を開拓使顧問として迎える契約をしました。この契約したアメリカ人とは次のどれでしょうか。", "a": "2"}, {"exam": 19, "no": 40, "sub": "", "q": "北海道の鉄道建設に関わった人物とその主な役割の組み合わせで間違っているのはどれでしょうか。", "a": "1"}, {"exam": 19, "no": 41, "sub": "", "q": "幌内鉄道が建設される前年、開拓使はクロフォードに札樽間道路の建設を命じました。この工事をクロフォードは驚異的な日程で完成させました。それは何か月だったでしょうか。", "a": "5ヶ月"}, {"exam": 19, "no": 42, "sub": "", "q": "明治6（1873）年、幌内で発見された石炭をどうやって運び出すか、さまざまな意見がでますが、北海道の開拓顧問ケプロンと地質調査をしたライマンが最適とした運搬ルートは次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 43, "sub": "", "q": "小樽、幌内間の鉄道敷設のルート決定をうけ、本格的な鉄道工事は若竹第三トンネルの開削から始まりました。これを指揮したのは次の誰でしょうか。", "a": "2"}, {"exam": 19, "no": 44, "sub": "", "q": "幌内鉄道建設の初期の現場はクロフォードがアメリカからつれてきた米国人技術者チームでした。彼らが活動するにあたり仮宿舎となった所が、小樽市内のある高校の位置だったといわれています。その高校名は何というでしょうか。", "a": "双葉高等学校"}, {"exam": 19, "no": 45, "sub": "", "q": "全通した幌内鉄道は明治16（1883）年に開通式が行われました。朝7時に盛大な見送りを受けて出発した「比羅夫」号は札幌に8時40分到着。その後、幌内に到着したのは次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 47, "sub": "", "q": "幌内鉄道に導入された蒸気機関車は6号まで「和名」がつけられていました。次の4つの中で正しいのはどれでしょうか。", "a": "1"}, {"exam": 20, "no": 2, "sub": "", "q": "蝦夷地が「北海道」と改称された明治2(1869)年、ある出来事により北海道へ人が流れてくるようになりました。それは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 40, "sub": "", "q": "幌内で発見された石炭が良質であることを理解した開拓使物産取調掛であった榎本武揚は、お雇い外国人を派遣しました。これが近代日本を支えた北海道の石炭産業の幕開け、また小樽に鉄道が敷かれる要因となった時でした。このお雇い外国人とは誰でしょうか。", "a": "ライマン"}, {"exam": 20, "no": 41, "sub": "A", "q": "次の文中の（　）に当てはまる人名又は該当する語句を書きなさい。（人名は姓のみ不可）明治4（1871）年、（　A　）や森有礼とアメリカ農務省長官ホーレス・ケプロンがアメリカで会談し、ケプロン自らが開拓顧問となり北海道開拓の設計図を作ることになります。開拓を実行するために様々な分野の人材を招聘することになり、そのなかに鉄道建設に尽力した人物がいたことで、北海道の鉄道システムが（　B　）となりました。", "a": "黒田清隆"}, {"exam": 20, "no": 41, "sub": "B", "q": "次の文中の（　）に当てはまる人名又は該当する語句を書きなさい。（人名は姓のみ不可）明治4（1871）年、（　A　）や森有礼とアメリカ農務省長官ホーレス・ケプロンがアメリカで会談し、ケプロン自らが開拓顧問となり北海道開拓の設計図を作ることになります。開拓を実行するために様々な分野の人材を招聘することになり、そのなかに鉄道建設に尽力した人物がいたことで、北海道の鉄道システムが（　B　）となりました。", "a": "アメリカ式"}, {"exam": 20, "no": 42, "sub": "", "q": "幌内から石炭を輸送する鉄道建設にあたり、石炭積み出し港として小樽港は計画に入っていませんでした。当初ライマンが考えていた港とは次のどれでしょうか。", "a": "2"}, {"exam": 20, "no": 43, "sub": "", "q": "幌内鉄道建設にあたり、小樽がルートに入っていなかった理由の一つとして考えられるのは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 45, "sub": "", "q": "次の（　）内に該当する数字を記入しなさい。明治12(1879)年、開拓使はクロフォードに札樽間に車馬道の建設を命じました。これは以前イギリス人のジョン・ペリーが出した見積額85万円に対して、クロフォードはこの工事を（　）万円という見積額を提出し、はるかに下回ったことによるものでした。", "a": "5"}, {"exam": 20, "no": 46, "sub": "", "q": "幌内鉄道開通後の明治19(1886)年、北海道庁は函館と札幌を結ぶ鉄道を官設によって運営していこうと計画します。この時、測量調査を命じられたのは次の誰でしょうか。", "a": "3"}, {"exam": 20, "no": 47, "sub": "", "q": "2022年は旧官営幌内鉄道の手宮―幌内間の開通からの節目の年で、空知地方や小樽で様々なイベントが開催されました。開通から何年目だったでしょうか。", "a": "140年"}, {"exam": 20, "no": 53, "sub": "", "q": "（　）内に該当する人名を書きなさい。（姓のみ不可）手宮にある機関車庫は防火のため、れんがを用いて建設されています。これらの鉄道施設の指導は開拓使の技術者になった（　）と平井晴二郎でした。", "a": "松本荘一郎"}, {"exam": 20, "no": 54, "sub": "", "q": "問53の平井晴二郎が関わった建物として、明治21(1888)年の北海道庁旧本庁舎や大正3(1914)年には帝国鉄道庁総裁として総括した建物もあります。その建物とは何でしょうか。", "a": "東京駅"}, {"exam": 20, "no": 91, "sub": "", "q": "手宮の小樽市総合博物館構内には鉄道開通を記念した市指定史跡があります。この名称は次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 5, "sub": "", "q": "北海道開拓において、黒田清隆が開拓長官だった時代にたくさんの技術者を招き、北海道開拓を進めました。その中で、開拓使顧問として迎え、優秀な人材を呼び寄せてくれた外国人とは次の中の誰でしょうか。", "a": "1"}, {"exam": 21, "no": 40, "sub": "", "q": "明治4(1871)年、北海道開拓について黒田清隆、森有礼、ケプロンがアメリカで会談した際、鉄道に関する重要な二人の人物の名があがりました。一人はクロフォード。もう一人の名前は何というでしょうか。", "a": "ライマン"}, {"exam": 21, "no": 41, "sub": "", "q": "北海道で初めての本格的な鉄道建設にあたり、当初、幌内から小樽までのルートは全く議論されていませんでした。その理由の一つとして考えられるのは次のどれでしょうか。", "a": "3"}, {"exam": 21, "no": 42, "sub": "", "q": "開拓使はクロフォードに札樽間に車馬道の建設を命じ、わずか5ヶ月で工事を完成させました。この道路は北海道で最初の公共交通機関として駅逓馬車が運行されます。冬季は雪馬車が使用され、1日30〜50台の雪馬車が行き来していました。この雪馬車の札幌までの片道の所要時間は約何時間だったでしょうか。", "a": "3時間"}, {"exam": 21, "no": 43, "sub": "", "q": "札樽間道路建設費の見積をクロフォードは5万円で出しました、それに対してイギリス人のペリーが以前に出した見積金額はいくらだったでしょうか。", "a": "85万円"}, {"exam": 21, "no": 44, "sub": "", "q": "明治12(1879)年12月、開拓使は石炭運搬の鉄道を幌内―小樽間に敷設することを決定します。この時、小樽までの延伸で生まれる副次的な効果が『開拓使報文』に掲載されています。掲載されているその効果とは次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 45, "sub": "", "q": "幌内鉄道を建設するため、クロフォードは鉄道資材を買い付けにアメリカに渡りました。資材を積んだ船は明治13（1880）年9月に手宮桟橋に着岸しました。この船の名前は次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 46, "sub": "", "q": "幌内鉄道開通後、以前から要請があった函館と札幌間の鉄道建設がはじまります。函館と小樽間が開通したのは次のどれでしょうか。", "a": "3"}, {"exam": 21, "no": 47, "sub": "", "q": "旧手宮線では毎年トロッコを活用したイベントが開催されています。そのイベント名は次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 53, "sub": "", "q": "明治期、小樽の市街地の主要な建物は木造から木骨石造へ一気に転換しました。そのきっかけとなったのは次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 55, "sub": "", "q": "手宮の鉄道の建造物にれんがを使う計画は明治16(1883)年に始まります。その目的は火災から施設を守るためでした。入船の陸橋と手宮の倉庫、さらに現在、国指定重要文化財になっている機関車庫をれんがで建設しました。これらの建設を指導したのは開拓使の技術者、松本荘一郎ともう一人は誰でしょうか。", "a": "平井晴二郎"}, {"exam": 21, "no": 73, "sub": "", "q": "第26回小樽雪あかりの路が令和6(2024)年2月に開催されました。次の中でメイン会場ではないのはどれでしょうか。", "a": "4"}, {"exam": 22, "no": 40, "sub": "", "q": "幌内鉄道は石炭を港まで運ぶために建設されました。明治政府が石炭の確保が不可欠と考えていた理由で違うのは次のどれでしょうか。", "a": "1"}, {"exam": 22, "no": 41, "sub": "", "q": "幌内の山奥で発見された重たい石炭をどうやって運び出すか、さまざまなルートと方法が検討されました。開拓使顧問ケプロンと地質調査をしたライマンが最適とした搬送方法は次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 42, "sub": "", "q": "明治13（1880）年、幌内鉄道建設最初の工事は手宮から熊碓まで行われました、その中でも難工事といわれた、川の谷をまたぐ陸橋の工事は、わずか9日間という早さで無事竣工しました。この陸橋名は何というでしょうか。", "a": "入船川陸橋"}, {"exam": 22, "no": 43, "sub": "", "q": "手宮〜札幌間の鉄道建設は11ケ月という短い期間で完成しました。もっとも工期を短くした要因の一つとなったのは次のどれでしょうか。", "a": "3"}, {"exam": 22, "no": 44, "sub": "", "q": "幌内鉄道開通後の明治19（1886）年、北海道庁は函館と札幌を結ぶ鉄道を官設によって運営していこうと計画します。この時、測量調査を命じられたのは次の誰でしょうか。", "a": "3"}, {"exam": 22, "no": 45, "sub": "", "q": "函館から小樽までの鉄道建設は、当初は官設で建設する予定でしたが、戦争による財政悪化の影響により民間で建設することになりました。明治33（1900）年に設立された会社は下記のどれでしょうか。（設立の翌年「北海道鉄道㈱」に改称）", "a": "4"}, {"exam": 22, "no": 46, "sub": "", "q": "明治36（1903）年にできた北海道鉄道により現在の小樽駅が開業しますが、この駅は次々と名称が変わっていきます。その変遷で正しい組み合わせは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 47, "sub": "", "q": "小樽市総合博物館本館では、現在も蒸気機関車が構内で運行されています。明治42（1909）年にアメリカ合衆国ペンシルベニア州ピッツバーグにある機関車製造会社H.K.ポーター社で製造されたこの機関車名を書きなさい。", "a": "アイアンホース号"}, {"exam": 22, "no": 55, "sub": "A", "q": "（　）内に該当する語句を書きなさい。明治18（1885）年に建設された旧手宮機関車庫は、わが国最古の（　A　）の機関車庫として国指定重要文化財に指定されています。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった松本荘一郎と（　B　）です。", "a": "レンガ造"}, {"exam": 22, "no": 55, "sub": "B", "q": "（　）内に該当する語句を書きなさい。明治18（1885）年に建設された旧手宮機関車庫は、わが国最古の（　A　）の機関車庫として国指定重要文化財に指定されています。この建物を設計した中心人物は、アメリカのレンセラー工科大学に留学し開拓使の技術者となった松本荘一郎と（　B　）です。", "a": "平井晴二郎"}, {"exam": 22, "no": 89, "sub": "A", "q": "国指定重要文化財のひとつに旧手宮鉄道施設があります。（　）内に該当するものを選びなさい。手宮駅跡地（小樽市総合博物館構内）に残る一連の鉄道遺産群で、機関車庫、危険品庫、貯水槽、転車台、（　A　）から構成されています。現存する国内最古の機関車庫である「機関車庫3号」はレンガ造りで、レンガの積み方は（　B　）積みとなっています。", "a": "1"}, {"exam": 22, "no": 89, "sub": "B", "q": "国指定重要文化財のひとつに旧手宮鉄道施設があります。（　）内に該当するものを選びなさい。手宮駅跡地（小樽市総合博物館構内）に残る一連の鉄道遺産群で、機関車庫、危険品庫、貯水槽、転車台、（　A　）から構成されています。現存する国内最古の機関車庫である「機関車庫3号」はレンガ造りで、レンガの積み方は（　B　）積みとなっています。", "a": "3"}, {"exam": 23, "no": 40, "sub": "", "q": "北海道の鉄道建設に関わった人物とその主な役割の組み合わせで間違っているのはどれでしょうか。", "a": "2"}, {"exam": 23, "no": 41, "sub": "", "q": "神居古潭の道路開削と短距離の鉄道建設にあたって開拓使が招聘した技師がクロフォードでした。ただ、招聘された段階では幌内炭田から石炭搬出経路開発の主人公となる人物が他にいました。その人物とはだれでしょうか。", "a": "ゲント"}, {"exam": 23, "no": 42, "sub": "", "q": "明治12(1879)年、開拓使は札樽間の道路建設を命じます。クロフォードはこの工事をどのくらいの期間で完成させたでしょうか。", "a": "1"}, {"exam": 23, "no": 43, "sub": "", "q": "小樽、幌内間の鉄道敷設のルート決定をうけ、本格的な鉄道工事は若竹第三トンネルの開削から始まりました。この工事を指揮したのは次の誰でしょうか。", "a": "2"}, {"exam": 23, "no": 44, "sub": "", "q": "北海道鉄道の工事は明治34(1901)年、大沼幅下トンネルと忍路トンネルの開削から始まりました。北海道鉄道が全線開通したのは次のどれでしょうか。", "a": "4"}, {"exam": 23, "no": 45, "sub": "", "q": "幌内鉄道の手宮〜札幌間の開通時には4つの駅しかありませんでした。正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 23, "no": 46, "sub": "", "q": "幌内鉄道に導入された蒸気機関車は6号まで「和名」がつけられていました。次の4つの中で正しいのはどれでしょうか。", "a": "1"}, {"exam": 23, "no": 52, "sub": "A", "q": "（ ）内に該当する語句を記入しなさい。明治10年代の庶民の住宅は簡易な木造で建てられ屋根は板を葺いて（A）が置かれていました。また手宮の鉄道に関わる施設は西洋風の木造で外壁を（B）にして窓の戸は上下させる縦長窓でした。", "a": "石"}, {"exam": 23, "no": 52, "sub": "B", "q": "（ ）内に該当する語句を記入しなさい。明治10年代の庶民の住宅は簡易な木造で建てられ屋根は板を葺いて（A）が置かれていました。また手宮の鉄道に関わる施設は西洋風の木造で外壁を（B）にして窓の戸は上下させる縦長窓でした。", "a": "横板張り又は下見板張り"}, {"exam": 23, "no": 54, "sub": "", "q": "明治16(1883)年から始まった手宮の鉄道施設の建造物に使われた建築材料は火災から施設を守るためでした。この材料は入船の陸橋と手宮の倉庫、さらに現在、国指定重要文化財になっている機関車庫にも使われました。この材料は次のどれでしょうか。", "a": "4"}, {"exam": 23, "no": 55, "sub": "", "q": "手宮の鉄道施設建設を指導した平井晴二郎は手宮での経験を発展させ、現在も残る重要な建築物にも関わりました。次のなかで平井晴二郎が関わった建物は次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 88, "sub": "", "q": "国登録有形文化財のJR小樽駅は、明治36(1903)年に「小樽中央停車場」として開業して以来、たびたび駅名が変更され、大正9(1920)年に「小樽駅」となります。現在の駅舎は開業以来、何代目となる建物でしょうか。", "a": "2"}], "港湾と築港": [{"exam": 1, "no": 7, "sub": "", "q": "明治から昭和初期まで小樽にはどんな都市がつくられてきたでしょうか。", "a": "4"}, {"exam": 1, "no": 35, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は当時の土木技術の粋を集めて建設されました。その延長は何メートルでしょうか。", "a": "3"}, {"exam": 1, "no": 37, "sub": "", "q": "日本で初めての本格的な外洋防波堤建設であった、小樽港の北・南防波堤の技術的特長で誤っているものはどれですか。", "a": "4"}, {"exam": 1, "no": 38, "sub": "", "q": "伊藤長右衛門が開発し、その後各地で使われたケーソンの製作方式は以下のうちどれでしょうか。", "a": "4"}, {"exam": 1, "no": 39, "sub": "", "q": "廣井勇のもとで、北防波堤工事の監督を行い、自ら海中に潜るなどして指揮・監督をとった青木政徳は、琵琶湖疎水や関西鉄道のトンネル工事など明治初期の日本を代表する土木工事にも従事しました。その青木の功績を讃える石碑はどこに建立されていますか。", "a": "4"}, {"exam": 1, "no": 40, "sub": "", "q": "幌内で発見された石炭が良質であることを見抜き、幌内炭鉱の開発を推進した開拓使物産取調掛は誰だったでしょうか。", "a": "2"}, {"exam": 1, "no": 46, "sub": "", "q": "明治の時代に港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は誰でしょう。", "a": "2"}, {"exam": 2, "no": 34, "sub": "", "q": "小樽港の防波堤内側の面積は、札幌ドームのおよそ何個分ですか。", "a": "2"}, {"exam": 2, "no": 35, "sub": "", "q": "北海道を代表する重要港湾の一つとして、国内外の海上輸送網の拠点となっている小樽港ですが、その特徴で間違っているものはどれでしょうか。", "a": "1"}, {"exam": 2, "no": 36, "sub": "", "q": "小樽港が近代的な港湾として整備が始まったのは明治時代の小樽築港第一期工事でした。この時つくられた今も残る大きな構造物とは何ですか。", "a": "北防波堤"}, {"exam": 2, "no": 37, "sub": "", "q": "幕末から取り組まれていた海岸の埋立ては明治時代にも継続され海岸沿いに街並みができるようになりました。明治6(1873)年に完成した小樽港ではじめての石造埠頭はどこにつくられたでしょうか。", "a": "色内"}, {"exam": 2, "no": 38, "sub": "", "q": "廣井勇が小樽港北防波堤の建設で導入した技術のうち正しいものはどれですか。", "a": "3"}, {"exam": 2, "no": 39, "sub": "", "q": "廣井勇のあと、小樽築港所長を務めた小樽港の育ての親とも言われる伊藤長右衛門の説明で間違っているものを一つ選んで下さい。", "a": "4"}, {"exam": 2, "no": 46, "sub": "", "q": "明治の時代に港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は誰でしょうか。", "a": "廣井勇ひろいいさみ"}, {"exam": 3, "no": 34, "sub": "", "q": "小樽港の境界線は防波堤の内側をイメージしますが、実際は2つの岬を結んだ直線の内側をいいます。ひとつは平磯岬ですが、もう一方は高島の何という岬ですか。", "a": "茅柴岬"}, {"exam": 3, "no": 37, "sub": "", "q": "小樽港が近代的な港湾として整備が始まったのは明治時代の小樽築港第一期工事でした。小樽築港第一期工事について説明したもので正しいものを一つ選んでください。", "a": "1"}, {"exam": 3, "no": 38, "sub": "", "q": "廣井勇の後を継ぎ、小樽築港を成功に導きケーソン進水方式を開発したのは誰ですか。", "a": "伊藤長右衛門"}, {"exam": 3, "no": 39, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は、当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれですか。", "a": "4"}, {"exam": 3, "no": 46, "sub": "", "q": "明治の時代に港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は誰ですか。", "a": "廣井勇"}, {"exam": 4, "no": 34, "sub": "", "q": "現在の小樽港はわが国における海上輸送網の拠点として位置づけられている港で、国際海上輸送網又は国内海上輸送網の拠点となる港湾です。道内には函館港や釧路港など10港あります。この港湾のことを何といいますか。", "a": "重要港湾"}, {"exam": 4, "no": 36, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は当時の土木技術の粋を集めて建設されました。その延長は何メートルでしょうか。", "a": "3"}, {"exam": 4, "no": 37, "sub": "", "q": "日本で初めての本格的な外洋防波堤建設であった、小樽港の北・南防波堤の技術的特徴で誤っているものはどれですか。", "a": "4"}, {"exam": 4, "no": 38, "sub": "", "q": "小樽の港づくりには忘れてはならない3人の技術者がいます。生みの親といわれる廣井勇。育ての親といわれる伊藤長右衛門。そして防波堤の基礎となる石積み工事の監督指揮を行い、若くして命を落とした人物とはだれでしょうか。", "a": "青木政徳"}, {"exam": 4, "no": 46, "sub": "", "q": "空欄に該当する語句を記入しなさい。明治の時代に港の整備方法をめぐって大論争があったときに、廣井勇は「（　　）を利用した運河式の方が便利である」と指摘しました。", "a": "艀"}, {"exam": 5, "no": 34, "sub": "", "q": "北海道を代表する重要港湾の一つとして、国内外の海上輸送網の拠点となっている小樽港ですが、港の特長で間違っているものはどれでしょうか", "a": "1"}, {"exam": 5, "no": 35, "sub": "", "q": "次の文中の（　）内に当てはまる語句を記入しなさい。小樽港の港界線は平磯岬ともう一方の（　）岬に引いた直線（港界線）の内側をいいます。", "a": "茅柴 (かやしば）"}, {"exam": 5, "no": 36, "sub": "", "q": "小樽港が近代的な港湾として整備が始まったのは明治30年からの小樽築港第一期工事でした。この時つくられた施設は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 37, "sub": "A", "q": "廣井勇が建設した北防波堤の大きな特長が書かれています。次の文中の（　）内に当てはまる語句を記入しなさい。廣井は（　A　）を用いたコンクリートを防波堤工事に採用。さらに、コンクリートブロックを（　B　）に積み、自重の一部をかけることで安定させ、また一部分に当たる波の力を広く分散させることで波力に対抗する構造を採用した。", "a": "火山灰"}, {"exam": 5, "no": 37, "sub": "B", "q": "廣井勇が建設した北防波堤の大きな特長が書かれています。次の文中の（　）内に当てはまる語句を記入しなさい。廣井は（　A　）を用いたコンクリートを防波堤工事に採用。さらに、コンクリートブロックを（　B　）に積み、自重の一部をかけることで安定させ、また一部分に当たる波の力を広く分散させることで波力に対抗する構造を採用した。", "a": "斜め"}, {"exam": 5, "no": 38, "sub": "", "q": "伊藤長右衛門が開発し、その後各地で使われたケーソンの製作方式は以下のうちどれでしょうか。", "a": "4"}, {"exam": 5, "no": 39, "sub": "", "q": "廣井勇のあと、小樽築港所長を務めた小樽港の育ての親とも言われる伊藤長右衛門の説明で間違っているものを一つ選びなさい。", "a": "4"}, {"exam": 5, "no": 40, "sub": "", "q": "幌内で発見された石炭が良質であることを理解し、幌内炭鉱の開発を推進した開拓使物産取調掛は誰だったでしょうか？", "a": "2"}, {"exam": 5, "no": 46, "sub": "", "q": "明治の時代に港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は誰でしょう。", "a": "廣井勇"}, {"exam": 6, "no": 34, "sub": "", "q": "小樽港の防波堤内側の面積は、札幌ドームのおよそ何個分でしょうか。＊札幌ドームの建築面積は54,000㎡です。", "a": "3"}, {"exam": 6, "no": 35, "sub": "", "q": "小樽港は明治22年に特別輸出港となりますが、その後外国貿易港（開港場）となり、世界各国と貿易ができるようになったのはいつでしょうか。", "a": "2"}, {"exam": 6, "no": 36, "sub": "", "q": "第四代北海道長官が、近代的な港湾を小樽に建設することを訴えた意見書を明治25年に提出しました。この第四代北海道長官とはだれでしょうか。", "a": "北垣國道"}, {"exam": 6, "no": 37, "sub": "", "q": "近代的な港湾としての小樽港の整備が始まったのは明治時代の小樽築港第一期工事でした。この時つくられた施設は次のどれでしょうか。", "a": "3"}, {"exam": 6, "no": 38, "sub": "", "q": "小樽の港づくりに多大な功績を残した廣井勇についての以下の説明で間違っているものはどれですか", "a": "3"}, {"exam": 6, "no": 40, "sub": "", "q": "廣井勇のもとで、北防波堤工事の監督を行い、自ら海中に潜るなどして指揮・監督をとった青木政徳は、琵琶湖疎水や関西鉄道のトンネル工事など明治初期の日本を代表する土木工事にも従事しました。その青木の功績を讃える石碑はどこの公園に建立されていますか。", "a": "手宮公園"}, {"exam": 6, "no": 41, "sub": "", "q": "（　）内に該当する語句を記入しなさい。明治時代末、小樽の港は、北海道を代表する港として位置づけられ、国家プロジェクトとして築港工事が進められました。「小樽の港はただ小樽のものではなく、北海道全体の港である」そんな気概と期待が持たれ、この時期の小樽の人々を小樽で生活する人も小樽以外に住む人も「小樽（　）」と呼ぶようになりました。", "a": "港民"}, {"exam": 7, "no": 34, "sub": "", "q": "小樽港の港界線の説明です。（　）内に該当する語句を記入しなさい。小樽港は高島の（　）から平磯岬に引いた直線（港界線）の内側をいいます。", "a": "茅柴岬"}, {"exam": 7, "no": 35, "sub": "", "q": "（　）内に該当する語句をどれでしょうか。小樽港は明治22年に特別輸出港となります。特別輸出港とは米、麦、麦粉、（　）、硫黄の5品目に限り、日本船または日本人雇用の外国船により輸出ができる港です。", "a": "2"}, {"exam": 7, "no": 36, "sub": "", "q": "小樽港が近代的な港湾として整備が始まったのは明治時代の小樽築港第一期工事でした。小樽築港第一期工事について説明したもので正しいのはどれでしょうか。", "a": "2"}, {"exam": 7, "no": 37, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は、当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれでしょうか。", "a": "4"}, {"exam": 7, "no": 38, "sub": "", "q": "小樽築港第二期工事で南防波堤が建設されました。この時、鉄筋コンクリート造の箱状あるいは円筒状の構造物を水中に沈下させて建設しました。この構造物の名称は何というでしょうか。", "a": "ケーソン"}, {"exam": 7, "no": 39, "sub": "", "q": "小樽の港づくりに多大な功績を残した廣井勇についての説明です。間違っているものはどれでしょうか。", "a": "3"}, {"exam": 7, "no": 40, "sub": "", "q": "若竹、勝納地区に面積48万平方キロメートルの巨大埠頭が計画され、東京以北ではじめて3万トン級の大型船が接岸できる埠頭が完成しました。それはいつでしょうか。", "a": "3"}, {"exam": 7, "no": 48, "sub": "", "q": "明治の時代に港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は誰でしょうか。", "a": "廣井勇"}, {"exam": 8, "no": 35, "sub": "", "q": "幕末から取り組まれていた海岸の埋立ては明治時代にも継続され海岸沿いに街並みができるようになりました。明治6年に完成した小樽港ではじめての石造埠頭はどこにつくられたでしょうか", "a": "2"}, {"exam": 8, "no": 36, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は明治41年に完成しました。その延長は何メートルでしょうか。", "a": "2"}, {"exam": 8, "no": 37, "sub": "", "q": "小樽港の防波堤内側の被覆水面積は約331万平方メートルです。この面積は札幌ドームのおよそ何個分でしょうか。", "a": "1"}, {"exam": 8, "no": 38, "sub": "", "q": "廣井勇が小樽港北防波堤の建設で導入した技術のうち正しいものはどれでしょうか。", "a": "3"}, {"exam": 8, "no": 39, "sub": "", "q": "次の文章に該当する人物名を書きなさい。姓・名両方を書きなさい。（姓のみ不可）「明治35年、東京帝国大学を卒業し、廣井勇の勧めで北海道庁技師となり、廣井勇の後任になりました。明治41年から昭和10年まで築港事務所長となり、小樽築港第二期工事などを監督、指揮しました。」", "a": "伊藤長右衛門"}, {"exam": 8, "no": 40, "sub": "", "q": "次の文章に該当する人物名を書きなさい。姓・名両方を書きなさい。（姓のみ不可）「小樽築港第一期工事では廣井勇の下で築港工事の監督に従事しました。また自ら潜水服を着て海中に潜り、基礎工事を指揮・監督したことでも知られています。その功績を讃える石碑は今も手宮公園内にあります。」", "a": "青木政徳"}, {"exam": 9, "no": 34, "sub": "", "q": "小樽港の防波堤内被覆水面積は、札幌ドームの建築面積の約60個分といわれています。その面積は次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 35, "sub": "", "q": "（　）内に該当する人物名を書きなさい。（姓のみ不可）明治25年、第四代北海道庁長官（　）が、近代的な港湾を小樽に建設することを訴えた意見書を提出しました。", "a": "北垣国道"}, {"exam": 9, "no": 36, "sub": "", "q": "小樽港が近代的な港湾として整備が始まったのは明治時代の小樽築港第一期工事でした。明治41年に完成した施設は次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 38, "sub": "", "q": "廣井勇が小樽港北防波堤の建設で導入した技術のうち正しいものはどれでしょうか。", "a": "3"}, {"exam": 9, "no": 39, "sub": "", "q": "伊藤長右衛門が南防波堤建設にあたり、新たな工法を開発し、その後各地で使われたケーソンの製作方式は次のどれでしょうか。", "a": "4"}, {"exam": 9, "no": 40, "sub": "", "q": "昭和48年着工、昭和57年完成の当時としては東京以北では唯一、3万トン級の船舶が接岸できる埠頭が小樽に完成しました。その埠頭名は何というでしょうか。", "a": "勝納埠頭"}, {"exam": 10, "no": 34, "sub": "", "q": "小樽港の範囲は防波堤の内側をイメージしますが、実際は2つの岬を結んだ直線の内側で、これを港界線といいます。岬のひとつは平磯岬ですが、もう一方は高島の何という岬ですか。", "a": "茅柴岬"}, {"exam": 10, "no": 35, "sub": "", "q": "小樽港の位置づけを説明したものです。これは何というでしょうか。次から選びなさい。「海上輸送網の拠点として位置づけられている港で、国際海上輸送網又は国内海上輸送網の拠点となる港湾その他の国の利害に重大な関係を有する港湾で政令で定めるもの」", "a": "4"}, {"exam": 10, "no": 37, "sub": "", "q": "明治30年4月、小樽築港第一期工事が着工され、小樽港が近代的な港湾として整備が始まりました。この時の工事は次のどれでしょうか。", "a": "1"}, {"exam": 10, "no": 38, "sub": "", "q": "小樽港の工事に大きく貢献した廣井勇についての説明で正しいものはどれですか", "a": "3"}, {"exam": 10, "no": 39, "sub": "", "q": "第2次世界大戦前の小樽における港湾労働者の職種の中で、港に停泊している船舶内で積卸しに従事した職種は次のどれでしょうか。", "a": "2"}, {"exam": 10, "no": 40, "sub": "", "q": "廣井勇が小樽港北防波堤の建設で導入した技術のうち正しいものはどれでしょうか。", "a": "3"}, {"exam": 10, "no": 48, "sub": "", "q": "明治時代後期に小樽の港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は誰でしょう。", "a": "廣井勇"}, {"exam": 10, "no": 64, "sub": "", "q": "（　）内に該当する語句を選びなさい。小樽の桜町本通りを中心とする一帯は、イギリスのハワードの（　）の計画思想にもとづいて昭和9年に設計されたまちなのです。", "a": "2"}, {"exam": 10, "no": 85, "sub": "", "q": "次の小樽市内の町名で「地名・物名」に由来しない町名はどれでしょうか。", "a": "1"}, {"exam": 11, "no": 35, "sub": "", "q": "小樽港の防波堤内側の被覆水面積は約331万平方メートルです。札幌ドームのおよそ何個分でしょうか。", "a": "3"}, {"exam": 11, "no": 36, "sub": "", "q": "幕末から取り組まれていた海岸の埋立ては明治時代にも継続され海岸沿いに街並ができるようになりました。明治6年に完成した小樽港で初めての石造埠頭はどこにつくられたでしょうか。", "a": "4"}, {"exam": 11, "no": 37, "sub": "", "q": "（　）内に該当する語句はどれでしょうか。小樽港は明治22年に特別輸出港となります。特別輸出港とは（　）、麦、麦粉、石炭、硫黄の5品目に限り、日本船または日本人雇用の外国船により輸出ができる港です。", "a": "2"}, {"exam": 11, "no": 38, "sub": "", "q": "北海道を代表する重要港湾の一つとして、国内外の海上輸送網の拠点となっている小樽港ですが、その特徴で違っているものはどれでしょうか。", "a": "1"}, {"exam": 11, "no": 39, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は当時の土木技術の粋を集め明治41年に完成しました。その時の延長は何メートルでしょうか", "a": "3"}, {"exam": 11, "no": 40, "sub": "", "q": "廣井勇が小樽港北防波堤の建設で導入した技術のうち正しいものはどれでしょうか。", "a": "3"}, {"exam": 11, "no": 41, "sub": "", "q": "次の文章に該当する人物名を書きなさい。姓・名両方を書きなさい。（姓のみ不可）「小樽築港第一期工事では廣井勇の下で築港工事の監督に従事しました。また自ら潜水服を着て海中に潜り、基礎工事を指揮・監督したことでも知られていますが、過労から病に倒れ、明治33年に亡くなりました。」", "a": "青木政徳"}, {"exam": 12, "no": 32, "sub": "", "q": "現在、小樽港は国際海上輸送網又は国内海上輸送網の拠点として位置づけられている港となっています。道内には小樽港を含め10港あります。このような港は何と呼ばれているでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 12, "no": 33, "sub": "", "q": "（　）内に該当する語句を書きなさい。小樽港では、明治5(1872)年、色内村に（　）の埠頭が着工され、翌年に完成しました。", "a": "石造"}, {"exam": 12, "no": 34, "sub": "", "q": "次の文中の（　）内に当てはまる語句を記入しなさい。小樽港の範囲は（　）岬ともう一方の高島の茅柴岬に引いた直線（港界線）の内側をいいます。", "a": "平磯"}, {"exam": 12, "no": 35, "sub": "", "q": "明治30(1897)年4月、小樽築港第一期工事が着工され、小樽港が近代的な港湾として整備が始まりました。その後長い歳月をかけて小樽港北防波堤が完成しました。完成した年は次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 36, "sub": "", "q": "小樽港北防波堤の完成当時の延長は何メートルでしょうか", "a": "4"}, {"exam": 12, "no": 37, "sub": "", "q": "小樽港が近代的な港湾として整備が始まったのは明治時代の小樽築港第一期工事でした。小樽築港第一期工事の説明で正しいのはどれでしょうか。", "a": "2"}, {"exam": 12, "no": 38, "sub": "", "q": "小樽築港第一期工事について、3つの語句とも当てはまるのはどれでしょうか。", "a": "2"}, {"exam": 12, "no": 39, "sub": "", "q": "第二次世界大戦前の小樽における港湾労働者の職種で、「仲仕」と呼ばれた仕事は次のどれでしょうか。", "a": "3"}, {"exam": 12, "no": 73, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。急こう配の船見坂から正面の港を見下ろすと対岸には（　A　）、手前にはクルーズ船も停泊する（　B　）が見えます。", "a": "2"}, {"exam": 13, "no": 32, "sub": "", "q": "小樽港の範囲は防波堤の内側をイメージしますが、実際は平磯岬と茅柴岬を結んだ直線の内側を指します。この線のことを何というでしょうか。", "a": "港界線"}, {"exam": 13, "no": 33, "sub": "", "q": "（　）内に該当する語句を書きなさい。小樽港は明治22年、米、麦、麦粉、（　）、硫黄の5品目に限り、日本船または日本人雇用の外国船により輸出ができる港として指定されました。これを特別輸出港といいます。", "a": "石炭"}, {"exam": 13, "no": 34, "sub": "", "q": "（　）内に該当する語句を書きなさい。小樽港は（　）海上輸送網又は国内海上輸送網の拠点として位置づけられている港となっています。道内には小樽港を含め10港あります。このような港は重要港湾と呼ばれています。", "a": "3"}, {"exam": 13, "no": 35, "sub": "", "q": "明治25年、第四代北海道長官が、近代的な港湾を小樽に建設することを訴えた意見書を提出したことにより、小樽港建設の第1歩を踏み出しました。この意見書を提出した北海道長官とは誰でしょうか。この人物名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "北垣国道"}, {"exam": 13, "no": 36, "sub": "", "q": "近代的な港湾としての小樽港の整備が始まったのは明治30年からの小樽築港第一期工事でした。この時つくられた施設は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 37, "sub": "", "q": "日本で初めての本格的な外洋防波堤建設であった、小樽港の北防波堤の特徴で正しいのはどれでしょうか。", "a": "1"}, {"exam": 13, "no": 38, "sub": "", "q": "小樽の港づくりには忘れてはならない3人の技術者がいます。廣井勇、伊藤長右衛門ともう一人は防波堤の基礎となる石積み工事の監督指揮を行い、若くして命を落としました。その功績を讃える石碑は今も手宮公園内にあります。この人物名(姓・名両方)を書きなさい。（姓のみ不可）", "a": "青木政徳"}, {"exam": 14, "no": 32, "sub": "", "q": "小樽港の防波堤内被覆水面積は、札幌ドームの建築面積の約60個分といわれています。その面積は次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 34, "sub": "", "q": "小樽港北防波堤建設の完成までにかかった期間は次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 36, "sub": "", "q": "小樽築港第二期工事について、3つの語句とも当てはまるのはどれでしょうか。", "a": "2"}, {"exam": 14, "no": 38, "sub": "", "q": "第二次世界大戦前の小樽における港湾労働者の職種で、「陸方」と呼ばれた仕事は次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 46, "sub": "", "q": "明治時代、小樽港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 86, "sub": "A", "q": "おたる潮まつりを説明した文章です。（　）内に該当する語句を選びなさい。平成28年「おたる潮まつり」は第50回の節目を迎えました。このまつりは昭和34年から昭和41年まで開催された（　A　）が前身となり昭和42年第3埠頭で開催されました。第2回からは会場を（　B　）に移しましたが、第15回からは再び第3埠頭に戻りました。", "a": "4"}, {"exam": 14, "no": 86, "sub": "B", "q": "おたる潮まつりを説明した文章です。（　）内に該当する語句を選びなさい。平成28年「おたる潮まつり」は第50回の節目を迎えました。このまつりは昭和34年から昭和41年まで開催された（　A　）が前身となり昭和42年第3埠頭で開催されました。第2回からは会場を（　B　）に移しましたが、第15回からは再び第3埠頭に戻りました。", "a": "3"}, {"exam": 15, "no": 33, "sub": "", "q": "近代的な港湾としての小樽港の整備は築港第一期工事の着工から始まります。この年は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 35, "sub": "", "q": "小樽の北防波堤は本格外洋防波堤として建設されました。完成までに要した年数は次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 36, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は、当時の土木技術の粋を集めて建設されました。次の説明で間違っているものはどれでしょうか。", "a": "1"}, {"exam": 15, "no": 37, "sub": "", "q": "南防波堤建設で多大な功績を残した伊藤長右衛門についての説明です。間違っているのはどれでしょうか。", "a": "1"}, {"exam": 15, "no": 38, "sub": "", "q": "かつて石炭積み出し施設のあった遊休地に巨大埠頭建設が計画されました。昭和48年着工、昭和56年完成の当時としては東京以北では唯一、3万トン級の船舶が接岸できる埠頭が小樽に完成しました。その埠頭名は何というでしょうか。", "a": "勝納埠頭"}, {"exam": 16, "no": 32, "sub": "", "q": "小樽港というと、防波堤の内側をイメージしますが、高島の茅柴岬と平磯岬を結んだ直線の内側をいいます。この線のことを何というでしょうか。", "a": "港界線"}, {"exam": 16, "no": 34, "sub": "", "q": "明治25年、第4代北海道庁官は「北海道西部において物資の集散場に適した土地は小樽以外に無い」近代的な港湾建設を訴えた意見書を国に提出しました。これを機に小樽港は近代的な港湾の整備がはじまることになりました。この第4代北海道庁官とは次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 35, "sub": "", "q": "問34を機に小樽港は近代的な港湾として整備が始まりました。小樽築港第一期工事はいつから着工されたのでしょうか。", "a": "3"}, {"exam": 16, "no": 36, "sub": "", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は明治41年に完成しました。その完成当時の延長は何メートルでしょうか。", "a": "2"}, {"exam": 16, "no": 37, "sub": "", "q": "小樽港北防波堤は，当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれですか。", "a": "4"}, {"exam": 16, "no": 38, "sub": "", "q": "伊藤長右衛門はケーソン方式で防波堤を建設しました。その説明で正しいのは次のどれでしょうか", "a": "3"}, {"exam": 16, "no": 46, "sub": "", "q": "明治の時代に港の整備方法をめぐって大論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人は誰でしょう。", "a": "2"}, {"exam": 17, "no": 33, "sub": "", "q": "小樽港の防波堤内側の被覆水面積は札幌ドームの約60個分といわれます。その面積は次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 34, "sub": "", "q": "明治32(1899)年は小樽港開港の年とされ、令和元年、小樽港は開港120年を迎えました。明治32年の何を機に小樽港開港となったのでしょうか。", "a": "3"}, {"exam": 17, "no": 35, "sub": "", "q": "明治30(1897)年4月、小樽築港第一期工事が着工され、小樽港が近代的な港湾として整備が始まりました。この時の工事は次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 37, "sub": "", "q": "小樽港の工事に大きく貢献した廣井勇についての説明で正しいものはどれでしょうか。", "a": "3"}, {"exam": 17, "no": 38, "sub": "", "q": "小樽港北防波堤の建設では、廣井勇は様々な技術の導入や試験を行いました。次の中で間違っているのはどれでしょうか。", "a": "4"}, {"exam": 17, "no": 39, "sub": "", "q": "昭和7(1932)年から9(1934)年にかけて小樽港は海岸の埋め立てで2つの岸壁ができ、2,000〜3,000トン級の船舶が接岸できるようになり樺太航路などで利用されました。このとき完成した岸壁は厩岸壁ともう一つの岸壁名は何というでしょうか。", "a": "堺町岸壁"}, {"exam": 17, "no": 47, "sub": "", "q": "明治時代後期に港の整備方法をめぐって埠頭方式にするか運河方式にするかという論争があったときに「艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えた人物は誰でしょう。（姓のみ不可）", "a": "広井勇"}, {"exam": 17, "no": 90, "sub": "", "q": "小樽市指定史跡の北海道鉄道開通起点がある場所は次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 34, "sub": "A", "q": "次の文中の（　）内に該当する数字を書きなさい。小樽港の防波堤内被覆水面積は、札幌ドームの建築面積の約（　A　）個分といわれ、その面積は約（　B　）万平方メートルです。", "a": "60"}, {"exam": 18, "no": 34, "sub": "B", "q": "次の文中の（　）内に該当する数字を書きなさい。小樽港の防波堤内被覆水面積は、札幌ドームの建築面積の約（　A　）個分といわれ、その面積は約（　B　）万平方メートルです。", "a": "331"}, {"exam": 18, "no": 35, "sub": "", "q": "小樽港は明治22(1889)年に特別輸出港になります。この特別輸出港とはどのような港でしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 18, "no": 36, "sub": "", "q": "明治30（1897）年、近代的な港湾としての小樽港の整備が始まりました。この小樽築港第一期工事で着工したのは次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 38, "sub": "", "q": "小樽港の北防波堤は日本で初めての本格的な外洋防波堤建設でした。工事に関わる内容で間違っているのは次のどれでしょうか。", "a": "3"}, {"exam": 18, "no": 39, "sub": "", "q": "第二次世界大戦前の小樽における港湾労働者の職種で、「仲仕」と呼ばれた仕事は次のどれでしょうか。", "a": "1"}, {"exam": 18, "no": 90, "sub": "", "q": "国指定史跡の手宮洞窟内の岸壁彫刻は、今からおよそ何年前のものといわれているでしょうか。", "a": "3"}, {"exam": 19, "no": 33, "sub": "", "q": "「小樽港」の範囲は防波堤の内側をイメージしがちですが、実際は平磯岬と茅柴岬を結んだ直線の内側を指します。この線のことを何というでしょうか。", "a": "港界線"}, {"exam": 19, "no": 35, "sub": "", "q": "明治25(1892)年、第四代北海道長官が、「北海道西部において物資の集散場に適した土地は小樽以外に無い」と近代的な港湾を小樽に建設することを訴えた意見書を提出したことにより、小樽港建設の第1歩を踏み出しました。この意見書を提出した北海道長官とは誰でしょうか。この人物名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "北垣国道"}, {"exam": 19, "no": 36, "sub": "", "q": "明治41（1908）年、11年の歳月をかけ、北防波堤が完成しました。完成当時の北防波堤の長さは次のどれでしょうか。", "a": "1"}, {"exam": 19, "no": 37, "sub": "", "q": "小樽の港づくりには忘れてはならない3人の技術者がいます。廣井勇、伊藤長右衛門と、もう一人は廣井勇の下で防波堤の基礎となる石積み工事の監督指揮を行いましたが、若くして命を落としました。その功績を讃える石碑は今も港を見下ろす手宮公園内にあります。この人物名（姓・名両方）を書きなさい。（姓のみ不可）", "a": "青木政徳"}, {"exam": 19, "no": 38, "sub": "", "q": "南防波堤建設で多大な功績を残した伊藤長右衛門についての説明です。間違っているのはどれでしょうか。", "a": "3"}, {"exam": 19, "no": 48, "sub": "", "q": "明治42（1909）年、港の整備方法をめぐって埠頭方式にするか運河方式にするかという論争があったときに「小樽港の貨物の種類や荷造りの方法などをみて、艀を利用した運河式の方が便利である」と指摘し、その後の検討に大きな影響を与えました。その指摘した人物とは誰でしょう。（姓のみ不可）", "a": "広井勇"}, {"exam": 20, "no": 34, "sub": "", "q": "次の文章の（　）の中に当てはまる語句を書きなさい。小樽港では明治5(1872)年、色内村に（　）の埠頭が着工され、翌年には完成しました。同年10(1877)年には手宮に木造桟橋が完成します。", "a": "石造"}, {"exam": 20, "no": 35, "sub": "", "q": "明治20(1887)年、お雇い外国人技師により北海道の港湾調査が行われ、全道的な港湾計画がまとめられました。そのお雇い外国人とはだれでしょうか。次の中から選びなさい。", "a": "1"}, {"exam": 20, "no": 36, "sub": "", "q": "小樽港は明治22(1889)年に特別輸出港になります。この特別輸出港とは5品目に限り日本船または日本人雇用の外国船により輸出が出来る港として指定されたものです。その5品目とは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 37, "sub": "", "q": "小樽港北防波堤は、当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれですか。", "a": "4"}, {"exam": 20, "no": 39, "sub": "", "q": "小樽港は最初、運河方式を採用したことで、様々な港湾労働者がいて色々な荷姿に対応するための職人的な熟練した技能を持つ労働者がいました。倉庫への貨物の積み付けや荷造り手直しに従事した人は次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 44, "sub": "", "q": "幌内鉄道建設を支えた中に日本人の若い技師がいました。江別の橋梁の設計施工を担当した人物とは次の誰でしょうか。", "a": "2"}, {"exam": 21, "no": 34, "sub": "", "q": "現在、小樽港は国際海上輸送網又は国内海上輸送網の拠点として位置づけられている港「重要港湾」となっています。道内には小樽港を含め「重要港湾」はいくつあるでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 21, "no": 35, "sub": "", "q": "明治30(1897)年、小樽築港第一期工事が着工しました。建設には高知県出身の技師が大きくかかわりました。「小樽港の生みの親」ともよばれたこの人物の銅像がある場所は次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 36, "sub": "", "q": "問35の技師について間違っているのは次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 37, "sub": "", "q": "小樽港の工事に大きく貢献した伊藤長右衛門についての説明で正しいものはどれですか", "a": "1"}, {"exam": 21, "no": 39, "sub": "", "q": "小樽運河完成後、船舶量が増大し、艀での荷役では対応しきれず、埠頭式岸壁の港づくりがもとめられるようになり、その結果、昭和7(1932)年から9(1934)年にかけて小樽港は海岸の埋め立てで2つの岸壁ができ、2,000〜3,000トン級の船舶が接岸できるようになり樺太航路などで利用されました。このとき完成した岸壁は堺町岸壁ともう一つの岸壁名は何というでしょうか。", "a": "厩町岸壁"}, {"exam": 22, "no": 33, "sub": "", "q": "小樽港の範囲は平磯岬と、もう一方の高島の茅柴岬に引いた直線の内側をいい、港界線といいます。この港界線内水面積は次のどれでしょうか。", "a": "3"}, {"exam": 22, "no": 34, "sub": "", "q": "小樽港は明治22（1889）年に特別輸出港になります。この特別輸出港とは5品目に限り、日本船または日本人雇用の外国船により輸出できる港です。米、麦、麦粉、硫黄の他、もう一品は何でしょうか。", "a": "石炭"}, {"exam": 22, "no": 36, "sub": "", "q": "近代的な港湾としての小樽港の整備は、明治25（1892）年、第4代北海道庁長官が、小樽に近代的な港湾建設をと国に意見書を提出したことで、その後、国家プロジェクトとして取り組まれることになります。この第4代北海道庁長官とは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 37, "sub": "", "q": "小樽港の北防波堤建設について、工事に関わる内容で間違っているのは次のどれでしょうか。", "a": "3"}, {"exam": 22, "no": 38, "sub": "", "q": "小樽港の南防波堤建設を指揮した伊藤長右衛門についての説明です。間違っているのはどれでしょうか。", "a": "2"}, {"exam": 22, "no": 39, "sub": "", "q": "令和6（2024）年4月に小樽港第三号埠頭エリアが「みなとオアシス」として全国で161ヶ所目、道内では13ヶ所目として国土交通省に登録されました。小樽が登録した名称は次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 48, "sub": "", "q": "小樽運河（埋立て工事）の建設は紆余曲折を経て大正期の着工、完成となりました。小樽港整備計画は当初、埠頭方式でしたが広井勇の提言で、運河方式に設計変更となり、設計変更申請されました。それはいつのことだったでしょうか。", "a": "3"}, {"exam": 22, "no": 78, "sub": "", "q": "坂のまち小樽ですが、船見坂の上から坂の延長上に見える小樽港の埠頭名は何というでしょうか。令和6年からクルーズ船がこの埠頭に接岸するようになりました。", "a": "第3号埠頭"}, {"exam": 23, "no": 33, "sub": "", "q": "小樽港は海上輸送網の拠点として位置づけられている港で、国際または国内海上輸送網の拠点となる港湾とされています。国の利害に重大な関係がある港湾で、港湾法に基づいて政令で定められています。このような港湾を何というでしょうか。", "a": "重要港湾"}, {"exam": 23, "no": 36, "sub": "", "q": "小樽港の整備は、明治25(1892)年、第4代北海道庁長官が、小樽に近代的な港湾建設をと国に意見書を提出したことで、試験工事を経て本格的な工事が始まりました。本格的な小樽築港第一期工事が始まったのは次のどれでしょうか。", "a": "3"}, {"exam": 23, "no": 37, "sub": "", "q": "小樽築港第一期工事で北防波堤が完成しました。完成まで要した年数は次のどれでしょうか。", "a": "3"}, {"exam": 23, "no": 38, "sub": "", "q": "小樽港の工事に大きく貢献した廣井勇についての説明で正しいものはどれですか。", "a": "3"}, {"exam": 23, "no": 39, "sub": "", "q": "小樽築港第一期工事の北防波堤の建設は、当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれですか。", "a": "4"}, {"exam": 23, "no": 76, "sub": "", "q": "令和7(2025)年も多くのクルーズ船が小樽港第3号埠頭へ寄港しました。寄港した実績数は次のどれでしょうか。", "a": "4"}], "周辺地域": [{"exam": 1, "no": 15, "sub": "", "q": "平磯岬にある銀鱗荘がかつてあった場所と所有者の組み合わせを以下から選んでください。", "a": "4"}, {"exam": 2, "no": 14, "sub": "", "q": "江戸時代、他に比べるもののない好漁場と呼ばれた小樽を含む中場所の範囲を以下から選んでください。", "a": "4"}, {"exam": 2, "no": 45, "sub": "", "q": "函館〜小樽間の鉄道建設は道庁が当初計画し、平井晴二郎などによる測量が行われました。この段階では岩内〜寿都の海岸線を通るルートでしたが、後年実際の建設時では倶知安周りのルートに変更されます。その主な原因は何でしょうか。", "a": "4"}, {"exam": 3, "no": 65, "sub": "", "q": "明治4年に愛知県から入植した本田圭次郎氏は、地場で産出した粘土で後志焼の窯を開き、北海道陶工の祖と言われており、それにより、小樽では（　　）などの各種工房で陶芸家が活躍しております。＊（　　）内に当てはまる語句を記入しなさい。", "a": "小樽焼、小樽窯"}, {"exam": 3, "no": 92, "sub": "", "q": "後志管内は1市13町6村で構成されています。町名には余市町・古平町・積丹町・岩内町・寿都町・仁木町・共和町・倶知安町・ニセコ町・京極町・喜茂別町・黒松内町とあとひとつは何町ですか。", "a": "蘭越町"}, {"exam": 4, "no": 11, "sub": "", "q": "江戸時代、他に比べるもののない好漁場と呼ばれた小樽を含む中場所の範囲を以下から選びなさい。", "a": "1"}, {"exam": 4, "no": 90, "sub": "", "q": "後志管内は1市13町6村で構成されています。村名には泊村、真狩村、留寿都村、島牧村、赤井川村とあと一つは何村でしょうか。", "a": "神恵内村"}, {"exam": 5, "no": 7, "sub": "", "q": "明治から昭和初期にかけて繁栄を続けた小樽ですが、第二次大戦を挟んで、斜陽化していきました。その原因で間違いはどれでしょうか。", "a": "3"}, {"exam": 5, "no": 14, "sub": "", "q": "平磯岬にある銀鱗荘がかつてあった場所と所有者の組み合わせで正しいのはどれでしょうか。", "a": "4"}, {"exam": 5, "no": 88, "sub": "", "q": "後志沿岸9市町村はいずれも鰊で集落が誕生しました。その中で「村」は島牧村、泊村とあと一つは何村でしょうか。", "a": "神恵内村"}, {"exam": 6, "no": 13, "sub": "A", "q": "江戸時代の漁場を表した文章です。当てはまる語句を選びなさい。江戸時代、熊石から（　A　）までを近場所、そこから神威岬を越し、（　B　）までを中場所と呼んでいました。", "a": "1"}, {"exam": 6, "no": 13, "sub": "B", "q": "江戸時代の漁場を表した文章です。当てはまる語句を選びなさい。江戸時代、熊石から（　A　）までを近場所、そこから神威岬を越し、（　B　）までを中場所と呼んでいました。", "a": "4"}, {"exam": 6, "no": 14, "sub": "", "q": "幕末の小樽には3つの「場所」がありました。その場所の説明で正しいのはどれでしょうか。", "a": "4"}, {"exam": 6, "no": 46, "sub": "", "q": "函館―小樽間の鉄道建設は道庁が当初計画し、平井晴二郎などによる測量が行われました。この段階では岩内―寿都の海岸線を通るルートでしたが、後年実際の建設時では倶知安周りのルートに変更されます。その主な原因は何でしょうか。", "a": "4"}, {"exam": 6, "no": 90, "sub": "", "q": "平成20年度後志支庁管内年間観光入込客数によると第1位が小樽で714万人、2位が喜茂別町300万人となっています。3位の町村はどこでしょうか。", "a": "2"}, {"exam": 7, "no": 90, "sub": "", "q": "後志地域は20市町村で構成されています。次の日本海沿岸部で現在「町」ではなく「村」は次のどれでしょうか。", "a": "3"}, {"exam": 8, "no": 34, "sub": "", "q": "（　）内に該当する語句を書きなさい。小樽港は現在、札幌や後志、空知など道央地域を背後圏とする日本海側の流通拠点港として、また外国貿易港としてその役割を果たしており（　）になっています。", "a": "重要港湾"}, {"exam": 10, "no": 81, "sub": "", "q": "2012年、民間シンクタンクのブランド総合研究所が発表した全国市区町村と都道府県の魅力度ランキングを発表しました。市区町村のベスト10に道内から4市が入り、札幌は全国1位、函館3位、小樽6位でした。同じく6位に入った市は次のどれでしょうか。", "a": "3"}, {"exam": 10, "no": 89, "sub": "", "q": "後志管内は1市13町6村で構成されています。村名には赤井川村、神恵内村、泊村、真狩村、留寿都村とあとひとつは何という村名でしょうか。", "a": "島牧村"}, {"exam": 11, "no": 77, "sub": "", "q": "市内中心部の国道5号線を札幌方向へ進み、産業会館を左に折れると、2つのアーケードを分ける通りに入ります。この通りは色内交差点から山側を望むと重厚な建物が連なり歴史を感じる通りです。この通り名は何といいますか。", "a": "3"}, {"exam": 11, "no": 81, "sub": "", "q": "地方自治体や企業などでつくる地域活性化センターは、東京・日本橋の「ふるさと情報コーナー」で約2600種の中から人気があった市町村パンフレットの2012年度ベスト30を2013年5月に発表しました。（北海道新聞2013.5.13掲載）ベスト10の中に道内から3つ入りました。北海道は5位、札幌市は1位でした。それでは小樽市は何位だったでしょうか。", "a": "1"}, {"exam": 12, "no": 71, "sub": "", "q": "民間シンクタンクのブランド総合研究所は平成26(2014)年の全国市区町村と都道府県の魅力度ランキングを発表した。都道府県は北海道が6年連続の1位。市区町村では函館が1位の他、札幌市、小樽市、富良野市がベスト10に入りました。小樽市は何位だったでしょうか。（H26.10.7 北海道新聞朝刊より）", "a": "3"}, {"exam": 12, "no": 82, "sub": "", "q": "小樽商工会議所では地域経済活性化のため1・2次産業プロジェクトを立ち上げ、農業分野の第1弾として平成25(2013)年12月から余市、仁木産の梅を利用した梅酒が開発されました。この梅酒の名前は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 14, "sub": "", "q": "幕末の小樽での場所の範囲で正しいのはどれでしょうか。", "a": "3"}, {"exam": 13, "no": 45, "sub": "", "q": "幌内鉄道開通後、函館〜小樽間の鉄道建設も各方面から要請され、道庁が計画することになりました。この段階では小沢から岩内〜寿都〜黒松内を通るルートでしたが、後年実際の建設時では倶知安周りのルートに変更されます。その主な原因は次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 77, "sub": "", "q": "民間シンクタンクのブランド総合研究所は「地域ブランド調査2015」で全国市区町村と都道府県の魅力度ランキングを発表しました。都道府県は北海道が7年連続の1位。市区町村では函館が2年連続の1位の他、札幌市、小樽市、富良野市がベスト10に入りました。小樽市は何位だったでしょうか。（H27.10.2 北海道新聞朝刊より）", "a": "4"}, {"exam": 13, "no": 88, "sub": "", "q": "後志管内の市町村で海岸に面していないまちは次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 73, "sub": "", "q": "民間シンクタンクのブランド総合研究所は「地域ブランド調査2016」で全国市区町村と都道府県の魅力度ランキングを発表しました。都道府県は北海道が8年連続の1位。市区町村では函館が3年連続の1位の他、札幌市、小樽市、富良野市がベスト10に入りました。小樽市は何位だったでしょうか。（H28.10.20 北海道新聞朝刊より）", "a": "3"}, {"exam": 14, "no": 88, "sub": "", "q": "後志管内の市町村で観光地名を交差点の標識名称にしました。観光地名の標識は国土交通省が平成28年、全国31ケ所で整備し、道内では11ケ所、その内3ケ所がこの町でした。「蒸留所、宇宙」などの語句が入った標識が設置された町は次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 89, "sub": "", "q": "全国的にゆるキャラによる観光振興が行なわれていますが、後志管内のゆるキャラと市町村名の組合せで間違っているのは次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 74, "sub": "", "q": "リクルート北海道じゃらん（札幌）が道民を対象に2016年度の道内旅行調査のうち、「もう一度出かけたい旅行先」を発表しました。小樽は前年8位から2位と躍進しました。それでは1位となったのは次のどれでしょうか。（平成29年8月29日　北海道新聞掲載）", "a": "3"}, {"exam": 15, "no": 75, "sub": "", "q": "民間シンクタンクのブランド総合研究所は2017年10月に全国市区町村と都道府県の魅力度ランキングを発表した。都道府県別は北海道が9年連続の1位。市区町村のベスト10には函館市、札幌市、小樽市、富良野市の4市が入りました。小樽市は何位だったでしょうか。（平成29年10月12日　北海道新聞掲載）", "a": "3"}, {"exam": 15, "no": 88, "sub": "", "q": "次の文章に当てはまる後志管内の町村名を書きなさい。「羊蹄山麓に位置し、農業が盛んなまちです。特にユリ根は特産品として全国に出荷されています。有名な男性歌手を輩出したまちとしても有名です。」", "a": "真狩村"}, {"exam": 16, "no": 12, "sub": "", "q": "小樽にある祝津の鰊御殿（旧田中家母屋）や平磯岬の銀鱗荘は後志の鰊漁家建築を移築したものです。祝津の鰊御殿は泊村からの移築ですが、銀鱗荘はどこから移築されたものでしょうか。", "a": "2"}, {"exam": 16, "no": 71, "sub": "", "q": "平成30年5月、小樽市は「北前船」日本遺産に追加認定され、今後の新たな観光資源として期待されています。北海道内の自治体のなかで「北前船」日本遺産に認定されているのは次のどれでしょうか。（平成30年12月現在）", "a": "2"}, {"exam": 16, "no": 74, "sub": "", "q": "全国の自治体でつくる地域活性化センターが東京の「ふるさと情報コーナー」で2017年度に人気があった自治体観光パンフレットランキングを発表しました。市区町村で小樽市は5位でした。それでは札幌市は何位だったでしょうか。（平成30年4月26日　北海道新聞掲載）", "a": "2"}, {"exam": 16, "no": 75, "sub": "", "q": "民間シンクタンクのブランド総合研究所は2018年10月に全国市区町村と都道府県の魅力度ランキングを発表した。都道府県別は北海道が10年連続の1位。市区町村のベスト10には函館市、札幌市、小樽市、富良野市の4市が入りました。函館市は1位でしたが、小樽市は何位だったでしょうか。（平成30年10月16日　北海道新聞掲載）", "a": "3"}, {"exam": 16, "no": 88, "sub": "", "q": "次の後志管内の施設で蘭越町にあるのは次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 62, "sub": "", "q": "祝津地区には鰊漁で栄えた頃の漁場建築が今も残っています。旧田中母家はどこから移築された建物でしょうか。", "a": "2"}, {"exam": 17, "no": 74, "sub": "", "q": "民間シンクタンクのブランド総合研究所は令和元(2019)年10月に全国市区町村と都道府県の魅力度ランキングを発表した。都道府県別は北海道が1位。市区町村のベスト10には道内から小樽も含め4自治体が入りました。次のなかでベスト10に入らなかったのはどれでしょうか。（令和元年10月18日　北海道新聞掲載）", "a": "3"}, {"exam": 17, "no": 85, "sub": "", "q": "後志管内の町村では、ゆるキャラによる地域振興を展開しているところがあります。次の中で、積丹町のキャラクターはどれでしょうか。", "a": "2"}, {"exam": 17, "no": 86, "sub": "", "q": "次の文章に当てはまる後志管内の町村名を書きなさい。「周囲をニセコ連峰等に囲まれた盆地で道南最大の川の流域は肥沃で水田耕作の適しており、この地域の米はブランド米として道内外でも好評を得ている。また大自然の囲まれた露店風呂が自慢の温泉施設もある。」", "a": "蘭越町"}, {"exam": 18, "no": 4, "sub": "", "q": "明治期に入り、小樽港は発展していきます。発展した要因と関係ないものは次のどれでしょうか。", "a": "4"}, {"exam": 18, "no": 11, "sub": "", "q": "祝津の高島岬に建つ鰊御殿（田中家住宅）は、ある会社の創立70周年記念事業のひとつとして後志管内のある村から移築されました。その会社名と村の組合せで正しいのは次のどれでしょうか。（地名は現在名です）", "a": "2"}, {"exam": 18, "no": 13, "sub": "", "q": "幕末の小樽での場所の範囲で正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 18, "no": 74, "sub": "", "q": "民間シンクタンクのブランド総合研究所は令和2（2020）年10月に全国市区町村と都道府県の魅力度ランキングを発表した。都道府県別は12年連続で北海道が1位。市区町村のベスト10には道内から小樽市も含め4自治体が入りました。昨年は函館市が1位でした。今年1位となった自治体は次のどれでしょうか。（令和2年10月15日　北海道新聞掲載）", "a": "2"}, {"exam": 19, "no": 10, "sub": "", "q": "江差追分の一節です。（　）内に当てはまるのは次のどれでしょうか。「忍路高島及びもないがせめて（　）磯谷まで」", "a": "3"}, {"exam": 19, "no": 46, "sub": "", "q": "幌内鉄道開通後、小樽経由の函館〜札幌間の鉄道建設も各方面から要請され、道庁が計画することになりました。この段階では小沢からは岩内〜寿都〜黒松内を通るルートでしたが、後年実際の建設時では倶知安周りのルートに変更されます。その主な原因は次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 87, "sub": "", "q": "次の後志管内の施設で共和町にあるのは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 87, "sub": "", "q": "北海道は行政上、14の地区に区分されています。その一つ、後志管内にある自治体の数は次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 7, "sub": "", "q": "明治から昭和初期にかけて発展した小樽ですが、第二次大戦後、まちは斜陽化していきました。その原因として間違いは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 11, "sub": "", "q": "祝津の鰊御殿（旧田中家母屋）は北海道炭礦汽船㈱の創立70周念事業の一つとして他の自治体から移築されたものです。次のどこから移築されたものでしょうか。", "a": "4"}, {"exam": 22, "no": 87, "sub": "", "q": "北海道は14の行政上の区分があります。小樽は後志地域に属していますが、後志には20の自治体があります。その内訳は次のどれでしょうか。", "a": "3"}, {"exam": 23, "no": 87, "sub": "", "q": "後志地域には20の自治体があります。そのうち、海に面していないのは次のどれでしょうか。", "a": "4"}], "自然・地形・気候": [{"exam": 1, "no": 16, "sub": "", "q": "オタルナイ場所とタカシマ場所、タカシマ場所とオショロ場所の境界の組み合わせの正しいものを以下から選んでください。", "a": "1"}, {"exam": 1, "no": 76, "sub": "", "q": "小樽の手宮公園には北海道の美林に指定されている貴重な自然林がありますが、その樹種は何でしょうか。", "a": "3"}, {"exam": 1, "no": 77, "sub": "", "q": "小樽は坂のまちともいわれていますが、次の条件に合う坂の名前は何といいますか。「日之出湯からこの坂を仰ぎ見るとまるで覆いかぶさってくるような急坂で道路わきの表示には勾配20%とあります」", "a": "4"}, {"exam": 1, "no": 78, "sub": "", "q": "昭和43年に制定された小樽市の花は何ですか。", "a": "2"}, {"exam": 1, "no": 79, "sub": "", "q": "小樽市の木はシラカンバですが、制定されたのは何年ですか。", "a": "3"}, {"exam": 1, "no": 80, "sub": "", "q": "小樽市の鳥はアオバトという鳥ですが、どの地区に生息していますか。", "a": "4"}, {"exam": 1, "no": 81, "sub": "", "q": "小樽は水のおいしいまちですが、そのおいしさには3つの要因があります。一つは豊かな自然と水源環境、二つめはミネラル分を適度にバランスよく含んでいること。もう一つは何でしょうか。", "a": "2"}, {"exam": 1, "no": 82, "sub": "", "q": "小樽市が製造し、「ふるさと小包」としても扱われているボトルドウォーターの名前は何でしょう。", "a": "4"}, {"exam": 1, "no": 88, "sub": "", "q": "小樽を代表する温泉は朝里川温泉ですが、近年この一帯はある名称で呼ばれ、イベント開催や名所をピーアールしています。何という名称でしょう。", "a": "3"}, {"exam": 2, "no": 16, "sub": "", "q": "オタルナイ場所とタカシマ場所、タカシマ場所とオショロ場所の境界の組み合わせの正しいものを以下から選んでください。", "a": "1"}, {"exam": 2, "no": 76, "sub": "", "q": "小樽にはユニークな名称の自然現象が発生することがあります。1846年、探検家・松浦武四郎が小樽沖で見たこの蜃気楼の名称は何でしょうか。", "a": "2"}, {"exam": 2, "no": 78, "sub": "", "q": "小樽は坂のまちともいわれていますが、次の条件に合う坂の名前は何といいますか。「港が見えるこの坂は昭和29年まで木材貿易商を営むドイツ出身のカール・コッフ氏が坂の途中に住んでいたことに由来し名づけられました」", "a": "外人坂"}, {"exam": 2, "no": 81, "sub": "", "q": "小樽は水のおいしいまちですが、そのおいしさには3つの要因があります。一つは豊かな自然と水源環境、二つめはミネラル分を適度にバランスよく含んでいること。もう一つは何でしょうか。", "a": "2"}, {"exam": 2, "no": 86, "sub": "", "q": "現在小樽には58の町名がありますが、町名の由来に①豊漁説　②運上金説　③海岸の潮流説、この3つの説があるといわれている町名は次のどれですか。", "a": "2"}, {"exam": 3, "no": 10, "sub": "", "q": "平磯岬にある銀鱗荘はかつて余市町にありました。所有者であった大漁家名は何といいますか。", "a": "猪俣家"}, {"exam": 3, "no": 78, "sub": "", "q": "小樽は坂のまちともいわれていますが、次の条件に合う坂の名前は何といいますか。「妙見川から水天宮を横切り、入船方面に向かう坂です。昔は塗り師、張り師、彫り師、表具師、指物師などの仕事場が軒を並べていました。」", "a": "職人坂"}, {"exam": 3, "no": 80, "sub": "", "q": "小樽市の花と木の組み合わせで正しいのはどれですか。", "a": "2"}, {"exam": 3, "no": 81, "sub": "", "q": "この一帯は小樽を代表する温泉やスキー場があり、地域のイベント活動や冬の「雪あかりの路」の会場にもなっています。近年、この地域は何と呼ばれていますか。", "a": "ゆらぎの里"}, {"exam": 3, "no": 83, "sub": "", "q": "「小樽八区八景」のある地区の説明です。どこの地区ですか。「山に向かって放射状に街が広がる景色は、古代ローマなどの野外劇場をイメージさせます。坂道や丘から市街地を見渡すことができるため‥‥」", "a": "2"}, {"exam": 4, "no": 12, "sub": "", "q": "オタルナイ場所とタカシマ場所の境界は次のどれでしょうか。", "a": "2"}, {"exam": 4, "no": 78, "sub": "", "q": "「小樽市の鳥」に制定されているこの鳥は、張碓海岸の恵比須島周辺に飛来し、海水を飲む珍しい習性があります。この鳥の名前は何といいますか。", "a": "アオバト"}, {"exam": 4, "no": 79, "sub": "A", "q": "小樽の地形の特徴を表した文章です。（　）内に当てはまるのはどれでしょうか。西には突き出した忍路半島、赤岩の山々が続き、その先には灯台のある（　A　）が北に突き出しています。東には（　B　）が張り出しています。", "a": "2"}, {"exam": 4, "no": 79, "sub": "B", "q": "小樽の地形の特徴を表した文章です。（　）内に当てはまるのはどれでしょうか。西には突き出した忍路半島、赤岩の山々が続き、その先には灯台のある（　A　）が北に突き出しています。東には（　B　）が張り出しています。", "a": "1"}, {"exam": 5, "no": 74, "sub": "", "q": "JR小樽駅の北側に「船見坂」があります。市内でも屈指の急な坂です。その勾配は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 75, "sub": "", "q": "「外人坂」と呼ばれる坂があります。次のどの坂をいうのでしょうか。", "a": "4"}, {"exam": 5, "no": 77, "sub": "", "q": "小樽市の花と木の組み合わせで正しいのはどれですか。", "a": "2"}, {"exam": 5, "no": 78, "sub": "", "q": "小樽は水のおいしいまちですが、そのおいしい理由と関係のないのはどれでしょうか。", "a": "3"}, {"exam": 5, "no": 79, "sub": "", "q": "次の（　）内に当てはまる語句を記入しなさい。近年、この一帯は（　）の里と呼ばれ小樽を代表する温泉やスキー場があり、地域のイベント活動や冬の「雪あかりの路」の会場にもなっています。", "a": "ゆらぎ"}, {"exam": 6, "no": 64, "sub": "", "q": "（　）内に該当する語句を選びなさい。平磯岬にある銀鱗荘は昭和9年に内務省が認可した（　）計画の一部として余市から移築されました。", "a": "3"}, {"exam": 6, "no": 76, "sub": "", "q": "小樽市内の坂の写真です。坂の名前で組み合わせが正しいのはどれでしょうか。", "a": "2"}, {"exam": 6, "no": 77, "sub": "", "q": "坂を説明した文章です。この坂の名称は次のどれでしょうか。市民会館と公会堂を左に見ながら、緑町に向かって緩やかに坂を下っていくと、於古発川（おこばちがわ）が流れています。川に架かる橋の名前にちなんでつけられた名称です。川のすぐそばには、映画「はるか、ノスタルジィ」（1992年制作）でロケに使われた特長ある三角屋根の家も並んでいます。", "a": "4"}, {"exam": 6, "no": 79, "sub": "", "q": "小樽市の花と木はツツジとシラカンバですが、制定された年で正しいのはどれでしょうか。", "a": "4"}, {"exam": 6, "no": 80, "sub": "", "q": "奥沢水源地からの水流を21mの落差で10段にわたって流下させる階段式溢流路は独特の景観を醸し出していますが、この流れ落ちる水は通称何と呼ばれていますか。", "a": "3"}, {"exam": 6, "no": 81, "sub": "", "q": "朝里川温泉から朝里ダムへ向う道にループ橋があります。この橋は通称何と呼ばれているでしょうか。", "a": "2"}, {"exam": 7, "no": 12, "sub": "", "q": "小樽市の平磯岬にある「銀鱗荘」猪俣家住宅は昭和13年に移築されました。元々はどこにあった建物でしょうか。町村名を書きなさい。", "a": "余市町"}, {"exam": 7, "no": 81, "sub": "", "q": "堺町通りの山側には急ながけが続いています。「ふうど館」の向かい、「多喜二」横の小路に入ると、がけに沿って上っていく細く急な坂があり、右手には旧板谷邸があります。この坂の名称は何といいますか。", "a": "2"}, {"exam": 7, "no": 82, "sub": "", "q": "小樽八区八景「オタモイ・赤岩地区」のおもな景観のうち、関係のないものは次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 16, "sub": "", "q": "幕末の小樽には3つの「場所」がありました。その場所の説明で正しいのはどれでしょうか。", "a": "3"}, {"exam": 8, "no": 18, "sub": "", "q": "江戸時代の海路として間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 75, "sub": "", "q": "小樽の地形の特長で間違っているのは次のどれでしょうか。", "a": "3"}, {"exam": 8, "no": 76, "s
