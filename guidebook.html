ub": "", "q": "小樽を代表する急な坂として「船見坂」がありますが、その勾配は次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 77, "sub": "", "q": "次の坂の名称で小樽に関係のないのはどれでしょうか。", "a": "3"}, {"exam": 8, "no": 80, "sub": "", "q": "2009年3月に出版された「ミシュラン・グリーンガイドジャポン」（仏語版）で小樽市内から一つ星に選定された場所は次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 12, "sub": "A", "q": "次の文の空欄に当てはまる言葉を書きなさい。小樽市桜の平磯岬にある「銀鱗荘」は昭和13年、（　A　）町の大漁家、（　B　）家の住宅を移築したものです。", "a": "余市"}, {"exam": 9, "no": 12, "sub": "B", "q": "次の文の空欄に当てはまる言葉を書きなさい。小樽市桜の平磯岬にある「銀鱗荘」は昭和13年、（　A　）町の大漁家、（　B　）家の住宅を移築したものです。", "a": "猪俣"}, {"exam": 9, "no": 74, "sub": "", "q": "北方探検家の松浦武四郎が小樽沖を航行中に見た自然現象を「高島おばけ」といいます。この自然現象とは次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 76, "sub": "", "q": "次の文は小樽市内のある坂から見える景色です。この坂の名前を書きなさい。「市内でも有数の急勾配の坂です。この坂の上から下っていくと、すぐ左側にはこの坂の名称になったお寺があり、秋には境内にある銀杏の紅葉が有名です。また、坂を背にし、正面右側の丘は春には花見の名所となります。この坂の1本港側には十間坂がある。」", "a": "浄応寺の坂"}, {"exam": 9, "no": 78, "sub": "", "q": "朝里川温泉から朝里ダムへ向う道にループ橋があります。この橋の名称は次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 79, "sub": "", "q": "小樽は水はおいしいといわれています。そのおいしい理由と関係のないのはどれでしょうか。", "a": "3"}, {"exam": 10, "no": 74, "sub": "", "q": "次の（　）内に当てはまるのはどれでしょうか。「高島おばけ」とは北方探検家の（　）が小樽沖を航行中に見た蜃気楼のことをいいます。", "a": "3"}, {"exam": 10, "no": 76, "sub": "A", "q": "次の2枚の写真は小樽市内のある坂から見える景色です。この坂の名前を書きなさい。Aは港を眼下に見下ろすことができます。Bは正面に手宮公園が見えます。", "a": "外人坂"}, {"exam": 10, "no": 76, "sub": "B", "q": "次の2枚の写真は小樽市内のある坂から見える景色です。この坂の名前を書きなさい。Aは港を眼下に見下ろすことができます。Bは正面に手宮公園が見えます。", "a": "浄応寺の坂"}, {"exam": 10, "no": 78, "sub": "", "q": "小樽市の花と木の組み合わせで正しいのはどれですか。", "a": "2"}, {"exam": 10, "no": 91, "sub": "A", "q": "下記文章の各空欄を、それぞれ同じ符号の項目4つのうちから適切なものを選びなさい。小樽は土地特有の（　A　）やぶっきらぼうな態度は、文化の違う人々には、時として不愉快に映ることもよくあるようですが、そこに（　B　）と気さくな声がけがあれば、旅は印象深く魅力的に彩られることでしょう。心のこもった（　B　）と、ちょっとした声がけは、最小にして最大の（　C　）です。", "a": "3"}, {"exam": 11, "no": 12, "sub": "A", "q": "次の文の空欄に当てはまる言葉を書きなさい。石狩湾を見下ろす平磯岬にある「銀鱗荘」は余市町の大漁家（　A　）家住宅を昭和13年に移築したものです。この移築は（　B　）の創業20年の記念事業として行われたものです。", "a": "猪俣"}, {"exam": 11, "no": 12, "sub": "B", "q": "次の文の空欄に当てはまる言葉を書きなさい。石狩湾を見下ろす平磯岬にある「銀鱗荘」は余市町の大漁家（　A　）家住宅を昭和13年に移築したものです。この移築は（　B　）の創業20年の記念事業として行われたものです。", "a": "(株)北海ホテル"}, {"exam": 11, "no": 74, "sub": "", "q": "小樽の地形の特徴です。（　）内に当てはまるのはどれでしょうか。市内中心部から見て、西側には突き出した忍路半島、そこから北側へオタモイ、赤岩の山々が続き、その先には灯台のある（　）が北に突き出しています。", "a": "3"}, {"exam": 11, "no": 76, "sub": "", "q": "次の写真は小樽市内のある坂から見える景色です。この坂の名前を書きなさい。この坂には、かつてはたくさんの仕事場が軒を連ねていました。今も仏壇店や家具工場などが昔の面影を残しています。", "a": "職人坂"}, {"exam": 11, "no": 78, "sub": "", "q": "次の文章に該当する地域は、近年何と呼ばれているでしょうか。「近年、この一帯は小樽を代表する温泉やスキー場があり、地域のイベント活動や冬の「雪あかりの路」の会場にもなっています。」", "a": "3"}, {"exam": 11, "no": 80, "sub": "", "q": "小樽の水がおいしいおもな要因として間違っているのは、次のどれでしょうか。", "a": "4"}, {"exam": 11, "no": 89, "sub": "", "q": "次の文章に当てはまる後志管内の町村名を書きなさい。「後志の海岸に位置する町で、風が強いことでも有名。町のマスコットキャラクター『風太』は特産品、町の街灯、マンホールのデザインなどに活用されています。」", "a": "寿都町"}, {"exam": 11, "no": 93, "sub": "A", "q": "（　）内に一番適切とおもわれる語句を選びなさい。小樽をはじめ後志海岸部の町では独特の言葉や話し方がありますが、そこに住む方は日常のことなので気になりません。ところが、他の町から訪れる観光客には文化の違いや、言葉遣いに時として不愉快に映ることもよくあるようです。そこで私たちガイドはお客様の立場になって（　A　）と気さくな（　B　）を心がけることが大切になってきます。心のこもった（　A　）と、ちょっとした（　B　）は、お客様に対して、最大の（　C　）となります。", "a": "1"}, {"exam": 11, "no": 93, "sub": "B", "q": "（　）内に一番適切とおもわれる語句を選びなさい。小樽をはじめ後志海岸部の町では独特の言葉や話し方がありますが、そこに住む方は日常のことなので気になりません。ところが、他の町から訪れる観光客には文化の違いや、言葉遣いに時として不愉快に映ることもよくあるようです。そこで私たちガイドはお客様の立場になって（　A　）と気さくな（　B　）を心がけることが大切になってきます。心のこもった（　A　）と、ちょっとした（　B　）は、お客様に対して、最大の（　C　）となります。", "a": "4"}, {"exam": 12, "no": 73, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。急こう配の船見坂から正面の港を見下ろすと対岸には（　A　）、手前にはクルーズ船も停泊する（　B　）が見えます。", "a": "4"}, {"exam": 12, "no": 76, "sub": "", "q": "小樽市の花・木・鳥の組み合わせで正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 85, "sub": "", "q": "次の文章に当てはまる後志管内の町村名を書きなさい。「西積丹の海岸に位置し、かつては秘境といわれた風光明媚な村です。観光施設としては日本郷土玩具館、温泉９９８、珊内ぬくもり温泉があります。おもな特産品は魚介類、水産加工品です。」", "a": "神恵内村"}, {"exam": 13, "no": 70, "sub": "", "q": "小樽には通称「高島おばけ」と呼ばれる現象があります。これは次のどれでしょうか。", "a": "2"}, {"exam": 13, "no": 74, "sub": "", "q": "小樽の水がおいしいおもな要因は3つあります。ひとつは豊かな自然と水源環境に恵まれている。2つ目はミネラル分を適度にバランス良く含んでいる。3つ目は次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 71, "sub": "", "q": "近年、小樽ではクルージングボートによる観光が盛んになってきました。おもなコースは海から祝津、オタモイなどの海岸の表情を楽しむ観光です。このコースで特に人気のあるスポットの通称名は次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 4, "sub": "", "q": "明治期の小樽は北海道開拓の玄関口となり、物流港として発展していきました。理由として開拓拠点の札幌に近かったこともありましたが、小樽の港は「天然の良港」だったことも大きな要因です。「天然の良港」と呼ばれた理由として関係ないのは次のどれでしょうか。", "a": "3"}, {"exam": 16, "no": 79, "sub": "", "q": "小樽は水のおいしいまちですが、そのおいしい理由と関係のないのは次のどれでしょうか。", "a": "4"}, {"exam": 17, "no": 78, "sub": "", "q": "小樽市の鳥は「アオバト」ですが、小樽ではおもにどこで見られるでしょうか。次の中から選びなさい。", "a": "1"}, {"exam": 17, "no": 79, "sub": "", "q": "近年、外国人観光客も訪れるようになった「船見坂」ですが、この坂ができた理由として正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 18, "no": 75, "sub": "", "q": "写真は小樽市内の坂です。石垣が続く住宅街で坂を登ると上の方は123段の石段になっています。登りつめた丘からは小樽港を見ることができます。この坂の名前は何というでしょうか。", "a": "外人坂"}, {"exam": 18, "no": 78, "sub": "", "q": "小樽市の花・木・鳥の組み合わせで正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 75, "sub": "", "q": "次の4つのなかで、石狩湾の広い範囲で発生する珍しい蜃気楼について、関連する語句の組合せが正しいのはどれでしょうか。", "a": "2"}, {"exam": 19, "no": 78, "sub": "", "q": "小樽の水がおいしいと云われていますが、おもな要因として間違っているのは、次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 3, "sub": "", "q": "明治期の小樽は北海道開拓の玄関口として、物流の拠点として港が発展していきました。その要因として小樽の港は「天然の良港」と呼ばれたことも大きな要因です。「天然の良港」と呼ばれた理由として関係がないのは次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 9, "sub": "", "q": "幕末の小樽でのタカシマ場所の範囲で正しいのは次のどれでしょうか。（地名は現在）", "a": "2"}, {"exam": 20, "no": 18, "sub": "", "q": "江戸時代、日本の沿岸航路で西海路と呼ばれたのは次のどれでしょうか。", "a": "3"}, {"exam": 20, "no": 73, "sub": "", "q": "かつて小樽にはたくさんの銭湯がありましたが、年々廃業し少なくなってきています。次の中で現在も営業している銭湯はどれでしょうか。", "a": "2"}, {"exam": 20, "no": 77, "sub": "", "q": "文中の（　）内に該当する語句を書きなさい。5月中旬頃から6月中旬頃にかけて石狩湾で珍しい蜃気楼が発生することがあり、小樽の海岸からも見えることがあります。かつては「高島おばけ」とも言われていたこの蜃気楼は（　）蜃気楼といい、実際の風景の上側に伸びや反転した虚像が見えます。", "a": "上位"}, {"exam": 20, "no": 79, "sub": "", "q": "小樽市の花として制定されているツツジは、ある節目の年の記念事業で公募され決まりました。その節目の年とは次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 33, "sub": "A", "q": "次の文中の（　）内に当てはまる語句を記入しなさい。小樽港の範囲は平磯岬と、もう一方の高島の（　A　）岬に引いた直線の内側をいいます。この2点を結んだ直線を（　B　）といいます。", "a": "茅柴"}, {"exam": 21, "no": 33, "sub": "B", "q": "次の文中の（　）内に当てはまる語句を記入しなさい。小樽港の範囲は平磯岬と、もう一方の高島の（　A　）岬に引いた直線の内側をいいます。この2点を結んだ直線を（　B　）といいます。", "a": "港界線"}, {"exam": 21, "no": 79, "sub": "", "q": "小樽市の花・木・鳥の制定について書かれています。正しいのは次のどれでしょうか。", "a": "1"}, {"exam": 21, "no": 80, "sub": "", "q": "坂のまち小樽ですが、次の坂のなかで勾配が一番急なのはどれでしょうか。", "a": "4"}, {"exam": 22, "no": 18, "sub": "", "q": "江戸時代の海路として正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 77, "sub": "", "q": "5月中旬頃から6月中旬位にかけて小樽を含む石狩湾で観測される蜃気楼は、かつては北方探検家の松浦武四郎が「高島おばけ」と呼んでいました。この蜃気楼は下記のどれでしょうか。", "a": "1"}, {"exam": 22, "no": 79, "sub": "", "q": "小樽市内の坂の途中にある寺は、大正13（1924）年12月、手宮駅構内で火薬の爆発事故が起きた際、その犠牲者を急きょ境内に安置しました。今もこの事故の犠牲者の慰霊碑が境内にあります。このお寺は次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 83, "sub": "", "q": "かつて昭和30年代の小樽には80軒以上の銭湯がありましたが、今では5軒となりました。次の銭湯のなかですでに廃業した銭湯はどれでしょうか。", "a": "3"}, {"exam": 22, "no": 88, "sub": "", "q": "令和6（2024）年3月、「海岸ノ漁場屏風」という作品が、小樽市指定有形文化財に新たに指定されました。屏風のモデルとなった漁場は、小樽に居住した漁業家が経営していました。その漁業家は次のどれでしょうか。", "a": "4"}, {"exam": 23, "no": 19, "sub": "", "q": "江戸時代の国内の海路として正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 77, "sub": "", "q": "令和7(2025)年も小樽を含む石狩湾で上位蜃気楼の「高島おばけ」が発生しました。かつて北方探検家の松浦武四郎が小樽沖を航行中に見た蜃気楼のことで、松浦武四郎がまとめた日誌に記述されていました。その日誌名は次のどれでしょうか。", "a": "1"}, {"exam": 23, "no": 78, "sub": "", "q": "（ ）内に該当する数字を書きなさい。坂の多い小樽ですが、坂には勾配率を表す「%」の標識があります。例えば浄応寺の坂には20%の標識があります。これは水平距離（ ）メートルに対して垂直距離が20メートル上がることを表しています。", "a": "100"}, {"exam": 23, "no": 79, "sub": "", "q": "（ ）内に該当する語句を選びなさい。船見坂上方から小樽港方面を見ると良く晴れた日は対岸に（ ）が見えます。", "a": "2"}, {"exam": 23, "no": 80, "sub": "", "q": "次の文章は、小樽八区八景の八区の中のある地区の解説です。該当する地区を選びなさい。山あいを抜ける農道沿いには、畑や果樹園が連なり、自然豊かな田園風景が広がっています。国道5号沿いの坂道には工場などがあり、両側の斜面には住宅が建ち並んでいます。", "a": "4"}], "商人と経済": [{"exam": 1, "no": 18, "sub": "", "q": "明治期に活躍した「小樽商人」の主な業務は何でしたか。", "a": "2"}, {"exam": 1, "no": 19, "sub": "", "q": "明治27年に西出孫左衛門と西谷庄八によって竣工した小樽倉庫は、その翌28年には誰に売却されていますか。", "a": "1"}, {"exam": 1, "no": 23, "sub": "", "q": "一連の小樽商人は一族や同郷で組織してきた傾向がありますが、明治12年に第四十四国立銀行の小樽支店長として赴任し、同18年には日本郵船会社の石巻支店長となり、以後、小樽で金子元三郎、板谷宮吉、寺田省帰、遠藤又兵衛、藤山要吉らをコーディネートし、同郷にかたよらず様々な事業を展開した人は誰ですか。", "a": "4"}, {"exam": 1, "no": 25, "sub": "", "q": "田中酒造亀甲蔵は明治39年に建てられましたが、建てた商人は小樽に能舞台を寄贈しています。それは誰ですか。", "a": "1"}, {"exam": 1, "no": 57, "sub": "", "q": "日本銀行旧小樽支店（色内1丁目、明治45年）は、玄関ホール（客溜）と営業室の境に柱をたてない構造になっています。その理由として最もふさわしいものは、どれでしょうか。", "a": "3"}, {"exam": 1, "no": 74, "sub": "", "q": "小林多喜二が小樽高商卒業後勤めたところは。", "a": "4"}, {"exam": 1, "no": 84, "sub": "", "q": "現在小樽には58の町名がありますが、中には人名に由来する町名があります。自費で道路を作り、後に小樽区長や衆議院議員にもなった人物の名前の町名とは何ですか。", "a": "3"}, {"exam": 1, "no": 90, "sub": "", "q": "小樽には「市場（いちば）」がまだたくさん残っていますが、行商（ぎょうしょう）の人たち（ガンガン部隊）が集まって商店化していった市場といえばどこでしょうか。", "a": "4"}, {"exam": 2, "no": 6, "sub": "", "q": "小樽の黄金時代に築かれた歴史的環境の中でも特に銀行建築は偉容を呈しています。旧日本銀行は金融資料館、旧三菱銀行は小樽運河ターミナルとして再利用されていますが、現在小樽バインとして利用されている建物の旧銀行名は何ですか。", "a": "2"}, {"exam": 2, "no": 15, "sub": "", "q": "小樽で漁網を扱っていた板谷商店や新谷商店の出身県を以下から選んでください。", "a": "2"}, {"exam": 2, "no": 25, "sub": "", "q": "右近倉庫に掲げられている有名な印ですが、その読みはなんといいますか。", "a": "いちぜんばし"}, {"exam": 2, "no": 26, "sub": "", "q": "小樽に進出してきた商人群を出身地ごとの特徴で表した俗諺の空白はどれですか。「地均近江　種蒔松前　（　　）　刈取越後」", "a": "4"}, {"exam": 2, "no": 27, "sub": "", "q": "次のうち近江商人でないのはどれですか。", "a": "4"}, {"exam": 2, "no": 28, "sub": "", "q": "明治24(1891)年に主筆に中江兆民を招き小樽で最初の新聞「北門新報」を発行し、明治33(1900)年には30歳で初代の小樽区長になった商人は誰ですか。", "a": "金子元三郎かねこもとさぶろう"}, {"exam": 2, "no": 29, "sub": "", "q": "信香間の廻船問屋藤山重蔵（山田吉兵衛の親類）の養子となって、明治12(1879)年家督を継ぎ、小樽〜北陸、小樽〜稚内、小樽〜越後の航路を開き、同37(1904)年の日露戦に御用船を提供して財を築き船成金の異名を馳せ、公会堂を寄贈した商人は誰ですか。", "a": "藤山要吉ふじやまようきち"}, {"exam": 2, "no": 30, "sub": "", "q": "今日も発展しているスハラ食品(株)の小樽での一歩は、明治14(1881)年に寿原弥平次が有幌町で瀬戸物店を開業したところからはじまりますが、寿原一族の中で、昭和23(1948)年に北洋銀行（現在花園十字街角の無尽ビル）の社長になったのは次のどれですか。", "a": "4"}, {"exam": 2, "no": 32, "sub": "", "q": "大正3(1914)年に勃発した第一次大戦時に小豆を買い占めてロンドンの相場を揺るがしたという商人が小樽に多くの倉庫を建設して豆を選別する女工さんをたくさん雇用していました。この豆成金と呼ばれた商人は誰ですか。", "a": "2"}, {"exam": 2, "no": 33, "sub": "", "q": "小林多喜二の「不在地主」という作品のモデルといわれた商人の磯野進が建てたれんが蔵が現在の色内2丁目に残っていますが、今は何という店名で使われているでしょうか。", "a": "海猫屋"}, {"exam": 2, "no": 49, "sub": "", "q": "昭和45(1970)年に日本建築学会の明治建築調査小委員会が公表した保存したい明治建築のリストに、町並みとして取り上げられたのは、小樽運河周辺の歴史的町並みと、グラバー邸を核とする長崎の南山手地区の他、あと1カ所はどこでしょうか。", "a": "4"}, {"exam": 2, "no": 50, "sub": "", "q": "昭和53(1978)年7月に、小樽の若者を中心に運河とその周辺の石造倉庫を舞台にした市民手づくりの祭りが行われ、小樽運河に市民の大きな関心を集めるきっかけとなりました。このお祭りの名前は何といいますか。", "a": "ポートフェスティバル"}, {"exam": 2, "no": 56, "sub": "", "q": "日本銀行旧小樽支店（色内1丁目、明治45年）は、玄関ホール（客溜）と営業室の境に柱をたてない構造になっています。その理由として最もふさわしいものは、どれでしょうか。", "a": "3"}, {"exam": 2, "no": 59, "sub": "", "q": "大正10年代、旧三菱銀行・旧北海道拓殖銀行・旧第一銀行の各支店は、色内大通と緑山手通の交差点に建てられました。これらの建物の構造は、当時、わが国の主要な建築に採用され始めたものでした。さて、その建築構造は、何と呼ばれているでしょうか。", "a": "鉄筋コンクリート造"}, {"exam": 3, "no": 4, "sub": "", "q": "明治から大正時代にかけて、小樽には財力のある商人が数々登場し、公共事業や寄付で小樽に貢献します。その中で板谷宮吉とゆかりのある小樽市内の中学校の現在の名称は何といいますか。", "a": "長橋中学校"}, {"exam": 3, "no": 16, "sub": "", "q": "小樽で漁網を扱っていた板谷商店や新谷商店の出身県はどこですか。", "a": "新潟県・越後"}, {"exam": 3, "no": 21, "sub": "", "q": "小樽には「小樽商人」とか「樽僑」と称される巨万の富を築いた商人が数多くいます。その彼らの出身地によりこんな俗諺があります。空欄に語句を入れなさい。「＊地均近江　種蒔（　　）　肥料加賀　刈取越後」", "a": "松前"}, {"exam": 3, "no": 22, "sub": "", "q": "現在の運河プラザや博物館運河館などが入っている小樽倉庫を建てたのは加賀商人、西出孫左衛門ともうひとりは誰ですか。", "a": "西谷庄八"}, {"exam": 3, "no": 28, "sub": "", "q": "通称「加越能商人」と呼ばれる小樽商人がいました。出身地を指す呼び方ですが、現在の何県ですか。", "a": "3"}, {"exam": 3, "no": 29, "sub": "", "q": "加越能資本による銀行が小樽にもありました。メルヘン交差点の一角にある「銀の鐘」は元、何という銀行名ですか。", "a": "3"}, {"exam": 3, "no": 31, "sub": "", "q": "大正3年に勃発した第一次大戦時に小豆を買い占めてロンドンの相場を揺るがしたという商人が小樽に多くの倉庫を建設して豆を選別する女工さんをたくさん雇用していました。その倉庫は今でも運河沿いにあり、「海鳴楼」として使われています。この豆成金と呼ばれた商人は誰ですか。", "a": "高橋直治"}, {"exam": 3, "no": 32, "sub": "", "q": "小樽商人達はたくさん働いてたくさん遊びもしましたが、旦那衆文化なる粋な文化も残しています。なかでも日本伝統芸能の「能」に精通して、自ら能舞台を自宅に設けて楽しみ、それを市に寄附した商人は誰ですか。", "a": "岡崎謙"}, {"exam": 3, "no": 33, "sub": "", "q": "大正9年調査の小樽区土地台帳において所有面積のトップに立った商人は次のどれですか。", "a": "4"}, {"exam": 3, "no": 57, "sub": "", "q": "日本銀行旧小樽支店（色内1丁目、明治45年）は、当時の金額で37万円を要し建築されました。日本銀行は、本店、西部（門司）支店、大阪支店、名古屋支店、京都出張所、福島支店とありましたが、小樽支店の建築費は全国で何番目ですか。", "a": "2"}, {"exam": 3, "no": 58, "sub": "", "q": "日本銀行旧小樽支店（色内1丁目、明治45年）は、玄関ホール（客溜）と営業室の境に柱をたてない構造になっています。その理由として最もふさわしいものは、どれですか。", "a": "3"}, {"exam": 3, "no": 61, "sub": "", "q": "旧第一銀行小樽支店（色内、大正13年）は、色内大通と緑山手通の交差点に建てられました。この建物は、ヨーロッパで流行していた曲線を生かす様式が取り入れられました。これは何と呼ばれる様式ですか。", "a": "2"}, {"exam": 3, "no": 62, "sub": "", "q": "旧三井銀行小樽支店（色内、昭和2年）は外壁に花崗岩を積み、アーチを連続させ、軒を装飾するルネサンスのデザインで統一され、地震に強い構造が採用になっています。この構造を何といいますか。", "a": "鉄骨鉄筋コンクリート"}, {"exam": 3, "no": 75, "sub": "", "q": "水天宮境内に建てられた詩碑「山上の旗」の詩人、河邨文一郎氏の職業は何ですか。", "a": "1"}, {"exam": 3, "no": 87, "sub": "", "q": "「戦後、樺太や満州からの引揚者がこの川べりに露天を開いたのがはじまりです。その後、川の上に丸太を渡して建物が建てられたりしました。昭和37年に小樽市営市場として再建されました。」小樽市内の、ある市場を説明しています。どこの市場ですか。市場名を書きなさい。", "a": "妙見市場"}, {"exam": 4, "no": 6, "sub": "", "q": "明治から大正時代にかけて、小樽には財力のある商人が数々登場し、公共事業や寄付で小樽に貢献します。その中で公会堂を寄贈した人物を次の中から選びなさい。", "a": "3"}, {"exam": 4, "no": 7, "sub": "", "q": "小樽の観光名所となっている運河沿いにはいくつかの石造倉庫が偉容を保っていますが、運河ができた大正12年に建てられたのは次のうちどれでしょうか。", "a": "3"}, {"exam": 4, "no": 22, "sub": "", "q": "小樽には「小樽商人」とか「樽僑」と称される巨万の富を築いた商人が数多くいます。その彼らの出身地によりこんな俗諺があります。空欄に語句を入れなさい。「＊地均近江　種蒔松前　（　　）加賀　刈取越後」", "a": "肥料"}, {"exam": 4, "no": 23, "sub": "", "q": "現在の運河プラザや博物館運河館などが入っている小樽倉庫を建てたのは西出孫左衛門と西谷庄八ですが、この二人の出身地はどこでしょうか。", "a": "4"}, {"exam": 4, "no": 25, "sub": "", "q": "明治27年に小樽倉庫は建てられますが、当時は倉庫の前は運河ではなく海岸でした。寄港する船にとって屋根の上に掲げられた鯱は充分な目印になったと思われますが、鯱にはどんな意味があるのでしょうか。", "a": "1"}, {"exam": 4, "no": 27, "sub": "", "q": "「北の誉酒造」にゆかりのある商人は次のだれでしょうか。", "a": "2"}, {"exam": 4, "no": 28, "sub": "", "q": "堺町通りにある歴史的建造物「カリオン」は、かつて新聞「北門新報」の印刷所でした。ここを経営していた商人はだれでしょうか。", "a": "金子元三郎"}, {"exam": 4, "no": 29, "sub": "", "q": "明治28年に小樽商業会議所発起人会がスタートした時の初代会頭、第2代小樽区長を務めた商人はだれでしょうか。", "a": "山田吉兵衛"}, {"exam": 4, "no": 30, "sub": "", "q": "日露戦争に船を供出し、戦勝によって莫大な補償金を手にし「船成金」の異名を持った大商人が二人いました。板谷宮吉ともう一人は誰でしょうか。", "a": "4"}, {"exam": 4, "no": 32, "sub": "", "q": "現在の「海猫屋」は、かつてある商人の倉庫でした。この商人が経営していた農場での小作争議が小林多喜二の作品のモデルとなりました。この作品名は何といいますか。", "a": "不在地主"}, {"exam": 4, "no": 33, "sub": "", "q": "明治12年に第四十四国立銀行の小樽支店に赴任し、同18年には日本郵船会社の石巻支店長となり、以後、小樽で金子元三郎、板谷宮吉、寺田省帰、遠藤又兵衛、藤山要吉らとの親交を通じて様々な事業を展開した人は誰でしょうか。", "a": "4"}, {"exam": 4, "no": 56, "sub": "", "q": "次の文章は、ある建物の特長を書いています。建物名は何でしょうか。「本屋は外壁を石で造り、2階の貴賓室と会議室を華やかなデザインのシャンデリアや壁紙（金唐皮紙）で装飾しています。」", "a": "4"}, {"exam": 4, "no": 58, "sub": "", "q": "大正10年代より、わが国の主要な建築に鉄筋コンクリート造が採用され始めました。次の大正末から昭和初期の建物で、主な構造に鉄筋コンクリート造を用いなかったのはどれでしょうか。", "a": "2"}, {"exam": 4, "no": 61, "sub": "", "q": "旧三井銀行小樽支店（色内、昭和2年）は外壁に花崗岩を積み、アーチを連続させ軒を装飾するデザインで統一されています。この建築様式を何といいますか。", "a": "ルネサンス"}, {"exam": 4, "no": 74, "sub": "", "q": "ある作家の碑文の一部です。この文学碑がある場所はどこでしょうか。「冬が近くなるとぼくはそのなつかしい国のことを考えて深い感動に捉えられている　そこには運河と倉庫と税関と桟橋がある　そこでは人は重っ苦しい空の下を　どれも背をまげて歩いている・・・・・」", "a": "4"}, {"exam": 4, "no": 86, "sub": "", "q": "小樽市内の「市場」の説明をしています。どこの市場でしょうか。「大正6年に開設された小樽で最初の市場です。中には大正時代から営業している老舗の鮮魚店もあります。」", "a": "4"}, {"exam": 5, "no": 6, "sub": "", "q": "明治中期以降、商業と金融の一大拠点となった小樽に築かれた銀行建築は、今も小樽らしい景観をかもし出していますが、現在メルヘン交差点で「銀の鐘」として営業している建物は、当時何という銀行だったでしょうか。", "a": "中越銀行"}, {"exam": 5, "no": 22, "sub": "", "q": "小樽には「小樽商人」とか「樽僑」と称される巨万の富を築いた商人が数多くいます。その彼らの出身地によりこんな俗諺があります。カッコ内の間違いはどれでしょうか。", "a": "4"}, {"exam": 5, "no": 29, "sub": "", "q": "明治15年1月、相生町から水天宮山の西裾を通って堺町のオコバチ川までの路線造成を行いました。後にこの事業に感謝して人物名を町名としました。この商人の名前は何というでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "山田吉兵衛"}, {"exam": 5, "no": 30, "sub": "", "q": "2代目のこの商人は、現在の長橋中学校を寄付したり、昭和8年には無給の小樽の名誉市長にもなりました。この商人名は何といいますか。姓・名両方を書きなさい。（姓のみ不可）", "a": "板谷宮吉"}, {"exam": 5, "no": 31, "sub": "", "q": "出身地から通称「加越能」商人と呼ばれた商人がいました。「加越能」ではない地域は次のどれでしょうか", "a": "2"}, {"exam": 5, "no": 33, "sub": "", "q": "越後商人で能を愛し、能舞台を自宅に建てました。田中酒造亀甲蔵はこの商人の倉庫でした。この商人名は何といいますか。姓・名両方を書きなさい。（姓のみ不可）", "a": "岡崎謙"}, {"exam": 5, "no": 49, "sub": "", "q": "昭和53（1978）年7月に、小樽の若者を中心に運河とその周辺の石造倉庫を舞台にした市民手づくりの祭りが行われ、小樽運河に市民の大きな関心を集めるきっかけとなりました。このお祭りの名前は何というでしょうか。", "a": "ポートフェスティバル・イン・オタル"}, {"exam": 5, "no": 60, "sub": "", "q": "旧安田銀行小樽支店（現：花ごころ）の特長は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 71, "sub": "", "q": "ある作家の碑文です。この文学碑がある場所はどこでしょうか。「子を負いて　雪の吹き入る停車場に　われ見送りし妻の眉かな」", "a": "4"}, {"exam": 5, "no": 83, "sub": "", "q": "小樽市内の「市場」の説明をしています。どこの市場でしょうか。昭和30年頃、手宮の朝市や漁場から仕入れた行商のガンガン部隊が集まって、次第に商店化していきました。", "a": "4"}, {"exam": 5, "no": 86, "sub": "", "q": "次の文化財で、道指定有形文化財はどれでしょうか。", "a": "1"}, {"exam": 6, "no": 6, "sub": "", "q": "往時をしのばせる色内の銀行街は建築的に価値の高い建物ばかりです。現在は再生利用されていますが、その中で「小樽運河ターミナル」として利用されている建物の旧銀行名は何でしょうか。", "a": "旧三菱銀行"}, {"exam": 6, "no": 27, "sub": "", "q": "小樽商人とよばれた人々は現在の一般的な産業分類では次のどれにあたるでようか。", "a": "4"}, {"exam": 6, "no": 28, "sub": "", "q": "ある商人を説明しています。その商人とはだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）明治30年には30歳で初代の小樽区長になり、同37年の国会議員選挙で当選しています。現在もこの商人にゆかりのある建物が残っており、平成21年春までは、堺町通りで小樽オルゴール堂「カリオン」という店名で営業していました。", "a": "金子元三郎"}, {"exam": 6, "no": 29, "sub": "", "q": "小樽と北陸、稚内、越後などの航路を開き、明治37年の日露戦争に御用船を提供して財を築き、船成金といわれました。のちに小樽区公会堂を建て寄贈した商人はだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "藤山要吉"}, {"exam": 6, "no": 30, "sub": "", "q": "通称「加越能」呼ばれた商人が小樽の歴史を創った大立役者といわれています。「加越能」ではない地域は次のどれでしょうか", "a": "2"}, {"exam": 6, "no": 31, "sub": "", "q": "ある商人を説明しています。その商人とはだれでしょうか。明治18年に生まれたこの商人は、後に小樽市中学校を土地と共に25万円の寄付をしました。また母校の早稲田大学にも10万円の寄付をしています。", "a": "2"}, {"exam": 6, "no": 32, "sub": "", "q": "小豆将軍や豆成金といった異名をつけられた高橋直治の倉庫は、今も運河沿いで再生利用されています。現在の店名は何というでしょうか。", "a": "海鳴楼"}, {"exam": 6, "no": 33, "sub": "", "q": "商人たちの寄付によってつくられたもので、組み合わせが違うものはどれでしょうか。", "a": "3"}, {"exam": 6, "no": 57, "sub": "", "q": "明治45年に完成した日本銀行小樽支店の建築費は、全国の日本銀行の中で上から3番目でした。一番目は本店ですが、2番目はどこでしょうか。", "a": "3"}, {"exam": 6, "no": 61, "sub": "", "q": "大正期、商店の外壁にコンクリートやモルタルを塗るなど、明治期の石材にかわりセメントが新たな建築材料と使われるようになりました。この工法で建てられた大正期の建物は次のどれでしょうか。", "a": "1"}, {"exam": 6, "no": 63, "sub": "", "q": "三井銀行の説明です。（　）内に該当する語句を記入しなさい。三井銀行は外壁に花崗岩を積み、アーチを連続させ、軒を装飾する（　）のデザインで統一しています。", "a": "ルネサンス"}, {"exam": 6, "no": 65, "sub": "", "q": "小樽の土産物の代表の一つになっているオルゴールは、なぜ小樽に根付いたのでしょうか。", "a": "2"}, {"exam": 6, "no": 78, "sub": "", "q": "小樽の通りを表した文章です。（　）内に当てはまる人名を記入しなさい。この通りは、地区にゆかりのある（　）をキャラクター化し、商店街の顔として活性化に役立てています。小樽の方言を書いた大きな垂れ幕でも話題となった商店街の通りです。", "a": "榎本武揚"}, {"exam": 6, "no": 85, "sub": "", "q": "小樽の歴代市長で唯一無給の名誉職市長がいました。小樽商人でもおなじみのこの第3代市長はだれでしょうか。", "a": "3"}, {"exam": 6, "no": 87, "sub": "", "q": "次の文章は市内の酒造会社の建物の説明です。この酒造会社は次のどれでしょうか。もともと小樽商人、岡崎謙の倉庫で現在は酒蔵として使用しています。この酒蔵の名称は岡崎家の印からきています。「宝川」が2009年の札幌国税局新酒鑑評会「金賞」を受賞しています。", "a": "2"}, {"exam": 7, "no": 6, "sub": "", "q": "明治から大正にかけて、戦場になった国で不足する穀物を買い占めて「豆成金」「小豆将軍」といわれた商人の名前は何というでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "高橋直治"}, {"exam": 7, "no": 14, "sub": "", "q": "幕末のオタルナイ場所を請負っていた商人は次のどれでしょうか。", "a": "4"}, {"exam": 7, "no": 23, "sub": "", "q": "小樽には「小樽商人」とか「樽僑」と称される巨万の富を築いた商人が数多くいます。その彼らの出身地によりこんな俗諺があります。空欄に語句を入れなさい。＊地均近江　種蒔（　）　肥料加賀　刈取越後", "a": "松前"}, {"exam": 7, "no": 28, "sub": "", "q": "昭和6（1931）年新年号講談倶楽部「小樽市金満家名簿」において3位で、日本の醤油御三家と呼ばれた近江彦根出身の人物は誰でしょうか。", "a": "3"}, {"exam": 7, "no": 29, "sub": "", "q": "中江兆民を招き小樽で最初の新聞「北門新報」を発行した商人は誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "金子元三郎"}, {"exam": 7, "no": 30, "sub": "", "q": "山田兵蔵の養子で小樽商業会議所の初代会頭や、第2代小樽区長だった商人は誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "山田吉兵衛"}, {"exam": 7, "no": 31, "sub": "", "q": "加越能資本の銀行の建物は今も残っております。現在、北海道紙商事㈱として再生利用されているのは、次のどれでしょうか。", "a": "2"}, {"exam": 7, "no": 32, "sub": "", "q": "メルヘン交差点のオルゴール堂の建物は共成の社屋でした。この共成を興した商人は精米業で成功し雨竜郡を開墾した際、この商人の偉業を偲んで町名がつけられたといわれています。この商人とは誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "沼田喜三郎"}, {"exam": 7, "no": 33, "sub": "", "q": "小樽高等商業学校の土地（現在の小樽商科大学の土地）を寄付した商人は誰でしょうか。", "a": "3"}, {"exam": 7, "no": 49, "sub": "", "q": "昭和53年7月、小樽の若者を中心に運河とその周辺の石造倉庫を舞台にした市民手づくりの祭りが行われ、小樽運河に市民の大きな関心を集めるきっかけとなりました。そのイベントの名称は何というでしょうか。", "a": "ポートフェスティバル・イン・オタル"}, {"exam": 7, "no": 59, "sub": "", "q": "緑山手通りの交差点は大正10年代、銀行街として栄えた所です。現在、交差点には3つの建物が残っています。旧北海道拓殖銀行小樽支店、旧三菱銀行小樽支店ともう一つの銀行名は何というでしょうか。現在は㈱トップジェント・ファッション・コアとして営業している建物です。", "a": "旧第一銀行小樽支店"}, {"exam": 7, "no": 64, "sub": "", "q": "昭和の銀行建築の説明です。該当する創建時の旧銀行名を記入しなさい。外観は中央の大きな柱を連続させて柱の間に縦長の窓を配し、両脇に壁を設けています。平成13年には曳家で移築しました。", "a": "旧安田銀行"}, {"exam": 7, "no": 67, "sub": "", "q": "小樽市内の硝子店を説明した文章です。該当する硝子店はどれでしょうか。全国的にも有名な硝子店です。ここは明治24年に建てられた小樽商人の倉庫を店舗にしており。通路には当時のレールが敷かれています。", "a": "2"}, {"exam": 7, "no": 74, "sub": "", "q": "「冬が近くなると／ぼくはそのなつかし／い国のことを考えて／深い感動に捉えら／れているそこには／運河と倉庫と・・・・」この碑文が刻まれた文学碑は旭展望台にあります。誰の文学碑でしょうか。", "a": "小林多喜二"}, {"exam": 7, "no": 86, "sub": "", "q": "次の文章は小樽市内の「市場」の説明です。何という市場でしょうか。「戦後、樺太や満州からの引揚者が於古発川の川べりに露店を開いたのがはじまりです。」", "a": "妙見市場"}, {"exam": 8, "no": 4, "sub": "", "q": "明治20年代、大きな石造倉庫がたくさん建てられます。その中で、今でも臨港線沿いに残っている「ヤマシチ」の印が掲げられた倉庫の名称は何というでしょうか。", "a": "大家倉庫"}, {"exam": 8, "no": 14, "sub": "", "q": "幕末の小樽には場所を請負った商人の中で岡田家も場所を経営していましたが、岡田家はどこの商人だったでしょうか。", "a": "4"}, {"exam": 8, "no": 23, "sub": "", "q": "小樽には「小樽商人」とか「樽僑」と称される巨万の富を築いた商人が数多くいます。その彼らの出身地によりこんな俗諺があります。空欄に該当する語句を書きなさい。「地均近江　種蒔松前　肥料（　）　刈取越後」", "a": "加賀"}, {"exam": 8, "no": 27, "sub": "", "q": "明治期に活躍した「小樽商人」の主な業務は次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 28, "sub": "", "q": "次の文章に該当する商人はどれでしょうか。「彦根生まれで、丸ヨの印を掲げ、野田のキッコーマン、上州のキッコーショウユと並ぶ日本の醤油御三家に一つに数えられました。」", "a": "3"}, {"exam": 8, "no": 29, "sub": "", "q": "明治28年、小樽商業会議所発起人会がスタートし、初代会頭に就任した人物とはだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "山田吉兵衛"}, {"exam": 8, "no": 30, "sub": "", "q": "昭和6年、新年号『講談倶楽部』「小樽金満家名簿」において、1位から3位の順で正しいのは次のどれでしょうか。（左から1位〜3位）", "a": "2"}, {"exam": 8, "no": 32, "sub": "", "q": "次の商人の内、加越能商人ではないのはどれでしょうか。", "a": "3"}, {"exam": 8, "no": 33, "sub": "", "q": "北一硝子三号館は以前、小樽商人の倉庫として使われていました。当時の倉庫名を書きなさい。", "a": "木村倉庫"}, {"exam": 8, "no": 49, "sub": "", "q": "昭和45(1970)年に日本建築学会の明治建築調査小委員会が公表した、保存したい明治建築のリストに、町並みとして取り上げられたのは、小樽運河周辺の歴史的町並みと、神戸の山本通の異人館街の他、あと1カ所はどこでしょう。", "a": "4"}, {"exam": 8, "no": 56, "sub": "", "q": "小樽に現存する明治の建築で倉庫がありますが、その多くは建物の内部を木で組み、外側に石を積んだ構造です。この構造を何というでしょうか。", "a": "木骨石造"}, {"exam": 8, "no": 57, "sub": "", "q": "日本銀行は明治期に本店、西部支店、大阪支店、名古屋支店、京都出張所、小樽支店、福島支店の順に建築されました。小樽支店の建築費は37万円でしたが、建築費の高かった順で小樽支店は何番目だったでしょうか。", "a": "3番目"}, {"exam": 8, "no": 61, "sub": "", "q": "色内大通と緑山手通りの交差点には、今も3つの旧銀行建築が現存しています。旧第一銀行小樽支店、旧北海道拓殖銀行小樽支店、もう一つの旧銀行名は次のどれでしょうか。", "a": "2"}, {"exam": 8, "no": 62, "sub": "", "q": "運河の北側に位置する北海製罐の建物は、大正期から昭和にかけて倉庫や工場、事務所が建設されました。その建物と特長の組み合わせで正しいのはどれでしょうか。", "a": "1"}, {"exam": 8, "no": 72, "sub": "", "q": "問71の歌碑がある場所はどこでしょうか。", "a": "1"}, {"exam": 8, "no": 87, "sub": "", "q": "次の市場名は何というでしょうか。早朝3時から営業している市場で、食堂には旅行者もよく訪れます。以前の店舗は台風で被害を受け、平成16年に現在の鉄筋造平屋の建物になりました。", "a": "鱗友朝市"}, {"exam": 8, "no": 88, "sub": "", "q": "次の文章は小樽市内の酒造会社の建物に関連した説明をしています。この酒造会社名を答えなさい。「現在、店舗として再生されたこの倉庫の以前の持ち主は、小樽商人の一人で、かつては区会議員、市会議員を務め、能を愛し自宅に能舞台を造り、その後、能舞台は小樽市に寄贈され公会堂の一角に移築された」", "a": "田中酒造"}, {"exam": 9, "no": 14, "sub": "", "q": "問13の正解の商人はどこの商人だったでしょうか。", "a": "2"}, {"exam": 9, "no": 27, "sub": "", "q": "小樽には「小樽商人」とか「樽僑」と称される巨万の富を築いた商人が数多くいます。その彼らの出身地により俗諺があります。カッコ内の間違いはどれでしょうか。", "a": "3"}, {"exam": 9, "no": 28, "sub": "", "q": "次の文章に該当する商人はだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）「越後生まれ松前育ち。中江兆民を招き小樽で最初の新聞「北門新報」を発行し、明治33年には初代の小樽区長になった。」", "a": "金子元三郎"}, {"exam": 9, "no": 30, "sub": "", "q": "昭和6年、新年号『講談倶楽部』「小樽市金満家名簿」において、3位に石橋彦三郎、2位に藤山要吉でした。1位は次の誰でしょうか。", "a": "4"}, {"exam": 9, "no": 31, "sub": "", "q": "加越能商人は小樽の歴史に大きな影響を与えてきました。その出身地として正しくないのは次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 32, "sub": "", "q": "加越能資本による銀行が小樽にもありました。メルヘン交差点の一角にある「銀の鐘」は、北陸銀行の支店だった以前は、何という銀行名だったでしょうか。", "a": "中越銀行"}, {"exam": 9, "no": 33, "sub": "", "q": "大正3年、第一次大戦時に小豆を買い占めて戦地の英国に売って巨万の富を築いた商人がいました。そして小樽に多くの倉庫を建設し、豆を選別する女工さんをたくさん雇用していました。その倉庫の一つは今でも運河沿いの協和浜ビル隣りに残っています。この商人とは誰でしょうか。（姓のみ不可）", "a": "高橋直治"}, {"exam": 9, "no": 60, "sub": "", "q": "色内大通と緑山手通りの交差点には、今も3つの旧銀行建築が現存しています。その3つの銀行とは次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 82, "sub": "", "q": "平成23年11月、第19回小樽市都市景観賞が発表されました。次の4つのなかで選出されていないのはどれでしょうか。", "a": "3"}, {"exam": 10, "no": 6, "sub": "", "q": "明治から大正時代にかけて、小樽には財力のある商人が数々登場し、公共事業や寄付で小樽に貢献します。その中で現在の小樽商科大学の土地を寄贈した人物は次のどれでしょう。", "a": "2"}, {"exam": 10, "no": 7, "sub": "", "q": "小樽の観光名所となっている運河沿いにはいくつかの木骨石造倉庫が残っていますが、現在「おもしろ撮影館」（テキストでは海鳴楼）として使われている倉庫と関係のある商人は次のどれでしょうか。", "a": "3"}, {"exam": 10, "no": 27, "sub": "", "q": "明治期に活躍した「小樽商人」の主な業務は何でしたか。", "a": "2"}, {"exam": 10, "no": 28, "sub": "", "q": "小樽には江戸時代中期から早くも商いをしていた商人たちがいました。俗諺で地均（　）・・・といわれた商人は次のどれでしょうか。", "a": "4"}, {"exam": 10, "no": 29, "sub": "", "q": "彦根生まれで明治8年に北海道へわたり、やがて醤油醸造に専念。印は「マルヨ」で日本の醤油御三家となった商人は誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "石橋彦三郎"}, {"exam": 10, "no": 30, "sub": "", "q": "堺町通りにあるこの建物（写真参照）は明治20（1887）年に、ある商人が木骨石造で建てた商店で卯建が特徴です。明治24年にはここで小樽初の新聞が発行されています。何という新聞でしょうか。", "a": "3"}, {"exam": 10, "no": 31, "sub": "", "q": "小樽には「加越能商人」と呼ばれた商人がいました。その出身地で正しいのは、次のどれでしょうか。", "a": "4"}, {"exam": 10, "no": 32, "sub": "", "q": "次の文章に該当する商人名はどれでしょうか。「寿原商店、寿原農場の社長、小樽商工会議所の第13代会頭でした。また昭和26年から14年間、札幌証券取引所の理事長としても活躍しました。」", "a": "3"}, {"exam": 10, "no": 59, "sub": "", "q": "色内大通と緑山手通りの交差点には、今も3つの旧銀行建築が現存しています。旧銀行名と現在名との組み合わせで正しいのはどれでしょうか。", "a": "3"}, {"exam": 10, "no": 60, "sub": "", "q": "大正期、商店の外壁にコンクリートやモルタルを塗るなど、明治期の石材にかわりセメントが新たな建築材料と使われるようになりました。この工法で建てられた大正期の建物は次のどれでしょうか。", "a": "2"}, {"exam": 10, "no": 63, "sub": "", "q": "昭和の銀行建築の説明です。該当する旧銀行名は次のどれでしょうか。「外観は中央の大きな柱を連続させて柱の間に縦長の窓を配し、両脇に壁を設けています。平成13年、道路拡幅のため、曳家で移築しました。」", "a": "3"}, {"exam": 10, "no": 66, "sub": "", "q": "小樽市内の硝子店を説明した文章です。該当する硝子店はどれでしょうか。「かつて稲穂町にあった店は小樽のレトロブームの火付け役となり全国的にも有名になりました。その後店舗が増え、その中には明治24年に建てられた小樽商人の倉庫を店舗としており、通路には当時のレールが敷かれています。」", "a": "3"}, {"exam": 10, "no": 73, "sub": "", "q": "ある作家の碑文です。この文学碑がある場所はどこでしょうか。「こころよく　我にはたらく仕事あれ　それを仕遂げて　死なむと思ふ」", "a": "2"}, {"exam": 10, "no": 83, "sub": "", "q": "2012年、市指定歴史的建造物に新たに3件が指定されました。旧猪俣邸、旧北海製缶倉庫㈱ともう一つは何という建物でしょうか。現在は「小樽運河食堂」として営業しています。創建時の名称で書きなさい。", "a": "旧浪華倉庫"}, {"exam": 10, "no": 86, "sub": "", "q": "小樽市内の「市場」の説明をしています。どこの市場でしょうか。大正6年に開設された小樽で最初の市場です。漁港も近かったこともあり新鮮な魚介類が人気です。大正時代から営業している老舗の鮮魚店もあります。", "a": "2"}, {"exam": 11, "no": 2, "sub": "", "q": "小樽は「村並」になる前、地域は3つに分かれ、ふたりの商人が経営していました。その経営していた範囲を総称して何というでしょうか。", "a": "場所"}, {"exam": 11, "no": 6, "sub": "", "q": "明治中期以降、商業と金融の一大拠点となった小樽に築かれた銀行建築は、今も再生利用されています。現在小樽郵便局の向かいでトップジェントファッションコアという会社として営業している建物は、当時何という銀行だったでしょうか。", "a": "旧第一銀行小樽支店"}, {"exam": 11, "no": 29, "sub": "", "q": "中江兆民を招き小樽で最初の新聞「北門新報」を発行した商人で、現在緑町の直行寺はこの人物のために建立した菩提寺といわれています。この商人は誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "金子元三郎"}, {"exam": 11, "no": 30, "sub": "", "q": "昭和6（1931）年新年号講談倶楽部「小樽市金満家名簿」において2位で、小樽区公会堂を寄贈し、また日本の船成金の異名を馳せた人物とは誰でしょうか。", "a": "4"}, {"exam": 11, "no": 31, "sub": "", "q": "次の建物の中で加越能資本の銀行だったのは次のどれでしょうか。建物名は現在名です。", "a": "2"}, {"exam": 11, "no": 32, "sub": "", "q": "大正3年に勃発した第一次大戦時に小豆を買い占めてロンドンの相場を揺るがし「小豆将軍」といった異名がつけられました。小樽に多くの倉庫を建設しましたが、その倉庫の一つは今でも運河沿いにあり、「おもしろ撮影館」として使われています。この商人は誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "高橋直治"}, {"exam": 11, "no": 33, "sub": "", "q": "小樽商人達は、旦那衆文化なる粋な文化も残しています。なかでも日本伝統芸能の「能」に精通して、自ら能舞台を自宅に設けて楽しみ、それを後に小樽市に寄附しました。また田中酒造亀甲蔵は、この商人の倉庫として建てられたものです。この商人とは次のどれでしょうか。", "a": "3"}, {"exam": 11, "no": 34, "sub": "", "q": "次の商人の内、海運業で財を成したのは誰でしょうか。", "a": "3"}, {"exam": 11, "no": 51, "sub": "", "q": "昭和53年7月、小樽の若者を中心に運河とその周辺の石造倉庫を舞台にした市民手づくりの祭りが行われ、小樽運河に約10万人の市民が集まりました。そのイベントの名称は何というでしょうか。", "a": "ポートフェスティバル・イン・オタル"}, {"exam": 11, "no": 57, "sub": "", "q": "次の建物のなかで、木骨石造ではないものはどれでしょうか。（名称は建築時）", "a": "2"}, {"exam": 11, "no": 59, "sub": "", "q": "日本銀行旧小樽支店（色内1丁目、明治45年）は、当時の金額で37万円を要し建築されました。日本銀行は、本店、西部（門司）支店、大阪支店、名古屋支店、京都出張所、福島支店とありましたが、小樽支店の建築費は全国で何番目だったでしょうか。", "a": "3"}, {"exam": 12, "no": 6, "sub": "", "q": "明治から大正時代にかけて、小樽には財力のある商人が数々登場します。その中で、所有していた船を戦争に供出し莫大な補償金を手に入れたといわれる人物は次のどれでしょう。", "a": "1"}, {"exam": 12, "no": 26, "sub": "", "q": "明治8(1875)年に北海道へわたり色内町の兄の店で呉服問屋をはじめ、その後醤油醸造会社を興した近江商人は誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "石橋彦三郎"}, {"exam": 12, "no": 27, "sub": "", "q": "松前商人で、明治15(1882)年に所有地の相生町から水天宮の西裾を通って堺町のオコバチ川までを造成したことで、姓が町名となった人物は、次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 29, "sub": "", "q": "「加越能商人」という言い方があります。これらの地域（広義）には当てはまらないのは次のどれでしょうか。", "a": "3"}, {"exam": 12, "no": 30, "sub": "", "q": "小樽の商人たちは公的な寄付をし、小樽のまちの発展に貢献しました。次の中で商人名と寄付したものの組み合わせが違うものはどれでしょうか。", "a": "3"}, {"exam": 12, "no": 31, "sub": "", "q": "次の建物の中で、小樽で活躍した商人と関係のない建物はどれでしょうか。（建物名は現在名）", "a": "3"}, {"exam": 12, "no": 50, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。鉄道の建造物に（　A　）を使う計画は明治16年に始まります。その目的は火災から守るためでした。更にこの材質で入船の陸橋と手宮の倉庫、さらに現在、国指定重要文化財になっている（　B　）を建設しました。", "a": "れんが"}, {"exam": 12, "no": 50, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。鉄道の建造物に（　A　）を使う計画は明治16年に始まります。その目的は火災から守るためでした。更にこの材質で入船の陸橋と手宮の倉庫、さらに現在、国指定重要文化財になっている（　B　）を建設しました。", "a": "機関車庫"}, {"exam": 12, "no": 53, "sub": "", "q": "日本銀行小樽支店は明治45(1912)年に完成します。当時の全国の日本銀行の建築費で高かった順は次のどれでしょうか。（左から高い順）", "a": "1"}, {"exam": 12, "no": 55, "sub": "", "q": "次の小樽市内にある木骨石造の建物の創建時名と現在名との組み合わせで正しいのはどれでしょうか。", "a": "2"}, {"exam": 12, "no": 56, "sub": "", "q": "小樽の大正期の銀行建築の一つに第一銀行がありますが、そのデザインの特長は次のどれでしょうか。", "a": "1"}, {"exam": 12, "no": 57, "sub": "", "q": "大正期、商店の外壁にコンクリートやモルタルを塗るなど、明治期の石材にかわりセメントが新たな建築材料と使われるようになりました。この工法で建てられた大正期の建物は次のどれでしょうか。", "a": "1"}, {"exam": 12, "no": 58, "sub": "", "q": "北海製罐の建物の特徴で間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 12, "no": 67, "sub": "", "q": "ある作家の碑文です。この文学碑がある場所はどこでしょうか。「冬が近くなると／ぼくはそのなつかし／い国のことを考えて／深い感動に捉えら／れているそこには／運河と倉庫と税関と／桟橋がある・・・・・・」", "a": "3"}, {"exam": 12, "no": 79, "sub": "", "q": "平成26(2014)年、市指定歴史的建造物に新たに2棟が指定されました。一つは色内の旧前堀商店、もう一つは稲穂の何という建物でしょうか。現在は「ディセンバー3」として輸入雑貨の店として営業しています。創建時の名称で書きなさい。", "a": "旧丸ヨ白方支店"}, {"exam": 12, "no": 84, "sub": "A", "q": "市指定有形文化財、日本銀行旧小樽支店を説明した文章です。（　）内に該当する語句を選びなさい。「現在の建物は（　A　）に完成しました。石造り風の外観は（　B　）の壁にモルタルを塗ったもので、銅葺きの屋根とともに銀行建築にふさわしい建物です。」", "a": "3"}, {"exam": 13, "no": 6, "sub": "", "q": "小樽では明治の後半から、企業や団体が様々な組合を結成し社会的立場を強めていきます。その中で、明治30年に現在の小樽商工会議所の前身が開所式を行いました。この時の名称は次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 25, "sub": "", "q": "小樽商人が営んでいた商業とはおもに次のどれでしょうか。", "a": "4"}, {"exam": 13, "no": 26, "sub": "", "q": "次の文章に該当する商人はどれでしょうか。「越後生まれ松前育ちで、初代の小樽区長、後に衆議院議員になる。緑町の直行寺はこの商人が建立した菩提寺」", "a": "2"}, {"exam": 13, "no": 27, "sub": "", "q": "昭和6年、新年号『講談倶楽部』「小樽金満家名簿」において、1位から3位の順で正しいのは次のどれでしょうか。（左から1位〜3位）", "a": "2"}, {"exam": 13, "no": 28, "sub": "", "q": "小樽商人は商売だけでなく、小樽のまちにも大きく貢献しました。2代目板谷宮吉がある建物を建設するため、土地と共に25万円の寄付をしました。その建設したものは何でしょうか。", "a": "小樽市中学校または長橋中学校"}, {"exam": 13, "no": 29, "sub": "", "q": "通称「加越能」呼ばれた商人が小樽の歴史を創った大立役者といわれています。加越能資本と関係のない銀行は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 31, "sub": "", "q": "次の建物の中で、小樽で活躍した商人と関連のないものはどれでしょうか。（建物名は現在名）", "a": "3"}, {"exam": 13, "no": 49, "sub": "", "q": "（　）内に該当する語句を記入しなさい。小樽は鉄道の開通を契機に物流の拠点となったことから、船の荷物の揚げ降ろしは現在の浅草橋付近にあった波止場を中心に行われたことで明治20年頃から周辺に（　）の倉庫が建ち並びました。", "a": "木骨石造"}, {"exam": 13, "no": 54, "sub": "", "q": "次の建物のなかに建築構造が一つだけ違うものがあります。それはどれでしょうか。（名称は建築時）", "a": "2"}, {"exam": 13, "no": 58, "sub": "", "q": "北海製罐の説明で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 61, "sub": "", "q": "旧三井銀行小樽支店の外壁は花崗岩を積み、アーチを連続させて軒を装飾しています。このデザイン様式は何というでしょうか。", "a": "ルネサンス"}, {"exam": 13, "no": 66, "sub": "", "q": "石川啄木が郷里の岩手を離れ、明治40年に創立したばかりの小樽日報社で記者として活躍します。この新聞社は、次のどこにあったでしょうか。", "a": "3"}, {"exam": 13, "no": 73, "sub": "", "q": "船見坂から港方向への通りは、ある目的で造られました。その目的は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 80, "sub": "", "q": "平成27年、市指定歴史的建造物ではなかったが明治、大正の建物が2棟取り壊されました。一棟は大正期に建てられた富岡の「旧秋山弁護士事務所」、もう一棟は明治期の倉庫で色内の大家倉庫の並びにあった内山鉄工所です。この内山鉄工所の創建時の名称は次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 1, "sub": "", "q": "小樽は、小樽郡が設置されるまでは、地域は3つに分かれ、請負商人が管理していました。その管理していた範囲を総称して何というでしょうか。", "a": "場所"}, {"exam": 14, "no": 6, "sub": "", "q": "明治から大正時代にかけて、小樽には財力のある商人が数々登場します。そのなかで、日露戦争で所有していた船を提供したことで財を築き、公会堂を寄贈したことでも知られる人物とは次のどれでしょうか。", "a": "1"}, {"exam": 14, "no": 25, "sub": "", "q": "堺町通りの店舗写真です。小樽商人の金子元三郎に関係する建物は何番でしょうか。", "a": "2"}, {"exam": 14, "no": 26, "sub": "", "q": "次の商人のうち、醤油醸造会社で成功したのはどれでしょうか。", "a": "3"}, {"exam": 14, "no": 27, "sub": "", "q": "昭和6年新年号「講談倶楽部」の小樽市金満家名簿において総資産が約5千万円で、第1位だった商人とは誰でしょうか。（姓のみ不可）", "a": "板谷宮吉"}, {"exam": 14, "no": 28, "sub": "", "q": "明治27年、小樽電灯社を設立して電気事業を起こした越前武生出身の商人は次のどれでしょうか。", "a": "4"}, {"exam": 14, "no": 29, "sub": "", "q": "加越能資本の銀行の建物は今も残っております。現在、銀の鐘として再生利用されているのは、次のどれでしょうか。（名称は建築時）", "a": "3"}, {"exam": 14, "no": 30, "sub": "", "q": "次の文章に該当する商人は誰でしょうか。（姓のみ不可）現在の北一硝子三号館は廻船問屋として米、味噌、縄、筵などを保管したこの商人の倉庫でした。また、かつて緑町第2大通りにあったこの商人の地所内の山はこの商人の名前が通称名としてついていました。", "a": "木村円吉"}, {"exam": 14, "no": 54, "sub": "", "q": "次の建物のなかで建設された時代が違うものがあります。それは次のどれでしょうか。（名称は建築時）", "a": "2"}, {"exam": 14, "no": 55, "sub": "", "q": "次の小樽市内にある建物の創建時名と現在名との組み合わせで正しいのはどれでしょうか。", "a": "3"}, {"exam": 14, "no": 56, "sub": "", "q": "色内大通と緑山手通りの交差点には、今も3つの旧銀行建築が現存しています。その3つの銀行の建築年の古い順で正しいのは次のどれでしょうか。（左から古い順）", "a": "1"}, {"exam": 14, "no": 57, "sub": "", "q": "大正期、商店の外壁には明治期の石材にかわりコンクリートやモルタルを塗るなど、セメントが新たな建築材料として登場します。この工法で建てられた大正期の建物は次のどれでしょうか。（名称は建築時）", "a": "2"}, {"exam": 14, "no": 58, "sub": "", "q": "北海製罐（株）の建物の説明で、間違っているのは次のどれでしょうか。", "a": "1"}, {"exam": 14, "no": 60, "sub": "", "q": "昭和の銀行建築の説明です。該当する創建時の旧銀行名を記入しなさい。外壁には花崗岩を積み、軒はアーチを連続させたルネサンスのデザインで統一されている。平成29年夏には一般公開される予定になっている。", "a": "旧三井銀行小樽支店"}, {"exam": 14, "no": 77, "sub": "", "q": "平成28年7月、小樽市内に新たな観光施設が誕生しました。アール・ヌーヴォーグラス館とステンドグラス美術館ですが、2館とも小樽市指定歴史的建造物を活用して開館しました。施設名と建物名の組合せが正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 82, "sub": "", "q": "小樽市内には人物名に由来した町名があります。自費で道路を造ったことで山田町と命名されました。小樽区長にもなったこの人物名を書きなさい。（姓のみ不可）", "a": "山田吉兵衛"}, {"exam": 14, "no": 85, "sub": "", "q": "現在、小樽市内で清酒を醸造する会社は田中酒造のみとなりました。信香町にある田中酒造亀甲蔵は、ある商人が明治39年に建てた倉庫です。米・荒物・雑穀・倉庫業を営み、のちに区会議員、市会議員も務め、能舞台を小樽市に寄贈したこの商人は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 1, "sub": "", "q": "幕末の小樽は、オタルナイ場所、タカシマ場所、オショロ場所の3つに分かれ、場所を請け負った商人が各場所を経営していました。その商人の出身地は共通していますが、それはどこでしょうか。", "a": "近江"}, {"exam": 15, "no": 25, "sub": "", "q": "北陸地方出身の商人の説明です．商人名（姓・名両方）を書きなさい。（姓のみ不可）まだ米のとれなかった北海道に注目し、明治15年に渡道。小樽で精米事業をはじめました。また、明治26年には開墾委託株式会社を設立し、雨竜郡の土地を開墾したことでも知られています。", "a": "沼田喜三郎"}, {"exam": 15, "no": 26, "sub": "", "q": "次の文と関係のある商人名（姓・名両方）を書きなさい。（姓のみ不可）明治8年、北海道へ渡り色内町の兄の店で呉服問屋を始め、その後醤油醸造会社として成功しました。その商店には後に北の誉酒造を興した野口吉次郎が修業していました。", "a": "石橋彦三郎"}, {"exam": 15, "no": 27, "sub": "", "q": "商人とその商人に関連する語句の組合せで正しいのは次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 28, "sub": "", "q": "花園十字街に位置するおたる無尽ビルと関連する商人は次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 29, "sub": "", "q": "下記の建物は現在の名称です。この建物のなかで創建時、富山を拠点とした銀行だったのはどれでしょうか。", "a": "1"}, {"exam": 15, "no": 30, "sub": "", "q": "小樽で活躍した商人たちは、まちに寄付をして貢献しました。商人名と寄付したものの組合せで間違っているのはどれでしょうか。", "a": "2"}, {"exam": 15, "no": 31, "sub": "", "q": "かつて活躍した商人に関連した建物の現在名です。このなかで堺町通り商店街にないのはどれでしょうか。", "a": "4"}, {"exam": 15, "no": 53, "sub": "", "q": "小樽には石造りの倉庫や商店、蔵が多くあります。この石壁の構造は2種類に大別されます。一つは石だけを積み上げた石造ともう一つの構造は何というでしょうか。", "a": "木骨石造"}, {"exam": 15, "no": 55, "sub": "", "q": "明治45年に完成した日本銀行小樽支店の建築費は、全国の日本銀行の中で上から何番目だったでしょうか。", "a": "2"}, {"exam": 15, "no": 58, "sub": "", "q": "色内大通と緑山手通りの交差点には、今も3つの旧銀行建築が現存しています。旧銀行名と現在名との組み合わせで正しいのはどれでしょうか。", "a": "3"}, {"exam": 15, "no": 59, "sub": "", "q": "旧北海製罐倉庫（株）の建物の特徴で、間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 15, "no": 61, "sub": "", "q": "安田銀行小樽支店（現：花ごころ）の特長として正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 69, "sub": "", "q": "小林多喜二の作品に「不在地主」があります。この作品のモデルといわれている商人の蔵が現在も色内町にあり、レストランとして活用されています。この建物の創建時の名称は何というでしょうか。", "a": "磯野支店倉庫"}, {"exam": 15, "no": 71, "sub": "", "q": "平成29年9月、ニトリ小樽芸術村がグランドオープンしました。施設のなかで「ステンドグラス美術館」として再活用されたのは次のどれでしょうか。", "a": "4"}, {"exam": 15, "no": 82, "sub": "", "q": "小樽市内には現在8つの「市場」があります。（平成30年2月現在）しかし残念ながら平成29年3月に閉店した市場がありました。70年にわたり親しまれ閉店した市場は次のどれでしょうか。", "a": "1"}, {"exam": 15, "no": 84, "sub": "A", "q": "次の文章は市内唯一の清酒酒造会社、田中酒造の説明です。（　）内に該当する語句を記入しなさい。亀甲蔵はもともと小樽商人、（　A　）の倉庫で現在は酒蔵として使用しています。この酒蔵の名称はこの商人の印からきています。また、代表的な清酒の銘柄は（　B　）で、毎年のように鑑評会で受賞しています。", "a": "岡崎謙"}, {"exam": 15, "no": 84, "sub": "B", "q": "次の文章は市内唯一の清酒酒造会社、田中酒造の説明です。（　）内に該当する語句を記入しなさい。亀甲蔵はもともと小樽商人、（　A　）の倉庫で現在は酒蔵として使用しています。この酒蔵の名称はこの商人の印からきています。また、代表的な清酒の銘柄は（　B　）で、毎年のように鑑評会で受賞しています。", "a": "宝川"}, {"exam": 15, "no": 90, "sub": "", "q": "平成29年2月、新たに市指定有形文化財に指定された建物は次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 1, "sub": "", "q": "幕末の小樽は、小樽郡が設置されるまでは、場所とよばれる地域で3つに分かれ、請負商人が管理していました。オタルナイ場所、タカシマ場所ともう一つは何というでしょうか。", "a": "オショロ場所"}, {"exam": 16, "no": 6, "sub": "", "q": "明治から大正期にかけて小樽は商人が活躍し財力をつけていきました。水天宮の丘を開削し、現在の寿司屋通りと入船を結ぶ道路を建設し後に地名となった商人とは誰でしょうか。（姓のみ不可）", "a": "山田吉兵衛"}, {"exam": 16, "no": 9, "sub": "", "q": "江戸時代の小樽は3つの場所に分かれ請け負った商人が場所を経営していました。その商人の出身地は同じでしたが、それは次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 25, "sub": "", "q": "小樽の観光名所となっているニトリ芸術村の一角（旧荒田商会裏）にステンドグラス美術館として再生活用されている木骨石造倉庫があります。この倉庫はある商人の倉庫でした。その商人とはだれでしょうか。（姓のみ不可）", "a": "髙橋直治"}, {"exam": 16, "no": 26, "sub": "", "q": "次の文と関係のある商人名を書きなさい。（姓のみ不可）中江兆民を招き小樽で最初の新聞「北門新報」を発行した商人で、直行寺はこの人物と深い関わりがあるといわれています。また、堺町通りにあるおたる瑠璃工房運河店はこの商人の商店でした。この商人は誰でしょうか。", "a": "金子元三郎"}, {"exam": 16, "no": 27, "sub": "", "q": "昭和6年、新年号『講談倶楽部』「小樽金満家名簿」において、1位から3位の順で正しいのは次のどれでしょうか。（左から1位〜3位）", "a": "2"}, {"exam": 16, "no": 28, "sub": "", "q": "次の建物の中で、小樽で活躍した商人（テキスト掲載商人）と関連のないものはどれでしょうか。（建物名は現在名）", "a": "3"}, {"exam": 16, "no": 29, "sub": "", "q": "堺町通りにあるこの建物は、小樽で活躍した商人、木村家の倉庫でした。現在もガラス製品の小樽を代表する店舗で、入り口から建物内に入ると、かつてトロッコに使用していたレールが今も残っています。この建物名は次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 30, "sub": "", "q": "色内にあるレストラン「ＩＳＯ」はある商人の倉庫でした。小林多喜二の小説のモデルといわれたこの商人とはだれでしょうか。（姓のみ不可）", "a": "磯野進"}, {"exam": 16, "no": 31, "sub": "", "q": "次の文と関係のある商人はどれでしょうか。小樽商工会議所の第15代会頭、札幌証券取引所の2代目理事を14年間務め、他に北海道硝子卸商業協組理事長としても活躍しました。", "a": "2"}, {"exam": 16, "no": 56, "sub": "", "q": "次の小樽市内にある大正期の建物の創建時名と現在名との組み合わせで間違っているのはどれでしょうか。", "a": "3"}, {"exam": 16, "no": 77, "sub": "", "q": "平成16年、小樽駅から港方向への中央通りの拡幅工事が完成しました。この工事期間中、ある歴史的建造物が元の位置から現在の位置まで移動させる工事がありました。その建物とは次のどれでしょうか。", "a": "4"}, {"exam": 16, "no": 82, "sub": "", "q": "小樽市内には現在7つの「市場」があります。（平成30年12月現在）店舗数の減少により平成30年3月に閉店した市場がありました。101年にわたり親しまれ閉店した市場は次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 26, "sub": "", "q": "明治期に活躍した「小樽商人」の主な業務は次のどれでしょうか。", "a": "3"}, {"exam": 17, "no": 27, "sub": "", "q": "次の1〜4のそれぞれの組合せで、つながりのある組合せになっているのはどれでしょうか。", "a": "4"}, {"exam": 17, "no": 28, "sub": "", "q": "次の写真の中で、小樽商人の金子元三郎に関係する建物はどれでしょうか。", "a": "2"}, {"exam": 17, "no": 29, "sub": "", "q": "次の文章に該当する商人はだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）廻船問屋の養子となり、明治12(1879)年に家督を継ぎました。その後、小樽から北陸、稚内、越後の航路を開き、また日露戦争では船を提供し財を築きました。この商人の銅像は小樽市民会館敷地内に建立されています。", "a": "藤山要吉"}, {"exam": 17, "no": 30, "sub": "", "q": "次の文はある商人ゆかりの建物を説明しています。この建物の創建時の企業名を書きなさい。木骨煉瓦造2階建の建物で大正4年の創建です。かつての有幌倉庫群入口にあたる角地に位置します。壁の褐色の煉瓦、アーチ状窓のキーストーン（要石）や開口部と隅部に積んだコーナーストーンなどが特徴です。平成6年、小樽市都市景観賞を受賞しています。", "a": "共成株式会社"}, {"exam": 17, "no": 31, "sub": "", "q": "小樽で活躍した商人たちは、まちに寄付をして貢献しました。商人名と寄付したものの組合せで正しいのはどれでしょうか。", "a": "2"}, {"exam": 17, "no": 32, "sub": "", "q": "地名や通り名には活躍した商人にちなんでつけられた名称があります。次の名称の中で、商人とは関係のない地名はどれでしょうか。", "a": "4"}, {"exam": 17, "no": 56, "sub": "", "q": "色内大通にある建物です。創建時名と現在名との組み合わせで間違いはどれでしょうか。", "a": "3"}, {"exam": 17, "no": 59, "sub": "", "q": "大正期の建築の特徴の一つとして、商店の外壁にコンクリートやモルタルを塗るなど、セメントが新たな建築材料と使われるようになりました。この工法で建てられた典型的な大正期の建物は次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 73, "sub": "", "q": "小樽市は令和元(2019)年5月20日、シリアル型の日本遺産「炭鉄港」に認定されました。小樽市における「炭鉄港」の構成文化財で違うものは次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 82, "sub": "", "q": "昭和21(1946)年に樺太引き揚げ者が中心となって開いたのが始まりの市場で、現在地の建物は昭和39(1964)年に建設され今日まで営業しています。残念ながら店舗数減少と建物の老朽化により、令和2年に閉店が予定されている小樽市内の市場は次のどれでしょうか。", "a": "1"}, {"exam": 17, "no": 88, "sub": "", "q": "次の文化財で、小樽市指定有形文化財はどれでしょうか。", "a": "3"}, {"exam": 18, "no": 26, "sub": "", "q": "次の文章は小樽で活躍した商人を説明しています。この商人の姓・名両方を書きなさい。（姓のみ不可）「安政3年に信香町で呉服・瀬戸物・塗物・米・味噌・荒物などを扱う店を開き漁業も営んでいた。元治2年にはオタルナイ村の名主となる」", "a": "山田兵蔵"}, {"exam": 18, "no": 27, "sub": "", "q": "堺町通りには小樽商人が残した建物が今も残り、店舗として活用されています。かつて小樽で最初の新聞「北門新報」の印刷所だったこの建物の現在の店舗名は何というでしょうか。次の中から選びなさい。", "a": "3"}, {"exam": 18, "no": 28, "sub": "", "q": "昭和6年、新年号『講談倶楽部』「小樽金満家名簿」において、1位は板谷宮吉でした。その資産は次のどれでしょうか。", "a": "2"}, {"exam": 18, "no": 29, "sub": "", "q": "次の文章に該当する商人は誰でしょうか。姓・名両方を書きなさい。（姓のみ不可）「大正13年に小樽高商を卒業。同期に小林多喜二がいました。昭和9年に重太郎や英太郎が関わった小樽無尽に入り、昭和23年には北洋銀行の社長に就任します。この建物は現在の「おたる無尽ビル」です。」", "a": "寿原九郎"}, {"exam": 18, "no": 31, "sub": "", "q": "次の建物の中で、銀行として建てられたものはどれでしょうか。（建物名は現在名）", "a": "3"}, {"exam": 18, "no": 32, "sub": "", "q": "次の4名の中で、小樽商工会議所（商業会議所時代も含む）の会頭職ではなかったのは誰でしょうか。", "a": "4"}, {"exam": 18, "no": 55, "sub": "", "q": "日本銀行小樽支店は明治45年に完成します。当時の全国の日本銀行のなかで建築費の高い順で小樽支店は次のどれでしょうか。", "a": "1"}, {"exam": 18, "no": 56, "sub": "", "q": "色内にある小樽市指定歴史的建造物のなかで、日本遺産「炭鉄港」の構成文化財になっているのは次のどれでしょうか。", "a": "3"}, {"exam": 18, "no": 58, "sub": "A", "q": "北海製罐倉庫（現北海製罐）の説明です。文中の文章の（　）内に該当する語句を書きなさい。「工場施設は大正（　A　）年から昭和10年にかけて事務所棟をはじめ工場、倉庫が建てられました。事務所の特徴として（　B　）の連続窓で近代建築のモダンな外観を表現しています。」", "a": "10"}, {"exam": 18, "no": 58, "sub": "B", "q": "北海製罐倉庫（現北海製罐）の説明です。文中の文章の（　）内に該当する語句を書きなさい。「工場施設は大正（　A　）年から昭和10年にかけて事務所棟をはじめ工場、倉庫が建てられました。事務所の特徴として（　B　）の連続窓で近代建築のモダンな外観を表現しています。」", "a": "横長"}, {"exam": 18, "no": 60, "sub": "", "q": "次の小樽市内にある建物の建築時名と現在名との組み合わせで正しいのはどれでしょうか。", "a": "3"}, {"exam": 18, "no": 62, "sub": "", "q": "旧三井銀行小樽支店の外観のデザインの特長は次のどれでしょうか。", "a": "3"}, {"exam": 18, "no": 66, "sub": "", "q": "ある作家の碑文です。この文学碑がある場所はどこでしょうか。「子を負ひて／雪の吹き入る停車場に／われ見送りし妻の眉かな」", "a": "4"}, {"exam": 18, "no": 73, "sub": "", "q": "小樽市は令和元（2019）年、シリアル型の日本遺産「炭鉄港」に認定されました。次の4つのなかで、小樽市における「炭鉄港」の構成文化財ではないものはどれでしょうか。", "a": "3"}, {"exam": 18, "no": 80, "sub": "", "q": "かつて小樽市内にはたくさんの市場がありましたが、年々減少し現在は6つとなりました。その6つとは次のどれでしょうか。", "a": "1"}, {"exam": 18, "no": 84, "sub": "", "q": "小樽市内で2021年、創立100周年を迎える商店街があります。その商店街とは次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 13, "sub": "", "q": "平磯岬に建つ銀鱗荘は余市町の大漁家猪俣家住宅を昭和13（1938）年に移築したものです。これはある企業の記念事業として行われたものでした。この企業とは次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 27, "sub": "", "q": "小樽における商人のはじまりは場所を請負っていた近江商人です。恵比須屋岡田家ともうひとつは何でしょうか。（屋号を記載しなくても可）", "a": "住吉屋西川家"}, {"exam": 19, "no": 28, "sub": "", "q": "堺町通りにある店舗写真です。小樽商人の金子元三郎に関係する建物は何番でしょうか。", "a": "1"}, {"exam": 19, "no": 29, "sub": "", "q": "次の建物の中で、小樽で活躍した商人、沼田喜三郎が創設した共成と関連のある建物は次のどれでしょうか。（建物名は現在名）", "a": "4"}, {"exam": 19, "no": 30, "sub": "", "q": "小樽芸術村ステンドグラス美術館は小樽で活躍した商人の倉庫でした。小豆将軍というあだ名がつけられるほど穀物相場で巨万の富を築いたその商人名を書きなさい。（姓・名両方）", "a": "高橋直治"}, {"exam": 19, "no": 31, "sub": "", "q": "次の商人のうち、醤油醸造会社で成功したのはどれでしょうか。", "a": "4"}, {"exam": 19, "no": 32, "sub": "", "q": "小樽で活躍した商人たちは、まちに寄付をして貢献しました。商人名と寄付した内容の組合せで正しいのはどれでしょうか。", "a": "2"}, {"exam": 19, "no": 58, "sub": "A", "q": "次の文章は大正期の銀行建築、第一銀行小樽支店の説明です。文中の（　）内に該当する語句を書きなさい。第一銀行は（　A　）が設計しました。その装飾の特徴はヨーロッパで流行していた曲線を生かす（　B　）の様式でした。", "a": "田辺淳吉"}, {"exam": 19, "no": 58, "sub": "B", "q": "次の文章は大正期の銀行建築、第一銀行小樽支店の説明です。文中の（　）内に該当する語句を書きなさい。第一銀行は（　A　）が設計しました。その装飾の特徴はヨーロッパで流行していた曲線を生かす（　B　）の様式でした。", "a": "アール・ヌーヴォー"}, {"exam": 19, "no": 59, "sub": "", "q": "次の建物のなかで建築構造が一つだけ違うものがあります。それはどれでしょうか。（建物名は現在名）", "a": "1"}, {"exam": 19, "no": 60, "sub": "", "q": "大正期の建築の特徴の一つとして、商店の外壁にコンクリートやモルタルを塗るなど、セメントが新たな建築材料と使われるようになりました。この工法で建てられた典型的な大正期の建物は次のどれでしょうか。（建物名は建築時）", "a": "4"}, {"exam": 19, "no": 69, "sub": "", "q": "小林多喜二の作品に「不在地主」があります。この作品のモデルといわれている商人の建物が現在も色内町にあり、レストランとして活用されています。この建物の現在の名称は何というでしょうか。", "a": "ＩＳＯ"}, {"exam": 19, "no": 73, "sub": "", "q": "令和3（2021）年11月、国の文化審議会が国の重要文化財に指定するよう答申したなかに後志の建造物が2件あり、令和4（2022）年2月に2件とも指定されました。1件は余市町の「ニッカウヰスキー余市蒸留所施設」、もう1件は次のどれでしょうか。", "a": "2"}, {"exam": 19, "no": 76, "sub": "", "q": "小樽市内の坂の説明です。該当する坂の名称を書きなさい。「勾配15%を超える市内屈指の急坂で、中央通りと龍宮通りとの中間の防火帯として造られました。坂の上り口付近には戦後「ガンガン部隊」の仕入れ拠点ともなった市場が今もあります。」", "a": "船見坂"}, {"exam": 19, "no": 77, "sub": "", "q": "星野リゾート（長野県）が小樽市色内で都市型観光ホテルを令和4（2022）年に開業しました。そのホテルの一部は小樽市指定歴史的建造物に指定されています。その建物とは次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 85, "sub": "", "q": "次の文章は通称、小樽の3大祭りのひとつと呼ばれる神社の説明です。この神社名を書きなさい。「この神社は平成30年に鎮座150年の節目を迎え、建物や参道の改修が行われました。境内には小樽ゆかりの商人たちの多様な寄進物も見ることができます。また近年は花手水で有名となり、5月から10月まで開催されています。」", "a": "住吉神社"}, {"exam": 20, "no": 6, "sub": "", "q": "明治から大正時代にかけて小樽は大きく発展していくとともに財力のある商人が多く登場します。商人たちは私財を寄付し町の発展に貢献しました。現小樽商科大学の建設にあたり敷地を寄付した商人とは誰でしょうか。この人物名(姓・名両方)を書きなさい。（姓のみ不可）", "a": "木村円吉"}, {"exam": 20, "no": 28, "sub": "", "q": "堺町通りにある店舗写真です。かつては廻船問屋として米・みそ・縄・筵などを保管する商人の倉庫でした。この建物の現在名は何というでしょうか。", "a": "北一硝子三号館"}, {"exam": 20, "no": 29, "sub": "", "q": "商人の名前が地名や通り名（通称名も含む）になっているところがあります。次の組み合わせの中で正しいのはどれでしょうか。", "a": "1"}, {"exam": 20, "no": 30, "sub": "", "q": "下記の建物は現在の名称です。この建物のなかで建築時、富山を拠点とした銀行だったのはどれでしょうか。", "a": "4"}, {"exam": 20, "no": 31, "sub": "", "q": "次の文と関係のある商人はどれでしょうか。明治18(1885)年、共同運輸会社と郵便汽船三菱会社が合併し、日本郵船会社が設立された時、石巻支店長として赴任しています。その後、明治27(1894)年には小樽電灯舎を設立して電気事業を起こしました。", "a": "3"}, {"exam": 20, "no": 56, "sub": "", "q": "次の小樽市内にある建物の建築時名と現在名との組み合わせで間違っているのはどれでしょうか。", "a": "2"}, {"exam": 20, "no": 58, "sub": "A", "q": "次の文章は北海製罐の説明です。文中の（　）内に該当する語句を書きなさい。北海製罐の主要な建物は（　A　）造で建設されました。第三倉庫の外壁の特徴的なものに（　B　）と呼ばれる、製品を艀に積み込むために工夫された滑り台が設置されていることです。", "a": "鉄筋コンクリート"}, {"exam": 20, "no": 58, "sub": "B", "q": "次の文章は北海製罐の説明です。文中の（　）内に該当する語句を書きなさい。北海製罐の主要な建物は（　A　）造で建設されました。第三倉庫の外壁の特徴的なものに（　B　）と呼ばれる、製品を艀に積み込むために工夫された滑り台が設置されていることです。", "a": "スパイラルシュート"}, {"exam": 20, "no": 59, "sub": "", "q": "大正期の商店建築で、正面に緩やかな3つのアーチがあった建物が令和4年に解体されました。稲穂町にあったこの建物は次のどれでしょうか。（建物名は建築時）", "a": "1"}, {"exam": 20, "no": 66, "sub": "", "q": "ある作家の碑文です。この文学碑がある場所はどこでしょうか。「かなしきは小樽の町よ/歌うことなき人人の/声の荒さよ」", "a": "1"}, {"exam": 20, "no": 75, "sub": "", "q": "小樽市は現在、シリアル型の日本遺産「北前船」「炭鉄港」2つに認定されています。この2つの日本遺産の構成文化財ではないのは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 84, "sub": "", "q": "小樽市内の商店街で、創立100年を超えた商店街があります。大正10(1921)年、「稲電会」として発足した商店街とは次のどれでしょうか。", "a": "3"}, {"exam": 21, "no": 1, "sub": "A", "q": "次の文章の（　）内に該当する語句を書きなさい。江戸時代後期のオタルナイ場所では請負商人が場所を管理するため、（　A　）という拠点を設けました。オタルナイ場所で、Aの建物があった所は、現在の（　B　）付近です。＊Bの横にはAの石碑があります。", "a": "運上屋"}, {"exam": 21, "no": 1, "sub": "B", "q": "次の文章の（　）内に該当する語句を書きなさい。江戸時代後期のオタルナイ場所では請負商人が場所を管理するため、（　A　）という拠点を設けました。オタルナイ場所で、Aの建物があった所は、現在の（　B　）付近です。＊Bの横にはAの石碑があります。", "a": "堺町郵便局"}, {"exam": 21, "no": 6, "sub": "", "q": "明治から大正時代にかけて日本は3回の大きな戦争をします。小樽で活躍した商人の中にも所有していた船を戦争に供出し、莫大な補償金を手に入れた商人がいます。それは次の誰でしょうか。", "a": "2"}, {"exam": 21, "no": 27, "sub": "", "q": "次の文章に該当する商人名を書きなさい。（姓のみ不可）彦根生まれ。明治8(1875)年に北海道へわたり、色内町の兄の店で呉服問屋を始め、その後、醤油醸造会社となりました。野口吉次郎は、この商人のもとで修業し、のれん分けで「マルヨ」の印をもらいました。", "a": "石橋彦三郎"}, {"exam": 21, "no": 28, "sub": "", "q": "堺町通りにある北一硝子三号館は、小樽ゆかりの商人の倉庫でした。その商人とは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 29, "sub": "", "q": "昭和6年、新年号『講談倶楽部』「小樽金満家名簿」において、1位、2位の順で正しいのは次のどれでしょうか。（左から1位〜2位）", "a": "2"}, {"exam": 21, "no": 30, "sub": "", "q": "次の建物の中で、小樽で活躍した商人（「おたる案内人」公式テキスト内）と関連のないものはどれでしょうか。（建物名は現在名）", "a": "4"}, {"exam": 21, "no": 31, "sub": "", "q": "次の文と関係のある商人はどれでしょうか。秋田県能代生まれ。山田兵蔵に連れられ15歳で来樽し、明治24(1891)年には小樽郡の総代人となる。山田家の総代理人になってからは、小樽漁業組合頭取、小樽水産組合長など水産業界の舵取り役を果たす。明治45(1912)年には5代目小樽区長に就任する。", "a": "3"}, {"exam": 21, "no": 32, "sub": "", "q": "小樽で活躍した商人が由来の地名、通り名で関係のないものは次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 56, "sub": "", "q": "問55の技術者が関わっている建物は次のどれでしょうか。", "a": "3"}, {"exam": 21, "no": 58, "sub": "A", "q": "北海製罐倉庫（現北海製罐）の説明です。文中の文章の（　）内に該当する語句を書きなさい。「工場および倉庫の主要な建物は（　A　）造で施設は大正10年から昭和10年にかけて建てられました。小樽運河のランドマークといえる第3倉庫は令和6(2024)年、完成後（　B　）を迎える年になります。」", "a": "鉄筋コンクリート"}, {"exam": 21, "no": 58, "sub": "B", "q": "北海製罐倉庫（現北海製罐）の説明です。文中の文章の（　）内に該当する語句を書きなさい。「工場および倉庫の主要な建物は（　A　）造で施設は大正10年から昭和10年にかけて建てられました。小樽運河のランドマークといえる第3倉庫は令和6(2024)年、完成後（　B　）を迎える年になります。」", "a": "100年"}, {"exam": 21, "no": 59, "sub": "", "q": "次の大正期の建築で、建築年の古い順に並んでいるのはどれでしょうか。（左から古い順）", "a": "1"}, {"exam": 21, "no": 61, "sub": "", "q": "次の小樽市指定歴史的建造物の建築時名と現在名との組み合わせで間違っているのはどれでしょうか。", "a": "1"}, {"exam": 21, "no": 67, "sub": "", "q": "石川啄木は明治40(1907)年、創立したばかりの小樽日報社に記者として入社しました。この会社のあった場所は次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 69, "sub": "", "q": "ある作家の碑文の前半です。この文学碑がある場所は次のどれでしょうか。「冬が近くなると/ぼくはそのなつかし/い国のことを考えて/深い感動に捉えら/れているそこには/運河と倉庫と税関と/桟橋がある・・・・・・」", "a": "3"}, {"exam": 21, "no": 75, "sub": "", "q": "小樽市は現在、シリアル型の日本遺産「炭鉄港」に認定されています。小樽における日本遺産「炭鉄港」の構成文化財ではないのは次のどれでしょうか。", "a": "4"}, {"exam": 21, "no": 77, "sub": "", "q": "かつては市場の多かった小樽でしたが、残念ながら令和6(2024)年3月末で、また姿を消す市場があります。それは次のどれでしょうか。", "a": "2"}, {"exam": 21, "no": 78, "sub": "", "q": "小樽花園銀座商店街で70年以上にわたり営業を続けてきた喫茶店が令和5(2023)年8月末に閉店しました。その喫茶店の名称は何というでしょうか。", "a": "喫茶コロンビア"}, {"exam": 21, "no": 82, "sub": "", "q": "現在の迫小樽市長は第14代目ですが、第3代市長は名誉職市長でした。小樽の商人としても活躍した、第3代市長名を書きなさい。", "a": "板谷宮吉"}, {"exam": 21, "no": 89, "sub": "", "q": "小樽には国指定重要文化財（建造物）が3つあります。次のなかで違うものはどれでしょうか。", "a": "4"}, {"exam": 22, "no": 27, "sub": "", "q": "商人と関連する語句との組合せで、つながりが正しいのはどれでしょうか。", "a": "4"}, {"exam": 22, "no": 28, "sub": "", "q": "次の写真の中で、小樽商人の岡崎謙に関係する建物はどれでしょうか。", "a": "1"}, {"exam": 22, "no": 29, "sub": "", "q": "下記の建物は現在の名称です。この建物のなかで建築時、ある商人の和洋小間物店倉庫だったのは次のどれでしょうか。", "a": "4"}, {"exam": 22, "no": 30, "sub": "", "q": "次の文と関係のある商人名（姓・名両方）を書きなさい。（姓のみ不可）越前武生出身で明治18（1885）年、日本郵船会社が設立された時、石巻支店長として赴任します。その後、明治27（1894）年、小樽電灯舎を設立し翌年から電力の供給が開始されました。", "a": "倉橋大介"}, {"exam": 22, "no": 31, "sub": "", "q": "次の建物の中で、元々商人の倉庫として建てられたものはどれでしょうか。（建物名は現在名）", "a": "1"}, {"exam": 22, "no": 32, "sub": "", "q": "次の文はある商人を説明しています。この商人ゆかりの建物が今は観光施設として再生活用されています。建物の現在名を書きなさい。大正3（1914）年の第一次大戦では小豆を買占め巨万の富を得たことで「小豆将軍」「豆成金」などとも云われていました。その後、北海道初の衆議院議員にもなりました。", "a": "小樽芸術村ステンドグラス美術館"}, {"exam": 22, "no": 56, "sub": "", "q": "木骨石造の建物は小樽の歴史的な景観をつくっていますが、次の建物のなかで、木骨石造ではないのはどれでしょうか。（建物名は建築時）", "a": "4"}, {"exam": 22, "no": 60, "sub": "", "q": "次の小樽市指定歴史的建造物のなかで、日本遺産「炭鉄港」の構成文化財となっているのはどれでしょうか。（建物名は建築時）", "a": "3"}, {"exam": 22, "no": 62, "sub": "", "q": "大正期の建築の特徴の一つとして、商店の外壁にコンクリートやモルタルを塗り、さらにタイルを張る防火建築が出現しました。これらの工法で建てられた典型的な大正期の建物は次のどれでしょうか。（建物名は建築時）", "a": "1"}, {"exam": 22, "no": 81, "sub": "", "q": "小樽市内には現在5つの「市場」があります。次の説明に当てはまる市場名を書きなさい。昭和21（1946）年、外地からの引揚者が現在地でバラックの仮店舗による営業がはじまり。場内のフリースペースにはギャラリーもあり、アートの展示やワークショップなども随時開催されている。", "a": "中央市場"}, {"exam": 23, "no": 27, "sub": "", "q": "次の文章は小樽で活躍した商人を説明しています。この商人の名前を選びなさい。「松前藩の城下町福山に生まれる。明治15(1882)年、所有地の相生町から水天宮の西福を通って堺町のオコバチ川までの道路を造成した。小樽商業会議所の初代会頭でした。」", "a": "2"}, {"exam": 23, "no": 28, "sub": "", "q": "次の写真の中で、小樽で活躍した商人の高橋直治に関係する建物はどれでしょうか。", "a": "2"}, {"exam": 23, "no": 29, "sub": "", "q": "次の建物の中で、小樽で活躍した商人（「おたる案内人」公式テキスト内）と関連のないものはどれでしょうか。（建物名は現在名）", "a": "4"}, {"exam": 23, "no": 30, "sub": "", "q": "小樽で活躍した商人たちは、まちに寄付をして貢献しました。商人名と寄付したものの組合せで正しいのはどれでしょうか。", "a": "4"}, {"exam": 23, "no": 31, "sub": "", "q": "堺町通りにある「おたる瑠璃工房運河店」は小樽商人が残した建物で、現在は店舗として活用されています。かつてこの商人は小樽で最初の新聞を発行しました。その新聞名を書きなさい。", "a": "北門新報"}, {"exam": 23, "no": 32, "sub": "", "q": "小樽で活躍した商人のなかで、商工会議所（商業会議所も含む）の会頭になっていないのは次のどれでしょうか。", "a": "1"}, {"exam": 23, "no": 57, "sub": "", "q": "次の小樽市内にある建物の建築時名と現在名との組み合わせで間違っているのはどれでしょうか。", "a": "1"}, {"exam": 23, "no": 58, "sub": "A", "q": "北海製罐の工場施設の説明です。文中の（ ）内に該当する語句を書きなさい。主要な建物は鉄筋コンクリート造で、事務所は（A）の連続窓が特徴でモダンな外観を表現しています。また第3倉庫は外壁に（B）（渦巻き状滑り台）をつけ、製品を一気に船に積み込む工夫をしています。", "a": "横長"}, {"exam": 23, "no": 58, "sub": "B", "q": "北海製罐の工場施設の説明です。文中の（ ）内に該当する語句を書きなさい。主要な建物は鉄筋コンクリート造で、事務所は（A）の連続窓が特徴でモダンな外観を表現しています。また第3倉庫は外壁に（B）（渦巻き状滑り台）をつけ、製品を一気に船に積み込む工夫をしています。", "a": "スパイラルシュート"}, {"exam": 23, "no": 60, "sub": "", "q": "次の小樽市指定歴史的建造物のなかで、日本遺産「北前船」、「炭鉄港」の構成文化財となっていないのはどれでしょうか。（建物名は建築時）", "a": "2"}, {"exam": 23, "no": 61, "sub": "", "q": "小樽の建造物と建築様式の関係の説明で、間違っているのは次のどれでしょうか。", "a": "4"}, {"exam": 23, "no": 72, "sub": "", "q": "令和7(2025)年7月24日、小樽芸術村で5館目となる施設が「浅草橋小樽運河倉庫ビル」に開館しました。その施設名を書きなさい。", "a": "浮世絵美術館"}, {"exam": 23, "no": 74, "sub": "", "q": "令和7(2025)年2月4日、小樽市は地域型日本遺産に認定されました。そのストーリーを語る上で欠かせない26項目の文化財があります。その20番目に「運河完成後の倉庫群」があり3棟の構成文化財があります。次の中でこの3棟に該当しないのはどれでしょうか。", "a": "4"}, {"exam": 23, "no": 81, "sub": "", "q": "かつて小樽市内にはたくさんの市場がありましたが、年々減少し現在は5つとなりました。その5つとは次のどれでしょうか。", "a": "3"}, {"exam": 23, "no": 83, "sub": "", "q": "小樽の田中酒造は市内唯一の酒造会社です。色内町の本店と信香町の店舗・工場の2カ所あり、信香町の店舗・工場は旧岡崎倉庫を再生活用しています。この信香町の建物は何という名称でしょうか。次の中から選びなさい。", "a": "4"}, {"exam": 23, "no": 85, "sub": "", "q": "（ ）内に該当するものを選びなさい。令和7(2025)年10月24日、国の文化審議会において、小樽市にある（ ）を重要文化財にするよう、文部科学大臣へ答申があり、令和8(2026)年1月15日、官報告示をもって正式決定となりました。", "a": "3"}], "建築と歴史的建造物": [{"exam": 1, "no": 21, "sub": "", "q": "大正11年に野口喜一郎が自ら設計し、昭和29年には天皇・皇后両陛下が宿泊された建物は何ですか。", "a": "1"}, {"exam": 1, "no": 53, "sub": "", "q": "明治37年、現在の稲穂2丁目から出火した火の手は手宮まで及ぶ大火になりました。それを契機に市街地の主要な建物の構造は、防火の工夫を施すものに変わりました。今、この構造の建物は小樽固有の歴史的まちなみを形成する一つの要素になっています。さて、この建物の構造は、何と呼ばれているでしょうか。", "a": "3"}, {"exam": 1, "no": 54, "sub": "", "q": "旧手宮機関車庫（手宮、明治18年）は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、後に北海道庁本庁舎（赤れんが庁舎、札幌市中央区、明治21年）も設計しました。さて、この設計者は、誰でしょうか。", "a": "4"}, {"exam": 1, "no": 55, "sub": "", "q": "木骨石造（もっこつせきぞう）とは、どのような構造をいうのでしょうか。", "a": "2"}, {"exam": 1, "no": 56, "sub": "", "q": "次に示す3つの建物は、設計に工部大学校造家学科（そうか／現、東京大学工学部建築学科の前身）の第一期卒業生が関与しました。A）旧日本郵船小樽支店（色内3丁目、明治39年） B）日本銀行旧小樽支店（色内1丁目、明治45年） C）旧三井銀行小樽支店（色内1丁目、昭和2年）　それぞれの建物とその設計者の組み合わせで、正しいものはどれでしょうか。", "a": "2"}, {"exam": 1, "no": 58, "sub": "", "q": "旧小樽区公会堂（現・市公会堂、花園5丁目、明治44年）は、皇太子を迎えるために和風の建築様式で建てられました。新築工事は、次に示す3人が関わり進められました。A）藤山要吉　B）木子幸三郎（きこうさぶろう）　C）加藤忠五郎　それぞれの名前と工事の関わりの組み合わせで、正しいものはどれでしょうか。", "a": "1"}, {"exam": 1, "no": 59, "sub": "", "q": "大正10年代、旧三菱銀行・旧北海道拓殖銀行・旧第一銀行の各支店は、色内大通と緑山手通の交差点に建てられました。これらの建物の構造は、当時、わが国の主要な建築に採用され始めたものでした。さて、その建築構造は、何と呼ばれているでしょうか。", "a": "2"}, {"exam": 1, "no": 60, "sub": "", "q": "大正末から昭和初期にかけて、小樽市内に建築家が設計した住宅が建てられるようになりました。その一人は、フランク・ロイド・ライト（アメリカの建築家）に師事し、坂邸（見晴町、昭和2年）や坂牛邸（入船、昭和3年）をライト風のデザインで設計しました。その建築家は、誰でしょうか。", "a": "4"}, {"exam": 2, "no": 31, "sub": "", "q": "北の誉の創始者野口吉次郎の息子喜一郎の設計で建てられ、天皇・皇后両陛下が昭和29(1954)年8月にご来道の際、小樽での宿所となったこの建物の名称は何ですか。", "a": "和光荘"}, {"exam": 2, "no": 55, "sub": "", "q": "次に示す3つの建物は小樽を代表する洋風建築ですが、それぞれ構造が異なります。1）旧日本郵船小樽支店（色内3丁目、明治39年） 2）日本銀行旧小樽支店（色内1丁目、明治45年） 3）旧三井銀行小樽支店（色内1丁目、昭和2年）　さて、各建物とその構造の組み合わせで、正しいものはどれでしょうか。", "a": "1"}, {"exam": 2, "no": 57, "sub": "", "q": "旧小樽区公会堂（現・市公会堂、花園5丁目、明治44年）は、皇太子を迎えるために和風の建築様式で建てられました。新築工事は、次に示す3人が関わり進められました。1）藤山要吉（ふじやまようきち） 2）木子幸三郎（きこうさぶろう） 3）加藤忠五郎（かとうちゅうごろう）　それぞれの名前と工事の関わりの組み合わせで、正しいものはどれでしょうか。", "a": "1"}, {"exam": 2, "no": 60, "sub": "", "q": "昭和初期に小樽の公共建築は、コンクリートを用いて建てられました。小樽駅（稲穂2丁目、昭和9年）と小樽市庁舎（花園2丁目、昭和8年）は、その代表例です。この2つの建物の共通点は、何でしょうか。", "a": "3"}, {"exam": 3, "no": 55, "sub": "", "q": "小樽市内に木骨石造（もっこつせきぞう）の建物が多い理由で、間違っているのはどれですか。", "a": "2"}, {"exam": 3, "no": 56, "sub": "", "q": "次に示す3つの建物は、設計に工部大学校造家科（現、東京大学工学部建築学科の前身）の第一期卒業生が関与しました。1）旧日本郵船小樽支店（色内3丁目、明治39年） 2）日本銀行旧小樽支店（色内1丁目、明治45年） 3）旧三井銀行小樽支店（色内1丁目、昭和2年）　それぞれの建物とその設計者の組み合わせで、正しいものはどれですか。", "a": "2"}, {"exam": 3, "no": 59, "sub": "", "q": "明治44年、工事を請け負った大虎・加藤忠五郎（かとうちゅうごろう）は設計の指導を仰ぐため宮内省を訪問し、内匠寮の技師・木子幸三郎（きこうさぶろう）に図面を書いてもらい明治44年1月に工事を始め、7月に完成させました。さて、この建物とは何という名称ですか。", "a": "小樽区公会堂・公会堂"}, {"exam": 3, "no": 85, "sub": "", "q": "次の歴史的建造物で前問の賞の第一回受賞は次のどれですか。", "a": "3"}, {"exam": 4, "no": 50, "sub": "", "q": "明治37年、現在の稲穂2丁目から出火した火の手は手宮まで及ぶ大火になりました。それを契機に市街地の主要な建物の構造は、防火の工夫を施す石造りに変わりました。さて、数多く建てられた石造りの構造は、何と呼ばれているでしょうか。", "a": "木骨石造"}, {"exam": 4, "no": 55, "sub": "", "q": "小樽は工部大学校造家科（現、東京大学工学部建築学科の前身）の第一期卒業生4人の内3人の設計した建物が現在も残る貴重なまちです。その3人とは佐立七次郎、辰野金吾ともう一人はだれでしょうか。", "a": "曾禰達蔵"}, {"exam": 4, "no": 59, "sub": "", "q": "運河の北側に位置する北海製罐の建物は、いつから、どんな構造で建て始められたのでしょうか。次の組み合わせで正しいのはどれでしょうか。", "a": "3"}, {"exam": 4, "no": 60, "sub": "", "q": "昭和初期に小樽の公共建築は、コンクリートを用いて建てられました。小樽駅（稲穂、昭和9年）と小樽市庁舎（花園2丁目、昭和8年）は、その代表例です。この2つの建物の共通点は、何でしょうか。", "a": "3"}, {"exam": 5, "no": 51, "sub": "", "q": "明治37年、現在の稲穂2丁目から出火した火の手は手宮まで及ぶ大火になりました。それを契機に市街地の主要な建物の構造は、木骨石造に変わりました。木骨石造とは、どのような構造をいうのでしょうか。", "a": "2"}, {"exam": 5, "no": 54, "sub": "", "q": "小樽市内に木骨石造の建物が多い理由で、間違っているのはどれでしょうか。", "a": "2"}, {"exam": 5, "no": 55, "sub": "", "q": "次に示す3つの建物は、設計に工部大学校造家科（現、東京大学工学部建築学科の前身）の第一期卒業生が関与しました。A）旧日本郵船小樽支店（色内3丁目、明治39年）B）日本銀行旧小樽支店（色内1丁目、明治45年）C）旧三井銀行小樽支店（色内1丁目、昭和2年）それぞれの建物とその設計者、建築構造の組み合わせで、正しいものはどれでしょうか。", "a": "2"}, {"exam": 5, "no": 57, "sub": "", "q": "大正10年代、旧三菱銀行・旧北海道拓殖銀行・旧第一銀行の各支店は、色内大通と緑山手通の交差点に建てられました。これらの建物の構造は、当時、わが国の主要な建築に採用され始めたものでした。さて、その建築構造は、次のどれでしょうか。", "a": "2"}, {"exam": 5, "no": 59, "sub": "", "q": "入船にある坂牛邸は建築家 フランク・ロイド・ライトに師事した田上義也が設計しました。このライトは東京のある有名ホテルを設計したことでも知られています。そのホテルとは次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 62, "sub": "", "q": "イギリスの田園都市の計画思想にもとづいて設計された小樽市内の地区と関連するものは次のどれでしょうか。", "a": "2"}, {"exam": 5, "no": 85, "sub": "", "q": "次の文章は市内の酒造会社の建物を表したものです。この酒造会社は次のどれでしょうか。明治12年創業で大吟醸「雪中花」でおなじみ。本社社屋は昭和3年建築で市歴史的建造物に指定されています。", "a": "3"}, {"exam": 6, "no": 56, "sub": "", "q": "次に示す3つの建物は、設計に工部大学校造家科（現、東京大学工学部建築学科の前身）の第一期卒業生が関与しました。A）旧日本郵船小樽支店（色内3丁目、明治39年）B）日本銀行旧小樽支店（色内1丁目、明治45年）C）旧三井銀行小樽支店（色内1丁目、昭和2年）それぞれの建物とその設計者、建築構造の組み合わせで、正しいものはどれでしょうか。", "a": "4"}, {"exam": 6, "no": 58, "sub": "", "q": "次の文章は、ある建物に関わった人物の説明しています。建物名はなんでしょうか。この建物の工事を請け負った大虎・加藤忠五郎は、設計の指導を仰ぐため宮内省を訪問し、内匠寮の技師・木子幸三郎に図面を書いてもらいました。", "a": "小樽区公会堂又は小樽市公会堂"}, {"exam": 6, "no": 62, "sub": "", "q": "東京の帝国ホテルを設計したライトに師事した田上義也は昭和を代表するモダンなデザインの住宅を小樽に残しています。見晴町の坂邸(焼失)、富岡の高田邸、ともう一つはどれでしょうか。", "a": "3"}, {"exam": 7, "no": 56, "sub": "", "q": "小樽は工部大学校造家科（現、東京大学工学部建築学科の前身）の第一期卒業生4人の内3人の設計した建物が現在も残る貴重なまちです。その3人とは辰野金吾、曾禰達蔵ともう一人はだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "佐立七次郎"}, {"exam": 7, "no": 57, "sub": "", "q": "次の文章は、ある建物の特長を書いています。この建物の名称は何といいますか。「壁をれんがで造り、玄関ホールと営業室の境に柱を使わない大空間が見所です。柱を取り除いたのは、小屋組みに鉄骨を使用したことで旧来の木造よりも軽量になったからです。」", "a": "日本銀行小樽支店"}, {"exam": 7, "no": 58, "sub": "", "q": "小樽区公会堂（現小樽市公会堂）に関わった人物の組み合わせで正しいのはどれでしょうか。", "a": "3"}, {"exam": 7, "no": 60, "sub": "", "q": "問59の建物は大正13年、中村田辺建築事務所の田辺淳吉が担当し、建てられましたが、田辺は渡欧して感銘を受けた華やかな装飾を小樽で表現しました。ヨーロッパで流行していたこの様式を何というでしょうか。", "a": "アール・ヌーヴォー"}, {"exam": 7, "no": 62, "sub": "", "q": "昭和の住宅建築で、小樽には有名な建築家の住宅が残っています。東京の帝国ホテルを設計したライトに師事したこの建築家は、モダンなデザインで見晴町の坂邸（平成19年焼失）、富岡の高田邸、入船の坂牛邸を設計しました。この建築家の名前は何というでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "田上義也"}, {"exam": 7, "no": 63, "sub": "", "q": "旧三井銀行の説明です。間違っているのはどれでしょうか。", "a": "2"}, {"exam": 7, "no": 80, "sub": "", "q": "小樽の潮見台浄水場管理棟の特長で正しいのはどれでしょうか。", "a": "3"}, {"exam": 8, "no": 60, "sub": "", "q": "次に示す3つの建物それぞれに関係した人物や特長などの組み合わせで、すべて正しいものはどれでしょうか。A）旧日本郵船㈱小樽支店　B）小樽区公会堂（現：小樽市公会堂）　C）小樽市庁舎", "a": "4"}, {"exam": 8, "no": 63, "sub": "", "q": "昭和の住宅建築で、小樽にはフランク・ロイド・ライトに師事した田上義也が設計したモダンな住宅が現在2棟残っています。富岡の高田邸ともう1棟は次のどれでしょうか。", "a": "3"}, {"exam": 8, "no": 64, "sub": "", "q": "（　）内に該当する語句は次のどれでしょうか。桜町ロータリー一帯はイギリスのハワードに端を発する（　）の計画思想に基づいて昭和9年に設計された町といわれています。", "a": "4"}, {"exam": 9, "no": 53, "sub": "", "q": "問52の出来事を契機に市街地の主要な建物の構造は木造から木骨石造へと転換していきました。木骨石造の説明で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 55, "sub": "", "q": "次の建物のなかで、木骨石造ではないものはどれでしょうか。", "a": "2"}, {"exam": 9, "no": 56, "sub": "", "q": "国指定重要文化財の手宮機関車庫は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、後に北海道庁本庁舎（赤れんが庁舎、札幌市中央区）も設計しました。さて、この設計者は誰でしょうか。", "a": "平井晴二郎"}, {"exam": 9, "no": 57, "sub": "", "q": "次の文章は、ある歴史的建造物の特長を書いています。建物名を書きなさい。「本屋は外壁を石で造り、正面玄関を入ると1階は左右に大きな長いカウンターがあり、その向こうには広い営業室、一番奥には金庫室もあります。2階の貴賓室と会議室は華やかなデザインのシャンデリアや特長のある貴重な壁紙で装飾しています。」", "a": "旧日本郵船(株)小樽支店"}, {"exam": 9, "no": 58, "sub": "", "q": "次の4つの中で正しいのはどれでしょうか。", "a": "4"}, {"exam": 9, "no": 61, "sub": "", "q": "旧三井銀行小樽支店の建物の特長で、正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 9, "no": 63, "sub": "", "q": "平成23年5月26日、「小樽市指定歴史的建造物」に新たに3棟が指定されました。旧向井呉服店支店倉庫、旧小堀商店と、あと1棟はどこでしょうか。その建物の設計者は田上義也です。", "a": "坂牛邸"}, {"exam": 9, "no": 87, "sub": "", "q": "次の文章は小樽市内の酒造会社の建物に関連した説明をしています。この酒造会社名を書きなさい。「創業は明治12年。小樽市内の酒造会社としては最も古い。現在の社屋は昭和初期に建てられ、小樽市歴史的建造物に指定されている。魔除けである軒の雷紋がアクセントになっている。」", "a": "山二わたなべ"}, {"exam": 10, "no": 56, "sub": "", "q": "次の文章は、小樽市内のある歴史ある建物の特長を書いています。建物名を書きなさい。「壁をれんがで造り、玄関ホールと営業室の境に柱を使わない大空間が見どころです。これは、小屋組に鉄骨を使用したことで実現しました。工部大学校造家学科1期生の一人の設計です」", "a": "日本銀行旧小樽支店または金融資料館"}, {"exam": 10, "no": 58, "sub": "", "q": "次に示す3つの建物それぞれに関係した人物や特長などの組み合わせで、すべて正しいものは何番でしょうか。A）旧日本郵船㈱小樽支店　B）津古丹稲荷神社　C）旧三井銀行小樽支店", "a": "2"}, {"exam": 10, "no": 61, "sub": "", "q": "旧北海製罐倉庫㈱の建物の特徴で、間違っているのは次のどれでしょうか。", "a": "3"}, {"exam": 10, "no": 62, "sub": "", "q": "東京の帝国ホテルを設計したライトに師事し、小樽では坂牛邸、高田邸などを設計した建築家とは誰でしょうか。", "a": "田上義也"}, {"exam": 11, "no": 56, "sub": "", "q": "小樽市内に木骨石造の建物が多かった理由で、間違っているのはどれでしょうか。", "a": "2"}, {"exam": 11, "no": 58, "sub": "", "q": "次に示す3つの建物は、設計に工部大学校造家科（現、東京大学工学部建築学科の前身）の第一期卒業生が関与しました。A）旧日本郵船小樽支店（色内3丁目、明治39年）B）日本銀行旧小樽支店（色内1丁目、明治45年）C）旧三井銀行小樽支店（色内1丁目、昭和2年）それぞれの建物とその設計者、建築構造の組み合わせで、A・B・Cすべて正しいものは何番でしょうか。", "a": "3"}, {"exam": 11, "no": 62, "sub": "", "q": "旧三井銀行小樽支店の建物の特長で、正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 11, "no": 63, "sub": "", "q": "北海製罐の主要な建物は、いつから、どんな構造で建て始められたのでしょうか。次の組み合わせで正しいのはどれでしょうか。", "a": "3"}, {"exam": 11, "no": 64, "sub": "", "q": "昭和初期の小樽の公共建築は、コンクリートを用いて建てられました。小樽駅（稲穂、昭和9年）と小樽市庁舎（花園2丁目、昭和8年）は、その代表例です。この2つの建物の共通点は、何でしょうか。", "a": "3"}, {"exam": 11, "no": 83, "sub": "", "q": "2013年、市指定歴史的建造物に新たに2棟が指定されました。一つは住ノ江の旧水上歯科医院、もう一つは何という建物でしょうか。現在は「罐友倶楽部」として民間の施設となっています。創建時の名称で書きなさい。", "a": "旧光亭"}, {"exam": 12, "no": 51, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。問50の建設を指導したのは松本荘一郎と（　A　）で、さらにAは札幌の（　B　）の設計もしました。", "a": "平井晴二郎"}, {"exam": 12, "no": 51, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。問50の建設を指導したのは松本荘一郎と（　A　）で、さらにAは札幌の（　B　）の設計もしました。", "a": "北海道庁本庁舎又は赤レンガ庁舎"}, {"exam": 12, "no": 52, "sub": "", "q": "次の文章は、小樽市内の歴史ある建物の特徴を書いています。建物名を書きなさい。「外壁を石で造り（石造）、2階の貴賓室と会議室は華やかなデザインのシャンデリアや壁紙（金唐皮紙）で装飾されています。工部大学校造家学科1期生の一人の設計です」", "a": "旧日本郵船（株）小樽支店"}, {"exam": 12, "no": 54, "sub": "", "q": "次に示す3つの建物と関連した語句の組み合わせで、番号内のA・B・Cすべて正しいものは何番でしょうか。A）日本銀行旧小樽支店　B）小樽区公会堂（現：市公会堂）　C）右近倉庫", "a": "3"}, {"exam": 12, "no": 59, "sub": "", "q": "小樽には昭和の住宅建築で洗練された建物の一つに「坂牛邸」があります。一般公開されている、この住宅を設計したのは次の誰でしょうか。", "a": "3"}, {"exam": 12, "no": 60, "sub": "", "q": "次の文章は小樽市内の昭和の建物の特徴を表しています。この建物名を書きなさい。「外壁に花崗岩を積み、アーチを連続させ、軒を装飾するルネサンスのデザインで統一されています。構造は鉄骨鉄筋コンクリート造りが採用されています。」", "a": "三井銀行小樽支店"}, {"exam": 12, "no": 61, "sub": "", "q": "（　）内に該当する語句は次のどれでしょうか。小樽の桜町ロータリーの一帯はイギリスのハワードに端を発する（　）の計画思想に基づいて昭和9(1934)年に設計された町といわれています。", "a": "1"}, {"exam": 12, "no": 80, "sub": "", "q": "屋根に八つの鯱が載る木骨石造倉庫「旧小樽倉庫」では、平成26(2014)年、29年ぶりに屋根瓦の全面ふき替えが行われました。その瓦の枚数はおよそ何枚でしょうか。", "a": "4"}, {"exam": 12, "no": 84, "sub": "B", "q": "市指定有形文化財、日本銀行旧小樽支店を説明した文章です。（　）内に該当する語句を選びなさい。「現在の建物は（　A　）に完成しました。石造り風の外観は（　B　）の壁にモルタルを塗ったもので、銅葺きの屋根とともに銀行建築にふさわしい建物です。」", "a": "2"}, {"exam": 13, "no": 52, "sub": "", "q": "工部大学校造家学科の第一期卒業生はわずか四人だけでした。その内の三人が関わった建物が小樽に現存しています。この四人の中の一人は次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 53, "sub": "", "q": "次に示す3つの建物の、それぞれの建築構造、建築された年代の組み合わせで、すべて正しいものはどれでしょうか。A）旧日本郵船小樽支店　B）日本銀行旧小樽支店　C）旧三井銀行小樽支店", "a": "2"}, {"exam": 13, "no": 56, "sub": "", "q": "大正10年代、旧三菱銀行・旧北海道拓殖銀行・旧第一銀行の各支店は、色内大通と緑山手通の交差点に当時の最先端の技術で建てられました。これらの建物と設計者（カッコの中）の組み合わせで正しいのは、次のどれでしょうか。", "a": "1"}, {"exam": 13, "no": 59, "sub": "", "q": "入船町にある坂牛邸は建築家ライトに師事した田上義也が設計しました。この田上義也の設計した建物が市内にあります。それは次のどれでしょうか。", "a": "3"}, {"exam": 13, "no": 60, "sub": "", "q": "小樽市庁舎の建物の特長で間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 51, "sub": "", "q": "小樽によく見られる木骨石造の建物の特徴として間違っているのは、次のどれでしょうか。", "a": "2"}, {"exam": 14, "no": 59, "sub": "", "q": "入船町にある坂牛邸は田上義也が設計しました。この建物の説明で間違っているのは次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 61, "sub": "", "q": "昭和初期の小樽の公共建築の代表例として、小樽駅（現ＪＲ小樽駅）と小樽市庁舎（現小樽市庁舎本館）があります。この2つの建物の共通点として正しいのは、次のどれでしょうか。", "a": "3"}, {"exam": 14, "no": 76, "sub": "", "q": "平成28年7月、小樽市指定歴史的建造物に新たに3棟が指定されました。その中で、壁が煉瓦積みで建てられた倉庫は次のどれでしょうか。（創建時の名称です）", "a": "3"}, {"exam": 15, "no": 51, "sub": "", "q": "明治13年から手宮に鉄道施設が建設されました。最初に建てられた建物の特徴は次のどれでしょうか。", "a": "3"}, {"exam": 15, "no": 54, "sub": "", "q": "次の文章は、小樽市内のある歴史ある建物の特長を書いています。建物名を書きなさい。「明治39年の建造物で外壁は石で造り、本屋は正面と左右合せて3つの玄関があり、2階には大きな会議室があります。工部大学校造家学科1期生の一人の設計です」", "a": "旧日本郵船㈱小樽支店"}, {"exam": 15, "no": 57, "sub": "", "q": "次に示す3つの建物それぞれに関係した語句の組み合わせで、A，B，Cすべて正しいものは何番でしょうか。A）旧日本郵船㈱小樽支店　B）小樽市公会堂　C）旧三井銀行小樽支店", "a": "2"}, {"exam": 15, "no": 60, "sub": "", "q": "次の文章は大正期の銀行建築、第一銀行小樽支店の特長を表現しています。（　）には共通の語句が当てはまります。それは何でしょうか。第一銀行は中村田辺建築事務所の田辺淳吉が設計しました。その装飾の特徴はヨーロッパで流行していた曲線を生かす（　）の様式でした。", "a": "アール・ヌーヴォー"}, {"exam": 16, "no": 51, "sub": "", "q": "旧手宮機関車庫（手宮、明治18年）は、国指定重要文化財の機関車庫です。この建物に関係のないのは次のどれでしょうか。", "a": "1"}, {"exam": 16, "no": 52, "sub": "A", "q": "小樽市内の木骨石造の建物で（　）内に該当する建物名を書きなさい。小樽運河沿いにある倉庫で妻面に「ヤマシチ」の印がランドマークとなっている（　A　）は市指定歴史的建造物の第1号です。また旧前掘商店の斜め向かいの（　B　）のうだつには鶴や亀などの見事な彫刻が施されています。", "a": "旧大家倉庫"}, {"exam": 16, "no": 52, "sub": "B", "q": "小樽市内の木骨石造の建物で（　）内に該当する建物名を書きなさい。小樽運河沿いにある倉庫で妻面に「ヤマシチ」の印がランドマークとなっている（　A　）は市指定歴史的建造物の第1号です。また旧前掘商店の斜め向かいの（　B　）のうだつには鶴や亀などの見事な彫刻が施されています。", "a": "旧早川支店"}, {"exam": 16, "no": 53, "sub": "", "q": "次の文章は、小樽市内の歴史ある建物の特徴を書いています。建物名を書きなさい。「外壁を石で造り（石造）、重厚で落ち着いた外観となっています。その1階内部の営業室の照明はエジソン球という今では珍しい電球が大きな空間を演出しています。残念ながら昨年11月から改修工事のため数年は休館となります。」", "a": "旧日本郵船㈱小樽支店"}, {"exam": 16, "no": 55, "sub": "", "q": "次の4つの中で正しいのはどれでしょうか。", "a": "4"}, {"exam": 16, "no": 57, "sub": "", "q": "次に示す3つ（A．B．C）の建物それぞれに関係した語句の組み合わせで、A．B．Cすべて正しいものは何番でしょうか。A）旧北海道拓殖銀行　B）塚本商店　C）北海製罐第3倉庫", "a": "2"}, {"exam": 16, "no": 58, "sub": "", "q": "次の文章は小樽市内の昭和の建物の特徴を表しています。この建物名を書きなさい。「この建物の大きな特徴は関東大震災後の建設だったので、地震に強い鉄骨鉄筋コンクリート造りが採用されており、名古屋支店、大阪支店でもこの構造が採用されています。この建物は現在、市指定有形文化財になっています。」", "a": "旧三井銀行小樽支店"}, {"exam": 16, "no": 59, "sub": "", "q": "小樽市庁舎の建物の特徴で、間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 16, "no": 60, "sub": "", "q": "ＪＲ小樽駅の建物の特徴で、正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 16, "no": 62, "sub": "", "q": "昭和の住宅建築で、フランク・ロイド・ライトに師事した田上義也が設計したモダンな建物が現在2棟残っています。富岡の高田邸ともう1棟は次のどれでしょうか。", "a": "3"}, {"exam": 16, "no": 76, "sub": "", "q": "次の木骨石造建築のなかで小樽市都市景観賞を受賞しているのはどれでしょうか。＊建物名は現在の名称", "a": "1"}, {"exam": 17, "no": 51, "sub": "", "q": "明治時代の大火を契機に市街地の主要な建物の構造は木造から木骨石造へと転換していきました。木骨石造の説明で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 17, "no": 52, "sub": "", "q": "次の文章に当てはまる小樽市内の木骨石造の建物名を書きなさい。北運河にあるこの建物は、大きな切妻屋根を架けた本体の前面に2棟の角屋が突き出る変わった形をしています。運河側から向かって右手が一番古く明治25年頃に建てられた棟。その後左棟を並べて建て、次いで2棟をあわせた大屋根を架けて、今の姿になったといわれます。", "a": "渋澤倉庫"}, {"exam": 17, "no": 55, "sub": "", "q": "次の4つの中で正しいのはどれでしょうか。", "a": "3"}, {"exam": 17, "no": 57, "sub": "", "q": "次に示す3つの建物（A，B，C）それぞれに関係した人物や特長などの組み合わせで、A，B，Cすべて正しいものはどれでしょうか。A）旧三井銀行小樽支店　B）小樽市公会堂　C）小樽市庁舎", "a": "4"}, {"exam": 17, "no": 60, "sub": "", "q": "第一銀行の建物の特徴で、正しいのは次のどれでしょうか。", "a": "2"}, {"exam": 17, "no": 61, "sub": "", "q": "小樽市指定歴史的建造物で、これまで指定された物件の状況で正しいのは次のどれでしょうか。（令和元年12月現在）", "a": "4"}, {"exam": 18, "no": 30, "sub": "", "q": "次の文章に該当する建物の現在名を書きなさい。「大正元年建築の木造2階建。小豆将軍、豆成金といわれた高橋直治が自邸として建設しました。大正15年直治没後に、ある人物が自邸として改築した建物です。昭和61年に小樽市に寄贈され平成3年に小樽市指定歴史的建造物となっています。庭園は、斜面を三段に地割りし、上段には和室に面して池を配した日本庭園があり、中段には洋間に六角雪見灯籠を配し、下段では小樽港を見下ろすことができます。」", "a": "旧寿原邸"}, {"exam": 18, "no": 57, "sub": "", "q": "次に示す3つの建物と関連した語句の組み合わせで、番号内のA・B・Cすべて正しいものは何番でしょうか。A）旧三井銀行小樽支店　B）旧北海道拓殖銀行小樽支店　C）旧大家倉庫", "a": "1"}, {"exam": 18, "no": 59, "sub": "", "q": "北海製罐第三倉庫の特徴で、間違っているのは次のどれでしょうか。", "a": "1"}, {"exam": 18, "no": 63, "sub": "", "q": "2020（令和2）年度小樽市功労者・産業経済部門に選出・表彰されたのは、小樽を硝子のまちとして発展させた先駆者として、また歴史的建造物をいち早く再生活用した方です。その人物名を書きなさい。姓・名両方を書きなさい。（姓のみ不可）", "a": "浅原健蔵"}, {"exam": 19, "no": 52, "sub": "", "q": "次の文章に当てはまる小樽市内の木骨石造の建物名（旧名）を書きなさい。「明治38(1905)年建築で、現在は雑貨の店として営業しています。大きな特徴は袖壁に鶴や亀などがデザインされており観光客も興味深く眺める建物です。すぐ近くにはレンガ造りの旧磯野商店もあります」", "a": "旧早川支店"}, {"exam": 19, "no": 53, "sub": "A", "q": "（　）内に該当する語句を記入しなさい。鉄道の建造物にれんがを使う計画は明治16（1883）年に始まります。その目的は（　A　）から守るためでした。更にこの材質で入船の陸橋と手宮の倉庫、さらに現在、国指定重要文化財になっている（　B　）を建設しました。", "a": "火災"}, {"exam": 19, "no": 53, "sub": "B", "q": "（　）内に該当する語句を記入しなさい。鉄道の建造物にれんがを使う計画は明治16（1883）年に始まります。その目的は（　A　）から守るためでした。更にこの材質で入船の陸橋と手宮の倉庫、さらに現在、国指定重要文化財になっている（　B　）を建設しました。", "a": "機関車庫"}, {"exam": 19, "no": 54, "sub": "", "q": "問53の（B）の建設には平井晴二郎ともう一人が関わっていました。それは次のどれでしょうか。", "a": "4"}, {"exam": 19, "no": 55, "sub": "", "q": "次の文章は、小樽市内の歴史ある建物の特徴を書いています。建物名を書きなさい。「壁をレンガで造り、玄関ホールと営業室の境に柱を使わない大空間が見どころです。柱を取り除いたのは、小屋組みに鉄骨を使用したことで旧来の木造よりも軽量になったためです。浅草通りに面したこの建物は現在、一般公開しています」", "a": "日本銀行旧小樽支店または金融資料館"}, {"exam": 19, "no": 57, "sub": "", "q": "次に示す3つの建物と関連した語句の組み合わせで、番号内のA・B・Cすべて正しいものは何番でしょうか。A）小樽市庁舎（本館）　B）旧三井物産小樽支店　C）旧小樽倉庫", "a": "2"}, {"exam": 19, "no": 61, "sub": "", "q": "大正期末から昭和にかけて、住宅においても洗練された建築が出てきました。その代表的な住宅として小樽市指定歴史的建造物に指定されている入船町の坂牛邸です。設計はアメリカ人建築家に師事した日本の建築家でした。その建築家とは次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 63, "sub": "", "q": "小樽市内にはイギリスのハワードに端を発する田園都市の計画思想に基づいて昭和9年に設計された町（地区）があります。それは次のどれでしょうか。", "a": "3"}, {"exam": 19, "no": 81, "sub": "", "q": "小樽運河に面した大きな木骨石造倉庫をニトリホールディングスが取得し「小樽芸術村」の4館目の施設として令和4（2022）年に美術館に改装する予定になっています。その倉庫名は何というでしょうか。（建築時名）", "a": "旧浪華倉庫"}, {"exam": 19, "no": 90, "sub": "", "q": "令和3(2021)年9月、小樽市教育委員会より新たな小樽市指定文化財が3件発表されました。いずれも小樽市総合博物館所蔵です。「稲垣益穂日誌」「花園公園設計図」ともう一つは何でしょうか。", "a": "西川家文書"}, {"exam": 20, "no": 55, "sub": "", "q": "現在、国指定重要文化財の旧日本郵船㈱小樽支店は修復中ですが、この建物の説明として間違っているのはどれでしょうか。", "a": "4"}, {"exam": 20, "no": 57, "sub": "", "q": "次に示す3つの建物と関連した語句の組み合わせで、番号内のA・B・Cすべて正しいものは何番でしょうか。A）旧三菱銀行小樽支店　B）旧北海道拓殖銀行小樽支店　C）旧第一銀行小樽支店", "a": "1"}, {"exam": 20, "no": 60, "sub": "", "q": "次の文章に該当する建物名はどれでしょうか。（建物名は現在名）昭和8(1933)年建築のこの建物は正面玄関を挟んで左右を相称にして中央を高めに設計されています。玄関を入ると、正面の階段室には鳳凰と幾何学模様を組み合わせたステンドグラスがあります。", "a": "2"}, {"exam": 20, "no": 61, "sub": "", "q": "旧安田銀行小樽支店の特長として間違っているのは次のどれでしょうか。", "a": "4"}, {"exam": 20, "no": 62, "sub": "A", "q": "文中の（　）内に該当する語句を書きなさい。小樽市内の山の手小学校入口の向いにある（　A　）は建築家ライトに師事した（　B　）が設計しました。富岡にある高田邸もこの（　B　）が設計した建物です。", "a": "坂牛邸"}, {"exam": 20, "no": 62, "sub": "B", "q": "文中の（　）内に該当する語句を書きなさい。小樽市内の山の手小学校入口の向いにある（　A　）は建築家ライトに師事した（　B　）が設計しました。富岡にある高田邸もこの（　B　）が設計した建物です。", "a": "田上義也"}, {"exam": 20, "no": 90, "sub": "", "q": "令和4(2022)年11月、小樽市の歴史的建造物第75号に指定されている建物を国の登録有形文化財に登録するよう、文部科学大臣へ答申がありました。登録が正式決定となると、小樽市の国の登録有形文化財は「JR小樽駅」「旧青山家別邸」とあわせて、3件になる見込みです。この今回答申した建物の名称を書きなさい。", "a": "旧猪俣邸または銀鱗荘"}, {"exam": 21, "no": 54, "sub": "", "q": "小樽市内の木骨石造の建物です。該当する建物名（建築時名）を書きなさい。旧小樽倉庫の裏側に位置し、色内通りに面した建物で防火のための袖壁があります。袖壁には鶴や亀などの見事な彫刻が施されています。", "a": "早川支店"}, {"exam": 21, "no": 57, "sub": "", "q": "次に示す3つの建物と関連した語句の組み合わせで、番号内のA・B・Cすべて正しいものは何番でしょうか。A）旧日本郵船㈱小樽支店　B）旧三井銀行小樽支店　C）旧小樽区公会堂", "a": "4"}, {"exam": 21, "no": 60, "sub": "", "q": "次の文章は小樽市内の昭和の建物の特徴を表しています。この建物名（建築時名）を書きなさい。「この建物の大きな特徴は関東大震災後の建設だったので、地震に強い鉄骨鉄筋コンクリート造りが採用されており、名古屋支店、大阪支店でもこの構造が採用されています。この建物は現在、国指定重要文化財となっており、民間企業が再生活用しています。」", "a": "三井銀行小樽支店"}, {"exam": 21, "no": 63, "sub": "", "q": "小樽市指定歴史的建造物は、これまで85棟指定されています。その内、現在も指定されている物件の数は次のどれでしょうか。（令和5年12月現在）", "a": "2"}, {"exam": 21, "no": 86, "sub": "", "q": "小樽で唯一の酒蔵、田中酒造は本店と亀甲蔵の両店とも小樽市指定歴史的建造物に指定されています。信香町の亀甲蔵の建築時の名称は何というでしょうか。", "a": "岡崎倉庫"}, {"exam": 21, "no": 90, "sub": "A", "q": "小樽にある国登録有形文化財（建造物）ＪＲ小樽駅の説明です。（　）内に該当する番号を書きなさい。「現在の駅舎は昭和（　A　）に建てられた鉄筋コンクリート造。吹き抜けの中央のホールは前後の高窓から自然光を入れ、ガラスが張られた天井からはシャンデリアのように電灯で照らす明るい室内を設計している。また、外観は（　B　）をモデルにしており、昭和期の鉄筋コンクリート造の近代駅舎として貴重です。」", "a": "1"}, {"exam": 21, "no": 90, "sub": "B", "q": "小樽にある国登録有形文化財（建造物）ＪＲ小樽駅の説明です。（　）内に該当する番号を書きなさい。「現在の駅舎は昭和（　A　）に建てられた鉄筋コンクリート造。吹き抜けの中央のホールは前後の高窓から自然光を入れ、ガラスが張られた天井からはシャンデリアのように電灯で照らす明るい室内を設計している。また、外観は（　B　）をモデルにしており、昭和期の鉄筋コンクリート造の近代駅舎として貴重です。」", "a": "3"}, {"exam": 22, "no": 52, "sub": "", "q": "明治37（1904）年の大火を契機に市街地の主要な建物の構造は木造から木骨石造へと転換していきました。木骨石造の説明で正しいのは次のどれでしょうか。", "a": "3"}, {"exam": 22, "no": 57, "sub": "", "q": "次の4つの明治期の建物で、正しい内容はどれでしょうか。", "a": "4"}, {"exam": 22, "no": 59, "sub": "", "q": "次の3つ（A，B，C）は工部大学校造家学科の第一期卒業生に関係した建物です。それぞれに関係した語句の組み合わせで、A，B，Cすべて正しいものはどれでしょうか。（建物名は建築時）A）日本郵船㈱小樽支店　B）日本銀行小樽支店　C）三井銀行小樽支店", "a": "4"}, {"exam": 22, "no": 61, "sub": "", "q": "旧北海道拓殖銀行小樽支店の説明で、間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 22, "no": 63, "sub": "", "q": "ＪＲ小樽駅の建物の特徴で、間違っているのは次のどれでしょうか。", "a": "2"}, {"exam": 23, "no": 53, "sub": "", "q": "明治37(1904)年の稲穂の大火を契機に市街地の主要な建物は木骨石造へ一気に転換しました。色内にある木骨石造の旧早川支店には防火対策として建物正面左側にあるものが設置されています。そこには鯉や亀などの彫刻がほどこされています。この設置されているものは何というでしょうか。", "a": "うだつ又は袖壁"}, {"exam": 23, "no": 56, "sub": "", "q": "令和7(2025)年4月、旧日本郵船株式会社小樽支店が修復工事を終え再公開されました。次のなかで、この建物に関する説明で間違っているのはどれでしょうか。", "a": "3"}, {"exam": 23, "no": 63, "sub": "", "q": "（ ）内に該当する語句は次のどれでしょうか。小樽の桜町ロータリーの一帯はイギリスのハワードに端を発する（ ）の計画思想に基づいて昭和9年に設計された町といわれています。", "a": "3"}, {"exam": 23, "no": 89, "sub": "", "q": "市指定有形文化財の日本銀行旧小樽支店の説明で間違っているのは次のどれでしょうか。", "a": "4"}], "文化・芸術": [{"exam": 1, "no": 22, "sub": "", "q": "現在の小樽オルゴール堂は明治45年に共成株式会社として建てられましたが、共成は明治24年に設立され、東京以北最大の精米会社として発展しましたが、その始祖は誰ですか。", "a": "2"}, {"exam": 1, "no": 65, "sub": "", "q": "小樽寿司屋通りの誕生をみる昭和62(1987)年には、妙見川沿いに5店舗くらいしかなかった寿司屋さんが、現在の妙見川沿いにはどのくらいになっていますか。", "a": "2"}, {"exam": 1, "no": 67, "sub": "", "q": "小樽の土産物の代表の一つになっている硝子製品で、小樽でつくられていないのはどれですか。", "a": "4"}, {"exam": 1, "no": 68, "sub": "", "q": "小樽では札幌とともに黎明期の北海道美術界で重要な美術運動がおこりました。夏休みで帰省していた東京美術学校（現東京芸術大学）在学中の、長谷川昇、小寺健吉、工藤三郎の3人によって設立された明治期の美術団体は、次のどれでしょう。", "a": "3"}, {"exam": 1, "no": 69, "sub": "", "q": "小樽市在住で国際的にも高い評価を受けている版画家、一原有徳は、少年期に小樽に移住し、小樽地方貯金局に勤務しながら、版画制作をはじめました。彼が勤務した小樽地方貯金局は、現在何に使用されていますか。", "a": "1"}, {"exam": 1, "no": 70, "sub": "", "q": "戦前、小樽に重要な版画家が二人かかわっていました。ひとりは棟方志功（むなかたしこう）ですが、もうひとり世界的に著名な版画界の巨匠で、東北から移住し小樽に10年間住み続け、戦後の版画ブームの火付け役となった版画家は次の誰でしょう。", "a": "2"}, {"exam": 1, "no": 71, "sub": "", "q": "市立小樽美術館の1階に記念ホールが併設されている美術家は誰でしょう。", "a": "1"}, {"exam": 1, "no": 72, "sub": "", "q": "石川啄木が小樽で勤めた新聞社の名前は。", "a": "1"}, {"exam": 1, "no": 73, "sub": "", "q": "石川啄木の「かなしきは小樽の町よ／歌ふことなき人々の／声の荒さよ」という短歌が収められた歌集の名前は。", "a": "1"}, {"exam": 1, "no": 75, "sub": "", "q": "伊藤整の最初の著書の題名は。", "a": "3"}, {"exam": 2, "no": 65, "sub": "", "q": "かつてオタモイ海岸の断崖絶壁に龍宮閣を建てたのは、小樽の寿司店の加藤秋太郎でした。その寿司店は何という名前だったでしょうか。", "a": "2"}, {"exam": 2, "no": 66, "sub": "", "q": "小樽の土産物の一つになっているオルゴールですが、語源はオランダ語のオルゲルから転化したものといわれています。オルゴールが日本に入ってきた当時、オルゴールに何という日本字をあてていたでしょうか。", "a": "3"}, {"exam": 2, "no": 67, "sub": "", "q": "明治33年に設立され、道内の硝子器製造業界の草分けで漁業用浮玉工場として、また雪あかりの路に使われた浮玉を製造したのは何という会社だったでしょうか。「＜　　＞硝子製造所」", "a": "浅原硝子製造所"}, {"exam": 2, "no": 69, "sub": "", "q": "風景画家、中村善策が所属し、その弟子、後輩の多くが目指した中央の写実を信条とする美術団体はどれでしょうか。", "a": "4"}, {"exam": 2, "no": 70, "sub": "", "q": "版画家　一原有徳が偶然修得した技法で、その作風を特徴づける独特の技法とは次のどれでしょうか。", "a": "2"}, {"exam": 2, "no": 71, "sub": "", "q": "木版画家　河野薫が生涯をつらぬくモチーフとして表現した人物像のモデルとなったのは、家族のうち次の誰を描いたものだったでしょうか。", "a": "2"}, {"exam": 2, "no": 72, "sub": "", "q": "石川啄木が小樽で勤めた新聞社の名前は何といいますか。", "a": "小樽日報社"}, {"exam": 2, "no": 74, "sub": "", "q": "昭和12年、伊藤整は小樽を舞台にした小説を発表し、高く評価されました。その題名は何といいますか。", "a": "1"}, {"exam": 2, "no": 75, "sub": "", "q": "旭展望台に建つ小林多喜二文学碑の全体の形は、あるものをかたどっています。それは何でしょうか。", "a": "1"}, {"exam": 3, "no": 30, "sub": "", "q": "明治の北海道では稲作の様々な試みはありましたが、米を安定供給できるような時代ではありませんでした。商業で発達した小樽でしたが、玄米で内地から運んで小樽で精米して全道に卸す精米業の共成（株）が発展しました。それは現在のオルゴール堂の建物を明治45年に建てた会社ですが、その創始者は誰ですか。雨竜郡のある地名にもなっています。", "a": "3"}, {"exam": 3, "no": 63, "sub": "", "q": "景勝地オタモイ海岸の断崖絶壁に蛇の目寿司の加藤秋太郎は絶景を楽しむ料亭を建てました。昭和9年に完成し、その後昭和27年に焼失したこの建物は何といいますか。", "a": "龍宮閣"}, {"exam": 3, "no": 66, "sub": "", "q": "オルゴールは今から200年以上前、スイスのジュネーブで時計職人アントワーヌ・ファーブルによって世に出されたのがはじまりといわれています。この時のオルゴールはどのようなタイプですか。", "a": "3"}, {"exam": 3, "no": 67, "sub": "", "q": "日本の硝子は外国人技師により長崎で天正3(1575)年に製造されました。この外国人はどこの国の人ですか。", "a": "3"}, {"exam": 3, "no": 69, "sub": "", "q": "札幌、函館、旭川などの北海道各地で行われていた美術グループをまとめる原動力となり、やがて北海道全域にわたる公募展「道展」設立のきっかけとなった小樽の公募展は次のどれですか。", "a": "2"}, {"exam": 3, "no": 70, "sub": "", "q": "中村善策が毎年のように小樽に帰省し宿泊した場所で、野外写生に出かける足がかりとした所はどこですか。", "a": "3"}, {"exam": 3, "no": 71, "sub": "", "q": "中村善策の系譜をつぐ風景画家で、現在も小樽在住で活躍している画家といえば小川清と、もうひとりは誰ですか。", "a": "3"}, {"exam": 3, "no": 72, "sub": "", "q": "石川啄木は明治40年、創立したばかりの小樽日報社で記者として活躍します。このころ、同僚には、童謡「赤い靴」や流行歌「船頭小唄」で知られる人物がいました。その人物とは誰ですか。", "a": "野口雨情"}, {"exam": 3, "no": 73, "sub": "", "q": "石川啄木の「かなしきは小樽の町よ／歌ふことなき人人の／声の荒さよ」の歌碑がある所はどこですか。", "a": "3"}, {"exam": 3, "no": 74, "sub": "", "q": "「私は浪の音を守唄にして眠る／騒がしく絶間なく／繰り返して語る灰色の年老いた浪‥‥‥」この詩が刻まれている文学碑は海を見下ろす丘の上にあります。この作家は誰ですか。", "a": "2"}, {"exam": 4, "no": 65, "sub": "", "q": "オルゴールの歴史はシリンダー型のオルゴールからはじまりました。スイスのジュネーブで時計職人アントワーヌ・ファーヴルによって世に出されたのがはじまりといわれていますが、それはいつ頃だったでしょうか。", "a": "2"}, {"exam": 4, "no": 66, "sub": "", "q": "明治34年に設立された浅原硝子は道内の硝子器製造業界の草分けですが、製造していた製品で有名なものは何でしょうか。", "a": "浮玉"}, {"exam": 4, "no": 67, "sub": "", "q": "大正・昭和初期に三浦鮮治と兼平英示が中心となり活発な美術運動を展開します。その美術団体は何といいますか。", "a": "小樽洋画研究所"}, {"exam": 4, "no": 68, "sub": "", "q": "次の4枚の絵画の内、中村善策の作品は何番でしょうか。", "a": "4"}, {"exam": 4, "no": 69, "sub": "", "q": "戦前、小樽に重要な版画家が二人かかわっていました。ひとりは棟方志功ですが、もうひとり世界的に著名な版画界の巨匠で、東北から移住し小樽に10年間住み続け、戦後の版画ブームの火付け役となった版画家は次の誰でしょうか。", "a": "1"}, {"exam": 4, "no": 70, "sub": "", "q": "小樽在住で国際的にも高い評価を受けている版画家です。モノタイプ版画で注目を浴びました。この版画家は誰でしょうか。", "a": "4"}, {"exam": 4, "no": 71, "sub": "", "q": "石川啄木の「かなしきは小樽の町よ／歌ふことなき人々の／声の荒さよ」という短歌が収められた、明治43年出版された歌集の名前は何といいますか。", "a": "一握の砂"}, {"exam": 4, "no": 75, "sub": "", "q": "伊藤整の著書でないものはどれでしょうか。", "a": "2"}, {"exam": 5, "no": 61, "sub": "", "q": "景勝地オタモイ海岸の断崖絶壁に蛇の目寿司の加藤秋太郎は絶景を楽しむ料亭を建てました。昭和9年に完成し、その後昭和27年に焼失したこの建物は次のどれでしょうか。", "a": "4"}, {"exam": 5, "no": 64, "sub": "", "q": "オルゴールの語源はオランダ語のオルゲルから転化したものといわれています。オルゴールが日本に入ってきた当時、オルゴールにあてていた日本字は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 66, "sub": "", "q": "風景画家、中村善策は同じ写生地を執拗に数十回も訪れ、その風景を消化し、構図を練り上げ、色彩を輝かせて風景まるごとの生命力をとらえました。この中村善策の制作に対するとりくみは何と呼ばれたでしょうか。", "a": "4"}, {"exam": 5, "no": 67, "sub": "", "q": "中村善策は生前から小樽市に作品を寄贈し、かつては市民会館で公開されていましたが、市立小樽美術館が開館した昭和54年に作品が移管され、美術館の1階に展示場ができました。この展示場の名称は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 68, "sub": "", "q": "少年期に小樽に移住し、小樽地方貯金局に勤務しながら版画制作をはじめた、小樽在住で国際的にも評価の高い版画家といえばだれでしょうか。", "a": "一原有徳"}, {"exam": 5, "no": 69, "sub": "", "q": "小林多喜二の名前を一躍有名にした第1作目の題名は次のどれでしょうか。", "a": "3"}, {"exam": 5, "no": 70, "sub": "", "q": "伊藤整は明治38年、松前郡に生まれました。まもなく小樽近郊の塩谷村に移住後、小樽中学校に入学しました。この中学校は現在、次のどれでしょうか。", "a": "1"}, {"exam": 6, "no": 39, "sub": "", "q": "廣井勇と同期生で終生の友であった人物は誰でしょうか。", "a": "4"}, {"exam": 6, "no": 66, "sub": "", "q": "明治34年に設立され、道内の硝子器製造業界の草分けで漁業用浮玉工場として、また雪あかりの路に使われた浮玉を製造したのは何という会社でしょうか。", "a": "浅原硝子製造所"}, {"exam": 6, "no": 68, "sub": "", "q": "明治期の美術団体「羊蹄画会」は明治40年夏休みで帰省していた東京美術学校在学中の3人によって設立されました。長谷川昇、小寺健吉、もう一人はだれでしょうか。", "a": "4"}, {"exam": 6, "no": 69, "sub": "", "q": "小樽を代表する画家で「現場主義」をつらぬきました。「海港の秋」「けむり」などの作品があります。この画家の名前は何というでしょうか。", "a": "中村善策"}, {"exam": 6, "no": 70, "sub": "", "q": "小樽在住で国際的にも高い評価を受けている版画家です。小樽地方郵便局に勤務しながら版画制作をはじめました。モノタイプ版画で注目を浴びた、この版画家は誰でしょうか。", "a": "1"}, {"exam": 6, "no": 71, "sub": "", "q": "石川啄木は明治40年、創立したばかりの小樽日報社に入社し、記者として活躍します。この頃の同僚の名前は何というでしょうか。「赤い靴」「船頭小唄」で知られた人物です。", "a": "野口雨情"}, {"exam": 6, "no": 72, "sub": "", "q": "伊藤整の作品ではないのは次のどれでしょうか。", "a": "1"}, {"exam": 6, "no": 73, "sub": "", "q": "ある作家の碑文です。この文学碑がある場所はどこでしょうか。「冬が近くなると　ぼくはそのなつかしい　国のことを考えて　深い感動に捉えられ・・」", "a": "3"}, {"exam": 6, "no": 74, "sub": "", "q": "次の説明文はだれの句碑でしょうか。小樽3大祭りのひとつの神社境内にその句碑はあります。そこには「人間を掴めば風が手にのこり」と刻まれております。", "a": "3"}, {"exam": 7, "no": 68, "sub": "", "q": "小樽は札幌とともに黎明期の北海道美術界で重要な美術運動がおこりました。夏休みで帰省していた東京美術学校（現東京芸術大学）在学中の、長谷川昇、小寺健吉、工藤三郎の3人によって設立された明治期の美術団体は、次のどれでしょうか。", "a": "3"}, {"exam": 7, "no": 70, "sub": "", "q": "小樽在住で現在も活躍している画家、小川清、冨澤謙はある画家の系譜に属しています。「現場主義」で知られる、その画家とはだれでしょうか。姓・名両方を書きなさい。（姓のみ不可）", "a": "中村善策"}, {"exam": 7, "no": 71, "sub": "", "q": "石川啄木が最初に小樽を訪れたのは、何年のことだったでしょうか。", "a": "3"}, {"exam": 7, "no": 72, "sub": "", "q": "石川啄木の「かなしきは小樽の町よ／歌ふことなき人人の／声の荒さよ」という短歌が収められた歌集の名前は何というでしょうか。", "a": "1"}, {"exam": 8, "no": 66, "sub": "", "q": "明治34年に設立され、道内の硝子器製造業界の草分けで漁業用浮玉工場として、また雪あかりの路に使われた浮玉として知られています。この会社名は何というでしょうか。", "a": "浅原硝子製造所"}, {"exam": 8, "no": 67, "sub": "", "q": "日本での硝子の始まりはオランダ人技師により天正3（1575）年に製造されました。日本のどこで製造されたのでしょうか。", "a": "2"}, {"exam": 8, "no": 68, "sub": "", "q": "中村善策は同じ写生地を執拗に数十回も訪れ、その風景を消化し、構図を練り上げ、色彩を輝かせて風景まるごとの生命力をとらえました。この中村善策の制作に対する取り組みは何と呼ばれたでしょうか。", "a": "3"}, {"exam": 8, "no": 69, "sub": "", "q": "一原有徳は少年期に小樽に移住し、小樽地方貯金局に勤務しながら版画制作をはじめ、独特の手法で一躍注目を浴びました。その手法は何というでしょうか。", "a": "モノタイプ"}, {"exam": 8, "no": 70, "sub": "", "q": "戦前、小樽には重要な版画家が二人かかわっていました。ひとりは斎藤清ですが、もうひとりは世界的に著名な版画界の巨匠で、ともに東北出身でした。戦後の版画ブームの火付け役となった版画家とは次のどれでしょうか。", "a": "1"}, {"exam": 8, "no": 71, "sub": "", "q": "石川啄木の有名な歌です。（　）内に該当する語句は、次のどれでしょうか。「かなしきは小樽の町よ／（　）ことなき人々の／声の荒さよ」", "a": "3"}, {"exam": 8, "no": 73, "sub": "", "q": "小林多喜二が北海道拓殖銀行小樽支店に勤めたあたりからプロレタリア文学作品を書き始めました。その第一作目は次のどれでしょうか。", "a": "3"}, {"exam": 8, "no": 74, "sub": "", "q": "伊藤整は小樽中学校から小樽高商へ進学しました。卒業後の職業は次のどれでしょうか。", "a": "4"}, {"exam": 9, "no": 62, "sub": "", "q": "かつて、景勝地オタモイ海岸の断崖絶壁に蛇の目寿司の加藤秋太郎は絶景を楽しむ料亭を建てました。昭和9年に完成し、その後昭和27年に焼失したこの建物は何といいますか。", "a": "龍宮閣"}, {"exam": 9, "no": 65, "sub": "", "q": "明治34年に設立された浅原硝子は道内の硝子器製造業界の草分けですが、製造していた製品で有名だったものは何でしょうか。", "a": "漁業用浮玉"}, {"exam": 9, "no": 66, "sub": "", "q": "小樽観光を代表する一つがオルゴールですが、その語源はオランダ語のオルゲルから転化したものといわれています。オルゴールが日本に入ってきた当時、オルゴールにあてた漢字は次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 67, "sub": "", "q": "大正6年、三浦鮮治は「小樽洋画研究所」を開きました。この時、助手として指導にあたったのはだれでしょうか。", "a": "1"}, {"exam": 9, "no": 68, "sub": "", "q": "平成23年4月、市立小樽美術館3階に、ある作家の記念ホールができました。その人物とは次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 69, "sub": "", "q": "河野薫とともに小樽を代表する版画家で、ともに成田玉泉の教え子でした。緑小学校の教員として図画工作の指導にあたり、そのかたわら木版の制作にあたりました。大正3年、砂川生まれのこの版画家とは誰でしょうか。", "a": "金子誠治"}, {"exam": 9, "no": 70, "sub": "", "q": "石川啄木が郷里の岩手を離れ、明治40年に創立したばかりの新聞社で記者として活躍します。この新聞社とは、次のどれでしょうか。", "a": "3"}, {"exam": 9, "no": 71, "sub": "", "q": "石川啄木の「かなしきは小樽の町よ/歌うことなき人々の/声の荒さよ」という歌碑がある場所は次のどれでしょうか。", "a": "4"}, {"exam": 9, "no": 72, "sub": "", "q": "小林多喜二の作品は一般的に何と呼ばれているでしょう。次の中から選びなさい。", "a": "3"}, {"exam": 9, "no": 73, "sub": "", "q": "伊藤整は英語の実力を生かし翻訳でも多くの業績を残しました。その代表作とは次のどれでしょうか。", "a": "2"}, {"exam": 10, "no": 33, "sub": "", "q": "明治の北海道は稲作の技術が発達しておらず、米は安定した生産ができませんでした。そこで、玄米を本州から運び小樽で精米し全道に卸す共成（株）という精米業を興しました。現在はメルヘン交差点のオルゴール堂として再生利用されています。この共成（株）の創始者は誰ですか。雨竜郡のある地名にもなっています。姓・名両方を書きなさい。（姓のみ不可）", "a": "沼田喜三郎"}, {"exam": 10, "no": 67, "sub": "", "q": "明治期の美術団体「羊蹄画会」は明治40年、夏休みで帰省していた東京美術学校在学中の3人によって設立されました。長谷川昇、工藤三郎、もう一人はだれでしょうか。", "a": "2"}, {"exam": 10, "no": 68, "sub": "", "q": "小樽を代表する画家で「現場主義」で知られています。「海港の秋」「けむり」などの作品があり、この画家の系譜としては小川清や冨澤謙が現在も活躍中です。この画家の名前は何というでしょうか。", "a": "中村善策"}, {"exam": 10, "no": 69, "sub": "", "q": "国際的にも高い評価を受けた版画家です。小樽地方郵便局に勤務しながら版画制作を
