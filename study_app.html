<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おたる案内人検定 学習アプリ</title>
<style>
:root { color-scheme: light dark; --bg:#fbfbfa; --fg:#1a1a18; --card:#fff;
  --line:#e4e4de; --muted:#6b6b64; --ok:#2f7d5c; --ng:#b4483c; --accent:#7a6a45;
  --chip:#f3eee1; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16161a; --fg:#e8e8e3; --card:#1e1e23; --line:#32323a;
    --muted:#9a9a92; --ok:#5fbf95; --ng:#e08a7e; --accent:#d8c79a; --chip:#33301f; }
}
* { box-sizing: border-box; }
body { margin:0; padding:1.5rem 1rem 5rem; background:var(--bg); color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
main { max-width:46rem; margin:0 auto; }
h1 { font-size:1.15rem; margin:0 0 1rem; display:flex; align-items:baseline;
  gap:.6rem; flex-wrap:wrap; }
h1 small { font-weight:400; font-size:.8rem; color:var(--muted); }
.bar { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1.25rem; }
button { font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); padding:.4rem .8rem; }
button:hover { border-color:var(--accent); }
button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.card { background:var(--card); border:1px solid var(--line); border-radius:11px;
  padding:1.25rem 1.4rem 1.4rem; }
.chip { display:inline-block; font-size:.72rem; font-weight:600; letter-spacing:.04em;
  color:var(--accent); background:var(--chip); border-radius:4px;
  padding:.15rem .5rem; margin-bottom:.7rem; }
.qtext { font-weight:500; margin:0 0 1.1rem; }
.photos { display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem;
  margin-bottom:1rem; }
@media (max-width:30rem) { .photos { grid-template-columns:1fr; } }
.photos .pick { margin:0; padding:.35rem; border:1px solid var(--line);
  border-radius:8px; background:var(--card); cursor:pointer; text-align:left;
  display:block; width:100%; }
.photos .pick:hover { border-color:var(--accent); }
.photos img { width:100%; height:auto; display:block; border-radius:5px; }
.photos figcaption { font-size:.78rem; color:var(--muted); margin-top:.3rem; }
.photos .pick.ok { border-color:var(--ok); border-width:2px;
  background:color-mix(in srgb,var(--ok) 12%,transparent); }
.photos .pick.ng { border-color:var(--ng); border-width:2px;
  background:color-mix(in srgb,var(--ng) 12%,transparent); }
.photos .pick.ok figcaption { color:var(--ok); font-weight:700; }
.choices { display:flex; flex-direction:column; gap:.5rem; }
.choice { text-align:left; padding:.6rem .9rem; display:flex; gap:.6rem; }
.choice .n { font-weight:700; color:var(--muted); flex:0 0 1.2rem; }
.choice.ok { border-color:var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent); }
.choice.ng { border-color:var(--ng); background:color-mix(in srgb,var(--ng) 12%,transparent); }
.reveal { margin-top:1.1rem; padding-top:1rem; border-top:1px solid var(--line);
  font-size:.92rem; }
.reveal b { color:var(--ok); }
.note { font-size:.8rem; color:var(--muted); margin-top:.5rem; }
.selfmark { display:flex; gap:.5rem; margin-top:.9rem; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));
  gap:.7rem; margin-bottom:1.25rem; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:.7rem .9rem; }
.stat .v { font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; }
.stat .k { font-size:.75rem; color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
th,td { text-align:left; padding:.4rem .5rem; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-weight:600; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
.hint { font-size:.78rem; color:var(--muted); margin-top:1rem; }
textarea { font:inherit; width:100%; min-height:4.5rem; padding:.6rem .8rem;
  border:1px solid var(--line); border-radius:7px; background:var(--bg);
  color:var(--fg); resize:vertical; }
.cmp { display:grid; gap:.5rem; margin:.9rem 0; }
.cmp div { padding:.5rem .8rem; border-radius:6px; border:1px solid var(--line); }
.cmp .k { font-size:.75rem; color:var(--muted); display:block; }
.pend { background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:.9rem 1rem; margin-bottom:1.25rem; font-size:.88rem; }
.pend h2 { font-size:.9rem; margin:0 0 .6rem; }
.pend ul { list-style:none; margin:0 0 .7rem; padding:0; }
.pend li { display:flex; gap:.5rem; align-items:center; padding:.3rem 0;
  border-bottom:1px solid var(--line); }
.pend li span { flex:1; }
.pend li button { padding:.2rem .55rem; font-size:.8rem; }
.empty { color:var(--muted); }
</style></head><body><main>
<h1>おたる案内人検定 学習アプリ

</div>
<div class="bar" id="exams"></div>

<p class="hint">キーボード: 1〜4 で選択 / Enter で次へ。

</main>
<script>const QUESTIONS = [{"id": "R01-Q001", "exam": 1, "no": 1, "sub": "", "type": "選択", "q": "小樽に集落が形成されるころ、嘉永6（1853）年の黒船来航により日本は大きく変化していきましたが、世界の背景にはどのような出来事があったのでしょうか。", "choices": ["エネルギー革命", "産業革命", "IT革命", "宗教革命"], "a": "2", "abody": "産業革命", "photos": [], "note": ""}, {"id": "R01-Q002", "exam": 1, "no": 2, "sub": "", "type": "選択", "q": "明治から昭和の初期にかけて北海道には全国が欲しがる代表的な2つの資源がありました。それは次の組み合わせのうちどれですか。", "choices": ["鰊と木材", "石炭と銅", "鰊と綿花", "鰊と石炭"], "a": "4", "abody": "鰊と石炭", "photos": [], "note": ""}, {"id": "R01-Q003", "exam": 1, "no": 3, "sub": "", "type": "選択", "q": "明治初期に政府は「殖産興業」「富国強兵」という政策を打ち出し、小樽に鉄道を敷くために膨大なお金を投下しますが、その目的の第一はどれですか。", "choices": ["鰊を運ぶため", "石炭を運ぶため", "農産物を運ぶため", "人を運ぶため"], "a": "2", "abody": "石炭を運ぶため", "photos": [], "note": ""}, {"id": "R01-Q004", "exam": 1, "no": 4, "sub": "", "type": "選択", "q": "鰊がお金のような価値を持ったのは何故ですか。", "choices": ["油分が多量に含まれて栄養があったから", "食料不足だったから", "美味しかったから", "農作物の肥料に最適だったから"], "a": "4", "abody": "農作物の肥料に最適だったから", "photos": [], "note": ""}, {"id": "R01-Q005", "exam": 1, "no": 5, "sub": "", "type": "選択", "q": "江戸後期から明治後期くらいまで小樽に来た商人は上り荷（大阪へ運ぶ荷物）に〆粕・昆布・イリコ・ホシアワビなどを積んで船で運びましたが、その船のことを何と呼びますか。", "choices": ["菱垣廻船", "樽廻船", "北前船", "蒸気船"], "a": "3", "abody": "北前船", "photos": [], "note": ""}, {"id": "R01-Q006", "exam": 1, "no": 6, "sub": "", "type": "選択", "q": "手宮〜幌内間の鉄道敷設に直接貢献したお雇い外国人は誰ですか。", "choices": ["クロフォード", "アンチセル", "ケプロン", "ライマン"], "a": "1", "abody": "クロフォード", "photos": [], "note": ""}, {"id": "R01-Q007", "exam": 1, "no": 7, "sub": "", "type": "選択", "q": "明治から昭和初期まで小樽にはどんな都市がつくられてきたでしょうか。", "choices": ["工業港湾都市", "商業観光都市", "芸術文化都市", "商業港湾都市"], "a": "4", "abody": "商業港湾都市", "photos": [], "note": ""}, {"id": "R01-Q008", "exam": 1, "no": 8, "sub": "", "type": "選択", "q": "小樽を含む積丹半島地域の鰊の漁期を以下から選んでください。", "choices": ["10〜12月", "12〜1月", "3〜5月", "5〜6月"], "a": "3", "abody": "3〜5月", "photos": [], "note": ""}, {"id": "R01-Q009", "exam": 1, "no": 9, "sub": "", "type": "選択", "q": "祝津の大漁家だった青山家と茨木家の出身県を以下から選んでください。", "choices": ["青森県", "秋田県", "山形県", "岩手県"], "a": "3", "abody": "山形県", "photos": [], "note": ""}, {"id": "R01-Q010", "exam": 1, "no": 10, "sub": "", "type": "選択", "q": "漁獲高を表す「石」をキログラムで換算すると以下のどれでしょうか。", "choices": ["750キログラム", "700キログラム", "7500キログラム", "375キログラム"], "a": "1", "abody": "750キログラム", "photos": [], "note": ""}, {"id": "R01-Q011", "exam": 1, "no": 11, "sub": "", "type": "選択", "q": "小樽の鰊漁獲高が最高だった年を以下から選んでください。", "choices": ["明治30年", "大正3年", "大正14年", "昭和8年"], "a": "3", "abody": "大正14年", "photos": [], "note": ""}, {"id": "R01-Q012", "exam": 1, "no": 12, "sub": "", "type": "写真選択", "q": "旧近江家番屋の写真を以下の1〜4から選んでください。", "choices": ["［写真1］", "［写真2］", "［写真3］", "［写真4］"], "a": "4", "abody": "［写真4］", "photos": ["images/R01-Q012-1.png", "images/R01-Q012-2.png", "images/R01-Q012-3.png", "images/R01-Q012-4.png"], "note": "選択肢は4枚の写真。images/R01-Q012-1〜4.png と対応"}, {"id": "R01-Q013", "exam": 1, "no": 13, "sub": "", "type": "選択", "q": "小樽の鰊漁家が遠隔地にも漁場を経営できた理由の正しい組み合わせを以下から選んでください。", "choices": ["安定した漁獲と消費地に近かったこと", "魚肥の高い需要と運河の存在", "安定した漁獲と造船技術", "安定した漁獲と魚肥の高い需要"], "a": "4", "abody": "安定した漁獲と魚肥の高い需要", "photos": [], "note": ""}, {"id": "R01-Q014", "exam": 1, "no": 14, "sub": "", "type": "選択", "q": "祝津の鰊御殿がかつてあった場所と所有者の組み合わせを以下から選んでください。", "choices": ["泊村の田中家", "泊村の猪俣家", "余市町の田中家", "余市町の猪俣家"], "a": "1", "abody": "泊村の田中家", "photos": [], "note": ""}, {"id": "R01-Q015", "exam": 1, "no": 15, "sub": "", "type": "選択", "q": "平磯岬にある銀鱗荘がかつてあった場所と所有者の組み合わせを以下から選んでください。", "choices": ["泊村の田中家", "泊村の猪俣家", "余市町の田中家", "余市町の猪俣家"], "a": "4", "abody": "余市町の猪俣家", "photos": [], "note": ""}, {"id": "R01-Q016", "exam": 1, "no": 16, "sub": "", "type": "選択", "q": "オタルナイ場所とタカシマ場所、タカシマ場所とオショロ場所の境界の組み合わせの正しいものを以下から選んでください。", "choices": ["於古発川（妙見川）と山中", "星置と於古発川（妙見川）", "有幌町と茅芝岬", "平磯岬と手宮"], "a": "1", "abody": "於古発川（妙見川）と山中", "photos": [], "note": ""}, {"id": "R01-Q017", "exam": 1, "no": 17, "sub": "", "type": "選択", "q": "沖揚げ音頭をうたう際の独唱の別称を以下から選んでください。", "choices": ["キヤリ", "キリ声", "ハオイ", "シタゴエ"], "a": "3", "abody": "ハオイ", "photos": C）佐立七次郎", "A）佐立七次郎　B）曾禰達蔵　C）辰野金吾"], "a": "2", "abody": "A）佐立七次郎　B）辰野金吾　C）曾禰達蔵", "photos": [], "note": ""}, {"id": "R01-Q057", "exam": 1, "no": 57, "sub": "", "type": "選択", "q": "日本銀行旧小樽支店（色内1丁目、明治45年）は、玄関ホール（客溜）と営業室の境に柱をたてない構造になっています。その理由として最もふさわしいものは、どれでしょうか。", "choices": ["壁に鉄骨を使用している。", "小屋組に木を使用している。", "小屋組に鉄骨を使用している。", "屋根に瓦（かわら）を使用している。"], "a": "3", "abody": "小屋組に鉄骨を使用している。", "photos": [], "note": ""}, {"id": "R01-Q058", "exam": 1, "no": 58, "sub": "", "type": "選択", "q": "旧小樽区公会堂（現・市公会堂、花園5丁目、明治44年）は、皇太子を迎えるために和風の建築様式で建てられました。新築工事は、次に示す3人が関わり進められました。A）藤山要吉　B）木子幸三郎（きこうさぶろう）　C）加藤忠五郎　それぞれの名前と工事の関わりの組み合わせで、正しいものはどれでしょうか。", "choices": ["A）寄贈者　B）基本設計を指示した技師　C）工事の請負人", "A）寄贈者　B）工事の請負人　C）基本設計を指示した技師", "A）工事の請負人　B）敷地を選定した庭師　C）基本設計を指示した技師", "A）基本設計を指示した技師　B）敷地を選定した庭師　C）寄贈者"], "a": "1", "abody": "A）寄贈者　B）基本設計を指示した技師　C）工事の請負人", "photos": [], "note": ""}, {"id": "R01-Q059", "exam": 1, "no": 59, "sub": "", "type": "選択", "q": "大正10年代、旧三菱銀行・旧北海道拓殖銀行・旧第一銀行の各支店は、色内大通と緑山手通の交差点に建てられました。これらの建物の構造は、当時、わが国の主要な建築に採用され始めたものでした。さて、その建築構造は、何と呼ばれているでしょうか。", "choices": ["木骨石造（もっこつせきぞう）", "鉄筋コンクリート造", "れんが造", "石造"], "a": "2", "abody": "鉄筋コンクリート造", "photos": [], "note": ""}, {"id": "R01-Q060", "exam": 1, "no": 60, "sub": "", "type": "選択", "q": "大正末から昭和初期にかけて、小樽市内に建築家が設計した住宅が建てられるようになりました。その一人は、フランク・ロイド・ライト（アメリカの建築家）に師事し、坂邸（見晴町、昭和2年）や坂牛邸（入船、昭和3年）をライト風のデザインで設計しました。その建築家は、誰でしょうか。", "choices": ["加藤忠五郎（かとうちゅうごろう）", "田辺淳吉（たなべじゅんきち）", "長野宇平治（ながのうへいじ）", "田上義也（たのうえよしや）"], "a": "4", "abody": "田上義也（たのうえよしや）", "photos": [], "note": ""}, {"id": "R01-Q061", "exam": 1, "no": 61, "sub": "", "type": "選択", "q": "和光荘（潮見台、大正11年）は、酒造会社の社長の住宅として建てられました。そのデザインの基調は、当時、パリを中心にヨーロッパで流行の兆しが見られた幾何学模様を取り入れています。そのデザインは、何と呼ばれるでしょうか。", "choices": ["バロック", "アール・ヌーヴォー", "インターナショナル・スタイル", "アール・デコ"], "a": "4", "abody": "アール・デコ", "photos": [], "note": ""}, {"id": "R01-Q062", "exam": 1, "no": 62, "sub": "", "type": "選択", "q": "平成4(1992)年に小樽で活躍する職人が「職人業の継承」や「共同研究開発」を目的に設立した組織名は次のどれですか。", "choices": ["小樽職人団", "小樽職人組合", "小樽職人法人", " 小樽のまちを見つめ直す機会を得た多くの人々のエネルギーは、その後のまちづくりに脈々と生き続けていると言えます。そのひとつとして平成16年度の国土交通省大臣表彰「手づくり郷土賞」を受賞したのは次のどれですか。", "choices": ["小樽雪あかりの路", "グラスフェスタ", "小樽味覚祭り", "小樽歴史の祭典"], "a": "１", "abody": "小樽雪あかりの路", "photos": [], "note": ""}, {"id": "R02-Q052", "exam": 2, "no": 52, "sub": "", "type": "選択", "q": "江戸末期から明治10年代にかけて小樽で多くの人々が暮らしていた場所は、今の所在地でいうと、どの辺りになるでしょうか。", "choices": ["勝納川河口の信香町付近", "入船川河口の入船1丁目付近", "於古発川河口の堺町付近", "色内川河口の色内2丁目付近"], "a": "１", "abody": "勝納川河口の信香町付近", "photos": [], "note": ""}, {"id": "R02-Q053", "exam": 2, "no": 53, "sub": "", "type": "記述", "q": "明治37年、現在の稲穂2丁目から出火した火の手は手宮まで及ぶ大火になりました。それを契機に市街地の主要な建物の構造は、防火の工夫を施すものに変わりました。今、この構造の建物は小樽固有の歴史的まちなみを形成する一つの要素になっています。さて、この建物の構造は、何と呼ばれているでしょうか。", "choices": [], "a": "もっこつせきぞう 木骨石造", "abody": "", "photos": [], "note": ""}, {"id": "R02-Q054", "exam": 2, "no": 54, "sub": "", "type": "記述", "q": "旧手宮機関車庫（手宮、明治18年）は、わが国最古のれんが造の機関車庫です。この建物を設計した中心人物は、後に北海道庁本庁舎（赤れんが庁舎、札幌市中央区、明治21年）も設計しました。さて、この設計者は、誰でしょうか。", "choices": [], "a": "ひらいせいじろう 平井晴二郎", "abody": "", "photos": [], "note": ""}, {"id": "R02-Q055", "exam": 2, "no": 55, "sub": "", "type": "選択", "q": "次に示す3つの建物は小樽を代表する洋風建築ですが、それぞれ構造が異なります。1）旧日本郵船小樽支店（色内3丁目、明治39年） 2）日本銀行旧小樽支店（色内1丁目、明治45年） 3）旧三井銀行小樽支店（色内1丁目、昭和2年）　さて、各建物とその構造の組み合わせで、正しいものはどれでしょうか。", "choices": ["1）石造　2）れんが造　3）鉄骨鉄筋コンクリート造", "1）鉄骨鉄筋コンクリート造　2）石造　3）鉄筋コンクリート造", "1）れんが造　2）石造　3）鉄骨鉄筋コンクリート造", "1）石造　2）れんが造　3）鉄筋コンクリート造"], "a": "１", "abody": "1）石造　2）れんが造　3）鉄骨鉄筋コンクリート造", "photos": [], "note": ""}, {"id": "R02-Q056", "exam": 2, "no": 56, "sub": "", "type": "選択", "q": "日本銀行旧小樽支店（色内1丁目、明治45年）は、玄関ホール（客溜）と営業室の境に柱をたてない構造になっています。その理由として最もふさわしいものは、どれでしょうか。", "choices": ["壁に鉄骨を使用している。", "小屋組に木を使用している。", "小屋組に鉄骨を使用している。", "屋根に瓦を使用している。"], "a": "３", "abody": "小屋組に鉄骨を使用している。", "photos": [], "note": ""}, {"id": "R02-Q057", "exam": 2, "no": 57, "sub": "", "type": "選択", "q": "旧小樽区公会堂（現・市公会堂、花園5丁目、明治44年）は、皇太子を迎えるために和風の建築様式で建てられました。新築工事は、次に示す3人が関わり進められました。1）藤山要吉（ふじやまようきち） 2）木子幸三郎（きこうさぶろう） 3）加藤忠五郎（かとうちゅうごろう）　それぞれの名前と工事の関わりの組み合わせで、正しいもの か。", "choices": ["引札", "棟札", "貼札", "荷札"], "a": "1", "abody": "引札", "photos": [], "note": ""}, {"id": "R03-Q026", "exam": 3, "no": 26, "sub": "", "type": "記述", "q": "江戸時代中期から二人の近江商人が鰊を資源とした商いをしていました。オタルナイ場所の岡田弥三右衛門ともう一人オショロ、タカシマ場所を請け負っていたのは誰ですか。", "choices": [], "a": "西川伝右衛門", "abody": "", "photos": [], "note": ""}, {"id": "R03-Q027", "exam": 3, "no": 27, "sub": "", "type": "記述", "q": "金子元三郎は明治24(1891)年に主筆に中江兆民を招き小樽で最初の新聞を発行しました。その新聞名は何といいますか。", "choices": [], "a": "北門新報", "abody": "", "photos": [], "note": ""}, {"id": "R03-Q028", "exam": 3, "no": 28, "sub": "", "type": "選択", "q": "通称「加越能商人」と呼ばれる小樽商人がいました。出身地を指す呼び方ですが、現在の何県ですか。", "choices": ["福井県、新潟県、山形県", "石川県、新潟県、山形県", "石川県、福井県、富山県", "鳥取県、福井県、石川県"], "a": "3", "abody": "石川県、福井県、富山県", "photos": [], "note": ""}, {"id": "R03-Q029", "exam": 3, "no": 29, "sub": "", "type": "選択", "q": "加越能資本による銀行が小樽にもありました。メルヘン交差点の一角にある「銀の鐘」は元、何という銀行名ですか。", "choices": ["十二銀行", "四十七銀行", "中越銀行", "第一銀行"], "a": "3", "abody": "中越銀行", "photos": [], "note": ""}, {"id": "R03-Q030", "exam": 3, "no": 30, "sub": "", "type": "選択", "q": "明治の北海道では稲作の様々な試みはありましたが、米を安定供給できるような時代ではありませんでした。商業で発達した小樽でしたが、玄米で内地から運んで小樽で精米して全道に卸す精米業の共成（株）が発展しました。それは現在のオルゴール堂の建物を明治45年に建てた会社ですが、その創始者は誰ですか。雨竜郡のある地名にもなっています。", "choices": ["藤山要吉", "木村円吉", "沼田喜三郎", "倉橋大介"], "a": "3", "abody": "沼田喜三郎", "photos": [], "note": ""}, {"id": "R03-Q031", "exam": 3, "no": 31, "sub": "", "type": "記述", "q": "大正3年に勃発した第一次大戦時に小豆を買い占めてロンドンの相場を揺るがしたという商人が小樽に多くの倉庫を建設して豆を選別する女工さんをたくさん雇用していました。その倉庫は今でも運河沿いにあり、「海鳴楼」として使われています。この豆成金と呼ばれた商人は誰ですか。", "choices": [], "a": "高橋直治", "abody": "", "photos": [], "note": ""}, {"id": "R03-Q032", "exam": 3, "no": 32, "sub": "", "type": "記述", "q": "小樽商人達はたくさん働いてたくさん遊びもしましたが、旦那衆文化なる粋な文化も残しています。なかでも日本伝統芸能の「能」に精通して、自ら能舞台を自宅に設けて楽しみ、それを市に寄附した商人は誰ですか。", "choices": [], "a": "岡崎謙", "abody": "", "photos": [], "note": ""}, {"id": "R03-Q033", "exam": 3, "no": 33, "sub": "", "type": "選択", "q": "大正9年調査の小樽区土地台帳において所有面積のトップに立った商人は次のどれですか。", "choices": ["板谷宮吉", "藤山要吉", "能島正次郎", "木村圓吉"], "a": "4", "abody": "木村圓吉", "photos": [], "note": ""}, {"id": "R03-Q034", "exam": 3, "no": 34, "sub": "", "type": "記述", "q": "小樽港の境界線は防波堤の内側をイメージしますが、実際は2つの岬を結んだ直線の内側をいいます。ひとつは平磯岬ですが、もう一方は高島の何という岬ですか。", "choices": [], "a": "茅柴岬", "abody": "", "photos": [], "note": ""}, {"id": "R03-Q035", "exam": 3, "no": 35, "sub": "", "type": "選択", "q": "小樽港が外国貿易港（開港）となり、世界各国と貿易ができるようになったのはいつですか。", "choices": ["明治14年", "明治22年", "明治32年", "明治34年"], "a": "3", "abody": "明治32年", "photos": [], "note": ""}, {"id": "R03-Q036", "exam": 3, "no": 36, "sub": "", "type": "選択", "q": "埋め立て地を造成してつくられた小樽運河の岸壁には百トン積みのはしけが同時に40隻係留できたといいます。完成当時の小樽運河の長さと幅の組み合わせで正しいものはどれですか。", "choices": ["長さ645m、幅40m", "長さ645m、幅20m", "長さ1,324m、幅40m", "長さ1,324m、幅20m"], "a": "3", "abody": "長さ1,324m、幅40m", "photos": [], "note": ""}, {"id": "R03-Q037", "exam": 3, "no": 37, "sub": "", "type": "選択", "q": "小樽港が近代的な港湾として整備が始まったのは明治時代の小樽築港第一期工事でした。小樽築港第一期工事について説明したもので正しいものを一つ選んでください。", "choices": ["国内最大級の本格的外洋防波堤建設工事であり、国家的なプロジェクトとして国費で建設された", "小樽に利権を持つ小樽商人の財力によって、個人の利益を目的につくられた", "北海道から利益を得ようとした外国人が外国の技術者を連れてきて建設した", "釧路港や稚内港などの整備が終り、予算が余ったので小樽港の工事が始まった"], "a": "1", "abody": "国内最大級の本格的外洋防波堤建設工事であり、国家的なプロジェクトとして国費で建設された", "photos": [], "note": ""}, {"id": "R03-Q038", "exam": 3, "no": 38, "sub": "", "type": "記述", "q": "廣井勇の後を継ぎ、小樽築港を成功に導きケーソン進水方式を開発したのは誰ですか。", "choices": [], "a": "伊藤長右衛門", "abody": "", "photos": [], "note": ""}, {"id": "R03-Q039", "exam": 3, "no": 39, "sub": "", "type": "選択", "q": "北海道遺産や土木学会の選奨土木遺産に認定されている小樽港北防波堤は、当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれですか。", "choices": ["北防波堤は第二次世界大戦前の古い技術によるものなので、いまでは使われていない。", "日本の技術者では近代的な防波堤を造ることができなかったので、お雇外国人のJ.U.クロフォードが設計し、アメリカ開拓で用いた工事手法を導入して建設に成功した。", "コンクリートを使った防波堤建設の失敗などが続いたので、全て石積みによる防波堤を建設した。", "札幌農学校教授であった廣井勇が初代の築港所長となり、様々な調査や実験を経て、日本で初めてのコンクリートを用いた外洋防波堤の建設に成功した。"], "a": "4", "abody": "札幌農学校教授であった廣井勇が初代の築港所長となり、様々な調査や実験を経て、日本で初めてのコンクリートを用いた外洋防波堤の建設に成功した。", "photos": [], "note": ""}, {"id": "R23-Q001", "exam": 23, "no": 1, "sub": "", "type": "記述", "q": "小樽のまちの変遷とし  [], "note": ""}, {"id": "R23-Q017", "exam": 23, "no": 17, "sub": "", "type": "選択", "q": "江戸時代後半から続いた鰊漁は肥料として大きな商売となっていましたが、段々と肥料としての需要は次第に衰退していきました。その理由と関係ないのは次のどれでしょうか。", "choices": ["化学肥料が出てきた", "生鰊が大量に全国に流通できるようになった", "漁獲量が不安定になってきた", "大正時代後半から高単価な身欠鰊製造の比重が高まってきた"], "a": "2", "abody": "生鰊が大量に全国に流通できるようになった", "photos": [], "note": ""}, {"id": "R23-Q018", "exam": 23, "no": 18, "sub": "", "type": "記述", "q": "鰊漁では作業のときに唄われる「うた」があります。次の作業で唄われる音頭名を書きなさい。「綱の目をふさぐほど産み付けられた卵を綱から落とすときに浜辺で唄いました。」", "choices": [], "a": "子はたき音頭", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q019", "exam": 23, "no": 19, "sub": "", "type": "選択", "q": "江戸時代の国内の海路として正しいのは次のどれでしょうか。", "choices": ["江戸〜大坂間の東海路", "東北〜大坂間の西海路", "東北・蝦夷地〜江戸間の北海路", "江戸〜尾張間の尾張海路"], "a": "2", "abody": "東北〜大坂間の西海路", "photos": [], "note": ""}, {"id": "R23-Q020", "exam": 23, "no": 20, "sub": "", "type": "選択", "q": "次の中で小樽市における日本遺産「北前船」の構成文化財ではないのはどれでしょうか。", "choices": ["津古丹稲荷神社本殿", "西川家文書", "旧客陽亭", "旧増田倉庫"], "a": "1", "abody": "津古丹稲荷神社本殿", "photos": [], "note": "選択肢1・3の固有名詞はOCR不鮮明"}, {"id": "R23-Q021", "exam": 23, "no": 21, "sub": "", "type": "選択", "q": "次の文中の（ ）に当てはまる語句を選びなさい。北陸地方の北前船の船乗りたちの給料は大変少ないうえ、遭難も多い危険な仕事でした。そこで、積み荷の約1割は船乗りの個人商売を認めるという（ ）とか「帆待ち」と呼ばれた抜け道がありました。船乗りたちはこれを利用し金銭を蓄え独立していきました。", "choices": ["切出し", "直払の口", "売りさばき", "蔵敷"], "a": "1", "abody": "切出し", "photos": [], "note": ""}, {"id": "R23-Q022", "exam": 23, "no": 22, "sub": "", "type": "選択", "q": "北前船が大坂から蝦夷地へ向かうのを「下り」、その逆を「上り」といいますが、次のなかで間違っているのはどれでしょうか。", "choices": ["下り荷には紙も積まれていた", "下り荷にはワラも積まれていた", "上り荷には塩も積まれていた", "上り荷にはイリコも積まれていた"], "a": "3", "abody": "上り荷には塩も積まれていた", "photos": [], "note": ""}, {"id": "R23-Q023-A", "exam": 23, "no": 23, "sub": "A", "type": "選択", "q": "この写真は、北運河にある北前船主の倉庫です。（ ）内に該当する番号を選びなさい。この北前船主は（A）出身で明治中期には6〜8隻の北前船を所有していました。この北前船主は後に（B）らとともに日本海上火災保険株式会社を創設し取締役に就任します。【A：出身地】", "choices": ["石川県加賀市橋立町", "石川県加賀市大聖寺", "福井県南条郡南越前町", "福井県小浜市"], "a": "3", "abody": "福井県南条郡南越前町", "photos": [], "note": ""}, {"id": "R23-Q023-B", "exam": 23, "no": 23, "sub": "B", "type": "選択", "q": "この写真は、北運河にある北前船主の倉庫です。（ ）内に該当する番号を選びなさい。この北前船主は（A）出身で明治中期には6〜8隻の北前船を所有していました。この北前船主は後に（B）らとともに日本海上火災保険株式会社を創設し取締役に就任します。【B：人物】", "choices": ["西出孫左衛門", "広海二三郎", "銭屋五兵衛", "浜中八三朗"], "a": "2", "abody": "広海二三郎", "photos": [], "note": ""}, {"id": "R23-Q024", "exam": 23, "no": 24, "sub": "", "type": "記述", "q": "小樽での日本遺産「北前船」の構成文化財には船絵馬があります。次の文章を読みこの船絵馬が奉納されているのは何というお寺でしょうか。このお寺は文久2(1862)年に開創し、本堂は小樽市指定歴史的建造物になっています。本殿左脇の龍神堂内には船絵馬が3面奉納されています。龍神堂正面には越前産の笏谷石製の狛犬、境内地には笏谷石製の三十三観音が設置されています。", "choices": [], "a": "徳源寺", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q025-A", "exam": 23, "no": 25, "sub": "A", "type": "記述", "q": "ある北前船主の説明です。文中の（ ）に当てはまる語句を記入しなさい。石川県加賀市橋立町出身で小樽に海運会社を設立。日露戦争後の海運発展に乗じ、「（A）の回漕店」といわれるようになった。天狗山麓にある金昆羅大本院はこの北前船主の農場の敷地内で祀ったものです。現在の（B）小学校付近にあった千登勢温泉は別荘でした。", "choices": [], "a": "東洋一", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q025-B", "exam": 23, "no": 25, "sub": "B", "type": "記述", "q": "ある北前船主の説明です。文中の（ ）に当てはまる語句を記入しなさい。石川県加賀市橋立町出身で小樽に海運会社を設立。日露戦争後の海運発展に乗じ、「（A）の回漕店」といわれるようになった。天狗山麓にある金昆羅大本院はこの北前船主の農場の敷地内で祀ったものです。現在の（B）小学校付近にあった千登勢温泉は別荘でした。", "choices": [], "a": "山の手", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q026", "exam": 23, "no": 26, "sub": "", "type": "記述", "q": "次の文章は北前船交易によりもたらされた文化です。それは何というものでしょうか。江戸時代宝永年間に商業が盛んになると販売促進のために登場した1枚物の商業印刷物です。浮世絵の影響を受けた多色刷りや絵画的芸術性の高いものも配布されました。", "choices": [], "a": "引札", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q027", "exam": 23, "no": 27, "sub": "", "type": "選択", "q": "次の文章は小樽で活躍した商人を説明しています。この商人の名前を選びなさい。「松前藩の城下町福山に生まれる。明治15(1882)年、所有地の相生町から水天宮の西福を通って堺町のオコバチ川までの道路を造成した。小樽商業会議所の初代会頭でした。」", "choices": ["山田兵蔵", "山田吉兵衛", "石橋彦三郎", "寿原猪之吉"], "a": "2", "abody": "山田吉兵衛", "photos": [], "note": ""}, {"id": "R23-Q028", "exam": 23, "no": 28, "sub": "", "type": "選択", "q": "次の写真の中で、小樽で活躍した商人の高橋直治に関係する建物はどれでしょうか。", "choices": [], "a": "2", "abody": "", "photos": [], "note": "選択肢が写真のためテキスト化不可。正解番号のみ収録"}, {"id": "R23-Q029", "exam": 23, "no": 29, "sub": "", "type": "選択", "q": "次の建物の中で、小樽で活躍した商人（「おたる案内人」公式テキスト内）と関連のないものはどれでしょうか。（建物名は現在名）", "choices": ["小樽オルゴール堂本館", "おたる瑠璃工房運河店", "小樽市公会堂", "猪股邸"], "a": "4", "abody": "猪股邸", "photos": [], "note": ""}, {"id": "R23-Q030", "exam": 23, "no": 30, "sub": "", "type": "選択", "q": "小樽で活躍した商人たちは、まちに寄付をして貢献しました。商人名と寄付したものの組合せで正しいのはどれでしょうか。", "choices": ["藤山要吉……小樽市民会館", "2代目板谷宮吉……小樽中学校", "高橋直治……小樽区公会堂", "土肥太吉……小樽市庁舎"], "a": "4", "abody": "土肥太吉……小樽市庁舎", "photos": [], "note": ""}, {"id": "R23-Q031", "exam": 23, "no": 31, "sub": "", "type": "記述", "q": "堺町通りにある「おたる瑠璃工房運河店」は小樽商人が残した建物で、現在は店舗として活用されています。かつてこの商人は小樽で最初の新聞を発行しました。その新聞名を書きなさい。", "choices": [], "a": "北門新報", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q032", "exam": 23, "no": 32, "sub": "", "type": "選択", "q": "小樽で活躍した商人のなかで、商工会議所（商業会議所も含む）の会頭になっていないのは次のどれでしょうか。", "choices": ["倉橋大介", "藤山要吉", "磯野進", "木村円吉（6代目）"], "a": "1", "abody": "倉橋大介", "photos": [], "note": ""}, {"id": "R23-Q033", "exam": 23, "no": 33, "sub": "", "type": "記述", "q": "小樽港は海上輸送網の拠点として位置づけられている港で、国際または国内海上輸送網の拠点となる港湾とされています。国の利害に重大な関係がある港湾で、港湾法に基づいて政令で定められています。このような港湾を何というでしょうか。", "choices": [], "a": "重要港湾", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q034", "exam": 23, "no": 34, "sub": "", "type": "選択", "q": "明治13(1880)年、当時の大型の船が接岸できる桟橋が手宮に建設されました。この桟橋の長さは次のどれでしょうか。", "choices": ["約130m", "約230m", "約330m", "約430m"], "a": "4", "abody": "約430m", "photos": [], "note": ""}, {"id": "R23-Q035", "exam": 23, "no": 35, "sub": "", "type": "記述", "q": "明治22(1889)年、小樽港は米、麦、麦粉、石炭、硫黄の5品目に限り、日本船または日本人雇用の外国船により輸出できる港となりました。このような港のことを何というでしょうか。", "choices": [], "a": "特別輸出港", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q036", "exam": 23, "no": 36, "sub": "", "type": "選択", "q": "小樽港の整備は、明治25(1892)年、第4代北海道庁長官が、小樽に近代的な港湾建設をと国に意見書を提出したことで、試験工事を経て本格的な工事が始まりました。本格的な小樽築港第一期工事が始まったのは次のどれでしょうか。", "choices": ["明治26(1893)年", "明治28(1895)年", "明治30(1897)年", "明治32(1899)年"], "a": "3", "abody": "明治30(1897)年", "photos": [], "note": ""}, {"id": "R23-Q037", "exam": 23, "no": 37, "sub": "", "type": "選択", "q": "小樽築港第一期工事で北防波堤が完成しました。完成まで要した年数は次のどれでしょうか。", "choices": ["7年", "9年", "11年", "13年"], "a": "3", "abody": "11年", "photos": [], "note": ""}, {"id": "R23-Q038", "exam": 23, "no": 38, "sub": "", "type": "選択", "q": "小樽港の工事に大きく貢献した廣井勇についての説明で正しいものはどれですか。", "choices": ["廣井勇はフランスに留学し橋梁設計を学び幌内鉄道建設にも関わった", "廣井勇は愛媛県出身で、伊藤長右衛門と同郷だった", "廣井勇は明治32(1899)年から東京帝国大学教授も兼任し、後進を育成した", "廣井勇の札幌農学校時代の同期生は、後に北海道帝国大学初代総長になった佐藤昌介"], "a": "3", "abody": "廣井勇は明治32(1899)年から東京帝国大学教授も兼任し、後進を育成した", "photos": [], "note": ""}, {"id": "R23-Q039", "exam": 23, "no": 39, "sub": "", "type": "選択", "q": "小樽築港第一期工事の北防波堤の建設は、当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれですか。", "choices": ["コンクリートブロックの長期にわたる耐久性が明らかでなかったので、日本古来からの治水技術を導入した伝統的な工事を行い完成させた", "日本の技術者だけでは近代的な防波堤を造ることができなかったので、お雇外国人のC.S.メークが用いた工事手法を導入して建設に成功した", "コンクリートを使った防波堤建設の失敗などが他の港で続いたので、全て石の斜め積みによる防波堤を建設した", "廣井勇が初代の築港所長となり、様々な調査や実験を経て、日本で初めてのコンクリートを用いた外洋防波堤の建設に成功した"], "a": "4", "abody": "廣井勇が初代の築港所長となり、様々な調査や実験を経て、日本で初めてのコンクリートを用いた外洋防波堤の建設に成功した", "photos": [], "note": ""}, {"id": "R23-Q040", "exam": 23, "no": 40, "sub": "", "type": "選択", "q": "北海道の鉄道建設に関わった人物とその主な役割の組み合わせで間違っているのはどれでしょうか。", "choices": ["榎本武揚……開拓使物産取調掛", "黒田清隆……第2代開拓長官", "ライマン……地質学者", "クロフォード……鉄道技師長"], "a": "2", "abody": "黒田清隆……第2代開拓長官", "photos": [], "note": ""}, {"id": "R23-Q041", "exam": 23, "no": 41, "sub": "", "type": "記述", "q": "神居古潭の道路開削と短距離の鉄道建設にあたって開拓使が招聘した技師がクロフォードでした。ただ、招聘された段階では幌内炭田から石炭搬出経路開発の主人公となる人物が他にいました。その人物とはだれでしょうか。", "choices": [], "a": "ゲント", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q042", "exam": 23, "no": 42, "sub": "", "type": "選択", "q": "明治12(1879)年、開拓使は札樽間の道路建設を命じます。クロフォードはこの工事をどのくらいの期間で完成させたでしょうか。", "choices": ["5ヶ月", "7ヶ月", "11ヶ月", "1年"], "a": "1", "abody": "5ヶ月", "photos": [], "note": ""}, {"id": "R23-Q043", "exam": 23, "no": 43, "sub": "", "type": "選択", "q": "小樽、幌内間の鉄道敷設のルート決定をうけ、本格的な鉄道工事は若竹第三トンネルの開削から始まりました。この工事を指揮したのは次の誰でしょうか。", "choices": ["平井晴二郎", "松本荘一郎", "広井勇", "ペリー"], "a": "2", "abody": "松本荘一郎", "photos": [], "note": ""}, {"id": "R23-Q044", "exam": 23, "no": 44, "sub": "", "type": "選択", "q": "北海道鉄道の工事は明治34(1901)年、大沼幅下トンネルと忍路トンネルの開削から始まりました。北海道鉄道が全線開通したのは次のどれでしょうか。", "choices": ["明治34(1901)年", "明治35(1902)年", "明治36(1903)年", "明治37(1904)年"], "a": "4", "abody": "明治37(1904)年", "photos": [], "note": ""}, {"id": "R23-Q045", "exam": 23, "no": 45, "sub": "", "type": "選択", "q": "幌内鉄道の手宮〜札幌間の開通時には4つの駅しかありませんでした。正しいのは次のどれでしょうか。", "choices": ["手宮〜開運町〜朝里〜札幌", "手宮〜朝里〜軽川〜札幌", "手宮〜朝里〜銭函〜札幌", "手宮〜開運町〜銭函〜札幌"], "a": "4", "abody": "手宮〜開運町〜銭函〜札幌", "photos": [], "note": "選択肢3・4の駅名はOCRで「録画」と誤読、「銭函」と判断"}, {"id": "R23-Q046", "exam": 23, "no": 46, "sub": "", "type": "選択", "q": "幌内鉄道に導入された蒸気機関車は6号まで「和名」がつけられていました。次の4つの中で正しいのはどれでしょうか。", "choices": ["1号「義経」2号「弁慶」3号「比羅夫」", "1号「義経」2号「しづか」3号「弁慶」", "1号「弁慶」2号「義経」6号「しづか」", "1号「弁慶」2号「義経」4号「比羅夫」"], "a": "1", "abody": "1号「義経」2号「弁慶」3号「比羅夫」", "photos": [], "note": ""}, {"id": "R23-Q047", "exam": 23, "no": 47, "sub": "", "type": "記述", "q": "現在のJR小樽駅のホームやコンコース、通路には北一硝子さんが寄贈したランプが設置されています。その数は何個でしょうか。（文化庁：日本遺産ポータルサイトより）", "choices": [], "a": "333個", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q048", "exam": 23, "no": 48, "sub": "", "type": "記述", "q": "小樽運河保存運動が立ち上がるきっかけとなったのは、札樽自動車道の延長幹線道路建設で当時、有幌にあった石造倉庫群が次々に取り壊されたことでした。この工事が行われた年はいつでしょうか。", "choices": [], "a": "昭和47年または1972年", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q049", "exam": 23, "no": 49, "sub": "", "type": "選択", "q": "昭和51(1976)年、道路建設による運河埋め立てを危惧し、「小樽運河を守る会」の発起人会が正式に発足しました。この時、初代会長になったのは次のどれでしょうか。", "choices": ["峯山冨美", "越崎宗一", "西村幸雄", "小川原格"], "a": "2", "abody": "越崎宗一", "photos": [], "note": ""}, {"id": "R23-Q050", "exam": 23, "no": 50, "sub": "", "type": "記述", "q": "次の文章は現在の小樽運河に架かる橋の説明です。橋の名称を書きなさい。「小樽運河に架かる橋の中では他の橋より高さがあり遊漁船も航行できます。橋のたもとには小樽出身の彫刻家、斎藤吉郎さんの作品「カモメ呼ぶ少女」像があります。」", "choices": [], "a": "北浜橋", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q051", "exam": 23, "no": 51, "sub": "", "type": "選択", "q": "運河埋め立ての着工直前、保存派による署名活動が行われました。その結果は次のどれでしょうか。", "choices": ["1ヶ月間で3万7千人の署名を集めた", "1ヶ月間で5万7千人の署名を集めた", "2ヶ月間で9万7千人の署名を集めた", "2ヶ月間で10万7千人の署名を集めた"], "a": "3", "abody": "2ヶ月間で9万7千人の署名を集めた", "photos": [], "note": ""}, {"id": "R23-Q052-A", "exam": 23, "no": 52, "sub": "A", "type": "記述", "q": "（ ）内に該当する語句を記入しなさい。明治10年代の庶民の住宅は簡易な木造で建てられ屋根は板を葺いて（A）が置かれていました。また手宮の鉄道に関わる施設は西洋風の木造で外壁を（B）にして窓の戸は上下させる縦長窓でした。", "choices": [], "a": "石", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q052-B", "exam": 23, "no": 52, "sub": "B", "type": "記述", "q": "（ ）内に該当する語句を記入しなさい。明治10年代の庶民の住宅は簡易な木造で建てられ屋根は板を葺いて（A）が置かれていました。また手宮の鉄道に関わる施設は西洋風の木造で外壁を（B）にして窓の戸は上下させる縦長窓でした。", "choices": [], "a": "横板張り又は下見板張り", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q053", "exam": 23, "no": 53, "sub": "", "type": "記述", "q": "明治37(1904)年の稲穂の大火を契機に市街地の主要な建物は木骨石造へ一気に転換しました。色内にある木骨石造の旧早川支店には防火対策として建物正面左側にあるものが設置されています。そこには鯉や亀などの彫刻がほどこされています。この設置されているものは何というでしょうか。", "choices": [], "a": "うだつ又は袖壁", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q054", "exam": 23, "no": 54, "sub": "", "type": "選択", "q": "明治16(1883)年から始まった手宮の鉄道施設の建造物に使われた建築材料は火災から施設を守るためでした。この材料は入船の陸橋と手宮の倉庫、さらに現在、国指定重要文化財になっている機関車庫にも使われました。この材料は次のどれでしょうか。", "choices": ["小樽の軟石", "札幌軟石", "コンクリートブロック", "レンガ"], "a": "4", "abody": "レンガ", "photos": [], "note": ""}, {"id": "R23-Q055", "exam": 23, "no": 55, "sub": "", "type": "選択", "q": "手宮の鉄道施設建設を指導した平井晴二郎は手宮での経験を発展させ、現在も残る重要な建築物にも関わりました。次のなかで平井晴二郎が関わった建物は次のどれでしょうか。", "choices": ["豊平館", "北海道庁旧本庁舎", "サッポロビール博物館", "旧永山武四郎邸"], "a": "2", "abody": "北海道庁旧本庁舎", "photos": [], "note": ""}, {"id": "R23-Q056", "exam": 23, "no": 56, "sub": "", "type": "選択", "q": "令和7(2025)年4月、旧日本郵船株式会社小樽支店が修復工事を終え再公開されました。次のなかで、この建物に関する説明で間違っているのはどれでしょうか。", "choices": ["この建物は木骨石造ではなく石造だ", "この建物を設計したのは佐立七次郎だ", "1階の貴賓室と2階の会議室の壁紙は金唐革紙という貴重な壁紙が採用されている", "この建物が建築されたのは明治39(1906)年だ"], "a": "3", "abody": "1階の貴賓室と2階の会議室の壁紙は金唐革紙という貴重な壁紙が採用されている", "photos": [], "note": ""}, {"id": "R23-Q057", "exam": 23, "no": 57, "sub": "", "type": "選択", "q": "次の小樽市内にある建物の建築時名と現在名との組み合わせで間違っているのはどれでしょうか。", "choices": ["百 b": "A", "type": "選択", "q": "（ ）内に該当する一番適切な語句を記入しなさい。ガイドを依頼された時、事前に準備しておかなければならない一番大事なことは（A）です。またガイド中で大事なことは（B）を心がけることです。心のこもった笑顔と、ちょっとした気遣いは、お客様に対して、最大の（C）となります。【A】", "choices": ["お客様の職業を知ること", "自分が目立つ服装を考える", "お土産店を調べておくこと", "行程を事前にシミュレーションしてみる"], "a": "4", "abody": "行程を事前にシミュレーションしてみる", "photos": [], "note": ""}, {"id": "R23-Q093-B", "exam": 23, "no": 93, "sub": "B", "type": "選択", "q": "（ ）内に該当する一番適切な語句を記入しなさい。ガイドを依頼された時、事前に準備しておかなければならない一番大事なことは（A）です。またガイド中で大事なことは（B）を心がけることです。心のこもった笑顔と、ちょっとした気遣いは、お客様に対して、最大の（C）となります。【B】", "choices": ["覚えたことを最後まで話すこと", "建物の建築年を間違えないこと", "冗談を言うこと", "気さくな声がけで状況を判断すること"], "a": "4", "abody": "気さくな声がけで状況を判断すること", "photos": [], "note": ""}, {"id": "R23-Q093-C", "exam": 23, "no": 93, "sub": "C", "type": "選択", "q": "（ ）内に該当する一番適切な語句を記入しなさい。ガイドを依頼された時、事前に準備しておかなければならない一番大事なことは（A）です。またガイド中で大事なことは（B）を心がけることです。心のこもった笑顔と、ちょっとした気遣いは、お客様に対して、最大の（C）となります。【C】", "choices": ["おみやげ", "おもてなし", "贈り物", "思い出づくり"], "a": "2", "abody": "おもてなし", "photos": [], "note": ""}];</script>
<script>
const $ = (s, r=document) => r.querySelector(s);
const KEY = 'otaru-study-v1';
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩';

let store = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const rec = id => store[id] || (store[id] = {seen:0, ok:0, ng:0, box:0});

let mode = 'weak';       // weak | all | unseen | exam
let examFilter = null;
let current = null, answered = false;

/* 出題の重み付け。間違えた問題と未挑戦を優先し、
   正解を重ねた問題は間隔を空ける（簡易的な間隔反復）。 */
function weight(q) {
  const r = store[q.id];
  if (!r || r.seen === 0) return 6;
  if (r.box <= 0) return 10;
  return Math.max(1, 8 - r.box * 2);
}

function pool() {
  let qs = QUESTIONS;
  if (mode === 'exam' && examFilter) qs = qs.filter(q => q.exam === examFilter);
  if (mode === 'unseen') qs = qs.filter(q => !store[q.id] || store[q.id].seen === 0);
  if (mode === 'weak') qs = qs.filter(q => { const r = store[q.id];
    return !r || r.seen === 0 || r.box <= 0; });
  return qs.length ? qs : (mode === 'exam' && examFilter
    ? QUESTIONS.filter(q => q.exam === examFilter) : QUESTIONS);
}

function pick() {
  const qs = pool();
  const total = qs.reduce((s, q) => s + weight(q), 0);
  let t = Math.random() * total;
  for (const q of qs) { t -= weight(q); if (t <= 0) return q; }
  return qs[qs.length - 1];
}

function mark(ok) {
  const r = rec(current.id);
  r.seen++;
  if (ok) { r.ok++; r.box = Math.min(5, r.box + 1); }
  else { r.ng++; r.box = 0; }
  save();
  renderStats();
}

function render() {
  answered = false;
  current = pick();
  const q = current;
  const sub = q.sub ? q.sub : '';
  /* 写真そのものが選択肢の設問は、写真をクリックして選ぶ。
     テキストの「［写真1］」は重複するので出さない。 */
  const pickPhotos = q.type === '写真選択' && q.photos.length;
  const photos = q.photos.length
    ? `<div class="photos">${q.photos.map((p, i) => pickPhotos
        ? `<button class="pick choice" data-i="${i+1}">
             <img src="${p}" alt="選択肢${i+1}" loading="lazy">
             <figcaption>${CIRC[i]} 選択肢${i+1}</figcaption></button>`
        : `<figure class="pick"><img src="${p}" alt="" loading="lazy"></figure>`
      ).join('')}</div>`
    : '';

  const body = pickPhotos ? ''
    : q.choices.length
    ? `<div class="choices">${q.choices.map((c, i) =>
        `<button class="choice" data-i="${i+1}">
           <span class="n">${CIRC[i]}</span><span>${c}</span></button>`).join('')}</div>`
    : `<textarea id="mine" placeholder="答えを入力してください"></textarea>
       <div class="selfmark"><button id="submit">回答する</button></div>`;

  $('#quiz').innerHTML = `
    <div class="card">
      <span class="chip">第${q.exam}回 問${q.no}${sub}・${q.type}</span>
      <p class="qtext">${q.q}</p>
      ${photos}${body}
      <div id="reveal"></div>
    </div>`;

  $('#quiz').querySelectorAll('.choice').forEach(b =>
    b.onclick = () => choose(Number(b.dataset.i)));
  const s = $('#submit'); if (s) s.onclick = submitFree;
}

function choose(i) {
  if (answered) return;
  answered = true;
  const q = current, ok = String(i) === String(q.a);
  $('#quiz').querySelectorAll('.choice').forEach(b => {
    const n = Number(b.dataset.i);
    if (String(n) === String(q.a)) b.classList.add('ok');
    else if (n === i) b.classList.add('ng');
  });
  mark(ok);
  $('#reveal').innerHTML = `<div class="reveal">
    ${ok ? '<b>正解</b>' : '<span style="color:var(--ng);font-weight:700">不正解</span>'}
    　正解は <b>${CIRC[Number(q.a)-1] || q.a}</b>
    ${q.abody ? ' ' + q.abody : ''}
    ${q.note ? `<div class="note">${q.note}</div>` : ''}
    <div class="selfmark"><button id="next">次の問題 →</button></div></div>`;
  $('#next').onclick = render;
}

/* 記述式は自分では採点しない。回答を採点待ちに積み、
   まとめてClaudeに判定してもらう。 */
function submitFree() {
  if (answered) return;
  answered = true;
  const q = current;
  const mine = ($('#mine').value || '').trim();
  pending.push({id:q.id, exam:q.exam, no:q.no, sub:q.sub, q:q.q, mine, correct:q.a});
  savePending();
  renderPending();
  $('#reveal').innerHTML = `<div class="reveal">
    <div class="cmp">
      <div><span class="k">あなたの回答</span>${mine || '（未記入）'}</div>
      <div><span class="k">模範解答</span><b>${q.a}</b></div>
    </div>
    採点待ちに追加しました。上の「採点をClaudeに依頼」からまとめて判定できます。
    ${q.note ? `<div class="note">${q.note}</div>` : ''}
    <div class="selfmark"><button id="next">次の問題 →</button></div></div>`;
  $('#next').onclick = render;
}

/* ---- 採点待ちの管理 ---- */
const PKEY = 'otaru-pending-v1';
let pending = JSON.parse(localStorage.getItem(PKEY) || '[]');
const savePending = () => localStorage.setItem(PKEY, JSON.stringify(pending));

function requestText() {
  const lines = ['以下の記述式問題を採点してください。私の回答と模範解答を比べて、',
    '各問に ○ か × と、必要なら一言の解説をお願いします。', ''];
  pending.forEach((p, i) => {
    lines.push(`【${i+1}】第${p.exam}回 問${p.no}${p.sub||''}`);
    lines.push(`問題: ${p.q}`);
    lines.push(`私の回答: ${p.mine || '（未記入）'}`);
    lines.push(`模範解答: ${p.correct}`);
    lines.push('');
  });
  return lines.join('\n');
}

function renderPending() {
  const box = $('#pending');
  if (!pending.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="pend">
    <h2>採点待ち ${pending.length}件</h2>
    <ul>${pending.map((p, i) => `<li>
      <span>第${p.exam}回 問${p.no}${p.sub||''}　${p.mine || '（未記入）'}</span>
      <button data-ok="${i}">○</button><button data-ng="${i}">×</button>
    </li>`).join('')}</ul>
    <button id="copy">採点をClaudeに依頼（コピー）</button>
    <button id="clearp">まとめて破棄</button>
    <div class="note">コピーしてチャットに貼り、返ってきた判定を ○ / × で記録してください。</div>
  </div>`;
  box.querySelectorAll('[data-ok]').forEach(b =>
    b.onclick = () => resolvePending(Number(b.dataset.ok), true));
  box.querySelectorAll('[data-ng]').forEach(b =>
    b.onclick = () => resolvePending(Number(b.dataset.ng), false));
  $('#copy').onclick = async () => {
    const txt = requestText();
    try { await navigator.clipboard.writeText(txt); $('#copy').textContent = 'コピーしました'; }
    catch { prompt('以下をコピーしてください', txt); }
    setTimeout(() => { const c = $('#copy'); if (c) c.textContent = '採点をClaudeに依頼（コピー）'; }, 1800);
  };
  $('#clearp').onclick = () => {
    if (!confirm(`採点待ち${pending.length}件を破棄します。よろしいですか。`)) return;
    pending = []; savePending(); renderPending();
  };
}

function resolvePending(i, ok) {
  const p = pending[i];
  const r = rec(p.id);
  r.seen++;
  if (ok) { r.ok++; r.box = Math.min(5, r.box + 1); } else { r.ng++; r.box = 0; }
  save();
  pending.splice(i, 1); savePending();
  renderPending(); renderStats();
}

function renderStats() {
  const ids = Object.keys(store);
  const seen = ids.filter(k => store[k].seen > 0).length;
  const ok = ids.reduce((s, k) => s + store[k].ok, 0);
  const ng = ids.reduce((s, k) => s + store[k].ng, 0);
  const rate = ok + ng ? Math.round(ok / (ok + ng) * 100) : 0;
  const weak = ids.filter(k => store[k].seen > 0 && store[k].box <= 0).length;
  $('#stats').innerHTML = `
    <div class="stat"><div class="v">${seen}<small style="font-size:.8rem;color:var(--muted)">/${QUESTIONS.length}</small></div><div class="k">着手した問題</div></div>
    <div class="stat"><div class="v">${rate}%</div><div class="k">正答率（延べ${ok+ng}回）</div></div>
    <div class="stat"><div class="v">${weak}</div><div class="k">要復習</div></div>`;
}

function renderExamButtons() {
  const exams = [...new Set(QUESTIONS.map(q => q.exam))].sort((a,b) => a-b);
  $('#exams').innerHTML = exams.map(n =>
    `<button data-exam="${n}">第${n}回</button>`).join('');
  $('#exams').querySelectorAll('button').forEach(b => b.onclick = () => {
    mode = 'exam'; examFilter = Number(b.dataset.exam);
    setMode(); render();
  });
}

function setMode() {
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  document.querySelectorAll('[data-exam]').forEach(b =>
    b.classList.toggle('on', mode === 'exam' && Number(b.dataset.exam) === examFilter));
}

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; examFilter = null; setMode(); render();
});

$('#reset').onclick = () => {
  if (!confirm('学習記録をすべて消します。よろしいですか。')) return;
  store = {}; save(); renderStats(); render();
};

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '4') {
    const b = $(`.choice[data-i="${e.key}"]`); if (b) b.click();
  } else if (e.key === 'Enter' || e.key === ' ') {
    const n = $('#next') || $('#show'); if (n) { e.preventDefault(); n.click(); }
  }
});

renderExamButtons(); setMode(); renderStats(); renderPending(); render();
</script>
