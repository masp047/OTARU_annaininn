<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おたる案内人検定 学習アプリ</title>
<style>
:root { color-scheme: light dark; --bg:#fbfbfa; --fg:#1a1a18; --card:#fff;
  --line:#e4e4de; --muted:#6b6b64; --ok:#2f7d5c; --ng:#b4483c; --accent:#7a6a45;
  --chip:#f3eee1; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16161a; --fg:#e8e8e3; --card:#1e1e23; --line:#32323a;
    --muted:#9a9a92; --ok:#5fbf95; --ng:#e08a7e; --accent:#d8c79a; --chip:#33301f; }
}
* { box-sizing: border-box; }
body { margin:0; padding:1.5rem 1rem 5rem; background:var(--bg); color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
main { max-width:46rem; margin:0 auto; }
h1 { font-size:1.15rem; margin:0 0 1rem; display:flex; align-items:baseline;
  gap:.6rem; flex-wrap:wrap; }
h1 small { font-weight:400; font-size:.8rem; color:var(--muted); }
.bar { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1.25rem; }
button { font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); padding:.4rem .8rem; }
button:hover { border-color:var(--accent); }
button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.card { background:var(--card); border:1px solid var(--line); border-radius:11px;
  padding:1.25rem 1.4rem 1.4rem; }
.chip { display:inline-block; font-size:.72rem; font-weight:600; letter-spacing:.04em;
  color:var(--accent); background:var(--chip); border-radius:4px;
  padding:.15rem .5rem; margin-bottom:.7rem; }
.qtext { font-weight:500; margin:0 0 1.1rem; }
.photos { display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem;
  margin-bottom:1rem; }
@media (max-width:30rem) { .photos { grid-template-columns:1fr; } }
.photos .pick { margin:0; padding:.35rem; border:1px solid var(--line);
  border-radius:8px; background:var(--card); cursor:pointer; text-align:left;
  display:block; width:100%; }
.photos .pick:hover { border-color:var(--accent); }
.photos img { width:100%; height:auto; display:block; border-radius:5px; }
.photos figcaption { font-size:.78rem; color:var(--muted); margin-top:.3rem; }
.photos .pick.ok { border-color:var(--ok); border-width:2px;
  background:color-mix(in srgb,var(--ok) 12%,transparent); }
.photos .pick.ng { border-color:var(--ng); border-width:2px;
  background:color-mix(in srgb,var(--ng) 12%,transparent); }
.photos .pick.ok figcaption { color:var(--ok); font-weight:700; }
.choices { display:flex; flex-direction:column; gap:.5rem; }
.choice { text-align:left; padding:.6rem .9rem; display:flex; gap:.6rem; }
.choice .n { font-weight:700; color:var(--muted); flex:0 0 1.2rem; }
.choice.ok { border-color:var(--ok); background:color-mix(in srgb,var(--ok) 12%,transparent); }
.choice.ng { border-color:var(--ng); background:color-mix(in srgb,var(--ng) 12%,transparent); }
.reveal { margin-top:1.1rem; padding-top:1rem; border-top:1px solid var(--line);
  font-size:.92rem; }
.reveal b { color:var(--ok); }
.note { font-size:.8rem; color:var(--muted); margin-top:.5rem; }
.selfmark { display:flex; gap:.5rem; margin-top:.9rem; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));
  gap:.7rem; margin-bottom:1.25rem; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:.7rem .9rem; }
.stat .v { font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; }
.stat .k { font-size:.75rem; color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
th,td { text-align:left; padding:.4rem .5rem; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-weight:600; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
.hint { font-size:.78rem; color:var(--muted); margin-top:1rem; }
textarea { font:inherit; width:100%; min-height:4.5rem; padding:.6rem .8rem;
  border:1px solid var(--line); border-radius:7px; background:var(--bg);
  color:var(--fg); resize:vertical; }
.cmp { display:grid; gap:.5rem; margin:.9rem 0; }
.cmp div { padding:.5rem .8rem; border-radius:6px; border:1px solid var(--line); }
.cmp .k { font-size:.75rem; color:var(--muted); display:block; }
.pend { background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:.9rem 1rem; margin-bottom:1.25rem; font-size:.88rem; }
.pend h2 { font-size:.9rem; margin:0 0 .6rem; }
.pend ul { list-style:none; margin:0 0 .7rem; padding:0; }
.pend li { display:flex; gap:.5rem; align-items:center; padding:.3rem 0;
  border-bottom:1px solid var(--line); }
.pend li span { flex:1; }
.pend li button { padding:.2rem .55rem; font-size:.8rem; }
.empty { color:var(--muted); }
</style></head><body><main>
<h1>おたる案内人検定 学習アプリ
  <small>129問 / 第1回〜第23回（2回分）</small></h1>

<div id="pending"></div>
<div class="bar">
  <button data-mode="weak">要復習・未挑戦</button>
  <button data-mode="all">全問ランダム</button>
  <button data-mode="unseen">未挑戦のみ</button>
  <button id="reset" style="margin-left:auto">記録を消す</button>
</div>
<div class="bar" id="exams"></div>
<div id="quiz"></div>
<p class="hint">キーボード: 1〜4 で選択 / Enter で次へ。
  記録はこのブラウザに保存されます。

</main>
<script>const QUESTIONS = [{"id": "R01-Q001", "exam": 1, "no": 1, "sub": "", "type": "選択", "q": "小樽に集落が形成されるころ、嘉永6（1853）年の黒船来航により日本は大きく変化していきましたが、世界の背景にはどのような出来事があったのでしょうか。", "choices": ["エネルギー革命", "産業革命", "IT革命", "宗教革命"], "a": "2", "abody": "産業革命", "photos": [], "note": ""}, {"id": "R01-Q002", "exam": 1, "no": 2, "sub": "", "type": "選択", "q": "明治から昭和の初期にかけて北海道には全国が欲しがる代表的な2つの資源がありました。それは次の組み合わせのうちどれですか。", "choices": ["鰊と木材", "石炭と銅", "鰊と綿花", "鰊と石炭"], "a": "4", "abody": "鰊と石炭", "photos": [], "note": ""}, {"id": "R01-Q003", "exam": 1, "no": 3, "sub": "", "type": "選択", "q": "明治初期に政府は「殖産興業」「富国強兵」という政策を打ち出し、小樽に鉄道を敷くために膨大なお金を投下しますが、その目的の第一はどれですか。", "choices": ["鰊を運ぶため", "石炭を運ぶため", "農産物を運ぶため", "人を運ぶため"], "a": "2", "abody": "石炭を運ぶため", "photos": [], "note": ""}, {"id": "R01-Q004", "exam": 1, "no": 4, "sub": "", "type": "選択", "q": "鰊がお金のような価値を持ったのは何故ですか。", "choices": ["油分が多量に含まれて栄養があったから", "食料不足だったから", "美味しかったから", "農作物の肥料に最適だったから"], "a": "4", "abody": "農作物の肥料に最適だったから", "photos": [], "note": ""}, {"id": "R01-Q005", "exam": 1, "no": 5, "sub": "", "type": "選択", "q": "江戸後期から明治後期くらいまで小樽に来た商人は上り荷（大阪へ運ぶ荷物）に〆粕・昆布・イリコ・ホシアワビなどを積んで船で運びましたが、その船のことを何と呼びますか。", "choices": ["菱垣廻船", "樽廻船", "北前船", "蒸気船"], "a": "3", "abody": "北前船", "photos": [], "note": ""}, {"id": "R01-Q006", "exam": 1, "no": 6, "sub": "", "type": "選択", "q": "手宮〜幌内間の鉄道敷設に直接貢献したお雇い外国人は誰ですか。", "choices": ["クロフォード", "アンチセル", "ケプロン", "ライマン"], "a": "1", "abody": "クロフォード", "photos": [], "note": ""}, {"id": "R01-Q007", "exam": 1, "no": 7, "sub": "", "type": "選択", "q": "明治から昭和初期まで小樽にはどんな都市がつくられてきたでしょうか。", "choices": ["工業港湾都市", "商業観光都市", "芸術文化都市", "商業港湾都市"], "a": "4", "abody": "商業港湾都市", "photos": [], "note": ""}, {"id": "R01-Q008", "exam": 1, "no": 8, "sub": "", "type": "選択", "q": "小樽を含む積丹半島地域の鰊の漁期を以下から選んでください。", "choices": ["10〜12月", "12〜1月", "3〜5月", "5〜6月"], "a": "3", "abody": "3〜5月", "photos": [], "note": ""}, {"id": "R01-Q009", "exam": 1, "no": 9, "sub": "", "type": "選択", "q": "祝津の大漁家だった青山家と茨木家の出身県を以下から選んでください。", "choices": ["青森県", "秋田県", "山形県", "岩手県"], "a": "3", "abody": "山形県", "photos": [], "note": ""}, {"id": "R01-Q010", "exam": 1, "no": 10, "sub": "", "type": "選択", "q": "漁獲高を表す「石」をキログラムで換算すると以下のどれでしょうか。", "choices": ["750キログラム", "700キログラム", "7500キログラム", "375キログラム"], "a": "1", "abody": "750キログラム", "photos": [], "note": ""}, {"id": "R01-Q011", "exam": 1, "no": 11, "sub": "", "type": "選択", "q": "小樽の鰊漁獲高が最高だった年を以下から選んでください。", "choices": ["明治30年", "大正3年", "大正14年", "昭和8年"], "a": "3", "abody": "大正14年", "photos": [], "note": ""}, {"id": "R01-Q012", "exam": 1, "no": 12, "sub": "", "type": "写真選択", "q": "旧近江家番屋の写真を以下の1〜4から選んでください。", "choices": ["［写真1］", "［写真2］", "［写真3］", "［写真4］"], "a": "4", "abody": "［写真4］", "photos": ["images/R01-Q012-1.png", "images/R01-Q012-2.png", "images/R01-Q012-3.png", "images/R01-Q012-4.png"], "note": "選択肢は4枚の写真。images/R01-Q012-1〜4.png と対応"}, {"id": "R01-Q013", "exam": 1, "no": 13, "sub": "", "type": "選択", "q": "小樽の鰊漁家が遠隔地にも漁場を経営できた理由の正しい組み合わせを以下から選んでください。", "choices": ["安定した漁獲と消費地に近かったこと", "魚肥の高い需要と運河の存在", "安定した漁獲と造船技術", "安定した漁獲と魚肥の高い需要"], "a": "4", "abody": "安定した漁獲と魚肥の高い需要", "photos": [], "note": ""}, {"id": "R01-Q014", "exam": 1, "no": 14, "sub": "", "type": "選択", "q": "祝津の鰊御殿がかつてあった場所と所有者の組み合わせを以下から選んでください。", "choices": ["泊村の田中家", "泊村の猪俣家", "余市町の田中家", "余市町の猪俣家"], "a": "1", "abody": "泊村の田中家", "photos": [], "note": ""}, {"id": "R01-Q015", "exam": 1, "no": 15, "sub": "", "type": "選択", "q": "平磯岬にある銀鱗荘がかつてあった場所と所有者の組み合わせを以下から選んでください。", "choices": ["泊村の田中家", "泊村の猪俣家", "余市町の田中家", "余市町の猪俣家"], "a": "4", "abody": "余市町の猪俣家", "photos": [], "note": ""}, {"id": "R01-Q016", "exam": 1, "no": 16, "sub": "", "type": "選択", "q": "オタルナイ場所とタカシマ場所、タカシマ場所とオショロ場所の境界の組み合わせの正しいものを以下から選んでください。", "choices": ["於古発川（妙見川）と山中", "星置と於古発川（妙見川）", "有幌町と茅芝岬", "平磯岬と手宮"], "a": "1", "abody": "於古発川（妙見川）と山中", "photos": [], "note": ""}, {"id": "R01-Q017", "exam": 1, "no": 17, "sub": "", "type": "選択", "q": "沖揚げ音頭をうたう際の独唱の別称を以下から選んでください。", "choices": ["キヤリ", "キリ声", "ハオイ", "シタゴエ"], "a": "3", "abody": "ハオイ", "photos":  ）に当てはまる語句を選びなさい。北陸地方の北前船の船乗りたちの給料は大変少ないうえ、遭難も多い危険な仕事でした。そこで、積み荷の約1割は船乗りの個人商売を認めるという（ ）とか「帆待ち」と呼ばれた抜け道がありました。船乗りたちはこれを利用し金銭を蓄え独立していきました。", "choices": ["切出し", "直払の口", "売りさばき", "蔵敷"], "a": "1", "abody": "切出し", "photos": [], "note": ""}, {"id": "R23-Q022", "exam": 23, "no": 22, "sub": "", "type": "選択", "q": "北前船が大坂から蝦夷地へ向かうのを「下り」、その逆を「上り」といいますが、次のなかで間違っているのはどれでしょうか。", "choices": ["下り荷には紙も積まれていた", "下り荷にはワラも積まれていた", "上り荷には塩も積まれていた", "上り荷にはイリコも積まれていた"], "a": "3", "abody": "上り荷には塩も積まれていた", "photos": [], "note": ""}, {"id": "R23-Q023-A", "exam": 23, "no": 23, "sub": "A", "type": "選択", "q": "この写真は、北運河にある北前船主の倉庫です。（ ）内に該当する番号を選びなさい。この北前船主は（A）出身で明治中期には6〜8隻の北前船を所有していました。この北前船主は後に（B）らとともに日本海上火災保険株式会社を創設し取締役に就任します。【A：出身地】", "choices": ["石川県加賀市橋立町", "石川県加賀市大聖寺", "福井県南条郡南越前町", "福井県小浜市"], "a": "3", "abody": "福井県南条郡南越前町", "photos": [], "note": ""}, {"id": "R23-Q023-B", "exam": 23, "no": 23, "sub": "B", "type": "選択", "q": "この写真は、北運河にある北前船主の倉庫です。（ ）内に該当する番号を選びなさい。この北前船主は（A）出身で明治中期には6〜8隻の北前船を所有していました。この北前船主は後に（B）らとともに日本海上火災保険株式会社を創設し取締役に就任します。【B：人物】", "choices": ["西出孫左衛門", "広海二三郎", "銭屋五兵衛", "浜中八三朗"], "a": "2", "abody": "広海二三郎", "photos": [], "note": ""}, {"id": "R23-Q024", "exam": 23, "no": 24, "sub": "", "type": "記述", "q": "小樽での日本遺産「北前船」の構成文化財には船絵馬があります。次の文章を読みこの船絵馬が奉納されているのは何というお寺でしょうか。このお寺は文久2(1862)年に開創し、本堂は小樽市指定歴史的建造物になっています。本殿左脇の龍神堂内には船絵馬が3面奉納されています。龍神堂正面には越前産の笏谷石製の狛犬、境内地には笏谷石製の三十三観音が設置されています。", "choices": [], "a": "徳源寺", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q025-A", "exam": 23, "no": 25, "sub": "A", "type": "記述", "q": "ある北前船主の説明です。文中の（ ）に当てはまる語句を記入しなさい。石川県加賀市橋立町出身で小樽に海運会社を設立。日露戦争後の海運発展に乗じ、「（A）の回漕店」といわれるようになった。天狗山麓にある金昆羅大本院はこの北前船主の農場の敷地内で祀ったものです。現在の（B）小学校付近にあった千登勢温泉は別荘でした。", "choices": [], "a": "東洋一", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q025-B", "exam": 23, "no": 25, "sub": "B", "type": "記述", "q": "ある北前船主の説明です。文中の（ ）に当てはまる語句を記入しなさい。石川県加賀市橋立町出身で小樽に海運会社を設立。日露戦争後の海運発展に乗じ、「（A）の回漕店」といわれるようになった。天狗山麓にある金昆羅大本院はこの北前船主の農場の敷地内で祀ったものです。現在の（B）小学校付近にあった千登勢温泉は別荘でした。", "choices": [], "a": "山の手", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q026", "exam": 23, "no": 26, "sub": "", "type": "記述", "q": "次の文章は北前船交易によりもたらされた文化です。それは何というものでしょうか。江戸時代宝永年間に商業が盛んになると販売促進のために登場した1枚物の商業印刷物です。浮世絵の影響を受けた多色刷りや絵画的芸術性の高いものも配布されました。", "choices": [], "a": "引札", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q027", "exam": 23, "no": 27, "sub": "", "type": "選択", "q": "次の文章は小樽で活躍した商人を説明しています。この商人の名前を選びなさい。「松前藩の城下町福山に生まれる。明治15(1882)年、所有地の相生町から水天宮の西福を通って堺町のオコバチ川までの道路を造成した。小樽商業会議所の初代会頭でした。」", "choices": ["山田兵蔵", "山田吉兵衛", "石橋彦三郎", "寿原猪之吉"], "a": "2", "abody": "山田吉兵衛", "photos": [], "note": ""}, {"id": "R23-Q028", "exam": 23, "no": 28, "sub": "", "type": "選択", "q": "次の写真の中で、小樽で活躍した商人の高橋直治に関係する建物はどれでしょうか。", "choices": [], "a": "2", "abody": "", "photos": [], "note": "選択肢が写真のためテキスト化不可。正解番号のみ収録"}, {"id": "R23-Q029", "exam": 23, "no": 29, "sub": "", "type": "選択", "q": "次の建物の中で、小樽で活躍した商人（「おたる案内人」公式テキスト内）と関連のないものはどれでしょうか。（建物名は現在名）", "choices": ["小樽オルゴール堂本館", "おたる瑠璃工房運河店", "小樽市公会堂", "猪股邸"], "a": "4", "abody": "猪股邸", "photos": [], "note": ""}, {"id": "R23-Q030", "exam": 23, "no": 30, "sub": "", "type": "選択", "q": "小樽で活躍した商人たちは、まちに寄付をして貢献しました。商人名と寄付したものの組合せで正しいのはどれでしょうか。", "choices": ["藤山要吉……小樽市民会館", "2代目板谷宮吉……小樽中学校", "高橋直治……小樽区公会堂", "土肥太吉……小樽市庁舎"], "a": "4", "abody": "土肥太吉……小樽市庁舎", "photos": [], "note": ""}, {"id": "R23-Q031", "exam": 23, "no": 31, "sub": "", "type": "記述", "q": "堺町通りにある「おたる瑠璃工房運河店」は小樽商人が残した建物で、現在は店舗として活用されています。かつてこの商人は小樽で最初の新聞を発行しました。その新聞名を書きなさい。", "choices": [], "a": "北門新報", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q032", "exam": 23, "no": 32, "sub": "", "type": "選択", "q": "小樽で活躍した商人のなかで、商工会議所（商業会議所も含む）の会頭になっていないのは次のどれでしょうか。", "choices": ["倉橋大介", "藤山要吉", "磯野進", "木村円吉（6代目）"], "a": "1", "abody": "倉橋大介", "photos": [], "note": ""}, {"id": "R23-Q033", "exam": 23, "no": 33, "sub": "", "type": "記述", "q": "小樽港は海上輸送網の拠点として位置づけられている港で、国際または国内海上輸送網の拠点となる港湾とされています。国の利害に重大な関係がある港湾で、港湾法に基づいて政令で定められています。このような港湾を何というでしょうか。", "choices": [], "a": "重要港湾", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q034", "exam": 23, "no": 34, "sub": "", "type": "選択", "q": "明治13(1880)年、当時の大型の船が接岸できる桟橋が手宮に建設されました。この桟橋の長さは次のどれでしょうか。", "choices": ["約130m", "約230m", "約330m", "約430m"], "a": "4", "abody": "約430m", "photos": [], "note": ""}, {"id": "R23-Q035", "exam": 23, "no": 35, "sub": "", "type": "記述", "q": "明治22(1889)年、小樽港は米、麦、麦粉、石炭、硫黄の5品目に限り、日本船または日本人雇用の外国船により輸出できる港となりました。このような港のことを何というでしょうか。", "choices": [], "a": "特別輸出港", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q036", "exam": 23, "no": 36, "sub": "", "type": "選択", "q": "小樽港の整備は、明治25(1892)年、第4代北海道庁長官が、小樽に近代的な港湾建設をと国に意見書を提出したことで、試験工事を経て本格的な工事が始まりました。本格的な小樽築港第一期工事が始まったのは次のどれでしょうか。", "choices": ["明治26(1893)年", "明治28(1895)年", "明治30(1897)年", "明治32(1899)年"], "a": "3", "abody": "明治30(1897)年", "photos": [], "note": ""}, {"id": "R23-Q037", "exam": 23, "no": 37, "sub": "", "type": "選択", "q": "小樽築港第一期工事で北防波堤が完成しました。完成まで要した年数は次のどれでしょうか。", "choices": ["7年", "9年", "11年", "13年"], "a": "3", "abody": "11年", "photos": [], "note": ""}, {"id": "R23-Q038", "exam": 23, "no": 38, "sub": "", "type": "選択", "q": "小樽港の工事に大きく貢献した廣井勇についての説明で正しいものはどれですか。", "choices": ["廣井勇はフランスに留学し橋梁設計を学び幌内鉄道建設にも関わった", "廣井勇は愛媛県出身で、伊藤長右衛門と同郷だった", "廣井勇は明治32(1899)年から東京帝国大学教授も兼任し、後進を育成した", "廣井勇の札幌農学校時代の同期生は、後に北海道帝国大学初代総長になった佐藤昌介"], "a": "3", "abody": "廣井勇は明治32(1899)年から東京帝国大学教授も兼任し、後進を育成した", "photos": [], "note": ""}, {"id": "R23-Q039", "exam": 23, "no": 39, "sub": "", "type": "選択", "q": "小樽築港第一期工事の北防波堤の建設は、当時の土木技術の粋を集めて建設されました。以下の説明で正しいものはどれですか。", "choices": ["コンクリートブロックの長期にわたる耐久性が明らかでなかったので、日本古来からの治水技術を導入した伝統的な工事を行い完成させた", "日本の技術者だけでは近代的な防波堤を造ることができなかったので、お雇外国人のC.S.メークが用いた工事手法を導入して建設に成功した", "コンクリートを使った防波堤建設の失敗などが他の港で続いたので、全て石の斜め積みによる防波堤を建設した", "廣井勇が初代の築港所長となり、様々な調査や実験を経て、日本で初めてのコンクリートを用いた外洋防波堤の建設に成功した"], "a": "4", "abody": "廣井勇が初代の築港所長となり、様々な調査や実験を経て、日本で初めてのコンクリートを用いた外洋防波堤の建設に成功した", "photos": [], "note": ""}, {"id": "R23-Q040", "exam": 23, "no": 40, "sub": "", "type": "選択", "q": "北海道の鉄道建設に関わった人物とその主な役割の組み合わせで間違っているのはどれでしょうか。", "choices": ["榎本武揚……開拓使物産取調掛", "黒田清隆……第2代開拓長官", "ライマン……地質学者", "クロフォード……鉄道技師長"], "a": "2", "abody": "黒田清隆……第2代開拓長官", "photos": [], "note": ""}, {"id": "R23-Q041", "exam": 23, "no": 41, "sub": "", "type": "記述", "q": "神居古潭の道路開削と短距離の鉄道建設にあたって開拓使が招聘した技師がクロフォードでした。ただ、招聘された段階では幌内炭田から石炭搬出経路開発の主人公となる人物が他にいました。その人物とはだれでしょうか。", "choices": [], "a": "ゲント", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q042", "exam": 23, "no": 42, "sub": "", "type": "選択", "q": "明治12(1879)年、開拓使は札樽間の道路建設を命じます。クロフォードはこの工事をどのくらいの期間で完成させたでしょうか。", "choices": ["5ヶ月", "7ヶ月", "11ヶ月", "1年"], "a": "1", "abody": "5ヶ月", "photos": [], "note": ""}, {"id": "R23-Q043", "exam": 23, "no": 43, "sub": "", "type": "選択", "q": "小樽、幌内間の鉄道敷設のルート決定をうけ、本格的な鉄道工事は若竹第三トンネルの開削から始まりました。この工事を指揮したのは次の誰でしょうか。", "choices": ["平井晴二郎", "松本荘一郎", "広井勇", "ペリー"], "a": "2", "abody": "松本荘一郎", "photos": [], "note": ""}, {"id": "R23-Q044", "exam": 23, "no": 44, "sub": "", "type": "選択", "q": "北海道鉄道の工事は明治34(1901)年、大沼幅下トンネルと忍路トンネルの開削から始まりました。北海道鉄道が全線開通したのは次のどれでしょうか。", "choices": ["明治34(1901)年", "明治35(1902)年", "明治36(1903)年", "明治37(1904)年"], "a": "4", "abody": "明治37(1904)年", "photos": [], "note": ""}, {"id": "R23-Q045", "exam": 23, "no": 45, "sub": "", "type": "選択", "q": "幌内鉄道の手宮〜札幌間の開通時には4つの駅しかありませんでした。正しいのは次のどれでしょうか。", "choices": ["手宮〜開運町〜朝里〜札幌", "手宮〜朝里〜軽川〜札幌", "手宮〜朝里〜銭函〜札幌", "手宮〜開運町〜銭函〜札幌"], "a": "4", "abody": "手宮〜開運町〜銭函〜札幌", "photos": [], "note": "選択肢3・4の駅名はOCRで「録画」と誤読、「銭函」と判断"}, {"id": "R23-Q046", "exam": 23, "no": 46, "sub": "", "type": "選択", "q": "幌内鉄道に導入された蒸気機関車は6号まで「和名」がつけられていました。次の4つの中で正しいのはどれでしょうか。", "choices": ["1号「義経」2号「弁慶」3号「比羅夫」", "1号「義経」2号「しづか」3号「弁慶」", "1号「弁慶」2号「義経」6号「しづか」", "1号「弁慶」2号「義経」4号「比羅夫」"], "a": "1", "abody": "1号「義経」2号「弁慶」3号「比羅夫」", "photos": [], "note": ""}, {"id": "R23-Q047", "exam": 23, "no": 47, "sub": "", "type": "記述", "q": "現在のJR小樽駅のホームやコンコース、通路には北一硝子さんが寄贈したランプが設置されています。その数は何個でしょうか。（文化庁：日本遺産ポータルサイトより）", "choices": [], "a": "333個", "abody": "", "photos": [], "note": ""}, {"id": "R23-Q048" ": "この建物は明治42(1909)年に着工し、完成したのは明治44(1911)年だ", "photos": [], "note": ""}, {"id": "R23-Q090", "exam": 23, "no": 90, "sub": "", "type": "選択", "q": "次の小樽市内の文化財と指定区分の組み合わせが正しいのはどれでしょうか。", "choices": ["西川家文書……道指定有形文化財", "旧青山家別邸……国登録有形文化財", "高島越後盆踊りの行事……道指定無形民俗文化財", "向井流水泳……道指定無形文化財"], "a": "2", "abody": "旧青山家別邸……国登録有形文化財", "photos": [], "note": ""}, {"id": "R23-Q091", "exam": 23, "no": 91, "sub": "", "type": "選択", "q": "道指定有形文化財の木造五百羅漢像のあるお寺の名前は次のどれでしょうか。", "choices": ["龍徳寺", "正法寺", "浅草観音寺", "宗園寺"], "a": "4", "abody": "宗園寺", "photos": [], "note": ""}, {"id": "R23-Q092", "exam": 23, "no": 92, "sub": "", "type": "選択", "q": "観光ガイドとして、お客様をご案内するとき、相手を尊重する心のあり方として一番気を付けたいのは次のどれでしょうか。", "choices": ["相手の立場や時間の都合を考える", "事前に用意した話はすべて話す", "必ず買い物の時間を入れる", "絶対に方言は使わない"], "a": "1", "abody": "相手の立場や時間の都合を考える", "photos": [], "note": ""}, {"id": "R23-Q093-A", "exam": 23, "no": 93, "sub": "A", "type": "選択", "q": "（ ）内に該当する一番適切な語句を記入しなさい。ガイドを依頼された時、事前に準備しておかなければならない一番大事なことは（A）です。またガイド中で大事なことは（B）を心がけることです。心のこもった笑顔と、ちょっとした気遣いは、お客様に対して、最大の（C）となります。【A】", "choices": ["お客様の職業を知ること", "自分が目立つ服装を考える", "お土産店を調べておくこと", "行程を事前にシミュレーションしてみる"], "a": "4", "abody": "行程を事前にシミュレーションしてみる", "photos": [], "note": ""}, {"id": "R23-Q093-B", "exam": 23, "no": 93, "sub": "B", "type": "選択", "q": "（ ）内に該当する一番適切な語句を記入しなさい。ガイドを依頼された時、事前に準備しておかなければならない一番大事なことは（A）です。またガイド中で大事なことは（B）を心がけることです。心のこもった笑顔と、ちょっとした気遣いは、お客様に対して、最大の（C）となります。【B】", "choices": ["覚えたことを最後まで話すこと", "建物の建築年を間違えないこと", "冗談を言うこと", "気さくな声がけで状況を判断すること"], "a": "4", "abody": "気さくな声がけで状況を判断すること", "photos": [], "note": ""}, {"id": "R23-Q093-C", "exam": 23, "no": 93, "sub": "C", "type": "選択", "q": "（ ）内に該当する一番適切な語句を記入しなさい。ガイドを依頼された時、事前に準備しておかなければならない一番大事なことは（A）です。またガイド中で大事なことは（B）を心がけることです。心のこもった笑顔と、ちょっとした気遣いは、お客様に対して、最大の（C）となります。【C】", "choices": ["おみやげ", "おもてなし", "贈り物", "思い出づくり"], "a": "2", "abody": "おもてなし", "photos": [], "note": ""}];</script>
<script>
const $ = (s, r=document) => r.querySelector(s);
const KEY = 'otaru-study-v1';
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩';

let store = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const rec = id => store[id] || (store[id] = {seen:0, ok:0, ng:0, box:0});

let mode = 'weak';       // weak | all | unseen | exam
let examFilter = null;
let current = null, answered = false;

/* 出題の重み付け。間違えた問題と未挑戦を優先し、
   正解を重ねた問題は間隔を空ける（簡易的な間隔反復）。 */
function weight(q) {
  const r = store[q.id];
  if (!r || r.seen === 0) return 6;
  if (r.box <= 0) return 10;
  return Math.max(1, 8 - r.box * 2);
}

function pool() {
  let qs = QUESTIONS;
  if (mode === 'exam' && examFilter) qs = qs.filter(q => q.exam === examFilter);
  if (mode === 'unseen') qs = qs.filter(q => !store[q.id] || store[q.id].seen === 0);
  if (mode === 'weak') qs = qs.filter(q => { const r = store[q.id];
    return !r || r.seen === 0 || r.box <= 0; });
  return qs.length ? qs : (mode === 'exam' && examFilter
    ? QUESTIONS.filter(q => q.exam === examFilter) : QUESTIONS);
}

function pick() {
  const qs = pool();
  const total = qs.reduce((s, q) => s + weight(q), 0);
  let t = Math.random() * total;
  for (const q of qs) { t -= weight(q); if (t <= 0) return q; }
  return qs[qs.length - 1];
}

function mark(ok) {
  const r = rec(current.id);
  r.seen++;
  if (ok) { r.ok++; r.box = Math.min(5, r.box + 1); }
  else { r.ng++; r.box = 0; }
  save();
  renderStats();
}

function render() {
  answered = false;
  current = pick();
  const q = current;
  const sub = q.sub ? q.sub : '';
  /* 写真そのものが選択肢の設問は、写真をクリックして選ぶ。
     テキストの「［写真1］」は重複するので出さない。 */
  const pickPhotos = q.type === '写真選択' && q.photos.length;
  const photos = q.photos.length
    ? `<div class="photos">${q.photos.map((p, i) => pickPhotos
        ? `<button class="pick choice" data-i="${i+1}">
             <img src="${p}" alt="選択肢${i+1}" loading="lazy">
             <figcaption>${CIRC[i]} 選択肢${i+1}</figcaption></button>`
        : `<figure class="pick"><img src="${p}" alt="" loading="lazy"></figure>`
      ).join('')}</div>`
    : '';

  const body = pickPhotos ? ''
    : q.choices.length
    ? `<div class="choices">${q.choices.map((c, i) =>
        `<button class="choice" data-i="${i+1}">
           <span class="n">${CIRC[i]}</span><span>${c}</span></button>`).join('')}</div>`
    : `<textarea id="mine" placeholder="答えを入力してください"></textarea>
       <div class="selfmark"><button id="submit">回答する</button></div>`;

  $('#quiz').innerHTML = `
    <div class="card">
      <span class="chip">第${q.exam}回 問${q.no}${sub}・${q.type}</span>
      <p class="qtext">${q.q}</p>
      ${photos}${body}
      <div id="reveal"></div>
    </div>`;

  $('#quiz').querySelectorAll('.choice').forEach(b =>
    b.onclick = () => choose(Number(b.dataset.i)));
  const s = $('#submit'); if (s) s.onclick = submitFree;
}

function choose(i) {
  if (answered) return;
  answered = true;
  const q = current, ok = String(i) === String(q.a);
  $('#quiz').querySelectorAll('.choice').forEach(b => {
    const n = Number(b.dataset.i);
    if (String(n) === String(q.a)) b.classList.add('ok');
    else if (n === i) b.classList.add('ng');
  });
  mark(ok);
  $('#reveal').innerHTML = `<div class="reveal">
    ${ok ? '<b>正解</b>' : '<span style="color:var(--ng);font-weight:700">不正解</span>'}
    　正解は <b>${CIRC[Number(q.a)-1] || q.a}</b>
    ${q.abody ? ' ' + q.abody : ''}
    ${q.note ? `<div class="note">${q.note}</div>` : ''}
    <div class="selfmark"><button id="next">次の問題 →</button></div></div>`;
  $('#next').onclick = render;
}

/* 記述式は自分では採点しない。回答を採点待ちに積み、
   まとめてClaudeに判定してもらう。 */
function submitFree() {
  if (answered) return;
  answered = true;
  const q = current;
  const mine = ($('#mine').value || '').trim();
  pending.push({id:q.id, exam:q.exam, no:q.no, sub:q.sub, q:q.q, mine, correct:q.a});
  savePending();
  renderPending();
  $('#reveal').innerHTML = `<div class="reveal">
    <div class="cmp">
      <div><span class="k">あなたの回答</span>${mine || '（未記入）'}</div>
      <div><span class="k">模範解答</span><b>${q.a}</b></div>
    </div>
    採点待ちに追加しました。上の「採点をClaudeに依頼」からまとめて判定できます。
    ${q.note ? `<div class="note">${q.note}</div>` : ''}
    <div class="selfmark"><button id="next">次の問題 →</button></div></div>`;
  $('#next').onclick = render;
}

/* ---- 採点待ちの管理 ---- */
const PKEY = 'otaru-pending-v1';
let pending = JSON.parse(localStorage.getItem(PKEY) || '[]');
const savePending = () => localStorage.setItem(PKEY, JSON.stringify(pending));

function requestText() {
  const lines = ['以下の記述式問題を採点してください。私の回答と模範解答を比べて、',
    '各問に ○ か × と、必要なら一言の解説をお願いします。', ''];
  pending.forEach((p, i) => {
    lines.push(`【${i+1}】第${p.exam}回 問${p.no}${p.sub||''}`);
    lines.push(`問題: ${p.q}`);
    lines.push(`私の回答: ${p.mine || '（未記入）'}`);
    lines.push(`模範解答: ${p.correct}`);
    lines.push('');
  });
  return lines.join('\n');
}

function renderPending() {
  const box = $('#pending');
  if (!pending.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="pend">
    <h2>採点待ち ${pending.length}件</h2>
    <ul>${pending.map((p, i) => `<li>
      <span>第${p.exam}回 問${p.no}${p.sub||''}　${p.mine || '（未記入）'}</span>
      <button data-ok="${i}">○</button><button data-ng="${i}">×</button>
    </li>`).join('')}</ul>
    <button id="copy">採点をClaudeに依頼（コピー）</button>
    <button id="clearp">まとめて破棄</button>
    <div class="note">コピーしてチャットに貼り、返ってきた判定を ○ / × で記録してください。</div>
  </div>`;
  box.querySelectorAll('[data-ok]').forEach(b =>
    b.onclick = () => resolvePending(Number(b.dataset.ok), true));
  box.querySelectorAll('[data-ng]').forEach(b =>
    b.onclick = () => resolvePending(Number(b.dataset.ng), false));
  $('#copy').onclick = async () => {
    const txt = requestText();
    try { await navigator.clipboard.writeText(txt); $('#copy').textContent = 'コピーしました'; }
    catch { prompt('以下をコピーしてください', txt); }
    setTimeout(() => { const c = $('#copy'); if (c) c.textContent = '採点をClaudeに依頼（コピー）'; }, 1800);
  };
  $('#clearp').onclick = () => {
    if (!confirm(`採点待ち${pending.length}件を破棄します。よろしいですか。`)) return;
    pending = []; savePending(); renderPending();
  };
}

function resolvePending(i, ok) {
  const p = pending[i];
  const r = rec(p.id);
  r.seen++;
  if (ok) { r.ok++; r.box = Math.min(5, r.box + 1); } else { r.ng++; r.box = 0; }
  save();
  pending.splice(i, 1); savePending();
  renderPending(); renderStats();
}

function renderStats() {
  const ids = Object.keys(store);
  const seen = ids.filter(k => store[k].seen > 0).length;
  const ok = ids.reduce((s, k) => s + store[k].ok, 0);
  const ng = ids.reduce((s, k) => s + store[k].ng, 0);
  const rate = ok + ng ? Math.round(ok / (ok + ng) * 100) : 0;
  const weak = ids.filter(k => store[k].seen > 0 && store[k].box <= 0).length;
  $('#stats').innerHTML = `
    <div class="stat"><div class="v">${seen}<small style="font-size:.8rem;color:var(--muted)">/${QUESTIONS.length}</small></div><div class="k">着手した問題</div></div>
    <div class="stat"><div class="v">${rate}%</div><div class="k">正答率（延べ${ok+ng}回）</div></div>
    <div class="stat"><div class="v">${weak}</div><div class="k">要復習</div></div>`;
}

function renderExamButtons() {
  const exams = [...new Set(QUESTIONS.map(q => q.exam))].sort((a,b) => a-b);
  $('#exams').innerHTML = exams.map(n =>
    `<button data-exam="${n}">第${n}回</button>`).join('');
  $('#exams').querySelectorAll('button').forEach(b => b.onclick = () => {
    mode = 'exam'; examFilter = Number(b.dataset.exam);
    setMode(); render();
  });
}

function setMode() {
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  document.querySelectorAll('[data-exam]').forEach(b =>
    b.classList.toggle('on', mode === 'exam' && Number(b.dataset.exam) === examFilter));
}

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; examFilter = null; setMode(); render();
});

$('#reset').onclick = () => {
  if (!confirm('学習記録をすべて消します。よろしいですか。')) return;
  store = {}; save(); renderStats(); render();
};

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '4') {
    const b = $(`.choice[data-i="${e.key}"]`); if (b) b.click();
  } else if (e.key === 'Enter' || e.key === ' ') {
    const n = $('#next') || $('#show'); if (n) { e.preventDefault(); n.click(); }
  }
});

renderExamButtons(); setMode(); renderStats(); renderPending(); render();
</script>
</body></html>
